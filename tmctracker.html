<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>TMC Mechanical — Job Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0e0f0c;
    --panel: #16180f;
    --panel-2: #1c1f14;
    --line: #2c3020;
    --olive: #6b7338;
    --olive-bright: #93a046;
    --brass: #b8923f;
    --brass-bright: #d9af52;
    --text: #e8e6dd;
    --muted: #8a8c7e;
    --danger: #b5432f;
    --green: #5d8a3a;
  }
  html, body { background: var(--bg); color: var(--text); font-family: 'Barlow Semi Condensed', sans-serif; overscroll-behavior: none; }
  body {
    background-image:
      radial-gradient(circle at 20% 0%, rgba(107,115,56,0.08), transparent 40%),
      radial-gradient(circle at 90% 100%, rgba(184,146,63,0.06), transparent 45%);
    background-attachment: fixed;
    min-height: 100vh;
  }
  #root { max-width: 520px; margin: 0 auto; min-height: 100vh; }
  .mono { font-family: 'Share Tech Mono', monospace; }
  .head { font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 0.04em; }
  button { font-family: 'Barlow Semi Condensed', sans-serif; cursor: pointer; border: none; background: none; color: inherit; }
  input, select, textarea {
    font-family: 'Barlow Semi Condensed', sans-serif; font-size: 16px;
    background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 12px; width: 100%; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--olive-bright); }
  ::-webkit-scrollbar { width: 0; }
  .fade-in { animation: fade 0.25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

/* ── Supabase ──────────────────────────────────────────────────────────────── */
const SUPABASE_URL = 'https://asiviwwstglniuhsryze.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFzaXZpd3dzdGdsbml1aHNyeXplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwMDkzOTcsImV4cCI6MjA5NTU4NTM5N30.Eo_waRUbNxdq3xEfEd7AxCAEnVc4VobaV8N5ZPyGi0o';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ── Storage keys ──────────────────────────────────────────────────────────── */
const STORAGE_KEY       = "tmc_jobs_v1";
const CHORES_KEY        = "tmc_chores_v1";
const SAMEADDR_PREF_KEY = "tmc_sameaddr_pref";
const CURRENT_USER_KEY  = "tmc_current_user";

/* ── Status / type lists ───────────────────────────────────────────────────── */
const STATUSES = [
  "New","Evaluation Needed","Write Estimate","Waiting on Approval",
  "Scheduled","En Route","On Site","In Progress","On Hold",
  "Completed/Needs Billing","Completed/Paid","Closed",
];
const STATUS_COLOR = {
  "New":"#d9af52","Evaluation Needed":"#8a8c7e","Write Estimate":"#b8923f",
  "Waiting on Approval":"#c98a3f","Scheduled":"#6b7338","En Route":"#d9af52",
  "On Site":"#93a046","In Progress":"#93a046","On Hold":"#b5432f",
  "Completed/Needs Billing":"#d9af52","Completed/Paid":"#5d8a3a","Closed":"#8a8c7e",
};
const JOB_TYPES = ["Service Call","New Install","Maintenance","Replacement","Warranty","Estimate"];

/* ── Utilities ─────────────────────────────────────────────────────────────── */
function todayISO() { return new Date().toISOString().split("T")[0]; }
function siteAddr(j) { return j.site_address || j.address || ""; }
function custAddr(j) { return j.customer_address || j.address || ""; }
function uid() { return "job_" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function money(n) { return "$" + Number(n||0).toLocaleString("en-US"); }
function fmtDate(iso) {
  if (!iso) return "—";
  const [y,m,d] = iso.split("-");
  return `${m}/${d}/${y.slice(2)}`;
}
function fmtTime(t) {
  if (!t) return "—";
  let [h,mn] = t.split(":").map(Number);
  const ap = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return `${h}:${String(mn).padStart(2,"0")} ${ap}`;
}
function deriveCustomers(jobs) {
  const map = {};
  jobs.forEach(j => {
    const name = (j.customer||"").trim();
    if (!name) return;
    if (!map[name]) map[name] = { customer_address:"", phone:"", sites:[] };
    const rec = map[name];
    if (!rec.customer_address && custAddr(j)) rec.customer_address = custAddr(j);
    if (!rec.phone && j.phone) rec.phone = j.phone;
    const site = siteAddr(j).trim();
    if (site && site !== custAddr(j).trim()) {
      const exists = rec.sites.some(s => s.site_address === site);
      if (!exists) rec.sites.push({ site_address: site });
    }
  });
  return map;
}
function loadSameAddrPref() {
  try { const r = localStorage.getItem(SAMEADDR_PREF_KEY); if (r !== null) return r === "true"; } catch(e){}
  return true;
}
function saveSameAddrPref(val) {
  try { localStorage.setItem(SAMEADDR_PREF_KEY, String(val)); } catch(e){}
}

/* ── Supabase mapping ──────────────────────────────────────────────────────── */
function fromRow(row, notes=[]) {
  const c = row.customers || {};
  const addrParts = [c.address, c.city, c.state].filter(Boolean);
  const addr = addrParts.join(', ') + (c.zip ? ' ' + c.zip : '');
  const scheduledAt = row.scheduled_at || '';
  return {
    id: row.id,
    customer: c.name || '',
    location: '',
    customer_address: addr,
    site_address: addr,
    same_address: true,
    phone: c.phone || '',
    type: row.flow_type || 'Service Call',
    status: row.current_status || 'New',
    scheduled_date: scheduledAt ? scheduledAt.slice(0,10) : todayISO(),
    scheduled_time: scheduledAt ? scheduledAt.slice(11,16) : '09:00',
    value: Number(row.value) || 0,
    notes: row.notes || '',
    history: notes.filter(n => n.source !== 'system').map(n => ({
      date: (n.created_at||'').slice(0,10),
      note: n.content,
    })),
    _customer_id: row.customer_id,
    _assigned_to: row.assigned_to,
  };
}

function toRow(job, customerId, userId) {
  let scheduled_at = null;
  if (job.scheduled_date && job.scheduled_time) {
    const d = new Date(`${job.scheduled_date}T${job.scheduled_time}:00`);
    if (!isNaN(d)) scheduled_at = d.toISOString();
  }
  return {
    customer_id: customerId || job._customer_id,
    assigned_to: userId || job._assigned_to || null,
    flow_type: job.type,
    current_status: job.status,
    value: Number(job.value) || null,
    scheduled_at,
    notes: job.notes || null,
    updated_at: new Date().toISOString(),
  };
}

/* ── Supabase data fetchers ────────────────────────────────────────────────── */
async function resolveCustomer(job) {
  const name = (job.customer||'').trim();
  if (!name) return null;
  const { data: existing } = await sb.from('customers')
    .select('id').ilike('name', name).limit(1).maybeSingle();
  if (existing) return existing.id;
  const { data: created, error } = await sb.from('customers').insert({
    name, phone: job.phone||null, address: job.customer_address||null,
    created_at: new Date().toISOString(), updated_at: new Date().toISOString(),
  }).select('id').single();
  if (error) { console.error('resolveCustomer failed', error); return null; }
  return created.id;
}

async function fetchJobs() {
  const { data: rows, error } = await sb.from('jobs')
    .select('*, customers(*)')
    .order('scheduled_at', { ascending: true, nullsFirst: false });
  if (error) { console.warn('fetchJobs error', error); return null; }
  if (!rows || rows.length === 0) return [];
  const jobIds = rows.map(r => r.id);
  const { data: notes } = await sb.from('job_notes')
    .select('*').in('job_id', jobIds).order('created_at');
  const notesByJob = {};
  (notes||[]).forEach(n => { (notesByJob[n.job_id] = notesByJob[n.job_id]||[]).push(n); });
  return rows.map(r => fromRow(r, notesByJob[r.id]||[]));
}

async function fetchChores() {
  const { data, error } = await sb.from('chores')
    .select('*').neq('status','done').order('created_at', { ascending: false });
  if (error) { console.warn('fetchChores error', error); return []; }
  return (data||[]).map(c => ({
    id: c.id, kind: c.priority||'billing', job_id: c.job_id,
    label: c.description||'', created: (c.created_at||'').slice(0,10)||todayISO(), done: false,
  }));
}

async function fetchUsers() {
  const { data, error } = await sb.from('users').select('*');
  if (error) { console.warn('fetchUsers error', error); return []; }
  return (data||[]).map(u => ({
    id: u.id,
    name: u.name || u.display_name || u.full_name || u.email || 'Tech',
  }));
}

/* ── Components ────────────────────────────────────────────────────────────── */
function StatusPill({ status }) {
  const c = STATUS_COLOR[status] || "#8a8c7e";
  return (
    <span className="head" style={{
      fontSize:11, fontWeight:600, padding:"4px 9px", borderRadius:5,
      border:`1px solid ${c}`, color:c, background:c+"18", whiteSpace:"nowrap",
    }}>{status}</span>
  );
}

function Toast({ msg, isError }) {
  return (
    <div style={{
      position:"fixed", bottom:90, left:"50%", transform:"translateX(-50%)",
      background: isError ? "#5c1a0f" : "var(--panel-2)",
      border:`1px solid ${isError ? "var(--danger)" : "var(--olive)"}`,
      color:"var(--text)", padding:"10px 18px", borderRadius:8,
      fontSize:14, zIndex:200, whiteSpace:"nowrap", maxWidth:"90vw",
      boxShadow:"0 4px 20px rgba(0,0,0,0.5)",
    }}>{msg}</div>
  );
}

function Splash({ onSelect }) {
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState(null);
  useEffect(() => {
    fetchUsers().then(u => {
      setLoading(false);
      if (u.length === 0) setErr("No users found. Add rows to the users table in Supabase, then reload.");
      else setUsers(u);
    });
  }, []);
  return (
    <div className="fade-in" style={{ minHeight:"100vh", display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:32 }}>
      <div className="head" style={{ fontSize:28, fontWeight:700, lineHeight:1 }}>
        TMC <span style={{ color:"var(--brass-bright)" }}>MECHANICAL</span>
      </div>
      <div className="mono" style={{ fontSize:12, color:"var(--muted)", marginTop:8, letterSpacing:"0.1em" }}>FIELD JOB TRACKER</div>
      <div className="head" style={{ fontSize:16, color:"var(--muted)", marginTop:40, marginBottom:20 }}>WHO'S THIS?</div>
      {loading && <div className="mono" style={{ color:"var(--muted)", fontSize:13 }}>LOADING…</div>}
      {err && <div style={{ color:"var(--danger)", fontSize:14, textAlign:"center", maxWidth:320 }}>{err}</div>}
      {users.map(u => (
        <button key={u.id} onClick={() => onSelect(u)} className="head"
          style={{ width:"100%", maxWidth:320, marginBottom:12, padding:"18px 24px", borderRadius:10,
            fontSize:20, fontWeight:700, background:"var(--panel)", border:"1px solid var(--olive)", color:"var(--text)" }}>
          {u.name}
        </button>
      ))}
    </div>
  );
}

/* ── App ───────────────────────────────────────────────────────────────────── */
function App() {
  const [currentUser, setCurrentUser] = useState(() => {
    try { return JSON.parse(localStorage.getItem(CURRENT_USER_KEY)); } catch { return null; }
  });
  const [jobs, setJobs] = useState(() => {
    try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : []; } catch { return []; }
  });
  const [chores, setChores] = useState([]);
  const [loading, setLoading] = useState(true);
  const [rlsWarning, setRlsWarning] = useState(false);
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);

  const [selectedId, setSelectedId] = useState(null);
  const [adding, setAdding] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [filter, setFilter] = useState("All");
  const [search, setSearch] = useState("");
  const [searchClosed, setSearchClosed] = useState(false);
  const [choresExpanded, setChoresExpanded] = useState(false);

  function showToast(msg, isError=false) {
    if (toastTimer.current) clearTimeout(toastTimer.current);
    setToast({ msg, isError });
    toastTimer.current = setTimeout(() => setToast(null), 3000);
  }

  function selectUser(user) {
    localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(user));
    setCurrentUser(user);
  }
  function switchUser() {
    localStorage.removeItem(CURRENT_USER_KEY);
    setCurrentUser(null);
  }

  const refresh = useCallback(async () => {
    const [jobData, choreData] = await Promise.all([fetchJobs(), fetchChores()]);
    if (jobData === null) {
      showToast("Can't reach Supabase — showing cached data", true);
    } else {
      setRlsWarning(jobData.length === 0);
      setJobs(jobData);
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(jobData)); } catch(e){}
    }
    setChores(choreData);
    setLoading(false);
  }, []);

  useEffect(() => {
    if (!currentUser) return;
    refresh();
    window.addEventListener('focus', refresh);
    return () => window.removeEventListener('focus', refresh);
  }, [currentUser, refresh]);

  /* ── CRUD ── */
  async function addJob(job) {
    const customerId = await resolveCustomer(job);
    if (!customerId) { showToast("Could not resolve customer", true); return; }
    const { data, error } = await sb.from('jobs').insert({
      ...toRow(job, customerId, currentUser?.id),
      created_at: new Date().toISOString(),
    }).select('*, customers(*)').single();
    if (error) { showToast("Error saving job", true); console.error(error); return; }
    await sb.from('job_notes').insert({
      job_id: data.id, content: `Job created. Status: ${job.status}`,
      source: 'system', created_at: new Date().toISOString(),
    });
    const newJob = fromRow(data);
    setJobs(js => [newJob, ...js]);
    setAdding(false);
    setSelectedId(data.id);
    showToast("Job saved");
    if (job.status === "Completed/Needs Billing") spawnBillingChore(newJob);
  }

  async function updateJob(id, patch) {
    const job = jobs.find(j => j.id === id);
    if (!job) return;
    const updateData = { updated_at: new Date().toISOString() };
    if ('status' in patch)        updateData.current_status = patch.status;
    if ('type' in patch)          updateData.flow_type = patch.type;
    if ('notes' in patch)         updateData.notes = patch.notes||null;
    if ('value' in patch)         updateData.value = Number(patch.value)||null;
    if ('scheduled_date' in patch || 'scheduled_time' in patch) {
      const d = ('scheduled_date' in patch ? patch.scheduled_date : job.scheduled_date);
      const t = ('scheduled_time' in patch ? patch.scheduled_time : job.scheduled_time);
      if (d && t) { const dt = new Date(`${d}T${t}:00`); updateData.scheduled_at = isNaN(dt) ? null : dt.toISOString(); }
    }
    const { error } = await sb.from('jobs').update(updateData).eq('id', id);
    if (error) { showToast("Error updating job", true); console.error(error); return; }
    if (patch.status && patch.status !== job.status) {
      await sb.from('job_notes').insert({
        job_id: id, content: `Status → ${patch.status}`,
        source: 'system', created_at: new Date().toISOString(),
      });
      if (patch.status === "Completed/Needs Billing") spawnBillingChore({ ...job, ...patch });
    }
    setJobs(js => js.map(j => j.id === id ? { ...j, ...patch } : j));
  }

  async function saveEdit(edited) {
    const customerId = await resolveCustomer(edited);
    if (!customerId) { showToast("Could not resolve customer", true); return; }
    const { error } = await sb.from('jobs').update(toRow(edited, customerId, currentUser?.id)).eq('id', edited.id);
    if (error) { showToast("Error saving changes", true); console.error(error); return; }
    setJobs(js => js.map(j => j.id === edited.id ? { ...j, ...edited, _customer_id: customerId } : j));
    setEditingId(null);
    showToast("Changes saved");
    if (edited.status === "Completed/Needs Billing") spawnBillingChore({ ...edited, _customer_id: customerId });
  }

  async function deleteJob(id) {
    const { error } = await sb.from('jobs').delete().eq('id', id);
    if (error) { showToast("Error deleting job", true); console.error(error); return; }
    setJobs(js => js.filter(j => j.id !== id));
    setChores(cs => cs.filter(c => c.job_id !== id));
    setSelectedId(null);
    showToast("Job deleted");
  }

  async function toggleChore(choreId) {
    const { error } = await sb.from('chores')
      .update({ status:'done', updated_at: new Date().toISOString() }).eq('id', choreId);
    if (error) { showToast("Error completing chore", true); return; }
    setChores(cs => cs.filter(c => c.id !== choreId));
  }

  async function spawnBillingChore(job) {
    if (chores.some(c => c.job_id === job.id && c.kind === 'billing')) return;
    const { data, error } = await sb.from('chores').insert({
      description: `Create bill for ${job.customer}`,
      job_id: job.id, customer_id: job._customer_id||null,
      priority: 'billing', status: 'open',
      created_at: new Date().toISOString(), updated_at: new Date().toISOString(),
    }).select().single();
    if (!error && data) {
      setChores(cs => [{
        id: data.id, kind:'billing', job_id: job.id,
        label: `Create bill for ${job.customer}`, created: todayISO(), done: false,
      }, ...cs]);
    }
  }

  function fixOldStatuses() {
    const MAP = {
      "Needs Billing":"Completed/Needs Billing","Paid":"Completed/Paid",
      "Completed":"Completed/Needs Billing","Estimate Scheduled":"Evaluation Needed",
      "Estimate Given":"Waiting on Approval",
    };
    let changed = 0;
    const next = jobs.map(j => { if (MAP[j.status]) { changed++; return {...j,status:MAP[j.status]}; } return j; });
    setJobs(next);
    Promise.all(next.filter((_,i) => MAP[jobs[i]?.status]).map(j =>
      sb.from('jobs').update({ current_status:j.status }).eq('id',j.id)
    )).then(() => setTimeout(() => alert(changed > 0 ? `Updated ${changed} job(s).` : "No old statuses found."), 50));
  }

  function exportJobs() {
    const payload = { jobs, chores, exported: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(payload,null,2)], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `tmc-jobs-${todayISO()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  /* ── Render ── */
  if (!currentUser) return <Splash onSelect={selectUser} />;

  const selected = jobs.find(j => j.id === selectedId);
  if (adding) return (
    <React.Fragment>
      <JobForm onSave={addJob} onCancel={() => setAdding(false)} allJobs={jobs} />
      {toast && <Toast msg={toast.msg} isError={toast.isError} />}
    </React.Fragment>
  );
  if (editingId) {
    const editJob = jobs.find(j => j.id === editingId);
    if (editJob) return (
      <React.Fragment>
        <JobForm initial={editJob} onSave={saveEdit} onCancel={() => setEditingId(null)} />
        {toast && <Toast msg={toast.msg} isError={toast.isError} />}
      </React.Fragment>
    );
  }
  if (selected) return (
    <React.Fragment>
      <JobDetail job={selected}
        onBack={() => setSelectedId(null)}
        onUpdate={(patch) => updateJob(selected.id, patch)}
        onEdit={() => setEditingId(selected.id)}
        onDelete={() => deleteJob(selected.id)} />
      {toast && <Toast msg={toast.msg} isError={toast.isError} />}
    </React.Fragment>
  );

  const isActive = s => s !== "Completed/Paid" && s !== "Closed";
  const usedStatuses = STATUSES.filter(s => jobs.some(j => j.status === s));
  const FILTERS = ["All", ...usedStatuses];
  const q = search.trim().toLowerCase();

  function matchesSearch(j) {
    if (!q) return true;
    if (j.status === "Closed" && !searchClosed) return false;
    const hay = [j.customer, j.phone, j.notes, custAddr(j), siteAddr(j), j.location]
      .filter(Boolean).join(" ").toLowerCase();
    return hay.includes(q);
  }

  const shown = q ? jobs.filter(matchesSearch) : jobs.filter(j => filter === "All" || j.status === filter);
  const outstanding = jobs.filter(j => isActive(j.status)).reduce((s,j) => s + Number(j.value||0), 0);

  return (
    <div className="fade-in">
      {/* Header */}
      <div style={{ padding:"18px 16px 14px", borderBottom:"1px solid var(--line)", background:"var(--panel)" }}>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
          <div>
            <div className="head" style={{ fontSize:22, fontWeight:700, lineHeight:1 }}>
              TMC <span style={{ color:"var(--brass-bright)" }}>MECHANICAL</span>
            </div>
            <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginTop:4, letterSpacing:"0.1em" }}>FIELD JOB TRACKER</div>
          </div>
          <div style={{ textAlign:"right" }}>
            <div className="mono" style={{ fontSize:10, color:"var(--muted)" }}>OUTSTANDING</div>
            <div className="head" style={{ fontSize:20, fontWeight:700, color:"var(--olive-bright)" }}>{money(outstanding)}</div>
          </div>
        </div>
        {/* User indicator */}
        <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:10 }}>
          <div className="mono" style={{ fontSize:11, color:"var(--muted)", letterSpacing:"0.08em" }}>LOGGED IN AS:</div>
          <div className="head" style={{ fontSize:13, fontWeight:600, color:"var(--olive-bright)" }}>{currentUser.name}</div>
          <button onClick={switchUser} className="mono"
            style={{ marginLeft:"auto", fontSize:11, color:"var(--muted)", padding:"3px 8px", border:"1px solid var(--line)", borderRadius:5 }}>
            SWITCH
          </button>
          <button onClick={refresh} className="mono"
            style={{ fontSize:11, color:"var(--muted)", padding:"3px 8px", border:"1px solid var(--line)", borderRadius:5 }}>
            ↺
          </button>
        </div>
      </div>

      {/* RLS warning */}
      {rlsWarning && !loading && (
        <div style={{ margin:"12px 16px 0", padding:"10px 14px", background:"#3a1a0a",
          border:"1px solid var(--danger)", borderRadius:8, fontSize:13, color:"var(--danger)" }}>
          ⚠ No jobs loaded. Check that RLS policies allow anon SELECT on <strong>jobs</strong> and <strong>customers</strong>.
        </div>
      )}

      {/* Loading */}
      {loading && (
        <div className="mono" style={{ textAlign:"center", color:"var(--muted)", padding:"40px 0", fontSize:13, letterSpacing:"0.1em" }}>
          LOADING…
        </div>
      )}

      {!loading && (
        <React.Fragment>
          {/* Search bar */}
          <div style={{ padding:"12px 16px 0", position:"relative" }}>
            <input type="text" value={search} onChange={e => setSearch(e.target.value)}
              placeholder="Search customers, addresses, sites, notes…"
              style={{ paddingLeft:38 }} />
            <span style={{ position:"absolute", left:28, top:22, fontSize:15, color:"var(--muted)", pointerEvents:"none" }}>🔍</span>
            {search && (
              <button onClick={() => setSearch("")}
                style={{ position:"absolute", right:26, top:18, fontSize:16, color:"var(--muted)", padding:4 }}>✕</button>
            )}
          </div>

          {/* Include-closed toggle — only while searching */}
          {q && (
            <button onClick={() => setSearchClosed(v => !v)} className="fade-in"
              style={{ display:"flex", alignItems:"center", gap:8, padding:"10px 16px 0", textAlign:"left" }}>
              <span style={{ width:38, height:22, borderRadius:11, flexShrink:0, position:"relative",
                background: searchClosed ? "var(--olive-bright)" : "var(--line)", transition:"background 0.15s" }}>
                <span style={{ position:"absolute", top:3, left: searchClosed ? 19 : 3,
                  width:16, height:16, borderRadius:"50%", background:"var(--bg)", transition:"left 0.15s" }}></span>
              </span>
              <span style={{ fontSize:13, color:"var(--muted)" }}>Include closed jobs</span>
            </button>
          )}
          {!q && (
            <div style={{ display:"flex", gap:8, padding:"12px 16px", overflowX:"auto" }}>
              {FILTERS.map(f => (
                <button key={f} onClick={() => setFilter(f)} className="head"
                  style={{ fontSize:13, fontWeight:600, padding:"7px 16px", borderRadius:6, flexShrink:0,
                    border:`1px solid ${filter===f ? "var(--olive-bright)" : "var(--line)"}`,
                    color: filter===f ? "var(--bg)" : "var(--muted)",
                    background: filter===f ? "var(--olive-bright)" : "transparent" }}>{f}</button>
              ))}
            </div>
          )}

          {/* Chores strip — collapsible */}
          {!q && chores.filter(c => !c.done).length > 0 && (
            <div style={{ margin:"4px 16px 0", background:"var(--panel-2)", border:"1px solid var(--brass)", borderRadius:10, overflow:"hidden" }}>
              <button onClick={() => setChoresExpanded(v => !v)}
                style={{ display:"flex", width:"100%", alignItems:"center", justifyContent:"space-between", padding:"12px 14px", textAlign:"left" }}>
                <span className="mono" style={{ fontSize:12, color:"var(--brass-bright)", letterSpacing:"0.08em" }}>
                  ⚑ {chores.filter(c=>!c.done).length} CHORE{chores.filter(c=>!c.done).length>1?"S":""}
                </span>
                <span style={{ color:"var(--brass)", fontSize:13 }}>{choresExpanded?"▲":"▼"}</span>
              </button>
              {choresExpanded && (
                <div className="fade-in" style={{ padding:"0 14px 10px" }}>
                  {chores.filter(c=>!c.done).map(c => (
                    <button key={c.id} onClick={() => toggleChore(c.id)}
                      style={{ display:"flex", width:"100%", alignItems:"center", gap:10, padding:"8px 0", textAlign:"left", borderTop:"1px solid var(--line)" }}>
                      <span style={{ width:18, height:18, borderRadius:4, border:"1.5px solid var(--brass)", flexShrink:0 }}></span>
                      <span style={{ fontSize:14 }}>{c.label}</span>
                    </button>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* Job list */}
          <div style={{ padding:"12px 16px 120px" }}>
            {shown.length === 0 && !rlsWarning && (
              <div style={{ textAlign:"center", color:"var(--muted)", padding:"40px 0" }} className="mono">
                {q ? `NO MATCHES FOR "${search.trim().toUpperCase()}"` : "NO JOBS HERE"}
              </div>
            )}
            {shown.map(j => (
              <button key={j.id} onClick={() => setSelectedId(j.id)} className="fade-in"
                style={{ display:"block", width:"100%", textAlign:"left", marginBottom:10,
                  background:"var(--panel)", border:"1px solid var(--line)",
                  borderLeft:`3px solid ${STATUS_COLOR[j.status]||"var(--line)"}`,
                  borderRadius:10, padding:14 }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:8 }}>
                  <div className="head" style={{ fontSize:17, fontWeight:600 }}>{j.customer}</div>
                  <StatusPill status={j.status} />
                </div>
                {(siteAddr(j)||custAddr(j)||j.location) ? (
                  <div className="head" style={{ fontSize:13, fontWeight:600, color:"var(--brass-bright)", marginTop:2 }}>
                    📍 {siteAddr(j)||custAddr(j)||j.location}
                  </div>
                ) : null}
                <div style={{ fontSize:13, color:"var(--muted)", marginTop:3 }}>{j.type}</div>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginTop:10 }}>
                  <div className="mono" style={{ fontSize:12, color:"var(--brass-bright)" }}>
                    {fmtDate(j.scheduled_date)} · {fmtTime(j.scheduled_time)}
                  </div>
                  <div className="head" style={{ fontSize:15, fontWeight:700, color:"var(--olive-bright)" }}>{money(j.value)}</div>
                </div>
              </button>
            ))}
            <button onClick={fixOldStatuses} className="mono"
              style={{ width:"100%", marginTop:6, padding:"11px", borderRadius:8, fontSize:12, letterSpacing:"0.08em",
                background:"transparent", color:"var(--muted)", border:"1px dashed var(--line)" }}>
              ⟳ FIX OLD STATUSES
            </button>
          </div>
        </React.Fragment>
      )}

      {/* Bottom bar */}
      <div style={{ position:"fixed", bottom:0, left:"50%", transform:"translateX(-50%)",
        width:"100%", maxWidth:520, background:"var(--panel)", borderTop:"1px solid var(--line)",
        padding:"12px 16px", display:"flex", gap:10, boxShadow:"0 -8px 24px rgba(0,0,0,0.4)" }}>
        <button onClick={() => setAdding(true)} className="head"
          style={{ flex:2, padding:"15px", borderRadius:9, fontSize:16, fontWeight:700,
            background:"var(--olive-bright)", color:"var(--bg)" }}>+ NEW JOB</button>
        <button onClick={exportJobs} className="head"
          style={{ flex:1, padding:"15px", borderRadius:9, fontSize:14, fontWeight:600,
            background:"transparent", color:"var(--brass-bright)", border:"1px solid var(--brass)" }}>EXPORT</button>
      </div>

      {toast && <Toast msg={toast.msg} isError={toast.isError} />}
    </div>
  );
}

/* ── JobDetail ─────────────────────────────────────────────────────────────── */
function JobDetail({ job, onBack, onUpdate, onEdit, onDelete }) {
  const [showStatus, setShowStatus] = useState(false);
  const [showResched, setShowResched] = useState(false);
  const [date, setDate] = useState(job.scheduled_date);
  const [time, setTime] = useState(job.scheduled_time);

  return (
    <div className="fade-in" style={{ paddingBottom:40 }}>
      <div style={{ padding:"16px", borderBottom:"1px solid var(--line)", background:"var(--panel)", display:"flex", alignItems:"center", gap:12 }}>
        <button onClick={onBack} className="head" style={{ fontSize:22, color:"var(--muted)" }}>‹</button>
        <div className="head" style={{ fontSize:18, fontWeight:600 }}>JOB DETAIL</div>
        <button onClick={onEdit} className="head"
          style={{ marginLeft:"auto", fontSize:13, fontWeight:600, padding:"7px 14px", borderRadius:6,
            border:"1px solid var(--brass)", color:"var(--brass-bright)" }}>EDIT</button>
      </div>
      <div style={{ padding:16 }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:10 }}>
          <div className="head" style={{ fontSize:24, fontWeight:700, lineHeight:1.1 }}>{job.customer}</div>
          <StatusPill status={job.status} />
        </div>
        <div style={{ fontSize:14, color:"var(--muted)", marginTop:6 }}>{job.type}</div>
        {(job.location && siteAddr(job).trim() === custAddr(job).trim()) ? (
          <div className="head" style={{ fontSize:15, fontWeight:600, color:"var(--brass-bright)", marginTop:6 }}>📍 {job.location}</div>
        ) : null}

        <div style={{ marginTop:14, padding:14, background:"var(--panel)", border:"1px solid var(--line)", borderRadius:10, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
          <span className="mono" style={{ fontSize:11, color:"var(--muted)" }}>JOB VALUE</span>
          <span className="head" style={{ fontSize:24, fontWeight:700, color:"var(--olive-bright)" }}>{money(job.value)}</span>
        </div>

        <button onClick={() => setShowResched(true)} style={{ width:"100%", textAlign:"left", marginTop:10, padding:14, background:"var(--panel)", border:"1px solid var(--line)", borderRadius:10, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
          <span className="mono" style={{ fontSize:11, color:"var(--muted)" }}>SCHEDULED</span>
          <span className="head" style={{ fontSize:16, fontWeight:600, color:"var(--brass-bright)" }}>
            {fmtDate(job.scheduled_date)} · {fmtTime(job.scheduled_time)} ✎
          </span>
        </button>

        <div style={{ marginTop:10, padding:14, background:"var(--panel)", border:"1px solid var(--line)", borderRadius:10 }}>
          <a href={`tel:${(job.phone||"").replace(/[^0-9]/g,"")}`} style={{ color:"var(--olive-bright)", textDecoration:"none", fontSize:16, fontWeight:600 }} className="head">{job.phone||"—"}</a>
          <div className="mono" style={{ fontSize:10, color:"var(--brass-bright)", marginTop:12 }}>SITE ADDRESS</div>
          <a href={`https://maps.google.com/?q=${encodeURIComponent(siteAddr(job))}`} target="_blank" rel="noreferrer"
            style={{ display:"block", color:"var(--text)", textDecoration:"none", fontSize:14, marginTop:3, lineHeight:1.4 }}>{siteAddr(job)}</a>
          {custAddr(job) && custAddr(job) !== siteAddr(job) && (
            <React.Fragment>
              <div className="mono" style={{ fontSize:10, color:"var(--muted)", marginTop:12 }}>CUSTOMER ADDRESS</div>
              <div style={{ fontSize:14, color:"var(--muted)", marginTop:3, lineHeight:1.4 }}>{custAddr(job)}</div>
            </React.Fragment>
          )}
        </div>

        <div style={{ marginTop:10 }}>
          <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginBottom:6 }}>NOTES</div>
          <textarea value={job.notes} onChange={e => onUpdate({ notes: e.target.value })} rows={3} style={{ resize:"vertical", lineHeight:1.4 }} />
        </div>

        {job.history && job.history.length > 0 && (
          <div style={{ marginTop:16 }}>
            <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginBottom:8 }}>SERVICE HISTORY</div>
            {job.history.map((h,i) => (
              <div key={i} style={{ padding:"10px 0", borderTop:"1px solid var(--line)" }}>
                <div className="mono" style={{ fontSize:11, color:"var(--brass)" }}>{fmtDate(h.date)}</div>
                <div style={{ fontSize:14, marginTop:2, lineHeight:1.4 }}>{h.note}</div>
              </div>
            ))}
          </div>
        )}

        <button onClick={() => setShowStatus(true)} className="head"
          style={{ width:"100%", marginTop:20, padding:16, borderRadius:10, fontSize:16, fontWeight:700, background:"var(--olive-bright)", color:"var(--bg)" }}>
          UPDATE STATUS →
        </button>
        <button onClick={() => { if (confirm("Delete this job?")) onDelete(); }} className="head"
          style={{ width:"100%", marginTop:10, padding:13, borderRadius:10, fontSize:14, fontWeight:600, background:"transparent", color:"var(--danger)", border:"1px solid var(--danger)" }}>
          DELETE JOB
        </button>
      </div>

      {showStatus && (
        <Sheet onClose={() => setShowStatus(false)} title="UPDATE STATUS">
          {STATUSES.map(s => (
            <button key={s} onClick={() => { onUpdate({ status:s }); setShowStatus(false); }}
              style={{ display:"flex", width:"100%", alignItems:"center", justifyContent:"space-between", padding:"14px 4px", borderBottom:"1px solid var(--line)", textAlign:"left" }}>
              <StatusPill status={s} />
              {job.status === s && <span style={{ color:"var(--olive-bright)" }}>✓</span>}
            </button>
          ))}
        </Sheet>
      )}

      {showResched && (
        <Sheet onClose={() => setShowResched(false)} title="RESCHEDULE">
          <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginBottom:6, marginTop:4 }}>DATE</div>
          <input type="date" value={date} onChange={e => setDate(e.target.value)} />
          <div className="mono" style={{ fontSize:11, color:"var(--muted)", margin:"14px 0 6px" }}>TIME</div>
          <input type="time" value={time} onChange={e => setTime(e.target.value)} />
          <button onClick={() => { onUpdate({ scheduled_date:date, scheduled_time:time }); setShowResched(false); }} className="head"
            style={{ width:"100%", marginTop:18, padding:15, borderRadius:9, fontSize:16, fontWeight:700, background:"var(--olive-bright)", color:"var(--bg)" }}>
            SAVE
          </button>
        </Sheet>
      )}
    </div>
  );
}

/* ── JobForm ───────────────────────────────────────────────────────────────── */
function JobForm({ onSave, onCancel, initial, allJobs }) {
  const editing = !!initial;
  const customers = React.useMemo(() => deriveCustomers(allJobs||[]), [allJobs]);
  const [f, setF] = useState(initial ? {
    ...initial,
    customer_address: initial.customer_address||initial.address||"",
    site_address: initial.site_address||initial.address||"",
    same_address: initial.same_address !== undefined
      ? initial.same_address
      : ((initial.customer_address||initial.address||"") === (initial.site_address||initial.address||"")),
    value: initial.value===0||initial.value ? String(initial.value) : "",
  } : {
    customer:"", location:"", customer_address:"", site_address:"",
    same_address: loadSameAddrPref(),
    phone:"", type:"Service Call",
    status:"New", scheduled_date: todayISO(), scheduled_time:"09:00",
    value:"", notes:"", history:[],
  });
  const set = (k,v) => setF(s => ({...s,[k]:v}));

  const [showCustList, setShowCustList] = useState(false);
  const [pickedSites, setPickedSites] = useState(null);
  const [addingNewSite, setAddingNewSite] = useState(false);

  const custNames = Object.keys(customers);
  const typed = (f.customer||"").trim().toLowerCase();
  const matches = typed.length > 0
    ? custNames.filter(n => n.toLowerCase().includes(typed) && n.toLowerCase() !== typed)
    : [];

  function onCustomerType(v) { setF(s=>({...s,customer:v})); setShowCustList(true); setPickedSites(null); setAddingNewSite(false); }
  function pickCustomer(name) {
    const rec = customers[name]; setShowCustList(false);
    const hasSites = rec.sites && rec.sites.length > 0;
    setF(s => ({ ...s, customer:name, customer_address:rec.customer_address||"", phone:rec.phone||"",
      same_address: hasSites ? false : s.same_address,
      location: hasSites ? "" : s.location,
      site_address: hasSites ? "" : (s.same_address ? rec.customer_address||"" : s.site_address) }));
    setPickedSites(hasSites ? rec.sites : null); setAddingNewSite(false);
  }
  function pickSite(site) { setF(s=>({...s,site_address:site.site_address,same_address:false})); setAddingNewSite(false); }
  function toggleSameAddr() {
    setF(s => { const next=!s.same_address; saveSameAddrPref(next);
      return next ? {...s,same_address:true,site_address:s.customer_address} : {...s,same_address:false}; });
  }
  function setCustomerAddr(v) { setF(s => s.same_address ? {...s,customer_address:v,site_address:v} : {...s,customer_address:v}); }

  const valid = f.customer.trim().length > 0;

  return (
    <div className="fade-in" style={{ paddingBottom:40 }}>
      <div style={{ padding:"16px", borderBottom:"1px solid var(--line)", background:"var(--panel)", display:"flex", alignItems:"center", gap:12 }}>
        <button onClick={onCancel} className="head" style={{ fontSize:22, color:"var(--muted)" }}>‹</button>
        <div className="head" style={{ fontSize:18, fontWeight:600 }}>{editing?"EDIT JOB":"NEW JOB"}</div>
      </div>
      <div style={{ padding:16, display:"flex", flexDirection:"column", gap:14 }}>
        <div style={{ position:"relative" }}>
          <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginBottom:6 }}>CUSTOMER</div>
          <input type="text" placeholder="Name or business" value={f.customer}
            onChange={e => editing ? set("customer",e.target.value) : onCustomerType(e.target.value)}
            onFocus={() => !editing && setShowCustList(true)} />
          {!editing && showCustList && matches.length > 0 && (
            <div className="fade-in" style={{ position:"absolute", top:"100%", left:0, right:0, zIndex:20,
              background:"var(--panel-2)", border:"1px solid var(--olive)", borderRadius:8, marginTop:4, overflow:"hidden" }}>
              {matches.slice(0,6).map(name => (
                <button key={name} onClick={() => pickCustomer(name)}
                  style={{ display:"block", width:"100%", textAlign:"left", padding:"12px 14px", borderBottom:"1px solid var(--line)" }}>
                  <span className="head" style={{ fontSize:15, fontWeight:600 }}>{name}</span>
                  {customers[name].sites.length > 0 && (
                    <span className="mono" style={{ fontSize:11, color:"var(--brass)", marginLeft:8 }}>
                      {customers[name].sites.length} site{customers[name].sites.length>1?"s":""}
                    </span>
                  )}
                </button>
              ))}
            </div>
          )}
        </div>
        <div>
          <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginBottom:6 }}>CUSTOMER ADDRESS</div>
          <input type="text" placeholder="Main / billing address" value={f.customer_address} onChange={e => setCustomerAddr(e.target.value)} />
        </div>
        <div>
          <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginBottom:6 }}>PHONE</div>
          <input type="tel" placeholder="(610) 555-0000" value={f.phone} onChange={e => set("phone",e.target.value)} />
        </div>
        <button onClick={toggleSameAddr} style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 2px", textAlign:"left" }}>
          <span style={{ width:44, height:26, borderRadius:13, flexShrink:0, position:"relative",
            background: f.same_address ? "var(--olive-bright)" : "var(--line)", transition:"background 0.15s" }}>
            <span style={{ position:"absolute", top:3, left: f.same_address ? 21 : 3,
              width:20, height:20, borderRadius:"50%", background:"var(--bg)", transition:"left 0.15s" }}></span>
          </span>
          <span style={{ fontSize:14, color:"var(--text)" }}>Site same as customer address</span>
        </button>
        {!f.same_address && (
          <div className="fade-in" style={{ display:"flex", flexDirection:"column", gap:14 }}>
            {!editing && pickedSites && pickedSites.length>0 && !addingNewSite && (
              <div style={{ padding:12, background:"var(--panel-2)", border:"1px solid var(--brass)", borderRadius:10 }}>
                <div className="mono" style={{ fontSize:11, color:"var(--brass-bright)", marginBottom:8, letterSpacing:"0.08em" }}>SAVED SITES FOR THIS CUSTOMER</div>
                {pickedSites.map((site,i) => {
                  const chosen = f.site_address === site.site_address;
                  return (
                    <button key={i} onClick={() => pickSite(site)}
                      style={{ display:"block", width:"100%", textAlign:"left", padding:"10px 0", borderBottom:"1px solid var(--line)" }}>
                      <div className="head" style={{ fontSize:15, fontWeight:600, color:chosen?"var(--olive-bright)":"var(--text)" }}>
                        {site.site_address} {chosen?"✓":""}
                      </div>
                    </button>
                  );
                })}
                <button onClick={() => { setAddingNewSite(true); setF(s=>({...s,site_address:""})); }}
                  className="head" style={{ marginTop:10, fontSize:13, fontWeight:600, color:"var(--brass-bright)" }}>
                  + NEW SITE
                </button>
              </div>
            )}
            <div>
              <div className="mono" style={{ fontSize:11, color:"var(--brass-bright)", marginBottom:6 }}>SITE</div>
              <input type="text" placeholder="Where the job is (name and/or address)" value={f.site_address} onChange={e => set("site_address",e.target.value)} />
            </div>
          </div>
        )}
        <div>
          <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginBottom:6 }}>JOB TYPE</div>
          <select value={f.type} onChange={e => set("type",e.target.value)}>
            {JOB_TYPES.map(t => <option key={t}>{t}</option>)}
          </select>
        </div>
        <div style={{ display:"flex", gap:10 }}>
          <div style={{ flex:1 }}>
            <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginBottom:6 }}>DATE</div>
            <input type="date" value={f.scheduled_date} onChange={e => set("scheduled_date",e.target.value)} />
          </div>
          <div style={{ flex:1 }}>
            <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginBottom:6 }}>TIME</div>
            <input type="time" value={f.scheduled_time} onChange={e => set("scheduled_time",e.target.value)} />
          </div>
        </div>
        <div>
          <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginBottom:6 }}>STATUS</div>
          <select value={f.status} onChange={e => set("status",e.target.value)}>
            {STATUSES.map(s => <option key={s}>{s}</option>)}
          </select>
        </div>
        <div>
          <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginBottom:6 }}>JOB VALUE ($)</div>
          <input type="number" inputMode="decimal" placeholder="0" value={f.value} onChange={e => set("value",e.target.value)} />
        </div>
        <div>
          <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginBottom:6 }}>NOTES</div>
          <textarea rows={3} placeholder="Equipment, parts, scope..." value={f.notes} onChange={e => set("notes",e.target.value)} style={{ resize:"vertical", lineHeight:1.4 }} />
        </div>
        <button onClick={() => {
            if (!valid) return;
            const site = f.same_address ? f.customer_address : f.site_address;
            onSave({ ...f, site_address:site, address:site, value:Number(f.value)||0 });
          }}
          disabled={!valid} className="head"
          style={{ marginTop:6, padding:16, borderRadius:10, fontSize:16, fontWeight:700,
            background:valid?"var(--olive-bright)":"var(--line)", color:valid?"var(--bg)":"var(--muted)" }}>
          {editing?"SAVE CHANGES":"SAVE JOB"}
        </button>
      </div>
    </div>
  );
}

/* ── Sheet ─────────────────────────────────────────────────────────────────── */
function Sheet({ title, onClose, children }) {
  return (
    <div onClick={onClose} style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.6)", zIndex:50, display:"flex", alignItems:"flex-end", justifyContent:"center" }}>
      <div onClick={e => e.stopPropagation()} className="fade-in"
        style={{ width:"100%", maxWidth:520, background:"var(--panel-2)", borderTop:"2px solid var(--olive)",
          borderRadius:"16px 16px 0 0", padding:"18px 16px 28px", maxHeight:"80vh", overflowY:"auto" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
          <div className="head" style={{ fontSize:16, fontWeight:700 }}>{title}</div>
          <button onClick={onClose} className="mono" style={{ color:"var(--muted)", fontSize:18 }}>✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}
