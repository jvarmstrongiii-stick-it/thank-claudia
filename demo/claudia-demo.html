    <div className="fade-in" style={{ minHeight:'100vh', background:'var(--bg)' }}>
      <div style={{ padding:'18px 16px 14px', borderBottom:'1px solid var(--line)', background:'var(--panel)', position:'sticky', top:0, zIndex:10 }}>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <button onClick={onClose} className="head" style={{ fontSize:22, color:'var(--text)', background:'none', border:'none', padding:'0 6px', cursor:'pointer' }}>‹</button>
          <div className="head" style={{ fontSize:20, fontWeight:700, flex:1 }}>WARRANTY REVIEW</div>
          <button onClick={load} className="mono" style={{ fontSize:18, color:'var(--muted)' }}>↺</button>
        </div>
      </div>
      <div style={{ padding:'4px 16px 40px' }}>
        {loading ? (
          <div className="mono" style={{ ...small, marginTop:20 }}>Loading…</div>
        ) : notMigrated ? (
          <div className="mono" style={{ fontSize:13, color:'var(--brass-bright)', marginTop:20 }}>Warranty tracking needs its one-time database setup — ask Jack.</div>
        ) : (
          <React.Fragment>
            <div className="head" style={head}>REPLIES TO REVIEW ({inbound.length})</div>
            {!inbound.length && <div className="mono" style={small}>Nothing waiting.</div>}
            {inbound.map(inb => <React.Fragment key={inb.id}>{InboundCard({ inb })}</React.Fragment>)}

            <div className="head" style={head}>EMAILS ON HOLD ({held.length})</div>
            {!held.length && <div className="mono" style={small}>Nothing on hold.</div>}
            {held.map(r => {
              const { title, sub } = regLine(r);
              return (
                <div key={r.id} style={card}>
                  <div className="head" style={{ fontSize:13, fontWeight:700 }}>{title}</div>
                  <div className="mono" style={small}>{sub}</div>
                  <div className="mono" style={{ fontSize:11, color:'var(--brass-bright)', marginTop:6 }}>
                    {(r.hold_reasons || []).map(h => <div key={h}>⚠ {WARRANTY_HOLD_LABEL[h] || h}</div>)}
                  </div>
                  {r.job_id && (
                    <button onClick={() => onOpenJob(r.job_id)} className="head"
                      style={{ marginTop:8, padding:'8px 12px', borderRadius:8, fontSize:12, fontWeight:700, border:'1px solid var(--line)' }}>
                      OPEN JOB →
                    </button>
                  )}
                </div>
              );
            })}

            <button onClick={() => setShowAuto(v => !v)} className="head" style={{ ...head, background:'none', border:'none', padding:0, display:'block' }}>
              {showAuto ? '▾' : '▸'} RECENTLY AUTO-MATCHED ({autoRecent.length})
            </button>
            {showAuto && autoRecent.map(inb => (
              <div key={inb.id} style={card}>
                <div className="head" style={{ fontSize:13, fontWeight:700 }}>{inb.subject || '(no subject)'}</div>
                <div className="mono" style={small}>{inb.from_email} · {new Date(inb.received_at).toLocaleString()}</div>
                {(inb.matched_registration_ids || []).map(id => regById[id] ? (
                  <div key={id} className="mono" style={{ fontSize:12, marginTop:4 }}>✓ {regLine(regById[id]).title} · {regLine(regById[id]).sub}</div>
                ) : null)}
                <button onClick={() => undoAuto(inb)} disabled={busy === inb.id} className="head"
                  style={{ marginTop:8, padding:'8px 12px', borderRadius:8, fontSize:12, fontWeight:700, border:'1px solid var(--danger)', color:'var(--danger)' }}>
                  UNDO
                </button>
              </div>
            ))}
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

/* ── HoursReport ────────────────────────────────────────────────────────────── */
function HoursReport({ jobs, users, onClose, onOpenJobDay, onOpenJob }) {
  const [weekOffset, setWeekOffset] = useState(0);
  const [tab, setTab] = useState('user');
  const [notes, setNotes] = useState([]);
  const [crewRows, setCrewRows] = useState([]);
  const [loading, setLoading] = useState(true);
  const [expandedKeys, setExpandedKeys] = useState(() => new Set());
  const [flagExplain, setFlagExplain] = useState(null); // { dangling, implausible, dayKey? } or { dayLevel: true, dayKey? } — dayKey only set from the BY DAY tab's sub-rows, where there's an actual single day to name
  function toggleExpanded(key) {
    setExpandedKeys(prev => {
      const next = new Set(prev);
      next.has(key) ? next.delete(key) : next.add(key);
      return next;
    });
  }

  const weekStart = useMemo(() => {
    const d = new Date();
    const day = d.getDay();
    d.setDate(d.getDate() - (day === 0 ? 6 : day - 1) + weekOffset * 7);
    d.setHours(0, 0, 0, 0);
    return d;
  }, [weekOffset]);

  const weekEnd = useMemo(() => {
    const d = new Date(weekStart);
    d.setDate(d.getDate() + 7);
    return d;
  }, [weekStart]);

  const weekLabel = useMemo(() => {
    const fmt = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    const endDisplay = new Date(weekEnd); endDisplay.setDate(endDisplay.getDate() - 1);
    return `${fmt(weekStart)} – ${fmt(endDisplay)}`;
  }, [weekStart, weekEnd]);

  useEffect(() => {
    setLoading(true);
    setNotes([]);
    setExpandedKeys(new Set());
    Promise.all([
      sb.from('job_notes')
        .select('id, job_id, content, created_at')
        .eq('source', 'system')
        .gte('created_at', weekStart.toISOString())
        .lt('created_at', weekEnd.toISOString())
        .order('created_at', { ascending: true }),
      // Live crew rows let buildCrewTimeline tell a genuinely-ongoing session (counts to now)
      // from a dangling one with no clock-out recorded (excluded + flagged, never invented).
      sb.from('job_crew').select('job_id, user_id, status'),
    ]).then(([{ data }, { data: crew }]) => {
      setNotes(data || []);
      setCrewRows(crew || []);
      setLoading(false);
    });
  }, [weekStart.getTime()]);

  const { byUser, byJob, byDay, danglingCount } = useMemo(() => {
    const byUser = {};
    const byJob = {};
    const byDay = {};
    let danglingCount = 0;
    const notesByJobId = {};
    notes.forEach(n => {
      if (!notesByJobId[n.job_id]) notesByJobId[n.job_id] = [];
      notesByJobId[n.job_id].push({ id: n.id, content: n.content, at: n.created_at });
    });
    const crewByJobId = {};
    crewRows.forEach(c => { (crewByJobId[c.job_id] = crewByJobId[c.job_id] || []).push(c); });
    // Materials Run/Shop Run periods tagged 'bill:shop' count against the shop job's bucket
    // instead of the job they were physically logged against — see buildCrewTimeline's billTo.
    const shopJob = jobs.find(j => j.customer?.toUpperCase() === ABC_SHOP_NAME && j.status !== 'Closed');
    const weMs = weekEnd.getTime();
    Object.entries(notesByJobId).forEach(([jobId, jobNotes]) => {
      const timeline = buildCrewTimeline(jobNotes, crewByJobId[jobId] || [], users);
      const job = jobs.find(j => j.id === jobId);
      const label = job ? job.customer : 'Unknown';
      Object.entries(timeline).forEach(([userName, periods]) => {
        periods.forEach(p => {
          if (p.dangling) {
            // No clock-out was ever recorded — counting to "now" is how totals got silently
            // inflated. Contribute 0 and flag every aggregate this period touches instead.
            danglingCount++;
            const dayKey = dateISOInTZ(new Date(p.start), getAppTZ());
            if (!byUser[userName]) byUser[userName] = { totalMs: 0, jobs: {} };
            if (!byUser[userName].jobs[jobId]) byUser[userName].jobs[jobId] = { label, totalMs: 0, driveMs: 0, onSiteMs: 0, runMs: 0, periods: [] };
            if (!byJob[jobId]) byJob[jobId] = { label, totalMs: 0, users: {} };
            if (!byJob[jobId].users[userName]) byJob[jobId].users[userName] = { totalMs: 0, driveMs: 0, onSiteMs: 0, runMs: 0, periods: [] };
            if (!byDay[dayKey]) byDay[dayKey] = { totalMs: 0, users: {}, jobs: {} };
            if (!byDay[dayKey].users[userName]) byDay[dayKey].users[userName] = { totalMs: 0, driveMs: 0, onSiteMs: 0, runMs: 0, periods: [] };
            if (!byDay[dayKey].jobs[jobId]) byDay[dayKey].jobs[jobId] = { label, totalMs: 0, driveMs: 0, onSiteMs: 0, runMs: 0, periods: [] };
            byUser[userName].dangling = byUser[userName].jobs[jobId].dangling = true;
            byJob[jobId].dangling = byJob[jobId].users[userName].dangling = true;
            byDay[dayKey].dangling = byDay[dayKey].users[userName].dangling = byDay[dayKey].jobs[jobId].dangling = true;
            byUser[userName].jobs[jobId].periods.push({ ...p });
            byJob[jobId].users[userName].periods.push({ ...p });
            byDay[dayKey].users[userName].periods.push({ ...p, jobLabel: label });
            byDay[dayKey].jobs[jobId].periods.push({ ...p, userName });
            return;
          }
          const endMs = p.end ? new Date(p.end).getTime() : Math.min(Date.now(), weMs);
          const ms = endMs - new Date(p.start).getTime();
          if (ms <= 0) return;
          const isRun = p.status === 'Materials Run' || p.status === 'Shop Run';
          const billShop = isRun && p.billTo === 'shop';
          const jId = billShop ? (shopJob?.id || jobId) : jobId;
          const jLabel = billShop ? (shopJob?.customer || 'ABC SHOP') : label;
          const bucket = p.status === 'In Route' ? 'driveMs' : isRun ? 'runMs' : 'onSiteMs';
          if (!byUser[userName]) byUser[userName] = { totalMs: 0, jobs: {} };
          byUser[userName].totalMs += ms;
          if (!byUser[userName].jobs[jId]) byUser[userName].jobs[jId] = { label: jLabel, totalMs: 0, driveMs: 0, onSiteMs: 0, runMs: 0, periods: [] };
          byUser[userName].jobs[jId].totalMs += ms;
          byUser[userName].jobs[jId][bucket] += ms;
          byUser[userName].jobs[jId].periods.push({ ...p });
          if (!byJob[jId]) byJob[jId] = { label: jLabel, totalMs: 0, users: {} };
          byJob[jId].totalMs += ms;
          if (!byJob[jId].users[userName]) byJob[jId].users[userName] = { totalMs: 0, driveMs: 0, onSiteMs: 0, runMs: 0, periods: [] };
          byJob[jId].users[userName].totalMs += ms;
          byJob[jId].users[userName][bucket] += ms;
          byJob[jId].users[userName].periods.push({ ...p });
          const dayKey = dateISOInTZ(new Date(p.start), getAppTZ());
          if (!byDay[dayKey]) byDay[dayKey] = { totalMs: 0, users: {}, jobs: {} };
          byDay[dayKey].totalMs += ms;
          if (!byDay[dayKey].users[userName]) byDay[dayKey].users[userName] = { totalMs: 0, driveMs: 0, onSiteMs: 0, runMs: 0, periods: [] };
          byDay[dayKey].users[userName].totalMs += ms;
          byDay[dayKey].users[userName][bucket] += ms;
          byDay[dayKey].users[userName].periods.push({ ...p, jobLabel: jLabel });
          if (!byDay[dayKey].jobs[jId]) byDay[dayKey].jobs[jId] = { label: jLabel, totalMs: 0, driveMs: 0, onSiteMs: 0, runMs: 0, periods: [] };
          byDay[dayKey].jobs[jId].totalMs += ms;
          byDay[dayKey].jobs[jId][bucket] += ms;
          byDay[dayKey].jobs[jId].periods.push({ ...p, userName });
        });
      });
    });
    return { byUser, byJob, byDay, danglingCount };
  }, [notes, crewRows, jobs, users, weekEnd]);

  const rowStyle = { marginBottom: 8, background: 'var(--panel)', border: '1px solid var(--line)', borderRadius: 10, overflow: 'hidden' };
  const subRowStyle = (first) => ({ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '7px 0', borderTop: first ? 'none' : '1px solid var(--line)' });
  // Never compare against data.totalMs (a day's combined total across everyone) — two or
  // three techs each having a normal day easily sums past 16h with nothing wrong. Flag only
  // when a SINGLE person's day (or an actual dangling period) crosses the threshold.
  const dayImplausible = data => data.dangling || Object.values(data.users).some(u => u.dangling || u.totalMs > IMPLAUSIBLE_DAY_MS);

  function SubBreakdown({ driveMs, onSiteMs, runMs, totalMs, dangling, implausible, dayKey, onExplain }) {
    const flagged = dangling || implausible;
    const parts = [
      driveMs > 0 && `${fmtElapsed(driveMs)} drive`,
      onSiteMs > 0 && `${fmtElapsed(onSiteMs)} on site`,
      runMs > 0 && `${fmtElapsed(runMs)} run`,
    ].filter(Boolean);
    return (
      <div style={{ textAlign: 'right' }}>
        <div className="mono" style={{ fontSize: 13, fontWeight: 700, color: flagged ? 'var(--danger)' : 'var(--olive-bright)' }}>
          {flagged && (
            <span onClick={e => { e.stopPropagation(); onExplain({ dangling, implausible, dayKey }); }} style={{ cursor: 'pointer' }}>⚠️ </span>
          )}
          {fmtElapsed(totalMs)}
        </div>
        {parts.length > 1 && (
          <div className="mono" style={{ fontSize: 10, color: 'var(--muted)', marginTop: 1 }}>
            {parts.join(' · ')}
          </div>
        )}
      </div>
    );
  }

  const sortedUsers = Object.entries(byUser).sort((a, b) => b[1].totalMs - a[1].totalMs);
  const sortedJobs  = Object.entries(byJob).sort((a, b) => b[1].totalMs - a[1].totalMs);
  const sortedDays  = Object.entries(byDay).sort((a, b) => a[0].localeCompare(b[0]));
  const dayLabel = iso => new Date(iso + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

  return (
    <div className="fade-in" style={{ minHeight: '100vh', background: 'var(--bg)' }}>
      <div style={{ padding: '18px 16px 14px', borderBottom: '1px solid var(--line)', background: 'var(--panel)', position: 'sticky', top: 0, zIndex: 10 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <button onClick={onClose} className="head" style={{ fontSize: 22, color: 'var(--text)', background: 'none', border: 'none', padding: '0 6px', cursor: 'pointer' }}>‹</button>
          <div className="head" style={{ fontSize: 20, fontWeight: 700 }}>HOURS</div>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 12 }}>
          <button onClick={() => setWeekOffset(o => o - 1)} className="head"
            style={{ fontSize: 16, padding: '4px 12px', background: 'var(--panel)', border: '1px solid var(--line)', borderRadius: 6, color: 'var(--text)', cursor: 'pointer' }}>‹</button>
          <div className="mono" style={{ flex: 1, textAlign: 'center', fontSize: 13, color: 'var(--text)', letterSpacing: '0.05em' }}>{weekLabel}</div>
          <button onClick={() => setWeekOffset(o => Math.min(o + 1, 0))} className="head"
            style={{ fontSize: 16, padding: '4px 12px', background: 'var(--panel)', border: '1px solid var(--line)', borderRadius: 6,
              color: weekOffset === 0 ? 'var(--muted)' : 'var(--text)', cursor: weekOffset === 0 ? 'default' : 'pointer',
              opacity: weekOffset === 0 ? 0.4 : 1 }} disabled={weekOffset === 0}>›</button>
        </div>
        <div style={{ display: 'flex', gap: 8, marginTop: 12 }}>
          {['user', 'job', 'day'].map(t => (
            <button key={t} onClick={() => { setTab(t); setExpandedKeys(new Set()); }} className="head"
              style={{ flex: 1, padding: '9px 0', borderRadius: 7, fontSize: 13, fontWeight: 700,
                background: tab === t ? 'var(--olive-bright)' : 'var(--panel)',
                color: tab === t ? 'var(--bg)' : 'var(--muted)',
                border: `1px solid ${tab === t ? 'var(--olive-bright)' : 'var(--line)'}`,
                cursor: 'pointer' }}>
              BY {t === 'user' ? 'TECH' : t === 'job' ? 'JOB' : 'DAY'}
            </button>
          ))}
        </div>
      </div>

      <div style={{ padding: '12px 16px' }}>
        {loading && <div className="mono" style={{ textAlign: 'center', color: 'var(--muted)', padding: '40px 0', fontSize: 13, letterSpacing: '0.1em' }}>LOADING…</div>}

        {!loading && danglingCount > 0 && (
          <div className="mono" style={{ fontSize: 11, color: 'var(--danger)', border: '1px solid var(--danger)', borderRadius: 8,
            padding: '8px 10px', marginBottom: 10, lineHeight: 1.5 }}>
            ⚠️ {danglingCount} period{danglingCount !== 1 ? 's' : ''} with no clock-out recorded — excluded from these totals.
            Open the flagged job's TIME LOG to add the missing end time.
          </div>
        )}

        {!loading && tab === 'user' && (
          sortedUsers.length === 0
            ? <div className="mono" style={{ textAlign: 'center', color: 'var(--muted)', padding: '40px 0', fontSize: 13 }}>No hours logged this week</div>
            : sortedUsers.map(([userName, data]) => (
              <div key={userName} style={rowStyle}>
                <button onClick={() => toggleExpanded(userName)}
                  style={{ width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '13px 14px', background: 'none', border: 'none', cursor: 'pointer' }}>
                  <div className="head" style={{ fontSize: 15, fontWeight: 700, color: 'var(--text)' }}>{userName.toUpperCase()}</div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                    <div className="mono" style={{ fontSize: 15, fontWeight: 700, color: data.dangling ? 'var(--danger)' : 'var(--olive-bright)' }}>
                      {data.dangling && (
                        <span onClick={e => { e.stopPropagation(); setFlagExplain({ dangling: true }); }} style={{ cursor: 'pointer' }}>⚠️ </span>
                      )}
                      {fmtElapsed(data.totalMs)}
                    </div>
                    <span className="mono" style={{ fontSize: 11, color: 'var(--muted)' }}>{expandedKeys.has(userName) ? '▲' : '▼'}</span>
                  </div>
                </button>
                {expandedKeys.has(userName) && (
                  <div style={{ borderTop: '1px solid var(--line)', padding: '6px 14px 12px' }}>
                    {Object.entries(data.jobs).sort((a, b) => b[1].totalMs - a[1].totalMs).map(([jobId, jd], i) => (
                      <div key={jobId} style={{ ...subRowStyle(i === 0), flexDirection: 'column', alignItems: 'stretch' }}>
                        <button onClick={() => onOpenJob && onOpenJob(jobId)}
                          style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', width: '100%', textAlign: 'left', background: 'none', border: 'none', padding: 0, cursor: 'pointer' }}>
                          <div className="head" style={{ fontSize: 13, color: 'var(--text)', flex: 1, paddingRight: 10 }}>{jd.label}</div>
                          <SubBreakdown driveMs={jd.driveMs} onSiteMs={jd.onSiteMs} runMs={jd.runMs} totalMs={jd.totalMs} dangling={jd.dangling} onExplain={setFlagExplain} />
                        </button>
                        {(jd.periods || []).length > 0 && (
                          <div style={{ marginTop: 6 }}>
                            {jd.periods.slice().sort((a, b) => new Date(a.start) - new Date(b.start)).map((p, pi) => (
                              <div key={pi} className="mono" style={{ fontSize: 11, color: p.dangling ? 'var(--danger)' : 'var(--muted)', marginTop: 2 }}>
                                {p.status}: {fmtTimestamp(p.start)} – {p.ongoing ? 'ongoing' : (p.end ? fmtPeriodEnd(p.start, p.end) : '⚠️ NO CLOCK-OUT')}
                                {(p.end || p.ongoing) && ` (${fmtElapsed((p.end ? new Date(p.end) : new Date()) - new Date(p.start))})`}
                                {p.billTo && ` — billed to ${p.billTo === 'shop' ? 'shop' : 'this job'}`}
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ))
        )}

        {!loading && tab === 'job' && (
          sortedJobs.length === 0
            ? <div className="mono" style={{ textAlign: 'center', color: 'var(--muted)', padding: '40px 0', fontSize: 13 }}>No hours logged this week</div>
            : sortedJobs.map(([jobId, data]) => (
              <div key={jobId} style={rowStyle}>
                <button onClick={() => toggleExpanded(jobId)}
                  style={{ width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '13px 14px', background: 'none', border: 'none', cursor: 'pointer' }}>
                  <div style={{ textAlign: 'left' }}>
                    <div className="head" style={{ fontSize: 15, fontWeight: 700, color: 'var(--text)' }}>{data.label}</div>
                    <div className="mono" style={{ fontSize: 10, color: 'var(--muted)', marginTop: 2 }}>
                      {Object.keys(data.users).length} TECH{Object.keys(data.users).length !== 1 ? 'S' : ''}
                    </div>
                  </div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                    <div className="mono" style={{ fontSize: 15, fontWeight: 700, color: data.dangling ? 'var(--danger)' : 'var(--olive-bright)' }}>
                      {data.dangling && (
                        <span onClick={e => { e.stopPropagation(); setFlagExplain({ dangling: true }); }} style={{ cursor: 'pointer' }}>⚠️ </span>
                      )}
                      {fmtElapsed(data.totalMs)}
                    </div>
                    <span className="mono" style={{ fontSize: 11, color: 'var(--muted)' }}>{expandedKeys.has(jobId) ? '▲' : '▼'}</span>
                  </div>
                </button>
                {expandedKeys.has(jobId) && (
                  <div style={{ borderTop: '1px solid var(--line)', padding: '6px 14px 12px' }}>
                    {Object.entries(data.users).sort((a, b) => b[1].totalMs - a[1].totalMs).map(([uName, ud], i) => (
                      <div key={uName} style={{ ...subRowStyle(i === 0), flexDirection: 'column', alignItems: 'stretch' }}>
                        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                          <div className="head" style={{ fontSize: 13, color: 'var(--text)' }}>{uName}</div>
                          <SubBreakdown driveMs={ud.driveMs} onSiteMs={ud.onSiteMs} runMs={ud.runMs} totalMs={ud.totalMs} dangling={ud.dangling} onExplain={setFlagExplain} />
                        </div>
                        {(ud.periods || []).length > 0 && (
                          <div style={{ marginTop: 6 }}>
                            {ud.periods.slice().sort((a, b) => new Date(a.start) - new Date(b.start)).map((p, pi) => (
                              <div key={pi} className="mono" style={{ fontSize: 11, color: p.dangling ? 'var(--danger)' : 'var(--muted)', marginTop: 2 }}>
                                {p.status}: {fmtTimestamp(p.start)} – {p.ongoing ? 'ongoing' : (p.end ? fmtPeriodEnd(p.start, p.end) : '⚠️ NO CLOCK-OUT')}
                                {(p.end || p.ongoing) && ` (${fmtElapsed((p.end ? new Date(p.end) : new Date()) - new Date(p.start))})`}
                                {p.billTo && ` — billed to ${p.billTo === 'shop' ? 'shop' : 'this job'}`}
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ))
        )}

        {!loading && tab === 'day' && (
          sortedDays.length === 0
            ? <div className="mono" style={{ textAlign: 'center', color: 'var(--muted)', padding: '40px 0', fontSize: 13 }}>No hours logged this week</div>
            : sortedDays.map(([dayKey, data]) => (
              <div key={dayKey} style={rowStyle}>
                <button onClick={() => toggleExpanded(dayKey)}
                  style={{ width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '13px 14px', background: 'none', border: 'none', cursor: 'pointer' }}>
                  <div className="head" style={{ fontSize: 15, fontWeight: 700, color: 'var(--text)' }}>{dayLabel(dayKey).toUpperCase()}</div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                    <div className="mono" style={{ fontSize: 15, fontWeight: 700, color: dayImplausible(data) ? 'var(--danger)' : 'var(--olive-bright)' }}>
                      {dayImplausible(data) && (
                        <span onClick={e => { e.stopPropagation(); setFlagExplain({ dayLevel: true, dayKey }); }} style={{ cursor: 'pointer' }}>⚠️ </span>
                      )}
                      {fmtElapsed(data.totalMs)}
                    </div>
                    <span className="mono" style={{ fontSize: 11, color: 'var(--muted)' }}>{expandedKeys.has(dayKey) ? '▲' : '▼'}</span>
                  </div>
                </button>
                {expandedKeys.has(dayKey) && (
                  <div style={{ borderTop: '1px solid var(--line)', padding: '6px 14px 12px' }}>
                    <div className="mono" style={{ fontSize: 10, color: 'var(--muted)', letterSpacing: '0.08em', marginTop: 6, marginBottom: 2 }}>BY TECH</div>
                    {Object.entries(data.users).sort((a, b) => b[1].totalMs - a[1].totalMs).map(([uName, ud], i) => (
                      <div key={uName} style={{ ...subRowStyle(i === 0), flexDirection: 'column', alignItems: 'stretch' }}>
                        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                          <div className="head" style={{ fontSize: 13, color: 'var(--text)' }}>{uName}</div>
                          <SubBreakdown driveMs={ud.driveMs} onSiteMs={ud.onSiteMs} runMs={ud.runMs} totalMs={ud.totalMs} dangling={ud.dangling} implausible={ud.totalMs > IMPLAUSIBLE_DAY_MS} dayKey={dayKey} onExplain={setFlagExplain} />
                        </div>
                        {(ud.periods || []).length > 0 && (
                          <div style={{ marginTop: 6 }}>
                            {ud.periods.slice().sort((a, b) => new Date(a.start) - new Date(b.start)).map((p, pi) => (
                              <div key={pi} className="mono" style={{ fontSize: 11, color: p.dangling ? 'var(--danger)' : 'var(--muted)', marginTop: 2 }}>
                                {p.jobLabel} — {p.status}: {fmtTimestamp(p.start)} – {p.ongoing ? 'ongoing' : (p.end ? fmtPeriodEnd(p.start, p.end) : '⚠️ NO CLOCK-OUT')}
                                {(p.end || p.ongoing) && ` (${fmtElapsed((p.end ? new Date(p.end) : new Date()) - new Date(p.start))})`}
                                {p.billTo && ` — billed to ${p.billTo === 'shop' ? 'shop' : 'this job'}`}
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    ))}
                    <div className="mono" style={{ fontSize: 10, color: 'var(--muted)', letterSpacing: '0.08em', marginTop: 14, marginBottom: 2 }}>BY JOB</div>
                    {Object.entries(data.jobs).sort((a, b) => b[1].totalMs - a[1].totalMs).map(([jobId, jd], i) => (
                      <div key={jobId} style={{ ...subRowStyle(i === 0), flexDirection: 'column', alignItems: 'stretch' }}>
                        <button onClick={() => onOpenJobDay && onOpenJobDay(jobId, dayKey)}
                          style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', width: '100%', textAlign: 'left', background: 'none', border: 'none', padding: 0, cursor: 'pointer' }}>
                          <div className="head" style={{ fontSize: 13, color: 'var(--text)' }}>{jd.label}</div>
                          <SubBreakdown driveMs={jd.driveMs} onSiteMs={jd.onSiteMs} runMs={jd.runMs} totalMs={jd.totalMs} dangling={jd.dangling} dayKey={dayKey} onExplain={setFlagExplain} />
                        </button>
                        {(jd.periods || []).length > 0 && (
                          <div style={{ marginTop: 6 }}>
                            {jd.periods.slice().sort((a, b) => new Date(a.start) - new Date(b.start)).map((p, pi) => (
                              <div key={pi} className="mono" style={{ fontSize: 11, color: p.dangling ? 'var(--danger)' : 'var(--muted)', marginTop: 2 }}>
                                {p.userName} — {p.status}: {fmtTimestamp(p.start)} – {p.ongoing ? 'ongoing' : (p.end ? fmtPeriodEnd(p.start, p.end) : '⚠️ NO CLOCK-OUT')}
                                {(p.end || p.ongoing) && ` (${fmtElapsed((p.end ? new Date(p.end) : new Date()) - new Date(p.start))})`}
                                {p.billTo && ` — billed to ${p.billTo === 'shop' ? 'shop' : 'this job'}`}
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ))
        )}
      </div>

      {flagExplain && (
        <Sheet title="WHY FLAGGED?" onClose={() => setFlagExplain(null)}>
          <div className="mono" style={{ fontSize: 14, lineHeight: 1.6, color: 'var(--text)' }}>
            {flagExplain.dayKey && (
              <div className="head" style={{ fontSize: 15, fontWeight: 700, color: 'var(--olive-bright)', marginBottom: 10 }}>
                {dayLabel(flagExplain.dayKey).toUpperCase()}
              </div>
            )}
            {flagExplain.dayLevel && (
              <div>This day has at least one flagged issue below — either a missing clock-out or one person's total running over 16 hours. Expand this day to see which tech or job it is.</div>
            )}
            {!flagExplain.dayLevel && flagExplain.dangling && (
              <div style={{ marginBottom: flagExplain.implausible ? 10 : 0 }}>One or more time periods here have no clock-out recorded, so they're excluded from this total. Open the job's TIME LOG to add the missing end time.</div>
            )}
            {!flagExplain.dayLevel && flagExplain.implausible && (
              <div>This total is over 16 hours for one person in a single day — unusually high. Check the TIME LOG for {flagExplain.dayKey ? 'that day' : 'the relevant day'} for a bad or overlapping entry.</div>
            )}
          </div>
        </Sheet>
      )}
    </div>
  );
}

/* ── BalancesScreen ────────────────────────────────────────────────────────── */
function BalancesScreen({ jobs, onClose, onOpenJob }) {
  const [expandedKeys, setExpandedKeys] = useState(() => new Set());
  function toggleExpanded(key) {
    setExpandedKeys(prev => {
      const next = new Set(prev);
      next.has(key) ? next.delete(key) : next.add(key);
      return next;
    });
  }

  const isActive = s => s !== "Completed/Paid" && s !== "Closed";

  const categories = useMemo(() => {
    const buckets = {
      approval: { label: 'WAITING ON APPROVAL', jobs: [] },
      needsBilling: { label: 'COMPLETED — NEEDS BILLING', jobs: [] },
      billed: { label: 'BILLED — WAITING FOR PAYMENT', jobs: [] },
      active: { label: 'SCHEDULED / ACTIVE WORK', jobs: [] },
    };
    (jobs || []).forEach(j => {
      if (!isActive(j.status)) return;
      if (j.status === 'Waiting on Approval') buckets.approval.jobs.push(j);
      else if (j.status === 'Completed/Needs Billing') buckets.needsBilling.jobs.push(j);
      else if (j.status === 'Billed/Waiting for Payment') buckets.billed.jobs.push(j);
      else buckets.active.jobs.push(j);
    });
    Object.values(buckets).forEach(b => {
      b.jobs.sort((a, b2) => Number(b2.value||0) - Number(a.value||0));
      b.total = b.jobs.reduce((s, j) => s + jobBalance(j), 0);
    });
    return buckets;
  }, [jobs]);
  const CATEGORY_ORDER = ['approval', 'needsBilling', 'billed', 'active'];

  // Collected (Completed/Paid) in a date range — separate from the outstanding total above.
  const [fromDate, setFromDate] = useState(() => todayLocalISO().slice(0, 7) + '-01');
  const [toDate, setToDate] = useState(() => todayLocalISO());
  const [paidNotes, setPaidNotes] = useState([]);
  const [collectedLoading, setCollectedLoading] = useState(true);

  useEffect(() => {
    setCollectedLoading(true);
    const fromIso = zonedWallToISO(fromDate, '00:00');
    const toIso = zonedWallToISO(shiftDateISO(toDate, 1), '00:00');
    sb.from('job_notes')
      .select('id, job_id, content, created_at')
      .eq('source', 'system')
      .gte('created_at', fromIso)
      .lt('created_at', toIso)
      .order('created_at', { ascending: true })
      .then(({ data }) => { setPaidNotes(data || []); setCollectedLoading(false); });
  }, [fromDate, toDate]);

  const collected = useMemo(() => {
    const seenJobIds = new Set();
    const rows = [];
    (paidNotes || []).forEach(n => {
      // Both formats: 'Job status → X (Name)' (r205+) and legacy 'Status → X (Name)' / 'Status → X'.
      const m = (n.content || '').match(/^(?:Job status|Status) → (.+?)(?: \(|$)/);
      if (!m || m[1] !== 'Completed/Paid') return;
      if (seenJobIds.has(n.job_id)) return; // a job can flicker through the status more than once — count it once
      const job = (jobs || []).find(j => j.id === n.job_id);
      if (!job) return;
      seenJobIds.add(n.job_id);
      rows.push({ job, at: n.created_at });
    });
    rows.sort((a, b) => Number(b.job.value||0) - Number(a.job.value||0));
    const total = rows.reduce((s, r) => s + Number(r.job.value||0), 0);
    return { rows, total };
  }, [paidNotes, jobs]);

  const rowStyle = { marginBottom: 8, background: 'var(--panel)', border: '1px solid var(--line)', borderRadius: 10, overflow: 'hidden' };
  const subRowStyle = (first) => ({ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '7px 0', borderTop: first ? 'none' : '1px solid var(--line)' });

  function JobRow({ j, first, dateLabel, amount }) {
    const shown = amount ?? j.value;
    return (
      <button onClick={() => onOpenJob(j.id)} style={{ ...subRowStyle(first), width: '100%', textAlign: 'left' }}>
        <div style={{ flex: 1, paddingRight: 10 }}>
          {j.site_name ? (
            <>
              <div className="head" style={{ fontSize: 13, color: 'var(--text)' }}>{j.site_name}</div>
              <div className="mono" style={{ fontSize: 10, color: 'var(--muted)', marginTop: 1 }}>{j.customer}</div>
            </>
          ) : (
            <div className="head" style={{ fontSize: 13, color: 'var(--text)' }}>{j.customer}</div>
          )}
          {dateLabel && <div className="mono" style={{ fontSize: 10, color: 'var(--muted)', marginTop: 1 }}>{dateLabel}</div>}
          {shown !== j.value && (
            <div className="mono" style={{ fontSize: 10, color: 'var(--muted)', marginTop: 1 }}>
              value {money(j.value)} − deposit {money(j.deposit_amount)}
            </div>
          )}
        </div>
        <div className="mono" style={{ fontSize: 13, fontWeight: 700, color: 'var(--olive-bright)' }}>{money(shown)}</div>
      </button>
    );
  }

  return (
    <div className="fade-in" style={{ minHeight: '100vh', background: 'var(--bg)' }}>
      <div style={{ padding: '18px 16px 14px', borderBottom: '1px solid var(--line)', background: 'var(--panel)', position: 'sticky', top: 0, zIndex: 10 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <button onClick={onClose} className="head" style={{ fontSize: 22, color: 'var(--text)', background: 'none', border: 'none', padding: '0 6px', cursor: 'pointer' }}>‹</button>
          <div className="head" style={{ fontSize: 20, fontWeight: 700 }}>BALANCES</div>
        </div>
      </div>

      <div style={{ padding: '12px 16px' }}>
        {CATEGORY_ORDER.map(key => {
          const cat = categories[key];
          if (cat.jobs.length === 0) return null;
          return (
            <div key={key} style={rowStyle}>
              <button onClick={() => toggleExpanded(key)}
                style={{ width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '13px 14px', background: 'none', border: 'none', cursor: 'pointer' }}>
                <div style={{ textAlign: 'left' }}>
                  <div className="head" style={{ fontSize: 15, fontWeight: 700, color: 'var(--text)' }}>{cat.label}</div>
                  <div className="mono" style={{ fontSize: 10, color: 'var(--muted)', marginTop: 2 }}>

                  <span className="mono" style={{ fontSize: 11, color: 'var(--muted)' }}>{expandedKeys.has(key) ? '▲' : '▼'}</span>

        {CATEGORY_ORDER.every(key => categories[key].jobs.length === 0) && (
          <div className="mono" style={{ textAlign: 'center', color: 'var(--muted)', padding: '30px 0', fontSize: 13 }}>No outstanding balances</div>
        )}

        <div style={{ marginTop: 24, marginBottom: 8 }}>
          <div className="mono" style={{ fontSize: 11, color: 'var(--brass-bright)', letterSpacing: '0.08em', marginBottom: 8 }}>COLLECTED</div>
          <div style={{ display: 'flex', gap: 8, marginBottom: 10 }}>

                style={{ width: '100%', boxSizing: 'border-box', fontSize: 12, padding: '6px 8px' }} />
            </div>
            <div style={{ flex: 1 }}>
              <div className="mono" style={{ fontSize: 10, color: 'var(--muted)', marginBottom: 4 }}>TO</div>
              <input type="date" value={toDate} onChange={e => setToDate(e.target.value)} className="mono"
                style={{ width: '100%', boxSizing: 'border-box', fontSize: 12, padding: '6px 8px' }} />
            </div>
          </div>
          <div style={rowStyle}>
            <div style={{ padding: '13px 14px', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <div className="head" style={{ fontSize: 15, fontWeight: 700, color: 'var(--text)' }}>TOTAL COLLECTED</div>
              <div className="mono" style={{ fontSize: 17, fontWeight: 700, color: 'var(--green)' }}>{collectedLoading ? '…' : money(collected.total)}</div>
            </div>
            {!collectedLoading && collected.rows.length > 0 && (
              <div style={{ borderTop: '1px solid var(--line)', padding: '6px 14px 12px' }}>
                {collected.rows.map((r, i) => (
                  <JobRow key={r.job.id} j={r.job} first={i === 0} dateLabel={fmtTimestamp(r.at)} />
                ))}
              </div>
            )}
            {!collectedLoading && collected.rows.length === 0 && (
              <div className="mono" style={{ fontSize: 12, color: 'var(--muted)', padding: '0 14px 14px' }}>No payments recorded in this range</div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── App ───────────────────────────────────────────────────────────────────── */

  const [adding, setAdding] = useState(false);

  const [clockSession, setClockSession] = useState(() => {

  const [billingPaidPromptId, setBillingPaidPromptId] = useState(null); // job id to ask "is this paid?" after billing chore
  const [fieldTimeConfirm, setFieldTimeConfirm] = useState(null); // { type:'clockIn'|'moveJob'|'flipOnSite'|'clockOut'|'pause'|'resume', jobId?, status?, showDate? }
  const [fieldConfirmTime, setFieldConfirmTime] = useState(() => nowTimeHHMM());

  const [pendingMapsJob, setPendingMapsJob] = useState(null); // job object awaiting "Want directions?" prompt

  const [showMenu, setShowMenu] = useState(false);

  const clockSessionRef = useRef(clockSession); // latest clockSession for reconcile (avoids stale closures)
  useEffect(() => { clockSessionRef.current = clockSession; }, [clockSession]);
  // Guards clockIn/clockOut/flipToOnSite/moveToInRoute/pauseClock/resumeClock against
  // overlapping (double-tap) invocations racing each other's stale clockSession closure.
  const clockActionInFlight = useRef(false);

  function showToast(msg, isError=false) {
    if (toastTimer.current) clearTimeout(toastTimer.current);
    setToast({ msg, isError });
    toastTimer.current = setTimeout(() => setToast(null), 3000);
  }

  async function processVoiceCommand(transcript) {
    const words = transcript.trim().split(/\s+/);
    if (words.length < 2) return; // single-word STT artifact — ignore silently
    showToast(`"${transcript}"`);
    try {
      const jobSummary = jobs.slice(0,30).map(j =>
        `id:${j.id} customer:"${j.customer}" type:"${j.type}" status:"${j.status}" date:${j.scheduled_date||'?'}`
      ).join('\n');
      const userSummary = users.map(u => `id:${u.id} name:"${u.name}"`).join('\n');

      // Determine current screen so Claude routes commands correctly
      const currentScreen = showChoresView ? 'chores'
        : selectedId ? `job_detail:${selectedId}`
        : adding ? 'new_job_form'
        : 'dashboard';

      const res = await fetch(CLAUDE_PROXY, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_KEY}` },
        body: JSON.stringify({
          model: 'claude-haiku-4-5-20251001',
          max_tokens: 300,
          messages: [{ role: 'user', content:
            `You are a voice assistant for an HVAC field service app. Today: ${todayISO()}. User: ${currentUser?.name||'tech'}.
Current screen: ${currentScreen}
Jobs:\n${jobSummary}
Users:\n${userSummary}

Parse this voice command and reply ONLY with JSON (no markdown).

Intent rules (apply in this exact priority order):
1. If transcript contains "note", "notes", "write down", "log", "record", "add that" → ALWAYS "add_note"
2. If command is a status change (on site, in progress, completed, etc.) → "update_status"
3. If command is adding a new job → "add_job"
4. If command is navigating to a customer → "navigate"
5. If command uses explicit task/reminder language ("remind", "don't forget", "pick up", "order parts", "call", "follow up", "schedule") → "add_chore"
6. If current screen is "chores" → "add_chore"
7. If current screen starts with "job_detail" → default to "add_note" (observations, what was found, what was done, customer info all go here)
8. Otherwise → "unknown"
{"intent":"add_job"|"add_chore"|"navigate"|"update_status"|"add_note"|"search"|"unknown",
"customer":null,"job_type":null,"status":null,"note":null,"query":null,
"date":null,"job_id":null,"description":null,"assigned_to_name":null,
"reply":"brief friendly confirmation under 12 words"}

Command: "${transcript}"`
          }],
        }),
      });
      const data = await res.json();
      const text = (data.content?.[0]?.text || '').trim();
      const m = text.match(/\{[\s\S]*\}/);
      if (!m) throw new Error('no json');
      const intent = JSON.parse(m[0]);

      showToast(intent.reply || 'Done');

      if (intent.intent === 'add_chore') {
        const desc = intent.description || intent.note || transcript;
        const assigneeUser = intent.assigned_to_name
          ? users.find(u => u.name.toLowerCase().includes(intent.assigned_to_name.toLowerCase()))
          : null;
        // "remind me/myself to..." (self-referential, no other name spoken) — a personal
        // reminder that outranks other assigned + unassigned chores (see sortChoresForUser).
        const isReminder = /\bremind(er)?\s+(me|myself)\b/i.test(transcript);
        const assignedToId = assigneeUser?.id || (isReminder ? currentUser?.id : null) || null;
        const choreKind = isReminder ? 'reminder' : null;
        const jobIdForChore = intent.job_id || (selectedId && currentScreen.startsWith('job_detail') ? selectedId : null);
        const { data: choreData, error: choreErr } = await sb.from('chores').insert({
          description: desc,
          job_id: jobIdForChore || null,
          assigned_to: assignedToId,
          priority: choreKind,
          status: 'open',
          created_at: new Date().toISOString(),
          updated_at: new Date().toISOString(),
        }).select().single();
        if (choreErr) { showToast(`Error: ${choreErr.message}`, true); return; }
        setChores(cs => [{ id: choreData.id, kind: choreKind, job_id: jobIdForChore || null,
          assigned_to: assignedToId,
          label: desc, created: todayISO(), done: false }, ...cs]);
        showToast(isReminder ? 'Reminder added' : 'Chore added');
      } else if (intent.intent === 'add_job') {
        const pre = {};
        if (intent.customer) pre.customer = intent.customer;
        if (intent.job_type) pre.type = intent.job_type;
        if (intent.date) pre.scheduled_date = intent.date === 'today' ? todayISO() : intent.date;
        if (intent.note) pre.notes = intent.note;
        setVoicePreFill(pre);
        setAdding(true);
      } else if (intent.intent === 'navigate') {
        const match = jobs.find(j =>
          intent.job_id ? j.id === intent.job_id :
          intent.customer ? j.customer.toLowerCase().includes(intent.customer.toLowerCase()) : false
        );
        if (match) setSelectedId(match.id);
        else showToast(`No job found for "${intent.customer}"`, true);
      } else if (intent.intent === 'search') {
        setSearch(intent.query || intent.customer || '');
        setSelectedId(null);
      } else if (intent.intent === 'update_status' && intent.status) {
        const match = jobs.find(j =>
          intent.job_id ? j.id === intent.job_id :
          intent.customer ? j.customer.toLowerCase().includes(intent.customer.toLowerCase()) : false
        );
        if (match) await updateJob(match.id, { status: intent.status });
        else showToast(`No job found for "${intent.customer}"`, true);
      } else if (intent.intent === 'add_note') {
        const noteContent = intent.note || transcript;
        const match = jobs.find(j =>
          intent.job_id ? j.id === intent.job_id :
          selectedId ? j.id === selectedId :
          intent.customer ? j.customer.toLowerCase().includes(intent.customer.toLowerCase()) : false
        );
        if (match) {
          // Merge into today's shared log entry (typed or voice) for this job — app TZ day.
          const dayStart = zonedWallToISO(todayLocalISO(), '00:00');
          const dayEnd   = zonedWallToISO(shiftDateISO(todayLocalISO(), 1), '00:00');
          const { data: existing } = await sb.from('job_notes')
            .select('id, content').eq('job_id', match.id).in('source', ['voice', 'text'])
            .gte('created_at', dayStart).lt('created_at', dayEnd)
            .order('created_at', { ascending: false }).limit(1).maybeSingle();
          if (existing) {
            await sb.from('job_notes').update({ content: existing.content + '\n' + noteContent }).eq('id', existing.id);
            showToast('Note updated');
          } else {
            await sb.from('job_notes').insert({
              job_id: match.id, content: noteContent,
              source: 'voice', created_at: new Date().toISOString(),
            });
            showToast('Note added');
          }
          if (selectedId === match.id) refresh();
        } else {
          showToast(`No job found — note not saved`, true);
        }
      }
    } catch(err) {
      showToast('Voice command failed', true);
      console.error('voice error', err);
    }
  }

  function selectUser(user) {
    localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(user));
    setCurrentUser(user);
    setClockSession(loadClockSession(user.id));
    setBrowseMode(false);
  }
  function switchUser() {
    localStorage.removeItem(CURRENT_USER_KEY);
    setCurrentUser(null);
    setClockSession(null);
    setBrowseMode(false);
  }

  // Reconcile the per-device clockSession against the shared job_crew table (source of truth).
  // Fixes: (a) top bar stuck "In Route" after a teammate marks you On Site — the DB row updates
  // but the local session doesn't; (b) a stale local session lingering on another device after
  // you clocked out elsewhere — its crew row is gone, so clear it instead of nagging.
  const reconcileClockFromCrew = useCallback(async () => {
    if (!currentUser?.id) return;
    const { data, error } = await sb.from('job_crew')
      .select('job_id, status, status_at')
      // 'Paused' counts as an active session — omitting it here would make the reconcile
      // read a paused tech as "clocked out elsewhere" and wipe their local session.
      .eq('user_id', currentUser.id).in('status', ['In Route', 'On Site', 'Paused', 'Materials Run', 'Shop Run'])
      .order('status_at', { ascending: false });
    if (error) return; // network guard — never act on a failed fetch
    const mine = (data && data[0]) || null;
    const sess = clockSessionRef.current;
    if (!sess) return; // no local session — leave to orphanCrewEntry recovery
    if (!mine) {
      // Session was closed elsewhere (clocked out on another device) → drop the dead local copy.
      saveClockSession(currentUser.id, null);
      setClockSession(null);
      setStaleClock(null);
      return;
    }
    // Sync local status/job to the DB row if a teammate (or another device) changed it.
    let synced = sess;
    if (mine.status !== sess.status || mine.job_id !== sess.jobId) {
      synced = { ...sess, status: mine.status, jobId: mine.job_id,
        // same-job In Route→On Site is one continuous leg (keep legStartedAt); a job change adopts status_at
        legStartedAt: mine.job_id !== sess.jobId ? mine.status_at : sess.legStartedAt };
      saveClockSession(currentUser.id, synced);
      setClockSession(synced);
    }
    // Staleness is judged by the crew row's status_at (real activity), not the old local startedAt.
    const sinceDate = todayLocalISO(new Date(mine.status_at));
    if (sinceDate !== todayLocalISO()) setStaleClock({ session: synced, sinceDate });
    else setStaleClock(null);
  }, [currentUser?.id]);

  useEffect(() => {
    if (!currentUser) return;
    reconcileClockFromCrew();
    const t = setInterval(reconcileClockFromCrew, 60000);
    window.addEventListener('focus', reconcileClockFromCrew);
    return () => { clearInterval(t); window.removeEventListener('focus', reconcileClockFromCrew); };
  }, [currentUser?.id, reconcileClockFromCrew]);

  const refresh = useCallback(async () => {
    const [jobData, choreData, userData] = await Promise.all([fetchJobs(), fetchChores(), fetchUsers()]);
    if (jobData === null) {
      showToast("Can't reach Supabase — showing cached data", true);
    } else {
      setRlsWarning(jobData.length === 0);
      setJobs(jobData);
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(jobData)); } catch(e){}
    }
    setChores(choreData);
    if (userData) setUsers(userData);
    setLoading(false);
  }, []);

  useEffect(() => {
    if (!currentUser) return;
    refresh();
    ensureShopSentinel().then(touched => { if (touched) refresh(); }).catch(console.warn);
    window.addEventListener('focus', refresh);
    const timer = setInterval(refresh, 60000); // auto-refresh every 60s
    return () => { window.removeEventListener('focus', refresh); clearInterval(timer); };
  }, [currentUser, refresh]);

  // On fresh app open, jump straight to the job the tech is currently on
  useEffect(() => {
    if (!currentUser) return;
    if (clockSession?.jobId) {
      setSelectedId(clockSession.jobId);
    } else {
      fetchActiveCrewAssignments().then(assignments => {
        const mine = assignments.find(a => a.user_id === currentUser.id && ['On Site','In Route',...ON_BREAK_STATUSES].includes(a.status));
        if (mine) setSelectedId(mine.job_id);
      });
    }
    fetchUnreadNotifications(currentUser.id).then(notifs => {
      if (notifs.length > 0) setPendingNotifs(notifs);
    });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [currentUser]);

  // Check for orphaned crew session (localStorage cleared while still clocked in)
  useEffect(() => {
    if (!currentUser?.id || clockSession) { setOrphanCrewEntry(null); return; }
    sb.from('job_crew').select('job_id, status, status_at')
      .eq('user_id', currentUser.id).limit(1).maybeSingle()
      .then(({ data }) => setOrphanCrewEntry(data || null));
  }, [currentUser?.id, !!clockSession]);

  async function dismissNotifs() {
    if (!currentUser?.id) return;
    await sb.from('notifications').update({ read: true })
      .eq('user_id', currentUser.id).eq('read', false);
    setPendingNotifs([]);
  }

  /* ── Clock in/out ── */
  function handleClockIn(jobId, status) {
    setShowClockIn(false);
    setFieldConfirmTime(nowTimeHHMM());
    setFieldTimeConfirm({ type: 'clockIn', jobId, status });
  }
  function handleMoveToInRoute(newJobId) {
    setShowMoveJob(false);
    setFieldConfirmTime(nowTimeHHMM());
    setFieldTimeConfirm({ type: 'moveJob', jobId: newJobId });
  }
  function handleFlipToOnSite() {
    setFieldConfirmTime(nowTimeHHMM());
    setFieldTimeConfirm({ type: 'flipOnSite' });
  }
  function handleClockOut(jobStatus) {
    setShowClockOut(false);
    setFieldConfirmTime(nowTimeHHMM());
    // If the current leg started on an earlier day (forgot to clock out overnight), default
    // the date field to that day and show it — otherwise it's today's date, hidden as usual.
    const legStart = clockSession?.legStartedAt || clockSession?.startedAt;
    const legDay = legStart ? dateISOInTZ(new Date(legStart), getAppTZ()) : todayLocalISO();
    setFieldConfirmDate(legDay);
    setFieldTimeConfirm({ type: 'clockOut', jobStatus, showDate: legDay !== todayLocalISO() });
  }
  function handlePause(reason, billTo) {
    setShowPause(false);
    setFieldConfirmTime(nowTimeHHMM());
    setFieldTimeConfirm({ type: 'pause', reason, billTo });
  }
  function handleResume() {
    setFieldConfirmTime(nowTimeHHMM());
    setFieldTimeConfirm({ type: 'resume' });
  }

  // Pause the clock without clocking out: banks the leg so far, writes a 'Status → X' note
  // tagged with the reason (and bill target, for paid reasons), and flips the shared crew row.
  // Plain breaks (lunch/washy washy/other) close the timeline period — CLOSES it, so that
  // span counts zero in every report. 'Materials Run'/'Shop Run' are real field statuses
  // instead, so the span between pause and resume counts as worked time.
  async function pauseClock(reason, at = new Date().toISOString(), billTo = null) {
    if (clockActionInFlight.current) return;
    clockActionInFlight.current = true;
    try {
      if (!clockSession?.jobId || ON_BREAK_STATUSES.includes(clockSession.status)) return;
      const { jobId, startedAt, legStartedAt } = clockSession;
      const status = PAUSE_STATUS_MAP[reason] || 'Paused';
      const ok = await upsertJobCrewStatus(jobId, currentUser.id, status, at);
      if (!ok) { showToast('Could not pause — ' + (lastJobCrewError?.message || 'check connection'), true); return; }
      const billTag = billTo ? ` · bill:${billTo}` : '';
      await sb.from('job_notes').insert({
        job_id: jobId, content: `Status → ${status} (${currentUser.name}) — ${reason}${billTag}`,
        source: 'system', created_at: at, user_id: currentUser.id,
      });
      // Bank the worked leg BEFORE the pause anchor moves (leg-banking invariant). Only bank
      // into today's bucket if `at` actually falls today — a backdated pause (rare, but possible
      // via the same rewind mechanism as clockOut) must not inflate today's live total.
      if (dateISOInTZ(new Date(at), getAppTZ()) === todayLocalISO()) {
        addTodayMs(currentUser.id, new Date(at).getTime() - new Date(legStartedAt || startedAt).getTime());
      }
      const session = { ...clockSession, status, prevStatus: clockSession.status,
        pausedReason: reason, pausedAt: at, billTo, legStartedAt: at };
      saveClockSession(currentUser.id, session);
      setClockSession(session);
      refresh();
    } finally {
      clockActionInFlight.current = false;
    }
  }

  async function resumeClock(at = new Date().toISOString()) {
    if (clockActionInFlight.current) return;
    clockActionInFlight.current = true;
    try {
      if (!clockSession?.jobId || !ON_BREAK_STATUSES.includes(clockSession.status)) return;
      const back = clockSession.prevStatus === 'In Route' ? 'In Route' : 'On Site';
      // Materials Run/Shop Run are real, counted legs — bank this leg like any other transition.
      // Plain Paused already contributed nothing (never a field status), so nothing to bank there.
      // Only bank into today's bucket if `at` actually falls today (see pauseClock's same guard).
      if (clockSession.status !== 'Paused' && dateISOInTZ(new Date(at), getAppTZ()) === todayLocalISO()) {
        addTodayMs(currentUser.id, new Date(at).getTime() - new Date(clockSession.legStartedAt).getTime());
      }
      const ok = await upsertJobCrewStatus(clockSession.jobId, currentUser.id, back, at);
      if (!ok) { showToast('Could not resume — ' + (lastJobCrewError?.message || 'check connection'), true); return; }
      await sb.from('job_notes').insert({
        job_id: clockSession.jobId, content: `Status → ${back} (${currentUser.name}) — back from ${clockSession.pausedReason || 'break'}`,
        source: 'system', created_at: at, user_id: currentUser.id,
      });
      const session = { jobId: clockSession.jobId, status: back,
        startedAt: clockSession.startedAt, legStartedAt: at };
      saveClockSession(currentUser.id, session);
      setClockSession(session);
      refresh();
    } finally {
      clockActionInFlight.current = false;
    }
  }

  async function undoClockAction() {
    if (!clockUndo) return;
    const { prevSession, restore, clear, noteIds } = clockUndo;
    // Delete the undone transition's notes too — left behind, they start/end phantom
    // timeline periods that reverting the crew rows alone never cleans up.
    for (const id of (noteIds || [])) await sb.from('job_notes').delete().eq('id', id);
    for (const { jobId, status } of (restore || [])) await upsertJobCrewStatus(jobId, currentUser.id, status);
    // Raw clear (no Cleared note): undo reverts the transition, it doesn't end a real period.
    for (const { jobId } of (clear || [])) await clearJobCrewStatus(jobId, currentUser.id);
    saveClockSession(currentUser.id, prevSession);
    setClockSession(prevSession);
    setClockUndo(null);
  }

  async function clockIn(jobId, status, at = new Date().toISOString()) {
    if (clockActionInFlight.current) return;
    clockActionInFlight.current = true;
    try {
      try {
        const crewResult = await upsertJobCrewStatus(jobId, currentUser.id, status, at);
        if (!crewResult) { showToast('Could not save crew status — ' + (lastJobCrewError?.message || 'check connection'), true); return; }
        const job = jobs.find(j => j.id === jobId);
        const wIdx = s => WORKFLOW_STATUSES.indexOf(s);
        if (job && job.customer?.toUpperCase() !== ABC_SHOP_NAME && wIdx(job.status) < wIdx('In Progress')) {
          await updateJob(jobId, { status: 'In Progress', _skipNote: true });
        }
        const { data: inNote } = await sb.from('job_notes').insert({
          job_id: jobId, content: `Status → ${status} (${currentUser.name})`,
          source: 'system', created_at: at, user_id: currentUser.id,
        }).select().single();
        const session = { jobId, status, startedAt: at, legStartedAt: at };
        setClockUndo({ prevSession: null, restore: [], clear: [{ jobId }], noteIds: inNote ? [inNote.id] : [] });
        saveClockSession(currentUser.id, session);
        setClockSession(session);
        setShowClockIn(false);
        setSelectedId(jobId);
        refresh();
        // Open chores are the first thing a tech sees after clocking in (skip if there are none).
        if (chores.some(c => !c.done)) setShowChoresGate(true);
        if (status === 'In Route') {
          const addr = (siteAddr(job) || custAddr(job)).trim();
          if (addr) setPendingMapsJob(job);
        }
      } catch(e) {
        showToast('Clock in failed — ' + (e.message || 'check connection'), true);
      }
    } finally {
      clockActionInFlight.current = false;
    }
  }

  async function clockOut(jobStatus, at = new Date().toISOString()) {
    if (clockActionInFlight.current) return;
    clockActionInFlight.current = true;
    try {
      if (!clockSession) return;
      const { jobId, startedAt, legStartedAt } = clockSession;
      const undo = { prevSession: clockSession, restore: jobId ? [{ jobId, status: clockSession.status }] : [], clear: [], noteIds: [] };
      const wasShop = jobId && jobs.find(j => j.id === jobId)?.customer?.toUpperCase() === ABC_SHOP_NAME;
      if (jobId) {
        const { note: outNote } = await clearCrewWithNote(jobId, currentUser.id, currentUser.name, at, '', currentUser.id);
        if (outNote?.id) undo.noteIds.push(outNote.id);
        if (jobStatus) await updateJob(jobId, { status: jobStatus, _skipNote: true });
        // Clocking out is Jack leaving for the day, not heading somewhere else — never ask
        // "is so-and-so coming with you" here (that's moveToInRoute's question). Anyone still
        // on site stays exactly as they are; only they (or someone else) can change their status.
        if (wasShop) {
          setPendingShopActivity({ shopJobId: jobId, startedAt: legStartedAt || startedAt, mapsJobId: null });
        }
      }
      // From Paused the leg was already banked at pause time — banking again would count the break.
      // Only bank into today's bucket if `at` actually falls today — a clock-out backdated to a
      // prior day (the CONFIRM TIME date field, shown when a leg crossed midnight) must not
      // inflate today's live total; that day's real hours already live in job_notes.
      if (clockSession.status !== 'Paused' && dateISOInTZ(new Date(at), getAppTZ()) === todayLocalISO()) {
        addTodayMs(currentUser.id, new Date(at).getTime() - new Date(legStartedAt || startedAt).getTime());
      }
      saveClockSession(currentUser.id, null);
      setClockSession(null);
      setClockUndo(undo);
      setShowClockOut(false);
      refresh();
    } finally {
      clockActionInFlight.current = false;
    }
  }

  // Stale prior-day session: close it at the chosen time, writing the Cleared note for HoursReport.
  // Does NOT touch addTodayMs (that bucket is keyed to today; the prior day's hours live in job_notes).
  async function clockOutStale(atISO) {
    const sess = staleClock?.session;
    setStaleClock(null);
    if (!sess || !currentUser) return;
    if (sess.jobId) {
      await clearCrewWithNote(sess.jobId, currentUser.id, currentUser.name, atISO, '', currentUser.id);
    }
    saveClockSession(currentUser.id, null);
    setClockSession(null);
    refresh();
  }

  // Stale prior-day session: keep working. Re-anchor the session to now so today's total
  // starts clean and the stale prompt doesn't fire again on reload.
  async function keepStaleClock() {
    const sess = staleClock?.session;
    setStaleClock(null);
    if (!sess || !currentUser) return;
    const now = new Date().toISOString();
    const session = { ...sess, startedAt: now, legStartedAt: now };
    saveClockSession(currentUser.id, session);
    setClockSession(session);
    // Re-stamp the shared crew row to now so reconcileClockFromCrew won't re-flag it as prior-day.
    if (sess.jobId) await upsertJobCrewStatus(sess.jobId, currentUser.id, sess.status);
  }

  async function flipToOnSite(at = new Date().toISOString()) {
    if (clockActionInFlight.current) return;
    clockActionInFlight.current = true;
    try {
      if (!clockSession?.jobId) return;
      const undo = { prevSession: clockSession, restore: [{ jobId: clockSession.jobId, status: 'In Route' }], clear: [], noteIds: [] };
      await upsertJobCrewStatus(clockSession.jobId, currentUser.id, 'On Site', at);
      const job = jobs.find(j => j.id === clockSession.jobId);
      const wIdx = s => WORKFLOW_STATUSES.indexOf(s);
      if (job && job.customer?.toUpperCase() !== ABC_SHOP_NAME && wIdx(job.status) < wIdx('In Progress')) {
        await updateJob(clockSession.jobId, { status: 'In Progress', _skipNote: true });
      }
      const { data: onSiteNote } = await sb.from('job_notes').insert({
        job_id: clockSession.jobId, content: `Status → On Site (${currentUser.name})`,
        source: 'system', created_at: at, user_id: currentUser.id,
      }).select().single();
      if (onSiteNote) undo.noteIds.push(onSiteNote.id);
      const remaining = await fetchJobCrew(clockSession.jobId);
      const othersInRoute = remaining.filter(c => c.status === 'In Route' && c.user_id !== currentUser.id);
      const inRouteUsers = users.filter(u => othersInRoute.find(c => c.user_id === u.id));
      if (inRouteUsers.length > 0) setJoiningOnSiteCheck({ members: inRouteUsers, jobId: clockSession.jobId });
      // In Route → On Site is the same continuous leg — do NOT reset legStartedAt or bank,
      // or the in-route minutes vanish from today's total.
      const session = { ...clockSession, status: 'On Site' };
      saveClockSession(currentUser.id, session);
      setClockSession(session);
      setClockUndo(undo);
      refresh();
    } finally {
      clockActionInFlight.current = false;
    }
  }

  async function moveToInRoute(newJobId, at = new Date().toISOString()) {
    if (clockActionInFlight.current) return;
    clockActionInFlight.current = true;
    try {
      try {
        const { jobId: oldJobId, startedAt } = clockSession;
        const undo = {
          prevSession: clockSession,
          restore: oldJobId ? [{ jobId: oldJobId, status: clockSession.status }] : [],
          clear: [{ jobId: newJobId }],
          noteIds: [],
        };
        let isLastOut = false;
        let hasCrew = false;
        const wasShop = oldJobId && jobs.find(j => j.id === oldJobId)?.customer?.toUpperCase() === ABC_SHOP_NAME;
        const shopLegStart = clockSession.legStartedAt || startedAt;
        // bank the leg we're leaving into today's running total before the new leg starts
        // (skip from Paused — that leg was already banked when the pause started)
        if (clockSession.status !== 'Paused') {
          addTodayMs(currentUser.id, Date.now() - new Date(shopLegStart).getTime());
        }
        if (oldJobId) {
          const { note: leaveNote } = await clearCrewWithNote(oldJobId, currentUser.id, currentUser.name, at, '', currentUser.id);
          if (leaveNote?.id) undo.noteIds.push(leaveNote.id);
          const remaining = await fetchJobCrew(oldJobId);
          const stillOnSite = remaining.filter(c => c.status === 'On Site');
          isLastOut = stillOnSite.length === 0;
          const othersOnSite = users.filter(u => u.id !== currentUser.id && stillOnSite.find(c => c.user_id === u.id));
          if (othersOnSite.length > 0) {
            setLeavingCrewCheck({ members: othersOnSite, newJobId, oldJobId,
              mapsJobId: wasShop ? null : newJobId, someoneStayed: false,
              fromShop: wasShop, shopStartedAt: shopLegStart });
            hasCrew = true;
          }
        }
        const ok = await upsertJobCrewStatus(newJobId, currentUser.id, 'In Route', at);
        if (!ok) { showToast('Could not update crew status — ' + (lastJobCrewError?.message || 'check connection'), true); return; }
        const newJob = jobs.find(j => j.id === newJobId);
        const wIdx = s => WORKFLOW_STATUSES.indexOf(s);
        if (newJob && newJob.customer?.toUpperCase() !== ABC_SHOP_NAME && wIdx(newJob.status) < wIdx('In Progress')) {
          await updateJob(newJobId, { status: 'In Progress', _skipNote: true });
        }
        const { data: routeNote } = await sb.from('job_notes').insert({
          job_id: newJobId, content: `Status → In Route (${currentUser.name})`,
          source: 'system', created_at: at, user_id: currentUser.id,
        }).select().single();
        if (routeNote) undo.noteIds.push(routeNote.id);
        const session = { jobId: newJobId, status: 'In Route', startedAt, legStartedAt: at };
        saveClockSession(currentUser.id, session);
        setClockSession(session);
        setClockUndo(undo);
        setShowMoveJob(false);
        setSelectedId(newJobId);
        refresh();
        if (!hasCrew) {
          if (wasShop) {
            setPendingShopActivity({ shopJobId: oldJobId, startedAt: shopLegStart, mapsJobId: newJobId });
          } else {
            // No crew on the old job ⇒ last one out. Ask "is this job done?" first,
            // then fire navigation when that prompt resolves (navigation is always last).
            const oldJob = (isLastOut && oldJobId) ? jobs.find(j => j.id === oldJobId) : null;
            if (oldJob && oldJob.customer?.toUpperCase() !== ABC_SHOP_NAME) {
              setLastLeaveJob({ job: oldJob, mapsJobId: newJobId });
            } else {
              const addr = (siteAddr(newJob) || custAddr(newJob)).trim();
              if (addr) setPendingMapsJob(newJob);
            }
          }
        }
      } catch(e) {
        showToast('Move failed — ' + (e.message || 'check connection'), true);
      }
    } finally {
      clockActionInFlight.current = false;
    }
  }

  /* ── CRUD ── */
  async function addJob(job) {
    const customerId = await resolveCustomer(job);
    if (!customerId) { showToast("Could not resolve customer", true); return; }
    const { data, error } = await sb.from('jobs').insert({
      ...toRow(job, customerId, currentUser?.id),
      created_at: new Date().toISOString(),
    }).select('*, customers(*)').single();
    if (error) { showToast("Error saving job", true); console.error(error); return; }
    await sb.from('job_notes').insert({
      job_id: data.id, content: `Job created. Status: ${job.status}`,
      source: 'system', created_at: new Date().toISOString(),
    });
    const newJob = fromRow(data);
    setJobs(js => [newJob, ...js]);
    if ((job.site_name||'').trim()) await updateJobSiteName(data.id, job.site_name.trim());
    setAdding(false);
    setVoicePreFill(null);
    showToast("Job saved");
    if (job.status === "Completed/Needs Billing") spawnBillingChore(newJob);
    if (clockInAfterAdd) { const st = clockInAfterAdd; setClockInAfterAdd(null); handleClockIn(data.id, st); }
    else if (routeAfterAdd) { setRouteAfterAdd(false); await moveToInRoute(data.id); }
    else setSelectedId(data.id);
  }

  async function updateJob(id, patch) {
    const job = jobs.find(j => j.id === id);
    if (!job) return;
    const updateData = { updated_at: new Date().toISOString() };
    if ('status' in patch)        updateData.current_status = patch.status;
    if ('type' in patch)          updateData.flow_type = patch.type;
    if ('original_ask' in patch)  updateData.original_ask = patch.original_ask||null;
    if ('notes' in patch)         updateData.notes = patch.notes||null;
    if ('value' in patch)         updateData.value = Number(patch.value)||null;
    if ('scheduled_date' in patch || 'scheduled_time' in patch) {
      const d = ('scheduled_date' in patch ? patch.scheduled_date : job.scheduled_date);
      const t = ('scheduled_time' in patch ? patch.scheduled_time : job.scheduled_time);
      updateData.scheduled_at = (d && t) ? zonedWallToISO(d, t) : null;
    }
    const { error } = await sb.from('jobs').update(updateData).eq('id', id);
    if (error) { showToast("Error updating job", true); console.error(error); return; }
    if (patch.status && patch.status !== job.status && !patch._skipNote) {
      const fieldStatuses = ["In Route", "On Site"];
      const userName = currentUser?.name || null;
      // "Job status →" (not "Status →"): the plain form is reserved for crew clock events —
      // parseCrewLogEntry/fromRow read those as clocked time, so a job-status change written
      // in that format created phantom clock-in periods for whoever tapped the picker.
      const noteContent = userName ? `Job status → ${patch.status} (${userName})` : `Job status → ${patch.status}`;
      const noteRow = { job_id: id, content: noteContent, source: 'system', created_at: patch._at || new Date().toISOString() };
      if (currentUser?.id) noteRow.user_id = currentUser.id;
      await sb.from('job_notes').insert(noteRow);
      if (fieldStatuses.includes(patch.status) && currentUser?.id) {
        await sb.from('jobs').update({ assigned_to: currentUser.id }).eq('id', id);
      }
      if (patch.status === "Completed/Needs Billing") spawnBillingChore({ ...job, ...patch });
      if (patch.status === "Completed/Paid") setCloseJobPromptId(id);
    }
    // Outside the _skipNote block on purpose: clockOut() sets the final status with _skipNote,
    // and "last one out → job complete" is the most common way an install gets finished.
    if (patch.status && patch.status !== job.status && shouldPrepareWarranty({ ...job, ...patch }, patch.status)) {
      autoPrepareWarranty({ ...job, ...patch });
    }
    setJobs(js => js.map(j => j.id === id ? { ...j, ...patch } : j));
  }

  async function saveEdit(edited) {
    const prevStatus = jobs.find(j => j.id === edited.id)?.status;
    const customerId = await resolveCustomer(edited);
    if (!customerId) { showToast("Could not resolve customer", true); return; }
    const { error } = await sb.from('jobs').update(toRow(edited, customerId, currentUser?.id)).eq('id', edited.id);
    if (error) { showToast("Error saving changes", true); console.error(error); return; }
    setJobs(js => js.map(j => j.id === edited.id ? { ...j, ...edited, _customer_id: customerId } : j));
    await updateJobSiteName(edited.id, (edited.site_name||'').trim() || null);
    setEditingId(null);
    showToast("Changes saved");
    if (edited.status === "Completed/Needs Billing") spawnBillingChore({ ...edited, _customer_id: customerId });
    if (prevStatus !== edited.status && shouldPrepareWarranty(edited, edited.status)) autoPrepareWarranty({ ...edited, _customer_id: customerId });
  }

  // Purges every job_id-linked table before deleting the job itself — a job used to be
  // deletable while leaving job_notes/job_crew/job_photos/receipts/chores orphaned behind it
  // (surfaced as an unremovable "Unknown" entry in HoursReport). Bails on the first failure
  // so a partial purge can never leave a NEW orphan the same way the original bug did.
  async function deleteJob(id) {
    const { data: photos } = await sb.from('job_photos').select('storage_path').eq('job_id', id);
    if (photos?.length) await sb.storage.from('job-photos').remove(photos.map(p => p.storage_path).filter(Boolean));
    let { error } = await sb.from('job_photos').delete().eq('job_id', id);
    if (error) { showToast("Error deleting job", true); console.error(error); return; }

    const { data: receipts } = await sb.from('receipts').select('id, storage_path').eq('job_id', id);
    if (receipts?.length) {
      const allPages = receipts.flatMap(receiptPages);
      if (allPages.length) await sb.storage.from('job-photos').remove(allPages);
    }
    ({ error } = await sb.from('receipts').delete().eq('job_id', id));
    if (error) { showToast("Error deleting job", true); console.error(error); return; }

    ({ error } = await sb.from('job_notes').delete().eq('job_id', id));
    if (error) { showToast("Error deleting job", true); console.error(error); return; }

    ({ error } = await sb.from('job_crew').delete().eq('job_id', id));
    if (error) { showToast("Error deleting job", true); console.error(error); return; }

    ({ error } = await sb.from('chores').delete().eq('job_id', id));
    if (error) { showToast("Error deleting job", true); console.error(error); return; }

    ({ error } = await sb.from('jobs').delete().eq('id', id));
    if (error) { showToast("Error deleting job", true); console.error(error); return; }

    setJobs(js => js.filter(j => j.id !== id));
    setChores(cs => cs.filter(c => c.job_id !== id));
    setSelectedId(null);
    showToast("Job deleted");
  }

  async function toggleChore(choreId) {
    const chore = chores.find(c => c.id === choreId);
    if (!chore) return;
    const newStatus = chore.done ? 'open' : 'done';
    const { error } = await sb.from('chores')
      .update({ status: newStatus, updated_at: new Date().toISOString() }).eq('id', choreId);
    if (error) { showToast("Error updating chore", true); return; }
    setChores(cs => cs.map(c => c.id === choreId ? { ...c, done: !chore.done } : c));
    // Billing chore checked off → ask if paid first
    if (!chore.done && chore.kind === 'billing' && chore.job_id) {
      setBillingPaidPromptId(chore.job_id);
    }
  }
