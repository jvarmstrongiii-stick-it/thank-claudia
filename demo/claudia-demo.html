acity only:\n- AC units/heat pumps/condensers: FIRST check nameplate for a direct capacity label (COOLING CAP, RATED CAP, NOMINAL CAP, BTU/HR, BTUH) — e.g. "36,000 BTU/HR" → "3 ton (36,000 BTU)". If not directly labeled, decode from the capacity digits embedded anywhere in the model number: 018 or 18=1.5T, 024 or 24=2T, 030 or 30=2.5T, 036 or 36=3T, 042 or 42=3.5T, 048 or 48=4T, 054 or 54=4.5T, 060 or 60=5T, 072 or 72=6T, 090 or 90=7.5T, 102=8.5T, 120=10T, 150=12.5T, 180=15T, 210=17.5T, 240=20T (commercial packaged rooftop units commonly use the larger sizes)\n- Heat strips: kW × 3,412 = BTU (H6HK010 → "10 kW (34,120 BTU)")\n- Furnaces: "80,000 BTU" (080=80K, 100=100K in model)\n- Capacitors: "45+5 MFD, 440V"\n- For motors, leave tonnage null — use dedicated fields below\n\nBARCODE TEXT — if a 2D barcode (DataMatrix/QR/Code128) is visible, read the encoded text. Interlink barcodes encode: YSLB-{W}-{P}-{variant} e.g. YSLB-350-6-B001 (350W, 6-pole).\n\nPole count → RPM at 60 Hz: 2P=3450, 4P=1625, 6P=1075, 8P=825\nWatts → HP (input power, prefer printed label value): 150-180W=1/5, 190-230W=1/4, 240-370W=1/3, 371-540W=1/2, 541-700W=3/4, 701-760W=1\n\nMotor brand decoding by part number:\n- Interlink 253xxxxx: brand=Interlink, voltage=208-230V, shaft_diameter=1/2 inch; decode barcode YSLB-{W}-{P}-xxx → HP from watts, RPM from poles\n- GE/Genteq 5KCP39xx, 3S1xx, HC43xx: brand=GE/Genteq, shaft_diameter=1/2 inch\n- A.O. Smith / US Motor / Nidec F48xx, S58xx: shaft_diameter=1/2 inch\n- Century / Regal Beloit CPxx, CAxx: shaft_diameter=1/2 inch\n- Emerson K55xxx: shaft_diameter=1/2 inch\n\nMotor-specific fields (extract from label or barcode, or infer from part number):\n- horsepower: "1/4", "1/3", "1/2", "3/4", "1" — if printed on label (e.g. "1/3HP") use that value exactly; only derive from watts if HP not printed\n- rpm: "1075", "1625", "825", "1100", "3450" — derive from pole count if RPM not printed\n- shaft_diameter: "1/2 inch", "5/8 inch" — default "1/2 inch" for condenser fan motors\n\nReply with ONLY a JSON object using these exact keys (null if unknown):\n{"equipment_type":null,"brand":null,"model_number":null,"serial_number":null,"tonnage":null,"horsepower":null,"rpm":null,"shaft_diameter":null,"refrigerant":null,"voltage":null,"seer":null,"mca":null,"mop":null,"year_manufactured":null}' },
        ],
      }],
    }),
  });
  if (!apiRes.ok) { const t = await apiRes.text(); throw new Error(`API ${apiRes.status}: ${t}`); }
  const data = await apiRes.json();
  const text = (data.content[0].text || '').trim();
  const m = text.match(/\{[\s\S]*\}/);
  if (!m) throw new Error('No JSON in response');
  return finalizeScanResult(JSON.parse(m[0]));
}

// statusAt: pass the user's CONFIRMED time (fieldTimeConfirm rewind) so CREW STATUS shows
// the real transition time, not the moment the button was tapped. Defaults to now.
// lastJobCrewError: set on failure so callers can surface the real DB error instead of a
// generic "check connection" toast (e.g. a stale CHECK constraint rejecting a new status
// value) — read it synchronously right after awaiting this call, before any other crew
// update can interleave and overwrite it.
let lastJobCrewError = null;
async function upsertJobCrewStatus(jobId, userId, status, statusAt = new Date().toISOString()) {
  lastJobCrewError = null;
  const { data, error } = await sb.from('job_crew')
    .upsert({ job_id: jobId, user_id: userId, status, status_at: statusAt }, { onConflict: 'job_id,user_id' })
    .select().single();
  if (error) { lastJobCrewError = error; console.warn('upsertJobCrewStatus error', error.message || error); return null; }
  return data;
}

async function clearJobCrewStatus(jobId, userId) {
  const { error } = await sb.from('job_crew').delete().eq('job_id', jobId).eq('user_id', userId);
  if (error) console.warn('clearJobCrewStatus error', error.message || error);
  return error;
}

// Ends a person's presence on a job: clears the live crew row AND writes the closing
// "Status → Cleared" note in one step. Every path that ends someone's time on a job MUST go
// through this — a bare clearJobCrewStatus leaves a timeline period that never closes.
// (Allowed exceptions: undoClockAction, which deletes the period's start note instead, and
// deleteLogPeriod, which is removing the period entirely.)
// Returns { error } if the clear failed, else { note } — the inserted job_notes row
// (content always present) for appending to local crewLog state.
async function clearCrewWithNote(jobId, userId, personName, at, suffix = '', actorId = null) {
  const error = await clearJobCrewStatus(jobId, userId);
  if (error) return { error };
  const content = `Status → Cleared (${personName})${suffix}`;
  const { data } = await sb.from('job_notes').insert({
    job_id: jobId, content, source: 'system', created_at: at, user_id: actorId,
  }).select().single();
  return { note: data || { content } };
}

/* ── Clock session helpers ─────────────────────────────────────────────────── */
function loadClockSession(userId) {
  if (!userId) return null;
  try { return JSON.parse(localStorage.getItem(clockKey(userId))); } catch { return null; }
}
function saveClockSession(userId, session) {
  if (!userId) return;
  if (session) localStorage.setItem(clockKey(userId), JSON.stringify(session));
  else localStorage.removeItem(clockKey(userId));
}
function getTodayMs(userId) {
  if (!userId) return 0;
  try {
    const d = JSON.parse(localStorage.getItem(clockTodayKey(userId)));
    if (!d || d.date !== todayLocalISO()) return 0;
    return d.totalMs || 0;
  } catch { return 0; }
}
function addTodayMs(userId, ms) {
  if (!userId) return;
  const capped = Math.min(Math.max(0, ms), 16 * 3600000); // sanity cap: 0–16h per session leg
  const prev = getTodayMs(userId);
  localStorage.setItem(clockTodayKey(userId), JSON.stringify({ date: todayLocalISO(), totalMs: prev + capped }));
}

// Custom vendor autocomplete — replaces native <input list>/<datalist>. Android Chrome never
// renders datalist as an in-page dropdown; it funnels suggestions into its own keyboard-top
// autofill strip instead, which mixes in stale browser-cached values ahead of real vendor names
// and ignores autoComplete="off". This renders and filters the list ourselves so it actually drops down.
function VendorInput({ value, onChange, options, style }) {
  const [open, setOpen] = useState(false);
  const wrapRef = useRef(null);
  const inputRef = useRef(null);
  useEffect(() => {
    if (!open) return;
    const onDown = e => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    document.addEventListener('pointerdown', onDown);
    return () => document.removeEventListener('pointerdown', onDown);
  }, [open]);
  const q = (value||'').trim().toLowerCase();
  const matches = (options||[]).filter(v => !q || v.toLowerCase().includes(q)).slice(0, 6);
  return (
    <div ref={wrapRef} style={{ position:"relative", ...style }}>
      <input ref={inputRef} placeholder="Vendor" autoComplete="off" value={value||''}
        onChange={e => { onChange(e.target.value); setOpen(true); }}
        onFocus={() => setOpen(true)}
        onBlur={() => {
          const typed = (value||'').trim();
          const canonical = (options||[]).find(v => v.toLowerCase() === typed.toLowerCase());
          if (canonical && canonical !== value) onChange(canonical);
        }}
        style={{ width:"100%", paddingRight:24 }} />
      {(options||[]).length > 0 && (
        // Tapping the arrow browses vendors without opening the keyboard (blurs if focused);
        // tapping the text itself still focuses normally. Separate hit target, not pass-through.
        <span
          onClick={e => { e.preventDefault(); e.stopPropagation(); if (inputRef.current) inputRef.current.blur(); setOpen(true); }}
          style={{ position:"absolute", top:0, right:0, bottom:0, width:32,
            display:"flex", alignItems:"center", justifyContent:"center",
            color:"var(--muted)", fontSize:11, cursor:"pointer" }}>▼</span>
      )}
      {open && matches.length > 0 && (
        <div style={{ position:"absolute", top:"calc(100% + 2px)", left:0, right:0, zIndex:50,
          background:"var(--panel)", border:"1px solid var(--line)", borderRadius:6,
          maxHeight:160, overflowY:"auto", boxShadow:"0 4px 12px rgba(0,0,0,0.4)" }}>
          {matches.map(v => (
            <div key={v} onClick={() => { onChange(v); setOpen(false); }}
              className="mono" style={{ padding:"8px 10px", fontSize:13, cursor:"pointer", borderBottom:"1px solid var(--line)" }}>
              {v}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ── Clock components ──────────────────────────────────────────────────────── */
function ClockTimer({ startedAt, todayMs, paused }) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);
  // While paused the live leg contributes nothing — the total freezes at the banked amount.
  const legMs = paused ? 0 : Math.max(0, now - new Date(startedAt).getTime());
  const safeLegMs = Math.min(legMs, 16 * 3600000); // cap single leg at 16h
  const total = (todayMs || 0) + safeLegMs;
  const h = Math.floor(total / 3600000);
  const m = Math.floor((total % 3600000) / 60000);
  return (
    <span className="mono" style={{ fontSize:12, color: paused ? "var(--gold)" : "var(--olive-bright)", fontWeight:700 }}>
      {paused && '⏸ '}{h}:{String(m).padStart(2,'0')}
    </span>
  );
}

// Pause-reason picker: pausing stops the clock (period closes, daily total freezes)

  const fileRef = useRef();
  const uploadRef = useRef();
  const [receiptPagePrompt, setReceiptPagePrompt] = useState(null); // receipt row — "more pages?" after a snap
  const pageRef = useRef();
  const pageTargetRef = useRef(null);

  useEffect(() => {
    async function load() {
      const [{ data: rcpts }, { data: notes }, { data: liveCrew }] = await Promise.all([
        sb.from('receipts').select('*').eq('job_id', jobId).order('created_at'),
        sb.from('job_notes').select('*').eq('job_id', jobId).eq('source', 'system').order('created_at'),
        sb.from('job_crew').select('job_id, user_id, status').eq('job_id', jobId),
      ]);
      setReceipts(rcpts || []);
      fetchReceiptVendors().then(setVendorOptions);
      // Build labor summary from notes timeline. Dangling periods (no clock-out recorded,
      // no live crew row) contribute 0 and flag the row — never count "until now".
      const timeline = buildCrewTimeline(notes || [], liveCrew || [], users);
      const sumMs = (periods, status) => periods
        .filter(p => p.status === status && !p.dangling)
        .reduce((s, p) => s + (new Date(p.end || Date.now()) - new Date(p.start)), 0);
      const isRun = p => p.status === 'Materials Run' || p.status === 'Shop Run';
      const periodMs = p => new Date(p.end || Date.now()) - new Date(p.start);
      // Materials/Shop Run time billed to the shop isn't this job's labor cost — HoursReport
      // attributes it to the shop job's own bucket instead; excluded from this job entirely.
      const sumRunMs = periods => periods.filter(p => isRun(p) && !p.dangling && p.billTo !== 'shop').reduce((s, p) => s + periodMs(p), 0);
      const shopBilledMs = periods => periods.filter(p => isRun(p) && !p.dangling && p.billTo === 'shop').reduce((s, p) => s + periodMs(p), 0);
      const rows = users
        .filter(u => timeline[u.name])
        .map(u => {
          const periods = timeline[u.name] || [];
          return { name: u.name, driveMs: sumMs(periods, 'In Route'), onSiteMs: sumMs(periods, 'On Site'),
            runMs: sumRunMs(periods), shopBilledMs: shopBilledMs(periods),
            dangling: periods.some(p => p.dangling) };
        })
        .filter(r => r.driveMs + r.onSiteMs + r.runMs > 0 || r.shopBilledMs > 0 || r.dangling);
      setLaborRows(rows);
      setLoading(false);
    }
    load();
  }, [jobId]);

  async function saveReceipt(storagePath) {
    if (!rAmount && !rVendor) { setRSaving(false); return; }
    setRSaving(true);
    const { data, error } = await insertReceiptRow({
      job_id: jobId, amount: Number(rAmount) || null, vendor: rVendor || null,
      date: todayISO(), storage_path: storagePath || null, paid_by: rPaidBy || null,
      created_at: new Date().toISOString(),
    });
    setRSaving(false);
    if (error) { showToast?.('Receipt save failed: ' + error.message, true); return; }
    if (data) setReceipts(r => [...r, data]);
    setRVendor(''); setRAmount(''); setAddingReceipt(false);
  }

  async function saveReceiptEdit() {
    if (!editingReceipt) return;
    const { id, vendor, amount, date, paid_by } = editingReceipt;
    const patch = { vendor: (vendor||'').trim() || null, amount: Number(amount) || null,
      date: date || null, paid_by: paid_by || null };
    const error = await updateReceiptRow(id, patch);
    if (error) { showToast?.('Save failed: ' + error.message, true); return; }
    setReceipts(rs => rs.map(x => x.id === id ? { ...x, ...patch } : x));
    setEditingReceipt(null);
  }

  // Snap a receipt: upload, OCR, and SAVE the row immediately (survives form reset).
  async function handleReceiptFile(e) {
    const file = e.target.files?.[0];
    if (!file) { return; }
    setRScanning(true);
    try {
      const { b64, mediaType } = await readFileForScan(file);
      const path = `${jobId}/receipt-${Date.now()}.${(file.name||'jpg').split('.').pop()}`;
      const { error: upErr } = await sb.storage.from('job-photos').upload(path, file, { cacheControl:'3600', upsert:false });
      if (upErr) { showToast?.('Photo upload failed: ' + upErr.message, true); return; }
      let o = null;
      try { o = await scanReceiptFromB64(b64, mediaType); } catch (err) { console.warn('receipt OCR failed', err); }
      const vendor = (rVendor || o?.vendor || '').toString().trim() || null;
      const amount = Number(rAmount || o?.amount) || null;
      const date = /^\d{4}-\d{2}-\d{2}$/.test(o?.date || '') ? o.date : todayISO();
      const { data, error } = await insertReceiptRow({
        job_id: jobId, amount, vendor, date, storage_path: path, paid_by: rPaidBy || null,
        created_at: new Date().toISOString(),
      });
      if (error) { showToast?.('Receipt save failed: ' + error.message, true); return; }
      if (data) {
        setReceipts(r => [...r, data]);
        setReceiptPagePrompt(data); // multi-page receipts: offer to snap the next page
      }
      setRVendor(''); setRAmount(''); setAddingReceipt(false);
      showToast?.(vendor || amount ? 'Receipt saved' : 'Photo saved — add amount manually');
    } catch (err) {
      showToast?.('Receipt failed: ' + (err.message || 'error'), true);
    } finally {
      setRScanning(false);
      e.target.value = '';
    }
  }

  async function deleteReceipt(r) {
    const pages = receiptPages(r);
    if (pages.length) await sb.storage.from('job-photos').remove(pages);
    await sb.from('receipts').delete().eq('id', r.id);
    setReceipts(rs => rs.filter(x => x.id !== r.id));
    if (receiptPagePrompt?.id === r.id) setReceiptPagePrompt(null);
  }

  // Extra page for an existing receipt — see handleJobReceiptPageFile in JobDetail (same pattern).
  async function handleReceiptPageFile(e) {
    const file = e.target.files?.[0];
    const target = pageTargetRef.current;
    if (!file || !target) { if (e.target) e.target.value = ''; return; }
    setRScanning(true);
    try {
      const { storage_path, error } = await appendReceiptPage(target, jobId, file);
      if (error) { showToast?.('Page upload failed: ' + (error.message || 'error'), true); return; }
      const updated = { ...target, storage_path };
      setReceipts(rs => rs.map(x => x.id === target.id ? { ...x, storage_path } : x));
      setReceiptPagePrompt(updated);
      pageTargetRef.current = updated;
      showToast?.(`Page ${receiptPages(updated).length} saved`);
    } catch (err) {
      showToast?.('Page failed: ' + (err.message || 'error'), true);
    } finally {
      setRScanning(false);
      e.target.value = '';
    }
  }

  const totalReceiptAmt = receipts.reduce((s, r) => s + Number(r.amount || 0), 0);

  return (
    <Sheet title="BEFORE YOU CLOSE" onClose={onClose}>
      {loading ? (
        <div className="mono" style={{ fontSize:13, color:"var(--muted)", textAlign:"center", padding:20 }}>Loading…</div>
      ) : (
        <React.Fragment>
          {/* Labor summary */}
          <div className="mono" style={{ fontSize:11, color:"var(--muted)", letterSpacing:"0.08em", marginBottom:8 }}>LABOR</div>
          {laborRows.length === 0 ? (
            <div className="mono" style={{ fontSize:13, color:"var(--muted)", marginBottom:16 }}>No time logged</div>
          ) : (
            <div style={{ marginBottom:16 }}>
              {laborRows.map(r => (
                <div key={r.name} style={{ display:"flex", justifyContent:"space-between", alignItems:"center",
                  padding:"6px 0", borderBottom:"1px solid var(--line)" }}>
                  <div className="head" style={{ fontSize:14, fontWeight:700 }}>{r.name}</div>
                  <div style={{ textAlign:"right" }}>
                    <div className="mono" style={{ fontSize:13, color: r.dangling ? "var(--danger)" : "var(--olive-bright)" }}>
                      {r.dangling && '⚠️ '}{fmtElapsed(r.onSiteMs)} on site
                    </div>
                    {r.driveMs > 0 && (
                      <div className="mono" style={{ fontSize:11, color:"var(--muted)" }}>{fmtElapsed(r.driveMs)} drive</div>
                    )}
                    {r.runMs > 0 && (
                      <div className="mono" style={{ fontSize:11, color:"var(--muted)" }}>{fmtElapsed(r.runMs)} materials/shop run</div>
                    )}
                    {r.shopBilledMs > 0 && (
                      <div className="mono" style={{ fontSize:10, color:"var(--gold)" }}>+{fmtElapsed(r.shopBilledMs)} billed to shop — see Hours Report</div>
                    )}
                    {r.dangling && (
                      <div className="mono" style={{ fontSize:10, color:"var(--danger)" }}>missing clock-out — not counted</div>
                    )}
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* Receipts */}
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
            <div className="mono" style={{ fontSize:11, color:"var(--muted)", letterSpacing:"0.08em" }}>
              PARTS RECEIPTS{receipts.length > 0 ? ` (${receipts.length})` : ''}
            </div>
            {receipts.length > 0 && (
              <div className="mono" style={{ fontSize:13, color:"var(--olive-bright)", fontWeight:700 }}>
                {money(totalReceiptAmt)}
              </div>
            )}
          </div>
          {receipts.length === 0 && !addingReceipt && (
            <div className="mono" style={{ fontSize:13, color:"var(--muted)", marginBottom:12 }}>None on file</div>
          )}
          {receipts.map(r => (
            editingReceipt?.id === r.id ? (
              <div key={r.id} style={{ padding:"8px 0", borderBottom:"1px solid var(--line)" }}>
                <div style={{ display:"flex", gap:8, marginBottom:8 }}>
                  <VendorInput value={editingReceipt.vendor} options={vendorOptions}
                    onChange={v => setEditingReceipt(x => ({...x, vendor:v}))} style={{ flex:2 }} />
                  <input placeholder="$ Amount" type="number" inputMode="decimal" value={editingReceipt.amount ?? ''}
                    onChange={e => setEditingReceipt(x => ({...x, amount:e.target.value}))} style={{ flex:1 }} />
                </div>
                <div style={{ display:"flex", gap:8, marginBottom:8 }}>
                  <input type="date" value={editingReceipt.date||''}
                    onChange={e => setEditingReceipt(x => ({...x, date:e.target.value}))} style={{ flex:1 }} />
                  <select value={editingReceipt.paid_by||''} onChange={e => setEditingReceipt(x => ({...x, paid_by:e.target.value}))} style={{ flex:1 }}>
                    <option value="">Paid by…</option>
                    {users.map(u => <option key={u.id} value={u.name}>{u.name}</option>)}
                  </select>
                </div>
                <div style={{ display:"flex", gap:8 }}>
                  <button onClick={saveReceiptEdit} className="head" style={{ flex:1, padding:"8px 0", borderRadius:6, border:"none", background:"var(--olive-bright)", color:"var(--bg)", fontSize:13, fontWeight:700 }}>SAVE</button>
                  <button onClick={() => deleteReceipt(r)} className="head" style={{ padding:"8px 12px", borderRadius:6, background:"transparent", color:"var(--danger)", border:"1px solid var(--danger)", fontSize:13 }}>DELETE</button>
                  <button onClick={() => setEditingReceipt(null)} className="head" style={{ padding:"8px 12px", borderRadius:6, background:"var(--panel)", border:"1px solid var(--line)", color:"var(--muted)", fontSize:13 }}>CANCEL</button>
                </div>
              </div>
            ) : (
              <div key={r.id} style={{ display:"flex", alignItems:"center", gap:8,
                padding:"6px 0", borderBottom:"1px solid var(--line)" }}>
                {receiptPages(r).length > 0 && (
                  <img src={receiptPhotoUrl(receiptPages(r)[0])}
                    onError={e => { e.target.style.display='none'; }}
                    alt="receipt" style={{ width:36, height:36, objectFit:"cover", borderRadius:4, flexShrink:0 }} />
                )}
                <div style={{ flex:1 }}>
                  <div className="mono" style={{ fontSize:13, color:"var(--muted)" }}>{r.vendor || '—'}{receiptPages(r).length > 1 ? ` 📷×${receiptPages(r).length}` : ''}</div>
                  <div className="mono" style={{ fontSize:12, color:"var(--muted)" }}>
                    {r.amount ? money(r.amount) : '—'}{r.date ? ` · ${r.date}` : ''}{r.paid_by ? ` · paid by ${r.paid_by}` : ''}
                  </div>
                </div>
                <button onClick={() => setEditingReceipt({ id:r.id, vendor:r.vendor||'', amount:r.amount ?? '', date:r.date||'', paid_by:r.paid_by||'' })}
                  className="mono" style={{ fontSize:15, color:"var(--muted)", padding:"4px 6px" }}>✎</button>
                <button onClick={() => deleteReceipt(r)} className="mono"
                  style={{ fontSize:16, color:"var(--danger,#c0392b)", padding:"4px 6px" }}>🗑</button>
              </div>
            )
          ))}

          {receiptPagePrompt && (
            <div style={{ marginTop:8, marginBottom:4, padding:12, background:"var(--panel)", borderRadius:8, border:"1px solid var(--olive-bright)" }}>
              <div className="mono" style={{ fontSize:12, color:"var(--text)", marginBottom:8 }}>
                {receiptPages(receiptPagePrompt).length > 1
                  ? `Page ${receiptPages(receiptPagePrompt).length} saved — more pages?`
                  : 'Receipt saved — more pages?'}
              </div>
              <div style={{ display:"flex", gap:8 }}>
                <button onClick={() => { pageTargetRef.current = receiptPagePrompt; pageRef.current.click(); }}
                  className="head" disabled={rScanning}
                  style={{ flex:1, padding:"10px 0", borderRadius:6, border:"none",
                    background:"var(--olive-bright)", color:"var(--bg)", fontSize:13, fontWeight:700 }}>
                  {rScanning ? 'SAVING…' : '📷 YES — NEXT PAGE'}
                </button>
                <button onClick={() => setReceiptPagePrompt(null)} className="head" disabled={rScanning}
                  style={{ flex:1, padding:"10px 0", borderRadius:6, border:"1px solid var(--line)",
                    background:"var(--panel)", color:"var(--muted)", fontSize:13, fontWeight:700 }}>
                  NO — DONE
                </button>
              </div>
            </div>
          )}
          <input ref={pageRef} type="file" accept="image/*" capture="environment"
            style={{ display:"none" }} onChange={handleReceiptPageFile} />

          {addingReceipt ? (
            <div style={{ marginTop:10, padding:12, background:"var(--panel)", borderRadius:8, border:"1px solid var(--line)" }}>
              <div style={{ display:"flex", gap:8, marginBottom:8 }}>
                <VendorInput value={rVendor} options={vendorOptions} onChange={setRVendor} style={{ flex:2 }} />
                <input placeholder="$ Amount" type="number" inputMode="decimal" value={rAmount}
                  onChange={e => setRAmount(e.target.value)} style={{ flex:1 }} />
              </div>
              <select value={rPaidBy} onChange={e => setRPaidBy(e.target.value)} style={{ width:"100%", marginBottom:8 }}>
                <option value="">Paid by…</option>
                {users.map(u => <option key={u.id} value={u.name}>{u.name}</option>)}
              </select>
              <div style={{ display:"flex", gap:8 }}>
                <button onClick={() => fileRef.current.click()} className="head" disabled={rSaving || rScanning}
                  style={{ flex:1, padding:"8px 0", borderRadius:6, border:"1px solid var(--line)",
                    background:"var(--panel)", color:"var(--muted)", fontSize:13 }}>
                  {rScanning ? 'READING…' : '📷 SNAP'}
                </button>
                <button onClick={() => uploadRef.current.click()} className="head" disabled={rSaving || rScanning}
                  style={{ flex:1, padding:"8px 0", borderRadius:6, border:"1px solid var(--line)",
                    background:"var(--panel)", color:"var(--muted)", fontSize:13 }}>
                  🖼 UPLOAD
                </button>
                <button onClick={() => saveReceipt(null)} className="head" disabled={rSaving || rScanning || (!rVendor && !rAmount)}
                  style={{ flex:1, padding:"8px 0", borderRadius:6, border:"none",
                    background:"var(--olive-bright)", color:"var(--bg)", fontSize:13, fontWeight:700 }}>
                  {rSaving ? 'SAVING…' : 'SAVE'}
                </button>
                <button onClick={() => setAddingReceipt(false)} className="mono"
                  style={{ padding:"8px 10px", borderRadius:6, border:"1px solid var(--line)",
                    background:"var(--panel)", color:"var(--muted)", fontSize:14 }}>✕</button>
              </div>
              <input ref={fileRef} type="file" accept="image/*" capture="environment" style={{ display:"none" }}
                onChange={handleReceiptFile} />
              <input ref={uploadRef} type="file" accept="image/*" style={{ display:"none" }}
                onChange={handleReceiptFile} />
            </div>
          ) : (
            <button onClick={() => setAddingReceipt(true)} className="head"
              style={{ marginTop:8, width:"100%", padding:"8px 0", borderRadius:6,
                border:"1px dashed var(--line)", background:"none", color:"var(--muted)", fontSize:13 }}>
              + ADD RECEIPT
            </button>
          )}

          {/* Actions */}
          <div style={{ display:"flex", gap:12, marginTop:20 }}>
            <button onClick={onConfirm} className="head"
              style={{ flex:1, padding:16, fontSize:16, fontWeight:700, borderRadius:10,
                background:"var(--olive-bright)", color:"var(--bg)", border:"none" }}>
              CLOSE JOB
            </button>
            <button onClick={onClose} className="head"
              style={{ flex:1, padding:16, fontSize:16, fontWeight:700, borderRadius:10,
                background:"var(--panel)", border:"1px solid var(--line)", color:"var(--muted)" }}>
              NOT YET
            </button>
          </div>
        </React.Fragment>
      )}
    </Sheet>
  );
}

function ClockGate({ userName, onClockIn, onBrowse, onUndo, onSwitchUser }) {
  return (
    <div style={{ position:"fixed", inset:0, zIndex:200, display:"flex", flexDirection:"column",
      alignItems:"center", justifyContent:"center", gap:16, padding:32, background:"var(--bg)" }}>
      <div className="head" style={{ textAlign:"center", lineHeight:1.1 }}>
        <div style={{ fontSize:52, fontWeight:700 }}>ABC</div>
        <div style={{ fontSize:52, fontWeight:700, color:"var(--brass-bright)" }}>MECHANICAL</div>
      </div>
      <div style={{ textAlign:"center", marginTop:8 }}>
        <div className="mono" style={{ fontSize:18, color:"var(--muted)", letterSpacing:"0.12em" }}>{userName.toUpperCase()}</div>
        <button onClick={onSwitchUser} className="mono"
          style={{ fontSize:13, color:"var(--brass-bright)", background:"none", border:"none",
            padding:0, textDecoration:"underline", cursor:"pointer", letterSpacing:"0.05em", marginTop:4 }}>
          not you?
        </button>
      </div>
      <div style={{ height:24 }} />
      <button onClick={onClockIn} className="head"
        style={{ width:"100%", maxWidth:340, padding:20, fontSize:18, fontWeight:700, borderRadius:12,
          background:"var(--olive-bright)", color:"var(--bg)", border:"none" }}>
        CLOCK IN
      </button>
      <button onClick={onBrowse} className="head"
        style={{ width:"100%", maxWidth:340, padding:20, fontSize:15, fontWeight:700, borderRadius:12,
          background:"var(--panel)", border:"1px solid var(--line)", color:"var(--text)" }}>
        BROWSE AFTER HOURS
      </button>
      {onUndo && (
        <button onClick={onUndo} className="head"
          style={{ marginTop:8, padding:"10px 32px", borderRadius:20,
            background:"var(--olive-bright)", border:"2px solid var(--olive)",
            color:"var(--bg)", fontSize:15, fontWeight:700 }}>
          UNDO
        </button>
      )}
    </div>
  );
}

function ClockInSheet({ jobs, onConfirm, onClose, onNewJob }) {
  const [step, setStep] = useState(1);
  const [status, setStatus] = useState(null);
  const FIELD_DONE = ['Completed/Needs Billing','Billed/Waiting for Payment','Completed/Paid','Closed'];
  const shopJob = (jobs || []).find(j => j.customer?.toUpperCase() === ABC_SHOP_NAME && !FIELD_DONE.includes(j.status));
  const openJobs = (jobs || [])
    .filter(j => !FIELD_DONE.includes(j.status) && j.customer?.toUpperCase() !== ABC_SHOP_NAME)
    .slice().sort((a, b) => (a.customer || '').localeCompare(b.customer || ''));

  if (step === 1) return (
    <Sheet title="CLOCK IN" onClose={onClose}>
      <div className="mono" style={{ fontSize:12, color:"var(--muted)", marginBottom:18 }}>WHERE ARE YOU HEADED?</div>
      <div style={{ display:"flex", gap:12 }}>
        <button onClick={() => { setStatus('In Route'); setStep(2); }} className="head"
          style={{ flex:1, padding:18, fontSize:16, fontWeight:700, borderRadius:10,
            background:"var(--panel)", border:"1px solid var(--olive)", color:"var(--text)" }}>
          IN ROUTE
        </button>
        <button onClick={() => { setStatus('On Site'); setStep(2); }} className="head"
          style={{ flex:1, padding:18, fontSize:16, fontWeight:700, borderRadius:10,
            background:"var(--olive-bright)", color:"var(--bg)", border:"none" }}>
          ON SITE
        </button>
      </div>
    </Sheet>
  );

  return (
    <Sheet title={`CLOCK IN — ${status.toUpperCase()}`} onClose={onClose}>
      <div className="mono" style={{ fontSize:12, color:"var(--muted)", marginBottom:12 }}>PICK A JOB</div>
      <button onClick={() => onNewJob(status)} className="head"
        style={{ width:"100%", padding:"14px 16px", marginBottom:8, borderRadius:9, fontSize:15, fontWeight:700,
          textAlign:"left", background:"var(--olive-bright)", color:"var(--bg)", border:"none" }}>
        + NEW JOB
      </button>
      {shopJob && (
        <button onClick={() => onConfirm(shopJob.id, status)} className="head"
          style={{ width:"100%", padding:"14px 16px", marginBottom:8, borderRadius:9, fontSize:15, fontWeight:700,
            textAlign:"left", background:"var(--panel)", border:"1px solid var(--brass)", color:"var(--brass-bright)" }}>
          SHOP
        </button>
      )}
      <div style={{ display:"flex", flexDirection:"column", gap:6, maxHeight:380, overflowY:"auto" }}>
        {openJobs.map(j => (
          <button key={j.id} onClick={() => onConfirm(j.id, status)} className="head"
            style={{ padding:"12px 14px", borderRadius:8, fontSize:14, fontWeight:700, textAlign:"left",
              background:"var(--panel)", border:"1px solid var(--line)", color:"var(--text)" }}>
            <div>{j.customer}</div>
            {j.site_name ? (
              <>
                <div className="mono" style={{ fontSize:11, color:"var(--brass-bright)", marginTop:2 }}>{j.site_name}</div>
                {siteAddr(j) && <div className="mono" style={{ fontSize:10, color:"var(--muted)", marginTop:1 }}>{siteAddr(j)}</div>}
              </>
            ) : (
              siteAddr(j) && <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginTop:2 }}>{siteAddr(j)}</div>
            )}
            {j.original_ask && <div className="mono" style={{ fontSize:11, color:"var(--gold)", marginTop:2, fontWeight:400, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{j.original_ask}</div>}
          </button>
        ))}
      </div>
    </Sheet>
  );
}

function ClockOutSheet({ clockSession, jobs, onClockOut, onClose }) {
  const [jobStatus, setJobStatus] = useState(null);
  const job = clockSession?.jobId ? (jobs || []).find(j => j.id === clockSession.jobId) : null;
  const isShop = job?.customer?.toUpperCase() === ABC_SHOP_NAME;
  const activeStatuses = ['New','Ready to Schedule','Scheduled','In Route','On Site','In Progress'];
  const needsStatusUpdate = job && !isShop && activeStatuses.includes(job.status);
  return (
    <Sheet title={job ? `CLOCKING OUT — ${(job.customer || '').toUpperCase()}` : 'CLOCK OUT — SHOP'} onClose={onClose}>
      {needsStatusUpdate && (
        <React.Fragment>
          <div className="mono" style={{ fontSize:12, color:"var(--muted)", marginBottom:10 }}>UPDATE JOB STATUS (OPTIONAL)</div>
          <div style={{ display:"flex", flexDirection:"column", gap:6, marginBottom:16 }}>
            {['In Progress','On Hold','Completed/Needs Billing','Billed/Waiting for Payment','Completed/Paid'].map(s => (
              <button key={s} onClick={() => setJobStatus(jobStatus === s ? null : s)} className="head"
                style={{ padding:"12px 14px", borderRadius:8, fontSize:14, fontWeight:700, textAlign:"left",
                  background: jobStatus === s ? "var(--olive-bright)" : "var(--panel)",

/* ── CalendarView ──────────────────────────────────────────────────────────── */
// Only jobs with a real scheduled_at ever appear here — a 'Ready to Schedule'/'In Progress'
// job with no date has nowhere valid to sit on a calendar and must not pile onto "today".
const CALENDAR_STATUSES = ['In Progress', 'Scheduled', 'Ready to Schedule'];
function getCalendarJobs(jobs) {
  return (jobs || []).filter(j => CALENDAR_STATUSES.includes(j.status) && j.has_schedule);
}
const CAL_VIEW_KEY = 'tmc_calendar_view_mode';
function getCalendarViewMode() {
  try { return localStorage.getItem(CAL_VIEW_KEY) || 'agenda'; } catch { return 'agenda'; }
}
function setCalendarViewMode(mode) {
  try { localStorage.setItem(CAL_VIEW_KEY, mode); } catch {}
}
// Same overdue/scheduled/neutral formula as StatusPill/JobCard — no new color rule invented.
function calJobColor(j) {
  const overdue = j.status === 'Scheduled' && j.scheduled_date < todayISO();
  const scheduled = j.status === 'Scheduled' && !overdue;
  return overdue ? '#b5432f' : scheduled ? 'var(--green)' : 'var(--muted)';
}
const CAL_DAY_LABEL = iso => new Date(iso + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

// A quick tap/light touch must reliably open the peek popover — a bare distance threshold
// (the old approach) treats ordinary finger jitter as a drag on almost every tap. Instead,
// dragging only "arms" after a deliberate hold; movement before that is what cancels the
// gesture outright (a scroll/swipe attempt, not a tap or a hold).
const CAL_LONGPRESS_MS = 450;   // hold duration before drag mode arms (with a haptic buzz)
const CAL_MOVE_CANCEL_PX = 10;  // movement before arming cancels the gesture entirely
// True on real mouse/trackpad devices (laptop/desktop), false on touch-only — gates the Month
// grid's hover peek tile so a touch tap's synthetic mouseenter doesn't leave a stuck tooltip.
const CAL_HAS_HOVER = typeof window !== 'undefined' && !!window.matchMedia && window.matchMedia('(hover: hover)').matches;

// Draggable (Pointer Events — no HTML5 dragdrop, which barely works on touch) job chip used
// in Month/Week grid cells. Three outcomes: a quick tap opens the peek popover (onPeek); a
// deliberate hold (vibrates once armed) followed by a drag onto a different day offers a
// reschedule (onDragEnd, unchanged); a deliberate hold released in place (no drag) opens an
// inline "move to a date" prompt instead (onLongPressRelease).
function CalendarChip({ job, dateISO, onPeek, onDragEnd, onLongPressRelease, stacked }) {
  const dragRef = useRef(null);
  const draggedRef = useRef(false);
  const holdTimerRef = useRef(null);
  const armedRef = useRef(false);
  const cancelledRef = useRef(false);
  const [armed, setArmed] = useState(false);
  const chipRef = useRef(null);
  const [hoverPos, setHoverPos] = useState(null); // fixed-position anchor for the Month grid's hover peek tile, or null when hidden
  function reset() {
    clearTimeout(holdTimerRef.current);
    dragRef.current = null;
    armedRef.current = false;
    cancelledRef.current = false;
    setArmed(false);
  }
  function handleMouseEnter() {
    if (stacked || !CAL_HAS_HOVER) return; // Week's stacked chips already show full detail inline
    const rect = chipRef.current && chipRef.current.getBoundingClientRect();
    if (!rect) return;
    const width = 220, estHeight = 90;
    let left = rect.left;
    if (left + width > window.innerWidth - 8) left = window.innerWidth - width - 8;
    if (left < 8) left = 8;
    let top = rect.bottom + 6;
    if (top + estHeight > window.innerHeight - 8) top = rect.top - estHeight - 6;
    setHoverPos({ left, top });
  }
  function handleMouseLeave() { setHoverPos(null); }
  function onPointerDown(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    dragRef.current = { startX: e.clientX, startY: e.clientY, pointerId: e.pointerId, isMouse: e.pointerType === 'mouse' };
    cancelledRef.current = false;
    armedRef.current = false;
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch {}
    // Mouse click-and-drag is already unambiguous — no long-press needed, arm on first real move instead (below).
    if (e.pointerType !== 'mouse') {
      holdTimerRef.current = setTimeout(() => {
        armedRef.current = true;
        setArmed(true);
        if (navigator.vibrate) navigator.vibrate(25);
      }, CAL_LONGPRESS_MS);
    }
  }
  function onPointerMove(e) {
    const d = dragRef.current;
    if (!d || d.pointerId !== e.pointerId) return;
    if (armedRef.current) return;
    const past = Math.abs(e.clientX - d.startX) > CAL_MOVE_CANCEL_PX || Math.abs(e.clientY - d.startY) > CAL_MOVE_CANCEL_PX;
    if (d.isMouse) { if (past) { armedRef.current = true; setArmed(true); } return; }
    if (past) {
      cancelledRef.current = true;
      clearTimeout(holdTimerRef.current);
    }
  }
  function onPointerUp(e) {
    clearTimeout(holdTimerRef.current);
    const d = dragRef.current;
    dragRef.current = null;
    if (!d || d.pointerId !== e.pointerId) return;
    if (cancelledRef.current) { reset(); return; }
    if (armedRef.current) {
      draggedRef.current = true;
      armedRef.current = false;
      setArmed(false);
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const cell = el && el.closest('[data-cal-date]');
      const overDate = cell ? cell.getAttribute('data-cal-date') : null;
      if (overDate && overDate !== dateISO) onDragEnd(job, overDate);
      else onLongPressRelease(job);
    }
  }
  function onPointerCancel() { reset(); }
  function onClick(e) {
    e.stopPropagation();
    if (draggedRef.current) { draggedRef.current = false; return; }
    onPeek(job);
  }
  const color = calJobColor(job);
  if (stacked) {
    const overdue = job.status === 'Scheduled' && job.scheduled_date < todayISO();
    const scheduled = job.status === 'Scheduled' && !overdue;
    return (
      <div onPointerDown={onPointerDown} onPointerMove={onPointerMove} onPointerUp={onPointerUp} onPointerCancel={onPointerCancel} onClick={onClick}
        style={{ display:"flex", alignItems:"center", gap:10, width:"100%", padding:"10px 12px", marginBottom:6, borderRadius:8,
          cursor: armed ? "grabbing" : "grab", background:"var(--panel)", border:"1px solid var(--line)", borderLeft:`3px solid ${color}`,
          touchAction:"none", transform: armed ? "scale(1.03)" : "scale(1)", boxShadow: armed ? "0 2px 8px rgba(0,0,0,0.4)" : "none",
          transition: "transform 0.15s, box-shadow 0.15s" }}>
        <div className="mono" style={{ fontSize:13, color:"var(--brass-bright)", minWidth:64 }}>{fmtTime(job.scheduled_time)}</div>
        <div style={{ flex:1, minWidth:0 }}>
          <div className="head" style={{ fontSize:14, color:"var(--text)", whiteSpace:"normal", wordBreak:"break-word" }}>
            {job.site_name || job.customer}
          </div>
          <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginTop:2 }}>{job.flow_type}</div>
        </div>
        <StatusPill status={job.status} overdue={overdue} scheduled={scheduled} />
      </div>
    );
  }
  return (
    <>
      <div ref={chipRef} onPointerDown={onPointerDown} onPointerMove={onPointerMove} onPointerUp={onPointerUp} onPointerCancel={onPointerCancel} onClick={onClick}
        onMouseEnter={handleMouseEnter} onMouseLeave={handleMouseLeave}
        className="mono" style={{ fontSize:10, padding:"2px 4px", marginBottom:2, borderRadius:4, cursor: armed ? "grabbing" : "grab",
          background: color+"22", borderLeft:`2px solid ${color}`, color:"var(--text)", touchAction:"none",
          whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis",
          transform: armed ? "scale(1.08)" : "scale(1)", boxShadow: armed ? "0 2px 8px rgba(0,0,0,0.4)" : "none",
          transition: "transform 0.15s, box-shadow 0.15s" }}>
        {fmtTime(job.scheduled_time)} {job.customer}
      </div>
      {hoverPos && ReactDOM.createPortal(
        <div style={{ position:"fixed", left:hoverPos.left, top:hoverPos.top, width:220, zIndex:400, pointerEvents:"none",
          background:"var(--panel)", border:"1px solid var(--olive-bright)", borderRadius:8, padding:"8px 10px",
          boxShadow:"0 4px 16px rgba(0,0,0,0.5)" }}>
          <div className="head" style={{ fontSize:13, color:"var(--text)", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
            {job.site_name || job.customer}
          </div>
          <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginTop:2 }}>
            {fmtTime(job.scheduled_time)} · {job.flow_type}
          </div>
          {job.next_steps ? (
            <NextStepsHint text={job.next_steps} style={{ whiteSpace:"normal", marginTop:4 }} />
          ) : (
            <div className="mono" style={{ fontSize:11, color:"var(--muted)", fontStyle:"italic", marginTop:4 }}>No next steps noted</div>
          )}
        </div>,
        document.body
      )}
    </>
  );
}

// Shared Month/Week day cell — maxShown/minHeight are the only knobs that differ between them.
function CalendarDayCell({ dateISO, dimmed, dayJobs, maxShown, minHeight, onPeek, onDragEnd, onLongPressRelease, onExpand }) {
  const isToday = dateISO === todayLocalISO();
  const shown = dayJobs.slice(0, maxShown);
  const overflow = dayJobs.length - shown.length;
  return (
    <div data-cal-date={dateISO} onClick={() => onExpand(dateISO)}
      style={{ minHeight, minWidth:0, overflow:"hidden", border: isToday ? "1px solid var(--olive-bright)" : "1px solid var(--line)",
        borderRadius:6, padding:4, background:"var(--panel)", opacity: dimmed ? 0.4 : 1, cursor:"pointer" }}>
      <div className="mono" style={{ fontSize:11, marginBottom:2,
        color: isToday ? "var(--olive-bright)" : "var(--muted)", fontWeight: isToday ? 700 : 400 }}>
        {Number(dateISO.slice(8,10))}
      </div>
      {shown.map(j => <CalendarChip key={j.id} job={j} dateISO={dateISO} onPeek={onPeek} onDragEnd={onDragEnd} onLongPressRelease={onLongPressRelease} />)}
      {overflow > 0 && (
        <div onClick={e => { e.stopPropagation(); onExpand(dateISO); }}
          className="mono" style={{ fontSize:9, color:"var(--muted)", marginTop:1, cursor:"pointer" }}>+{overflow} more</div>
      )}
    </div>
  );
}

// Week view's own day section — unlike CalendarDayCell (Month), this never truncates: every job
// for the day is shown in full via a stacked CalendarChip, so there's no "+N more"/expandedDay
// hop needed. Keeps its own inline "+ SCHEDULE JOB" button (mirroring Agenda's) so scheduling
// stays reachable per the r246 "every calendar entry point" rule. data-cal-date is still required
// on the wrapper — CalendarChip's drag-drop hit-testing looks for the nearest [data-cal-date].
function WeekDayRow({ dateISO, dayJobs, onPeek, onDragEnd, onLongPressRelease, onScheduleDay }) {
  const isToday = dateISO === todayLocalISO();
  return (
    <div data-cal-date={dateISO} style={{ marginBottom:16 }}>
      <div className="head" style={{ fontSize:13, fontWeight:700,
        color: isToday ? "var(--olive-bright)" : "var(--text)",
        borderBottom:"1px solid var(--line)", paddingBottom:6, marginBottom:8 }}>
        {CAL_DAY_LABEL(dateISO).toUpperCase()}{isToday ? " · TODAY" : ""}
      </div>
      {dayJobs.length === 0 ? (
        <div className="mono" style={{ fontSize:12, color:"var(--muted)", padding:"4px 0" }}>No jobs</div>
      ) : dayJobs.map(j => (
        <CalendarChip key={j.id} job={j} dateISO={dateISO} stacked
          onPeek={onPeek} onDragEnd={onDragEnd} onLongPressRelease={onLongPressRelease} />
      ))}
      <button onClick={() => onScheduleDay(dateISO)} className="mono"
        style={{ width:"100%", textAlign:"left", padding:"6px 2px", marginTop:2,
          background:"none", border:"none", color:"var(--olive-bright)", fontSize:12, fontWeight:700, cursor:"pointer" }}>
        + SCHEDULE JOB
      </button>
    </div>
  );
}

function CalendarView({ jobs, onClose, onOpenJob, onReschedule, onScheduleJob, onUnschedule }) {
  const [viewMode, setViewMode] = useState(() => getCalendarViewMode());
  const [expandedDay, setExpandedDay] = useState(null);
  const [periodAnchor, setPeriodAnchor] = useState(() => todayLocalISO());
  const [peekJob, setPeekJob] = useState(null);
  const [movePrompt, setMovePrompt] = useState(null); // { job, targetDate } | null — targetDate set only when a drag already picked the day
  const [schedulingDay, setSchedulingDay] = useState(null);
  const [editingTimeId, setEditingTimeId] = useState(null);

  function changeMode(mode) { setViewMode(mode); setCalendarViewMode(mode); }

  const calendarJobs = useMemo(() => getCalendarJobs(jobs), [jobs]);
  const jobsByDate = useMemo(() => {
    const map = {};
    calendarJobs.forEach(j => { (map[j.scheduled_date] = map[j.scheduled_date] || []).push(j); });
    Object.values(map).forEach(list => list.sort((a,b) => (a.scheduled_time||'').localeCompare(b.scheduled_time||'')));
    return map;
  }, [calendarJobs]);

  function pageBy(delta) {
    if (viewMode === 'month') {
      const [y, mo] = periodAnchor.split('-').map(Number);
      const d = new Date(y, mo - 1 + delta, 1);
      setPeriodAnchor(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`);
    } else if (viewMode === 'week') {
      setPeriodAnchor(shiftDateISO(periodAnchor, delta * 7));
    } else {
      setPeriodAnchor(shiftDateISO(periodAnchor, delta * 14));
    }
  }

  const monthGrid = useMemo(() => viewMode === 'month' ? buildMonthGrid(periodAnchor) : [], [viewMode, periodAnchor]);
  const weekDates = useMemo(() => viewMode === 'week' ? buildWeekDates(periodAnchor) : [], [viewMode, periodAnchor]);
  const agendaDays = useMemo(() => {
    if (viewMode !== 'agenda') return [];
    const days = [];
    for (let i = 0; i < 14; i++) days.push(shiftDateISO(periodAnchor, i));
    return days;
  }, [viewMode, periodAnchor]);

  const periodLabel = useMemo(() => {
    const fmtShort = iso => new Date(iso + 'T00:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric' });
    if (viewMode === 'month') {
      const [y, mo] = periodAnchor.split('-').map(Number);
      return new Date(y, mo - 1, 1).toLocaleDateString('en-US', { month:'long', year:'numeric' }).toUpperCase();
    }
    if (viewMode === 'week') {
      const dates = buildWeekDates(periodAnchor);
      return `${fmtShort(dates[0])} – ${fmtShort(dates[6])}`;
    }
    return `${fmtShort(periodAnchor)} – ${fmtShort(shiftDateISO(periodAnchor, 13))}`;
  }, [viewMode, periodAnchor]);

  function handleChipDragEnd(job, targetDate) {
    setMovePrompt({ job, targetDate });
  }

  return (
    <div className="fade-in" style={{ minHeight:'100vh', background:'var(--bg)' }}>
      <div style={{ padding:'18px 16px 14px', borderBottom:'1px solid var(--line)', background:'var(--panel)', position:'sticky', top:0, zIndex:10 }}>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <button onClick={onClose} className="head" style={{ fontSize:22, color:'var(--text)', background:'none', border:'none', padding:'0 6px', cursor:'pointer' }}>‹</button>
          <div className="head" style={{ fontSize:20, fontWeight:700 }}>CALENDAR</div>
        </div>
        <div style={{ display:'flex', gap:8, marginTop:12 }}>
          {['agenda','month','week'].map(m => (
            <button key={m} onClick={() => changeMode(m)} className="head"
              style={{ flex:1, padding:'9px 0', borderRadius:7, fontSize:13, fontWeight:700,
                background: viewMode===m ? 'var(--olive-bright)' : 'var(--panel)',
                color: viewMode===m ? 'var(--bg)' : 'var(--muted)',
                border:`1px solid ${viewMode===m ? 'var(--olive-bright)' : 'var(--line)'}`, cursor:'pointer' }}>
              {m.toUpperCase()}
            </button>
          ))}
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:8, marginTop:12 }}>
          <button onClick={() => pageBy(-1)} className="head"
            style={{ fontSize:16, padding:'4px 12px', background:'var(--panel)', border:'1px solid var(--line)', borderRadius:6, color:'var(--text)', cursor:'pointer' }}>‹</button>
          <div className="mono" style={{ flex:1, textAlign:'center', fontSize:13, color:'var(--text)', letterSpacing:'0.05em' }}>{periodLabel}</div>
          <button onClick={() => pageBy(1)} className="head"
            style={{ fontSize:16, padding:'4px 12px', background:'var(--panel)', border:'1px solid var(--line)', borderRadius:6, color:'var(--text)', cursor:'pointer' }}>›</button>
        </div>
      </div>

      <div style={{ padding:'12px 16px' }}>
        {viewMode === 'month' && (
          <div>
            <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:4, marginBottom:4 }}>
              {['SUN','MON','TUE','WED','THU','FRI','SAT'].map(d => (
                <div key={d} className="mono" style={{ fontSize:10, color:'var(--muted)', textAlign:'center' }}>{d}</div>
              ))}
            </div>
            <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:4 }}>
              {monthGrid.map(cell => (
                <CalendarDayCell key={cell.dateISO} dateISO={cell.dateISO} dimmed={!cell.inCurrentMonth}
                  dayJobs={jobsByDate[cell.dateISO] || []} maxShown={3} minHeight={82}
                  onPeek={setPeekJob} onDragEnd={handleChipDragEnd} onLongPressRelease={(job) => setMovePrompt({ job, targetDate: null })} onExpand={setExpandedDay} />
              ))}
            </div>
          </div>
        )}

        {viewMode === 'week' && (
          <div>
            {weekDates.map(d => (
              <WeekDayRow key={d} dateISO={d} dayJobs={jobsByDate[d] || []}
                onPeek={setPeekJob} onDragEnd={handleChipDragEnd}
                onLongPressRelease={(job) => setMovePrompt({ job, targetDate: null })}
                onScheduleDay={setSchedulingDay} />
            ))}
          </div>
        )}

        {viewMode === 'agenda' && (
          <div>
            {agendaDays.map(d => {
              const dayJobs = jobsByDate[d] || [];
              const isToday = d === todayLocalISO();
              return (
                <div key={d} style={{ marginBottom:14 }}>
                  <div className="head" style={{ fontSize:13, fontWeight:700,
                    color: isToday ? 'var(--olive-bright)' : 'var(--text)',
                    borderBottom:'1px solid var(--line)', paddingBottom:6, marginBottom:6 }}>
                    {CAL_DAY_LABEL(d).toUpperCase()}{isToday ? ' · TODAY' : ''}
                  </div>
                  {dayJobs.length === 0 ? (
                    <div className="mono" style={{ fontSize:12, color:'var(--muted)', padding:'4px 0' }}>No jobs</div>
                  ) : dayJobs.map(j => {
                    const color = calJobColor(j);
                    return (
                      <button key={j.id} onClick={() => onOpenJob(j.id)}
                        style={{ display:'flex', alignItems:'center', gap:10, width:'100%', textAlign:'left',
                          padding:'8px 10px', marginBottom:6, background:'var(--panel)', border:'1px solid var(--line)',
                          borderLeft:`3px solid ${color}`, borderRadius:8, cursor:'pointer' }}>
                        <div className="mono" style={{ fontSize:13, color:'var(--brass-bright)', minWidth:70 }}>{fmtTime(j.scheduled_time)}</div>
                        <div style={{ flex:1, minWidth:0 }}>
                          <div className="head" style={{ fontSize:14, color:'var(--text)' }}>{j.site_name || j.customer}</div>
                          <NextStepsHint text={j.next_steps} />
                        </div>
                      </button>
                    );
                  })}
                  <button onClick={() => setSchedulingDay(d)} className="mono"
                    style={{ width:'100%', textAlign:'left', padding:'6px 2px', marginTop:2,
                      background:'none', border:'none', color:'var(--olive-bright)', fontSize:12, fontWeight:700, cursor:'pointer' }}>
                    + SCHEDULE JOB
                  </button>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {expandedDay && (
        <Sheet title={CAL_DAY_LABEL(expandedDay).toUpperCase()} onClose={() => setExpandedDay(null)}>
          {(jobsByDate[expandedDay] || []).length === 0 ? (
            <div className="mono" style={{ fontSize:13, color:'var(--muted)', padding:'12px 0' }}>No jobs</div>
          ) : (jobsByDate[expandedDay] || []).map(j => {
            const color = calJobColor(j);
            const editingTime = editingTimeId === j.id;
            return (
              <div key={j.id} style={{ display:'flex', alignItems:'center', gap:8, width:'100%',
                  padding:'10px', marginBottom:8, background:'var(--panel)', border:'1px solid var(--line)',
                  borderLeft:`3px solid ${color}`, borderRadius:8 }}>
                {editingTime ? (
                  <input type="time" autoFocus value={j.scheduled_time || ''}
                    onChange={e => onScheduleJob(j.id, expandedDay, e.target.value)}
                    onBlur={() => setEditingTimeId(null)}
                    className="mono" style={{ minWidth:96, padding:'4px 6px', borderRadius:6,
                      border:'1px solid var(--olive-bright)', background:'var(--bg)', color:'var(--text)', fontSize:13 }} />
                ) : (
                  <button onClick={() => setEditingTimeId(j.id)} className="mono"
                    style={{ minWidth:70, textAlign:'left', background:'none', border:'none',
                      color:'var(--brass-bright)', fontSize:13, cursor:'pointer', padding:0 }}>
                    {fmtTime(j.scheduled_time)} ✎
                  </button>
                )}
                <button onClick={() => { setExpandedDay(null); onOpenJob(j.id); }}
                  style={{ flex:1, textAlign:'left', background:'none', border:'none', cursor:'pointer', padding:0, minWidth:0 }}>
                  <div className="head" style={{ fontSize:14, color:'var(--text)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>
                    {j.site_name || j.customer}
                  </div>
                  <NextStepsHint text={j.next_steps} />
                </button>
                <button onClick={() => setMovePrompt({ job: j, targetDate: null })} title="Move to another day"
                  style={{ background:'none', border:'none', color:'var(--muted)', fontSize:17, cursor:'pointer', padding:'4px 2px' }}>
                  ⇄
                </button>
              </div>
            );
          })}
          <button onClick={() => { setExpandedDay(null); setSchedulingDay(expandedDay); }} className="head"
            style={{ width:'100%', padding:'12px', marginTop: (jobsByDate[expandedDay]||[]).length ? 4 : 0,
              borderRadius:8, fontSize:14, fontWeight:700, background:'var(--olive-bright)', color:'var(--bg)', border:'none', cursor:'pointer' }}>
            + SCHEDULE JOB
          </button>
        </Sheet>
      )}

      {schedulingDay && (
        <ScheduleJobSheet day={schedulingDay} jobs={jobs} onClose={() => setSchedulingDay(null)}
          onSchedule={(jobId, dateISO, time) => { onScheduleJob(jobId, dateISO, time); setSchedulingDay(null); }} />
      )}

      {peekJob && (() => {
        const overdue = peekJob.status === 'Scheduled' && peekJob.scheduled_date < todayISO();
        const scheduled = peekJob.status === 'Scheduled' && !overdue;
        return (
          <Sheet title={(peekJob.site_name || peekJob.customer || 'JOB').toUpperCase()} onClose={() => setPeekJob(null)}>
            <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:10 }}>
              <StatusPill status={peekJob.status} overdue={overdue} scheduled={scheduled} />
              <div className="mono" style={{ fontSize:12, color:'var(--muted)' }}>{peekJob.flow_type}</div>
            </div>
            <div className="mono" style={{ fontSize:13, color:'var(--text)', marginBottom:4 }}>
              {fmtDate(peekJob.scheduled_date)} · {fmtTime(peekJob.scheduled_time)}
            </div>
            {siteAddr(peekJob) && <div className="mono" style={{ fontSize:12, color:'var(--muted)', marginBottom:8 }}>{siteAddr(peekJob)}</div>}
            <NextStepsHint text={peekJob.next_steps} style={{ whiteSpace:'normal', marginBottom:8, fontSize:12 }} />
            {peekJob.original_ask && <div style={{ fontSize:13, color:'var(--text)', marginBottom:14 }}>{peekJob.original_ask}</div>}
            <button onClick={() => { const id = peekJob.id; setPeekJob(null); onOpenJob(id); }} className="head"
              style={{ width:'100%', padding:'12px', background:'var(--olive-bright)', color:'var(--bg)', border:'none', borderRadius:8, fontSize:14, fontWeight:700, cursor:'pointer' }}>
              VIEW FULL JOB
            </button>
            <button onClick={() => { const day = peekJob.scheduled_date; setPeekJob(null); setSchedulingDay(day); }} className="head"
              style={{ width:'100%', padding:'12px', marginTop:8, background:'var(--panel)', color:'var(--text)', border:'1px solid var(--line)', borderRadius:8, fontSize:14, fontWeight:700, cursor:'pointer' }}>
              + SCHEDULE JOB FOR THIS DAY
            </button>
            <button onClick={() => { const id = peekJob.id; setPeekJob(null); onUnschedule(id); onOpenJob(id); }} className="head"
              style={{ width:'100%', padding:'12px', marginTop:8, background:'transparent', color:'var(--danger)', border:'1px solid var(--danger)', borderRadius:8, fontSize:14, fontWeight:700, cursor:'pointer' }}>
              REMOVE FROM SCHEDULE
            </button>
          </Sheet>
        );
      })()}

      {movePrompt && (
        <MoveJobPrompt job={movePrompt.job} targetDate={movePrompt.targetDate} onClose={() => setMovePrompt(null)} onReschedule={onReschedule} />
      )}
    </div>
  );
}

// Used both when a drag already picked the target day (targetDate set — date is fixed, only
// TIME is asked) and when initiated without one (long-press-release in place, or the day list's
// ⇄ button — DATE is editable too). Either way this always ends with a time to confirm, never
// silently keeps the job's old time.
function MoveJobPrompt({ job, targetDate, onClose, onReschedule }) {
  const [date, setDate] = useState(targetDate || job.scheduled_date || todayISO());
  const [time, setTime] = useState(job.scheduled_time || nowTimeRounded15());
  return (
    <Sheet title={targetDate ? `MOVE TO ${CAL_DAY_LABEL(targetDate).toUpperCase()}?` : "MOVE JOB?"} onClose={onClose}>
      <div style={{ fontSize:14, color:'var(--text)', marginBottom:12 }}>
        Move <strong>{job.site_name || job.customer}</strong>{targetDate ? '' : ' to a different date?'}
      </div>
      {!targetDate && (
        <>
          <div className="mono" style={{ fontSize:11, color:'var(--muted)', marginBottom:6 }}>DATE</div>
          <input type="date" value={date} min={todayISO()} onChange={e => setDate(e.target.value)}
            className="mono" style={{ width:'100%', padding:'10px', marginBottom:14, background:'var(--panel)', border:'1px solid var(--line)', borderRadius:8, color:'var(--text)', fontSize:14 }} />
        </>
      )}
      <div className="mono" style={{ fontSize:11, color:'var(--muted)', marginBottom:6 }}>TIME</div>
      <input type="time" value={time} onChange={e => setTime(e.target.value)}
        className="mono" style={{ width:'100%', padding:'10px', marginBottom:14, background:'var(--panel)', border:'1px solid var(--line)', borderRadius:8, color:'var(--text)', fontSize:14 }} />
      <div style={{ display:'flex', gap:8 }}>
        <button onClick={onClose} className="head" style={{ flex:1, padding:'12px', background:'var(--panel)', border:'1px solid var(--line)', borderRadius:8, color:'var(--text)', fontSize:14, cursor:'pointer' }}>CANCEL</button>
        <button onClick={() => { onReschedule(job.id, date, time); onClose(); }} className="head" style={{ flex:1, padding:'12px', background:'var(--olive-bright)', border:'none', borderRadius:8, color:'var(--bg)', fontWeight:700, fontSize:14, cursor:'pointer' }}>MOVE</button>
      </div>
    </Sheet>
  );
}

// Picker used by CalendarView's "+ SCHEDULE JOB" — defaults to Ready to Schedule jobs, with a
// toggle to widen to all non-terminal jobs. Picking a job hands off to a confirm step (time is
// entered there, not deferred to Job Detail) since scheduling is meant to happen primarily from
// the Calendar going forward.
const SCHEDULABLE_EXCLUDE_STATUSES = ['Closed', 'Completed/Paid', 'Completed/Needs Billing', 'Billed/Waiting for Payment'];
function ScheduleJobSheet({ day, jobs, onClose, onSchedule }) {
  const [showAll, setShowAll] = useState(false);
  const [q, setQ] = useState('');
  const [selectedJob, setSelectedJob] = useState(null);
  const [time, setTime] = useState('09:00');
  const candidates = (jobs || [])
    .filter(j => j.customer?.toUpperCase() !== ABC_SHOP_NAME &&
      (showAll ? !SCHEDULABLE_EXCLUDE_STATUSES.includes(j.status) : j.status === 'Ready to Schedule'))
    .slice().sort((a, b) => (a.customer || '').localeCompare(b.customer || ''));
  const filtered = q
    ? candidates.filter(j => (j.customer||'').toLowerCase().includes(q.toLowerCase()) || (siteAddr(j)||'').toLowerCase().includes(q.toLowerCase()))
    : candidates;
  const dayJobs = getCalendarJobs(jobs)
    .filter(j => j.scheduled_date === day)
    .slice().sort((a, b) => (a.scheduled_time || '').localeCompare(b.scheduled_time || ''));

  function pickJob(j) {
    setSelectedJob(j);
    setTime(dayJobs.length ? nowTimeRounded15() : '09:00');
  }

  if (selectedJob) {
    return (
      <Sheet title={`SCHEDULE FOR ${CAL_DAY_LABEL(day).toUpperCase()}`} onClose={onClose}>
        <div className="mono" style={{ fontSize:13, color:'var(--text)', marginBottom:14 }}>
          Scheduling <strong>{selectedJob.site_name || selectedJob.customer}</strong>
        </div>
        <div className="mono" style={{ fontSize:11, color:'var(--muted)', marginBottom:6 }}>
          {dayJobs.length ? 'ALREADY SCHEDULED THIS DAY' : 'NOTHING ELSE SCHEDULED THIS DAY'}
        </div>
        {dayJobs.length > 0 && (
          <div style={{ display:'flex', flexDirection:'column', gap:4, marginBottom:14 }}>
            {dayJobs.map(j => (
              <div key={j.id} className="mono" style={{ fontSize:12, color:'var(--text)', display:'flex', justifyContent:'space-between', gap:8,
                padding:'6px 8px', background:'var(--panel)', border:'1px solid var(--line)', borderRadius:6 }}>
                <span style={{ fontWeight:700 }}>{fmtTime(j.scheduled_time)}</span>
                <span style={{ color:'var(--muted)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{j.site_name || j.customer}</span>
              </div>
            ))}
          </div>
        )}
        <div className="mono" style={{ fontSize:11, color:'var(--muted)', marginBottom:6 }}>TIME</div>
        <input type="time" autoFocus value={time} onChange={e => setTime(e.target.value)}
          style={{ width:'100%', boxSizing:'border-box', padding:'10px 12px', marginBottom:14,
            borderRadius:8, border:'1px solid var(--line)', background:'var(--bg)', color:'var(--text)', fontSize:14, fontFamily:'inherit' }} />
        <div style={{ display:'flex', gap:8 }}>
          <button onClick={() => setSelectedJob(null)} className="head"
            style={{ flex:1, padding:'12px', background:'var(--panel)', border:'1px solid var(--line)', borderRadius:8, color:'var(--text)', fontSize:14, cursor:'pointer' }}>
            BACK
          </button>
          <button onClick={() => onSchedule(selectedJob.id, day, time)} className="head"
            style={{ flex:1, padding:'12px', background:'var(--olive-bright)', border:'none', borderRadius:8, color:'var(--bg)', fontWeight:700, fontSize:14, cursor:'pointer' }}>
            CONFIRM
          </button>
        </div>
      </Sheet>
    );
  }

  return (
    <Sheet title={`SCHEDULE FOR ${CAL_DAY_LABEL(day).toUpperCase()}`} onClose={onClose}>
      <div style={{ display:'flex', gap:8, marginBottom:8 }}>
        <button onClick={() => setShowAll(false)} className="head"
          style={{ flex:1, padding:10, borderRadius:8, fontSize:13, fontWeight:700,
            background: !showAll ? 'var(--olive-bright)' : 'var(--panel)',
            color: !showAll ? 'var(--bg)' : 'var(--text)',
            border: !showAll ? 'none' : '1px solid var(--line)', cursor:'pointer' }}>
          READY TO SCHEDULE
        </button>
        <button onClick={() => setShowAll(true)} className="head"
          style={{ flex:1, padding:10, borderRadius:8, fontSize:13, fontWeight:700,
            background: showAll ? 'var(--olive-bright)' : 'var(--panel)',
            color: showAll ? 'var(--bg)' : 'var(--text)',
            border: showAll ? 'none' : '1px solid var(--line)', cursor:'pointer' }}>
          ALL JOBS
        </button>
      </div>
      <input value={q} onChange={e => setQ(e.target.value)} placeholder="Search jobs…"
        style={{ width:'100%', boxSizing:'border-box', padding:'10px 12px', marginBottom:8,
          borderRadius:8, border:'1px solid var(--line)', background:'var(--bg)', color:'var(--text)', fontSize:14, fontFamily:'inherit' }} />
      <div style={{ display:'flex', flexDirection:'column', gap:6, maxHeight:360, overflowY:'auto' }}>
        {filtered.map(j => (
          <button key={j.id} onClick={() => pickJob(j)} className="head"
            style={{ padding:'12px 14px', borderRadius:8, fontSize:14, fontWeight:700, textAlign:'left',
              background:'var(--panel)', border:'1px solid var(--line)', color:'var(--text)', cursor:'pointer' }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
              <span>{j.site_name || j.customer}</span>
              <span className="mono" style={{ fontSize:10, color:'var(--muted)' }}>{j.status}</span>
            </div>
            {siteAddr(j) && <div className="mono" style={{ fontSize:11, color:'var(--muted)', marginTop:2 }}>{siteAddr(j)}</div>}
            {j.original_ask && <div className="mono" style={{ fontSize:11, color:'var(--gold)', marginTop:2, fontWeight:400, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{j.original_ask}</div>}
          </button>
        ))}
        {filtered.length === 0 && <div className="mono" style={{ fontSize:13, color:'var(--muted)', padding:'12px 0' }}>No jobs match</div>}
      </div>
    </Sheet>
  );
}

/* ── WarrantyReviewScreen (r266) ────────────────────────────────────────────
   Hamburger menu → WARRANTY REVIEW. Three lists:
   1. customer replies the warranty-inbound function wasn't sure about
      (warranty_inbound.status needs_review / unmatched) → pick the unit(s) or reject;
   2. customer emails held at prepare time (warranty_registrations.status needs_review);
   3. last 30 days of auto-matches, each with UNDO, so a wrong auto-match is one tap to fix. */
function WarrantyReviewScreen({ currentUser, onClose, onOpenJob }) {
  const [loading, setLoading] = useState(true);
  const [notMigrated, setNotMigrated] = useState(false);
  const [inbound, setInbound] = useState([]);
  const [autoRecent, setAutoRecent] = useState([]);
  const [regs, setRegs] = useState([]);
  const [selected, setSelected] = useState({});   // inboundId → Set(registrationId)
  const [search, setSearch] = useState({});       // inboundId → text
  const [openSnippet, setOpenSnippet] = useState(null);
  const [showAuto, setShowAuto] = useState(false);
  const [busy, setBusy] = useState(null);

  async function load() {
    setLoading(true);
    const since = new Date(Date.now() - 30 * 86400000).toISOString();
    const [inb, auto, rg] = await Promise.all([
      sb.from('warranty_inbound').select('*').in('status', ['needs_review', 'unmatched']).order('received_at', { ascending: false }).limit(100),
      sb.from('warranty_inbound').select('*').eq('status', 'auto_matched').gte('received_at', since).order('received_at', { ascending: false }).limit(30),
      sb.from('warranty_registrations')
        .select('id,job_id,equipment_id,status,email_token,brand_key,hold_reasons,registered_via,equipment(id,label,brand,model_number,serial_number),customers(name,email)')
        .order('created_at', { ascending: false }).limit(2000),
    ]);
    const err = inb.error || auto.error || rg.error;
    if (err) { setNotMigrated(isWarrantyNotMigrated(err)); if (!isWarrantyNotMigrated(err)) console.warn('WarrantyReview load', err); }
    setInbound(inb.data || []);
    setAutoRecent(auto.data || []);
    setRegs(rg.data || []);
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  const regById = useMemo(() => { const m = {}; regs.forEach(r => { m[r.id] = r; }); return m; }, [regs]);
  const held = regs.filter(r => r.status === 'needs_review');

  function toggleSel(inbId, regId) {
    setSelected(prev => {
      const next = new Set(prev[inbId] || []);
      next.has(regId) ? next.delete(regId) : next.add(regId);
      return { ...prev, [inbId]: next };
    });
  }

  async function confirmMatch(inb) {
    const ids = Array.from(selected[inb.id] || []);
    if (!ids.length) return;
    setBusy(inb.id);
    const now = new Date().toISOString();
    const { error } = await sb.from('warranty_registrations').update({
      status: 'registered', registered_at: now, registered_via: 'manual_review', matched_inbound_id: inb.id,
      confirmation_number: (inb.parsed && inb.parsed.confirmation_number) || null, hold_reasons: [],
    }).in('id', ids).neq('status', 'registered');
    if (!error) {
      await sb.from('warranty_inbound').update({
        status: 'resolved_matched', matched_registration_ids: ids,
        reviewed_by: validUUID(currentUser?.id) || null, reviewed_at: now,
      }).eq('id', inb.id);
    }
    setBusy(null);
    if (error) { alert(`Failed: ${error.message}`); return; }
    load();
  }

  async function rejectInbound(inb) {
    setBusy(inb.id);
    const { error } = await sb.from('warranty_inbound').update({
      status: 'resolved_rejected', reviewed_by: validUUID(currentUser?.id) || null, reviewed_at: new Date().toISOString(),
    }).eq('id', inb.id);
    setBusy(null);
    if (error) { alert(`Failed: ${error.message}`); return; }
    load();
  }

  // Undo a wrong auto-match: units go back to "email sent", legacy flag cleared, email back in the queue.
  async function undoAuto(inb) {
    if (!confirm('Undo this auto-match? The units go back to "email sent" and the email returns to the review list.')) return;
    setBusy(inb.id);
    const ids = inb.matched_registration_ids || [];
    const { error } = await sb.from('warranty_registrations').update({
      status: 'sent', registered_at: null, registered_via: null, matched_inbound_id: null, confirmation_number: null,
    }).in('id', ids).eq('matched_inbound_id', inb.id);
    if (!error) {
      for (const id of ids) {
        const r = regById[id];
        if (r && r.equipment_id) await updateEquipment(r.equipment_id, { warranty_registered: false, warranty_registered_date: null });
      }
      await sb.from('warranty_inbound').update({ status: 'needs_review', summary: 'Auto-match undone by reviewer.' }).eq('id', inb.id);
    }
    setBusy(null);
    if (error) { alert(`Failed: ${error.message}`); return; }
    load();
  }

  function regLine(r) {
    const e = r.equipment || {};
    return {
      title: `${(r.customers && r.customers.name) || 'Unknown customer'}${e.label ? ' — ' + e.label : ''}`,
      sub: [e.brand, e.model_number, e.serial_number ? `S/N ${e.serial_number}` : null, r.email_token ? `W-${r.email_token}` : null].filter(Boolean).join(' · '),
    };
  }

  const card = { marginBottom:10, background:'var(--panel)', border:'1px solid var(--line)', borderRadius:10, padding:12 };
  const head = { fontSize:13, fontWeight:700, color:'var(--muted)', margin:'14px 0 8px' };
  const small = { fontSize:11, color:'var(--muted)' };

  // Called as plain functions (not <RegPick/>), so React doesn't remount them — and the
  // search input inside InboundCard keeps focus — on every keystroke.
  function RegPick({ inb, r, reasons }) {
    const { title, sub } = regLine(r);
    const on = (selected[inb.id] || new Set()).has(r.id);
    return (
      <button onClick={() => toggleSel(inb.id, r.id)}
        style={{ display:'flex', gap:10, width:'100%', textAlign:'left', padding:'8px 0', borderTop:'1px solid var(--line)' }}>
        <span className="mono" style={{ fontSize:16, color: on ? 'var(--green)' : 'var(--muted)' }}>{on ? '☑' : '☐'}</span>
        <span style={{ flex:1 }}>
          <span className="head" style={{ fontSize:13, display:'block' }}>{title}</span>
          <span className="mono" style={{ ...small, display:'block' }}>{sub}{r.status === 'registered' ? ' · ALREADY REGISTERED' : ''}</span>
          {reasons && <span className="mono" style={{ fontSize:10, color:'var(--olive-bright)', display:'block' }}>{reasons}</span>}
        </span>
      </button>
    );
  }

  function InboundCard({ inb }) {
    const p = inb.parsed || {};
    const cands = (inb.candidates || []).map(c => ({ c, r: regById[c.registration_id] })).filter(x => x.r);
    const q = (search[inb.id] || '').trim().toLowerCase();
    const candIds = new Set(cands.map(x => x.r.id));
    const found = q.length >= 2 ? regs.filter(r => !candIds.has(r.id) && [
      r.customers && r.customers.name, r.equipment && r.equipment.serial_number, r.equipment && r.equipment.model_number, r.email_token,
    ].some(v => String(v || '').toLowerCase().includes(q))).slice(0, 8) : [];
    const nSel = (selected[inb.id] || new Set()).size;
    return (
      <div style={card}>
        <div className="head" style={{ fontSize:14, fontWeight:700 }}>{inb.subject || '(no subject)'}</div>
        <div className="mono" style={small}>{inb.from_email || 'unknown sender'} · {inb.received_at ? new Date(inb.received_at).toLocaleString() : ''}</div>
        {(p.reply_to_tokens || []).length > 0 && (
          <div className="mono" style={{ fontSize:11, color:'var(--olive-bright)', marginTop:4 }}>↩ REPLY TO OUR EMAIL {(p.reply_to_tokens || []).map(t => `W-${t}`).join(', ')}</div>
        )}
        <div className="mono" style={{ fontSize:12, color:'var(--brass-bright)', marginTop:6 }}>
          {inb.summary}{inb.confidence != null ? ` (${Math.round(Number(inb.confidence) * 100)}%)` : ''}
        </div>
        <div className="mono" style={{ ...small, marginTop:4 }}>
          {[(p.tokens || []).map(t => `REF W-${t}`).join(' '), (p.serials || []).length ? `S/N ${(p.serials || []).join(', ')}` : '',
            (p.models || []).length ? `MODEL ${(p.models || []).join(', ')}` : '', p.confirmation_number ? `CONF ${p.confirmation_number}` : ''].filter(Boolean).join(' · ') || 'nothing parsed'}
        </div>
        <button onClick={() => setOpenSnippet(openSnippet === inb.id ? null : inb.id)} className="mono"
          style={{ ...small, textDecoration:'underline', background:'none', border:'none', padding:0, marginTop:4 }}>
          {openSnippet === inb.id ? 'hide email' : 'show email'}
        </button>
        {openSnippet === inb.id && (
          <pre style={{ whiteSpace:'pre-wrap', fontFamily:'inherit', fontSize:12, background:'var(--bg)', padding:8, borderRadius:6, marginTop:6 }}>{inb.snippet}</pre>
        )}
        <div style={{ marginTop:8 }}>
          {cands.map(({ c, r }) => <React.Fragment key={r.id}>{RegPick({ inb, r, reasons: `${Math.round((c.confidence || 0) * 100)}% · ${(c.reasons || []).join(', ')}` })}</React.Fragment>)}
          <input value={search[inb.id] || ''} onChange={e => setSearch(s => ({ ...s, [inb.id]: e.target.value }))}
            placeholder="Find other equipment (customer, serial, model, ref)" style={{ marginTop:8, padding:8, fontSize:14 }} />
          {found.map(r => <React.Fragment key={r.id}>{RegPick({ inb, r })}</React.Fragment>)}
        </div>
        <div style={{ display:'flex', gap:8, marginTop:10 }}>
          <button onClick={() => confirmMatch(inb)} disabled={!nSel || busy === inb.id} className="head"
            style={{ flex:1, padding:11, borderRadius:8, fontSize:13, fontWeight:700, background: nSel ? 'var(--green)' : 'var(--panel-2)', color: nSel ? '#fff' : 'var(--muted)' }}>
            {busy === inb.id ? 'SAVING…' : `MARK ${nSel || ''} REGISTERED`}
          </button>
          <button onClick={() => rejectInbound(inb)} disabled={busy === inb.id} className="head"
            style={{ flex:1, padding:11, borderRadius:8, fontSize:13, fontWeight:700, background:'transparent', border:'1px solid var(--line)', color:'var(--text)' }}>
            NOT A CONFIRMATION
          </button>
        </div>
      </div>
    );
  }

  return (
