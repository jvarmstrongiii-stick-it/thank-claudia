/* ── CapacitorCalc ─────────────────────────────────────────────────────────── */
function CapacitorCalc({ onClose }) {
  const [step, setStep] = useState(1);
  const [terminal, setTerminal] = useState(null);
  const [amps, setAmps] = useState('');
  const [volts, setVolts] = useState('');
  const [nameplate, setNameplate] = useState('');

  const result = (amps && volts && parseFloat(amps) > 0 && parseFloat(volts) > 0)
    ? (parseFloat(amps) * 2652) / parseFloat(volts) : null;
  const npVal = parseFloat(nameplate);
  const low = npVal * 0.94;
  const high = npVal * 1.06;
  const inRange = result && npVal ? result >= low && result <= high : null;

  const sectionLabel = { fontSize:11, color:"var(--muted)", fontWeight:600, letterSpacing:"0.08em", marginBottom:6 };
  const inputStyle = { width:"100%", fontSize:26, fontWeight:700, textAlign:"center", padding:"14px", borderRadius:10,
    background:"var(--bg)", border:"1px solid var(--line)", color:"var(--text)", boxSizing:"border-box" };
  const stepBtn = (label, action, disabled) => (
    <button onClick={action} disabled={disabled} className="head"
      style={{ width:"100%", marginTop:14, padding:16, borderRadius:10, fontSize:16, fontWeight:700,
        background: disabled ? "var(--line)" : "var(--olive-bright)", color: disabled ? "var(--muted)" : "var(--bg)" }}>
      {label}
    </button>
  );

  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.85)", zIndex:300, display:"flex", flexDirection:"column", justifyContent:"flex-end" }}>
      <div style={{ background:"var(--panel)", borderRadius:"16px 16px 0 0", padding:20, maxHeight:"90vh", overflowY:"auto" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:18 }}>
          <div className="head" style={{ fontSize:18, fontWeight:700 }}>⚡ CAPACITOR CALCULATOR</div>
          <button onClick={onClose} className="mono" style={{ fontSize:20, color:"var(--muted)" }}>✕</button>
        </div>

        {/* STEP INDICATOR */}
        <div style={{ display:"flex", gap:6, marginBottom:20 }}>
          {[1,2,3,4].map(s => (
            <div key={s} style={{ flex:1, height:4, borderRadius:2,
              background: s <= step ? "var(--olive-bright)" : "var(--line)" }} />
          ))}
        </div>

        {step === 1 && (
          <div>
            <div className="mono" style={{ ...sectionLabel }}>STEP 1 OF 4 — SAFETY &amp; SETUP</div>
            <div style={{ background:"#b5432f18", border:"1px solid #b5432f", borderRadius:10, padding:14, marginBottom:16 }}>
              <div className="head" style={{ fontSize:13, fontWeight:700, color:"#b5432f", marginBottom:6 }}>⚠ SAFETY FIRST</div>
              <div style={{ fontSize:14, lineHeight:1.6 }}>If the capacitor has been removed from the unit, discharge it first — short across the terminals with an insulated screwdriver before touching anything.</div>
            </div>
            <div className="mono" style={{ ...sectionLabel, marginTop:16 }}>WHICH SIDE ARE YOU TESTING?</div>
            <div style={{ display:"flex", gap:10, marginTop:8 }}>
              {['HERM', 'FAN'].map(t => (
                <button key={t} onClick={() => setTerminal(t)} className="head"
                  style={{ flex:1, padding:18, borderRadius:10, fontSize:18, fontWeight:700,
                    border:`2px solid ${terminal===t ? "var(--olive-bright)" : "var(--line)"}`,
                    color: terminal===t ? "var(--olive-bright)" : "var(--muted)",
                    background:"transparent" }}>
                  {t === 'HERM' ? '🌀 HERM' : '💨 FAN'}
                  <div style={{ fontSize:11, fontWeight:400, marginTop:4, color:"var(--muted)" }}>
                    {t === 'HERM' ? 'Compressor' : 'Fan motor'}
                  </div>
                </button>
              ))}
            </div>
            {stepBtn('NEXT — MEASURE AMPS →', () => setStep(2), !terminal)}
          </div>
        )}

        {step === 2 && (
          <div>
            <div className="mono" style={{ ...sectionLabel }}>STEP 2 OF 4 — MEASURE START WINDING AMPS</div>
            <div style={{ background:"var(--bg)", border:"1px solid var(--line)", borderRadius:10, padding:14, marginBottom:16, fontSize:14, lineHeight:1.7 }}>
              <div style={{ marginBottom:6 }}>Set your clamp meter to <strong>AC Amps</strong>.</div>
              <div>Clamp around the <strong>{terminal === 'HERM' ? 'compressor start wire (to HERM terminal)' : 'fan motor start wire (to FAN terminal)'}</strong> while the unit is running.</div>
            </div>
            <div className="mono" style={{ ...sectionLabel }}>AMPS READING</div>
            <input type="number" inputMode="decimal" placeholder="e.g. 4.2"
              value={amps} onChange={e => setAmps(e.target.value)} style={inputStyle} />
            <div style={{ display:"flex", gap:10, marginTop:14 }}>
              <button onClick={() => setStep(1)} className="head"
                style={{ padding:"14px 20px", borderRadius:10, fontSize:14, background:"transparent",
                  border:"1px solid var(--line)", color:"var(--muted)" }}>‹ BACK</button>
              {stepBtn('NEXT — MEASURE VOLTAGE →', () => setStep(3), !amps || parseFloat(amps) <= 0)}
            </div>
          </div>
        )}

        {step === 3 && (
          <div>
            <div className="mono" style={{ ...sectionLabel }}>STEP 3 OF 4 — MEASURE CAPACITOR VOLTAGE</div>
            <div style={{ background:"var(--bg)", border:"1px solid var(--line)", borderRadius:10, padding:14, marginBottom:16, fontSize:14, lineHeight:1.7 }}>
              <div style={{ marginBottom:6 }}>Set your DMM to <strong>AC Volts</strong>.</div>
              <div>Place probes across the <strong>C</strong> and <strong>{terminal}</strong> terminals while the unit is running.</div>
            </div>
            <div className="mono" style={{ ...sectionLabel }}>VOLTAGE READING</div>
            <input type="number" inputMode="decimal" placeholder="e.g. 370"
              value={volts} onChange={e => setVolts(e.target.value)} style={inputStyle} />
            <div style={{ display:"flex", gap:10, marginTop:14 }}>
              <button onClick={() => setStep(2)} className="head"
                style={{ padding:"14px 20px", borderRadius:10, fontSize:14, background:"transparent",
                  border:"1px solid var(--line)", color:"var(--muted)" }}>‹ BACK</button>
              {stepBtn('CALCULATE →', () => setStep(4), !volts || parseFloat(volts) <= 0)}
            </div>
          </div>
        )}

        {step === 4 && (
          <div>
            <div className="mono" style={{ ...sectionLabel }}>STEP 4 OF 4 — RESULT</div>
            <div style={{ background:"var(--bg)", border:"1px solid var(--line)", borderRadius:10, padding:20, textAlign:"center", marginBottom:16 }}>
              <div className="mono" style={{ fontSize:12, color:"var(--muted)", marginBottom:6 }}>CALCULATED CAPACITANCE</div>
              <div className="head" style={{ fontSize:48, fontWeight:700, color:"var(--olive-bright)", lineHeight:1 }}>
                {result ? result.toFixed(2) : '—'}
              </div>
              <div className="mono" style={{ fontSize:16, color:"var(--muted)", marginTop:4 }}>μF ({terminal} side)</div>
              <div style={{ marginTop:12, fontSize:13, color:"var(--muted)" }}>
                {parseFloat(amps).toFixed(2)} A × 2652 ÷ {parseFloat(volts).toFixed(1)} V
              </div>
            </div>

            <div className="mono" style={{ ...sectionLabel }}>NAMEPLATE RATING (μF)</div>
            <input type="number" inputMode="decimal" placeholder="e.g. 45 or 5"
              value={nameplate} onChange={e => setNameplate(e.target.value)} style={{ ...inputStyle, fontSize:22 }} />

            {nameplate && npVal > 0 && result && (
              <div style={{ marginTop:14, padding:16, borderRadius:10,
                background: inRange ? "#6fa33d18" : "#b5432f18",
                border: `1px solid ${inRange ? "#6fa33d" : "#b5432f"}` }}>
                <div className="head" style={{ fontSize:16, fontWeight:700, color: inRange ? "#6fa33d" : "#b5432f", marginBottom:6 }}>
                  {inRange ? '✓ WITHIN TOLERANCE' : '✗ OUT OF TOLERANCE — REPLACE CAPACITOR'}
                </div>
                <div style={{ fontSize:13, color:"var(--text)", lineHeight:1.6 }}>
                  Nameplate: <strong>{npVal} μF</strong> &nbsp;|&nbsp; Acceptable range (±6%): <strong>{low.toFixed(2)} – {high.toFixed(2)} μF</strong><br />
                  Measured: <strong style={{ color: inRange ? "#6fa33d" : "#b5432f" }}>{result.toFixed(2)} μF</strong>
                </div>
              </div>
            )}

            <div style={{ display:"flex", gap:10, marginTop:16 }}>
              <button onClick={() => { setStep(1); setAmps(''); setVolts(''); setNameplate(''); setTerminal(null); }} className="head"
                style={{ flex:1, padding:14, borderRadius:10, fontSize:14, background:"transparent",
                  border:"1px solid var(--line)", color:"var(--muted)" }}>↺ NEW TEST</button>
              <button onClick={onClose} className="head"
                style={{ flex:1, padding:14, borderRadius:10, fontSize:14, fontWeight:700,
                  background:"var(--olive-bright)", color:"var(--bg)" }}>DONE</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ── ChoresView ────────────────────────────────────────────────────────────── */
function ChoresView({ chores, jobs, users, onClose, onToggle, onEdit, onOpenJob, onAdd, onDelete, currentUser, title, ctaLabel, initialEditId }) {
  const [desc, setDesc] = useState('');
  const [jobId, setJobId] = useState('');
  const [assignedTo, setAssignedTo] = useState('');
  const [adding, setAdding] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [editDesc, setEditDesc] = useState('');
  const [editJobId, setEditJobId] = useState('');
  const [editAssignedTo, setEditAssignedTo] = useState('');
  const [showCompleted, setShowCompleted] = useState(false);
  const open = sortChoresForUser(chores.filter(c => !c.done), currentUser?.id);
  const done = chores.filter(c => c.done);
  const jobsForPicker = jobs.filter(j => j.status !== 'Closed')
    .slice().sort((a,b) => (b.created_at||'').localeCompare(a.created_at||''));

  async function submit() {
    if (!desc.trim()) return;
    await onAdd(desc.trim(), jobId||null, assignedTo||null);
    setDesc(''); setJobId(''); setAssignedTo(''); setAdding(false);
  }

  function startEdit(c) {
    setEditingId(c.id);
    setEditDesc(c.label);
    setEditJobId(c.job_id || '');
    setEditAssignedTo(c.assigned_to || '');
  }

  // Deep-link straight into edit mode for a specific chore (e.g. from the dashboard strip's ✎).
  useEffect(() => {
    if (!initialEditId) return;
    const target = chores.find(c => c.id === initialEditId);
    if (target) startEdit(target);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [initialEditId]);

  async function saveEdit(choreId) {
    if (!editDesc.trim()) return;
    await onEdit(choreId, { description: editDesc.trim(), job_id: editJobId||null, assigned_to: editAssignedTo||null });
    setEditingId(null);
  }

  function ChoreRow({ c, isDone }) {
    const linkedJob = c.job_id ? jobs.find(j => j.id === c.job_id) : null;
    const assignee = c.assigned_to ? users.find(u => u.id === c.assigned_to) : null;
    const isEditing = editingId === c.id;

    if (isEditing) {
      return (
        <div className="fade-in" style={{ padding:"12px 0", borderBottom:"1px solid var(--line)" }}>
          <input value={editDesc} onChange={e=>setEditDesc(e.target.value)} autoFocus
            style={{ marginBottom:8 }} />
          <select value={editJobId} onChange={e=>setEditJobId(e.target.value)} style={{ marginBottom:8 }}>
            <option value="">— Link to a job (optional) —</option>
            {jobsForPicker.map(j => (
              <option key={j.id} value={j.id}>{j.site_name || j.customer}{j.site_address ? ` · ${j.site_address}` : ''}</option>
            ))}
          </select>

            : <span style={{ display:"block", width:20, height:20, borderRadius:4, border:"1.5px solid var(--brass)" }} />

  }

  return (
    <div style={{ position:"fixed", inset:0, zIndex:100, background:"var(--bg)", overflowY:"auto", paddingBottom: ctaLabel ? 90 : 40 }}>
      <div style={{ padding:"16px", borderBottom:"1px solid var(--line)", background:"var(--panel)", display:"flex", alignItems:"center", gap:12, position:"sticky", top:0, zIndex:10 }}>
        <button onClick={onClose} className="head" style={{ fontSize:36, color:"var(--muted)", padding:"4px 12px 4px 4px", lineHeight:1 }}>‹</button>
        <div className="head" style={{ fontSize:18, fontWeight:600 }}>{title || 'CHORES'}</div>
        <button onClick={() => { setAdding(v=>!v); setEditingId(null); }} className="head"

          <input value={desc} onChange={e=>setDesc(e.target.value)}

          <select value={jobId} onChange={e=>setJobId(e.target.value)} style={{ marginBottom:10 }}>

          <select value={assignedTo} onChange={e=>setAssignedTo(e.target.value)} style={{ marginBottom:12 }}>

          <button onClick={submit} className="head"
            style={{ width:"100%", padding:"14px", borderRadius:9, fontSize:15, fontWeight:700,

        {done.length > 0 && (
          <div style={{ marginTop:24 }}>

/* ── Lightbox ──────────────────────────────────────────────────────────────── */
function Lightbox({ photo, onClose, onScanResult, onScanned, onReceiptImport }) {
  const url = photo.url;
  const [scale, setScale] = useState(1);
  const [offset, setOffset] = useState({ x:0, y:0 });
  const lastDist = useRef(null);
  const lastMid  = useRef(null);
  const dragStart = useRef(null);
  const lastOffset = useRef({ x:0, y:0 });
  const [scanning, setScanning] = useState(false);
  const [scanResult, setScanResult] = useState(null);
  const [scanError, setScanError] = useState(null);
  const [scanningReceipt, setScanningReceipt] = useState(false);
  const [receiptResult, setReceiptResult] = useState(null);
  const [receiptError, setReceiptError] = useState(null);

  function onTouchStart(e) {
    if (e.touches.length === 2) {
      lastDist.current = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      lastMid.current = {
        x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
        y: (e.touches[0].clientY + e.touches[1].clientY) / 2,
      };
    } else if (e.touches.length === 1 && scale > 1) {
      dragStart.current = { x: e.touches[0].clientX - lastOffset.current.x, y: e.touches[0].clientY - lastOffset.current.y };
    }
  }

  function onTouchMove(e) {
    e.preventDefault();
    if (e.touches.length === 2 && lastDist.current) {
      const dist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      setScale(s => Math.max(1, Math.min(6, s * (dist / lastDist.current))));
      lastDist.current = dist;
    } else if (e.touches.length === 1 && dragStart.current) {
      const nx = e.touches[0].clientX - dragStart.current.x;
      const ny = e.touches[0].clientY - dragStart.current.y;
      lastOffset.current = { x: nx, y: ny };
      setOffset({ x: nx, y: ny });
    }
  }

  function onTouchEnd(e) {
    if (e.touches.length < 2) lastDist.current = null;
    if (e.touches.length === 0) dragStart.current = null;
    if (scale <= 1) { setOffset({ x:0, y:0 }); lastOffset.current = { x:0, y:0 }; }
  }

  function handleTap(e) {
    if (scanResult || receiptResult) return;
    if (scale === 1) onClose();
    else { setScale(1); setOffset({ x:0, y:0 }); lastOffset.current = { x:0, y:0 }; }
  }

  async function doScan(e) {
    e.stopPropagation();
    setScanning(true); setScanResult(null); setScanError(null);
    try {
      const result = await scanNameplateFromUrl(url);
      const found = Object.entries(result).filter(([,v]) => v != null);
      if (found.length === 0) setScanError('No equipment data found in this photo.');
      else setScanResult(result);
      if (photo.id && onScanned) onScanned(photo.id, result);
    } catch(err) {
      setScanError(err.message);
    } finally {
      setScanning(false);
    }
  }

  async function doScanReceipt(e) {
    e.stopPropagation();
    setScanningReceipt(true); setReceiptResult(null); setReceiptError(null);
    try {
      const result = await scanReceiptFromUrl(url);
      if (result.vendor == null && result.amount == null && result.date == null) {
        setReceiptError('No receipt data found in this photo.');
      } else {
        setReceiptResult(result);
      }
      if (photo.id && onScanned) onScanned(photo.id, result);
    } catch(err) {
      setReceiptError(err.message);
    } finally {
      setScanningReceipt(false);
    }
  }

  async function doDownload(e) {
    e.stopPropagation();
    try {
      const resp = await fetch(url);
      const blob = await resp.blob();
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = `photo-${Date.now()}.jpg`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(blobUrl);
    } catch(err) {
      alert(`Download failed: ${err.message}`);
    }
  }

  async function doShare(e) {
    e.stopPropagation();
    try {
      const resp = await fetch(url);
      const blob = await resp.blob();
      const file = new File([blob], `photo-${Date.now()}.jpg`, { type: blob.type || 'image/jpeg' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file] });
      } else if (navigator.share) {
        await navigator.share({ url });
      } else {
        alert('Sharing is not supported on this device.');
      }
    } catch(err) {
      if (err.name !== 'AbortError') alert(`Share failed: ${err.message}`);
    }
  }

  return (
    <div
      onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}
      onClick={handleTap}
      style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.95)", zIndex:200,
        display:"flex", alignItems:"center", justifyContent:"center", overflow:"hidden",
        touchAction:"none", cursor: scale > 1 ? "zoom-out" : "zoom-in" }}>
      <img src={url} alt=""
        style={{ maxWidth:"100%", maxHeight:"100%", objectFit:"contain",
          transform:`scale(${scale}) translate(${offset.x/scale}px,${offset.y/scale}px)`,
          transformOrigin:"center", transition: scale === 1 ? "transform 0.2s" : "none",
          userSelect:"none", pointerEvents:"none" }} />
      <button onClick={e => { e.stopPropagation(); onClose(); }}
        style={{ position:"absolute", top:16, right:16, width:36, height:36, borderRadius:"50%",
          background:"rgba(0,0,0,0.6)", color:"#fff", fontSize:20, lineHeight:"36px", textAlign:"center",
          border:"1px solid rgba(255,255,255,0.2)" }}>✕</button>

      {/* Bottom bar */}
      <div onClick={e => e.stopPropagation()}
        style={{ position:"absolute", bottom:0, left:0, right:0, padding:"12px 16px 28px",
          background:"linear-gradient(transparent, rgba(0,0,0,0.85))" }}>
        {!scanResult && !receiptResult && (
          <div style={{ display:"flex", gap:8, marginBottom:8 }}>
            <button onClick={doDownload} className="head"
              style={{ flex:1, padding:"12px", borderRadius:9, fontSize:14, fontWeight:700,
                background:"rgba(255,255,255,0.1)", color:"#fff", border:"none" }}>
              ⬇ DOWNLOAD
            </button>
            {!!(typeof navigator !== "undefined" && navigator.share) && (
              <button onClick={doShare} className="head"
                style={{ flex:1, padding:"12px", borderRadius:9, fontSize:14, fontWeight:700,
                  background:"rgba(255,255,255,0.1)", color:"#fff", border:"none" }}>
                ⤴ SHARE
              </button>
            )}
          </div>
        )}
        {!scanResult && !receiptResult && !scanError && !receiptError
          && photo.kind !== 'receipt' && photo.kind !== 'scanned'
          && photo.photo_type !== 'equipment' && !photo.ocr_data && (
          <div style={{ display:"flex", gap:8, marginBottom:8 }}>
            <button onClick={doScan} disabled={scanning || scanningReceipt} className="head"
              style={{ flex:1, padding:"12px", borderRadius:9, fontSize:13, fontWeight:700,
                background: scanning ? "rgba(255,255,255,0.1)" : "rgba(180,150,60,0.85)",
                color: scanning ? "rgba(255,255,255,0.5)" : "#000",
                border:"none" }}>
              {scanning ? '🔍 SCANNING…' : '🔍 SCAN FOR EQUIPMENT'}
            </button>
            <button onClick={doScanReceipt} disabled={scanning || scanningReceipt} className="head"
              style={{ flex:1, padding:"12px", borderRadius:9, fontSize:13, fontWeight:700,
                background: scanningReceipt ? "rgba(255,255,255,0.1)" : "rgba(180,150,60,0.85)",
                color: scanningReceipt ? "rgba(255,255,255,0.5)" : "#000",
                border:"none" }}>
              {scanningReceipt ? '🧾 SCANNING…' : '🧾 SCAN AS RECEIPT'}
            </button>
          </div>
        )}
        {scanError && (
          <div className="mono" style={{ fontSize:12, color:"#f87171", textAlign:"center", marginBottom:8 }}>{scanError}</div>
        )}
        {receiptError && (
          <div className="mono" style={{ fontSize:12, color:"#f87171", textAlign:"center", marginBottom:8 }}>{receiptError}</div>
        )}
        {scanResult && (
          <div style={{ background:"rgba(0,0,0,0.8)", border:"1px solid rgba(180,150,60,0.5)", borderRadius:10, padding:12, marginBottom:8 }}>
            <div className="mono" style={{ fontSize:11, color:"rgba(180,150,60,0.9)", marginBottom:8 }}>FOUND ON NAMEPLATE</div>
            {Object.entries(scanResult).filter(([,v]) => v != null).map(([k,v]) => (
              <div key={k} style={{ display:"flex", gap:8, marginBottom:4 }}>
                <span className="mono" style={{ fontSize:11, color:"rgba(255,255,255,0.5)", minWidth:80 }}>{k.replace(/_/g,' ').toUpperCase()}</span>
                <span style={{ fontSize:12, color:"#fff" }}>{v}</span>
              </div>
            ))}
            <div style={{ display:"flex", gap:8, marginTop:12 }}>
              <button onClick={() => { onScanResult(scanResult); onClose(); }} className="head"
                style={{ flex:1, padding:"10px", borderRadius:8, fontSize:13, fontWeight:700,
                  background:"rgba(180,150,60,0.9)", color:"#000" }}>
                IMPORT TO JOB
              </button>
              <button onClick={() => setScanResult(null)} className="head"
                style={{ padding:"10px 16px", borderRadius:8, fontSize:13,
                  background:"rgba(255,255,255,0.1)", color:"#fff" }}>
                DISMISS
              </button>
            </div>
          </div>
        )}
        {receiptResult && (
          <div style={{ background:"rgba(0,0,0,0.8)", border:"1px solid rgba(180,150,60,0.5)", borderRadius:10, padding:12, marginBottom:8 }}>
            <div className="mono" style={{ fontSize:11, color:"rgba(180,150,60,0.9)", marginBottom:8 }}>FOUND ON RECEIPT</div>
            {Object.entries(receiptResult).filter(([,v]) => v != null).map(([k,v]) => (
              <div key={k} style={{ display:"flex", gap:8, marginBottom:4 }}>
                <span className="mono" style={{ fontSize:11, color:"rgba(255,255,255,0.5)", minWidth:80 }}>{k.replace(/_/g,' ').toUpperCase()}</span>
                <span style={{ fontSize:12, color:"#fff" }}>{k === 'amount' ? money(v) : v}</span>
              </div>
            ))}
            <div style={{ display:"flex", gap:8, marginTop:12 }}>
              <button onClick={() => { onReceiptImport(photo, receiptResult); onClose(); }} className="head"
                style={{ flex:1, padding:"10px", borderRadius:8, fontSize:13, fontWeight:700,
                  background:"rgba(180,150,60,0.9)", color:"#000" }}>
                IMPORT AS RECEIPT
              </button>
              <button onClick={() => setReceiptResult(null)} className="head"
                style={{ padding:"10px 16px", borderRadius:8, fontSize:13,
                  background:"rgba(255,255,255,0.1)", color:"#fff" }}>
                DISMISS
              </button>
            </div>
          </div>
        )}
        {!scanResult && !receiptResult && scale === 1 && (
          <div className="mono" style={{ textAlign:"center", fontSize:11, color:"rgba(255,255,255,0.3)" }}>
            PINCH TO ZOOM · TAP TO CLOSE
          </div>
        )}
      </div>
    </div>
  );
}

function JobDetail({ job, onBack, onUpdate, onEdit, onDelete, currentUser, users, jobs, browseMode,
                     clockSession, onFlipToOnSite, onPause, onResume, onLeaving, clockUndo, onUndoClock, getTodayMs, onJobSelect, showToast, onDuplicate, onUpdateMaterials, onUpdateDeposit, focusTimeLog }) {
  const [showCapCalc, setShowCapCalc] = useState(false);
  const [showStatus, setShowStatus] = useState(false);
  const [showMapsPrompt, setShowMapsPrompt] = useState(false);
  const [pendingStatus, setPendingStatus] = useState(null);
  const [confirmTime, setConfirmTime] = useState('');
  const [showResched, setShowResched] = useState(false);
  const [date, setDate] = useState(job.scheduled_date || todayISO());
  const [time, setTime] = useState(job.scheduled_time || nowTimeRounded15());
  const [originalAsk, setOriginalAsk] = useState(job.original_ask || '');
  const [notes, setNotes] = useState(job.notes || '');
  const [nextSteps, setNextSteps] = useState(job.next_steps || '');
  const [editingValue, setEditingValue] = useState(false);
  const [valueDraft, setValueDraft] = useState('');
  const [editingDeposit, setEditingDeposit] = useState(false);
  const [depositDraft, setDepositDraft] = useState({ amount:'', method:'cash', check_number:'' });

  const [equipmentList, setEquipmentList] = useState([]);
  const [expandedEquipId, setExpandedEquipId] = useState(null);
  const [showWarrantySheet, setShowWarrantySheet] = useState(null);
  const [editEquipItem, setEditEquipItem] = useState(null);
  const [scanQueue, setScanQueue] = useState([]);
  const [scanningCount, setScanningCount] = useState(0);
  const [pendingScanRetry, setPendingScanRetry] = useState(null);
  const [otherScanQueue, setOtherScanQueue] = useState([]);
  const [otherScanningCount, setOtherScanningCount] = useState(0);
  const [pendingOtherScanRetry, setPendingOtherScanRetry] = useState(null);
  const [deletingPhoto, setDeletingPhoto] = useState(null);
  const [history, setHistory] = useState(job.history || []);
  const [editingNote, setEditingNote] = useState(null); // { id, content } or null
  const [logText, setLogText] = useState(''); // "what we did today" entry box

  const [matText, setMatText] = useState('');

  const [shopAcquiredPending, setShopAcquiredPending] = useState(() => new Set());

  const [crew, setCrew] = useState([]);
  const [crewLog, setCrewLog] = useState(job.crewLog || []);
  const [expandedLogDays, setExpandedLogDays] = useState(() => new Set()); // day keys with their TIME LOG frame open
  const [editingLogPeriod, setEditingLogPeriod] = useState(null); // { name, day, idx } or null
  const [editLogStart, setEditLogStart] = useState('');
  const [editLogEnd, setEditLogEnd] = useState('');
  const [editLogJobId, setEditLogJobId] = useState(null);
  const [addingLogFor, setAddingLogFor] = useState(null); // user name or null
  const [addLogStatus, setAddLogStatus] = useState('In Route');
  const [addLogStart, setAddLogStart] = useState('');
  const [addLogEnd, setAddLogEnd] = useState('');
  const [activeCrew, setActiveCrew] = useState([]); // other-job In Route/On Site assignments, for crew location display
  const [onSiteCheck, setOnSiteCheck] = useState(null); // array of crew users to confirm 'On Site' for, or null
  const [pendingWrapUpJobId, setPendingWrapUpJobId] = useState(null);
  const [wrapUpMembers, setWrapUpMembers] = useState(null); // [{u, done: bool}] | null
  const [wrapUpQueue, setWrapUpQueue] = useState(null);     // [user] | null — sequential "what's next"
  const [travelCheck, setTravelCheck] = useState(null);    // { queue: [user], targetJobId } | null
  const [editingCrew, setEditingCrew] = useState(null); // user id being edited, or null
  const [showCompleteCheck, setShowCompleteCheck] = useState(null); // job id to prompt completion for, or null
  const [editCrewStatus, setEditCrewStatus] = useState('In Route');
  const [editCrewDateTime, setEditCrewDateTime] = useState('');
  const [editCrewJobId, setEditCrewJobId] = useState(null);
  const [receipts, setReceipts] = useState([]);
  const [addingReceipt, setAddingReceipt] = useState(false);
  const [rVendor, setRVendor] = useState('');
  const [rAmount, setRAmount] = useState('');
  const [rSaving, setRSaving] = useState(false);
  const [rScanning, setRScanning] = useState(false);
  const [rPaidBy, setRPaidBy] = useState(currentUser?.name || '');
  const [editingReceipt, setEditingReceipt] = useState(null); // { id, vendor, amount, date, paid_by }
  const [vendorOptions, setVendorOptions] = useState([]);
  const receiptFileRef = useRef();
  const receiptUploadRef = useRef();
  const [receiptPagePrompt, setReceiptPagePrompt] = useState(null); // receipt row — "more pages?" after a snap
  const receiptPageRef = useRef();        // hidden camera input for extra pages
  const receiptPageTargetRef = useRef(null); // which receipt the next page attaches to (ref, not state — set in the same tap that opens the camera)
  // All section collapsibles start CLOSED on every load (Jack's preference; persist-open wasn't surviving hard refresh)
  const [photosOpen, setPhotosOpenRaw] = useState(false);
  const [showPhotoSheet, setShowPhotoSheet] = useState(false);
  const [thisJobEquipOpen, setThisJobEquipOpenRaw] = useState(false);
  const [otherEquipOpen, setOtherEquipOpenRaw] = useState(false);
  const [crewStatusOpen, setCrewStatusOpenRaw] = useState(false);
  const [timeLogOpen, setTimeLogOpenRaw] = useState(false);
  const [recordLogOpen, setRecordLogOpenRaw] = useState(false);
  function setPhotosOpen(updater) {
    setPhotosOpenRaw(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      setSectionCollapsed('photos', !next);
      return next;
    });
  }
  function setThisJobEquipOpen(updater) {
    setThisJobEquipOpenRaw(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      setSectionCollapsed('thisJobEquip', !next);
      return next;
    });
  }
  function setOtherEquipOpen(updater) {
    setOtherEquipOpenRaw(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      setSectionCollapsed('otherEquip', !next);
      return next;
    });
  }
  function setCrewStatusOpen(updater) {
    setCrewStatusOpenRaw(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      setSectionCollapsed('crewStatus', !next);
      return next;
    });
  }
  function setTimeLogOpen(updater) {
    setTimeLogOpenRaw(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      setSectionCollapsed('timeLog', !next);
      return next;
    });
  }
  function setRecordLogOpen(updater) {
    setRecordLogOpenRaw(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      setSectionCollapsed('recordLog', !next);
      return next;
    });
  }
  const fileRef = useRef();
  const cameraRef = useRef();
  const scanRef = useRef();
  const scanGalleryRef = useRef();
  const otherScanRef = useRef();
  const otherScanGalleryRef = useRef();
  const timeLogRef = useRef();
  const travelCheckInFlight = useRef(false); // guards answerTravelCheck against a double-tap firing the same crew move twice
  // Deep-link from Hours' BY DAY tab: jump straight to this job's Time Log, on the day that was clicked.
  useEffect(() => {
    if (!focusTimeLog || focusTimeLog.jobId !== job.id) return;
    if (focusTimeLog.date) setExpandedLogDays(prev => new Set(prev).add(focusTimeLog.date));
    setTimeLogOpen(true);
    setTimeout(() => timeLogRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [focusTimeLog]);
  const [collageState, setCollageState] = React.useState(null);
  // null | { step:'unit' } | { step:'tag', unit:{id,url,storage_path} } | { step:'processing' }

  // Keep history in sync when parent refreshes job data (e.g. after voice note)
  useEffect(() => {
    setHistory(job.history || []);
  }, [job.history]);

  useEffect(() => {
    setMaterials(job.materials_needed || []);
  }, [job.materials_needed]);

  useEffect(() => {
    setNextSteps(job.next_steps || '');
  }, [job.next_steps]);

  async function addMaterial(text) {
    const t = (text || '').trim();
    if (!t) return;
    const next = [...materials, { text: t, acquired: false }];
    setMaterials(next);
    setMatText('');
    if (onUpdateMaterials) await onUpdateMaterials(job.id, next);
  }
  async function toggleMaterial(idx) {
    const wasAcquired = !!materials[idx]?.acquired;
    const next = materials.map((m, i) => i === idx ? { ...m, acquired: !m.acquired } : m);
    setMaterials(next);
    if (onUpdateMaterials) await onUpdateMaterials(job.id, next);
    if (!isShop) return;
    clearTimeout(shopHideTimers.current[idx]);
    if (!wasAcquired) {
      // freshly checked off on the shop list — stays visible with an inline UNDO, then hides
      setShopAcquiredPending(prev => new Set(prev).add(idx));
      shopHideTimers.current[idx] = setTimeout(() => {
        setShopAcquiredPending(prev => { const n = new Set(prev); n.delete(idx); return n; });
        delete shopHideTimers.current[idx];
      }, 4000);
    } else {
      // unchecked (undo tap, or re-toggled directly) — cancel any pending hide
      setShopAcquiredPending(prev => { const n = new Set(prev); n.delete(idx); return n; });
      delete shopHideTimers.current[idx];
    }
  }
  async function removeMaterial(idx) {
    const next = materials.filter((_, i) => i !== idx);
    setMaterials(next);
    if (onUpdateMaterials) await onUpdateMaterials(job.id, next);
  }

  useEffect(() => {
    setCrewLog(job.crewLog || []);
  }, [job.crewLog]);

  useEffect(() => {
    fetchPhotos(job.id).then(setPhotos);
    sb.from('receipts').select('*').eq('job_id', job.id).order('created_at')
      .then(({ data }) => setReceipts(data || []));
    fetchReceiptVendors().then(setVendorOptions);
  }, [job.id]);

  useEffect(() => {
    async function loadEquipment() {
      const mine = await fetchEquipment(job.id);
      if (mine === null) return; // fetch failed — keep whatever equipmentList already had rather than wiping it
      if (job._customer_id) {
        // Join jobs to get each equipment item's source site_address for address-scoped filtering.
        // .or() is required (not .neq()) because "OTHER AT THIS ADDRESS" scans are saved with
        // job_id: null (saveOtherEquipment) — SQL's `job_id <> job.id` is NULL/unknown for a null
        // job_id, so a plain .neq() silently excludes those rows from every future fetch, forever
        // (they only ever appeared via the local setEquipmentList right after saving them).
        const { data, error } = await sb.from('equipment')
          .select('*, jobs(site_address)')
          .eq('customer_id', job._customer_id)
          .or(`job_id.is.null,job_id.neq.${job.id}`)
          .order('created_at', { ascending: false });
        if (error) { console.warn('loadEquipment (other)', error); return; } // keep prior list, don't wipe it on a fetch error
        const rawSite = job._site_address_raw;
        const other = (data || []).filter(eq => {
          // A null job_id has no linked job to join a site_address through — it was scoped to
          // "this address" at save time via the button itself, so trust that instead of excluding it.
          if (eq.job_id == null) return true;
          const eqSite = eq.jobs?.site_address ?? null;
          return eqSite === rawSite;
        });
        setEquipmentList([...mine, ...other]);
      } else {
        setEquipmentList(mine);
      }
    }
    loadEquipment();
  }, [job.id, job._customer_id, job._site_address_raw]);

  useEffect(() => {
    fetchJobCrew(job.id).then(setCrew);
    fetchActiveCrewAssignments().then(setActiveCrew);
  }, [job.id]);

  async function setMyCrewStatus(status) {
    if (!currentUser?.id) return;
    const updated = await upsertJobCrewStatus(job.id, currentUser.id, status);
    if (!updated) return;
    const at = new Date().toISOString();
    const content = `Status → ${status} (${currentUser.name})`;
    const { data: noteRow } = await sb.from('job_notes').insert({
      job_id: job.id, content,
      source: 'system', created_at: at, user_id: currentUser.id,
    }).select().single();
    setCrewLog(prev => [...prev, { id: noteRow?.id, content, at }]);
    if (job.status !== status) onUpdate({ status, _skipNote: true });
    if (status === 'On Site') {
      // Re-fetch crew live so we catch status set on other devices
      const freshCrew = await fetchJobCrew(job.id);
      setCrew(freshCrew);
      const others = users.filter(u => u.id !== currentUser.id &&
        freshCrew.find(c => c.user_id === u.id)?.status === 'In Route');
      if (others.length > 0) setOnSiteCheck(others);
    } else {
      setCrew(prev => [...prev.filter(c => c.user_id !== currentUser.id), updated]);
    }
  }

  async function markOthersOnSite() {
    const targets = onSiteCheck || [];
    setOnSiteCheck(null);
    for (const u of targets) {
      const updated = await upsertJobCrewStatus(job.id, u.id, 'On Site');
      if (!updated) continue;
      setCrew(prev => [...prev.filter(c => c.user_id !== u.id), updated]);
      const at = new Date().toISOString();
      const content = `Status → On Site (${u.name})`;
      const { data: noteRow } = await sb.from('job_notes').insert({
        job_id: job.id, content,
        source: 'system', created_at: at, user_id: currentUser?.id || null,
      }).select().single();
      setCrewLog(prev => [...prev, { id: noteRow?.id, content, at }]);
    }
    if (targets.length > 0 && job.status !== 'On Site') onUpdate({ status: 'On Site', _skipNote: true });
  }

  async function doCrewWrapUp(jobId) {
    setPendingWrapUpJobId(null);
    const freshCrew = await fetchJobCrew(jobId);
    const others = users.filter(u =>
      u.id !== currentUser?.id &&
      freshCrew.find(c => c.user_id === u.id && c.status === 'On Site')
    );
    if (others.length > 0) setWrapUpMembers(others.map(u => ({ u, done: true })));
  }

  function confirmWrapUp() {
    const doneUsers = (wrapUpMembers || []).filter(m => m.done).map(m => m.u);
    setWrapUpMembers(null);
    if (doneUsers.length > 0) setWrapUpQueue(doneUsers);
  }

  async function startTravelCheck(targetJobId) {
    const freshCrew = await fetchJobCrew(job.id);
    const others = users.filter(u =>
      u.id !== currentUser?.id &&
      freshCrew.find(c => c.user_id === u.id && c.status === 'On Site')
    );
    if (others.length > 0) setTravelCheck({ queue: others, targetJobId });
  }

  async function answerTravelCheck(comingAlong) {
    if (travelCheckInFlight.current) return;
    travelCheckInFlight.current = true;
    try {
      if (!travelCheck || travelCheck.queue.length === 0) { setTravelCheck(null); return; }
      const [person, ...rest] = travelCheck.queue;
      if (comingAlong) {
        const at = new Date().toISOString();
        const targetJob = (jobs||[]).find(j => j.id === travelCheck.targetJobId);
        const { note: leaveNote } = await clearCrewWithNote(job.id, person.id, person.name, at, ` — with ${currentUser.name}`, currentUser?.id || null);
        if (leaveNote) setCrewLog(prev => [...prev, { id: leaveNote.id, content: leaveNote.content, at }]);
        await upsertJobCrewStatus(travelCheck.targetJobId, person.id, 'In Route');
        await sb.from('job_notes').insert({
          job_id: travelCheck.targetJobId,
          content: `Status → In Route (${person.name}) — with ${currentUser.name}`,
          source: 'system', created_at: at, user_id: currentUser?.id || null,
        });
        await sb.from('notifications').insert({
          user_id: person.id,
          message: `${currentUser.name} has marked you In Route to ${targetJob?.customer || 'a job'}${targetJob?.site_address ? ' — ' + targetJob.site_address : ''}`,
          read: false, created_at: at,
        });
        setCrew(prev => prev.filter(c => c.user_id !== person.id));
      }
      setTravelCheck(rest.length > 0 ? { ...travelCheck, queue: rest } : null);
    } finally {
      travelCheckInFlight.current = false;
    }
  }

  async function routeCrewMember(u, targetJob) {
    const at = new Date().toISOString();
    const { note: leaveNote } = await clearCrewWithNote(job.id, u.id, u.name, at,
      ` — ${targetJob ? 'assigned' : 'marked done'} by ${currentUser?.name || 'office'}`, currentUser?.id || null);
    if (leaveNote) setCrewLog(prev => [...prev, { id: leaveNote.id, content: leaveNote.content, at }]);
    if (targetJob) {
      await upsertJobCrewStatus(targetJob.id, u.id, 'In Route');
      await sb.from('job_notes').insert({
        job_id: targetJob.id,
        content: `Status → In Route (${u.name}) — assigned by ${currentUser?.name || 'office'}`,
        source: 'system', created_at: at, user_id: currentUser?.id || null,
      });
      await sb.from('notifications').insert({
        user_id: u.id,
        message: `${currentUser?.name || 'Someone'} has marked you In Route to ${targetJob.customer}${targetJob.site_address ? ' — ' + targetJob.site_address : ''}`,
        read: false, created_at: at,
      });
    } else {
      await sb.from('notifications').insert({
        user_id: u.id,
        message: `${currentUser?.name || 'Someone'} has marked you done at this job — head back to shop`,
        read: false, created_at: at,
      });
    }
    setCrew(prev => prev.filter(c => c.user_id !== u.id));
    setWrapUpQueue(prev => prev.slice(1));
  }

  function openCrewEdit(u, c, elsewhere) {
    setEditingCrew(u.id);
    setEditCrewStatus(c?.status || elsewhere?.status || 'none');
    setEditCrewDateTime(toLocalDateTimeInput());
    setEditCrewJobId(c ? job.id : (elsewhere?.job_id || job.id));
  }

  async function saveCrewEdit(u) {
    const editorName = currentUser?.name && currentUser.name !== u.name ? ` — edited by ${currentUser.name}` : ' (edited)';
    if (editCrewStatus === 'none') {
      const targetJobId = editCrewJobId || job.id;
      const at = new Date().toISOString();
      const { error: clearError, note } = await clearCrewWithNote(targetJobId, u.id, u.name, at, editorName, currentUser?.id || null);
      if (clearError) { alert(`Couldn't clear status: ${clearError.message || clearError}`); return; }
      if (targetJobId === job.id) setCrew(prev => prev.filter(c => c.user_id !== u.id));
      setActiveCrew(prev => prev.filter(a => !(a.user_id === u.id && a.job_id === targetJobId)));
      if (targetJobId === job.id) setCrewLog(prev => [...prev, { id: note?.id, content: note?.content, at }]);
    } else {
      const statusAt = zonedLocalInputToISO(editCrewDateTime);
      const targetJobId = editCrewJobId || job.id;
      if (targetJobId !== job.id) {
        // Person is being moved to another job — close out their period HERE at the moment
        // the new status starts, or this job's timeline dangles open forever.
        const { note: leaveNote } = await clearCrewWithNote(job.id, u.id, u.name, statusAt, editorName, currentUser?.id || null);
        setCrew(prev => prev.filter(c => c.user_id !== u.id));
        setCrewLog(prev => [...prev, { id: leaveNote?.id, content: leaveNote?.content, at: statusAt }]);
      }
      const updated = await upsertJobCrewStatus(targetJobId, u.id, editCrewStatus, statusAt);
      if (updated && targetJobId === job.id) setCrew(prev => [...prev.filter(c => c.user_id !== u.id), updated]);
      const noteContent = `Status → ${editCrewStatus} (${u.name})${editorName}`;
      const { data: noteRow } = await sb.from('job_notes').insert({
        job_id: targetJobId, content: noteContent,
        source: 'system', created_at: statusAt, user_id: currentUser?.id || null,
      }).select().single();
      if (targetJobId === job.id) {
        setCrewLog(prev => [...prev, { id: noteRow?.id, content: noteContent, at: statusAt }]);
      }
    }
    setEditingCrew(null);
  }

  function openLogEdit(name, day, idx, period) {
    setEditingLogPeriod({ name, day, idx });
    setEditLogStart(toLocalDateTimeInput(period.start));
    setEditLogEnd(period.end ? toLocalDateTimeInput(period.end) : '');
    setEditLogJobId(job.id);
  }

  async function saveLogEdit(period) {
    const startIso = zonedLocalInputToISO(editLogStart);
    const targetJobId = editLogJobId || job.id;
    const jobChanged = targetJobId !== job.id;
    const endIso = editLogEnd ? zonedLocalInputToISO(editLogEnd) : null;
    if (endIso && new Date(endIso) <= new Date(startIso)) {
      alert("End must be after start"); return;
    }
    if (endIso) {
      const overlapJobId = await findOverlappingActivity(editingLogPeriod.name, targetJobId, startIso, endIso, users);
      if (overlapJobId) {
        const overlapJob = jobs.find(j => j.id === overlapJobId);
        if (!confirm(`${editingLogPeriod.name} already has logged time at ${overlapJob?.customer || 'another job'} during part of this window — save anyway?`)) return;
      }
    }
    if (period.startId) {
      const update = { created_at: startIso };
      if (jobChanged) update.job_id = targetJobId;
      const { error } = await sb.from('job_notes').update(update).eq('id', period.startId);
      if (error) { alert(`Couldn't save the start time: ${error.message}`); return; }
      if (jobChanged) setCrewLog(prev => prev.filter(n => n.id !== period.startId));
      else setCrewLog(prev => prev.map(n => n.id === period.startId ? { ...n, at: startIso } : n));
    }
    if (endIso) {
      if (period.endId) {
        const update = { created_at: endIso };
        if (jobChanged) update.job_id = targetJobId;
        const { error } = await sb.from('job_notes').update(update).eq('id', period.endId);
        if (error) { alert(`Couldn't save the end time: ${error.message}`); return; }
        if (jobChanged) setCrewLog(prev => prev.filter(n => n.id !== period.endId));
        else setCrewLog(prev => prev.map(n => n.id === period.endId ? { ...n, at: endIso } : n));
      } else {
        // No closing note existed yet (e.g. an office-triggered crew move that never wrote one) — add it.
        const content = `Status → Cleared (${editingLogPeriod.name}) (edited)`;
        const { data: noteRow, error } = await sb.from('job_notes').insert({
          job_id: targetJobId, content, source: 'system', created_at: endIso, user_id: currentUser?.id || null,
        }).select().single();
        if (error) { alert(`Couldn't save the end time: ${error.message}`); return; }
        if (!jobChanged) setCrewLog(prev => [...prev, { id: noteRow?.id, content, at: endIso }]);
      }
    }
    setEditingLogPeriod(null);
  }

  async function deleteLogPeriod(period, name) {
    const msg = period.ongoing
      ? `${name} is still marked ${period.status} on this job — deleting will also clear their live status. Continue?`
      : 'Delete this time log entry?';
    if (!confirm(msg)) return;
    const ids = [period.startId].filter(Boolean);
    if (period.endId) {
      const endNote = crewLog.find(n => n.id === period.endId);
      const parsed = endNote ? parseCrewLogEntry(endNote) : null;
      if (parsed && !CREW_FIELD_STATUSES.includes(parsed.status)) {
        // The end note is just a Cleared/non-field marker with no other purpose — delete it too.
        ids.push(period.endId);
      } else if (parsed) {
        // The end note is itself the START of another logged period for this person (possibly on
        // a different day) — deleting only this period's start note would silently merge the gap
        // into that next period instead of actually removing it (confirmed live: repeatedly
        // deleting a "bad tail" entry just walked the chain backward, eating real entries one at
        // a time, while the real culprit — a stray same-status note starting a period on the NEXT
        // day — never moved and kept re-anchoring everything). Ask instead of silently preserving it.
        if (confirm(`This entry's end time (${fmtTimestamp(endNote.at)}) is also logged as the start of another period for ${name} — delete that too so this doesn't just merge into it?`)) {
          ids.push(period.endId);
        }
      }
    }
    if (period.ongoing) {
      const u = users.find(uu => uu.name === name);
      if (u) {
        // Raw clear (no Cleared note): the period's start note is deleted below, so there is
        // no open period left to close.
        await clearJobCrewStatus(job.id, u.id);
        setCrew(prev => prev.filter(c => c.user_id !== u.id));
      }
    }
    const results = await Promise.all(ids.map(id => sb.from('job_notes').delete().eq('id', id)));
    const failed = results.find(r => r.error);
    if (failed) { alert(`Couldn't delete: ${failed.error.message}`); return; }
    setCrewLog(prev => prev.filter(n => !ids.includes(n.id)));
    setEditingLogPeriod(null);
  }

  function convertToJpeg(file) {
    return new Promise((res, rej) => {
      const blobUrl = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(blobUrl);
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(blob => {
          if (blob) res(new File([blob], 'photo.jpg', { type: 'image/jpeg' }));
          else rej(new Error('conversion failed'));
        }, 'image/jpeg', 0.92);
      };
      img.onerror = () => { URL.revokeObjectURL(blobUrl); rej(new Error('decode failed')); };
      img.src = blobUrl;
    });
  }

  async function handlePhotoInput(e) {
    const files = Array.from(e.target.files);
    if (!files.length) return;
    const heicFiles = files.filter(f => /\.(heic|heif)$/i.test(f.name) || f.type === 'image/heic' || f.type === 'image/heif');
    if (heicFiles.length > 0) {
      alert('HEIC/HEIF photos can\'t be displayed in this app.\n\nOn iPhone: Settings → Camera → Formats → Most Compatible\nOn Android: turn off HEIC in your camera settings.\n\nRetake or re-export the photo as JPEG and try again.');
      e.target.value = '';
      return;
    }
    setUploading(true);
    let errors = [];
    for (const file of files) {
      let uploadFile = file;
      if (!file.type.startsWith('image/jpeg') && !file.type.startsWith('image/jpg')) {
        try { uploadFile = await convertToJpeg(file); } catch(_) { /* use original if conversion fails */ }
      }
      const photo = await uploadPhoto(job.id, uploadFile);
      if (photo && !photo.error) setPhotos(prev => [...prev, photo]);
      else if (photo && photo.error) errors.push(photo.error);
      else errors.push('unknown error');
    }
    setUploading(false);
    e.target.value = '';
    if (errors.length > 0) alert(`Upload failed:\n${errors.join('\n')}`);
  }

  function _launchScan(file, isOther) {
    const blobUrl = URL.createObjectURL(file);
    const tempId = `local-${Date.now()}-${Math.random().toString(36).slice(2,6)}`;
    // Photo visible in strip immediately — no waiting
    setPhotos(prev => [...prev, { id: tempId, url: blobUrl, photo_type: 'equipment', _local: true }]);
    isOther ? setOtherScanningCount(n => n + 1) : setScanningCount(n => n + 1);

    // Shared upload promise — both photo strip and scan queue need the URL
    const uploadP = uploadPhoto(job.id, file, 'equipment').then(photo => {
      if (photo && !photo.error) {
        setPhotos(prev => prev.map(p => p.id === tempId ? photo : p));
        URL.revokeObjectURL(blobUrl);
      }
      return photo;
    }).catch(() => null);

    // Read file then OCR in background — attach photo URL to scan result
    readFileForScan(file).then(({ b64, mediaType }) =>
      scanNameplateFromB64(b64, mediaType).then(result => {
        const hasData = Object.values(result).some(v => v != null);
        if (hasData) {
          uploadP.then(photo => {
            const entry = { ...result, _photoUrl: photo?.storage_path || null };
            isOther ? setOtherScanQueue(q => [...q, entry]) : setScanQueue(q => [...q, entry]);
            isOther ? setPendingOtherScanRetry(null) : setPendingScanRetry(null);
          });
        }
      }).catch(err => {
        // Scan failed — save b64 + storage_path for retry button, and the real reason
        // (could be a dead connection, but just as often an actual API/parse error —
        // don't assume "no signal" and hide what actually went wrong).
        uploadP.then(photo => {
          const retry = { b64, mediaType, _photoUrl: photo?.storage_path || null, error: scanErrorMessage(err) };
          isOther ? setPendingOtherScanRetry(retry) : setPendingScanRetry(retry);
        });
      })
    ).catch(() => {}).finally(() => {
      isOther ? setOtherScanningCount(n => n - 1) : setScanningCount(n => n - 1);
    });
  }

  function runScan(e) {

  async function mergeImagesCanvas(src1, src2) {
    async function loadImg(src) {
      // Fetch as blob first so canvas can draw cross-origin images without tainting
      const blob = await fetch(src).then(r => r.blob());
      const blobUrl = URL.createObjectURL(blob);
      return new Promise((res, rej) => {
        const img = new Image();
        img.onload = () => { URL.revokeObjectURL(blobUrl); res(img); };
        img.onerror = () => { URL.revokeObjectURL(blobUrl); rej(); };
        img.src = blobUrl;
      });
    }
    const [imgA, imgB] = await Promise.all([loadImg(src1), loadImg(src2)]);
    const H = Math.min(Math.max(imgA.height, imgB.height), 2000);
    const wA = Math.round(imgA.width * (H / imgA.height));
    const wB = Math.round(imgB.width * (H / imgB.height));
    const canvas = document.createElement('canvas');
    canvas.width = wA + 6 + wB;
    canvas.height = H;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, canvas.width, H);
    ctx.drawImage(imgA, 0, 0, wA, H);
    ctx.drawImage(imgB, wA + 6, 0, wB, H);
    return new Promise(res => canvas.toBlob(blob => res(blob), 'image/jpeg', 0.88));
  }

  // Snap a receipt: upload, OCR, and SAVE the row immediately (one onChange) so it
  // survives the camera round-trip resetting the form. Review/delete in the list after.
  async function handleJobReceiptFile(e) {
    const file = e.target.files?.[0];
    if (!file) { return; }
    setRScanning(true);
    try {
      const { b64, mediaType } = await readFileForScan(file);
      const path = `${job.id}/receipt-${Date.now()}.${(file.name||'jpg').split('.').pop()}`;
      const { error: upErr } = await sb.storage.from('job-photos').upload(path, file, { cacheControl:'3600', upsert:false });
      if (upErr) { showToast?.('Photo upload failed: ' + upErr.message, true); return; }
      let o = null;
      try { o = await scanReceiptFromB64(b64, mediaType); } catch (err) { console.warn('receipt OCR failed', err); }
      const vendor = (rVendor || o?.vendor || '').toString().trim() || null;
      const amount = Number(rAmount || o?.amount) || null;
      const date = /^\d{4}-\d{2}-\d{2}$/.test(o?.date || '') ? o.date : todayISO();
      const { data, error } = await insertReceiptRow({
        job_id: job.id, amount, vendor, date, storage_path: path, paid_by: rPaidBy || null,
        created_at: new Date().toISOString(),
      });
      if (error) { showToast?.('Receipt save failed: ' + error.message, true); return; }
      if (data) {
        setReceipts(r => [...r, data]);
        setReceiptPagePrompt(data); // multi-page receipts: offer to snap the next page
      }
      setRVendor(''); setRAmount(''); setAddingReceipt(false);
      showToast?.(vendor || amount ? 'Receipt saved' : 'Photo saved — add amount manually');
    } catch (err) {
      showToast?.('Receipt failed: ' + (err.message || 'error'), true);
    } finally {
      setRScanning(false);
      e.target.value = '';
    }
  }
  // Extra page for an existing receipt (target set via receiptPageTargetRef by the button
  // that opened the camera). The row is already saved, so a lost camera round-trip on
  // mobile costs nothing — re-add via the receipt's ✎ ADD PAGE.
  async function handleJobReceiptPageFile(e) {
    const file = e.target.files?.[0];
    const target = receiptPageTargetRef.current;
    if (!file || !target) { if (e.target) e.target.value = ''; return; }
    setRScanning(true);
    try {
      const { storage_path, error } = await appendReceiptPage(target, job.id, file);
      if (error) { showToast?.('Page upload failed: ' + (error.message || 'error'), true); return; }
      const updated = { ...target, storage_path };
      setReceipts(rs => rs.map(x => x.id === target.id ? { ...x, storage_path } : x));
      setReceiptPagePrompt(updated); // keep the prompt up — there may be another page
      receiptPageTargetRef.current = updated;
      showToast?.(`Page ${receiptPages(updated).length} saved`);
    } catch (err) {
      showToast?.('Page failed: ' + (err.message || 'error'), true);
    } finally {
      setRScanning(false);
      e.target.value = '';
    }
  }
  function saveValueEdit() {
    setEditingValue(false);
    if (valueDraft !== (job.value ?? '')) onUpdate({ value: valueDraft });
  }
  function openDepositEdit() {
    setDepositDraft({
      amount: job.deposit_amount ?? '',
      method: job.deposit_method || 'cash',
      check_number: job.deposit_check_number || '',
    });
    setEditingDeposit(true);
  }
  async function saveDeposit() {
    const amt = Number(depositDraft.amount);
    if (!amt || amt <= 0) { showToast?.('Enter a deposit amount', true); return; }
    if (depositDraft.method === 'check' && !depositDraft.check_number.trim()) { showToast?.('Enter a check number', true); return; }
    if (!onUpdateDeposit) return;
    const ok = await onUpdateDeposit(job.id, {
      deposit_amount: amt,
      deposit_method: depositDraft.method,
      deposit_check_number: depositDraft.method === 'check' ? depositDraft.check_number.trim() : null,
    });
    if (ok) setEditingDeposit(false);
  }
  async function removeDeposit() {
    if (!onUpdateDeposit) return;
    const ok = await onUpdateDeposit(job.id, { deposit_amount: null, deposit_method: null, deposit_check_number: null });
    if (ok) setEditingDeposit(false);
  }
  async function saveReceiptEdit() {
    if (!editingReceipt) return;
    const { id, vendor, amount, date, paid_by } = editingReceipt;
    const patch = { vendor: (vendor||'').trim() || null, amount: Number(amount) || null,
      date: date || null, paid_by: paid_by || null };
    const error = await updateReceiptRow(id, patch);
    if (error) { showToast?.('Save failed: ' + error.message, true); return; }
    setReceipts(rs => rs.map(x => x.id === id ? { ...x, ...patch } : x));
    setEditingReceipt(null);
  }
  async function deleteJobReceipt(r) {
    const pages = receiptPages(r);
    if (pages.length) await sb.storage.from('job-photos').remove(pages);
    await sb.from('receipts').delete().eq('id', r.id);
    setReceipts(rs => rs.filter(x => x.id !== r.id));
    if (editingReceipt?.id === r.id) setEditingReceipt(null);
    if (receiptPagePrompt?.id === r.id) setReceiptPagePrompt(null);
  }

  const materialsSection = (
    <div style={{ marginTop:16 }}>
      <div className="head" style={{ fontSize:15, fontWeight:700, color:"var(--text)", marginBottom:8 }}>MATERIALS NEEDED</div>
      {!isClosed && (
        <div style={{ display:"flex", gap:8 }}>
          <input value={matText} onChange={e => setMatText(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') addMaterial(matText); }}
            placeholder="Add a material…"
            style={{ flex:1, boxSizing:"border-box", padding:"10px 12px", borderRadius:8,
              background:"var(--bg)", border:"1px solid var(--line)", color:"var(--text)", fontSize:15, fontFamily:"inherit" }} />
          <button onClick={() => addMaterial(matText)} disabled={!matText.trim()} className="head"
            style={{ padding:"0 16px", borderRadius:8, fontSize:14, fontWeight:700, border:"none",
              background: matText.trim() ? "var(--olive-bright)" : "var(--line)",
              color: matText.trim() ? "var(--bg)" : "var(--muted)" }}>ADD</button>
        </div>
      )}
      {materials.map((m, i) => ({ m, i }))
        .filter(({ m, i }) => !isShop || !m.acquired || shopAcquiredPending.has(i))
        .map(({ m, i }) => {
          const pendingHide = isShop && shopAcquiredPending.has(i);
          return (
        <div key={i} style={{ display:"flex", alignItems:"center", gap:10, padding:"8px 0", borderTop:"1px solid var(--line)" }}>
          <input type="checkbox" checked={!!m.acquired} onChange={() => toggleMaterial(i)} disabled={isClosed}
            style={{ width:20, height:20, accentColor:"var(--green)", cursor: isClosed ? "default" : "pointer", flexShrink:0 }} />
          <span style={{ flex:1, fontSize:15, color: m.acquired ? "var(--muted)" : "var(--text)",
            textDecoration: m.acquired ? "line-through" : "none" }}>{m.text}</span>
          {pendingHide && (
            <button onClick={() => toggleMaterial(i)} className="head"
              style={{ fontSize:13, fontWeight:700, color:"var(--olive-bright)", background:"none", border:"none", padding:"4px 6px", cursor:"pointer", flexShrink:0 }}>
              UNDO
            </button>
          )}
          {!isClosed && !pendingHide && (
            <button onClick={() => removeMaterial(i)} className="mono"
              style={{ background:"none", border:"none", color:"var(--muted)", fontSize:15, padding:"0 4px", cursor:"pointer" }}>✕</button>
          )}
        </div>
          );
        })}
    </div>
  );

  return (
    <div className="fade-in" style={{ paddingBottom:40 }}>
      <div style={{ padding:"16px", borderBottom:"1px solid var(--line)", background:"var(--panel)", display:"flex", alignItems:"center", gap:12 }}>
        <button onClick={onBack} className="head" style={{ fontSize:36, color:"var(--muted)", padding:"4px 12px 4px 4px", lineHeight:1 }}>‹</button>
        <div className="head" style={{ fontSize:18, fontWeight:600 }}>JOB DETAIL</div>
        <button onClick={() => setShowCapCalc(true)} className="mono"

        {!isClosed && (

      </div>
      {showCapCalc && <CapacitorCalc onClose={() => setShowCapCalc(false)} />}

        return (
          <div style={{ margin:"0 16px 0", padding:"8px 12px", marginTop:8,

              </div>
            </button>
            <ClockTimer startedAt={clockSession.legStartedAt || clockSession.startedAt} todayMs={getTodayMs ? getTodayMs() : 0} paused={clockSession.status === 'Paused'} />
            {clockSession.jobId && !ON_BREAK_STATUSES.includes(clockSession.status) && (
              <button onClick={clockSession.status === 'In Route' ? onFlipToOnSite : undefined} className="head"
                style={{ fontSize:11, fontWeight:700, padding:"4px 10px", borderRadius:5,
                  background: clockSession.status === 'On Site' ? "var(--olive-bright)" : "var(--panel)",

                  border: clockSession.status === 'On Site' ? "none" : "1px solid var(--line)",

            {clockSession.jobId && clockSession.status === 'On Site' && (
              <button onClick={onPause} className="head"

                ⏸ PAUSE
              </button>
            )}
            {ON_BREAK_STATUSES.includes(clockSession.status) && (
              <button onClick={onResume} className="head"

                  background:"var(--olive-bright)", border:"none", color:"var(--bg)" }}>

          <div style={{ display:"flex", alignItems:"center", gap:8 }}>
            {job.status === 'Closed' && onDuplicate && (
              <button onClick={onDuplicate} className="head"

            <StatusPill status={job.status} />

        <div style={{ fontSize:14, color:"var(--muted)", marginTop:6 }}>{job.type}</div>
        {(job.location && siteAddr(job).trim() === custAddr(job).trim()) ? (
          <div className="head" style={{ fontSize:15, fontWeight:600, color:"var(--brass-bright)", marginTop:6 }}>📍 {job.location}</div>
        ) : null}

        {/* Compact time summary */}
        {(() => {
          const today = todayISO();
          const techsToday = users.filter(u => {
            const periods = (crewTimeline[u.name] || []).filter(p => dateISOInTZ(new Date(p.start), getAppTZ()) === today);
            if (periods.length === 0) return false;
            const totalMs = periods.reduce((sum,p) => sum + (new Date(p.end || Date.now()) - new Date(p.start)), 0);
            return totalMs > 0;
          });
          if (techsToday.length === 0) return null;
          return (
            <div style={{ marginTop:12, padding:"10px 14px", background:"var(--panel)", border:"1px solid var(--line)", borderRadius:10 }}>
              <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginBottom:8, letterSpacing:"0.08em" }}>TODAY'S TIME</div>
              {techsToday.map(u => {
                const periods = (crewTimeline[u.name] || []).filter(p => dateISOInTZ(new Date(p.start), getAppTZ()) === today);
                const driveMs = periods.filter(p => p.status === 'In Route')
                  .reduce((sum,p) => sum + (new Date(p.end || Date.now()) - new Date(p.start)), 0);
                const onSiteMs = periods.filter(p => p.status === 'On Site')
                  .reduce((sum,p) => sum + (new Date(p.end || Date.now()) - new Date(p.start)), 0);
                const totalMs = driveMs + onSiteMs;
                const isOngoing = periods.some(p => p.ongoing);
                return (
                  <div key={u.id} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", paddingTop:6,
                    borderTop: u !== techsToday[0] ? "1px solid var(--line)" : "none", marginTop: u !== techsToday[0] ? 6 : 0 }}>
                    <div className="head" style={{ fontSize:14, fontWeight:700, color:"var(--text)" }}>
                      {u.name}{isOngoing ? <span style={{ color:"var(--green)", marginLeft:6, fontSize:11 }}>●</span> : null}
                    </div>
                    <div style={{ textAlign:"right" }}>
                      <div className="mono" style={{ fontSize:14, fontWeight:700, color:"var(--olive-bright)" }}>
                        {fmtElapsed(totalMs)}
                      </div>
                      {(driveMs > 0 && onSiteMs > 0) && (
                        <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginTop:2 }}>
                          {fmtElapsed(driveMs)} drive · {fmtElapsed(onSiteMs)} on site
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          );
        })()}

        {isShop && materialsSection}

        {!isShop && (
          <div style={{ marginTop:14, padding:14, background:"var(--panel)", border:"1px solid var(--line)", borderRadius:10, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
            <span className="mono" style={{ fontSize:13, color:"var(--muted)" }}>JOB VALUE</span>
            {editingValue ? (
              <input type="number" inputMode="decimal" autoFocus value={valueDraft}
                onChange={e => setValueDraft(e.target.value)}
                onBlur={saveValueEdit}
                onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); }}
                className="head" style={{ fontSize:24, fontWeight:700, color:"var(--olive-bright)",
                  width:120, textAlign:"right", background:"var(--bg)", border:"1px solid var(--olive)",
                  borderRadius:6, padding:"2px 6px" }} />
            ) : (
              <span className="head"
                onClick={isClosed ? undefined : () => { setValueDraft(job.value || ''); setEditingValue(true); }}
                style={{ fontSize:24, fontWeight:700, color:"var(--olive-bright)",
                  cursor: isClosed ? "default" : "pointer" }}>
                {money(job.value)}{!isClosed && ' ✎'}
              </span>
            )}
          </div>
        )}

        {!isShop && (
          <div style={{ marginTop:10, padding:14, background:"var(--panel)", border: editingDeposit ? "1px solid var(--olive-bright)" : "1px solid var(--line)", borderRadius:10 }}>
            {editingDeposit ? (
              <>
                <div className="mono" style={{ fontSize:13, color:"var(--muted)", marginBottom:10 }}>DEPOSIT</div>
                <input type="number" inputMode="decimal" autoFocus placeholder="$ Amount"
                  value={depositDraft.amount} onChange={e => setDepositDraft(d => ({ ...d, amount:e.target.value }))}
                  style={{ width:"100%", boxSizing:"border-box", marginBottom:10, padding:"10px 12px", borderRadius:8,
                    background:"var(--bg)", border:"1px solid var(--line)", color:"var(--text)", fontSize:15, fontFamily:"inherit" }} />
                <div style={{ display:"flex", gap:8, marginBottom:10 }}>
                  <button onClick={() => setDepositDraft(d => ({ ...d, method:'cash' }))} className="head"
                    style={{ flex:1, padding:12, borderRadius:8, fontSize:14, fontWeight:700,
                      background: depositDraft.method === 'cash' ? "var(--olive-bright)" : "var(--panel)",
                      color: depositDraft.method === 'cash' ? "var(--bg)" : "var(--text)",
                      border: depositDraft.method === 'cash' ? "none" : "1px solid var(--line)" }}>
                    💵 CASH
                  </button>
                  <button onClick={() => setDepositDraft(d => ({ ...d, method:'check' }))} className="head"
                    style={{ flex:1, padding:12, borderRadius:8, fontSize:14, fontWeight:700,
                      background: depositDraft.method === 'check' ? "var(--olive-bright)" : "var(--panel)",
                      color: depositDraft.method === 'check' ? "var(--bg)" : "var(--text)",
                      border: depositDraft.method === 'check' ? "none" : "1px solid var(--line)" }}>
                    📝 CHECK
                  </button>
                </div>
                {depositDraft.method === 'check' && (
                  <input placeholder="Check #" value={depositDraft.check_number}
                    onChange={e => setDepositDraft(d => ({ ...d, check_number:e.target.value }))}
                    style={{ width:"100%", boxSizing:"border-box", marginBottom:10, padding:"10px 12px", borderRadius:8,
                      background:"var(--bg)", border:"1px solid var(--line)", color:"var(--text)", fontSize:15, fontFamily:"inherit" }} />
                )}
                <div style={{ display:"flex", gap:8 }}>
                  <button onClick={saveDeposit} className="head" style={{ flex:1, padding:"10px 0", borderRadius:6, border:"none", background:"var(--olive-bright)", color:"var(--bg)", fontSize:13, fontWeight:700 }}>SAVE</button>
                  {job.deposit_amount != null && (
                    <button onClick={removeDeposit} className="head" style={{ padding:"10px 12px", borderRadius:6, background:"transparent", color:"var(--danger)", border:"1px solid var(--danger)", fontSize:13 }}>REMOVE</button>
                  )}
                  <button onClick={() => setEditingDeposit(false)} className="head" style={{ padding:"10px 12px", borderRadius:6, background:"var(--panel)", border:"1px solid var(--line)", color:"var(--muted)", fontSize:13 }}>CANCEL</button>
                </div>
              </>
            ) : (
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                <span className="mono" style={{ fontSize:13, color:"var(--muted)" }}>DEPOSIT</span>
                {job.deposit_amount != null ? (
                  <span className="head" onClick={isClosed ? undefined : openDepositEdit}
                    style={{ fontSize:20, fontWeight:700, color:"var(--olive-bright)", cursor: isClosed ? "default" : "pointer" }}>
                    {money(job.deposit_amount)}
                    <span className="mono" style={{ fontSize:12, color:"var(--muted)", fontWeight:400, marginLeft:8 }}>
                      {job.deposit_method === 'check' ? `CHECK #${job.deposit_check_number || '—'}` : 'CASH'}
                    </span>
                    {!isClosed && ' ✎'}
                  </span>
                ) : (
                  isClosed
                    ? <span className="mono" style={{ fontSize:13, color:"var(--muted)" }}>None</span>
                    : (
                      <button onClick={openDepositEdit} className="head"
                        style={{ fontSize:12, fontWeight:700, padding:"6px 12px", borderRadius:5,
                          background:"var(--panel)", border:"1px solid var(--line)", color:"var(--muted)" }}>
                        + ADD DEPOSIT
                      </button>
                    )
                )}
              </div>
            )}
          </div>
        )}

        {!isShop && (
          isClosed ? (
            <div style={{ width:"100%", textAlign:"left", marginTop:10, padding:14, background:"var(--panel)", border:"1px solid var(--line)", borderRadius:10, display:"flex", justifyContent:"space-between", alignItems:"center", boxSizing:"border-box" }}>
              <span className="mono" style={{ fontSize:13, color:"var(--muted)" }}>SCHEDULED</span>
              <span className="head" style={{ fontSize:17, fontWeight:600, color:"var(--brass-bright)" }}>
                {fmtDate(job.scheduled_date)} · {fmtTime(job.scheduled_time)}
              </span>
            </div>
          ) : (
            <button onClick={() => { setDate(todayISO()); setTime(nowTimeRoundedNextHour()); setShowResched(true); }} style={{ width:"100%", textAlign:"left", marginTop:10, padding:14, background:"var(--panel)", border:"1px solid var(--line)", borderRadius:10, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
              <span className="mono" style={{ fontSize:13, color:"var(--muted)" }}>SCHEDULED</span>
              <span className="head" style={{ fontSize:17, fontWeight:600, color:"var(--brass-bright)" }}>
                {fmtDate(job.scheduled_date)} · {fmtTime(job.scheduled_time)} ✎
              </span>
            </button>
          )
        )}

        {!isShop && (
          <div style={{ marginTop:10, padding:14, background:"var(--panel)", border:"1px solid var(--line)", borderRadius:10 }}>
            {job.phone
              ? <a href={`tel:${job.phone.replace(/[^0-9]/g,"")}`} style={{ color:"var(--olive-bright)", textDecoration:"none", fontSize:16, fontWeight:600 }} className="head">{job.phone}</a>
              : null
            }
            {job.email && (
              <a href={`mailto:${job.email}`} style={{ display:"block", color:"var(--muted)", textDecoration:"none", fontSize:14, marginTop:4 }}>{job.email}</a>
            )}
            {job.site_name && (
              <div className="head" style={{ fontSize:18, fontWeight:700, color:"var(--text)", marginTop:12 }}>{job.site_name}</div>
            )}
            <div className="mono" style={{ fontSize:12, color:"var(--brass-bright)", marginTop:12 }}>SITE ADDRESS</div>
            <a href={`https://maps.google.com/?q=${encodeURIComponent(siteAddr(job))}`} target="_blank" rel="noreferrer"
              style={{ display:"block", color:"var(--text)", textDecoration:"none", fontSize:15, marginTop:3, lineHeight:1.4 }}>{siteAddr(job)}</a>
            {custAddr(job) && custAddr(job) !== siteAddr(job) && (
              <React.Fragment>
                <div className="mono" style={{ fontSize:12, color:"var(--muted)", marginTop:12 }}>CUSTOMER ADDRESS</div>
                <div style={{ fontSize:15, color:"var(--muted)", marginTop:3, lineHeight:1.4 }}>{custAddr(job)}</div>
              </React.Fragment>

          </div>

        {!isShop && (
          <div style={{ marginTop:10 }}>
            <div className="head" style={{ fontSize:15, fontWeight:700, color:"var(--text)", marginBottom:6 }}>ORIGINAL ASK</div>
            <textarea value={originalAsk} onChange={e => setOriginalAsk(e.target.value)}

              placeholder="What did the customer ask for?" readOnly={isClosed}
              rows={2} style={{ resize:"vertical", lineHeight:1.4 }} />
          </div>

        {!isShop && (
          <div style={{ marginTop:10 }}>
            <div className="head" style={{ fontSize:15, fontWeight:700, color:"var(--text)", marginBottom:6 }}>NOTES</div>
            <textarea value={notes} onChange={e => setNotes(e.target.value)}
              onBlur={() => { if (notes !== (job.notes||'')) onUpdate({ notes }); }}
              readOnly={isClosed}
              rows={3} style={{ resize:"vertical", lineHeight:1.4 }} />
