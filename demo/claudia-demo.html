window.__DEMO_CORES = {"match":"// Warranty confirmation parsing + matching — pure functions, no I/O.\n//\n// Shared by the `warranty-inbound` Edge Function (Deno) and the Node unit tests in\n// tests/warranty-match.test.ts, so it must stay dependency-free and use only\n// erasable TypeScript (no enums / namespaces / parameter properties) — Node runs\n// the tests with built-in type stripping.\n//\n// The flow: we send the customer an email (Reply-To: warranty+CODE@…). They register with\n// the manufacturer and reply to our email with the confirmation. The reply is tied back to\n// that exact send (the tracker: In-Reply-To / References → our stored Message-IDs, or the\n// coded reply address used by the address we sent to). We parse it, score every open\n// registration against it, and only\n// auto-mark a registration as registered when the evidence is strong AND unambiguous.\n// Anything else goes to the in-app WARRANTY REVIEW queue for a human.\n\nexport const DEFAULT_AUTO_THRESHOLD = 80;\n\n/** Minimum lead the best job must have over the runner-up job to auto-match. */\nexport const AMBIGUITY_MARGIN = 25;\n\nexport const SCORE = {\n  token: 45,          // job ref code (warranty+CODE@ address, or \"W-CODE\" in the text)\n  serial: 45,         // the unit's serial number appears in the email\n  model: 15,          // the unit's model number appears in the email\n  senderEmail: 15,    // forwarded from the customer's email address on file\n  brand: 5,           // the manufacturer is named in the email\n  customerName: 5,    // the customer's last name appears in the email\n  confirmation: 10,   // reads like a registration confirmation\n  reply: 25,          // a reply to the email we sent for this job (the tracker)\n  serialConflict: -30 // the email lists serial numbers, none of them this unit's\n}         ;\n\n                              \n                           \n                                                                  \n                                                                                        \n                                                                                       \n                                                                                       \n                                    \n                                 \n                                                                    \n                                                                         \n                                                                                       \n \n\n                                       \n                    \n                               \n                            \n                                  \n \n\n                            \n                          \n                        \n                       \n                 \n                        \n                       \n                           \n                                \n                               \n \n\n                                 \n                          \n                        \n                \n                                                           \n                    \n                      \n                       \n                    \n                             \n \n\n                              \n                                            \n                                                                         \n                            \n                                                               \n                               \n                                                                          \n                  \n                     \n \n\n// ── normalisation ───────────────────────────────────────────────────────────\n\n/** Upper-case and drop everything that isn't A-Z / 0-9 (\"WC-123 45\" → \"WC12345\"). */\nexport function normId(s                           )         {\n  return String(s ?? \"\").toUpperCase().replace(/[^A-Z0-9]/g, \"\");\n}\n\n/** Lower-case, collapse punctuation — for brand / alias comparison. */\nexport function normBrand(s                           )         {\n  return String(s ?? \"\")\n    .toLowerCase()\n    .replace(/&/g, \" and \")\n    .replace(/[^a-z0-9]+/g, \" \")\n    .trim();\n}\n\nexport function normEmail(s                           )                {\n  const m = String(s ?? \"\").match(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}/);\n  return m ? m[0].toLowerCase() : null;\n}\n\n/** Very small HTML → text fallback for providers that only send HTML. */\nexport function htmlToText(html                           )         {\n  return String(html ?? \"\")\n    .replace(/<(script|style)[\\s\\S]*?<\\/\\1>/gi, \" \")\n    .replace(/<br\\s*\\/?>/gi, \"\\n\")\n    .replace(/<\\/(p|div|tr|li|h[1-6])>/gi, \"\\n\")\n    .replace(/<[^>]+>/g, \" \")\n    .replace(/&nbsp;/gi, \" \")\n    .replace(/&amp;/gi, \"&\")\n    .replace(/&lt;/gi, \"<\")\n    .replace(/&gt;/gi, \">\")\n    .replace(/&#39;|&apos;/gi, \"'\")\n    .replace(/&quot;/gi, '\"')\n    .replace(/[ \\t]+/g, \" \")\n    .replace(/\\n\\s*\\n+/g, \"\\n\")\n    .trim();\n}\n\n// ── parsing ─────────────────────────────────────────────────────────────────\n\n/** Job ref code alphabet: no 0/O/1/I/L so it survives being read aloud or retyped. */\nexport const TOKEN_ALPHABET = \"ABCDEFGHJKMNPQRSTUVWXYZ23456789\";\nconst TOKEN_RE_TEXT = /\\bW-([A-Z2-9]{6})\\b/gi;\nconst TOKEN_RE_ADDR = /\\+([A-Za-z0-9]{6})@/g;\n\nconst CONFIRMATION_RES           = [\n  /thank(s| you) for registering/i,\n  /(registration|product registration|warranty registration)\\s+(is\\s+)?(complete|confirmed|successful|received)/i,\n  /successfully\\s+registered/i,\n  /(has|have)\\s+been\\s+(successfully\\s+)?registered/i,\n  /registration\\s+confirmation/i,\n  /warranty\\s+(certificate|registration)/i,\n  /confirmation\\s+(number|no\\.?|#)/i,\n  /your\\s+(product|unit|equipment|warranty)\\s+(is|has been)\\s+registered/i,\n  // A customer's own words when replying to our email.\n  /\\b(i|we)\\s+(just\\s+|have\\s+|already\\s+|went\\s+ahead\\s+and\\s+)?registered\\b/i,\n  /\\b(i|we)('ve| have)\\s+(just\\s+|already\\s+)?registered\\b/i,\n  /\\bregistration\\s+(is\\s+)?(done|finished)\\b/i,\n];\n\n// (?![a-z]) stops \"serialized\" / \"models\" from counting as labels; bare \"SN\" needs a \":\" or \"#\".\nconst SERIAL_LABEL_RE = /\\b(?:serial(?:\\s*(?:number|no\\.?|num|#))?|s\\/n|sn(?=\\s*[:#]))(?![a-z])\\s*[:#.\\-]?\\s*([A-Z0-9][A-Z0-9\\- ]{3,24}[A-Z0-9])/gi;\nconst MODEL_LABEL_RE = /\\b(?:model(?:\\s*(?:number|no\\.?|num|#))?|m\\/n)(?![a-z])\\s*[:#.\\-]?\\s*([A-Z0-9][A-Z0-9\\-\\/ ]{2,28}[A-Z0-9])/gi;\nconst CONFIRMATION_NO_RE = /\\b(?:confirmation|registration|reference|certificate)\\s*(?:number|no\\.?|num|#|id|code)\\s*[:#.\\-]?\\s*([A-Z0-9][A-Z0-9\\-]{3,29})/i;\n\nfunction uniq(list          )           {\n  return Array.from(new Set(list.filter(Boolean)));\n}\n\n/** A labeled value can run into the next word (\"SERIAL 1234567 MODEL X\") — keep the first word,\n *  but also keep the joined form for serials printed with spaces (\"1234 5678\"). */\nfunction labeledValues(text        , re        )           {\n  const out           = [];\n  re.lastIndex = 0;\n  let m                        ;\n  while ((m = re.exec(text)) !== null) {\n    const raw = m[1].trim();\n    const parts = raw.split(/\\s+/);\n    const vals = [parts[0]];\n    // Only glue two words when both carry digits (\"2105 123456\"), never \"2105123456 MODEL\".\n    if (parts[1] && /\\d/.test(parts[0]) && /\\d/.test(parts[1])) vals.push(parts[0] + parts[1]);\n    for (const v of vals) {\n      const n = normId(v);\n      // A real serial/model has at least one digit; this drops label noise like \"NUMBER\".\n      if (n.length >= 4 && /\\d/.test(n)) out.push(n);\n    }\n  }\n  return uniq(out);\n}\n\nexport function parseConfirmationEmail(input   \n                       \n                                \n                          \n                       \n                       \n                                                                                                 \n                                \n , manufacturers                         = [])              {\n  const toList = Array.isArray(input.to) ? input.to : input.to ? [input.to] : [];\n  const body = (input.text && input.text.trim()) ? input.text : htmlToText(input.html);\n  const full = `${input.subject ?? \"\"}\\n${body ?? \"\"}`;\n  const upper = full.toUpperCase();\n\n  const replyTokens = uniq((input.replyTokens ?? []).map((x) => String(x).toUpperCase()));\n  const tokens           = [...replyTokens];\n  for (const addr of toList) {\n    TOKEN_RE_ADDR.lastIndex = 0;\n    let m                        ;\n    while ((m = TOKEN_RE_ADDR.exec(addr)) !== null) tokens.push(m[1].toUpperCase());\n  }\n  TOKEN_RE_TEXT.lastIndex = 0;\n  let t                        ;\n  while ((t = TOKEN_RE_TEXT.exec(full)) !== null) tokens.push(t[1].toUpperCase());\n  // Forwarded mail often quotes the original \"To: warranty+CODE@…\" header in the body too.\n  TOKEN_RE_ADDR.lastIndex = 0;\n  while ((t = TOKEN_RE_ADDR.exec(full)) !== null) tokens.push(t[1].toUpperCase());\n\n  const words = uniq(\n    (upper.match(/[A-Z0-9][A-Z0-9\\-\\/]{3,}[A-Z0-9]/g) || [])\n      .map(normId)\n      .filter((w) => w.length >= 4)\n  );\n\n  const confNo = full.match(CONFIRMATION_NO_RE);\n  const lowerFull = full.toLowerCase();\n  const brandKeys           = [];\n  for (const mf of manufacturers) {\n    const names = uniq([mf.brand_key, mf.display_name ?? \"\", ...(mf.aliases ?? [])].map(normBrand));\n    const domains = (mf.email_domains ?? []).map((d) => d.toLowerCase());\n    const normFull = ` ${normBrand(full)} `;\n    const named = names.some((n) => n.length >= 2 && normFull.includes(` ${n} `));\n    const byDomain = domains.some((d) => lowerFull.includes(`@${d}`) || lowerFull.includes(`.${d}`));\n    if (named || byDomain) brandKeys.push(mf.brand_key);\n  }\n\n  return {\n    fromEmail: normEmail(input.from),\n    tokens: uniq(tokens.filter((x) => [...x].every((c) => TOKEN_ALPHABET.includes(c)))),\n    labeledSerials: labeledValues(full, SERIAL_LABEL_RE),\n    labeledModels: labeledValues(full, MODEL_LABEL_RE),\n    wordSet: words,\n    confirmationNumber: confNo ? confNo[1].toUpperCase() : null,\n    looksLikeConfirmation: CONFIRMATION_RES.some((re) => re.test(full)),\n    brandKeys: uniq(brandKeys),\n    normalizedText: upper,\n    replyTokens,\n  };\n}\n\n// ── scoring ─────────────────────────────────────────────────────────────────\n\nfunction idPresent(id               , parsed             , labeled          )          {\n  const n = normId(id);\n  if (n.length < 4) return false; // too short to be meaningful evidence\n  return labeled.includes(n) || parsed.wordSet.includes(n);\n}\n\nfunction lastName(name               )                {\n  const raw = String(name ?? \"\").trim();\n  if (!raw) return null;\n  // Claudia stores many names as \"Last, First\" — prefer the part before the comma.\n  const part = raw.includes(\",\") ? raw.split(\",\")[0] : raw.split(/\\s+/).slice(-1)[0];\n  const n = part.toUpperCase().replace(/[^A-Z'-]/g, \"\");\n  return n.length >= 3 ? n : null;\n}\n\nexport function scoreCandidate(c           , parsed             )                 {\n  const reasons           = [];\n  let score = 0;\n\n  const tokenMatch = !!c.token && parsed.tokens.includes(c.token.toUpperCase());\n  if (tokenMatch) { score += SCORE.token; reasons.push(`job ref W-${c.token .toUpperCase()} matches`); }\n  if (c.token && parsed.replyTokens.includes(c.token.toUpperCase())) {\n    score += SCORE.reply; reasons.push(\"reply to the warranty email we sent for this job\");\n  }\n\n  const serialMatch = idPresent(c.serial, parsed, parsed.labeledSerials);\n  if (serialMatch) { score += SCORE.serial; reasons.push(`serial ${c.serial} found`); }\n\n  if (idPresent(c.model, parsed, parsed.labeledModels)) { score += SCORE.model; reasons.push(`model ${c.model} found`); }\n\n  const custEmail = normEmail(c.customer_email);\n  if (custEmail && parsed.fromEmail && custEmail === parsed.fromEmail) {\n    score += SCORE.senderEmail; reasons.push(\"sent from the customer's email on file\");\n  }\n\n  if (c.brand_key && parsed.brandKeys.includes(c.brand_key)) { score += SCORE.brand; reasons.push(`mentions ${c.brand_key}`); }\n\n  const ln = lastName(c.customer_name);\n  if (ln && new RegExp(`\\\\b${ln.replace(/[-']/g, \".\")}\\\\b`).test(parsed.normalizedText)) {\n    score += SCORE.customerName; reasons.push(\"customer name appears\");\n  }\n\n  if (parsed.looksLikeConfirmation) { score += SCORE.confirmation; reasons.push(\"reads like a registration confirmation\"); }\n\n  const conflict = !serialMatch && !!normId(c.serial) && parsed.labeledSerials.length > 0;\n  if (conflict) { score += SCORE.serialConflict; reasons.push(\"email lists a different serial number\"); }\n\n  const capped = Math.max(0, Math.min(score, 100));\n  return {\n    registration_id: c.registration_id,\n    job_id: c.job_id,\n    score,\n    confidence: Math.round(capped) / 100,\n    reasons,\n    tokenMatch,\n    serialMatch,\n    conflict,\n    alreadyRegistered: c.status === \"registered\",\n  };\n}\n\n/**\n * Decide what to do with one inbound email.\n *\n * Auto-match only when ALL hold, otherwise the email goes to manual review:\n *  - it reads like a registration confirmation;\n *  - the best job's units score >= threshold and have a hard identifier (job ref or serial);\n *  - no serial conflict on the matched unit;\n *  - the best job leads every other job by >= AMBIGUITY_MARGIN;\n *  - on a job with more than one unit, each auto-matched unit's own serial is in the email\n *    (a ref code alone can't say WHICH units the customer registered).\n */\nexport function matchConfirmation(\n  parsed             ,\n  candidates             ,\n  opts                         = {},\n)              {\n  const threshold = opts.threshold ?? DEFAULT_AUTO_THRESHOLD;\n  const scored = candidates.map((c) => scoreCandidate(c, parsed)).sort((a, b) => b.score - a.score);\n  const relevant = scored.filter((s) => s.tokenMatch || s.serialMatch || s.score >= 20);\n  const top = relevant.slice(0, 5);\n\n  if (!relevant.length) {\n    return {\n      decision: \"unmatched\",\n      matches: [],\n      candidates: [],\n      summary: parsed.looksLikeConfirmation\n        ? \"Looks like a confirmation, but no ref code, serial or customer matched any equipment.\"\n        : \"No ref code, serial or customer matched, and it doesn't read like a registration confirmation.\",\n      confidence: 0,\n    };\n  }\n\n  // Best score per job (registrations without a job count as their own group).\n  const byJob = new Map                          ();\n  for (const s of relevant) {\n    const key = s.job_id ?? `reg:${s.registration_id}`;\n    if (!byJob.has(key)) byJob.set(key, []);\n    byJob.get(key) .push(s);\n  }\n  const jobRanks = Array.from(byJob.entries())\n    .map(([key, list]) => ({ key, list, best: Math.max(...list.map((x) => x.score)) }))\n    .sort((a, b) => b.best - a.best);\n  const bestJob = jobRanks[0];\n  const runnerUp = jobRanks[1];\n  const confidence = Math.max(0, Math.min(bestJob.best, 100)) / 100;\n\n  const review = (summary        )              => ({ decision: \"review\", matches: [], candidates: top, summary, confidence });\n\n  if (!parsed.looksLikeConfirmation) {\n    return review(\"Matched equipment, but the email doesn't read like a registration confirmation.\");\n  }\n  if (runnerUp && bestJob.best - runnerUp.best < AMBIGUITY_MARGIN) {\n    return review(\"More than one job could match this email.\");\n  }\n\n  const jobUnitCount = candidates.filter((c) => (c.job_id ?? `reg:${c.registration_id}`) === bestJob.key).length;\n  const autos = bestJob.list.filter((s) =>\n    s.score >= threshold &&\n    (s.tokenMatch || s.serialMatch) &&\n    !s.conflict &&\n    (jobUnitCount === 1 || s.serialMatch)\n  );\n\n  if (!autos.length) {\n    const b = bestJob.list[0];\n    if (b.conflict) return review(\"The ref code matches, but the email lists a different serial number.\");\n    if (jobUnitCount > 1 && !bestJob.list.some((s) => s.serialMatch)) {\n      return review(\"The job has several units and the email doesn't say which serial numbers were registered.\");\n    }\n    return review(`Best match is ${Math.round(confidence * 100)}% sure, below the ${threshold}% auto-match bar.`);\n  }\n\n  const fresh = autos.filter((a) => !a.alreadyRegistered);\n  return {\n    decision: \"auto\",\n    matches: autos,\n    candidates: top,\n    summary: fresh.length\n      ? `Auto-matched ${fresh.length} unit${fresh.length > 1 ? \"s\" : \"\"} (${Math.round(confidence * 100)}% sure).`\n      : \"Duplicate confirmation — these units were already registered.\",\n    confidence,\n  };\n}\n","inbound":"// Provider-agnostic core of the `warranty-inbound` Edge Function, kept free of Deno APIs so the\n// Node tests can drive it end-to-end with an in-memory store (tests/warranty-inbound.test.ts).\n//\n// Customers REPLY to the warranty email we sent (warranty-send). The reply is tied back to that\n// exact send by the tracker: its In-Reply-To / References headers carry our Message-ID, and the\n// coded Reply-To address (warranty+CODE@…) carries the job's ref code.\n//\n// Any inbound-email provider works as long as it can POST the message to the function URL:\n//   - Postmark inbound webhook (JSON: From, To, Subject, TextBody, HtmlBody, MessageID)\n//   - SendGrid Inbound Parse (multipart form: from, to, subject, text, html, headers)\n//   - Mailgun routes (form: sender/from, recipient/To, subject, body-plain, body-html, Message-Id)\n//   - Cloudflare Email Routing → small Email Worker that POSTs generic JSON\n//   - generic JSON: { from, to, subject, text, html, message_id }\n// The provider choice (and the inbox address) is Jack's decision — see the PR description.\n\nimport {\n  DEFAULT_AUTO_THRESHOLD,\n  matchConfirmation,\n  normEmail,\n  parseConfirmationEmail,\n                 \n                            \n                   \n} from \"./warranty-match.ts\";\n\n                                  \n                   \n                            \n                      \n               \n                         \n                      \n                      \n                                                                                         \n                       \n \n\n/** One email we sent (warranty_outbound). */\n                              \n             \n                      \n                          \n                               \n \n\n                                  \n             \n                        \n                             \n                 \n                           \n                                                                                  \n                                                                  \n \n\n/** The handful of database operations the function needs — Supabase in prod, a fake in tests. */\n                                \n                                                                                            \n                                                                                                            \n                                                               \n                                                       \n                                                  \n                                                                                                                           \n                                                                                    \n                                                                                     \n \n\nconst SNIPPET_CHARS = 1500;\n\nfunction firstString(...vals           )                {\n  for (const v of vals) {\n    if (typeof v === \"string\" && v.trim()) return v.trim();\n  }\n  return null;\n}\n\nfunction splitAddresses(v         )           {\n  if (Array.isArray(v)) {\n    return v.flatMap((x) => (typeof x === \"string\" ? splitAddresses(x) : x && typeof x === \"object\" && \"Email\" in x ? [String((x                      ).Email)] : []));\n  }\n  if (typeof v !== \"string\") return [];\n  return v.split(/[,;]/).map((s) => s.trim()).filter(Boolean);\n}\n\n/** \"<a@x> <b@y>\" or [\"<a@x>\"] → [\"a@x\", \"b@y\"] */\nexport function parseMessageIds(...vals           )           {\n  const out           = [];\n  for (const v of vals) {\n    const list = Array.isArray(v) ? v : [v];\n    for (const item of list) {\n      if (typeof item !== \"string\") continue;\n      const bracketed = item.match(/<[^<>\\s]+>/g);\n      const ids = bracketed ? bracketed.map((x) => x.slice(1, -1)) : item.split(/[\\s,]+/);\n      for (const id of ids) if (id && id.includes(\"@\")) out.push(id.toLowerCase());\n    }\n  }\n  return Array.from(new Set(out));\n}\n\nfunction headerFromBlob(blob        , name        )                {\n  // Unfold continuation lines, then pick the header.\n  const unfolded = blob.replace(/\\r?\\n[ \\t]+/g, \" \");\n  const m = unfolded.match(new RegExp(`^${name}:\\\\s*(.+)$`, \"im\"));\n  return m ? m[1].trim() : null;\n}\n\nfunction headerFromList(list         , name        )                {\n  if (!Array.isArray(list)) return null;\n  for (const h of list) {\n    if (Array.isArray(h) && String(h[0]).toLowerCase() === name.toLowerCase()) return String(h[1]);\n    if (h && typeof h === \"object\" && \"Name\" in h && String((h                     ).Name).toLowerCase() === name.toLowerCase()) {\n      return String((h                      ).Value);\n    }\n  }\n  return null;\n}\n\n/** Map whatever the provider sent into one shape. `body` is parsed JSON or form fields. */\nexport function normalizeInbound(body                         )                  {\n  // Postmark: capitalised keys\n  if (\"TextBody\" in body || \"HtmlBody\" in body || \"MessageID\" in body) {\n    return {\n      provider: \"postmark\",\n      message_id: firstString(body.MessageID),\n      from: firstString((body.FromFull                                  )?.Email, body.From),\n      to: splitAddresses(body.ToFull ?? body.To).concat(splitAddresses(body.OriginalRecipient)),\n      subject: firstString(body.Subject),\n      text: firstString(body.TextBody),\n      html: firstString(body.HtmlBody),\n      thread_ids: parseMessageIds(headerFromList(body.Headers, \"In-Reply-To\"), headerFromList(body.Headers, \"References\")),\n    };\n  }\n  // Mailgun routes\n  if (\"body-plain\" in body || \"body-html\" in body || \"Message-Id\" in body) {\n    return {\n      provider: \"mailgun\",\n      message_id: firstString(body[\"Message-Id\"]),\n      from: firstString(body.sender, body.from, body.From),\n      to: splitAddresses(body.recipient).concat(splitAddresses(body.To)),\n      subject: firstString(body.subject, body.Subject),\n      text: firstString(body[\"body-plain\"]),\n      html: firstString(body[\"body-html\"]),\n      thread_ids: (() => {\n        let mh          = body[\"message-headers\"];\n        if (typeof mh === \"string\") { try { mh = JSON.parse(mh); } catch { mh = null; } }\n        return parseMessageIds(body[\"In-Reply-To\"], body.References, headerFromList(mh, \"In-Reply-To\"), headerFromList(mh, \"References\"));\n      })(),\n    };\n  }\n  // SendGrid Inbound Parse puts the Message-ID inside the raw headers blob.\n  const headers = typeof body.headers === \"string\" ? body.headers : \"\";\n  const hdrId = headers.match(/^Message-ID:\\s*(.+)$/im);\n  return {\n    provider: headers ? \"sendgrid\" : \"generic\",\n    message_id: firstString(body.message_id, body.messageId, hdrId ? hdrId[1] : null),\n    from: firstString(body.from),\n    to: splitAddresses(body.to).concat(splitAddresses(body.envelope_to)),\n    subject: firstString(body.subject),\n    text: firstString(body.text),\n    html: firstString(body.html),\n    thread_ids: parseMessageIds(\n      body.in_reply_to, body.inReplyTo, body.references,\n      headers ? headerFromBlob(headers, \"In-Reply-To\") : null,\n      headers ? headerFromBlob(headers, \"References\") : null,\n    ),\n  };\n}\n\nexport function toCandidates(rows                   )              {\n  return rows.map((r) => ({\n    registration_id: r.id,\n    job_id: r.job_id,\n    token: r.email_token,\n    status: r.status,\n    serial: r.equipment?.serial_number ?? null,\n    model: r.equipment?.model_number ?? null,\n    brand_key: r.brand_key,\n    customer_email: r.customers?.email ?? null,\n    customer_name: r.customers?.name ?? null,\n  }));\n}\n\n                                 \n                            \n                     \n                                                                      \n                       \n \n\n/**\n * Store the email, match it, and auto-register only when the matcher is sure.\n * Never throws for \"bad\" mail — anything odd lands in the review queue.\n */\nexport async function processInboundEmail(\n  store               ,\n  rawPayload         ,\n  email                 ,\n  opts                         = {},\n)                          {\n  if (email.message_id) {\n    const existing = await store.findInboundByMessageId(email.message_id);\n    if (existing) return { inbound_id: existing.id, duplicate: true, status: \"duplicate\" };\n  }\n\n  const rawId = await store.insertRaw({ provider: email.provider, message_id: email.message_id, payload: rawPayload });\n  const [manufacturers, registrations] = await Promise.all([store.loadManufacturers(), store.loadRegistrations()]);\n\n  // The tracker: which of our sends is this a reply to?\n  const addressTokens = Array.from(new Set(email.to.flatMap((a) => Array.from(a.matchAll(/\\+([A-Za-z0-9]{6})@/g), (m) => m[1].toUpperCase()))));\n  const outbound = (email.thread_ids.length || addressTokens.length)\n    ? await store.findOutbound({\n      threadIds: Array.from(new Set(email.thread_ids.concat(email.thread_ids.map((t) => t.split(\"@\")[0])))),\n      tokens: addressTokens,\n    })\n    : [];\n  const sender = normEmail(email.from);\n  const repliedTo = outbound.filter((o) =>\n    // Stored ids are ours (\"warranty.CODE.x@domain\") plus the provider's, which may lack a domain\n    // (Postmark returns a bare UUID), so also compare against the part before the \"@\".\n    (o.message_ids ?? []).some((raw) => {\n      const id = String(raw).toLowerCase().replace(/^<|>$/g, \"\");\n      return email.thread_ids.some((t) => t === id || t.split(\"@\")[0] === id);\n    }) ||\n    (addressTokens.includes(String(o.email_token).toUpperCase()) && !!sender && normEmail(o.to_email) === sender)\n  );\n  const replyTokens = Array.from(new Set(repliedTo.map((o) => String(o.email_token).toUpperCase())));\n\n  const parsed = parseConfirmationEmail({ ...email, replyTokens }, manufacturers);\n  const result = matchConfirmation(parsed, toCandidates(registrations), { threshold: opts.threshold ?? DEFAULT_AUTO_THRESHOLD });\n\n  const status = result.decision === \"auto\" ? \"auto_matched\" : result.decision === \"review\" ? \"needs_review\" : \"unmatched\";\n  const bodyText = (email.text && email.text.trim()) ? email.text : (email.html ?? \"\");\n  const inboundId = await store.insertInbound({\n    raw_id: rawId,\n    provider: email.provider,\n    message_id: email.message_id,\n    from_email: normEmail(email.from),\n    to_addresses: email.to,\n    subject: email.subject,\n    snippet: bodyText.replace(/<[^>]+>/g, \" \").replace(/\\s+/g, \" \").trim().slice(0, SNIPPET_CHARS),\n    parsed: {\n      tokens: parsed.tokens,\n      serials: parsed.labeledSerials,\n      models: parsed.labeledModels,\n      brands: parsed.brandKeys,\n      confirmation_number: parsed.confirmationNumber,\n      looks_like_confirmation: parsed.looksLikeConfirmation,\n      reply_to_tokens: replyTokens,\n    },\n    outbound_id: repliedTo.length ? repliedTo[0].id : null,\n    status,\n    confidence: result.confidence,\n    summary: result.summary,\n    candidates: result.candidates,\n    matched_registration_ids: result.matches.map((m) => m.registration_id),\n  });\n\n  if (result.decision === \"auto\") {\n    const toMark = result.matches.filter((m) => !m.alreadyRegistered).map((m) => m.registration_id);\n    if (toMark.length) {\n      await store.markRegistered(toMark, { confirmation_number: parsed.confirmationNumber, matched_inbound_id: inboundId });\n    }\n  }\n\n  return { inbound_id: inboundId, duplicate: false, status, result };\n}\n\n/** Constant-time string compare for the shared webhook secret. */\nexport function safeEqual(a        , b        )          {\n  if (a.length !== b.length) return false;\n  let diff = 0;\n  for (let i = 0; i < a.length; i++) diff |= a.charCodeAt(i) ^ b.charCodeAt(i);\n  return diff === 0;\n}\n\n/** Secret can arrive as a header, ?key=, or HTTP basic-auth password (SendGrid/Mailgun URLs). */\nexport function extractSecret(headers                                      , url     )                {\n  const h = headers.get(\"x-warranty-secret\");\n  if (h) return h;\n  const q = url.searchParams.get(\"key\");\n  if (q) return q;\n  const auth = headers.get(\"authorization\") || \"\";\n  const m = auth.match(/^Basic\\s+(.+)$/i);\n  if (m) {\n    try {\n      const decoded = atob(m[1]);\n      const idx = decoded.indexOf(\":\");\n      return idx >= 0 ? decoded.slice(idx + 1) : decoded;\n    } catch {\n      return null;\n    }\n  }\n  return null;\n}\n","send":"// Core of the `warranty-send` Edge Function, free of Deno APIs so Node tests can drive it.\n//\n// The app asks us to send a job's prepared warranty email. We REBUILD the email here from the\n// database (equipment, manufacturer, customer) instead of trusting the stored draft, because the\n// app's key is public and anyone holding it could otherwise use this function to mail anything to\n// anyone. The rebuilt text matches the app's preview (tests/warranty-send.test.ts checks parity).\n//\n// The tracker: every send carries\n//   - Reply-To: warranty+CODE@<inbox domain>   (the job's ref code; survives any mail client)\n//   - \"[Ref W-CODE]\" in the subject              (survives \"Re:\" and most forwarding)\n//   - a Message-ID we choose, stored in warranty_outbound.message_ids together with whatever id\n//     the provider reports, so the reply's In-Reply-To / References point straight back here.\n//\n// Provider is Jack's choice (Postmark, SendGrid, Mailgun or Resend). Until it's set, the function\n// runs in TEST mode: it records what it would have sent and emails nobody.\n\nexport const SEND_PROVIDERS = [\"postmark\", \"sendgrid\", \"mailgun\", \"resend\"]         ;\n                                                         \n\n                             \n                        \n                                \n                        \n                                                                                                  \n                                                                                                \n                                                                                             \n                               \n                                                                           \n \n\nexport function readSendConfig(env                                   )             {\n  const provider = String(env(\"WARRANTY_EMAIL_PROVIDER\") || \"\").toLowerCase();\n  const limit = Number(env(\"WARRANTY_DAILY_LIMIT\"));\n  return {\n    mode: String(env(\"WARRANTY_SEND_MODE\") || \"test\").toLowerCase() === \"live\" ? \"live\" : \"test\",\n    provider: (SEND_PROVIDERS                     ).includes(provider) ? provider                 : null,\n    apiKey: env(\"WARRANTY_PROVIDER_KEY\") || null,\n    fromEmail: env(\"WARRANTY_FROM_EMAIL\") || null,\n    fromName: env(\"WARRANTY_FROM_NAME\") || \"ABC Mechanical\",\n    replyInbox: env(\"WARRANTY_REPLY_INBOX\") || null,\n    mailgunDomain: env(\"WARRANTY_MAILGUN_DOMAIN\") || null,\n    dailyLimit: Number.isFinite(limit) && limit > 0 ? limit : 40,\n  };\n}\n\n// ── email text (mirror of buildWarrantyEmail in claudia.html's WARRANTY-CORE block) ─────────\n\n                                   \n                    \n                       \n                                  \n                        \n                             \n \n                                \n             \n                       \n                              \n                               \n                              \n \n                             \n             \n                  \n               \n                       \n                         \n                                                                                                                                \n \n\nexport function codedReplyTo(inbox                           , token                           )                {\n  const m = String(inbox || \"\").trim().match(/^([^@\\s+]+)(?:\\+[^@\\s]*)?@([^@\\s]+\\.[^@\\s]+)$/);\n  if (!m || !token) return null;\n  return `${m[1]}+${token}@${m[2]}`;\n}\n\nfunction firstName(customer                           )         {\n  const raw = String(customer || \"\").trim();\n  if (!raw) return \"\";\n  const part = raw.includes(\",\") ? raw.split(\",\")[1] : raw;\n  const first = (part || \"\").trim().split(/\\s+/)[0] || \"\";\n  return first ? first[0].toUpperCase() + first.slice(1).toLowerCase() : \"\";\n}\n\nfunction fmtDate(iso                           )         {\n  const m = String(iso || \"\").match(/^(\\d{4})-(\\d{2})-(\\d{2})/);\n  return m ? `${m[2]}/${m[3]}/${m[1]}` : \"\";\n}\n\nfunction looksLikeEmail(s         )          {\n  return /^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(String(s || \"\").trim());\n}\n\nexport function unitHolds(eq               , mf                         )           {\n  const holds           = [];\n  if (!mf) holds.push(\"unknown_manufacturer\");\n  else if (!mf.registration_url) holds.push(\"no_registration_url\");\n  else if (!mf.url_verified) holds.push(\"unverified_url\");\n  if (!String(eq.serial_number || \"\").trim()) holds.push(\"missing_serial\");\n  if (!String(eq.model_number || \"\").trim()) holds.push(\"missing_model\");\n  return holds;\n}\n\nexport function buildEmail(args   \n                                                         \n                                                              \n                \n                       \n                  \n                \n )             {\n  const { job, token, inbox, company, today } = args;\n  const reply = codedReplyTo(inbox, token);\n  const to = looksLikeEmail(job && job.email) ? String(job.email).trim() : \"\";\n  const emailHolds           = [];\n  if (!to) emailHolds.push(\"no_customer_email\");\n  if (!reply) emailHolds.push(\"inbox_not_set\");\n\n  const results = (args.units || []).map(({ eq, mf }) => ({\n    eq, mf, holds: unitHolds(eq, mf), status: \"\",\n    equipment_id: eq.id,\n    brand_key: mf ? mf.brand_key : null,\n    registration_url: mf && mf.registration_url ? mf.registration_url : null,\n  }));\n  const ready = results.filter((u) => !u.holds.length);\n  results.forEach((u) => {\n    u.status = (u.holds.length || emailHolds.length || !ready.length) ? \"needs_review\" : \"email_prepared\";\n  });\n\n  const makers = Array.from(new Set(ready.map((u) => u.mf .display_name)));\n  const windows = ready.map((u) => u.mf .window_days).filter((n)              => Number.isFinite(n) && (n          ) > 0);\n  const windowDays = windows.length ? Math.min(...windows) : null;\n  const ref = token ? `W-${token}` : \"\";\n  const subject = `Register your new ${makers.length ? makers.join(\" & \") + \" \" : \"\"}equipment warranty — ${company}${ref ? ` [Ref ${ref}]` : \"\"}`;\n\n  const first = firstName(job && job.customer);\n  const lines           = [];\n  lines.push(`Hi ${first || \"there\"},`);\n  lines.push(\"\");\n  lines.push(`Thank you for choosing ${company} for your installation. To get the full manufacturer warranty, please register your new equipment with the manufacturer${windowDays ? ` within ${windowDays} days of installation` : \" as soon as you can\"}. Here are the details you'll need:`);\n  for (const u of ready) {\n    const installed = fmtDate(u.eq.install_date || today);\n    lines.push(\"\");\n    lines.push(`${u.eq.label ? u.eq.label + \" — \" : \"\"}${u.mf .display_name}`);\n    lines.push(`  Model number: ${String(u.eq.model_number).trim()}`);\n    lines.push(`  Serial number: ${String(u.eq.serial_number).trim()}`);\n    if (installed) lines.push(`  Installation date: ${installed}`);\n    lines.push(`  Register at: ${u.mf .registration_url}`);\n  }\n  lines.push(\"\");\n  if (reply) {\n    lines.push(\"Once you've registered, just reply to this email and paste in (or attach) the confirmation the manufacturer sends you. That's all we need to record your warranty as registered.\");\n    lines.push(\"\");\n  }\n  if (ref) lines.push(`Your reference: ${ref}`);\n  lines.push(\"\");\n  lines.push(\"Thank you,\");\n  lines.push(company);\n\n  return {\n    to, subject, body: lines.join(\"\\n\"), emailHolds, replyTo: reply,\n    units: results.map((u) => ({\n      equipment_id: u.equipment_id, brand_key: u.brand_key, registration_url: u.registration_url,\n      holds: u.holds.concat(emailHolds), status: u.status,\n    })),\n  };\n}\n\n// ── provider calls ───────────────────────────────────────────────────────────\n\n                                  \n                    \n                   \n             \n                  \n                  \n               \n                                  \n                              \n \n\nexport function newMessageId(token        , domain        , rand        )         {\n  return `warranty.${token}.${rand}@${domain}`.toLowerCase();\n}\n\n/** The HTTP request each provider expects. Pure, so tests can check it without the network. */\nexport function providerRequest(provider              , msg                 , cfg                                              )                                     {\n  const from = `${msg.fromName} <${msg.fromEmail}>`;\n  const key = cfg.apiKey || \"\";\n  switch (provider) {\n    case \"postmark\":\n      return {\n        url: \"https://api.postmarkapp.com/email\",\n        init: {\n          method: \"POST\",\n          headers: { \"Accept\": \"application/json\", \"Content-Type\": \"application/json\", \"X-Postmark-Server-Token\": key },\n          body: JSON.stringify({\n            From: from, To: msg.to, ReplyTo: msg.replyTo, Subject: msg.subject, TextBody: msg.text,\n            MessageStream: \"outbound\", Headers: [{ Name: \"X-Claudia-Ref\", Value: msg.ref }],\n          }),\n        },\n      };\n    case \"sendgrid\":\n      return {\n        url: \"https://api.sendgrid.com/v3/mail/send\",\n        init: {\n          method: \"POST\",\n          headers: { \"Authorization\": `Bearer ${key}`, \"Content-Type\": \"application/json\" },\n          body: JSON.stringify({\n            personalizations: [{ to: [{ email: msg.to }] }],\n            from: { email: msg.fromEmail, name: msg.fromName },\n            reply_to: { email: msg.replyTo },\n            subject: msg.subject,\n            content: [{ type: \"text/plain\", value: msg.text }],\n            headers: { \"Message-ID\": `<${msg.messageId}>`, \"X-Claudia-Ref\": msg.ref },\n          }),\n        },\n      };\n    case \"mailgun\": {\n      const form = new URLSearchParams();\n      form.set(\"from\", from); form.set(\"to\", msg.to); form.set(\"subject\", msg.subject); form.set(\"text\", msg.text);\n      form.set(\"h:Reply-To\", msg.replyTo); form.set(\"h:Message-Id\", `<${msg.messageId}>`); form.set(\"h:X-Claudia-Ref\", msg.ref);\n      return {\n        url: `https://api.mailgun.net/v3/${cfg.mailgunDomain}/messages`,\n        init: { method: \"POST\", headers: { \"Authorization\": `Basic ${btoa(`api:${key}`)}`, \"Content-Type\": \"application/x-www-form-urlencoded\" }, body: form.toString() },\n      };\n    }\n    case \"resend\":\n      return {\n        url: \"https://api.resend.com/emails\",\n        init: {\n          method: \"POST\",\n          headers: { \"Authorization\": `Bearer ${key}`, \"Content-Type\": \"application/json\" },\n          body: JSON.stringify({\n            from, to: [msg.to], reply_to: msg.replyTo, subject: msg.subject, text: msg.text,\n            headers: { \"Message-ID\": `<${msg.messageId}>`, \"X-Claudia-Ref\": msg.ref },\n          }),\n        },\n      };\n  }\n}\n\n/** Pull the provider's own message id out of its response, so a reply referencing it still matches. */\nexport async function providerMessageId(provider              , res          )                         {\n  try {\n    if (provider === \"sendgrid\") return res.headers.get(\"x-message-id\");\n    const j = await res.json()                           ;\n    const id = provider === \"postmark\" ? j.MessageID : j.id;\n    return typeof id === \"string\" ? id.replace(/^<|>$/g, \"\").toLowerCase() : null;\n  } catch {\n    return null;\n  }\n}\n\n// ── the send itself ──────────────────────────────────────────────────────────\n\n                              \n                          \n                 \n                           \n                                        \n \n\n                            \n                                                                                   \n                                                                                                                                 \n                                                        \n                                           \n                                                                \n                                                                                                       \n \n\n                             \n               \n                                                                                                                             \n \n\nexport async function sendJobWarrantyEmail(\n  store           ,\n  req                                             ,\n  cfg            ,\n  deps                                                                ,\n)                      {\n  const jobId = typeof req.job_id === \"string\" ? req.job_id : \"\";\n  const token = typeof req.email_token === \"string\" ? req.email_token.toUpperCase() : \"\";\n  if (!jobId || !/^[A-Z2-9]{6}$/.test(token)) return { http: 400, body: { ok: false, error: \"job_id and email_token are required\" } };\n\n  const now = (deps.now ?? (() => new Date()))();\n  if (cfg.mode === \"live\" && await store.hasSent(token)) {\n    return { http: 409, body: { ok: false, error: \"This warranty email was already sent.\" } };\n  }\n  const since = new Date(now.getTime() - 24 * 3600 * 1000).toISOString();\n  if (await store.countOutboundSince(since) >= cfg.dailyLimit) {\n    return { http: 429, body: { ok: false, error: \"Daily warranty email limit reached.\" } };\n  }\n\n  const job = await store.loadJob(jobId, token);\n  if (!job || !job.units.length) return { http: 404, body: { ok: false, error: \"No prepared warranty email for this job.\" } };\n\n  const today = now.toISOString().slice(0, 10);\n  const built = buildEmail({\n    job, token, inbox: cfg.replyInbox, company: cfg.fromName, today,\n    units: job.units.map((u) => ({ eq: u.equipment, mf: u.manufacturer })),\n  });\n  const readyIds = job.units\n    .filter((u, i) => built.units[i].status === \"email_prepared\" && u.status === \"email_prepared\")\n    .map((u) => u.registration_id);\n  if (built.emailHolds.length || !readyIds.length) {\n    return { http: 422, body: { ok: false, error: \"This email is on hold.\", holds: built.emailHolds.length ? built.emailHolds : built.units.flatMap((u) => u.holds) } };\n  }\n\n  const domain = String(cfg.replyInbox || cfg.fromEmail || \"warranty.invalid\").split(\"@\").pop() || \"warranty.invalid\";\n  const messageId = newMessageId(token, domain, (deps.rand ?? (() => crypto.randomUUID().replace(/-/g, \"\").slice(0, 16)))());\n  const base = {\n    email_token: token, job_id: jobId, registration_ids: readyIds, to_email: built.to, reply_to: built.replyTo,\n    subject: built.subject, body: built.body, provider: cfg.mode === \"live\" ? cfg.provider : \"test\",\n  };\n\n  if (cfg.mode !== \"live\") {\n    const id = await store.insertOutbound({ ...base, status: \"test\", message_ids: [messageId] });\n    return { http: 200, body: { ok: true, mode: \"test\", outbound_id: id, sent_ids: [] } };\n  }\n  if (!cfg.provider || !cfg.apiKey || !cfg.fromEmail || (cfg.provider === \"mailgun\" && !cfg.mailgunDomain)) {\n    return { http: 503, body: { ok: false, error: \"Email sending isn't configured yet.\" } };\n  }\n\n  const msg                  = {\n    fromEmail: cfg.fromEmail, fromName: cfg.fromName, to: built.to, replyTo: built.replyTo , subject: built.subject,\n    text: built.body, messageId, ref: `W-${token}`,\n  };\n  const { url, init } = providerRequest(cfg.provider, msg, cfg);\n  let res          ;\n  try {\n    res = await deps.fetch(url, init);\n  } catch (e) {\n    await store.insertOutbound({ ...base, status: \"failed\", message_ids: [messageId], error: String(e).slice(0, 500) });\n    return { http: 502, body: { ok: false, error: \"Couldn't reach the email service.\" } };\n  }\n  if (!res.ok) {\n    const detail = (await res.text().catch(() => \"\")).slice(0, 500);\n    await store.insertOutbound({ ...base, status: \"failed\", message_ids: [messageId], error: `${res.status} ${detail}` });\n    return { http: 502, body: { ok: false, error: `The email service refused the message (${res.status}).` } };\n  }\n  const providerId = await providerMessageId(cfg.provider, res);\n  const sentAt = now.toISOString();\n  const outboundId = await store.insertOutbound({\n    ...base, status: \"sent\", sent_at: sentAt, message_ids: providerId ? [messageId, providerId] : [messageId],\n  });\n  await store.markSent(readyIds, { sent_at: sentAt, outbound_id: outboundId });\n  return { http: 200, body: { ok: true, mode: \"live\", outbound_id: outboundId, sent_ids: readyIds } };\n}\n"};
</script>
<script>
// Runs inside demo/claudia-demo.html before the app. Plain browser JS (no build step).
// - window.supabase.createClient → an in-memory database seeded from window.__DEMO.tables
// - the warranty_registrations → equipment status sync that migration 0006's trigger does

// - a small DEMO panel: the customer's inbox, and "Reply as the customer" → the real inbound core
(function () {
  var D = window.__DEMO;
  var uuid = function () { return (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()); };
  var db = {};
  Object.keys(D.tables).forEach(function (k) { db[k] = D.tables[k].map(function (r) { return Object.assign({}, r); }); });
  window.__demoDB = db;
  var T = function (n) { return (db[n] = db[n] || []); };

  // migration 0006, step 6: registration status → equipment columns
  function syncEquipment(reg, before) {
    if (before && before.status === reg.status) return;
    var e = T("equipment").find(function (x) { return x.id === reg.equipment_id; });
    if (!e) return;
    e.warranty_status = reg.status;
    e.warranty_status_at = new Date().toISOString();
    if (reg.status === "registered") {
      e.warranty_registered = true;
      e.warranty_registered_date = e.warranty_registered_date || new Date().toISOString().slice(0, 10);
    }
  }

  var EMBED_FK = { customers: "customer_id", jobs: "job_id", equipment: "equipment_id", users: "assigned_to" };
  function parseSelect(sel) { var out = [], re = /([a-z_]+)\(([^)]*)\)/g, m; while ((m = re.exec(sel || "")) !== null) out.push({ table: m[1], cols: m[2] }); return out; }
  function pick(row, cols) {
    if (!row) return null;
    if (!cols || cols.trim() === "*") return Object.assign({}, row);
    var o = {}; cols.split(",").map(function (c) { return c.trim(); }).filter(Boolean).forEach(function (c) { o[c] = row[c] == null ? null : row[c]; }); return o;
  }

  function Query(name) { this.name = name; this.op = "select"; this.filters = []; this.sel = "*"; this._single = false; this._maybe = false; this._limit = null; this._order = null; }
  var Q = Query.prototype;
  Q.select = function (s) { this.sel = s || "*"; return this; };
  Q.insert = function (p) { this.op = "insert"; this.payload = p; return this; };
  Q.update = function (p) { this.op = "update"; this.payload = p; return this; };
  Q.upsert = function (p, o) { this.op = "upsert"; this.payload = p; this.opts = o || {}; return this; };

  var client = {

  try {
    localStorage.setItem("abc_device_auth", "ABCmech");
    localStorage.setItem("abc_current_user", JSON.stringify(D.user));
  } catch (e) {}

  // ── the real warranty cores, loaded as modules from the embedded (type-stripped) sources ──
  var C = window.__DEMO_CORES;
  var blob = function (src) { return URL.createObjectURL(new Blob([src], { type: "text/javascript" })); };
  var matchUrl = blob(C.match);
  var coresReady = Promise.all([
    import(blob(C.send)),
    import(blob(C.inbound.replace(/(["'])\.\/warranty-match\.ts\1/g, JSON.stringify(matchUrl)))),

  var mfByKey = function (k) { return T("warranty_manufacturers").find(function (m) { return m.brand_key === k; }) || null; };

  window.__demoMail = []; // what the pretend provider "delivered"

  function sendStore() {
    return {
      loadJob: async function (jobId, token) {
        var regs = T("warranty_registrations").filter(function (r) { return r.job_id === jobId && r.email_token === token; });
        if (!regs.length) return null;
        var cust = T("customers").find(function (c) { return c.id === regs[0].customer_id; }) || {};

          units: regs.map(function (r) {

          }).filter(function (u) { return u.equipment; }),

      },
      countOutboundSince: async function () { return 0; },
      hasSent: async function (token) { return T("warranty_outbound").some(function (o) { return o.email_token === token && o.status === "sent"; }); },
      insertOutbound: async function (row) { var id = uuid(); T("warranty_outbound").push(Object.assign({ id: id, created_at: new Date().toISOString() }, row)); return id; },
      markSent: async function (ids, f) {
        T("warranty_registrations").forEach(function (r) {
          if (ids.indexOf(r.id) >= 0 && r.status === "email_prepared") { var b = Object.assign({}, r); Object.assign(r, { status: "sent", sent_at: f.sent_at, outbound_id: f.outbound_id }); syncEquipment(r, b); }
        });
      },
    };
  }
  // Pretend Postmark: accepts the message, returns an id, sends nothing anywhere.
  var fakeProvider = async function (url, init) {
    var msg = JSON.parse(init.body);
    var id = uuid();
    window.__demoMail.push({ provider_id: id, msg: msg, at: new Date().toISOString() });
    return new Response(JSON.stringify({ MessageID: id, ErrorCode: 0, Message: "OK" }), { status: 200 });
  };

  var realFetch = window.fetch.bind(window);
  window.fetch = async function (url, init) {
    var u = String(url);

      var out = await cores.send.sendJobWarrantyEmail(sendStore(), JSON.parse(init.body), cfg, { fetch: fakeProvider });
      setTimeout(renderPanel, 50);
      return new Response(JSON.stringify(out.body), { status: out.http, headers: { "Content-Type": "application/json" } });
    }
    if (/supabase\.co/.test(u)) return new Response(JSON.stringify({ error: "not available in the demo" }), { status: 503 });
    return realFetch(url, init);

      insertInbound: async function (row) { var id = uuid(); T("warranty_inbound").push(Object.assign({ id: id, received_at: new Date().toISOString() }, row)); return id; },
      loadManufacturers: async function () { return T("warranty_manufacturers"); },
      loadRegistrations: async function () {
        return T("warranty_registrations").map(function (r) {

      },
      findOutbound: async function (q) {
        return T("warranty_outbound").filter(function (o) { return (o.message_ids || []).some(function (id) { return q.threadIds.indexOf(id) >= 0; }) || q.tokens.indexOf(o.email_token) >= 0; });

    document.body.appendChild(pill);
    renderPanel();
  });
})();

    .sort((a,b) => new Date(a.at) - new Date(b.at) || crewTieRank(a.status) - crewTieRank(b.status));
  const byUser = {};
  entries.forEach(e => { (byUser[e.userName] = byUser[e.userName] || []).push(e); });

    const current = u ? crew.find(c => c.user_id === u.id) : null;
    const periods = [];

async function findOverlappingActivity(personName, excludeJobId, startIso, endIso, users) {
  const padMs = 3 * 24 * 3600 * 1000;
  const padStart = new Date(new Date(startIso).getTime() - padMs).toISOString();
  const padEnd = new Date(new Date(endIso).getTime() + padMs).toISOString();
  const { data } = await sb.from('job_notes')
    .select('id, job_id, content, created_at')
    .eq('source', 'system')
    .neq('job_id', excludeJobId)
    .gte('created_at', padStart)
    .lte('created_at', padEnd)
    .order('created_at', { ascending: true });
  const byJob = {};
  (data || []).forEach(n => { (byJob[n.job_id] = byJob[n.job_id] || []).push({ id: n.id, content: n.content, at: n.created_at }); });
  const sMs = new Date(startIso).getTime();
  const eMs = new Date(endIso).getTime();
  for (const [jobId, jobNotes] of Object.entries(byJob)) {
    const timeline = buildCrewTimeline(jobNotes, [], users);
    const periods = timeline[personName] || [];
    for (const p of periods) {
      const pStart = new Date(p.start).getTime();
      const pEnd = p.end ? new Date(p.end).getTime() : Date.now();
      if (pStart < eMs && pEnd > sMs) return jobId;

async function resolveCustomer(job) {

    .select('id').ilike('name', name).limit(1).maybeSingle();
  if (existing) {

    if (job.email) upd.email = job.email;
    if (job.customer_address !== undefined) upd.address = (!job.customer_address || isJunkAddr(job.customer_address)) ? null : job.customer_address;
    await sb.from('customers').update(upd).eq('id', existing.id);
    return existing.id;

    created_at: new Date().toISOString(), updated_at: new Date().toISOString(),

}

const ABC_SHOP_NAME = 'ABC SHOP';
const ABC_SHOP_ADDR = '423 Davisville Road, Willow Grove, PA';

async function ensureShopSentinel() {
  let customerId, touched = false;
  const { data: existing } = await sb.from('customers')
    .select('id, address').ilike('name', ABC_SHOP_NAME).limit(1).maybeSingle();
  if (existing) {
    customerId = existing.id;
    if (existing.address !== ABC_SHOP_ADDR) {
      await sb.from('customers').update({ address: ABC_SHOP_ADDR, updated_at: new Date().toISOString() }).eq('id', customerId);
      touched = true;
    }
  } else {
    const { data: c } = await sb.from('customers').insert({
      name: ABC_SHOP_NAME, address: ABC_SHOP_ADDR,
      created_at: new Date().toISOString(), updated_at: new Date().toISOString(),
    }).select('id').single();
    if (!c) return false;
    customerId = c.id;
    touched = true;
  }
  const { data: openJob } = await sb.from('jobs')
    .select('id').eq('customer_id', customerId)
    .not('current_status', 'eq', 'Closed').limit(1).maybeSingle();

    return ['Living Room','Master Bedroom','Bedroom 2','Bedroom 3','Kitchen','Office','Basement','Dining Room','Hallway'];
  if (t.includes('outdoor') || t.includes('condenser') || t.includes('heat pump'))

function warrantyStatus(eq) {
  if (eq.warranty_registered) {
    if (eq.install_date) {
      const exp = new Date(eq.install_date + 'T12:00:00');
      exp.setFullYear(exp.getFullYear() + 12);
      return { type:'registered', expires: exp.toISOString().split('T')[0] };
    }
    return { type:'registered', expires:null };
  }
  if (!eq.install_date) return { type:'untracked' };
  const deadline = new Date(eq.install_date + 'T12:00:00');
  deadline.setDate(deadline.getDate() + 60);
  const today = new Date(); today.setHours(0,0,0,0);
  const daysLeft = Math.ceil((deadline - today) / 86400000);
  if (daysLeft < 0) return { type:'lapsed', deadline: deadline.toISOString().split('T')[0] };
  if (daysLeft <= 14) return { type:'urgent', daysLeft, deadline: deadline.toISOString().split('T')[0] };
  return { type:'pending', daysLeft, deadline: deadline.toISOString().split('T')[0] };
}

/* ── Warranty registration workflow (r266) ───────────────────────────────────
   Install completes → a customer email is PREPARED with each unit's maker, model, serial and
   the maker's verified registration link. The office taps SEND EMAIL; the `warranty-send` Edge
   Function sends it with a tracker (Reply-To warranty+CODE@…, [Ref W-CODE] in the subject, and
   a stored Message-ID). The customer registers and simply REPLIES with the confirmation; the
   `warranty-inbound` Edge Function ties the reply back to that send, and only auto-registers
   confident matches — the rest land in WARRANTY REVIEW (hamburger menu). Tables: 0006. */

// WARRANTY-CORE-BEGIN — pure helpers (no sb/React); tests/claudia-warranty.test.mjs extracts
// and unit-tests exactly this block, so keep it free of anything defined elsewhere in the file.
// Inbox customer replies go to. Each email's Reply-To is warranty+CODE@… (the tracker), so it
// must accept plus-addressing. Must match WARRANTY_REPLY_INBOX on the warranty-send function.
// null = not chosen yet → prepared emails are held for review.
const WARRANTY_INBOX = "warranty@abcmechanical.example"; // DEMO ONLY
const WARRANTY_COMPANY_NAME = 'ABC Mechanical';
const WARRANTY_INSTALL_TYPES = ['New Install', 'Replacement'];
const WARRANTY_TRIGGER_STATUS = 'Completed/Needs Billing';
const WARRANTY_TOKEN_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // no 0/O/1/I/L
const WARRANTY_STATUS_LABEL = {
  not_sent: 'NOT SENT', email_prepared: 'EMAIL READY', sent: 'EMAIL SENT',
  registered: 'REGISTERED', needs_review: 'NEEDS REVIEW',
};
const WARRANTY_HOLD_LABEL = {
  no_customer_email: 'No customer email on file',
  inbox_not_set: 'Reply inbox not set up yet',
  unknown_manufacturer: 'Manufacturer not recognised',
  no_registration_url: 'No registration link on file for this maker',
  unverified_url: "Registration link not verified on the maker's site",
  missing_serial: 'Serial number missing',
  missing_model: 'Model number missing',
};

function isWarrantyInstallJob(job) {
  return !!job && WARRANTY_INSTALL_TYPES.includes(job.type);
}

// True when this status change should prepare warranty emails (dedupe happens downstream).
function shouldPrepareWarranty(job, nextStatus) {
  return nextStatus === WARRANTY_TRIGGER_STATUS && isWarrantyInstallJob(job);
}

function normWarrantyBrand(s) {
  return String(s == null ? '' : s).toLowerCase().replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, ' ').trim();
}

// Nameplate brand → manufacturers row. Exact key/name/alias first, then the longest alias
// that appears as whole words inside the brand ("American Standard / Trane" → american standard).
function resolveWarrantyManufacturer(brand, manufacturers) {
  const b = normWarrantyBrand(brand);
  if (!b || !Array.isArray(manufacturers)) return null;
  let best = null, bestLen = 0;
  for (const mf of manufacturers) {
    const names = [mf.brand_key, mf.display_name].concat(mf.aliases || []).map(normWarrantyBrand).filter(Boolean);
    if (names.includes(b)) return mf;
    for (const n of names) {
      if (n.length > bestLen && (' ' + b + ' ').includes(' ' + n + ' ')) { best = mf; bestLen = n.length; }
    }
  }
  return best;
}

function newWarrantyToken(randomBytes) {
  const bytes = randomBytes || (typeof crypto !== 'undefined' && crypto.getRandomValues
    ? crypto.getRandomValues(new Uint8Array(6))
    : Array.from({ length: 6 }, () => Math.floor(Math.random() * 256)));
  let t = '';
  for (let i = 0; i < 6; i++) t += WARRANTY_TOKEN_ALPHABET[bytes[i] % WARRANTY_TOKEN_ALPHABET.length];
  return t;
}

// warranty@abc.com + K7M3QX → warranty+K7M3QX@abc.com
function warrantyInboxAddress(inbox, token) {
  const m = String(inbox || '').trim().match(/^([^@\s+]+)(?:\+[^@\s]*)?@([^@\s]+\.[^@\s]+)$/);
  if (!m || !token) return null;
  return `${m[1]}+${token}@${m[2]}`;
}

function warrantyFirstName(customer) {
  const raw = String(customer || '').trim();
  if (!raw) return '';
  const part = raw.includes(',') ? raw.split(',')[1] : raw;
  const first = (part || '').trim().split(/\s+/)[0] || '';
  return first ? first[0].toUpperCase() + first.slice(1).toLowerCase() : '';
}

function warrantyFmtDate(iso) {
  const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? `${m[2]}/${m[3]}/${m[1]}` : '';
}

function looksLikeEmail(s) {
  return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(s || '').trim());
}

// Per-unit readiness: which reasons (if any) keep this unit out of the customer email.
function warrantyUnitHolds(eq, mf) {
  const holds = [];
  if (!mf) holds.push('unknown_manufacturer');
  else if (!mf.registration_url) holds.push('no_registration_url');
  else if (!mf.url_verified) holds.push('unverified_url');
  if (!String(eq.serial_number || '').trim()) holds.push('missing_serial');
  if (!String(eq.model_number || '').trim()) holds.push('missing_model');
  return holds;
}

/**
 * Build the customer email for one job.
 * units: [{ eq, mf }] — mf from resolveWarrantyManufacturer (may be null).
 * Returns { to, subject, body, emailHolds, units: [{ equipment_id, brand_key, registration_url, holds, status }] }.
 * Units with their own holds are left out of the email body and marked needs_review;
 * email-level holds (no customer email / inbox not set) put every unit in needs_review,
 * but the draft is still built so it's ready the moment the gap is fixed.
 */
function buildWarrantyEmail({ job, units, token, inbox, company, today }) {
  const companyName = company || WARRANTY_COMPANY_NAME;
  const reply = warrantyInboxAddress(inbox, token);
  const to = looksLikeEmail(job && job.email) ? String(job.email).trim() : '';
  const emailHolds = [];
  if (!to) emailHolds.push('no_customer_email');
  if (!reply) emailHolds.push('inbox_not_set');

  const unitResults = (units || []).map(({ eq, mf }) => {
    const holds = warrantyUnitHolds(eq, mf);
    return {
      eq, mf, holds,
      equipment_id: eq.id,
      brand_key: mf ? mf.brand_key : null,
      registration_url: mf && mf.registration_url ? mf.registration_url : null,
    };
  });
  const ready = unitResults.filter(u => !u.holds.length);
  unitResults.forEach(u => {
    u.status = (u.holds.length || emailHolds.length || !ready.length) ? 'needs_review' : 'email_prepared';
  });

  const makers = Array.from(new Set(ready.map(u => u.mf.display_name)));
  const windows = ready.map(u => u.mf.window_days).filter(n => Number.isFinite(n) && n > 0);
  const windowDays = windows.length ? Math.min.apply(null, windows) : null;
  const ref = token ? `W-${token}` : '';
  const subject = `Register your new ${makers.length ? makers.join(' & ') + ' ' : ''}equipment warranty — ${companyName}${ref ? ` [Ref ${ref}]` : ''}`;

  const first = warrantyFirstName(job && job.customer);
  const lines = [];
  lines.push(`Hi ${first || 'there'},`);
  lines.push('');
  lines.push(`Thank you for choosing ${companyName} for your installation. To get the full manufacturer warranty, please register your new equipment with the manufacturer${windowDays ? ` within ${windowDays} days of installation` : ' as soon as you can'}. Here are the details you'll need:`);
  ready.forEach(u => {
    const installed = warrantyFmtDate(u.eq.install_date || today);
    lines.push('');
    lines.push(`${u.eq.label ? u.eq.label + ' — ' : ''}${u.mf.display_name}`);
    lines.push(`  Model number: ${String(u.eq.model_number).trim()}`);
    lines.push(`  Serial number: ${String(u.eq.serial_number).trim()}`);
    if (installed) lines.push(`  Installation date: ${installed}`);
    lines.push(`  Register at: ${u.mf.registration_url}`);
  });
  lines.push('');
  if (reply) {
    lines.push("Once you've registered, just reply to this email and paste in (or attach) the confirmation the manufacturer sends you. That's all we need to record your warranty as registered.");
    lines.push('');
  }
  if (ref) lines.push(`Your reference: ${ref}`);
  lines.push('');
  lines.push('Thank you,');
  lines.push(companyName);

  return {
    to, subject, body: lines.join('\n'), emailHolds, replyTo: reply,
    units: unitResults.map(u => ({
      equipment_id: u.equipment_id, brand_key: u.brand_key, registration_url: u.registration_url,
      holds: u.holds.concat(emailHolds), status: u.status,
    })),
  };
}

// Missing-table errors mean db/migrations/0006 hasn't been run yet — warranty features
// then quietly stand down instead of erroring at techs.
function isWarrantyNotMigrated(error) {
  if (!error) return false;
  const msg = `${error.code || ''} ${error.message || ''}`;
  return error.code === '42P01' || error.code === 'PGRST205' || error.code === 'PGRST200' || /warranty_(registrations|manufacturers|inbound)/.test(msg);
}

  _warrantyMfCache = data || [];

}

/**
 * Prepare (or re-prepare) the warranty email for a job's equipment. Safe to call repeatedly:
 * units already emailed / sent / registered are left alone unless opts.force.
 * Returns { skipped } or { prepared, held, rows }.
 */
async function prepareWarrantyEmailsForJob(job, opts = {}) {
  const manufacturers = await fetchWarrantyManufacturers(true);
  if (!manufacturers) return { skipped: 'not_migrated' };
  const equipment = await fetchEquipment(job.id);
  if (!equipment) return { skipped: 'equipment_fetch_failed' };
  const scoped = opts.equipmentIds ? equipment.filter(e => opts.equipmentIds.includes(e.id)) : equipment;
  if (!scoped.length) return { skipped: 'no_equipment' };

  const { data: existing, error } = await sb.from('warranty_registrations').select('*').eq('job_id', job.id);
  if (error) { if (!isWarrantyNotMigrated(error)) console.warn('prepareWarranty', error); return { skipped: 'not_migrated' }; }
  const { data: byEquip } = await sb.from('warranty_registrations').select('*').in('equipment_id', scoped.map(e => e.id));
  const regFor = id => (byEquip || []).find(r => r.equipment_id === id) || null;
  const LOCKED = ['email_prepared', 'sent', 'registered'];
  const todo = scoped.filter(e => { const r = regFor(e.id); return opts.force ? (!r || r.status !== 'registered') : (!r || !LOCKED.includes(r.status)); });
  if (!todo.length) return { prepared: 0, held: 0, rows: [] };

  const token = ((existing || []).find(r => r.email_token) || {}).email_token || newWarrantyToken();
  const today = todayISO();
  // An install date is what starts the maker's registration window — fill it in on completion
  // for install jobs where the tech didn't enter one (never overwrites an existing date).
  if (isWarrantyInstallJob(job)) {
    for (const e of todo) {
      if (!e.install_date) { const err = await updateEquipment(e.id, { install_date: today }); if (!err) e.install_date = today; }
    }
  }
  const built = buildWarrantyEmail({
    job, token, inbox: WARRANTY_INBOX, today,
    units: todo.map(eq => ({ eq, mf: resolveWarrantyManufacturer(eq.brand, manufacturers) })),
  });
  const now = new Date().toISOString();
  const rows = built.units.map(u => ({
    equipment_id: u.equipment_id, job_id: job.id, customer_id: job._customer_id || null,
    brand_key: u.brand_key, email_token: token, status: u.status, hold_reasons: u.holds,
    registration_url: u.registration_url, email_to: built.to || null,
    email_subject: built.subject, email_body: built.body, prepared_at: now,
    prepared_by: validUUID(opts.userId) || null,
  }));
  const { data: saved, error: upErr } = await sb.from('warranty_registrations').upsert(rows, { onConflict: 'equipment_id' }).select();
  if (upErr) { console.error('prepareWarranty upsert', upErr); return { skipped: 'save_failed', error: upErr }; }
  return {
    prepared: rows.filter(r => r.status === 'email_prepared').length,
    held: rows.filter(r => r.status === 'needs_review').length,
    rows: saved || [],
  };
}

function warrantyPrepToast(r) {
  if (!r || r.skipped || (!r.prepared && !r.held)) return null;
  if (r.prepared && !r.held) return `Warranty email ready for ${r.prepared} unit${r.prepared > 1 ? 's' : ''}`;
  return `Warranty: ${r.held} unit${r.held > 1 ? 's' : ''} need review (menu → WARRANTY REVIEW)`;
}

// Ask the warranty-send Edge Function to send this job's prepared email (it rebuilds the text
// server-side and adds the reply tracker). Returns { ok, mode: 'test'|'live', sent_ids, error }.
// mode 'test' = recorded but NOT emailed (WARRANTY_SEND_MODE isn't 'live' yet).
const WARRANTY_SEND_FN = `${SUPABASE_URL}/functions/v1/warranty-send`;
async function sendWarrantyEmail(reg) {
  try {
    const res = await fetch(WARRANTY_SEND_FN, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_KEY}`, 'apikey': SUPABASE_KEY },
      body: JSON.stringify({ job_id: reg.job_id, email_token: reg.email_token }),
    });
    if (res.status === 404) {
      const j = await res.json().catch(() => ({}));
      return { ok: false, error: j && j.error ? j.error : 'Email sending is not switched on yet.' };
    }
    const j = await res.json().catch(() => ({}));
    if (!res.ok || !j.ok) return { ok: false, error: (j && j.error) || `Send failed (${res.status})` };
    return j;
  } catch (e) {
    return { ok: false, error: 'Could not reach the email service.' };
  }
}

// Deterministic capacity-code table for split-system condensers/heat pumps — model number
// digit groups are fixed by manufacturer convention, unlike tonnage which the vision model
// derives via mental arithmetic and sometimes gets wrong even when the model # OCR'd correctly.
const CAPACITY_CODE_TO_TON = {
  '018':'1.5', '024':'2', '030':'2.5', '036':'3', '042':'3.5', '048':'4',
  '054':'4.5', '060':'5', '072':'6', '090':'7.5', '102':'8.5', '120':'10',
  '150':'12.5', '180':'15', '210':'17.5', '240':'20',
};
// Goodman/Amana/Daikin condenser & heat pump model format: PREFIX + 2-digit SEER + 3-digit capacity code
const CAPACITY_MODEL_PREFIX_RE = /^(?:GSX|SSX|GSZ|SSZ|DSZC|DSXC|ASX|ASZ|GSXC|SSXC)\d{2}(\d{3})/;

function deriveTonnageFromModel(modelNumber) {
  if (!modelNumber) return null;
  const m = String(modelNumber).toUpperCase().replace(/[^A-Z0-9]/g, '');
  const match = m.match(CAPACITY_MODEL_PREFIX_RE);
  if (!match) return null;
  const code = match[1];
  const tons = CAPACITY_CODE_TO_TON[code];
  if (!tons) return null;
  return `${tons} ton (${(Number(code) * 1000).toLocaleString()} BTU)`;
}

// Overrides the vision model's tonnage guess with a deterministic decode whenever the
// model number matches a known capacity-coded prefix — the model # OCR is reliable,
// the mental-math decode of it is not (see CLAUDE.md gotcha: r216 wrong-tonnage scans).
function finalizeScanResult(result) {
  const derived = deriveTonnageFromModel(result.model_number);
  if (derived) result.tonnage = derived;
  return result;
}

// Trims a raw scan error (an API error body can be a large JSON blob) down to something
// short enough to show inline in the RETRY SCAN button.
function scanErrorMessage(err) {
  const msg = (err?.message || 'scan failed').replace(/\s+/g, ' ').trim();
  return msg.length > 100 ? msg.slice(0, 100) + '…' : msg;
}

async function readFileForScan(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('File read failed'));
    reader.onload = (e) => {
      const dataUrl = e.target.result;
      const match = dataUrl.match(/^data:([^;]+);base64,(.+)$/);
      if (!match) { reject(new Error('Invalid image data')); return; }
      const rawType = match[1];
      const b64 = match[2];
      const mediaType = ['image/jpeg','image/png','image/gif','image/webp'].includes(rawType) ? rawType : 'image/jpeg';
      resolve({ b64, mediaType });
    };
    reader.readAsDataURL(file);
  });
}

ondenser Fan Motor, Evaporator Fan Motor, Blower Motor, ECM Motor, Variable-Speed Motor\n- Electrical components: Dual Run Capacitor, Start Capacitor, Contactor, Transformer, Circuit Board, Control Board, Sequencer\n- Refrigeration parts: Compressor, Expansion Valve, Reversing Valve, Filter Drier, Metering Device\n- Heating parts: Heat Strip, Igniter, Inducer Motor, Pressure Switch, Gas Valve\n\nWATER HEATER vs GAS FURNACE — critical disambiguation:\n- If the nameplate shows ANY of these → equipment_type MUST be "Water Heater" (never Gas Furnace): "GALLON", "GAL", "GALLONS", "CAPACITY (GAL)", "FIRST HOUR RATING", "GPH RECOVERY", "RECOVERY EFFICIENCY", "UEF", "HOT WATER HEATER", "WATER HTR"\n- Common water heater brands/model prefixes: Bradford White (AW, MH, RE, RG, MI), Rheem (PROG, PRSE, XG, MR), A.O. Smith (GPVH, GPVT, GACH, GCSH, GCV), State, American, Kenmore\n- "AFUE" on a nameplate → Gas Furnace (not Water Heater)\n- "BTU INPUT" alone is NOT enough to call it a furnace — water heaters also have BTU input ratings\n\nEquipment type + brand inference from model/part number:\n- 253xxxxx = Interlink condenser fan motor\n- 5KCP, 3S, HC = GE/Genteq motor\n- CAP-xx = capacitor\n- DR96TC = 96% two-stage gas furnace (Daikin/Goodman)\n- GSX/SSX/XC = AC condenser; CAPEA/CHPF = evaporator coil\n- ARUF/AH = air handler; GMSS/GCSS = furnace\n- MXZ/FTX = Mitsubishi mini-split\n- H6HK/H8HK = Nordyne/Intertherm electric heat strip\n- Trane/American Standard packaged rooftop model format Y_X###L#... (e.g. YCD120B4L0CA): Y=packaged rooftop, 2nd letter C=cooling section, 3rd letter D/H/C/J=heat type (D=cooling only/no heat, H=gas heat, C=electric heat), digits after 2 letters=tonnage code per the capacity table below, then a revision letter, then a single digit for voltage code (4=460V/3-phase/60Hz, 1=208-230V/1-phase, 3=208-230V/3-phase). brand="Trane" or "American Standard" (read from nameplate header), equipment_type="Package Unit"\n\nCapacity/spec → use "tonnage" for unit capacity only:\n- AC units/heat pumps/condensers: FIRST check nameplate for a direct capacity label (COOLING CAP, RATED CAP, NOMINAL CAP, BTU/HR, BTUH) — e.g. "36,000 BTU/HR" → "3 ton (36,000 BTU)". If not directly labeled, decode from the capacity digits embedded anywhere in the model number: 018 or 18=1.5T, 024 or 24=2T, 030 or 30=2.5T, 036 or 36=3T, 042 or 42=3.5T, 048 or 48=4T, 054 or 54=4.5T, 060 or 60=5T, 072 or 72=6T, 090 or 90=7.5T, 102=8.5T, 120=10T, 150=12.5T, 180=15T, 210=17.5T, 240=20T (commercial packaged rooftop units commonly use the larger sizes)\n- Heat strips: kW × 3,412 = BTU (H6HK010 → "10 kW (34,120 BTU)")\n- Furnaces: "80,000 BTU" (080=80K, 100=100K in model)\n- Capacitors: "45+5 MFD, 440V"\n- For motors, leave tonnage null — use dedicated fields below\n\nBARCODE TEXT — if a 2D barcode (DataMatrix/QR/Code128) is visible, read the encoded text. Interlink barcodes encode: YSLB-{W}-{P}-{variant} e.g. YSLB-350-6-B001 (350W, 6-pole).\n\nPole count → RPM at 60 Hz: 2P=3450, 4P=1625, 6P=1075, 8P=825\nWatts → HP (input power, prefer printed label value): 150-180W=1/5, 190-230W=1/4, 240-370W=1/3, 371-540W=1/2, 541-700W=3/4, 701-760W=1\n\nMotor brand decoding by part number:\n- Interlink 253xxxxx: brand=Interlink, voltage=208-230V, shaft_diameter=1/2 inch; decode barcode YSLB-{W}-{P}-xxx → HP from watts, RPM from poles\n- GE/Genteq 5KCP39xx, 3S1xx, HC43xx: brand=GE/Genteq, shaft_diameter=1/2 inch\n- A.O. Smith / US Motor / Nidec F48xx, S58xx: shaft_diameter=1/2 inch\n- Century / Regal Beloit CPxx, CAxx: shaft_diameter=1/2 inch\n- Emerson K55xxx: shaft_diameter=1/2 inch\n\nMotor-specific fields (extract from label or barcode, or infer from part number):\n- horsepower: "1/4", "1/3", "1/2", "3/4", "1" — if printed on label (e.g. "1/3HP") use that value exactly; only derive from watts if HP not printed\n- rpm: "1075", "1625", "825", "1100", "3450" — derive from pole count if RPM not printed\n- shaft_diameter: "1/2 inch", "5/8 inch" — default "1/2 inch" for condenser fan motors\n\nReply with ONLY a JSON object using these exact keys (null if unknown):\n{"equipment_type":null,"brand":null,"model_number":null,"serial_number":null,"tonnage":null,"horsepower":null,"rpm":null,"shaft_diameter":null,"refrigerant":null,"voltage":null,"seer":null,"mca":null,"mop":null,"year_manufactured":null}' },
        ],

  if (!res.ok) { const t = await res.text(); throw new Error(`API ${res.status}: ${t}`); }
  const data = await res.json();
  const text = (data.content[0].text || '').trim();
  const m = text.match(/\{[\s\S]*\}/);

async function scanNameplate(file) {
  const { b64, mediaType } = await readFileForScan(file);
  return scanNameplateFromB64(b64, mediaType);
}

// OCR a purchase/parts receipt → { vendor, amount, date }
// Vendor names haiku is prone to confusing with a visually/product-similar competitor
// (e.g. Home Depot read as Lowe's) — verified against the literal transcribed header text
// rather than trusting the model's own categorical guess. See CLAUDE.md r216 (tonnage) for
// the same underlying lesson applied to a different field.
const VENDOR_SIGNATURES = [
  { match: /how doers get more done|home depot|pro ?xtra/i, vendor: 'Home Depot' },
  { match: /lowe'?s/i, vendor: "Lowe's" },
];
function finalizeReceiptResult(result) {
  const hay = `${result.raw_header || ''} ${result.vendor || ''}`;
  const hit = VENDOR_SIGNATURES.find(v => v.match.test(hay));
  if (hit) result.vendor = hit.vendor;
  delete result.raw_header; // internal verification field only — never shown or saved
  return result;
}

const RECEIPT_SCAN_PROMPT = 'You are reading a photo of a purchase/parts receipt (e.g. a supply house, hardware store, or gas station). For the vendor, transcribe the exact store name as printed in the header/logo area character-by-character — do NOT infer or guess the store from the type of items purchased or the receipt\'s visual layout/style, since similar-looking hardware stores (e.g. Home Depot vs Lowe\'s) sell overlapping products and are easy to confuse if you are not reading the actual printed name. Also extract the GRAND TOTAL actually paid (the final total including tax, not a subtotal or any single line item). Reply with ONLY a JSON object using these exact keys (null if not clearly visible): {"vendor":null,"amount":null,"date":null,"raw_header":null}. "amount" must be a number with no currency symbol or commas (e.g. 142.87). "date" as YYYY-MM-DD if a purchase date is printed, else null. "raw_header" is the literal first 1-2 printed lines of the receipt (store name plus any slogan/tagline), verbatim, for verification.';

async function scanReceiptFromB64(b64, mediaType) {
  const res = await fetch(CLAUDE_PROXY, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_KEY}` },
    body: JSON.stringify({
      model: 'claude-haiku-4-5-20251001',
      max_tokens: 256,
      messages: [{
        role: 'user',
        content: [
          { type: 'image', source: { type: 'base64', media_type: mediaType, data: b64 } },
          { type: 'text', text: RECEIPT_SCAN_PROMPT },
        ],
      }],
    }),
  });
  if (!res.ok) { const t = await res.text(); throw new Error(`API ${res.status}: ${t}`); }
  const data = await res.json();
  const text = (data.content[0].text || '').trim();
  const m = text.match(/\{[\s\S]*\}/);
  if (!m) throw new Error('No JSON in response');
  return finalizeReceiptResult(JSON.parse(m[0]));
}
