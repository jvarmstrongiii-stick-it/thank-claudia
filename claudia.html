// Shop-wide "materials needed" list — aggregated from every job's unacquired items.
function MaterialsScreen({ jobs, onClose, onUpdateMaterials, onOpenJob }) {
  const [newItem, setNewItem] = useState('');
  const shopJob = (jobs || []).find(j => j.customer?.toUpperCase() === TMC_SHOP_NAME && j.status !== 'Closed');
  const groups = (jobs || [])
    .map(j => ({ job: j, items: (j.materials_needed || []).map((m, idx) => ({ ...m, _idx: idx })).filter(m => !m.acquired) }))
    .filter(g => g.items.length > 0);
  function toggleAcquired(job, idx) {
    const next = (job.materials_needed || []).map((m, i) => i === idx ? { ...m, acquired: true } : m);
    onUpdateMaterials(job.id, next);
  }
  async function addToShop() {
    const t = newItem.trim();
    if (!t || !shopJob) return;
    const next = [...(shopJob.materials_needed || []), { text: t, acquired: false }];
    setNewItem('');
    await onUpdateMaterials(shopJob.id, next);
  }
  return (
    <div className="fade-in" style={{ minHeight:'100vh', background:'var(--bg)' }}>
      <div style={{ padding:'18px 16px 14px', borderBottom:'1px solid var(--line)', background:'var(--panel)', position:'sticky', top:0, zIndex:10 }}>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <button onClick={onClose} className="head" style={{ fontSize:22, color:'var(--text)', background:'none', border:'none', padding:'0 6px', cursor:'pointer' }}>‹</button>
          <div className="head" style={{ fontSize:20, fontWeight:700 }}>MATERIALS NEEDED</div>
        </div>
      </div>
      <div style={{ padding:'12px 16px' }}>
        <div style={{ display:'flex', gap:8 }}>
          <input value={newItem} onChange={e => setNewItem(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') addToShop(); }}
            placeholder="Add a material…" disabled={!shopJob}
            style={{ flex:1, boxSizing:'border-box', padding:'10px 12px', borderRadius:8,
              background:'var(--bg)', border:'1px solid var(--line)', color:'var(--text)', fontSize:15, fontFamily:'inherit' }} />
          <button onClick={addToShop} disabled={!newItem.trim() || !shopJob} className="head"
            style={{ padding:'0 16px', borderRadius:8, fontSize:14, fontWeight:700, border:'none',
              background: (newItem.trim() && shopJob) ? 'var(--olive-bright)' : 'var(--line)',
              color: (newItem.trim() && shopJob) ? 'var(--bg)' : 'var(--muted)' }}>ADD</button>
        </div>
        <div className="mono" style={{ fontSize:10, color:'var(--muted)', margin:'6px 0 14px' }}>
          {shopJob ? 'Adds to TMC SHOP' : 'TMC SHOP job not found'}
        </div>
        {groups.length === 0 && (
          <div className="mono" style={{ textAlign:'center', color:'var(--muted)', padding:'40px 0', fontSize:13, letterSpacing:'0.08em' }}>NOTHING NEEDED</div>
        )}
        {groups.map(g => (
          <div key={g.job.id} style={{ marginBottom:14, background:'var(--panel)', border:'1px solid var(--line)', borderRadius:10, padding:'10px 12px' }}>
            <button onClick={() => onOpenJob(g.job.id)} style={{ background:'none', border:'none', padding:0, textAlign:'left', cursor:'pointer', marginBottom:4, width:'100%' }}>
              <div className="head" style={{ fontSize:15, fontWeight:700, color:'var(--text)' }}>{g.job.customer || 'Unknown'}</div>
              <div className="mono" style={{ fontSize:11, color:'var(--muted)' }}>{g.job.type}{siteAddr(g.job) ? ` · ${siteAddr(g.job)}` : ''}</div>
            </button>
            {g.items.map(it => (
              <div key={it._idx} style={{ display:'flex', alignItems:'center', gap:10, padding:'7px 0', borderTop:'1px solid var(--line)' }}>
                <input type="checkbox" checked={false} onChange={() => toggleAcquired(g.job, it._idx)}
                  style={{ width:20, height:20, accentColor:'var(--green)', cursor:'pointer', flexShrink:0 }} />
                <span style={{ fontSize:15, color:'var(--text)' }}>{it.text}</span>
              </div>
            ))}
          </div>
        ))}
      </div>
    </div>
  );
}

function MoveJobSheet({ clockSession, jobs, onMove, onClose, onNewJob }) {
  const currentJobId = clockSession?.jobId;
  const [q, setQ] = useState('');
  const FIELD_DONE = ['Completed/Needs Billing','Billed/Waiting for Payment','Completed/Paid','Closed'];
  const shopJob = (jobs || []).find(j => j.customer?.toUpperCase() === TMC_SHOP_NAME && !FIELD_DONE.includes(j.status));
  const STATUS_PRIORITY = { 'In Progress': 0, 'On Site': 1, 'In Route': 2, 'Scheduled': 3 };
  const openJobs = (jobs || [])
    .filter(j => !FIELD_DONE.includes(j.status) && j.id !== currentJobId && j.customer?.toUpperCase() !== TMC_SHOP_NAME)
    .slice().sort((a, b) => {
      const pa = STATUS_PRIORITY[a.status] ?? 99;
      const pb = STATUS_PRIORITY[b.status] ?? 99;
      if (pa !== pb) return pa - pb;
      return (a.customer || '').localeCompare(b.customer || '');
    });
  const filtered = q
    ? openJobs.filter(j => (j.customer||'').toLowerCase().includes(q.toLowerCase()) || (siteAddr(j)||'').toLowerCase().includes(q.toLowerCase()))
    : openJobs;
  return (
    <Sheet title="IN ROUTE — WHERE TO?" onClose={onClose}>
      <input value={q} onChange={e => setQ(e.target.value)} placeholder="Search jobs…"
        style={{ width:"100%", boxSizing:"border-box", padding:"10px 12px", marginBottom:8,
          borderRadius:8, border:"1px solid var(--line)", background:"var(--bg)",
          color:"var(--text)", fontSize:14, fontFamily:"inherit" }} />
      <button onClick={onNewJob} className="head"
        style={{ width:"100%", padding:"14px 16px", marginBottom:8, borderRadius:9, fontSize:15, fontWeight:700,
          textAlign:"left", background:"var(--olive-bright)", color:"var(--bg)", border:"none" }}>
        + NEW JOB
      </button>
      {shopJob && (
        <button onClick={() => onMove(shopJob.id)} className="head"
          style={{ width:"100%", padding:"14px 16px", marginBottom:8, borderRadius:9, fontSize:15, fontWeight:700,
            textAlign:"left", background:"var(--panel)", border:"1px solid var(--brass)", color:"var(--brass-bright)" }}>
          SHOP
        </button>
      )}
      <div style={{ display:"flex", flexDirection:"column", gap:6, maxHeight:320, overflowY:"auto" }}>
        {filtered.map(j => (
          <button key={j.id} onClick={() => onMove(j.id)} className="head"
            style={{ padding:"12px 14px", borderRadius:8, fontSize:14, fontWeight:700, textAlign:"left",
              background:"var(--panel)", border:"1px solid var(--line)", color:"var(--text)" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
              <span>{j.customer}</span>
              <span className="mono" style={{ fontSize:10, color:"var(--muted)" }}>{j.status}</span>
            </div>
            {j.site_name ? (
              <>
                <div className="mono" style={{ fontSize:11, color:"var(--brass-bright)", marginTop:2 }}>{j.site_name}</div>
                {siteAddr(j) && <div className="mono" style={{ fontSize:10, color:"var(--muted)", marginTop:1 }}>{siteAddr(j)}</div>}
              </>
            ) : (
              siteAddr(j) && <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginTop:2 }}>{siteAddr(j)}</div>
            )}
            {j.original_ask && <div className="mono" style={{ fontSize:11, color:"var(--gold)", marginTop:2, fontWeight:400, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{j.original_ask}</div>}
          </button>
        ))}
        {filtered.length === 0 && <div className="mono" style={{ fontSize:13, color:"var(--muted)", padding:"12px 0" }}>No jobs match</div>}
      </div>
    </Sheet>
  );
}

/* ── CalendarView ──────────────────────────────────────────────────────────── */
// Only jobs with a real scheduled_at ever appear here — a 'Ready to Schedule'/'In Progress'
// job with no date has nowhere valid to sit on a calendar and must not pile onto "today".
const CALENDAR_STATUSES = ['In Progress', 'Scheduled', 'Ready to Schedule'];
function getCalendarJobs(jobs) {
  return (jobs || []).filter(j => CALENDAR_STATUSES.includes(j.status) && j.has_schedule);
}
const CAL_VIEW_KEY = 'tmc_calendar_view_mode';
function getCalendarViewMode() {
  try { return localStorage.getItem(CAL_VIEW_KEY) || 'agenda'; } catch { return 'agenda'; }
}
function setCalendarViewMode(mode) {
  try { localStorage.setItem(CAL_VIEW_KEY, mode); } catch {}
}
// Same overdue/scheduled/neutral formula as StatusPill/JobCard — no new color rule invented.
function calJobColor(j) {
  const overdue = j.status === 'Scheduled' && j.scheduled_date < todayISO();
  const scheduled = j.status === 'Scheduled' && !overdue;
  return overdue ? '#b5432f' : scheduled ? 'var(--green)' : 'var(--muted)';
}
const CAL_DAY_LABEL = iso => new Date(iso + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

// A quick tap/light touch must reliably open the peek popover — a bare distance threshold
// (the old approach) treats ordinary finger jitter as a drag on almost every tap. Instead,
// dragging only "arms" after a deliberate hold; movement before that is what cancels the
// gesture outright (a scroll/swipe attempt, not a tap or a hold).
const CAL_LONGPRESS_MS = 450;   // hold duration before drag mode arms (with a haptic buzz)
const CAL_MOVE_CANCEL_PX = 10;  // movement before arming cancels the gesture entirely

// Draggable (Pointer Events — no HTML5 dragdrop, which barely works on touch) job chip used
// in Month/Week grid cells. Three outcomes: a quick tap opens the peek popover (onPeek); a
// deliberate hold (vibrates once armed) followed by a drag onto a different day offers a
// reschedule (onDragEnd, unchanged); a deliberate hold released in place (no drag) opens an
// inline "move to a date" prompt instead (onLongPressRelease).
function CalendarChip({ job, dateISO, onPeek, onDragEnd, onLongPressRelease }) {
  const dragRef = useRef(null);
  const draggedRef = useRef(false);
  const holdTimerRef = useRef(null);
  const armedRef = useRef(false);
  const cancelledRef = useRef(false);
  const [armed, setArmed] = useState(false);
  function reset() {
    clearTimeout(holdTimerRef.current);
    dragRef.current = null;
    armedRef.current = false;
    cancelledRef.current = false;
    setArmed(false);
  }
  function onPointerDown(e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    dragRef.current = { startX: e.clientX, startY: e.clientY, pointerId: e.pointerId, isMouse: e.pointerType === 'mouse' };
    cancelledRef.current = false;
    armedRef.current = false;
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch {}
    // Mouse click-and-drag is already unambiguous — no long-press needed, arm on first real move instead (below).
    if (e.pointerType !== 'mouse') {
      holdTimerRef.current = setTimeout(() => {
        armedRef.current = true;
        setArmed(true);
        if (navigator.vibrate) navigator.vibrate(25);
      }, CAL_LONGPRESS_MS);
    }
  }
  function onPointerMove(e) {
    const d = dragRef.current;
    if (!d || d.pointerId !== e.pointerId) return;
    if (armedRef.current) return;
    const past = Math.abs(e.clientX - d.startX) > CAL_MOVE_CANCEL_PX || Math.abs(e.clientY - d.startY) > CAL_MOVE_CANCEL_PX;
    if (d.isMouse) { if (past) { armedRef.current = true; setArmed(true); } return; }
    if (past) {
      cancelledRef.current = true;
      clearTimeout(holdTimerRef.current);
    }
  }
  function onPointerUp(e) {
    clearTimeout(holdTimerRef.current);
    const d = dragRef.current;
    dragRef.current = null;
    if (!d || d.pointerId !== e.pointerId) return;
    if (cancelledRef.current) { reset(); return; }
    if (armedRef.current) {
      draggedRef.current = true;
      armedRef.current = false;
      setArmed(false);
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const cell = el && el.closest('[data-cal-date]');
      const overDate = cell ? cell.getAttribute('data-cal-date') : null;
      if (overDate && overDate !== dateISO) onDragEnd(job, overDate);
      else onLongPressRelease(job);
    }
  }
  function onPointerCancel() { reset(); }
  function onClick(e) {
    e.stopPropagation();
    if (draggedRef.current) { draggedRef.current = false; return; }
    onPeek(job);
  }
  const color = calJobColor(job);
  return (
    <div onPointerDown={onPointerDown} onPointerMove={onPointerMove} onPointerUp={onPointerUp} onPointerCancel={onPointerCancel} onClick={onClick}
      className="mono" style={{ fontSize:10, padding:"2px 4px", marginBottom:2, borderRadius:4, cursor: armed ? "grabbing" : "grab",
        background: color+"22", borderLeft:`2px solid ${color}`, color:"var(--text)", touchAction:"none",
        whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis",
        transform: armed ? "scale(1.08)" : "scale(1)", boxShadow: armed ? "0 2px 8px rgba(0,0,0,0.4)" : "none",
        transition: "transform 0.15s, box-shadow 0.15s" }}>
      {fmtTime(job.scheduled_time)} {job.customer}
    </div>
  );
}

// Shared Month/Week day cell — maxShown/minHeight are the only knobs that differ between them.
function CalendarDayCell({ dateISO, dimmed, dayJobs, maxShown, minHeight, onPeek, onDragEnd, onLongPressRelease, onExpand }) {
  const isToday = dateISO === todayLocalISO();
  const shown = dayJobs.slice(0, maxShown);
  const overflow = dayJobs.length - shown.length;
  return (
    <div data-cal-date={dateISO} onClick={() => onExpand(dateISO)}
      style={{ minHeight, minWidth:0, overflow:"hidden", border: isToday ? "1px solid var(--olive-bright)" : "1px solid var(--line)",
        borderRadius:6, padding:4, background:"var(--panel)", opacity: dimmed ? 0.4 : 1, cursor:"pointer" }}>
      <div className="mono" style={{ fontSize:11, marginBottom:2,
        color: isToday ? "var(--olive-bright)" : "var(--muted)", fontWeight: isToday ? 700 : 400 }}>
        {Number(dateISO.slice(8,10))}
      </div>
      {shown.map(j => <CalendarChip key={j.id} job={j} dateISO={dateISO} onPeek={onPeek} onDragEnd={onDragEnd} onLongPressRelease={onLongPressRelease} />)}
      {overflow > 0 && (
        <div onClick={e => { e.stopPropagation(); onExpand(dateISO); }}
          className="mono" style={{ fontSize:9, color:"var(--muted)", marginTop:1, cursor:"pointer" }}>+{overflow} more</div>
      )}
    </div>
  );
}

function CalendarView({ jobs, onClose, onOpenJob, onReschedule, onScheduleJob, onUnschedule }) {
  const [viewMode, setViewMode] = useState(() => getCalendarViewMode());
  const [expandedDay, setExpandedDay] = useState(null);
  const [periodAnchor, setPeriodAnchor] = useState(() => todayLocalISO());
  const [peekJob, setPeekJob] = useState(null);
  const [movePrompt, setMovePrompt] = useState(null); // { job, targetDate } | null — targetDate set only when a drag already picked the day
  const [schedulingDay, setSchedulingDay] = useState(null);
  const [editingTimeId, setEditingTimeId] = useState(null);

  function changeMode(mode) { setViewMode(mode); setCalendarViewMode(mode); }

  const calendarJobs = useMemo(() => getCalendarJobs(jobs), [jobs]);
  const jobsByDate = useMemo(() => {
    const map = {};
    calendarJobs.forEach(j => { (map[j.scheduled_date] = map[j.scheduled_date] || []).push(j); });
    Object.values(map).forEach(list => list.sort((a,b) => (a.scheduled_time||'').localeCompare(b.scheduled_time||'')));
    return map;
  }, [calendarJobs]);

  function pageBy(delta) {
    if (viewMode === 'month') {
      const [y, mo] = periodAnchor.split('-').map(Number);
      const d = new Date(y, mo - 1 + delta, 1);
      setPeriodAnchor(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`);
    } else if (viewMode === 'week') {
      setPeriodAnchor(shiftDateISO(periodAnchor, delta * 7));
    } else {
      setPeriodAnchor(shiftDateISO(periodAnchor, delta * 14));
    }
  }

  const monthGrid = useMemo(() => viewMode === 'month' ? buildMonthGrid(periodAnchor) : [], [viewMode, periodAnchor]);
  const weekDates = useMemo(() => viewMode === 'week' ? buildWeekDates(periodAnchor) : [], [viewMode, periodAnchor]);
  const agendaDays = useMemo(() => {
    if (viewMode !== 'agenda') return [];
    const days = [];
    for (let i = 0; i < 14; i++) days.push(shiftDateISO(periodAnchor, i));
    return days;
  }, [viewMode, periodAnchor]);

  const periodLabel = useMemo(() => {
    const fmtShort = iso => new Date(iso + 'T00:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric' });
    if (viewMode === 'month') {
      const [y, mo] = periodAnchor.split('-').map(Number);
      return new Date(y, mo - 1, 1).toLocaleDateString('en-US', { month:'long', year:'numeric' }).toUpperCase();
    }
    if (viewMode === 'week') {
      const dates = buildWeekDates(periodAnchor);
      return `${fmtShort(dates[0])} – ${fmtShort(dates[6])}`;
    }
    return `${fmtShort(periodAnchor)} – ${fmtShort(shiftDateISO(periodAnchor, 13))}`;
  }, [viewMode, periodAnchor]);

  function handleChipDragEnd(job, targetDate) {
    setMovePrompt({ job, targetDate });
  }

  return (
    <div className="fade-in" style={{ minHeight:'100vh', background:'var(--bg)' }}>
      <div style={{ padding:'18px 16px 14px', borderBottom:'1px solid var(--line)', background:'var(--panel)', position:'sticky', top:0, zIndex:10 }}>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <button onClick={onClose} className="head" style={{ fontSize:22, color:'var(--text)', background:'none', border:'none', padding:'0 6px', cursor:'pointer' }}>‹</button>
          <div className="head" style={{ fontSize:20, fontWeight:700 }}>CALENDAR</div>
        </div>
        <div style={{ display:'flex', gap:8, marginTop:12 }}>
          {['agenda','month','week'].map(m => (
            <button key={m} onClick={() => changeMode(m)} className="head"
              style={{ flex:1, padding:'9px 0', borderRadius:7, fontSize:13, fontWeight:700,
                background: viewMode===m ? 'var(--olive-bright)' : 'var(--panel)',
                color: viewMode===m ? 'var(--bg)' : 'var(--muted)',
                border:`1px solid ${viewMode===m ? 'var(--olive-bright)' : 'var(--line)'}`, cursor:'pointer' }}>
              {m.toUpperCase()}
            </button>
          ))}
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:8, marginTop:12 }}>
          <button onClick={() => pageBy(-1)} className="head"
            style={{ fontSize:16, padding:'4px 12px', background:'var(--panel)', border:'1px solid var(--line)', borderRadius:6, color:'var(--text)', cursor:'pointer' }}>‹</button>
          <div className="mono" style={{ flex:1, textAlign:'center', fontSize:13, color:'var(--text)', letterSpacing:'0.05em' }}>{periodLabel}</div>
          <button onClick={() => pageBy(1)} className="head"
            style={{ fontSize:16, padding:'4px 12px', background:'var(--panel)', border:'1px solid var(--line)', borderRadius:6, color:'var(--text)', cursor:'pointer' }}>›</button>
        </div>
      </div>

      <div style={{ padding:'12px 16px' }}>
        {viewMode === 'month' && (
          <div>
            <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:4, marginBottom:4 }}>
              {['SUN','MON','TUE','WED','THU','FRI','SAT'].map(d => (
                <div key={d} className="mono" style={{ fontSize:10, color:'var(--muted)', textAlign:'center' }}>{d}</div>
              ))}
            </div>
            <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:4 }}>
              {monthGrid.map(cell => (
                <CalendarDayCell key={cell.dateISO} dateISO={cell.dateISO} dimmed={!cell.inCurrentMonth}
                  dayJobs={jobsByDate[cell.dateISO] || []} maxShown={3} minHeight={82}
                  onPeek={setPeekJob} onDragEnd={handleChipDragEnd} onLongPressRelease={(job) => setMovePrompt({ job, targetDate: null })} onExpand={setExpandedDay} />
              ))}
            </div>
          </div>
        )}

        {viewMode === 'week' && (
          <div>
            <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:4, marginBottom:4 }}>
              {weekDates.map(d => (
                <div key={d} className="mono" style={{ fontSize:10, color:'var(--muted)', textAlign:'center' }}>
                  {new Date(d+'T00:00:00').toLocaleDateString('en-US',{weekday:'short'}).toUpperCase()}
                </div>
              ))}
            </div>
            <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:4 }}>
              {weekDates.map(d => (
                <CalendarDayCell key={d} dateISO={d} dimmed={false}
                  dayJobs={jobsByDate[d] || []} maxShown={6} minHeight={220}
                  onPeek={setPeekJob} onDragEnd={handleChipDragEnd} onLongPressRelease={(job) => setMovePrompt({ job, targetDate: null })} onExpand={setExpandedDay} />
              ))}
            </div>
          </div>
        )}

        {viewMode === 'agenda' && (
          <div>
            {agendaDays.map(d => {
              const dayJobs = jobsByDate[d] || [];
              const isToday = d === todayLocalISO();
              return (
                <div key={d} style={{ marginBottom:14 }}>
                  <div className="head" style={{ fontSize:13, fontWeight:700,
                    color: isToday ? 'var(--olive-bright)' : 'var(--text)',
                    borderBottom:'1px solid var(--line)', paddingBottom:6, marginBottom:6 }}>
                    {CAL_DAY_LABEL(d).toUpperCase()}{isToday ? ' · TODAY' : ''}
                  </div>
                  {dayJobs.length === 0 ? (
                    <div className="mono" style={{ fontSize:12, color:'var(--muted)', padding:'4px 0' }}>No jobs</div>
                  ) : dayJobs.map(j => {
                    const color = calJobColor(j);
                    return (
                      <button key={j.id} onClick={() => onOpenJob(j.id)}
                        style={{ display:'flex', alignItems:'center', gap:10, width:'100%', textAlign:'left',
                          padding:'8px 10px', marginBottom:6, background:'var(--panel)', border:'1px solid var(--line)',
                          borderLeft:`3px solid ${color}`, borderRadius:8, cursor:'pointer' }}>
                        <div className="mono" style={{ fontSize:13, color:'var(--brass-bright)', minWidth:70 }}>{fmtTime(j.scheduled_time)}</div>
                        <div className="head" style={{ fontSize:14, color:'var(--text)', flex:1 }}>{j.site_name || j.customer}</div>
                      </button>
                    );
                  })}
                  <button onClick={() => setSchedulingDay(d)} className="mono"
                    style={{ width:'100%', textAlign:'left', padding:'6px 2px', marginTop:2,
                      background:'none', border:'none', color:'var(--olive-bright)', fontSize:12, fontWeight:700, cursor:'pointer' }}>
                    + SCHEDULE JOB
                  </button>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {expandedDay && (
        <Sheet title={CAL_DAY_LABEL(expandedDay).toUpperCase()} onClose={() => setExpandedDay(null)}>
          {(jobsByDate[expandedDay] || []).length === 0 ? (
            <div className="mono" style={{ fontSize:13, color:'var(--muted)', padding:'12px 0' }}>No jobs</div>
          ) : (jobsByDate[expandedDay] || []).map(j => {
            const color = calJobColor(j);
            const editingTime = editingTimeId === j.id;
            return (
              <div key={j.id} style={{ display:'flex', alignItems:'center', gap:8, width:'100%',
                  padding:'10px', marginBottom:8, background:'var(--panel)', border:'1px solid var(--line)',
                  borderLeft:`3px solid ${color}`, borderRadius:8 }}>
                {editingTime ? (
                  <input type="time" autoFocus value={j.scheduled_time || ''}
                    onChange={e => onScheduleJob(j.id, expandedDay, e.target.value)}
                    onBlur={() => setEditingTimeId(null)}
                    className="mono" style={{ minWidth:96, padding:'4px 6px', borderRadius:6,
                      border:'1px solid var(--olive-bright)', background:'var(--bg)', color:'var(--text)', fontSize:13 }} />
                ) : (
                  <button onClick={() => setEditingTimeId(j.id)} className="mono"
                    style={{ minWidth:70, textAlign:'left', background:'none', border:'none',
                      color:'var(--brass-bright)', fontSize:13, cursor:'pointer', padding:0 }}>
                    {fmtTime(j.scheduled_time)} ✎
                  </button>
                )}
                <button onClick={() => { setExpandedDay(null); onOpenJob(j.id); }}
                  style={{ flex:1, textAlign:'left', background:'none', border:'none', cursor:'pointer', padding:0, minWidth:0 }}>
                  <div className="head" style={{ fontSize:14, color:'var(--text)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>
                    {j.site_name || j.customer}
                  </div>
                </button>
                <button onClick={() => setMovePrompt({ job: j, targetDate: null })} title="Move to another day"
                  style={{ background:'none', border:'none', color:'var(--muted)', fontSize:17, cursor:'pointer', padding:'4px 2px' }}>
                  ⇄
                </button>
              </div>
            );
          })}
          <button onClick={() => { setExpandedDay(null); setSchedulingDay(expandedDay); }} className="head"
            style={{ width:'100%', padding:'12px', marginTop: (jobsByDate[expandedDay]||[]).length ? 4 : 0,
              borderRadius:8, fontSize:14, fontWeight:700, background:'var(--olive-bright)', color:'var(--bg)', border:'none', cursor:'pointer' }}>
            + SCHEDULE JOB
          </button>
        </Sheet>
      )}

      {schedulingDay && (
        <ScheduleJobSheet day={schedulingDay} jobs={jobs} onClose={() => setSchedulingDay(null)}
          onSchedule={(jobId, dateISO, time) => { onScheduleJob(jobId, dateISO, time); setSchedulingDay(null); }} />
      )}

      {peekJob && (() => {
        const overdue = peekJob.status === 'Scheduled' && peekJob.scheduled_date < todayISO();
        const scheduled = peekJob.status === 'Scheduled' && !overdue;
        return (
          <Sheet title={(peekJob.site_name || peekJob.customer || 'JOB').toUpperCase()} onClose={() => setPeekJob(null)}>
            <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:10 }}>
              <StatusPill status={peekJob.status} overdue={overdue} scheduled={scheduled} />
              <div className="mono" style={{ fontSize:12, color:'var(--muted)' }}>{peekJob.flow_type}</div>
            </div>
            <div className="mono" style={{ fontSize:13, color:'var(--text)', marginBottom:4 }}>
              {fmtDate(peekJob.scheduled_date)} · {fmtTime(peekJob.scheduled_time)}
            </div>
            {siteAddr(peekJob) && <div className="mono" style={{ fontSize:12, color:'var(--muted)', marginBottom:8 }}>{siteAddr(peekJob)}</div>}
            {peekJob.original_ask && <div style={{ fontSize:13, color:'var(--text)', marginBottom:14 }}>{peekJob.original_ask}</div>}
            <button onClick={() => { const id = peekJob.id; setPeekJob(null); onOpenJob(id); }} className="head"
              style={{ width:'100%', padding:'12px', background:'var(--olive-bright)', color:'var(--bg)', border:'none', borderRadius:8, fontSize:14, fontWeight:700, cursor:'pointer' }}>
              VIEW FULL JOB
            </button>
            <button onClick={() => { const day = peekJob.scheduled_date; setPeekJob(null); setSchedulingDay(day); }} className="head"
              style={{ width:'100%', padding:'12px', marginTop:8, background:'var(--panel)', color:'var(--text)', border:'1px solid var(--line)', borderRadius:8, fontSize:14, fontWeight:700, cursor:'pointer' }}>
              + SCHEDULE JOB FOR THIS DAY
            </button>
            <button onClick={() => { const id = peekJob.id; setPeekJob(null); onUnschedule(id); onOpenJob(id); }} className="head"
              style={{ width:'100%', padding:'12px', marginTop:8, background:'transparent', color:'var(--danger)', border:'1px solid var(--danger)', borderRadius:8, fontSize:14, fontWeight:700, cursor:'pointer' }}>
              REMOVE FROM SCHEDULE
            </button>
          </Sheet>
        );
      })()}

      {movePrompt && (
        <MoveJobPrompt job={movePrompt.job} targetDate={movePrompt.targetDate} onClose={() => setMovePrompt(null)} onReschedule={onReschedule} />
      )}
    </div>
  );
}

// Used both when a drag already picked the target day (targetDate set — date is fixed, only
// TIME is asked) and when initiated without one (long-press-release in place, or the day list's
// ⇄ button — DATE is editable too). Either way this always ends with a time to confirm, never
// silently keeps the job's old time.
function MoveJobPrompt({ job, targetDate, onClose, onReschedule }) {
  const [date, setDate] = useState(targetDate || job.scheduled_date || todayISO());
  const [time, setTime] = useState(job.scheduled_time || nowTimeRounded15());
  return (
    <Sheet title={targetDate ? `MOVE TO ${CAL_DAY_LABEL(targetDate).toUpperCase()}?` : "MOVE JOB?"} onClose={onClose}>
      <div style={{ fontSize:14, color:'var(--text)', marginBottom:12 }}>
        Move <strong>{job.site_name || job.customer}</strong>{targetDate ? '' : ' to a different date?'}
      </div>
      {!targetDate && (
        <>
          <div className="mono" style={{ fontSize:11, color:'var(--muted)', marginBottom:6 }}>DATE</div>
          <input type="date" value={date} min={todayISO()} onChange={e => setDate(e.target.value)}
            className="mono" style={{ width:'100%', padding:'10px', marginBottom:14, background:'var(--panel)', border:'1px solid var(--line)', borderRadius:8, color:'var(--text)', fontSize:14 }} />
        </>
      )}
      <div className="mono" style={{ fontSize:11, color:'var(--muted)', marginBottom:6 }}>TIME</div>
      <input type="time" value={time} onChange={e => setTime(e.target.value)}
        className="mono" style={{ width:'100%', padding:'10px', marginBottom:14, background:'var(--panel)', border:'1px solid var(--line)', borderRadius:8, color:'var(--text)', fontSize:14 }} />
      <div style={{ display:'flex', gap:8 }}>
        <button onClick={onClose} className="head" style={{ flex:1, padding:'12px', background:'var(--panel)', border:'1px solid var(--line)', borderRadius:8, color:'var(--text)', fontSize:14, cursor:'pointer' }}>CANCEL</button>
        <button onClick={() => { onReschedule(job.id, date, time); onClose(); }} className="head" style={{ flex:1, padding:'12px', background:'var(--olive-bright)', border:'none', borderRadius:8, color:'var(--bg)', fontWeight:700, fontSize:14, cursor:'pointer' }}>MOVE</button>
      </div>
    </Sheet>
  );
}

// Picker used by CalendarView's "+ SCHEDULE JOB" — defaults to Ready to Schedule jobs, with a
// toggle to widen to all non-terminal jobs. Time is entered right here (not deferred to Job
// Detail) since scheduling is meant to happen primarily from the Calendar going forward.
const SCHEDULABLE_EXCLUDE_STATUSES = ['Closed', 'Completed/Paid', 'Completed/Needs Billing', 'Billed/Waiting for Payment'];
function ScheduleJobSheet({ day, jobs, onClose, onSchedule }) {
  const [showAll, setShowAll] = useState(false);
  const [q, setQ] = useState('');
  const [time, setTime] = useState(() => nowTimeRounded15());
  const candidates = (jobs || [])
    .filter(j => j.customer?.toUpperCase() !== TMC_SHOP_NAME &&
      (showAll ? !SCHEDULABLE_EXCLUDE_STATUSES.includes(j.status) : j.status === 'Ready to Schedule'))
    .slice().sort((a, b) => (a.customer || '').localeCompare(b.customer || ''));
  const filtered = q
    ? candidates.filter(j => (j.customer||'').toLowerCase().includes(q.toLowerCase()) || (siteAddr(j)||'').toLowerCase().includes(q.toLowerCase()))
    : candidates;
  return (
    <Sheet title={`SCHEDULE FOR ${CAL_DAY_LABEL(day).toUpperCase()}`} onClose={onClose}>
      <div className="mono" style={{ fontSize:11, color:'var(--muted)', marginBottom:6 }}>TIME</div>
      <input type="time" value={time} onChange={e => setTime(e.target.value)}
        style={{ width:'100%', boxSizing:'border-box', padding:'10px 12px', marginBottom:12,
          borderRadius:8, border:'1px solid var(--line)', background:'var(--bg)', color:'var(--text)', fontSize:14, fontFamily:'inherit' }} />
      <div style={{ display:'flex', gap:8, marginBottom:8 }}>
        <button onClick={() => setShowAll(false)} className="head"
          style={{ flex:1, padding:10, borderRadius:8, fontSize:13, fontWeight:700,
            background: !showAll ? 'var(--olive-bright)' : 'var(--panel)',
            color: !showAll ? 'var(--bg)' : 'var(--text)',
            border: !showAll ? 'none' : '1px solid var(--line)', cursor:'pointer' }}>
          READY TO SCHEDULE
        </button>
        <button onClick={() => setShowAll(true)} className="head"
          style={{ flex:1, padding:10, borderRadius:8, fontSize:13, fontWeight:700,
            background: showAll ? 'var(--olive-bright)' : 'var(--panel)',
            color: showAll ? 'var(--bg)' : 'var(--text)',
            border: showAll ? 'none' : '1px solid var(--line)', cursor:'pointer' }}>
          ALL JOBS
        </button>
      </div>
      <input value={q} onChange={e => setQ(e.target.value)} placeholder="Search jobs…"
        style={{ width:'100%', boxSizing:'border-box', padding:'10px 12px', marginBottom:8,
          borderRadius:8, border:'1px solid var(--line)', background:'var(--bg)', color:'var(--text)', fontSize:14, fontFamily:'inherit' }} />
      <div style={{ display:'flex', flexDirection:'column', gap:6, maxHeight:360, overflowY:'auto' }}>
        {filtered.map(j => (
          <button key={j.id} onClick={() => onSchedule(j.id, day, time)} className="head"
            style={{ padding:'12px 14px', borderRadius:8, fontSize:14, fontWeight:700, textAlign:'left',
              background:'var(--panel)', border:'1px solid var(--line)', color:'var(--text)', cursor:'pointer' }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
              <span>{j.site_name || j.customer}</span>
              <span className="mono" style={{ fontSize:10, color:'var(--muted)' }}>{j.status}</span>
            </div>
            {siteAddr(j) && <div className="mono" style={{ fontSize:11, color:'var(--muted)', marginTop:2 }}>{siteAddr(j)}</div>}
            {j.original_ask && <div className="mono" style={{ fontSize:11, color:'var(--gold)', marginTop:2, fontWeight:400, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{j.original_ask}</div>}
          </button>
        ))}
        {filtered.length === 0 && <div className="mono" style={{ fontSize:13, color:'var(--muted)', padding:'12px 0' }}>No jobs match</div>}
      </div>
    </Sheet>
  );
}

/* ── HoursReport ────────────────────────────────────────────────────────────── */
function HoursReport({ jobs, users, onClose, onOpenJobDay, onOpenJob }) {
  const [weekOffset, setWeekOffset] = useState(0);
  const [tab, setTab] = useState('user');
  const [notes, setNotes] = useState([]);
  const [crewRows, setCrewRows] = useState([]);
  const [loading, setLoading] = useState(true);
  const [expandedKeys, setExpandedKeys] = useState(() => new Set());
  const [flagExplain, setFlagExplain] = useState(null); // { dangling, implausible, dayKey? } or { dayLevel: true, dayKey? } — dayKey only set from the BY DAY tab's sub-rows, where there's an actual single day to name
  function toggleExpanded(key) {
    setExpandedKeys(prev => {
      const next = new Set(prev);
      next.has(key) ? next.delete(key) : next.add(key);
      return next;
    });
  }

  const weekStart = useMemo(() => {
    const d = new Date();
    const day = d.getDay();
    d.setDate(d.getDate() - (day === 0 ? 6 : day - 1) + weekOffset * 7);
    d.setHours(0, 0, 0, 0);
    return d;
  }, [weekOffset]);

  const weekEnd = useMemo(() => {
    const d = new Date(weekStart);
    d.setDate(d.getDate() + 7);
    return d;
  }, [weekStart]);

  const weekLabel = useMemo(() => {
    const fmt = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    const endDisplay = new Date(weekEnd); endDisplay.setDate(endDisplay.getDate() - 1);
    return `${fmt(weekStart)} – ${fmt(endDisplay)}`;
  }, [weekStart, weekEnd]);

  useEffect(() => {
    setLoading(true);
    setNotes([]);
    setExpandedKeys(new Set());
    Promise.all([
      sb.from('job_notes')
        .select('id, job_id, content, created_at')
        .eq('source', 'system')
        .gte('created_at', weekStart.toISOString())
        .lt('created_at', weekEnd.toISOString())
        .order('created_at', { ascending: true }),
      // Live crew rows let buildCrewTimeline tell a genuinely-ongoing session (counts to now)
      // from a dangling one with no clock-out recorded (excluded + flagged, never invented).
      sb.from('job_crew').select('job_id, user_id, status'),
    ]).then(([{ data }, { data: crew }]) => {
      setNotes(data || []);
      setCrewRows(crew || []);
      setLoading(false);
    });
  }, [weekStart.getTime()]);

  const { byUser, byJob, byDay, danglingCount } = useMemo(() => {
    const byUser = {};
    const byJob = {};
    const byDay = {};
    let danglingCount = 0;
    const notesByJobId = {};
    notes.forEach(n => {
      if (!notesByJobId[n.job_id]) notesByJobId[n.job_id] = [];
      notesByJobId[n.job_id].push({ id: n.id, content: n.content, at: n.created_at });
    });
    const crewByJobId = {};
    crewRows.forEach(c => { (crewByJobId[c.job_id] = crewByJobId[c.job_id] || []).push(c); });
    // Materials Run/Shop Run periods tagged 'bill:shop' count against the shop job's bucket
    // instead of the job they were physically logged against — see buildCrewTimeline's billTo.
    const shopJob = jobs.find(j => j.customer?.toUpperCase() === TMC_SHOP_NAME && j.status !== 'Closed');
    const weMs = weekEnd.getTime();
    Object.entries(notesByJobId).forEach(([jobId, jobNotes]) => {
      const timeline = buildCrewTimeline(jobNotes, crewByJobId[jobId] || [], users);
      const job = jobs.find(j => j.id === jobId);
      const label = job ? job.customer : 'Unknown';
      Object.entries(timeline).forEach(([userName, periods]) => {
        periods.forEach(p => {
          if (p.dangling) {
            // No clock-out was ever recorded — counting to "now" is how totals got silently
            // inflated. Contribute 0 and flag every aggregate this period touches instead.
            danglingCount++;
            const dayKey = dateISOInTZ(new Date(p.start), getAppTZ());
            if (!byUser[userName]) byUser[userName] = { totalMs: 0, jobs: {} };
            if (!byUser[userName].jobs[jobId]) byUser[userName].jobs[jobId] = { label, totalMs: 0, driveMs: 0, onSiteMs: 0, runMs: 0, periods: [] };
            if (!byJob[jobId]) byJob[jobId] = { label, totalMs: 0, users: {} };
            if (!byJob[jobId].users[userName]) byJob[jobId].users[userName] = { totalMs: 0, driveMs: 0, onSiteMs: 0, runMs: 0, periods: [] };
            if (!byDay[dayKey]) byDay[dayKey] = { totalMs: 0, users: {}, jobs: {} };
            if (!byDay[dayKey].users[userName]) byDay[dayKey].users[userName] = { totalMs: 0, driveMs: 0, onSiteMs: 0, runMs: 0, periods: [] };
            if (!byDay[dayKey].jobs[jobId]) byDay[dayKey].jobs[jobId] = { label, totalMs: 0, driveMs: 0, onSiteMs: 0, runMs: 0, periods: [] };
            byUser[userName].dangling = byUser[userName].jobs[jobId].dangling = true;
            byJob[jobId].dangling = byJob[jobId].users[userName].dangling = true;
            byDay[dayKey].dangling = byDay[dayKey].users[userName].dangling = byDay[dayKey].jobs[jobId].dangling = true;
            byUser[userName].jobs[jobId].periods.push({ ...p });
            byJob[jobId].users[userName].periods.push({ ...p });
            byDay[dayKey].users[userName].periods.push({ ...p, jobLabel: label });
            byDay[dayKey].jobs[jobId].periods.push({ ...p, userName });
            return;
          }
          const endMs = p.end ? new Date(p.end).getTime() : Math.min(Date.now(), weMs);
          const ms = endMs - new Date(p.start).getTime();
          if (ms <= 0) return;
          const isRun = p.status === 'Materials Run' || p.status === 'Shop Run';
          const billShop = isRun && p.billTo === 'shop';
          const jId = billShop ? (shopJob?.id || jobId) : jobId;
          const jLabel = billShop ? (shopJob?.customer || 'TMC SHOP') : label;
          const bucket = p.status === 'In Route' ? 'driveMs' : isRun ? 'runMs' : 'onSiteMs';
          if (!byUser[userName]) byUser[userName] = { totalMs: 0, jobs: {} };
          byUser[userName].totalMs += ms;
          if (!byUser[userName].jobs[jId]) byUser[userName].jobs[jId] = { label: jLabel, totalMs: 0, driveMs: 0, onSiteMs: 0, runMs: 0, periods: [] };
          byUser[userName].jobs[jId].totalMs += ms;
          byUser[userName].jobs[jId][bucket] += ms;
          byUser[userName].jobs[jId].periods.push({ ...p });
          if (!byJob[jId]) byJob[jId] = { label: jLabel, totalMs: 0, users: {} };
          byJob[jId].totalMs += ms;
          if (!byJob[jId].users[userName]) byJob[jId].users[userName] = { totalMs: 0, driveMs: 0, onSiteMs: 0, runMs: 0, periods: [] };
          byJob[jId].users[userName].totalMs += ms;
          byJob[jId].users[userName][bucket] += ms;
          byJob[jId].users[userName].periods.push({ ...p });
          const dayKey = dateISOInTZ(new Date(p.start), getAppTZ());
          if (!byDay[dayKey]) byDay[dayKey] = { totalMs: 0, users: {}, jobs: {} };
          byDay[dayKey].totalMs += ms;
          if (!byDay[dayKey].users[userName]) byDay[dayKey].users[userName] = { totalMs: 0, driveMs: 0, onSiteMs: 0, runMs: 0, periods: [] };
          byDay[dayKey].users[userName].totalMs += ms;
          byDay[dayKey].users[userName][bucket] += ms;
          byDay[dayKey].users[userName].periods.push({ ...p, jobLabel: jLabel });
          if (!byDay[dayKey].jobs[jId]) byDay[dayKey].jobs[jId] = { label: jLabel, totalMs: 0, driveMs: 0, onSiteMs: 0, runMs: 0, periods: [] };
          byDay[dayKey].jobs[jId].totalMs += ms;
          byDay[dayKey].jobs[jId][bucket] += ms;
          byDay[dayKey].jobs[jId].periods.push({ ...p, userName });
        });
      });
    });
    return { byUser, byJob, byDay, danglingCount };
  }, [notes, crewRows, jobs, users, weekEnd]);

  const rowStyle = { marginBottom: 8, background: 'var(--panel)', border: '1px solid var(--line)', borderRadius: 10, overflow: 'hidden' };
  const subRowStyle = (first) => ({ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '7px 0', borderTop: first ? 'none' : '1px solid var(--line)' });
  const IMPLAUSIBLE_DAY_MS = 16 * 3600 * 1000; // one person can't plausibly log more than this in a single day — flags dangling/never-closed sessions
  // Never compare against data.totalMs (a day's combined total across everyone) — two or
  // three techs each having a normal day easily sums past 16h with nothing wrong. Flag only
  // when a SINGLE person's day (or an actual dangling period) crosses the threshold.
  const dayImplausible = data => data.dangling || Object.values(data.users).some(u => u.dangling || u.totalMs > IMPLAUSIBLE_DAY_MS);

  function SubBreakdown({ driveMs, onSiteMs, runMs, totalMs, dangling, implausible, dayKey, onExplain }) {
    const flagged = dangling || implausible;
    const parts = [
      driveMs > 0 && `${fmtElapsed(driveMs)} drive`,
      onSiteMs > 0 && `${fmtElapsed(onSiteMs)} on site`,
      runMs > 0 && `${fmtElapsed(runMs)} run`,
    ].filter(Boolean);
    return (
      <div style={{ textAlign: 'right' }}>
        <div className="mono" style={{ fontSize: 13, fontWeight: 700, color: flagged ? 'var(--danger)' : 'var(--olive-bright)' }}>
          {flagged && (
            <span onClick={e => { e.stopPropagation(); onExplain({ dangling, implausible, dayKey }); }} style={{ cursor: 'pointer' }}>⚠️ </span>
          )}
          {fmtElapsed(totalMs)}
        </div>
        {parts.length > 1 && (
          <div className="mono" style={{ fontSize: 10, color: 'var(--muted)', marginTop: 1 }}>
            {parts.join(' · ')}
          </div>
        )}
      </div>
    );
  }

  const sortedUsers = Object.entries(byUser).sort((a, b) => b[1].totalMs - a[1].totalMs);
  const sortedJobs  = Object.entries(byJob).sort((a, b) => b[1].totalMs - a[1].totalMs);
  const sortedDays  = Object.entries(byDay).sort((a, b) => a[0].localeCompare(b[0]));
  const dayLabel = iso => new Date(iso + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

  return (
    <div className="fade-in" style={{ minHeight: '100vh', background: 'var(--bg)' }}>
      <div style={{ padding: '18px 16px 14px', borderBottom: '1px solid var(--line)', background: 'var(--panel)', position: 'sticky', top: 0, zIndex: 10 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <button onClick={onClose} className="head" style={{ fontSize: 22, color: 'var(--text)', background: 'none', border: 'none', padding: '0 6px', cursor: 'pointer' }}>‹</button>
          <div className="head" style={{ fontSize: 20, fontWeight: 700 }}>HOURS</div>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 12 }}>
          <button onClick={() => setWeekOffset(o => o - 1)} className="head"
            style={{ fontSize: 16, padding: '4px 12px', background: 'var(--panel)', border: '1px solid var(--line)', borderRadius: 6, color: 'var(--text)', cursor: 'pointer' }}>‹</button>
          <div className="mono" style={{ flex: 1, textAlign: 'center', fontSize: 13, color: 'var(--text)', letterSpacing: '0.05em' }}>{weekLabel}</div>
          <button onClick={() => setWeekOffset(o => Math.min(o + 1, 0))} className="head"
            style={{ fontSize: 16, padding: '4px 12px', background: 'var(--panel)', border: '1px solid var(--line)', borderRadius: 6,
              color: weekOffset === 0 ? 'var(--muted)' : 'var(--text)', cursor: weekOffset === 0 ? 'default' : 'pointer',
              opacity: weekOffset === 0 ? 0.4 : 1 }} disabled={weekOffset === 0}>›</button>
        </div>
        <div style={{ display: 'flex', gap: 8, marginTop: 12 }}>
          {['user', 'job', 'day'].map(t => (
            <button key={t} onClick={() => { setTab(t); setExpandedKeys(new Set()); }} className="head"
              style={{ flex: 1, padding: '9px 0', borderRadius: 7, fontSize: 13, fontWeight: 700,
                background: tab === t ? 'var(--olive-bright)' : 'var(--panel)',
                color: tab === t ? 'var(--bg)' : 'var(--muted)',
                border: `1px solid ${tab === t ? 'var(--olive-bright)' : 'var(--line)'}`,
                cursor: 'pointer' }}>
              BY {t === 'user' ? 'TECH' : t === 'job' ? 'JOB' : 'DAY'}
            </button>
          ))}
        </div>
      </div>

      <div style={{ padding: '12px 16px' }}>
        {loading && <div className="mono" style={{ textAlign: 'center', color: 'var(--muted)', padding: '40px 0', fontSize: 13, letterSpacing: '0.1em' }}>LOADING…</div>}

        {!loading && danglingCount > 0 && (
          <div className="mono" style={{ fontSize: 11, color: 'var(--danger)', border: '1px solid var(--danger)', borderRadius: 8,
            padding: '8px 10px', marginBottom: 10, lineHeight: 1.5 }}>
            ⚠️ {danglingCount} period{danglingCount !== 1 ? 's' : ''} with no clock-out recorded — excluded from these totals.
            Open the flagged job's TIME LOG to add the missing end time.
          </div>
        )}

        {!loading && tab === 'user' && (
          sortedUsers.length === 0
            ? <div className="mono" style={{ textAlign: 'center', color: 'var(--muted)', padding: '40px 0', fontSize: 13 }}>No hours logged this week</div>
            : sortedUsers.map(([userName, data]) => (
              <div key={userName} style={rowStyle}>
                <button onClick={() => toggleExpanded(userName)}
                  style={{ width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '13px 14px', background: 'none', border: 'none', cursor: 'pointer' }}>
                  <div className="head" style={{ fontSize: 15, fontWeight: 700, color: 'var(--text)' }}>{userName.toUpperCase()}</div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                    <div className="mono" style={{ fontSize: 15, fontWeight: 700, color: data.dangling ? 'var(--danger)' : 'var(--olive-bright)' }}>
                      {data.dangling && (
                        <span onClick={e => { e.stopPropagation(); setFlagExplain({ dangling: true }); }} style={{ cursor: 'pointer' }}>⚠️ </span>
                      )}
                      {fmtElapsed(data.totalMs)}
                    </div>
                    <span className="mono" style={{ fontSize: 11, color: 'var(--muted)' }}>{expandedKeys.has(userName) ? '▲' : '▼'}</span>
                  </div>
                </button>
                {expandedKeys.has(userName) && (
                  <div style={{ borderTop: '1px solid var(--line)', padding: '6px 14px 12px' }}>
                    {Object.entries(data.jobs).sort((a, b) => b[1].totalMs - a[1].totalMs).map(([jobId, jd], i) => (
                      <div key={jobId} style={{ ...subRowStyle(i === 0), flexDirection: 'column', alignItems: 'stretch' }}>
                        <button onClick={() => onOpenJob && onOpenJob(jobId)}
                          style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', width: '100%', textAlign: 'left', background: 'none', border: 'none', padding: 0, cursor: 'pointer' }}>
                          <div className="head" style={{ fontSize: 13, color: 'var(--text)', flex: 1, paddingRight: 10 }}>{jd.label}</div>
                          <SubBreakdown driveMs={jd.driveMs} onSiteMs={jd.onSiteMs} runMs={jd.runMs} totalMs={jd.totalMs} dangling={jd.dangling} onExplain={setFlagExplain} />
                        </button>
                        {(jd.periods || []).length > 0 && (
                          <div style={{ marginTop: 6 }}>
                            {jd.periods.slice().sort((a, b) => new Date(a.start) - new Date(b.start)).map((p, pi) => (
                              <div key={pi} className="mono" style={{ fontSize: 11, color: p.dangling ? 'var(--danger)' : 'var(--muted)', marginTop: 2 }}>
                                {p.status}: {fmtTimestamp(p.start)} – {p.ongoing ? 'ongoing' : (p.end ? fmtPeriodEnd(p.start, p.end) : '⚠️ NO CLOCK-OUT')}
                                {(p.end || p.ongoing) && ` (${fmtElapsed((p.end ? new Date(p.end) : new Date()) - new Date(p.start))})`}
                                {p.billTo && ` — billed to ${p.billTo === 'shop' ? 'shop' : 'this job'}`}
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ))
        )}

        {!loading && tab === 'job' && (
          sortedJobs.length === 0
            ? <div className="mono" style={{ textAlign: 'center', color: 'var(--muted)', padding: '40px 0', fontSize: 13 }}>No hours logged this week</div>
            : sortedJobs.map(([jobId, data]) => (
              <div key={jobId} style={rowStyle}>
                <button onClick={() => toggleExpanded(jobId)}
                  style={{ width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '13px 14px', background: 'none', border: 'none', cursor: 'pointer' }}>
                  <div style={{ textAlign: 'left' }}>
                    <div className="head" style={{ fontSize: 15, fontWeight: 700, color: 'var(--text)' }}>{data.label}</div>
                    <div className="mono" style={{ fontSize: 10, color: 'var(--muted)', marginTop: 2 }}>
                      {Object.keys(data.users).length} TECH{Object.keys(data.users).length !== 1 ? 'S' : ''}
                    </div>
                  </div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                    <div className="mono" style={{ fontSize: 15, fontWeight: 700, color: data.dangling ? 'var(--danger)' : 'var(--olive-bright)' }}>
                      {data.dangling && (
                        <span onClick={e => { e.stopPropagation(); setFlagExplain({ dangling: true }); }} style={{ cursor: 'pointer' }}>⚠️ </span>
                      )}
                      {fmtElapsed(data.totalMs)}
                    </div>
                    <span className="mono" style={{ fontSize: 11, color: 'var(--muted)' }}>{expandedKeys.has(jobId) ? '▲' : '▼'}</span>
                  </div>
                </button>
                {expandedKeys.has(jobId) && (
                  <div style={{ borderTop: '1px solid var(--line)', padding: '6px 14px 12px' }}>
                    {Object.entries(data.users).sort((a, b) => b[1].totalMs - a[1].totalMs).map(([uName, ud], i) => (
                      <div key={uName} style={{ ...subRowStyle(i === 0), flexDirection: 'column', alignItems: 'stretch' }}>
                        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                          <div className="head" style={{ fontSize: 13, color: 'var(--text)' }}>{uName}</div>
                          <SubBreakdown driveMs={ud.driveMs} onSiteMs={ud.onSiteMs} runMs={ud.runMs} totalMs={ud.totalMs} dangling={ud.dangling} onExplain={setFlagExplain} />
                        </div>
                        {(ud.periods || []).length > 0 && (
                          <div style={{ marginTop: 6 }}>
                            {ud.periods.slice().sort((a, b) => new Date(a.start) - new Date(b.start)).map((p, pi) => (
                              <div key={pi} className="mono" style={{ fontSize: 11, color: p.dangling ? 'var(--danger)' : 'var(--muted)', marginTop: 2 }}>
                                {p.status}: {fmtTimestamp(p.start)} – {p.ongoing ? 'ongoing' : (p.end ? fmtPeriodEnd(p.start, p.end) : '⚠️ NO CLOCK-OUT')}
                                {(p.end || p.ongoing) && ` (${fmtElapsed((p.end ? new Date(p.end) : new Date()) - new Date(p.start))})`}
                                {p.billTo && ` — billed to ${p.billTo === 'shop' ? 'shop' : 'this job'}`}
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ))
        )}

        {!loading && tab === 'day' && (
          sortedDays.length === 0
            ? <div className="mono" style={{ textAlign: 'center', color: 'var(--muted)', padding: '40px 0', fontSize: 13 }}>No hours logged this week</div>
            : sortedDays.map(([dayKey, data]) => (
              <div key={dayKey} style={rowStyle}>
                <button onClick={() => toggleExpanded(dayKey)}
                  style={{ width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '13px 14px', background: 'none', border: 'none', cursor: 'pointer' }}>
                  <div className="head" style={{ fontSize: 15, fontWeight: 700, color: 'var(--text)' }}>{dayLabel(dayKey).toUpperCase()}</div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                    <div className="mono" style={{ fontSize: 15, fontWeight: 700, color: dayImplausible(data) ? 'var(--danger)' : 'var(--olive-bright)' }}>
                      {dayImplausible(data) && (
                        <span onClick={e => { e.stopPropagation(); setFlagExplain({ dayLevel: true, dayKey }); }} style={{ cursor: 'pointer' }}>⚠️ </span>
                      )}
                      {fmtElapsed(data.totalMs)}
                    </div>

                                {(p.end || p.ongoing) && ` (${fmtElapsed((p.end ? new Date(p.end) : new Date()) - new Date(p.start))})`}

                    {Object.entries(data.jobs).sort((a, b) => b[1].totalMs - a[1].totalMs).map(([jobId, jd], i) => (
                      <div key={jobId} style={{ ...subRowStyle(i === 0), flexDirection: 'column', alignItems: 'stretch' }}>

                        </button>
                        {(jd.periods || []).length > 0 && (
                          <div style={{ marginTop: 6 }}>
                            {jd.periods.slice().sort((a, b) => new Date(a.start) - new Date(b.start)).map((p, pi) => (
                              <div key={pi} className="mono" style={{ fontSize: 11, color: p.dangling ? 'var(--danger)' : 'var(--muted)', marginTop: 2 }}>

                                {(p.end || p.ongoing) && ` (${fmtElapsed((p.end ? new Date(p.end) : new Date()) - new Date(p.start))})`}
                                {p.billTo && ` — billed to ${p.billTo === 'shop' ? 'shop' : 'this job'}`}
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ))

      </div>

      {flagExplain && (
        <Sheet title="WHY FLAGGED?" onClose={() => setFlagExplain(null)}>
          <div className="mono" style={{ fontSize: 14, lineHeight: 1.6, color: 'var(--text)' }}>

              <div className="head" style={{ fontSize: 15, fontWeight: 700, color: 'var(--olive-bright)', marginBottom: 10 }}>

              <div>This day has at least one flagged issue below — either a missing clock-out or one person's total running over 16 hours. Expand this day to see which tech or job it is.</div>

              <div style={{ marginBottom: flagExplain.implausible ? 10 : 0 }}>One or more time periods here have no clock-out recorded, so they're excluded from this total. Open the job's TIME LOG to add the missing end time.</div>
            )}

              <div>This total is over 16 hours for one person in a single day — unusually high. Check the TIME LOG for {flagExplain.dayKey ? 'that day' : 'the relevant day'} for a bad or overlapping entry.</div>

        </Sheet>
      )}
    </div>
  );
}

/* ── BalancesScreen ────────────────────────────────────────────────────────── */
function BalancesScreen({ jobs, onClose, onOpenJob }) {
  const [expandedKeys, setExpandedKeys] = useState(() => new Set());
  function toggleExpanded(key) {
    setExpandedKeys(prev => {
      const next = new Set(prev);
      next.has(key) ? next.delete(key) : next.add(key);
      return next;
    });
  }

  const isActive = s => s !== "Completed/Paid" && s !== "Closed";

  const categories = useMemo(() => {
    const buckets = {
      approval: { label: 'WAITING ON APPROVAL', jobs: [] },
      needsBilling: { label: 'COMPLETED — NEEDS BILLING', jobs: [] },
      billed: { label: 'BILLED — WAITING FOR PAYMENT', jobs: [] },
      active: { label: 'SCHEDULED / ACTIVE WORK', jobs: [] },
    };
    (jobs || []).forEach(j => {
      if (!isActive(j.status)) return;
      if (j.status === 'Waiting on Approval') buckets.approval.jobs.push(j);
      else if (j.status === 'Completed/Needs Billing') buckets.needsBilling.jobs.push(j);
      else if (j.status === 'Billed/Waiting for Payment') buckets.billed.jobs.push(j);
      else buckets.active.jobs.push(j);
    });
    Object.values(buckets).forEach(b => {
      b.jobs.sort((a, b2) => Number(b2.value||0) - Number(a.value||0));
      b.total = b.jobs.reduce((s, j) => s + jobBalance(j), 0);
    });
    return buckets;
  }, [jobs]);
  const CATEGORY_ORDER = ['approval', 'needsBilling', 'billed', 'active'];

  // Collected (Completed/Paid) in a date range — separate from the outstanding total above.
  const [fromDate, setFromDate] = useState(() => todayLocalISO().slice(0, 7) + '-01');
  const [toDate, setToDate] = useState(() => todayLocalISO());
  const [paidNotes, setPaidNotes] = useState([]);
  const [collectedLoading, setCollectedLoading] = useState(true);

  useEffect(() => {
    setCollectedLoading(true);
    const fromIso = zonedWallToISO(fromDate, '00:00');
    const toIso = zonedWallToISO(shiftDateISO(toDate, 1), '00:00');
    sb.from('job_notes')
      .select('id, job_id, content, created_at')
      .eq('source', 'system')
      .gte('created_at', fromIso)
      .lt('created_at', toIso)
      .order('created_at', { ascending: true })
      .then(({ data }) => { setPaidNotes(data || []); setCollectedLoading(false); });
  }, [fromDate, toDate]);

  const collected = useMemo(() => {
    const seenJobIds = new Set();
    const rows = [];
    (paidNotes || []).forEach(n => {
      // Both formats: 'Job status → X (Name)' (r205+) and legacy 'Status → X (Name)' / 'Status → X'.
      const m = (n.content || '').match(/^(?:Job status|Status) → (.+?)(?: \(|$)/);
      if (!m || m[1] !== 'Completed/Paid') return;
      if (seenJobIds.has(n.job_id)) return; // a job can flicker through the status more than once — count it once
      const job = (jobs || []).find(j => j.id === n.job_id);
      if (!job) return;
      seenJobIds.add(n.job_id);
      rows.push({ job, at: n.created_at });
    });
    rows.sort((a, b) => Number(b.job.value||0) - Number(a.job.value||0));
    const total = rows.reduce((s, r) => s + Number(r.job.value||0), 0);
    return { rows, total };
  }, [paidNotes, jobs]);

  const rowStyle = { marginBottom: 8, background: 'var(--panel)', border: '1px solid var(--line)', borderRadius: 10, overflow: 'hidden' };
  const subRowStyle = (first) => ({ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '7px 0', borderTop: first ? 'none' : '1px solid var(--line)' });

  function JobRow({ j, first, dateLabel, amount }) {
    const shown = amount ?? j.value;
    return (
      <button onClick={() => onOpenJob(j.id)} style={{ ...subRowStyle(first), width: '100%', textAlign: 'left' }}>
        <div style={{ flex: 1, paddingRight: 10 }}>
          {j.site_name ? (
            <>
              <div className="head" style={{ fontSize: 13, color: 'var(--text)' }}>{j.site_name}</div>
              <div className="mono" style={{ fontSize: 10, color: 'var(--muted)', marginTop: 1 }}>{j.customer}</div>
            </>
          ) : (
            <div className="head" style={{ fontSize: 13, color: 'var(--text)' }}>{j.customer}</div>
          )}
          {dateLabel && <div className="mono" style={{ fontSize: 10, color: 'var(--muted)', marginTop: 1 }}>{dateLabel}</div>}
          {shown !== j.value && (
            <div className="mono" style={{ fontSize: 10, color: 'var(--muted)', marginTop: 1 }}>
              value {money(j.value)} − deposit {money(j.deposit_amount)}
            </div>
          )}
        </div>
        <div className="mono" style={{ fontSize: 13, fontWeight: 700, color: 'var(--olive-bright)' }}>{money(shown)}</div>
      </button>
    );
  }

  return (
    <div className="fade-in" style={{ minHeight: '100vh', background: 'var(--bg)' }}>
      <div style={{ padding: '18px 16px 14px', borderBottom: '1px solid var(--line)', background: 'var(--panel)', position: 'sticky', top: 0, zIndex: 10 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <button onClick={onClose} className="head" style={{ fontSize: 22, color: 'var(--text)', background: 'none', border: 'none', padding: '0 6px', cursor: 'pointer' }}>‹</button>
          <div className="head" style={{ fontSize: 20, fontWeight: 700 }}>BALANCES</div>
        </div>
      </div>

      <div style={{ padding: '12px 16px' }}>
        {CATEGORY_ORDER.map(key => {
          const cat = categories[key];
          if (cat.jobs.length === 0) return null;
          return (
            <div key={key} style={rowStyle}>
              <button onClick={() => toggleExpanded(key)}
                style={{ width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '13px 14px', background: 'none', border: 'none', cursor: 'pointer' }}>
                <div style={{ textAlign: 'left' }}>
                  <div className="head" style={{ fontSize: 15, fontWeight: 700, color: 'var(--text)' }}>{cat.label}</div>
                  <div className="mono" style={{ fontSize: 10, color: 'var(--muted)', marginTop: 2 }}>
                    {cat.jobs.length} JOB{cat.jobs.length !== 1 ? 'S' : ''}
                  </div>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                  <div className="mono" style={{ fontSize: 15, fontWeight: 700, color: 'var(--olive-bright)' }}>{money(cat.total)}</div>
                  <span className="mono" style={{ fontSize: 11, color: 'var(--muted)' }}>{expandedKeys.has(key) ? '▲' : '▼'}</span>
                </div>
              </button>
              {expandedKeys.has(key) && (
                <div style={{ borderTop: '1px solid var(--line)', padding: '6px 14px 12px' }}>
                  {cat.jobs.map((j, i) => <JobRow key={j.id} j={j} first={i === 0} amount={jobBalance(j)} />)}
                </div>
              )}
            </div>
          );
        })}

        {CATEGORY_ORDER.every(key => categories[key].jobs.length === 0) && (
          <div className="mono" style={{ textAlign: 'center', color: 'var(--muted)', padding: '30px 0', fontSize: 13 }}>No outstanding balances</div>
        )}

        <div style={{ marginTop: 24, marginBottom: 8 }}>
          <div className="mono" style={{ fontSize: 11, color: 'var(--brass-bright)', letterSpacing: '0.08em', marginBottom: 8 }}>COLLECTED</div>
          <div style={{ display: 'flex', gap: 8, marginBottom: 10 }}>
            <div style={{ flex: 1 }}>
              <div className="mono" style={{ fontSize: 10, color: 'var(--muted)', marginBottom: 4 }}>FROM</div>
              <input type="date" value={fromDate} onChange={e => setFromDate(e.target.value)} className="mono"
                style={{ width: '100%', boxSizing: 'border-box', fontSize: 12, padding: '6px 8px' }} />
            </div>
            <div style={{ flex: 1 }}>
              <div className="mono" style={{ fontSize: 10, color: 'var(--muted)', marginBottom: 4 }}>TO</div>
              <input type="date" value={toDate} onChange={e => setToDate(e.target.value)} className="mono"
                style={{ width: '100%', boxSizing: 'border-box', fontSize: 12, padding: '6px 8px' }} />
            </div>
          </div>
          <div style={rowStyle}>
            <div style={{ padding: '13px 14px', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <div className="head" style={{ fontSize: 15, fontWeight: 700, color: 'var(--text)' }}>TOTAL COLLECTED</div>
              <div className="mono" style={{ fontSize: 17, fontWeight: 700, color: 'var(--green)' }}>{collectedLoading ? '…' : money(collected.total)}</div>
            </div>
            {!collectedLoading && collected.rows.length > 0 && (
              <div style={{ borderTop: '1px solid var(--line)', padding: '6px 14px 12px' }}>
                {collected.rows.map((r, i) => (
                  <JobRow key={r.job.id} j={r.job} first={i === 0} dateLabel={fmtTimestamp(r.at)} />
                ))}
              </div>
            )}
            {!collectedLoading && collected.rows.length === 0 && (
              <div className="mono" style={{ fontSize: 12, color: 'var(--muted)', padding: '0 14px 14px' }}>No payments recorded in this range</div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

  const [joiningOnSiteCheck, setJoiningOnSiteCheck] = useState(null); // { members:[user], jobId }

  const [fieldTimeConfirm, setFieldTimeConfirm] = useState(null); // { type:'clockIn'|'moveJob'|'flipOnSite'|'clockOut'|'pause'|'resume', jobId?, status?, showDate? }
  const [fieldConfirmTime, setFieldConfirmTime] = useState(() => nowTimeHHMM());
