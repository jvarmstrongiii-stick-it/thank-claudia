// Calendar grid builders. These only ever walk already-resolved 'YYYY-MM-DD' day keys
// (never a raw instant) via local Date arithmetic, same trick as shiftDateISO above —
// an instant's calendar day still MUST go through dateISOInTZ elsewhere; these just lay
// out a grid of days that are already known.
function buildMonthGrid(anchorISO) {
  const [y, mo] = anchorISO.split('-').map(Number);
  const firstOfMonth = new Date(y, mo - 1, 1);
  const gridStart = new Date(y, mo - 1, 1 - firstOfMonth.getDay());
  const pad = n => String(n).padStart(2, "0");
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
    cells.push({
      dateISO: `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,
      inCurrentMonth: d.getMonth() === mo - 1,
    });
  }
  return cells;
}
function buildWeekDates(anchorISO) {
  const [y, mo, da] = anchorISO.split('-').map(Number);
  const anchor = new Date(y, mo - 1, da);
  const weekStart = new Date(y, mo - 1, da - anchor.getDay());
  const pad = n => String(n).padStart(2, "0");
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() + i);
    days.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`);
  }
  return days;
}

function warrantyStatus(eq) {
  if (eq.warranty_registered) {
    if (eq.install_date) {
      const exp = new Date(eq.install_date + 'T12:00:00');
      exp.setFullYear(exp.getFullYear() + 12);
      return { type:'registered', expires: exp.toISOString().split('T')[0] };
    }
    return { type:'registered', expires:null };
  }
  if (!eq.install_date) return { type:'untracked' };
  const deadline = new Date(eq.install_date + 'T12:00:00');
  deadline.setDate(deadline.getDate() + 60);
  const today = new Date(); today.setHours(0,0,0,0);
  const daysLeft = Math.ceil((deadline - today) / 86400000);
  if (daysLeft < 0) return { type:'lapsed', deadline: deadline.toISOString().split('T')[0] };
  if (daysLeft <= 14) return { type:'urgent', daysLeft, deadline: deadline.toISOString().split('T')[0] };
  return { type:'pending', daysLeft, deadline: deadline.toISOString().split('T')[0] };
}

// Deterministic capacity-code table for split-system condensers/heat pumps — model number
// digit groups are fixed by manufacturer convention, unlike tonnage which the vision model
// derives via mental arithmetic and sometimes gets wrong even when the model # OCR'd correctly.
const CAPACITY_CODE_TO_TON = {
  '018':'1.5', '024':'2', '030':'2.5', '036':'3', '042':'3.5', '048':'4',
  '054':'4.5', '060':'5', '072':'6', '090':'7.5', '102':'8.5', '120':'10',
  '150':'12.5', '180':'15', '210':'17.5', '240':'20',
};
// Goodman/Amana/Daikin condenser & heat pump model format: PREFIX + 2-digit SEER + 3-digit capacity code
const CAPACITY_MODEL_PREFIX_RE = /^(?:GSX|SSX|GSZ|SSZ|DSZC|DSXC|ASX|ASZ|GSXC|SSXC)\d{2}(\d{3})/;

function deriveTonnageFromModel(modelNumber) {
  if (!modelNumber) return null;
  const m = String(modelNumber).toUpperCase().replace(/[^A-Z0-9]/g, '');
  const match = m.match(CAPACITY_MODEL_PREFIX_RE);
  if (!match) return null;
  const code = match[1];
  const tons = CAPACITY_CODE_TO_TON[code];
  if (!tons) return null;
  return `${tons} ton (${(Number(code) * 1000).toLocaleString()} BTU)`;
}

// Overrides the vision model's tonnage guess with a deterministic decode whenever the
// model number matches a known capacity-coded prefix — the model # OCR is reliable,
// the mental-math decode of it is not (see CLAUDE.md gotcha: r216 wrong-tonnage scans).
function finalizeScanResult(result) {
  const derived = deriveTonnageFromModel(result.model_number);
  if (derived) result.tonnage = derived;
  return result;
}

async function readFileForScan(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('File read failed'));
    reader.onload = (e) => {
      const dataUrl = e.target.result;
      const match = dataUrl.match(/^data:([^;]+);base64,(.+)$/);
      if (!match) { reject(new Error('Invalid image data')); return; }
      const rawType = match[1];
      const b64 = match[2];
      const mediaType = ['image/jpeg','image/png','image/gif','image/webp'].includes(rawType) ? rawType : 'image/jpeg';
      resolve({ b64, mediaType });
    };
    reader.readAsDataURL(file);
  });
}

// OCR a purchase/parts receipt → { vendor, amount, date }
// Vendor names haiku is prone to confusing with a visually/product-similar competitor
// (e.g. Home Depot read as Lowe's) — verified against the literal transcribed header text
// rather than trusting the model's own categorical guess. See CLAUDE.md r216 (tonnage) for
// the same underlying lesson applied to a different field.
const VENDOR_SIGNATURES = [
  { match: /how doers get more done|home depot|pro ?xtra/i, vendor: 'Home Depot' },
  { match: /lowe'?s/i, vendor: "Lowe's" },
];
function finalizeReceiptResult(result) {
  const hay = `${result.raw_header || ''} ${result.vendor || ''}`;
  const hit = VENDOR_SIGNATURES.find(v => v.match.test(hay));
  if (hit) result.vendor = hit.vendor;
  delete result.raw_header; // internal verification field only — never shown or saved
  return result;
}

const RECEIPT_SCAN_PROMPT = 'You are reading a photo of a purchase/parts receipt (e.g. a supply house, hardware store, or gas station). For the vendor, transcribe the exact store name as printed in the header/logo area character-by-character — do NOT infer or guess the store from the type of items purchased or the receipt\'s visual layout/style, since similar-looking hardware stores (e.g. Home Depot vs Lowe\'s) sell overlapping products and are easy to confuse if you are not reading the actual printed name. Also extract the GRAND TOTAL actually paid (the final total including tax, not a subtotal or any single line item). Reply with ONLY a JSON object using these exact keys (null if not clearly visible): {"vendor":null,"amount":null,"date":null,"raw_header":null}. "amount" must be a number with no currency symbol or commas (e.g. 142.87). "date" as YYYY-MM-DD if a purchase date is printed, else null. "raw_header" is the literal first 1-2 printed lines of the receipt (store name plus any slogan/tagline), verbatim, for verification.';

}

async function fetchJobCrew(jobId) {
  const { data, error } = await sb.from('job_crew').select('*').eq('job_id', jobId);
  if (error) { console.warn('fetchJobCrew error', error.message || error); return []; }
  return data || [];
}

// statusAt: pass the user's CONFIRMED time (fieldTimeConfirm rewind) so CREW STATUS shows
// the real transition time, not the moment the button was tapped. Defaults to now.
// lastJobCrewError: set on failure so callers can surface the real DB error instead of a
// generic "check connection" toast (e.g. a stale CHECK constraint rejecting a new status
// value) — read it synchronously right after awaiting this call, before any other crew
// update can interleave and overwrite it.
let lastJobCrewError = null;
async function upsertJobCrewStatus(jobId, userId, status, statusAt = new Date().toISOString()) {
  lastJobCrewError = null;
  const { data, error } = await sb.from('job_crew')
    .upsert({ job_id: jobId, user_id: userId, status, status_at: statusAt }, { onConflict: 'job_id,user_id' })
    .select().single();
  if (error) { lastJobCrewError = error; console.warn('upsertJobCrewStatus error', error.message || error); return null; }
  return data;
}

async function clearJobCrewStatus(jobId, userId) {
  const { error } = await sb.from('job_crew').delete().eq('job_id', jobId).eq('user_id', userId);
  if (error) console.warn('clearJobCrewStatus error', error.message || error);
  return error;
}

// Ends a person's presence on a job: clears the live crew row AND writes the closing
// "Status → Cleared" note in one step. Every path that ends someone's time on a job MUST go
// through this — a bare clearJobCrewStatus leaves a timeline period that never closes.
// (Allowed exceptions: undoClockAction, which deletes the period's start note instead, and
// deleteLogPeriod, which is removing the period entirely.)
// Returns { error } if the clear failed, else { note } — the inserted job_notes row
// (content always present) for appending to local crewLog state.
async function clearCrewWithNote(jobId, userId, personName, at, suffix = '', actorId = null) {
  const error = await clearJobCrewStatus(jobId, userId);
  if (error) return { error };
  const content = `Status → Cleared (${personName})${suffix}`;
  const { data } = await sb.from('job_notes').insert({
    job_id: jobId, content, source: 'system', created_at: at, user_id: actorId,
  }).select().single();
  return { note: data || { content } };
}

}

/* ── Clock session helpers ─────────────────────────────────────────────────── */
function loadClockSession(userId) {
  if (!userId) return null;
  try { return JSON.parse(localStorage.getItem(clockKey(userId))); } catch { return null; }
}
function saveClockSession(userId, session) {
  if (!userId) return;
  if (session) localStorage.setItem(clockKey(userId), JSON.stringify(session));
  else localStorage.removeItem(clockKey(userId));
}
function getTodayMs(userId) {
  if (!userId) return 0;
  try {
    const d = JSON.parse(localStorage.getItem(clockTodayKey(userId)));
    if (!d || d.date !== todayLocalISO()) return 0;
    return d.totalMs || 0;
  } catch { return 0; }
}
function addTodayMs(userId, ms) {
  if (!userId) return;
  const capped = Math.min(Math.max(0, ms), 16 * 3600000); // sanity cap: 0–16h per session leg
  const prev = getTodayMs(userId);
  localStorage.setItem(clockTodayKey(userId), JSON.stringify({ date: todayLocalISO(), totalMs: prev + capped }));
}

function StatusPill({ status, overdue, scheduled }) {
  const c = overdue ? "#b5432f" : scheduled ? "var(--green)" : "var(--muted)";
  return (
    <span className="head" style={{
      fontSize:11, fontWeight:600, padding:"4px 9px", borderRadius:5,
      border:`1px solid ${c}`, color:c, background: (overdue || scheduled) ? c+"18" : "transparent", whiteSpace:"nowrap",
    }}>{status}</span>
  );
}

function Toast({ msg, isError }) {
  return (
    <div style={{
      position:"fixed", bottom:90, left:"50%", transform:"translateX(-50%)",
      background: isError ? "#5c1a0f" : "var(--panel-2)",
      border:`1px solid ${isError ? "var(--danger)" : "var(--olive)"}`,

function PassphraseGate({ onAuthorize }) {
  const [value, setValue] = useState('');
  const [error, setError] = useState(false);
  const [shake, setShake] = useState(false);

  function attempt() {
    if (value.trim() === DEVICE_PASSPHRASE) {

      setShake(true);
      setValue('');
      setTimeout(() => setShake(false), 600);

  return (

/* ── Clock components ──────────────────────────────────────────────────────── */
function ClockTimer({ startedAt, todayMs, paused }) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);
  // While paused the live leg contributes nothing — the total freezes at the banked amount.
  const legMs = paused ? 0 : Math.max(0, now - new Date(startedAt).getTime());
  const safeLegMs = Math.min(legMs, 16 * 3600000); // cap single leg at 16h
  const total = (todayMs || 0) + safeLegMs;
  const h = Math.floor(total / 3600000);
  const m = Math.floor((total % 3600000) / 60000);
  return (
    <span className="mono" style={{ fontSize:12, color: paused ? "var(--gold)" : "var(--olive-bright)", fontWeight:700 }}>
      {paused && '⏸ '}{h}:{String(m).padStart(2,'0')}
    </span>
  );
}

// Pause-reason picker: pausing stops the clock (period closes, daily total freezes)
// without clocking out — the session and crew row stay alive as 'Paused'.
// Reasons that count as real logged time (not a zero-counted break) — picking one of
// these asks a follow-up "bill to job or shop" question before confirming.
const PAID_PAUSE_REASONS = Object.keys(PAUSE_STATUS_MAP);
function PauseSheet({ onPick, onClose }) {
  const [other, setOther] = useState('');
  const [billStep, setBillStep] = useState(null); // reason awaiting a bill-to answer
  const opts = [
    ['🥪', 'LUNCH', 'lunch'],
    ['🧰', 'GETTING MATERIALS', 'getting materials'],
    ['🏬', 'SHOP RUN', 'shop run'],
    ['🚻', 'WASHY WASHY', 'washy washy'],
  ];
  function pick(reason) {
    if (PAID_PAUSE_REASONS.includes(reason)) setBillStep(reason);
    else onPick(reason, null);
  }
  if (billStep) return (
    <Sheet title="BILL THIS TIME TO" onClose={onClose}>
      <button onClick={() => setBillStep(null)} className="mono"
        style={{ fontSize:13, color:"var(--muted)", background:"none", border:"none", padding:0, marginBottom:14, cursor:"pointer" }}>
        ‹ back
      </button>
      <div className="mono" style={{ fontSize:13, color:"var(--muted)", marginBottom:14 }}>
        This counts as logged time — who pays for it?
      </div>
      <button onClick={() => onPick(billStep, 'job')} className="head"
        style={{ width:"100%", padding:16, marginBottom:10, fontSize:15, fontWeight:700, borderRadius:10,
          background:"var(--panel)", border:"1px solid var(--line)", color:"var(--text)", textAlign:"left" }}>
        🔧 THIS JOB
      </button>
      <button onClick={() => onPick(billStep, 'shop')} className="head"
        style={{ width:"100%", padding:16, fontSize:15, fontWeight:700, borderRadius:10,
          background:"var(--panel)", border:"1px solid var(--line)", color:"var(--text)", textAlign:"left" }}>
        🏬 THE SHOP
      </button>
    </Sheet>
  );
  return (
    <Sheet title="PAUSE THE CLOCK" onClose={onClose}>
      <div className="mono" style={{ fontSize:13, color:"var(--muted)", marginBottom:14 }}>
        Time stops until you resume — what's the break for?
      </div>
      {opts.map(([icon, label, val]) => (
        <button key={val} onClick={() => pick(val)} className="head"
          style={{ width:"100%", padding:14, marginBottom:10, fontSize:15, fontWeight:700, borderRadius:10,
            background:"var(--panel)", border:"1px solid var(--line)", color:"var(--text)", textAlign:"left" }}>
          {icon} {label}
        </button>
      ))}
      <div style={{ display:"flex", gap:8 }}>
        <input placeholder="Other…" value={other} onChange={e => setOther(e.target.value)} style={{ flex:1 }} />
        <button onClick={() => other.trim() && onPick(other.trim(), null)} className="head" disabled={!other.trim()}
          style={{ padding:"0 16px", borderRadius:8, border:"none",
            background: other.trim() ? "var(--olive-bright)" : "var(--panel)",
            color: other.trim() ? "var(--bg)" : "var(--muted)", fontSize:13, fontWeight:700 }}>
          PAUSE
        </button>
      </div>
    </Sheet>
  );
}

function CloseJobSheet({ jobId, jobs, users, onConfirm, onClose, showToast, currentUser }) {
  const job = jobs.find(j => j.id === jobId);
  const [receipts, setReceipts] = useState([]);
  const [laborRows, setLaborRows] = useState([]); // [{name, driveMs, onSiteMs, dangling}]
  const [loading, setLoading] = useState(true);
  const [addingReceipt, setAddingReceipt] = useState(false);
  const [rVendor, setRVendor] = useState('');
  const [rAmount, setRAmount] = useState('');
  const [rSaving, setRSaving] = useState(false);
  const [rScanning, setRScanning] = useState(false);
  const [rPaidBy, setRPaidBy] = useState(currentUser?.name || '');
  const [editingReceipt, setEditingReceipt] = useState(null); // { id, vendor, amount, date, paid_by }
  const [vendorOptions, setVendorOptions] = useState([]);
  const fileRef = useRef();
  const uploadRef = useRef();
  const [receiptPagePrompt, setReceiptPagePrompt] = useState(null); // receipt row — "more pages?" after a snap
  const pageRef = useRef();
  const pageTargetRef = useRef(null);

  useEffect(() => {
    async function load() {
      const [{ data: rcpts }, { data: notes }, { data: liveCrew }] = await Promise.all([
        sb.from('receipts').select('*').eq('job_id', jobId).order('created_at'),
        sb.from('job_notes').select('*').eq('job_id', jobId).eq('source', 'system').order('created_at'),
        sb.from('job_crew').select('job_id, user_id, status').eq('job_id', jobId),
      ]);
      setReceipts(rcpts || []);
      fetchReceiptVendors().then(setVendorOptions);
      // Build labor summary from notes timeline. Dangling periods (no clock-out recorded,
      // no live crew row) contribute 0 and flag the row — never count "until now".
      const timeline = buildCrewTimeline(notes || [], liveCrew || [], users);
      const sumMs = (periods, status) => periods
        .filter(p => p.status === status && !p.dangling)
        .reduce((s, p) => s + (new Date(p.end || Date.now()) - new Date(p.start)), 0);
      const isRun = p => p.status === 'Materials Run' || p.status === 'Shop Run';
      const periodMs = p => new Date(p.end || Date.now()) - new Date(p.start);
      // Materials/Shop Run time billed to the shop isn't this job's labor cost — HoursReport
      // attributes it to the shop job's own bucket instead; excluded from this job entirely.
      const sumRunMs = periods => periods.filter(p => isRun(p) && !p.dangling && p.billTo !== 'shop').reduce((s, p) => s + periodMs(p), 0);
      const shopBilledMs = periods => periods.filter(p => isRun(p) && !p.dangling && p.billTo === 'shop').reduce((s, p) => s + periodMs(p), 0);
      const rows = users
        .filter(u => timeline[u.name])
        .map(u => {
          const periods = timeline[u.name] || [];
          return { name: u.name, driveMs: sumMs(periods, 'In Route'), onSiteMs: sumMs(periods, 'On Site'),
            runMs: sumRunMs(periods), shopBilledMs: shopBilledMs(periods),
            dangling: periods.some(p => p.dangling) };
        })
        .filter(r => r.driveMs + r.onSiteMs + r.runMs > 0 || r.shopBilledMs > 0 || r.dangling);
      setLaborRows(rows);
      setLoading(false);
    }
    load();
  }, [jobId]);

  async function saveReceipt(storagePath) {
    if (!rAmount && !rVendor) { setRSaving(false); return; }
    setRSaving(true);
    const { data, error } = await insertReceiptRow({
      job_id: jobId, amount: Number(rAmount) || null, vendor: rVendor || null,
      date: todayISO(), storage_path: storagePath || null, paid_by: rPaidBy || null,
      created_at: new Date().toISOString(),
    });
    setRSaving(false);
    if (error) { showToast?.('Receipt save failed: ' + error.message, true); return; }
    if (data) setReceipts(r => [...r, data]);
    setRVendor(''); setRAmount(''); setAddingReceipt(false);
  }

  async function saveReceiptEdit() {
    if (!editingReceipt) return;
    const { id, vendor, amount, date, paid_by } = editingReceipt;
    const patch = { vendor: (vendor||'').trim() || null, amount: Number(amount) || null,
      date: date || null, paid_by: paid_by || null };
    const error = await updateReceiptRow(id, patch);
    if (error) { showToast?.('Save failed: ' + error.message, true); return; }
    setReceipts(rs => rs.map(x => x.id === id ? { ...x, ...patch } : x));
    setEditingReceipt(null);
  }

  // Snap a receipt: upload, OCR, and SAVE the row immediately (survives form reset).
  async function handleReceiptFile(e) {
    const file = e.target.files?.[0];
    if (!file) { return; }
    setRScanning(true);
    try {
      const { b64, mediaType } = await readFileForScan(file);
      const path = `${jobId}/receipt-${Date.now()}.${(file.name||'jpg').split('.').pop()}`;
      const { error: upErr } = await sb.storage.from('job-photos').upload(path, file, { cacheControl:'3600', upsert:false });
      if (upErr) { showToast?.('Photo upload failed: ' + upErr.message, true); return; }
      let o = null;
      try { o = await scanReceiptFromB64(b64, mediaType); } catch (err) { console.warn('receipt OCR failed', err); }
      const vendor = (rVendor || o?.vendor || '').toString().trim() || null;
      const amount = Number(rAmount || o?.amount) || null;
      const date = /^\d{4}-\d{2}-\d{2}$/.test(o?.date || '') ? o.date : todayISO();
      const { data, error } = await insertReceiptRow({
        job_id: jobId, amount, vendor, date, storage_path: path, paid_by: rPaidBy || null,
        created_at: new Date().toISOString(),
      });
      if (error) { showToast?.('Receipt save failed: ' + error.message, true); return; }
      if (data) {
        setReceipts(r => [...r, data]);
        setReceiptPagePrompt(data); // multi-page receipts: offer to snap the next page
      }
      setRVendor(''); setRAmount(''); setAddingReceipt(false);
      showToast?.(vendor || amount ? 'Receipt saved' : 'Photo saved — add amount manually');
    } catch (err) {
      showToast?.('Receipt failed: ' + (err.message || 'error'), true);
    } finally {
      setRScanning(false);
      e.target.value = '';
    }
  }

  async function deleteReceipt(r) {
    const pages = receiptPages(r);
    if (pages.length) await sb.storage.from('job-photos').remove(pages);
    await sb.from('receipts').delete().eq('id', r.id);
    setReceipts(rs => rs.filter(x => x.id !== r.id));
    if (receiptPagePrompt?.id === r.id) setReceiptPagePrompt(null);
  }

  // Extra page for an existing receipt — see handleJobReceiptPageFile in JobDetail (same pattern).
  async function handleReceiptPageFile(e) {
    const file = e.target.files?.[0];
    const target = pageTargetRef.current;
    if (!file || !target) { if (e.target) e.target.value = ''; return; }
    setRScanning(true);
    try {
      const { storage_path, error } = await appendReceiptPage(target, jobId, file);
      if (error) { showToast?.('Page upload failed: ' + (error.message || 'error'), true); return; }
      const updated = { ...target, storage_path };
      setReceipts(rs => rs.map(x => x.id === target.id ? { ...x, storage_path } : x));
      setReceiptPagePrompt(updated);
      pageTargetRef.current = updated;
      showToast?.(`Page ${receiptPages(updated).length} saved`);
    } catch (err) {
      showToast?.('Page failed: ' + (err.message || 'error'), true);
    } finally {
      setRScanning(false);
      e.target.value = '';
    }
  }

  const totalReceiptAmt = receipts.reduce((s, r) => s + Number(r.amount || 0), 0);

  return (
    <Sheet title="BEFORE YOU CLOSE" onClose={onClose}>
      {loading ? (
        <div className="mono" style={{ fontSize:13, color:"var(--muted)", textAlign:"center", padding:20 }}>Loading…</div>
      ) : (
        <React.Fragment>
          {/* Labor summary */}
          <div className="mono" style={{ fontSize:11, color:"var(--muted)", letterSpacing:"0.08em", marginBottom:8 }}>LABOR</div>
          {laborRows.length === 0 ? (
            <div className="mono" style={{ fontSize:13, color:"var(--muted)", marginBottom:16 }}>No time logged</div>
          ) : (
            <div style={{ marginBottom:16 }}>
              {laborRows.map(r => (
                <div key={r.name} style={{ display:"flex", justifyContent:"space-between", alignItems:"center",
                  padding:"6px 0", borderBottom:"1px solid var(--line)" }}>
                  <div className="head" style={{ fontSize:14, fontWeight:700 }}>{r.name}</div>
                  <div style={{ textAlign:"right" }}>
                    <div className="mono" style={{ fontSize:13, color: r.dangling ? "var(--danger)" : "var(--olive-bright)" }}>
                      {r.dangling && '⚠️ '}{fmtElapsed(r.onSiteMs)} on site
                    </div>
                    {r.driveMs > 0 && (
                      <div className="mono" style={{ fontSize:11, color:"var(--muted)" }}>{fmtElapsed(r.driveMs)} drive</div>
                    )}
                    {r.runMs > 0 && (
                      <div className="mono" style={{ fontSize:11, color:"var(--muted)" }}>{fmtElapsed(r.runMs)} materials/shop run</div>
                    )}
                    {r.shopBilledMs > 0 && (
                      <div className="mono" style={{ fontSize:10, color:"var(--gold)" }}>+{fmtElapsed(r.shopBilledMs)} billed to shop — see Hours Report</div>
                    )}
                    {r.dangling && (
                      <div className="mono" style={{ fontSize:10, color:"var(--danger)" }}>missing clock-out — not counted</div>
                    )}
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* Receipts */}
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
            <div className="mono" style={{ fontSize:11, color:"var(--muted)", letterSpacing:"0.08em" }}>
              PARTS RECEIPTS{receipts.length > 0 ? ` (${receipts.length})` : ''}

            {receipts.length > 0 && (
              <div className="mono" style={{ fontSize:13, color:"var(--olive-bright)", fontWeight:700 }}>

    .filter(j => !FIELD_DONE.includes(j.status) && j.customer?.toUpperCase() !== TMC_SHOP_NAME)

function ClockOutSheet({ clockSession, jobs, onClockOut, onClose }) {
  const [jobStatus, setJobStatus] = useState(null);
  const job = clockSession?.jobId ? (jobs || []).find(j => j.id === clockSession.jobId) : null;
  const isShop = job?.customer?.toUpperCase() === TMC_SHOP_NAME;
  const activeStatuses = ['New','Ready to Schedule','Scheduled','In Route','On Site','In Progress'];
  const needsStatusUpdate = job && !isShop && activeStatuses.includes(job.status);
  return (
    <Sheet title={job ? `CLOCKING OUT — ${(job.customer || '').toUpperCase()}` : 'CLOCK OUT — SHOP'} onClose={onClose}>
      {needsStatusUpdate && (
        <React.Fragment>
          <div className="mono" style={{ fontSize:12, color:"var(--muted)", marginBottom:10 }}>UPDATE JOB STATUS (OPTIONAL)</div>
          <div style={{ display:"flex", flexDirection:"column", gap:6, marginBottom:16 }}>
            {['In Progress','On Hold','Completed/Needs Billing','Billed/Waiting for Payment','Completed/Paid'].map(s => (
              <button key={s} onClick={() => setJobStatus(jobStatus === s ? null : s)} className="head"
                style={{ padding:"12px 14px", borderRadius:8, fontSize:14, fontWeight:700, textAlign:"left",
                  background: jobStatus === s ? "var(--olive-bright)" : "var(--panel)",
                  color: jobStatus === s ? "var(--bg)" : "var(--text)",

        </div>

      <div style={{ display:"flex", gap:10 }}>

              background:"var(--panel)", border:"1px solid var(--line)", color:"var(--muted)" }}>
            SKIP STATUS

        )}

    </Sheet>
  );

function ShopActivitySheet({ startedAt, onSave, onSkip }) {
  const [selected, setSelected] = React.useState(new Set());
  const [note, setNote] = React.useState('');
  const elapsed = fmtElapsed(Date.now() - new Date(startedAt).getTime());

    <Sheet title="WHAT DID YOU DO AT THE SHOP?" onClose={onSkip}>

              background: selected.has(tag) ? "var(--olive-bright)" : "var(--panel)",
