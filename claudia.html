  const [pendingMapsJob, setPendingMapsJob] = useState(null); // job object awaiting "Want directions?" prompt
  const [pendingShopActivity, setPendingShopActivity] = useState(null); // { shopJobId, startedAt, mapsJobId } — fires after leaving shop
  const [showMenu, setShowMenu] = useState(false);
  const [staleClock, setStaleClock] = useState(null); // { session, sinceDate } — clock session left open from a prior day
  const clockSessionRef = useRef(clockSession); // latest clockSession for reconcile (avoids stale closures)
  useEffect(() => { clockSessionRef.current = clockSession; }, [clockSession]);
  // Guards clockIn/clockOut/flipToOnSite/moveToInRoute/pauseClock/resumeClock against
  // overlapping (double-tap) invocations racing each other's stale clockSession closure.
  const clockActionInFlight = useRef(false);

  function showToast(msg, isError=false) {
    if (toastTimer.current) clearTimeout(toastTimer.current);
    setToast({ msg, isError });
    toastTimer.current = setTimeout(() => setToast(null), 3000);
  }

  async function processVoiceCommand(transcript) {
    const words = transcript.trim().split(/\s+/);
    if (words.length < 2) return; // single-word STT artifact — ignore silently
    showToast(`"${transcript}"`);
    try {
      const jobSummary = jobs.slice(0,30).map(j =>
        `id:${j.id} customer:"${j.customer}" type:"${j.type}" status:"${j.status}" date:${j.scheduled_date||'?'}`
      ).join('\n');
      const userSummary = users.map(u => `id:${u.id} name:"${u.name}"`).join('\n');

      // Determine current screen so Claude routes commands correctly
      const currentScreen = showChoresView ? 'chores'
        : selectedId ? `job_detail:${selectedId}`
        : adding ? 'new_job_form'
        : 'dashboard';

      const res = await fetch(CLAUDE_PROXY, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_KEY}` },
        body: JSON.stringify({
          model: 'claude-haiku-4-5-20251001',
          max_tokens: 300,
          messages: [{ role: 'user', content:
            `You are a voice assistant for an HVAC field service app. Today: ${todayISO()}. User: ${currentUser?.name||'tech'}.
Current screen: ${currentScreen}
Jobs:\n${jobSummary}
Users:\n${userSummary}

Parse this voice command and reply ONLY with JSON (no markdown).

Intent rules (apply in this exact priority order):
1. If transcript contains "note", "notes", "write down", "log", "record", "add that" → ALWAYS "add_note"
2. If command is a status change (on site, in progress, completed, etc.) → "update_status"
3. If command is adding a new job → "add_job"
4. If command is navigating to a customer → "navigate"
5. If command uses explicit task/reminder language ("remind", "don't forget", "pick up", "order parts", "call", "follow up", "schedule") → "add_chore"
6. If current screen is "chores" → "add_chore"
7. If current screen starts with "job_detail" → default to "add_note" (observations, what was found, what was done, customer info all go here)
8. Otherwise → "unknown"
{"intent":"add_job"|"add_chore"|"navigate"|"update_status"|"add_note"|"search"|"unknown",
"customer":null,"job_type":null,"status":null,"note":null,"query":null,
"date":null,"job_id":null,"description":null,"assigned_to_name":null,
"reply":"brief friendly confirmation under 12 words"}

Command: "${transcript}"`
          }],
        }),
      });
      const data = await res.json();
      const text = (data.content?.[0]?.text || '').trim();
      const m = text.match(/\{[\s\S]*\}/);
      if (!m) throw new Error('no json');
      const intent = JSON.parse(m[0]);

      showToast(intent.reply || 'Done');

      if (intent.intent === 'add_chore') {
        const desc = intent.description || intent.note || transcript;
        const assigneeUser = intent.assigned_to_name
          ? users.find(u => u.name.toLowerCase().includes(intent.assigned_to_name.toLowerCase()))
          : null;
        // "remind me/myself to..." (self-referential, no other name spoken) — a personal
        // reminder that outranks other assigned + unassigned chores (see sortChoresForUser).
        const isReminder = /\bremind(er)?\s+(me|myself)\b/i.test(transcript);
        const assignedToId = assigneeUser?.id || (isReminder ? currentUser?.id : null) || null;
        const choreKind = isReminder ? 'reminder' : null;
        const jobIdForChore = intent.job_id || (selectedId && currentScreen.startsWith('job_detail') ? selectedId : null);
        const { data: choreData, error: choreErr } = await sb.from('chores').insert({
          description: desc,
          job_id: jobIdForChore || null,
          assigned_to: assignedToId,
          priority: choreKind,
          status: 'open',
          created_at: new Date().toISOString(),
          updated_at: new Date().toISOString(),
        }).select().single();
        if (choreErr) { showToast(`Error: ${choreErr.message}`, true); return; }
        setChores(cs => [{ id: choreData.id, kind: choreKind, job_id: jobIdForChore || null,
          assigned_to: assignedToId,
          label: desc, created: todayISO(), done: false }, ...cs]);
        showToast(isReminder ? 'Reminder added' : 'Chore added');
      } else if (intent.intent === 'add_job') {
        const pre = {};
        if (intent.customer) pre.customer = intent.customer;
        if (intent.job_type) pre.type = intent.job_type;
        if (intent.date) pre.scheduled_date = intent.date === 'today' ? todayISO() : intent.date;
        if (intent.note) pre.notes = intent.note;
        setVoicePreFill(pre);
        setAdding(true);
      } else if (intent.intent === 'navigate') {
        const match = jobs.find(j =>
          intent.job_id ? j.id === intent.job_id :
          intent.customer ? j.customer.toLowerCase().includes(intent.customer.toLowerCase()) : false
        );
        if (match) setSelectedId(match.id);
        else showToast(`No job found for "${intent.customer}"`, true);
      } else if (intent.intent === 'search') {
        setSearch(intent.query || intent.customer || '');
        setSelectedId(null);
      } else if (intent.intent === 'update_status' && intent.status) {
        const match = jobs.find(j =>
          intent.job_id ? j.id === intent.job_id :
          intent.customer ? j.customer.toLowerCase().includes(intent.customer.toLowerCase()) : false
        );
        if (match) await updateJob(match.id, { status: intent.status });
        else showToast(`No job found for "${intent.customer}"`, true);
      } else if (intent.intent === 'add_note') {
        const noteContent = intent.note || transcript;
        const match = jobs.find(j =>
          intent.job_id ? j.id === intent.job_id :
          selectedId ? j.id === selectedId :
          intent.customer ? j.customer.toLowerCase().includes(intent.customer.toLowerCase()) : false
        );
        if (match) {
          // Merge into today's shared log entry (typed or voice) for this job — app TZ day.
          const dayStart = zonedWallToISO(todayLocalISO(), '00:00');
          const dayEnd   = zonedWallToISO(shiftDateISO(todayLocalISO(), 1), '00:00');
          const { data: existing } = await sb.from('job_notes')
            .select('id, content').eq('job_id', match.id).in('source', ['voice', 'text'])
            .gte('created_at', dayStart).lt('created_at', dayEnd)
            .order('created_at', { ascending: false }).limit(1).maybeSingle();
          if (existing) {
            await sb.from('job_notes').update({ content: existing.content + '\n' + noteContent }).eq('id', existing.id);
            showToast('Note updated');
          } else {
            await sb.from('job_notes').insert({
              job_id: match.id, content: noteContent,
              source: 'voice', created_at: new Date().toISOString(),
            });
            showToast('Note added');
          }
          if (selectedId === match.id) refresh();
        } else {
          showToast(`No job found — note not saved`, true);
        }
      }
    } catch(err) {
      showToast('Voice command failed', true);
      console.error('voice error', err);
    }
  }

  function selectUser(user) {
    localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(user));
    setCurrentUser(user);
    setClockSession(loadClockSession(user.id));
    setBrowseMode(false);
  }
  function switchUser() {
    localStorage.removeItem(CURRENT_USER_KEY);
    setCurrentUser(null);
    setClockSession(null);
    setBrowseMode(false);
  }

  // Reconcile the per-device clockSession against the shared job_crew table (source of truth).
  // Fixes: (a) top bar stuck "In Route" after a teammate marks you On Site — the DB row updates
  // but the local session doesn't; (b) a stale local session lingering on another device after
  // you clocked out elsewhere — its crew row is gone, so clear it instead of nagging.
  const reconcileClockFromCrew = useCallback(async () => {
    if (!currentUser?.id) return;
    const { data, error } = await sb.from('job_crew')
      .select('job_id, status, status_at')
      // 'Paused' counts as an active session — omitting it here would make the reconcile
      // read a paused tech as "clocked out elsewhere" and wipe their local session.
      .eq('user_id', currentUser.id).in('status', ['In Route', 'On Site', 'Paused', 'Materials Run', 'Shop Run'])
      .order('status_at', { ascending: false });
    if (error) return; // network guard — never act on a failed fetch
    const mine = (data && data[0]) || null;
    const sess = clockSessionRef.current;
    if (!sess) return; // no local session — leave to orphanCrewEntry recovery
    if (!mine) {
      // Session was closed elsewhere (clocked out on another device) → drop the dead local copy.
      saveClockSession(currentUser.id, null);
      setClockSession(null);
      setStaleClock(null);
      return;
    }
    // Sync local status/job to the DB row if a teammate (or another device) changed it.
    let synced = sess;
    if (mine.status !== sess.status || mine.job_id !== sess.jobId) {
      synced = { ...sess, status: mine.status, jobId: mine.job_id,
        // same-job In Route→On Site is one continuous leg (keep legStartedAt); a job change adopts status_at
        legStartedAt: mine.job_id !== sess.jobId ? mine.status_at : sess.legStartedAt };
      saveClockSession(currentUser.id, synced);
      setClockSession(synced);
    }
    // Staleness is judged by the crew row's status_at (real activity), not the old local startedAt.
    const sinceDate = todayLocalISO(new Date(mine.status_at));
    if (sinceDate !== todayLocalISO()) setStaleClock({ session: synced, sinceDate });
    else setStaleClock(null);
  }, [currentUser?.id]);

  useEffect(() => {
    if (!currentUser) return;
    reconcileClockFromCrew();
    const t = setInterval(reconcileClockFromCrew, 60000);
    window.addEventListener('focus', reconcileClockFromCrew);
    return () => { clearInterval(t); window.removeEventListener('focus', reconcileClockFromCrew); };
  }, [currentUser?.id, reconcileClockFromCrew]);

  const refresh = useCallback(async () => {
    const [jobData, choreData, userData] = await Promise.all([fetchJobs(), fetchChores(), fetchUsers()]);
    if (jobData === null) {
      showToast("Can't reach Supabase — showing cached data", true);
    } else {
      setRlsWarning(jobData.length === 0);
      setJobs(jobData);
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(jobData)); } catch(e){}
    }
    setChores(choreData);
    if (userData) setUsers(userData);
    setLoading(false);
  }, []);

  useEffect(() => {
    if (!currentUser) return;
    refresh();
    ensureShopSentinel().then(touched => { if (touched) refresh(); }).catch(console.warn);
    window.addEventListener('focus', refresh);
    const timer = setInterval(refresh, 60000); // auto-refresh every 60s
    return () => { window.removeEventListener('focus', refresh); clearInterval(timer); };
  }, [currentUser, refresh]);

  // On fresh app open, jump straight to the job the tech is currently on
  useEffect(() => {
    if (!currentUser) return;
    if (clockSession?.jobId) {
      setSelectedId(clockSession.jobId);
    } else {
      fetchActiveCrewAssignments().then(assignments => {
        const mine = assignments.find(a => a.user_id === currentUser.id && ['On Site','In Route',...ON_BREAK_STATUSES].includes(a.status));
        if (mine) setSelectedId(mine.job_id);
      });
    }
    fetchUnreadNotifications(currentUser.id).then(notifs => {
      if (notifs.length > 0) setPendingNotifs(notifs);
    });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [currentUser]);

  // Check for orphaned crew session (localStorage cleared while still clocked in)
  useEffect(() => {
    if (!currentUser?.id || clockSession) { setOrphanCrewEntry(null); return; }
    sb.from('job_crew').select('job_id, status, status_at')
      .eq('user_id', currentUser.id).limit(1).maybeSingle()
      .then(({ data }) => setOrphanCrewEntry(data || null));
  }, [currentUser?.id, !!clockSession]);

  async function dismissNotifs() {
    if (!currentUser?.id) return;
    await sb.from('notifications').update({ read: true })
      .eq('user_id', currentUser.id).eq('read', false);
    setPendingNotifs([]);
  }

  /* ── Clock in/out ── */
  function handleClockIn(jobId, status) {
    setShowClockIn(false);
    setFieldConfirmTime(nowTimeHHMM());
    setFieldTimeConfirm({ type: 'clockIn', jobId, status });
  }
  function handleMoveToInRoute(newJobId) {
    setShowMoveJob(false);
    setFieldConfirmTime(nowTimeHHMM());
    setFieldTimeConfirm({ type: 'moveJob', jobId: newJobId });
  }
  function handleFlipToOnSite() {
    setFieldConfirmTime(nowTimeHHMM());
    setFieldTimeConfirm({ type: 'flipOnSite' });
  }
  function handleClockOut(jobStatus) {
    setShowClockOut(false);
    setFieldConfirmTime(nowTimeHHMM());
    // If the current leg started on an earlier day (forgot to clock out overnight), default
    // the date field to that day and show it — otherwise it's today's date, hidden as usual.
    const legStart = clockSession?.legStartedAt || clockSession?.startedAt;
    const legDay = legStart ? dateISOInTZ(new Date(legStart), getAppTZ()) : todayLocalISO();
    setFieldConfirmDate(legDay);
    setFieldTimeConfirm({ type: 'clockOut', jobStatus, showDate: legDay !== todayLocalISO() });
  }
  function handlePause(reason, billTo) {
    setShowPause(false);
    setFieldConfirmTime(nowTimeHHMM());
    setFieldTimeConfirm({ type: 'pause', reason, billTo });
  }
  function handleResume() {
    setFieldConfirmTime(nowTimeHHMM());
    setFieldTimeConfirm({ type: 'resume' });
  }

  // Pause the clock without clocking out: banks the leg so far, writes a 'Status → X' note
  // tagged with the reason (and bill target, for paid reasons), and flips the shared crew row.
  // Plain breaks (lunch/washy washy/other) close the timeline period — CLOSES it, so that
  // span counts zero in every report. 'Materials Run'/'Shop Run' are real field statuses
  // instead, so the span between pause and resume counts as worked time.
  async function pauseClock(reason, at = new Date().toISOString(), billTo = null) {
    if (clockActionInFlight.current) return;
    clockActionInFlight.current = true;
    try {
      if (!clockSession?.jobId || ON_BREAK_STATUSES.includes(clockSession.status)) return;
      const { jobId, startedAt, legStartedAt } = clockSession;
      const status = PAUSE_STATUS_MAP[reason] || 'Paused';
      const ok = await upsertJobCrewStatus(jobId, currentUser.id, status, at);
      if (!ok) { showToast('Could not pause — ' + (lastJobCrewError?.message || 'check connection'), true); return; }
      const billTag = billTo ? ` · bill:${billTo}` : '';
      await sb.from('job_notes').insert({
        job_id: jobId, content: `Status → ${status} (${currentUser.name}) — ${reason}${billTag}`,
        source: 'system', created_at: at, user_id: currentUser.id,
      });
      // Bank the worked leg BEFORE the pause anchor moves (leg-banking invariant). Only bank
      // into today's bucket if `at` actually falls today — a backdated pause (rare, but possible
      // via the same rewind mechanism as clockOut) must not inflate today's live total.
      if (dateISOInTZ(new Date(at), getAppTZ()) === todayLocalISO()) {
        addTodayMs(currentUser.id, new Date(at).getTime() - new Date(legStartedAt || startedAt).getTime());
      }
      const session = { ...clockSession, status, prevStatus: clockSession.status,
        pausedReason: reason, pausedAt: at, billTo, legStartedAt: at };
      saveClockSession(currentUser.id, session);
      setClockSession(session);
      refresh();
    } finally {
      clockActionInFlight.current = false;
    }
  }

  async function resumeClock(at = new Date().toISOString()) {
    if (clockActionInFlight.current) return;
    clockActionInFlight.current = true;
    try {
      if (!clockSession?.jobId || !ON_BREAK_STATUSES.includes(clockSession.status)) return;
      const back = clockSession.prevStatus === 'In Route' ? 'In Route' : 'On Site';
      // Materials Run/Shop Run are real, counted legs — bank this leg like any other transition.
      // Plain Paused already contributed nothing (never a field status), so nothing to bank there.
      // Only bank into today's bucket if `at` actually falls today (see pauseClock's same guard).
      if (clockSession.status !== 'Paused' && dateISOInTZ(new Date(at), getAppTZ()) === todayLocalISO()) {
        addTodayMs(currentUser.id, new Date(at).getTime() - new Date(clockSession.legStartedAt).getTime());
      }
      const ok = await upsertJobCrewStatus(clockSession.jobId, currentUser.id, back, at);
      if (!ok) { showToast('Could not resume — ' + (lastJobCrewError?.message || 'check connection'), true); return; }
      await sb.from('job_notes').insert({
        job_id: clockSession.jobId, content: `Status → ${back} (${currentUser.name}) — back from ${clockSession.pausedReason || 'break'}`,
        source: 'system', created_at: at, user_id: currentUser.id,
      });
      const session = { jobId: clockSession.jobId, status: back,
        startedAt: clockSession.startedAt, legStartedAt: at };
      saveClockSession(currentUser.id, session);
      setClockSession(session);
      refresh();
    } finally {
      clockActionInFlight.current = false;
    }
  }

  async function undoClockAction() {
    if (!clockUndo) return;
    const { prevSession, restore, clear, noteIds } = clockUndo;
    // Delete the undone transition's notes too — left behind, they start/end phantom
    // timeline periods that reverting the crew rows alone never cleans up.
    for (const id of (noteIds || [])) await sb.from('job_notes').delete().eq('id', id);
    for (const { jobId, status } of (restore || [])) await upsertJobCrewStatus(jobId, currentUser.id, status);
    // Raw clear (no Cleared note): undo reverts the transition, it doesn't end a real period.
    for (const { jobId } of (clear || [])) await clearJobCrewStatus(jobId, currentUser.id);
    saveClockSession(currentUser.id, prevSession);
    setClockSession(prevSession);
    setClockUndo(null);
  }

  async function clockIn(jobId, status, at = new Date().toISOString()) {
    if (clockActionInFlight.current) return;
    clockActionInFlight.current = true;
    try {
      try {
        const crewResult = await upsertJobCrewStatus(jobId, currentUser.id, status, at);
        if (!crewResult) { showToast('Could not save crew status — ' + (lastJobCrewError?.message || 'check connection'), true); return; }
        const job = jobs.find(j => j.id === jobId);
        const wIdx = s => WORKFLOW_STATUSES.indexOf(s);
        if (job && job.customer?.toUpperCase() !== TMC_SHOP_NAME && wIdx(job.status) < wIdx('In Progress')) {
          await updateJob(jobId, { status: 'In Progress', _skipNote: true });
        }
        const { data: inNote } = await sb.from('job_notes').insert({
          job_id: jobId, content: `Status → ${status} (${currentUser.name})`,
          source: 'system', created_at: at, user_id: currentUser.id,
        }).select().single();
        const session = { jobId, status, startedAt: at, legStartedAt: at };
        setClockUndo({ prevSession: null, restore: [], clear: [{ jobId }], noteIds: inNote ? [inNote.id] : [] });
        saveClockSession(currentUser.id, session);
        setClockSession(session);
        setShowClockIn(false);
        setSelectedId(jobId);
        refresh();
        // Open chores are the first thing a tech sees after clocking in (skip if there are none).
        if (chores.some(c => !c.done)) setShowChoresGate(true);
        if (status === 'In Route') {
          const addr = (siteAddr(job) || custAddr(job)).trim();
          if (addr) setPendingMapsJob(job);
        }
      } catch(e) {
        showToast('Clock in failed — ' + (e.message || 'check connection'), true);
      }
    } finally {
      clockActionInFlight.current = false;
    }
  }

  async function clockOut(jobStatus, at = new Date().toISOString()) {
    if (clockActionInFlight.current) return;
    clockActionInFlight.current = true;
    try {
      if (!clockSession) return;
      const { jobId, startedAt, legStartedAt } = clockSession;
      const undo = { prevSession: clockSession, restore: jobId ? [{ jobId, status: clockSession.status }] : [], clear: [], noteIds: [] };
      const wasShop = jobId && jobs.find(j => j.id === jobId)?.customer?.toUpperCase() === TMC_SHOP_NAME;
      if (jobId) {
        const { note: outNote } = await clearCrewWithNote(jobId, currentUser.id, currentUser.name, at, '', currentUser.id);
        if (outNote?.id) undo.noteIds.push(outNote.id);
        if (jobStatus) await updateJob(jobId, { status: jobStatus, _skipNote: true });
        // Clocking out is Jack leaving for the day, not heading somewhere else — never ask
        // "is so-and-so coming with you" here (that's moveToInRoute's question). Anyone still
        // on site stays exactly as they are; only they (or someone else) can change their status.
        if (wasShop) {
          setPendingShopActivity({ shopJobId: jobId, startedAt: legStartedAt || startedAt, mapsJobId: null });
        }
      }
      // From Paused the leg was already banked at pause time — banking again would count the break.
      // Only bank into today's bucket if `at` actually falls today — a clock-out backdated to a
      // prior day (the CONFIRM TIME date field, shown when a leg crossed midnight) must not
      // inflate today's live total; that day's real hours already live in job_notes.
      if (clockSession.status !== 'Paused' && dateISOInTZ(new Date(at), getAppTZ()) === todayLocalISO()) {
        addTodayMs(currentUser.id, new Date(at).getTime() - new Date(legStartedAt || startedAt).getTime());
      }
      saveClockSession(currentUser.id, null);
      setClockSession(null);
      setClockUndo(undo);
      setShowClockOut(false);
      refresh();
    } finally {
      clockActionInFlight.current = false;
    }
  }

  // Stale prior-day session: close it at the chosen time, writing the Cleared note for HoursReport.
  // Does NOT touch addTodayMs (that bucket is keyed to today; the prior day's hours live in job_notes).
  async function clockOutStale(atISO) {
    const sess = staleClock?.session;
    setStaleClock(null);
    if (!sess || !currentUser) return;
    if (sess.jobId) {
      await clearCrewWithNote(sess.jobId, currentUser.id, currentUser.name, atISO, '', currentUser.id);
    }
    saveClockSession(currentUser.id, null);
    setClockSession(null);
    refresh();
  }

  // Stale prior-day session: keep working. Re-anchor the session to now so today's total
  // starts clean and the stale prompt doesn't fire again on reload.
  async function keepStaleClock() {
    const sess = staleClock?.session;
    setStaleClock(null);
    if (!sess || !currentUser) return;
    const now = new Date().toISOString();
    const session = { ...sess, startedAt: now, legStartedAt: now };
    saveClockSession(currentUser.id, session);
    setClockSession(session);
    // Re-stamp the shared crew row to now so reconcileClockFromCrew won't re-flag it as prior-day.
    if (sess.jobId) await upsertJobCrewStatus(sess.jobId, currentUser.id, sess.status);
  }

  async function flipToOnSite(at = new Date().toISOString()) {
    if (clockActionInFlight.current) return;
    clockActionInFlight.current = true;
    try {
      if (!clockSession?.jobId) return;
      const undo = { prevSession: clockSession, restore: [{ jobId: clockSession.jobId, status: 'In Route' }], clear: [], noteIds: [] };
      await upsertJobCrewStatus(clockSession.jobId, currentUser.id, 'On Site', at);
      const job = jobs.find(j => j.id === clockSession.jobId);
      const wIdx = s => WORKFLOW_STATUSES.indexOf(s);
      if (job && job.customer?.toUpperCase() !== TMC_SHOP_NAME && wIdx(job.status) < wIdx('In Progress')) {
        await updateJob(clockSession.jobId, { status: 'In Progress', _skipNote: true });
      }
      const { data: onSiteNote } = await sb.from('job_notes').insert({
        job_id: clockSession.jobId, content: `Status → On Site (${currentUser.name})`,
        source: 'system', created_at: at, user_id: currentUser.id,
      }).select().single();
      if (onSiteNote) undo.noteIds.push(onSiteNote.id);
      const remaining = await fetchJobCrew(clockSession.jobId);
      const othersInRoute = remaining.filter(c => c.status === 'In Route' && c.user_id !== currentUser.id);
      const inRouteUsers = users.filter(u => othersInRoute.find(c => c.user_id === u.id));
      if (inRouteUsers.length > 0) setJoiningOnSiteCheck({ members: inRouteUsers, jobId: clockSession.jobId });
      // In Route → On Site is the same continuous leg — do NOT reset legStartedAt or bank,
      // or the in-route minutes vanish from today's total.
      const session = { ...clockSession, status: 'On Site' };
      saveClockSession(currentUser.id, session);
      setClockSession(session);
      setClockUndo(undo);
      refresh();
    } finally {
      clockActionInFlight.current = false;
    }
  }

  async function moveToInRoute(newJobId, at = new Date().toISOString()) {
    if (clockActionInFlight.current) return;
    clockActionInFlight.current = true;
    try {
      try {
        const { jobId: oldJobId, startedAt } = clockSession;
        const undo = {
          prevSession: clockSession,
          restore: oldJobId ? [{ jobId: oldJobId, status: clockSession.status }] : [],
          clear: [{ jobId: newJobId }],
          noteIds: [],
        };
        let isLastOut = false;
        let hasCrew = false;
        const wasShop = oldJobId && jobs.find(j => j.id === oldJobId)?.customer?.toUpperCase() === TMC_SHOP_NAME;
        const shopLegStart = clockSession.legStartedAt || startedAt;
        // bank the leg we're leaving into today's running total before the new leg starts
        // (skip from Paused — that leg was already banked when the pause started)
        if (clockSession.status !== 'Paused') {
          addTodayMs(currentUser.id, Date.now() - new Date(shopLegStart).getTime());
        }
        if (oldJobId) {
          const { note: leaveNote } = await clearCrewWithNote(oldJobId, currentUser.id, currentUser.name, at, '', currentUser.id);
          if (leaveNote?.id) undo.noteIds.push(leaveNote.id);
          const remaining = await fetchJobCrew(oldJobId);
          const stillOnSite = remaining.filter(c => c.status === 'On Site');
          isLastOut = stillOnSite.length === 0;
          const othersOnSite = users.filter(u => u.id !== currentUser.id && stillOnSite.find(c => c.user_id === u.id));
          if (othersOnSite.length > 0) {
            setLeavingCrewCheck({ members: othersOnSite, newJobId, oldJobId,
              mapsJobId: wasShop ? null : newJobId, someoneStayed: false,
              fromShop: wasShop, shopStartedAt: shopLegStart });
            hasCrew = true;
          }
        }
        const ok = await upsertJobCrewStatus(newJobId, currentUser.id, 'In Route', at);
        if (!ok) { showToast('Could not update crew status — ' + (lastJobCrewError?.message || 'check connection'), true); return; }
        const newJob = jobs.find(j => j.id === newJobId);
        const wIdx = s => WORKFLOW_STATUSES.indexOf(s);
        if (newJob && newJob.customer?.toUpperCase() !== TMC_SHOP_NAME && wIdx(newJob.status) < wIdx('In Progress')) {
          await updateJob(newJobId, { status: 'In Progress', _skipNote: true });
        }
        const { data: routeNote } = await sb.from('job_notes').insert({
          job_id: newJobId, content: `Status → In Route (${currentUser.name})`,
          source: 'system', created_at: at, user_id: currentUser.id,
        }).select().single();
        if (routeNote) undo.noteIds.push(routeNote.id);
        const session = { jobId: newJobId, status: 'In Route', startedAt, legStartedAt: at };
        saveClockSession(currentUser.id, session);
        setClockSession(session);
        setClockUndo(undo);
        setShowMoveJob(false);
        setSelectedId(newJobId);
        refresh();
        if (!hasCrew) {
          if (wasShop) {
            setPendingShopActivity({ shopJobId: oldJobId, startedAt: shopLegStart, mapsJobId: newJobId });
          } else {
            // No crew on the old job ⇒ last one out. Ask "is this job done?" first,
            // then fire navigation when that prompt resolves (navigation is always last).
            const oldJob = (isLastOut && oldJobId) ? jobs.find(j => j.id === oldJobId) : null;
            if (oldJob && oldJob.customer?.toUpperCase() !== TMC_SHOP_NAME) {
              setLastLeaveJob({ job: oldJob, mapsJobId: newJobId });
            } else {
              const addr = (siteAddr(newJob) || custAddr(newJob)).trim();
              if (addr) setPendingMapsJob(newJob);
            }
          }
        }
      } catch(e) {
        showToast('Move failed — ' + (e.message || 'check connection'), true);
      }
    } finally {
      clockActionInFlight.current = false;
    }
  }

  /* ── CRUD ── */
  async function addJob(job) {
    const customerId = await resolveCustomer(job);
    if (!customerId) { showToast("Could not resolve customer", true); return; }
    const { data, error } = await sb.from('jobs').insert({
      ...toRow(job, customerId, currentUser?.id),
      created_at: new Date().toISOString(),
    }).select('*, customers(*)').single();
    if (error) { showToast("Error saving job", true); console.error(error); return; }
    await sb.from('job_notes').insert({
      job_id: data.id, content: `Job created. Status: ${job.status}`,
      source: 'system', created_at: new Date().toISOString(),
    });
    const newJob = fromRow(data);
    setJobs(js => [newJob, ...js]);
    if ((job.site_name||'').trim()) await updateJobSiteName(data.id, job.site_name.trim());
    setAdding(false);
    setVoicePreFill(null);
    showToast("Job saved");
    if (job.status === "Completed/Needs Billing") spawnBillingChore(newJob);
    if (clockInAfterAdd) { const st = clockInAfterAdd; setClockInAfterAdd(null); handleClockIn(data.id, st); }
    else if (routeAfterAdd) { setRouteAfterAdd(false); await moveToInRoute(data.id); }
    else setSelectedId(data.id);
  }

  async function updateJob(id, patch) {
    const job = jobs.find(j => j.id === id);
    if (!job) return;
    const updateData = { updated_at: new Date().toISOString() };
    if ('status' in patch)        updateData.current_status = patch.status;
    if ('type' in patch)          updateData.flow_type = patch.type;
    if ('original_ask' in patch)  updateData.original_ask = patch.original_ask||null;
    if ('notes' in patch)         updateData.notes = patch.notes||null;
    if ('value' in patch)         updateData.value = Number(patch.value)||null;
    if ('scheduled_date' in patch || 'scheduled_time' in patch) {
      const d = ('scheduled_date' in patch ? patch.scheduled_date : job.scheduled_date);
      const t = ('scheduled_time' in patch ? patch.scheduled_time : job.scheduled_time);
      updateData.scheduled_at = (d && t) ? zonedWallToISO(d, t) : null;
    }
    const { error } = await sb.from('jobs').update(updateData).eq('id', id);
    if (error) { showToast("Error updating job", true); console.error(error); return; }
    if (patch.status && patch.status !== job.status && !patch._skipNote) {
      const fieldStatuses = ["In Route", "On Site"];
      const userName = currentUser?.name || null;
      // "Job status →" (not "Status →"): the plain form is reserved for crew clock events —
      // parseCrewLogEntry/fromRow read those as clocked time, so a job-status change written
      // in that format created phantom clock-in periods for whoever tapped the picker.
      const noteContent = userName ? `Job status → ${patch.status} (${userName})` : `Job status → ${patch.status}`;
      const noteRow = { job_id: id, content: noteContent, source: 'system', created_at: patch._at || new Date().toISOString() };
      if (currentUser?.id) noteRow.user_id = currentUser.id;
      await sb.from('job_notes').insert(noteRow);
      if (fieldStatuses.includes(patch.status) && currentUser?.id) {
        await sb.from('jobs').update({ assigned_to: currentUser.id }).eq('id', id);
      }
      if (patch.status === "Completed/Needs Billing") spawnBillingChore({ ...job, ...patch });
      if (patch.status === "Completed/Paid") setCloseJobPromptId(id);
    }
    setJobs(js => js.map(j => j.id === id ? { ...j, ...patch } : j));
  }

  async function updateJobMaterials(id, materials) {

      .update({ materials_needed: materials, updated_at: new Date().toISOString() }).eq('id', id);

      showToast(error.code === 'PGRST204'

      console.error(error);
      return false;
    }
    setJobs(js => js.map(j => j.id === id ? { ...j, materials_needed: materials } : j));

  // Deposit fields are written only here (not via toRow) so unmigrated job saves never break.
  // Clearing deposit_check_number whenever method isn't 'check' avoids a stale check number
  // lingering after switching a deposit from check to cash.
  async function updateJobDeposit(id, fields) {
    const patch = {
      deposit_amount: fields.deposit_amount != null ? Number(fields.deposit_amount) : null,
      deposit_method: fields.deposit_method || null,
      deposit_check_number: fields.deposit_method === 'check' ? (fields.deposit_check_number || null) : null,
      updated_at: new Date().toISOString(),
    };
    const { error } = await sb.from('jobs').update(patch).eq('id', id);
    if (error) {
      if (error.code === 'PGRST204') showToast("Deposit needs one-time DB setup — ask Jack", true);
      else { showToast("Error saving deposit", true); console.error(error); }
      return false;
    }
    setJobs(js => js.map(j => j.id === id ? { ...j, ...patch } : j));
    return true;
  }

  async function saveEdit(edited) {
    const customerId = await resolveCustomer(edited);
    if (!customerId) { showToast("Could not resolve customer", true); return; }
    const { error } = await sb.from('jobs').update(toRow(edited, customerId, currentUser?.id)).eq('id', edited.id);
    if (error) { showToast("Error saving changes", true); console.error(error); return; }
    setJobs(js => js.map(j => j.id === edited.id ? { ...j, ...edited, _customer_id: customerId } : j));
    await updateJobSiteName(edited.id, (edited.site_name||'').trim() || null);
    setEditingId(null);
    showToast("Changes saved");
    if (edited.status === "Completed/Needs Billing") spawnBillingChore({ ...edited, _customer_id: customerId });

  // Purges every job_id-linked table before deleting the job itself — a job used to be
  // deletable while leaving job_notes/job_crew/job_photos/receipts/chores orphaned behind it
  // (surfaced as an unremovable "Unknown" entry in HoursReport). Bails on the first failure
  // so a partial purge can never leave a NEW orphan the same way the original bug did.
  async function deleteJob(id) {
    const { data: photos } = await sb.from('job_photos').select('storage_path').eq('job_id', id);
    if (photos?.length) await sb.storage.from('job-photos').remove(photos.map(p => p.storage_path).filter(Boolean));
    let { error } = await sb.from('job_photos').delete().eq('job_id', id);
    if (error) { showToast("Error deleting job", true); console.error(error); return; }

    const { data: receipts } = await sb.from('receipts').select('id, storage_path').eq('job_id', id);
    if (receipts?.length) {
      const allPages = receipts.flatMap(receiptPages);
      if (allPages.length) await sb.storage.from('job-photos').remove(allPages);
    }
    ({ error } = await sb.from('receipts').delete().eq('job_id', id));
    if (error) { showToast("Error deleting job", true); console.error(error); return; }

    ({ error } = await sb.from('job_notes').delete().eq('job_id', id));
    if (error) { showToast("Error deleting job", true); console.error(error); return; }

    ({ error } = await sb.from('job_crew').delete().eq('job_id', id));
    if (error) { showToast("Error deleting job", true); console.error(error); return; }

    ({ error } = await sb.from('chores').delete().eq('job_id', id));
    if (error) { showToast("Error deleting job", true); console.error(error); return; }

    ({ error } = await sb.from('jobs').delete().eq('id', id));
    if (error) { showToast("Error deleting job", true); console.error(error); return; }

    setJobs(js => js.filter(j => j.id !== id));
    setChores(cs => cs.filter(c => c.job_id !== id));
    setSelectedId(null);
    showToast("Job deleted");
  }

  async function toggleChore(choreId) {
    const chore = chores.find(c => c.id === choreId);
    if (!chore) return;
    const newStatus = chore.done ? 'open' : 'done';
    const { error } = await sb.from('chores')
      .update({ status: newStatus, updated_at: new Date().toISOString() }).eq('id', choreId);
    if (error) { showToast("Error updating chore", true); return; }
    setChores(cs => cs.map(c => c.id === choreId ? { ...c, done: !chore.done } : c));
    // Billing chore checked off → ask if paid first
    if (!chore.done && chore.kind === 'billing' && chore.job_id) {
      setBillingPaidPromptId(chore.job_id);
    }
  }

  async function editChore(choreId, fields) {
    const { error } = await sb.from('chores').update({
      description: fields.description,
      job_id: fields.job_id || null,
      assigned_to: fields.assigned_to || null,

  async function addChore(desc, jobId, assignedTo) {
    const { data, error } = await sb.from('chores').insert({
      description: desc, job_id: jobId||null,
      assigned_to: validUUID(assignedTo)||null,

  async function deleteChore(choreId) {
    await sb.from('chores').delete().eq('id', choreId);
    setChores(cs => cs.filter(c => c.id !== choreId));

  async function spawnBillingChore(job) {
    if (chores.some(c => c.job_id === job.id && c.kind === 'billing')) return;
    const tyler = users.find(u => u.name && u.name.toLowerCase() === 'tyler');
    const { data, error } = await sb.from('chores').insert({
      description: `Create bill for ${job.customer}`,
      job_id: job.id,
      assigned_to: tyler?.id || null,
      priority: 'billing', status: 'open',
      created_at: new Date().toISOString(), updated_at: new Date().toISOString(),
    }).select().single();
    if (error) { showToast(`Chore error: ${error.message}`, true); console.error('spawnBillingChore', error); return; }
    if (data) {
      setChores(cs => [{
        id: data.id, kind:'billing', job_id: job.id, assigned_to: tyler?.id || null,
        label: `Create bill for ${job.customer}`, created: todayISO(), done: false,
      }, ...cs]);
      showToast("Billing chore created → assigned to Tyler");
    }
  }

  function fixOldStatuses() {
    const MAP = {
      "Needs Billing":"Completed/Needs Billing","Paid":"Completed/Paid",
      "Completed":"Completed/Needs Billing","Estimate Scheduled":"Evaluation Needed",
      "Estimate Given":"Waiting on Approval",
    };
    let changed = 0;
    const next = jobs.map(j => { if (MAP[j.status]) { changed++; return {...j,status:MAP[j.status]}; } return j; });
    setJobs(next);
    Promise.all(next.filter((_,i) => MAP[jobs[i]?.status]).map(j =>
      sb.from('jobs').update({ current_status:j.status }).eq('id',j.id)
    )).then(() => setTimeout(() => alert(changed > 0 ? `Updated ${changed} job(s).` : "No old statuses found."), 50));
  }

  function exportJobs() {
    const payload = { jobs, chores, exported: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(payload,null,2)], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `tmc-jobs-${todayISO()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  function importJobs() {
    const input = document.createElement("input");
    input.type = "file"; input.accept = ".json";
    input.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      let payload;
      try { payload = JSON.parse(await file.text()); } catch {
        showToast("Invalid JSON file", true); return;
      }
      const importList = payload.jobs || [];
      const choreList  = payload.chores || [];
      if (!importList.length && !choreList.length) {
        showToast("Nothing to import", true); return;
      }
      showToast(`Importing ${importList.length} jobs…`);
      let ok = 0, fail = 0, firstErr = null;
      for (const job of importList) {
        // resolve or create customer
        const name = (job.customer||'').trim();
        let customerId = null;
        if (name) {
          const { data: ex } = await sb.from('customers').select('id').ilike('name', name).limit(1).maybeSingle();
          if (ex) {
            customerId = ex.id;
          } else {
            const addr = job.customer_address || job.address || null;
            const { data: nc, error: ce } = await sb.from('customers').insert({
              name, phone: job.phone||null, address: addr,
              created_at: new Date().toISOString(), updated_at: new Date().toISOString(),
            }).select('id').single();
            if (ce) {
              fail++;
              if (!firstErr) firstErr = `Customer insert: ${ce.message||JSON.stringify(ce)}`;
              console.error('import customer error', ce, job);
              continue;
            }
            customerId = nc.id;
          }
        }
        if (!customerId) { fail++; if (!firstErr) firstErr = `No customer name for job: ${job.id}`; continue; }

        const { data, error } = await sb.from('jobs').insert({
          ...toRow(job, customerId, currentUser?.id),
          created_at: new Date().toISOString(),
        }).select('id').single();
        if (error) {
          fail++;
          if (!firstErr) firstErr = `Job insert: ${error.message||JSON.stringify(error)}`;
          console.error('import job error', error, job);
          continue;
        }
        for (const h of (job.history || [])) {
          await sb.from('job_notes').insert({
            job_id: data.id, content: h.note,
            source: 'user',
            created_at: h.date ? new Date(h.date).toISOString() : new Date().toISOString(),
          });
        }
        ok++;
      }
      for (const chore of choreList) {
        await sb.from('chores').insert({
          description: chore.label || chore.description || '',
          status: chore.done ? 'done' : 'open',
          priority: chore.kind || null,
          created_at: new Date().toISOString(),
        });
      }
      if (firstErr) showToast(`Failed: ${firstErr}`, true);
      else showToast(`Imported ${ok} job${ok!==1?'s':''}${fail ? `, ${fail} failed` : ''}`);
      await refresh();
    };
    input.click();
  }

  /* ── Render ── */
  if (!deviceAuthorized) return <PassphraseGate onAuthorize={authorizeDevice} />;

  if (!clockSession && !browseMode) {
    if (orphanCrewEntry) {

              saveClockSession(currentUser.id, session);

              setOrphanCrewEntry(null);
              if (orphanCrewEntry.job_id) setSelectedId(orphanCrewEntry.job_id);
            }} className="head"

                background:"var(--olive-bright)", color:"var(--bg)", border:"none" }}>
              RESUME SESSION
            </button>
            <button onClick={async () => {
              if (orphanCrewEntry.job_id) await clearCrewWithNote(orphanCrewEntry.job_id, currentUser.id, currentUser.name, new Date().toISOString(), ' (self-reported)', currentUser.id);
              setOrphanCrewEntry(null);
            }} className="head"
              style={{ width:"100%", maxWidth:340, padding:14, fontSize:14, fontWeight:700, borderRadius:12,
                background:"var(--panel)", border:"1px solid var(--line)", color:"var(--muted)" }}>
              I ALREADY CLOCKED OUT

          </div>
          {toast && <Toast msg={toast.msg} isError={toast.isError} />}
        </React.Fragment>
      );
    }
    if (showClockIn) return (
      <React.Fragment>
        <ClockInSheet jobs={jobs} onConfirm={handleClockIn} onClose={() => setShowClockIn(false)}
          onNewJob={(status) => { setShowClockIn(false); setClockInAfterAdd(status); setAdding(true); }} />
        {toast && <Toast msg={toast.msg} isError={toast.isError} />}
      </React.Fragment>
    );
    if (adding) return (
      <React.Fragment>
        <JobForm onSave={addJob} onCancel={() => { setAdding(false); setVoicePreFill(null); setClockInAfterAdd(null); }} prefill={voicePreFill} allJobs={jobs} />
        {toast && <Toast msg={toast.msg} isError={toast.isError} />}
      </React.Fragment>
    );
    return (
      <React.Fragment>
        <ClockGate userName={currentUser.name} onClockIn={() => setShowClockIn(true)}
          onBrowse={() => { setBrowseMode(true); if (chores.some(c => !c.done)) setShowChoresGate(true); }}
          onUndo={clockUndo ? undoClockAction : null} onSwitchUser={() => { localStorage.removeItem(CURRENT_USER_KEY); setCurrentUser(null); }} />
        {lastLeaveJob && (
          <LastLeaveSheet job={lastLeaveJob.job} onPick={async s => {
            await updateJob(lastLeaveJob.job.id, { status: s, _skipNote: true });
            const mj = lastLeaveJob.mapsJobId ? jobs.find(j => j.id === lastLeaveJob.mapsJobId) : null;
            setLastLeaveJob(null);
            if (mj && (siteAddr(mj) || custAddr(mj)).trim()) setPendingMapsJob(mj);
          }} onClose={() => {
            const mj = lastLeaveJob.mapsJobId ? jobs.find(j => j.id === lastLeaveJob.mapsJobId) : null;
            setLastLeaveJob(null);
            if (mj && (siteAddr(mj) || custAddr(mj)).trim()) setPendingMapsJob(mj);
          }} />
        )}
        {leavingCrewCheck && leavingCrewCheck.members.length > 0 && (() => {
          const person = leavingCrewCheck.members[0];
          const rest = leavingCrewCheck.members.slice(1);
          // Name the destination — YES records this person In Route to newJobId, which the
          // answerer otherwise has no way to know (from clock-out it defaults to the shop).
          const destJob = leavingCrewCheck.newJobId ? jobs.find(j => j.id === leavingCrewCheck.newJobId) : null;
          const advance = (stayed = false) => {
            const nextSomeoneStayed = leavingCrewCheck.someoneStayed || stayed;
            if (rest.length > 0) {
              setLeavingCrewCheck({ ...leavingCrewCheck, members: rest, someoneStayed: nextSomeoneStayed });
            } else {
              const { mapsJobId, oldJobId, fromShop, shopStartedAt } = leavingCrewCheck;
              setLeavingCrewCheck(null);
              if (fromShop && oldJobId) {
                setPendingShopActivity({ shopJobId: oldJobId, startedAt: shopStartedAt, mapsJobId });
              } else {
                const oldJob = (!nextSomeoneStayed && oldJobId) ? jobs.find(j => j.id === oldJobId) : null;
                const mj = mapsJobId ? jobs.find(j => j.id === mapsJobId) : null;
                const mapsOk = mj && (siteAddr(mj) || custAddr(mj)).trim();
                if (oldJob && oldJob.customer?.toUpperCase() !== TMC_SHOP_NAME) {
                  // navigation chains after the LAST ONE OUT prompt resolves (stays last)
                  setLastLeaveJob({ job: oldJob, mapsJobId: mapsOk ? mapsJobId : null });
                } else if (mapsOk) {
                  setPendingMapsJob(mj);

            <Sheet title="CREW CHECK" onClose={() => setLeavingCrewCheck(null)}>

              <div style={{ display:"flex", gap:12 }}>
                <button onClick={async () => {
                  if (clockActionInFlight.current) return;
                  clockActionInFlight.current = true;
                  try {
                    const { newJobId, oldJobId } = leavingCrewCheck;
                    const at = new Date().toISOString();
                    await clearCrewWithNote(oldJobId, person.id, person.name, at, ` — with ${currentUser.name}`, currentUser.id);
                    if (newJobId) {
                      await upsertJobCrewStatus(newJobId, person.id, 'In Route');
                      const newJob = jobs.find(j => j.id === newJobId);
                      await sb.from('job_notes').insert({
                        job_id: newJobId, content: `Status → In Route (${person.name}) — with ${currentUser.name}`,
                        source: 'system', created_at: at, user_id: currentUser.id,
                      });
                      await sb.from('notifications').insert({
                        user_id: person.id,
                        message: `${currentUser.name} marked you In Route to ${newJob?.customer || 'a job'}`,
                        read: false, created_at: at,

                    }
                    advance(false);
                    refresh();
                  } finally {
                    clockActionInFlight.current = false;

                  style={{ flex:1, padding:14, fontSize:15, fontWeight:700, borderRadius:10,
                    background:"var(--olive-bright)", color:"var(--bg)", border:"none" }}>

                </button>
                <button onClick={() => advance(true)} className="head"

                    background:"var(--panel)", border:"1px solid var(--line)", color:"var(--muted)" }}>
                  NO — STAYING
                </button>
              </div>
            </Sheet>
          );
        })()}
        {joiningOnSiteCheck && joiningOnSiteCheck.members.length > 0 && (() => {
          const person = joiningOnSiteCheck.members[0];
          const rest = joiningOnSiteCheck.members.slice(1);
          const advance = () => rest.length > 0
            ? setJoiningOnSiteCheck({ ...joiningOnSiteCheck, members: rest })

            <Sheet title="ON SITE CHECK" onClose={() => setJoiningOnSiteCheck(null)}>
              <div className="mono" style={{ fontSize:15, color:"var(--text)", marginBottom:20 }}>

                  await sb.from('job_notes').insert({
                    job_id: jsJobId, content: `Status → On Site (${person.name}) — with ${currentUser.name}`,
                    source: 'system', created_at: at, user_id: currentUser.id,

                const at = zonedWallToISO(dateForAt, `${hh}:${mm}`); // picked time, app TZ; date only changes for a backdated clock-out
                const fc = fieldTimeConfirm;
                setFieldTimeConfirm(null);
                if (fc.type === 'clockIn') clockIn(fc.jobId, fc.status, at);

        const destJob = leavingCrewCheck.newJobId ? jobs.find(j => j.id === leavingCrewCheck.newJobId) : null;
        const advance = (stayed = false) => {
          const nextSomeoneStayed = leavingCrewCheck.someoneStayed || stayed;
          if (rest.length > 0) {
            setLeavingCrewCheck({ ...leavingCrewCheck, members: rest, someoneStayed: nextSomeoneStayed });
          } else {
            const { mapsJobId, oldJobId, fromShop, shopStartedAt } = leavingCrewCheck;
            setLeavingCrewCheck(null);
            if (fromShop && oldJobId) {
              setPendingShopActivity({ shopJobId: oldJobId, startedAt: shopStartedAt, mapsJobId });
            } else {
              const oldJob = (!nextSomeoneStayed && oldJobId) ? jobs.find(j => j.id === oldJobId) : null;
              const mj = mapsJobId ? jobs.find(j => j.id === mapsJobId) : null;
              const mapsOk = mj && (siteAddr(mj) || custAddr(mj)).trim();
              if (oldJob && oldJob.customer?.toUpperCase() !== TMC_SHOP_NAME) {
                // navigation chains after the LAST ONE OUT prompt resolves (stays last)
                setLastLeaveJob({ job: oldJob, mapsJobId: mapsOk ? mapsJobId : null });

          <Sheet title="CREW CHECK" onClose={() => setLeavingCrewCheck(null)}>

                clockActionInFlight.current = true;
                try {
                  const { newJobId, oldJobId } = leavingCrewCheck;
                  const at = new Date().toISOString();
                  await clearCrewWithNote(oldJobId, person.id, person.name, at, ` — with ${currentUser.name}`, currentUser.id);
                  if (newJobId) {
                    await upsertJobCrewStatus(newJobId, person.id, 'In Route');
                    const newJob = jobs.find(j => j.id === newJobId);
                    await sb.from('job_notes').insert({
                      job_id: newJobId, content: `Status → In Route (${person.name}) — with ${currentUser.name}`,
                      source: 'system', created_at: at, user_id: currentUser.id,

                      user_id: person.id,
                      message: `${currentUser.name} marked you In Route to ${newJob?.customer || 'a job'}`,
                      read: false, created_at: at,

                  advance(false);
                  refresh();
                } finally {

                style={{ flex:1, padding:16, fontSize:16, fontWeight:700, borderRadius:10,

            </div>
          </Sheet>

          onConfirm={async () => {
