function App() {
  const [deviceAuthorized, setDeviceAuthorized] = useState(
    () => localStorage.getItem(DEVICE_AUTH_KEY) === DEVICE_PASSPHRASE
  );
  function authorizeDevice() {
    localStorage.setItem(DEVICE_AUTH_KEY, DEVICE_PASSPHRASE);
    setDeviceAuthorized(true);
  }
  function lockDevice() {
    localStorage.removeItem(DEVICE_AUTH_KEY);
    setDeviceAuthorized(false);
  }

  const [currentUser, setCurrentUser] = useState(() => {
    try { return JSON.parse(localStorage.getItem(CURRENT_USER_KEY)); } catch { return null; }
  });
  const [jobs, setJobs] = useState(() => {
    try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : []; } catch { return []; }
  });
  const [chores, setChores] = useState([]);
  const [loading, setLoading] = useState(true);
  const [rlsWarning, setRlsWarning] = useState(false);
  const [pendingNotifs, setPendingNotifs] = useState([]);
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);

  const [selectedId, setSelectedIdRaw] = useState(() => sessionStorage.getItem('tmc_selected_job') || null);
  const [recentJobs, setRecentJobs] = useState(getRecentJobs);
  const [recentsOpen, setRecentsOpen] = useState(false);
  const [searchActive, setSearchActive] = useState(false);
  const searchInputRef = useRef(null);
  function setSelectedId(id) {
    if (id) {
      sessionStorage.setItem('tmc_selected_job', id);
      const job = jobs.find(j => j.id === id);
      if (job) { saveRecentJob(job); setRecentJobs(getRecentJobs()); }
    } else {
      sessionStorage.removeItem('tmc_selected_job');
      setRecentJobs(getRecentJobs());
    }
    setSelectedIdRaw(id);
  }
  const [adding, setAdding] = useState(false);
  const [voicePreFill, setVoicePreFill] = useState(null);
  const [routeAfterAdd, setRouteAfterAdd] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [filter, setFilter] = useState(null);
  const [search, setSearch] = useState("");
  const [searchClosed, setSearchClosed] = useState(false);
  const [choresExpanded, setChoresExpanded] = useState(false);
  const [showChoresView, setShowChoresView] = useState(false);
  const [focusPhotos, setFocusPhotos] = useState(false);
  const [showCapCalc, setShowCapCalc] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [users, setUsers] = useState(FALLBACK_USERS);
  const [expandedCustomers, setExpandedCustomers] = useState(new Set());
  const [clockSession, setClockSession] = useState(() => {
    try {
      const u = JSON.parse(localStorage.getItem(CURRENT_USER_KEY));
      return u ? loadClockSession(u.id) : null;
    } catch { return null; }
  });
  const [browseMode, setBrowseMode] = useState(false);
  const [showClockIn, setShowClockIn] = useState(false);
  const [showClockOut, setShowClockOut] = useState(false);
  const [showMoveJob, setShowMoveJob] = useState(false);
  const [showLeaving, setShowLeaving] = useState(false);
  const [lastLeaveJob, setLastLeaveJob] = useState(null); // job object when you're last to leave
  const [leavingCrewCheck, setLeavingCrewCheck] = useState(null); // { members:[user], newJobId, oldJobId }
  const [clockUndo, setClockUndo] = useState(null);
  // clockUndo: { prevSession, restore: [{jobId,status}], clear: [{jobId}] }
  const [orphanCrewEntry, setOrphanCrewEntry] = useState(null); // { job_id, status, status_at } — lost session to recover
  const [closeJobPromptId, setCloseJobPromptId] = useState(null); // job id to prompt closing after Completed/Paid
  const [billingPaidPromptId, setBillingPaidPromptId] = useState(null); // job id to ask "is this paid?" after billing chore

  function showToast(msg, isError=false) {
    if (toastTimer.current) clearTimeout(toastTimer.current);
    setToast({ msg, isError });
    toastTimer.current = setTimeout(() => setToast(null), 3000);
  }

  async function processVoiceCommand(transcript) {
    const words = transcript.trim().split(/\s+/);
    if (words.length < 2) return; // single-word STT artifact — ignore silently
    showToast(`"${transcript}"`);
    try {
      const jobSummary = jobs.slice(0,30).map(j =>
        `id:${j.id} customer:"${j.customer}" type:"${j.type}" status:"${j.status}" date:${j.scheduled_date||'?'}`
      ).join('\n');
      const userSummary = users.map(u => `id:${u.id} name:"${u.name}"`).join('\n');

      // Determine current screen so Claude routes commands correctly
      const currentScreen = showChoresView ? 'chores'
        : selectedId ? `job_detail:${selectedId}`
        : adding ? 'new_job_form'
        : 'dashboard';

      const res = await fetch(CLAUDE_PROXY, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_KEY}` },
        body: JSON.stringify({
          model: 'claude-haiku-4-5-20251001',
          max_tokens: 300,
          messages: [{ role: 'user', content:
            `You are a voice assistant for an HVAC field service app. Today: ${todayISO()}. User: ${currentUser?.name||'tech'}.
Current screen: ${currentScreen}
Jobs:\n${jobSummary}
Users:\n${userSummary}

Parse this voice command and reply ONLY with JSON (no markdown).

Intent rules (apply in this exact priority order):
1. If transcript contains "note", "notes", "write down", "log", "record", "add that" → ALWAYS "add_note"
2. If command is a status change (on site, in progress, completed, etc.) → "update_status"
3. If command is adding a new job → "add_job"
4. If command is navigating to a customer → "navigate"
5. If command uses explicit task/reminder language ("remind", "don't forget", "pick up", "order parts", "call", "follow up", "schedule") → "add_chore"
6. If current screen is "chores" → "add_chore"
7. If current screen starts with "job_detail" → default to "add_note" (observations, what was found, what was done, customer info all go here)
8. Otherwise → "unknown"
{"intent":"add_job"|"add_chore"|"navigate"|"update_status"|"add_note"|"search"|"unknown",
"customer":null,"job_type":null,"status":null,"note":null,"query":null,
"date":null,"job_id":null,"description":null,"assigned_to_name":null,
"reply":"brief friendly confirmation under 12 words"}

Command: "${transcript}"`
          }],
        }),
      });
      const data = await res.json();
      const text = (data.content?.[0]?.text || '').trim();
      const m = text.match(/\{[\s\S]*\}/);
      if (!m) throw new Error('no json');
      const intent = JSON.parse(m[0]);

      showToast(intent.reply || 'Done');

      if (intent.intent === 'add_chore') {
        const desc = intent.description || intent.note || transcript;
        const assigneeUser = intent.assigned_to_name
          ? users.find(u => u.name.toLowerCase().includes(intent.assigned_to_name.toLowerCase()))
          : null;
        const jobIdForChore = intent.job_id || (selectedId && currentScreen.startsWith('job_detail') ? selectedId : null);
        const { data: choreData, error: choreErr } = await sb.from('chores').insert({
          description: desc,
          job_id: jobIdForChore || null,
          assigned_to: assigneeUser?.id || null,
          status: 'open',
          created_at: new Date().toISOString(),
          updated_at: new Date().toISOString(),
        }).select().single();
        if (choreErr) { showToast(`Error: ${choreErr.message}`, true); return; }
        setChores(cs => [{ id: choreData.id, kind: null, job_id: jobIdForChore || null,
          assigned_to: assigneeUser?.name || null,
          label: desc, created: todayISO(), done: false }, ...cs]);
        showToast('Chore added');
      } else if (intent.intent === 'add_job') {
        const pre = {};
        if (intent.customer) pre.customer = intent.customer;
        if (intent.job_type) pre.type = intent.job_type;
        if (intent.date) pre.scheduled_date = intent.date === 'today' ? todayISO() : intent.date;
        if (intent.note) pre.notes = intent.note;
        setVoicePreFill(pre);
        setAdding(true);
      } else if (intent.intent === 'navigate') {
        const match = jobs.find(j =>
          intent.job_id ? j.id === intent.job_id :
          intent.customer ? j.customer.toLowerCase().includes(intent.customer.toLowerCase()) : false
        );
        if (match) setSelectedId(match.id);
        else showToast(`No job found for "${intent.customer}"`, true);
      } else if (intent.intent === 'search') {
        setSearch(intent.query || intent.customer || '');
        setSelectedId(null);
      } else if (intent.intent === 'update_status' && intent.status) {
        const match = jobs.find(j =>
          intent.job_id ? j.id === intent.job_id :
          intent.customer ? j.customer.toLowerCase().includes(intent.customer.toLowerCase()) : false
        );
        if (match) await updateJob(match.id, { status: intent.status });
        else showToast(`No job found for "${intent.customer}"`, true);
      } else if (intent.intent === 'add_note') {
        const noteContent = intent.note || transcript;
        const match = jobs.find(j =>
          intent.job_id ? j.id === intent.job_id :
          selectedId ? j.id === selectedId :
          intent.customer ? j.customer.toLowerCase().includes(intent.customer.toLowerCase()) : false
        );
        if (match) {
          const todayStart = todayISO() + 'T00:00:00';
          const todayEnd   = todayISO() + 'T23:59:59';
          const { data: existing } = await sb.from('job_notes')
            .select('id, content').eq('job_id', match.id).eq('source', 'voice')
            .gte('created_at', todayStart).lte('created_at', todayEnd)
            .order('created_at', { ascending: false }).limit(1).maybeSingle();
          if (existing) {
            await sb.from('job_notes').update({ content: existing.content + ' ' + noteContent }).eq('id', existing.id);
            showToast('Note updated');
          } else {
            await sb.from('job_notes').insert({
              job_id: match.id, content: noteContent,
              source: 'voice', created_at: new Date().toISOString(),
            });
            showToast('Note added');
          }
          if (selectedId === match.id) refresh();
        } else {
          showToast(`No job found — note not saved`, true);
        }
      }
    } catch(err) {
      showToast('Voice command failed', true);
      console.error('voice error', err);
    }
  }

  function selectUser(user) {
    localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(user));
    setCurrentUser(user);
    setClockSession(loadClockSession(user.id));
    setBrowseMode(false);
  }
  function switchUser() {
    localStorage.removeItem(CURRENT_USER_KEY);
    setCurrentUser(null);
    setClockSession(null);
    setBrowseMode(false);
  }

  const refresh = useCallback(async () => {
    const [jobData, choreData, userData] = await Promise.all([fetchJobs(), fetchChores(), fetchUsers()]);
    if (jobData === null) {
      showToast("Can't reach Supabase — showing cached data", true);
    } else {
      setRlsWarning(jobData.length === 0);
      setJobs(jobData);
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(jobData)); } catch(e){}
    }
    setChores(choreData);
    if (userData) setUsers(userData);
    setLoading(false);
  }, []);

  useEffect(() => {
    if (!currentUser) return;
    refresh();
    window.addEventListener('focus', refresh);
    const timer = setInterval(refresh, 60000); // auto-refresh every 60s
    return () => { window.removeEventListener('focus', refresh); clearInterval(timer); };
  }, [currentUser, refresh]);

  // On fresh app open, jump straight to the job the tech is currently on
  useEffect(() => {
    if (!currentUser) return;
    if (clockSession?.jobId) {
      setSelectedId(clockSession.jobId);
    } else {
      fetchActiveCrewAssignments().then(assignments => {
        const mine = assignments.find(a => a.user_id === currentUser.id && (a.status === 'On Site' || a.status === 'In Route'));
        if (mine) setSelectedId(mine.job_id);
      });
    }
    fetchUnreadNotifications(currentUser.id).then(notifs => {
      if (notifs.length > 0) setPendingNotifs(notifs);
    });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [currentUser]);

  // Check for orphaned crew session (localStorage cleared while still clocked in)
  useEffect(() => {
    if (!currentUser?.id || clockSession) { setOrphanCrewEntry(null); return; }
    sb.from('job_crew').select('job_id, status, status_at')
      .eq('user_id', currentUser.id).limit(1).maybeSingle()
      .then(({ data }) => setOrphanCrewEntry(data || null));
  }, [currentUser?.id, !!clockSession]);

  async function dismissNotifs() {
    if (!currentUser?.id) return;
    await sb.from('notifications').update({ read: true })
      .eq('user_id', currentUser.id).eq('read', false);
    setPendingNotifs([]);
  }

  /* ── Clock in/out ── */
  async function undoClockAction() {
    if (!clockUndo) return;
    const { prevSession, restore, clear } = clockUndo;
    for (const { jobId, status } of (restore || [])) await upsertJobCrewStatus(jobId, currentUser.id, status);
    for (const { jobId } of (clear || [])) await clearJobCrewStatus(jobId, currentUser.id);
    saveClockSession(currentUser.id, prevSession);
    setClockSession(prevSession);
    setClockUndo(null);
  }

  async function clockIn(jobId, status) {
    try {
      const at = new Date().toISOString();
      const crewResult = await upsertJobCrewStatus(jobId, currentUser.id, status);
      if (!crewResult) { showToast('Could not save crew status — check connection', true); return; }
      const job = jobs.find(j => j.id === jobId);
      const wIdx = s => WORKFLOW_STATUSES.indexOf(s);
      if (job && job.customer?.toUpperCase() !== 'TMC SHOP' && wIdx(job.status) < wIdx('In Progress')) {
        await updateJob(jobId, { status: 'In Progress', _skipNote: true });
      }
      await sb.from('job_notes').insert({
        job_id: jobId, content: `Status → ${status} (${currentUser.name})`,
        source: 'system', created_at: at, user_id: currentUser.id,
      });
      const session = { jobId, status, startedAt: at };
      setClockUndo({ prevSession: null, restore: [], clear: [{ jobId }] });
      saveClockSession(currentUser.id, session);
      setClockSession(session);
      setShowClockIn(false);
      setSelectedId(jobId);
    } catch(e) {
      showToast('Clock in failed — ' + (e.message || 'check connection'), true);
    }
  }

  async function clockOut(jobStatus) {
    if (!clockSession) return;
    const { jobId, startedAt } = clockSession;
    const undo = { prevSession: clockSession, restore: jobId ? [{ jobId, status: clockSession.status }] : [], clear: [] };
    if (jobId) {
      await clearJobCrewStatus(jobId, currentUser.id);
      if (jobStatus) await updateJob(jobId, { status: jobStatus, _skipNote: true });
      const at = new Date().toISOString();
      await sb.from('job_notes').insert({
        job_id: jobId, content: `Status → Cleared (${currentUser.name})`,
        source: 'system', created_at: at, user_id: currentUser.id,
      });
      const remaining = await fetchJobCrew(jobId);
      const stillOnSite = remaining.filter(c => c.status === 'On Site');
      const othersOnSite = users.filter(u => u.id !== currentUser.id && stillOnSite.find(c => c.user_id === u.id));
      const shopJob = jobs.find(j => j.customer?.toUpperCase() === 'TMC SHOP' && j.status !== 'Closed');
      if (othersOnSite.length > 0) setLeavingCrewCheck({ members: othersOnSite, newJobId: shopJob?.id || null, oldJobId: jobId });
    }
    addTodayMs(currentUser.id, Date.now() - new Date(startedAt).getTime());
    saveClockSession(currentUser.id, null);
    setClockSession(null);
    setClockUndo(undo);
    setShowClockOut(false);
  }

  async function flipToOnSite() {
    if (!clockSession?.jobId) return;
    const undo = { prevSession: clockSession, restore: [{ jobId: clockSession.jobId, status: 'In Route' }], clear: [] };
    await upsertJobCrewStatus(clockSession.jobId, currentUser.id, 'On Site');
    const job = jobs.find(j => j.id === clockSession.jobId);
    const wIdx = s => WORKFLOW_STATUSES.indexOf(s);
    if (job && wIdx(job.status) < wIdx('In Progress')) {
      await updateJob(clockSession.jobId, { status: 'In Progress', _skipNote: true });
    }
    const at = new Date().toISOString();
    await sb.from('job_notes').insert({
      job_id: clockSession.jobId, content: `Status → On Site (${currentUser.name})`,
      source: 'system', created_at: at, user_id: currentUser.id,
    });
    const session = { ...clockSession, status: 'On Site' };
    saveClockSession(currentUser.id, session);
    setClockSession(session);
    setClockUndo(undo);
  }

  async function moveToInRoute(newJobId) {
    try {
      const { jobId: oldJobId, startedAt } = clockSession;
      const undo = {
        prevSession: clockSession,
        restore: oldJobId ? [{ jobId: oldJobId, status: clockSession.status }] : [],
        clear: [{ jobId: newJobId }],
      };
      let isLastOut = false;
      const at = new Date().toISOString();
      if (oldJobId) {
        await clearJobCrewStatus(oldJobId, currentUser.id);
        await sb.from('job_notes').insert({
          job_id: oldJobId, content: `Status → Cleared (${currentUser.name})`,
          source: 'system', created_at: at, user_id: currentUser.id,
        });
        const remaining = await fetchJobCrew(oldJobId);
        const stillOnSite = remaining.filter(c => c.status === 'On Site');
        isLastOut = stillOnSite.length === 0;
        const othersOnSite = users.filter(u => u.id !== currentUser.id && stillOnSite.find(c => c.user_id === u.id));
        if (othersOnSite.length > 0) setLeavingCrewCheck({ members: othersOnSite, newJobId, oldJobId });
      }
      const ok = await upsertJobCrewStatus(newJobId, currentUser.id, 'In Route');
      if (!ok) { showToast('Could not update crew status — check connection', true); return; }
      const newJob = jobs.find(j => j.id === newJobId);
      const wIdx = s => WORKFLOW_STATUSES.indexOf(s);
      if (newJob && newJob.customer?.toUpperCase() !== 'TMC SHOP' && wIdx(newJob.status) < wIdx('In Progress')) {
        await updateJob(newJobId, { status: 'In Progress', _skipNote: true });
      }
      await sb.from('job_notes').insert({
        job_id: newJobId, content: `Status → In Route (${currentUser.name})`,
        source: 'system', created_at: at, user_id: currentUser.id,
      });
      const session = { jobId: newJobId, status: 'In Route', startedAt };
      saveClockSession(currentUser.id, session);
      setClockSession(session);
      setClockUndo(undo);
      setShowMoveJob(false);
      setSelectedId(newJobId);
      refresh();
      if (isLastOut && oldJobId) {
        const oldJob = jobs.find(j => j.id === oldJobId);
        if (oldJob) setLastLeaveJob(oldJob);
      }
    } catch(e) {
      showToast('Move failed — ' + (e.message || 'check connection'), true);
    }
  }

  /* ── CRUD ── */
  async function addJob(job) {
    const customerId = await resolveCustomer(job);
    if (!customerId) { showToast("Could not resolve customer", true); return; }
    const { data, error } = await sb.from('jobs').insert({
      ...toRow(job, customerId, currentUser?.id),
      created_at: new Date().toISOString(),
    }).select('*, customers(*)').single();
    if (error) { showToast("Error saving job", true); console.error(error); return; }
    await sb.from('job_notes').insert({
      job_id: data.id, content: `Job created. Status: ${job.status}`,
      source: 'system', created_at: new Date().toISOString(),
    });
    const newJob = fromRow(data);
    setJobs(js => [newJob, ...js]);
    setAdding(false);
    setVoicePreFill(null);
    showToast("Job saved");
    if (job.status === "Completed/Needs Billing") spawnBillingChore(newJob);
    if (routeAfterAdd) { setRouteAfterAdd(false); await moveToInRoute(data.id); }
    else setSelectedId(data.id);
  }

  async function updateJob(id, patch) {
    const job = jobs.find(j => j.id === id);
    if (!job) return;
    const updateData = { updated_at: new Date().toISOString() };
    if ('status' in patch)        updateData.current_status = patch.status;
    if ('type' in patch)          updateData.flow_type = patch.type;
    if ('original_ask' in patch)  updateData.original_ask = patch.original_ask||null;
    if ('notes' in patch)         updateData.notes = patch.notes||null;
    if ('value' in patch)         updateData.value = Number(patch.value)||null;
    if ('scheduled_date' in patch || 'scheduled_time' in patch) {
      const d = ('scheduled_date' in patch ? patch.scheduled_date : job.scheduled_date);
      const t = ('scheduled_time' in patch ? patch.scheduled_time : job.scheduled_time);
      if (d && t) { const dt = new Date(`${d}T${t}:00`); updateData.scheduled_at = isNaN(dt) ? null : dt.toISOString(); }
    }
    const { error } = await sb.from('jobs').update(updateData).eq('id', id);
    if (error) { showToast("Error updating job", true); console.error(error); return; }
    if (patch.status && patch.status !== job.status && !patch._skipNote) {
      const fieldStatuses = ["In Route", "On Site"];
      const userName = currentUser?.name || null;
      const noteContent = userName ? `Status → ${patch.status} (${userName})` : `Status → ${patch.status}`;
      const noteRow = { job_id: id, content: noteContent, source: 'system', created_at: new Date().toISOString() };
      if (currentUser?.id) noteRow.user_id = currentUser.id;
      await sb.from('job_notes').insert(noteRow);
      if (fieldStatuses.includes(patch.status) && currentUser?.id) {
        await sb.from('jobs').update({ assigned_to: currentUser.id }).eq('id', id);
      }
      if (patch.status === "Completed/Needs Billing") spawnBillingChore({ ...job, ...patch });
      if (patch.status === "Completed/Paid") setCloseJobPromptId(id);
    }
    setJobs(js => js.map(j => j.id === id ? { ...j, ...patch } : j));
  }

  async function saveEdit(edited) {
    const customerId = await resolveCustomer(edited);
    if (!customerId) { showToast("Could not resolve customer", true); return; }
    const { error } = await sb.from('jobs').update(toRow(edited, customerId, currentUser?.id)).eq('id', edited.id);
    if (error) { showToast("Error saving changes", true); console.error(error); return; }
    setJobs(js => js.map(j => j.id === edited.id ? { ...j, ...edited, _customer_id: customerId } : j));
    setEditingId(null);
    showToast("Changes saved");
    if (edited.status === "Completed/Needs Billing") spawnBillingChore({ ...edited, _customer_id: customerId });
  }

  async function deleteJob(id) {
    const { error } = await sb.from('jobs').delete().eq('id', id);
    if (error) { showToast("Error deleting job", true); console.error(error); return; }
    setJobs(js => js.filter(j => j.id !== id));
    setChores(cs => cs.filter(c => c.job_id !== id));
    setSelectedId(null);
    showToast("Job deleted");
  }

  async function toggleChore(choreId) {
    const chore = chores.find(c => c.id === choreId);
    if (!chore) return;
    const newStatus = chore.done ? 'open' : 'done';
    const { error } = await sb.from('chores')
      .update({ status: newStatus, updated_at: new Date().toISOString() }).eq('id', choreId);
    if (error) { showToast("Error updating chore", true); return; }
    setChores(cs => cs.map(c => c.id === choreId ? { ...c, done: !chore.done } : c));
    // Billing chore checked off → ask if paid first
    if (!chore.done && chore.kind === 'billing' && chore.job_id) {
      setBillingPaidPromptId(chore.job_id);
    }
  }

  async function editChore(choreId, fields) {
    const { error } = await sb.from('chores').update({
      description: fields.description,
      job_id: fields.job_id || null,
      assigned_to: fields.assigned_to || null,
      updated_at: new Date().toISOString(),
    }).eq('id', choreId);
    if (error) { showToast(`Error: ${error.message}`, true); return; }
    setChores(cs => cs.map(c => c.id === choreId ? {
      ...c, label: fields.description, job_id: fields.job_id || null, assigned_to: fields.assigned_to || null,
    } : c));
    showToast('Chore updated');
  }

  async function spawnBillingChore(job) {
    if (chores.some(c => c.job_id === job.id && c.kind === 'billing')) return;
    const tyler = users.find(u => u.name && u.name.toLowerCase() === 'tyler');
    const { data, error } = await sb.from('chores').insert({
      description: `Create bill for ${job.customer}`,
      job_id: job.id,
      assigned_to: tyler?.id || null,
      priority: 'billing', status: 'open',
      created_at: new Date().toISOString(), updated_at: new Date().toISOString(),
    }).select().single();
    if (error) { showToast(`Chore error: ${error.message}`, true); console.error('spawnBillingChore', error); return; }
    if (data) {
      setChores(cs => [{
        id: data.id, kind:'billing', job_id: job.id, assigned_to: tyler?.id || null,
        label: `Create bill for ${job.customer}`, created: todayISO(), done: false,
      }, ...cs]);
      showToast("Billing chore created → assigned to Tyler");
    }
  }

  function openJobPhotos(jobId) {
    setSelectedId(jobId);
    setFocusPhotos(true);
  }

  function fixOldStatuses() {
    const MAP = {
      "Needs Billing":"Completed/Needs Billing","Paid":"Completed/Paid",
      "Completed":"Completed/Needs Billing","Estimate Scheduled":"Evaluation Needed",
      "Estimate Given":"Waiting on Approval",
    };
    let changed = 0;
    const next = jobs.map(j => { if (MAP[j.status]) { changed++; return {...j,status:MAP[j.status]}; } return j; });
    setJobs(next);
    Promise.all(next.filter((_,i) => MAP[jobs[i]?.status]).map(j =>
      sb.from('jobs').update({ current_status:j.status }).eq('id',j.id)
    )).then(() => setTimeout(() => alert(changed > 0 ? `Updated ${changed} job(s).` : "No old statuses found."), 50));
  }

  function exportJobs() {
    const payload = { jobs, chores, exported: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(payload,null,2)], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `tmc-jobs-${todayISO()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  function importJobs() {
    const input = document.createElement("input");
    input.type = "file"; input.accept = ".json";
    input.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      let payload;
      try { payload = JSON.parse(await file.text()); } catch {
        showToast("Invalid JSON file", true); return;
      }
      const importList = payload.jobs || [];
      const choreList  = payload.chores || [];
      if (!importList.length && !choreList.length) {
        showToast("Nothing to import", true); return;
      }
      showToast(`Importing ${importList.length} jobs…`);
      let ok = 0, fail = 0, firstErr = null;
      for (const job of importList) {
        // resolve or create customer
        const name = (job.customer||'').trim();
        let customerId = null;
        if (name) {
          const { data: ex } = await sb.from('customers').select('id').ilike('name', name).limit(1).maybeSingle();
          if (ex) {
            customerId = ex.id;
          } else {
            const addr = job.customer_address || job.address || null;
            const { data: nc, error: ce } = await sb.from('customers').insert({
              name, phone: job.phone||null, address: addr,
              created_at: new Date().toISOString(), updated_at: new Date().toISOString(),
            }).select('id').single();
            if (ce) {
              fail++;
              if (!firstErr) firstErr = `Customer insert: ${ce.message||JSON.stringify(ce)}`;
              console.error('import customer error', ce, job);
              continue;
            }
            customerId = nc.id;
          }
        }
        if (!customerId) { fail++; if (!firstErr) firstErr = `No customer name for job: ${job.id}`; continue; }

        const { data, error } = await sb.from('jobs').insert({
          ...toRow(job, customerId, currentUser?.id),
          created_at: new Date().toISOString(),
        }).select('id').single();
        if (error) {
          fail++;
          if (!firstErr) firstErr = `Job insert: ${error.message||JSON.stringify(error)}`;
          console.error('import job error', error, job);
          continue;
        }
        for (const h of (job.history || [])) {
          await sb.from('job_notes').insert({
            job_id: data.id, content: h.note,
            source: 'user',
            created_at: h.date ? new Date(h.date).toISOString() : new Date().toISOString(),
          });
        }
        ok++;
      }
      for (const chore of choreList) {
        await sb.from('chores').insert({
          description: chore.label || chore.description || '',
          status: chore.done ? 'done' : 'open',
          priority: chore.kind || null,
          created_at: new Date().toISOString(),
        });
      }
      if (firstErr) showToast(`Failed: ${firstErr}`, true);
      else showToast(`Imported ${ok} job${ok!==1?'s':''}${fail ? `, ${fail} failed` : ''}`);
      await refresh();
    };
    input.click();
  }

  /* ── Render ── */
  if (!deviceAuthorized) return <PassphraseGate onAuthorize={authorizeDevice} />;
  if (!currentUser) return <Splash onSelect={selectUser} />;
  if (!clockSession && !browseMode) {
    if (orphanCrewEntry) {
      const orphanJob = jobs.find(j => j.id === orphanCrewEntry.job_id);
      return (
        <React.Fragment>
          <div style={{ position:"fixed", inset:0, zIndex:200, display:"flex", flexDirection:"column",
            alignItems:"center", justifyContent:"center", gap:16, padding:32, background:"var(--bg)" }}>
            <div className="head" style={{ fontSize:24, fontWeight:700 }}>
              TMC <span style={{ color:"var(--brass-bright)" }}>MECHANICAL</span>
            </div>
            <div className="mono" style={{ fontSize:12, color:"var(--muted)", letterSpacing:"0.1em" }}>{currentUser.name}</div>
            <div style={{ height:16 }} />
            <div style={{ padding:20, background:"var(--panel)", border:"1px solid var(--olive)", borderRadius:12,
              width:"100%", maxWidth:340, textAlign:"center" }}>
              <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginBottom:8 }}>LOOKS LIKE YOU WERE STILL CLOCKED IN</div>
              <div className="head" style={{ fontSize:18, fontWeight:700, color:"var(--green)" }}>
                {orphanJob ? orphanJob.customer : 'Unknown Job'}
              </div>
              <div className="mono" style={{ fontSize:12, color:"var(--muted)", marginTop:4 }}>
                {orphanCrewEntry.status.toUpperCase()}
              </div>
            </div>
            <button onClick={() => {
              const session = { jobId: orphanCrewEntry.job_id, status: orphanCrewEntry.status, startedAt: orphanCrewEntry.status_at };
              saveClockSession(currentUser.id, session);
              setClockSession(session);
              setOrphanCrewEntry(null);
              if (orphanCrewEntry.job_id) setSelectedId(orphanCrewEntry.job_id);
            }} className="head"
              style={{ width:"100%", maxWidth:340, padding:18, fontSize:16, fontWeight:700, borderRadius:12,
                background:"var(--olive-bright)", color:"var(--bg)", border:"none" }}>
              RESUME SESSION
            </button>
            <button onClick={async () => {
              if (orphanCrewEntry.job_id) await clearJobCrewStatus(orphanCrewEntry.job_id, currentUser.id);
              setOrphanCrewEntry(null);
            }} className="head"
              style={{ width:"100%", maxWidth:340, padding:14, fontSize:14, fontWeight:700, borderRadius:12,
                background:"var(--panel)", border:"1px solid var(--line)", color:"var(--muted)" }}>
              I ALREADY CLOCKED OUT
            </button>
          </div>
          {toast && <Toast msg={toast.msg} isError={toast.isError} />}
        </React.Fragment>
      );
    }
    if (showClockIn) return (
      <React.Fragment>
        <ClockInSheet jobs={jobs} onConfirm={clockIn} onClose={() => setShowClockIn(false)} />
        {toast && <Toast msg={toast.msg} isError={toast.isError} />}
      </React.Fragment>
    );
    return (
      <React.Fragment>
        <ClockGate userName={currentUser.name} onClockIn={() => setShowClockIn(true)} onBrowse={() => setBrowseMode(true)} onUndo={clockUndo ? undoClockAction : null} />
        {toast && <Toast msg={toast.msg} isError={toast.isError} />}
      </React.Fragment>
    );
  }

  const selected = jobs.find(j => j.id === selectedId);
  if (adding) return (
    <React.Fragment>
      <JobForm onSave={addJob} onCancel={() => { setAdding(false); setVoicePreFill(null); }} prefill={voicePreFill} allJobs={jobs} />
      {toast && <Toast msg={toast.msg} isError={toast.isError} />}
      <VoiceButton onCommand={processVoiceCommand} />
    </React.Fragment>
  );
  if (editingId) {
    const editJob = jobs.find(j => j.id === editingId);
    if (editJob) return (
      <React.Fragment>
        <JobForm initial={editJob} onSave={saveEdit} onCancel={() => setEditingId(null)} allJobs={jobs} />
        {toast && <Toast msg={toast.msg} isError={toast.isError} />}
        <VoiceButton onCommand={processVoiceCommand} />
      </React.Fragment>
    );
  }
  if (selected) return (
    <React.Fragment>
      <JobDetail job={selected}
        onBack={() => { setSelectedId(null); setFocusPhotos(false); }}
        onUpdate={(patch) => updateJob(selected.id, patch)}
        onEdit={() => setEditingId(selected.id)}
        onDelete={() => deleteJob(selected.id)}
        focusPhotos={focusPhotos}
        currentUser={currentUser}
        users={users}
        jobs={jobs}
        browseMode={browseMode}
        clockSession={clockSession}
        onFlipToOnSite={flipToOnSite}
        onLeaving={() => setShowLeaving(true)}
        clockUndo={clockUndo}
        onUndoClock={undoClockAction}
        getTodayMs={() => getTodayMs(currentUser.id)}
        onJobSelect={setSelectedId}
        showToast={showToast}
        onDuplicate={() => {
          setVoicePreFill({
            customer: selected.customer,
            site_address: selected.site_address,
            type: selected.type,
            original_ask: selected.original_ask,
            status: 'New',
          });
          setSelectedId(null);
          setAdding(true);
        }} />
      {showLeaving && clockSession && (
        <LeavingSheet clockSession={clockSession} jobs={jobs}
          onInRoute={() => { setShowLeaving(false); setShowMoveJob(true); }}
          onClockOut={() => { setShowLeaving(false); setShowClockOut(true); }}
          onClose={() => setShowLeaving(false)} />
      )}
      {showClockOut && clockSession && (
        <ClockOutSheet clockSession={clockSession} jobs={jobs} onClockOut={clockOut} onClose={() => setShowClockOut(false)} />
      )}
      {showMoveJob && clockSession && (
        <MoveJobSheet clockSession={clockSession} jobs={jobs} onMove={moveToInRoute} onClose={() => setShowMoveJob(false)}
          onNewJob={() => { setShowMoveJob(false); setRouteAfterAdd(true); setAdding(true); }} />
      )}
      {lastLeaveJob && (
        <LastLeaveSheet job={lastLeaveJob} onPick={async s => {
          await updateJob(lastLeaveJob.id, { status: s, _skipNote: true });
          setLastLeaveJob(null);
        }} onClose={() => setLastLeaveJob(null)} />
      )}
      {leavingCrewCheck && leavingCrewCheck.members.length > 0 && (() => {
        const person = leavingCrewCheck.members[0];
        const rest = leavingCrewCheck.members.slice(1);
        const advance = () => rest.length > 0
          ? setLeavingCrewCheck({ ...leavingCrewCheck, members: rest })
          : setLeavingCrewCheck(null);
        return (
          <Sheet title="CREW CHECK" onClose={() => setLeavingCrewCheck(null)}>
            <div className="mono" style={{ fontSize:15, color:"var(--text)", marginBottom:20 }}>
              Is {person.name} coming with you?
            </div>
            <div style={{ display:"flex", gap:12 }}>
              <button onClick={async () => {
                const { newJobId, oldJobId } = leavingCrewCheck;
                const at = new Date().toISOString();
                await clearJobCrewStatus(oldJobId, person.id);
                if (newJobId) {
                  await upsertJobCrewStatus(newJobId, person.id, 'In Route');
                  const newJob = jobs.find(j => j.id === newJobId);
                  await sb.from('job_notes').insert({
                    job_id: newJobId, content: `Status → In Route (${person.name}) — with ${currentUser.name}`,
                    source: 'system', created_at: at, user_id: currentUser.id,
                  });
                  await sb.from('notifications').insert({
                    user_id: person.id,
                    message: `${currentUser.name} marked you In Route to ${newJob?.customer || 'a job'}`,
                    read: false, created_at: at,
                  });
                }
                advance();
                refresh();
              }} className="head"
                style={{ flex:1, padding:14, fontSize:15, fontWeight:700, borderRadius:10,
                  background:"var(--olive-bright)", color:"var(--bg)", border:"none" }}>
                YES
              </button>
              <button onClick={advance} className="head"
                style={{ flex:1, padding:14, fontSize:15, fontWeight:700, borderRadius:10,
                  background:"var(--panel)", border:"1px solid var(--line)", color:"var(--muted)" }}>
                NO — STAYING
              </button>
            </div>
          </Sheet>
        );
      })()}
      {billingPaidPromptId && (() => {
        const bpJob = jobs.find(j => j.id === billingPaidPromptId);
        return (
          <Sheet title="IS THIS PAID?" onClose={() => setBillingPaidPromptId(null)}>
            <div className="mono" style={{ fontSize:14, color:"var(--text)", marginBottom:20 }}>
              Has {bpJob?.customer || 'this job'} paid the bill?
            </div>
            <div style={{ display:"flex", gap:12 }}>
              <button onClick={async () => {
                setBillingPaidPromptId(null);
                await updateJob(billingPaidPromptId, { status: 'Completed/Paid' });
              }} className="head"
                style={{ flex:1, padding:16, fontSize:16, fontWeight:700, borderRadius:10,
                  background:"var(--olive-bright)", color:"var(--bg)", border:"none" }}>
                YES — PAID
              </button>
              <button onClick={async () => {
                setBillingPaidPromptId(null);
                await updateJob(billingPaidPromptId, { status: 'Billed/Waiting for Payment' });
              }} className="head"
                style={{ flex:1, padding:16, fontSize:16, fontWeight:700, borderRadius:10,
                  background:"var(--panel)", border:"1px solid var(--line)", color:"var(--muted)" }}>
                NO — WAITING
              </button>
            </div>
          </Sheet>
        );
      })()}
      {closeJobPromptId && (
        <CloseJobSheet jobId={closeJobPromptId} jobs={jobs} users={users}
          onConfirm={async () => {
            await updateJob(closeJobPromptId, { status: 'Closed' });
            setCloseJobPromptId(null);
            setSelectedId(null);
          }}
          onClose={() => setCloseJobPromptId(null)}
          showToast={showToast} />
      )}
      {toast && <Toast msg={toast.msg} isError={toast.isError} />}
      <VoiceButton onCommand={processVoiceCommand} />
    </React.Fragment>
  );

  const isActive = s => s !== "Completed/Paid" && s !== "Closed";
  const usedStatuses = STATUSES.filter(s => s !== "Closed" && jobs.some(j => j.status === s));
  const hasClosed = jobs.some(j => j.status === "Closed");
  const FILTERS = [...usedStatuses, "All", ...(hasClosed ? ["Closed"] : [])];
  const effectiveFilter = filter ?? usedStatuses[0] ?? "All";
  const q = search.trim().toLowerCase();

  function matchesSearch(j) {
    if (!q) return true;
    if (j.status === "Closed" && !searchClosed) return false;
    const hay = [j.customer, j.phone, j.notes, custAddr(j), siteAddr(j), j.location]
      .filter(Boolean).join(" ").toLowerCase();
    return hay.includes(q);
  }

  const shown = q ? jobs.filter(matchesSearch) : jobs.filter(j => effectiveFilter === "All" ? j.status !== "Closed" : j.status === effectiveFilter);
  const outstanding = jobs.filter(j => isActive(j.status)).reduce((s,j) => s + Number(j.value||0), 0);

  return (
    <div className="fade-in">
      {/* Header */}
      <div style={{ padding:"18px 16px 14px", borderBottom:"1px solid var(--line)", background:"var(--panel)" }}>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
          <div>
            <div className="head" style={{ fontSize:22, fontWeight:700, lineHeight:1 }}>
              TMC <span style={{ color:"var(--brass-bright)" }}>MECHANICAL</span>
            </div>
            <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginTop:4, letterSpacing:"0.1em" }}>FIELD JOB TRACKER</div>
          </div>
          <div style={{ textAlign:"right" }}>
            <div className="mono" style={{ fontSize:10, color:"var(--muted)" }}>OUTSTANDING</div>
            <div className="head" style={{ fontSize:20, fontWeight:700, color:"var(--olive-bright)" }}>{money(outstanding)}</div>
          </div>
        </div>
        {/* User indicator */}
        <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:10 }}>
          <div className="mono" style={{ fontSize:11, color:"var(--muted)", letterSpacing:"0.08em" }}>LOGGED IN AS:</div>
          <div className="head" style={{ fontSize:13, fontWeight:600, color:"var(--olive-bright)" }}>{currentUser.name}</div>
          <button onClick={switchUser} className="mono"
            style={{ marginLeft:"auto", fontSize:11, color:"var(--muted)", padding:"3px 8px", border:"1px solid var(--line)", borderRadius:5 }}>
            SWITCH
          </button>
          <button onClick={refresh} className="mono"
            style={{ fontSize:11, color:"var(--muted)", padding:"3px 8px", border:"1px solid var(--line)", borderRadius:5 }}>
            ↺
          </button>
          <button onClick={() => setShowCapCalc(true)} className="mono"
            style={{ fontSize:11, color:"var(--muted)", padding:"3px 8px", border:"1px solid var(--line)", borderRadius:5 }}
            title="Capacitor Calculator">
            μF
          </button>
          <button onClick={() => setShowSettings(true)} className="mono"
            style={{ fontSize:11, color:"var(--muted)", padding:"3px 8px", border:"1px solid var(--line)", borderRadius:5 }}>
            ⚙
          </button>
          <button onClick={lockDevice} className="mono"
            style={{ fontSize:11, color:"var(--error,#c0392b)", padding:"3px 8px", border:"1px solid var(--error,#c0392b)", borderRadius:5 }}>
            🔒
          </button>
          <div className="mono" style={{ fontSize:10, color:"var(--muted)", marginLeft:2 }}>r{APP_REV}</div>
        </div>
        {/* Clock status bar */}
        {clockSession && (() => {
          const clockJob = clockSession.jobId ? jobs.find(j => j.id === clockSession.jobId) : null;
          return (
            <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:8, padding:"8px 12px",
              background:"var(--panel-2)", borderRadius:8, border:"1px solid var(--olive)" }}>
              <div>
                <div className="head" style={{ fontSize:12, fontWeight:700, color:"var(--green)", lineHeight:1.2 }}>
                  {clockJob ? clockJob.customer : 'SHOP'}
                </div>
                <div className="mono" style={{ fontSize:10, color: clockSession.status === 'On Site' ? "var(--green)" : "var(--muted)", marginTop:2 }}>
                  {clockSession.status.toUpperCase()}
                </div>
              </div>
              <ClockTimer startedAt={clockSession.startedAt} todayMs={getTodayMs(currentUser.id)} />
              {clockSession.jobId && (
                <button onClick={clockSession.status === 'In Route' ? flipToOnSite : undefined} className="head"
                  style={{ fontSize:11, fontWeight:700, padding:"4px 10px", borderRadius:5,
                    background: clockSession.status === 'On Site' ? "var(--olive-bright)" : "var(--panel)",
                    color: clockSession.status === 'On Site' ? "var(--bg)" : "var(--text)",
                    border: clockSession.status === 'On Site' ? "none" : "1px solid var(--line)",
                    cursor: clockSession.status === 'On Site' ? "default" : "pointer" }}>
                  ON SITE
                </button>
              )}
              <button onClick={() => setShowLeaving(true)} className="head"
                style={{ marginLeft:"auto", fontSize:11, fontWeight:700, padding:"4px 10px", borderRadius:5,
                  background:"var(--panel)", border:"1px solid var(--line)", color:"var(--text)" }}>
                LEAVING THIS JOB
              </button>
              {clockUndo && (
                <button onClick={undoClockAction} className="head"
                  style={{ padding:"6px 14px", borderRadius:20, flexShrink:0,
                    background:"var(--olive-bright)", border:"2px solid var(--olive)",
                    color:"var(--bg)", fontSize:13, fontWeight:700 }}>
                  UNDO
                </button>
              )}
            </div>
          );
        })()}
        {browseMode && (
          <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:8, padding:"6px 12px",
            background:"var(--panel-2)", borderRadius:8, border:"1px solid var(--line)" }}>
            <div className="mono" style={{ fontSize:11, color:"var(--muted)", letterSpacing:"0.08em" }}>AFTER HOURS BROWSING</div>
            <button onClick={() => setBrowseMode(false)} className="head"
              style={{ marginLeft:"auto", fontSize:11, fontWeight:700, padding:"4px 10px", borderRadius:5,
                background:"var(--panel)", border:"1px solid var(--line)", color:"var(--muted)" }}>
              EXIT BROWSE
            </button>
          </div>
        )}
      </div>

      {/* empty state — not an error */}
      {rlsWarning && !loading && (
        <div style={{ margin:"12px 16px 0", padding:"10px 14px", background:"var(--panel)",
          border:"1px solid var(--olive)", borderRadius:8, fontSize:13, color:"var(--muted)",
          textAlign:"center" }}>
          No jobs yet — tap + to add the first one.
        </div>
      )}

      {/* Loading */}
      {loading && (
        <div className="mono" style={{ textAlign:"center", color:"var(--muted)", padding:"40px 0", fontSize:13, letterSpacing:"0.1em" }}>
          LOADING…
        </div>
      )}

      {!loading && (
        <React.Fragment>
          {/* Two-pill header: RECENTLY VIEWED | SEARCH */}
          <div style={{ display:"flex", gap:8, padding:"12px 16px 0" }}>
            <button onClick={() => { setRecentsOpen(true); setSearchActive(false); setSearch(""); }} className="head"
              style={{ flex:1, padding:"10px 0", borderRadius:7, fontSize:14, fontWeight:700,
                background: recentsOpen && !searchActive ? "var(--olive-bright)" : "var(--panel)",
                color: recentsOpen && !searchActive ? "var(--bg)" : "var(--muted)",
                border:`1px solid ${recentsOpen && !searchActive ? "var(--olive-bright)" : "var(--line)"}` }}>
              RECENTLY VIEWED
            </button>
            <button onClick={() => { setSearchActive(true); setRecentsOpen(false); }} className="head"
              style={{ flex:1, padding:"10px 0", borderRadius:7, fontSize:14, fontWeight:700,
                background: searchActive || q ? "var(--olive-bright)" : "var(--panel)",
                color: searchActive || q ? "var(--bg)" : "var(--muted)",
                border:`1px solid ${searchActive || q ? "var(--olive-bright)" : "var(--line)"}` }}>
              🔍 SEARCH
            </button>
          </div>

          {/* Search input — only visible when search mode active */}
          {(searchActive || q) && (
            <div style={{ padding:"8px 16px 0" }}>
              <div style={{ position:"relative" }}>
                <input ref={searchInputRef} type="text" value={search} autoFocus={searchActive && !q}
                  onChange={e => setSearch(e.target.value)}
                  onBlur={() => { if (!search) { setSearchActive(false); } }}
                  placeholder="Search customers, addresses, sites, notes…"
                  style={{ paddingLeft:38 }} />
                <span style={{ position:"absolute", left:12, top:"50%", transform:"translateY(-50%)",
                  fontSize:15, color:"var(--muted)", pointerEvents:"none" }}>🔍</span>
                {search && (
                  <button onClick={() => { setSearch(""); setSearchActive(false); setRecentsOpen(false); }}
                    style={{ position:"absolute", right:10, top:"50%", transform:"translateY(-50%)",
                      fontSize:16, color:"var(--muted)", padding:4 }}>✕</button>
                )}
              </div>
            </div>
          )}

          {/* Recents panel */}
          {recentsOpen && !searchActive && !q && recentJobs.length > 0 && (
            <div className="fade-in" style={{
              margin:"4px 16px 0", borderRadius:10, overflow:"hidden",
              border:"1px solid var(--line)", background:"var(--panel-2)",
              boxShadow:"0 6px 20px rgba(0,0,0,0.5)",
            }}>
              <div style={{ padding:"10px 14px", borderBottom:"1px solid var(--line)" }}>
                <span className="head" style={{ fontSize:13, fontWeight:700, color:"var(--muted)", letterSpacing:"0.08em" }}>RECENTLY VIEWED</span>
              </div>
              {recentJobs.map(r => {
                const live = jobs.find(j => j.id === r.id);
                const display = live || r;
                return (
                  <button key={r.id} onClick={() => { setRecentsOpen(false); setSelectedId(r.id); }}
                    style={{ display:"flex", flexDirection:"column", width:"100%", padding:"13px 14px",
                      borderBottom:"1px solid var(--line)", textAlign:"left", background:"transparent",
                      color:"var(--text)", gap:4 }}>
                    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", gap:8 }}>
                      <span className="head" style={{ fontSize:16, fontWeight:700, color:"var(--text)" }}>{display.customer || r.customer}</span>
                      <span className="head" style={{ fontSize:13, color:"var(--text)", whiteSpace:"nowrap" }}>{display.status || r.status}</span>
                    </div>
                    <div className="mono" style={{ fontSize:13, color:"var(--text)" }}>
                      {display.type || r.type}{(display.site || r.site) ? ` · ${display.site || r.site}` : ''}
                    </div>
                  </button>
                );
              })}
            </div>
          )}

          {/* Include-closed toggle — only while searching */}
          {q && (
            <button onClick={() => setSearchClosed(v => !v)} className="fade-in"
              style={{ display:"flex", alignItems:"center", gap:8, padding:"10px 16px 0", textAlign:"left" }}>
              <span style={{ width:38, height:22, borderRadius:11, flexShrink:0, position:"relative",
                background: searchClosed ? "var(--olive-bright)" : "var(--line)", transition:"background 0.15s" }}>
                <span style={{ position:"absolute", top:3, left: searchClosed ? 19 : 3,
                  width:16, height:16, borderRadius:"50%", background:"var(--bg)", transition:"left 0.15s" }}></span>
              </span>
              <span style={{ fontSize:13, color:"var(--muted)" }}>Include closed jobs</span>
            </button>
          )}
          {!q && (
            <div style={{ display:"flex", gap:8, padding:"12px 16px", overflowX:"auto" }}>
              {FILTERS.map(f => {
                const count = f === "All" ? jobs.length : jobs.filter(j => j.status === f).length;
                return (
                  <button key={f} onClick={() => setFilter(f)} className="head"
                    style={{ fontSize:13, fontWeight:600, padding:"7px 16px", borderRadius:6, flexShrink:0,
                      border:`1px solid ${effectiveFilter===f ? "var(--olive-bright)" : "var(--line)"}`,
                      color: effectiveFilter===f ? "var(--bg)" : "var(--muted)",
                      background: effectiveFilter===f ? "var(--olive-bright)" : "transparent" }}>
                    {f} ({count})
                  </button>
                );
              })}
            </div>
          )}

          {/* Chores strip — collapsible */}
          {!q && chores.filter(c => !c.done).length > 0 && (
            <div style={{ margin:"4px 16px 0", background:"var(--panel-2)", border:"1px solid var(--brass)", borderRadius:10, overflow:"hidden" }}>
              <button onClick={() => setChoresExpanded(v => !v)}
                style={{ display:"flex", width:"100%", alignItems:"center", justifyContent:"space-between", padding:"12px 14px", textAlign:"left" }}>
                <span className="mono" style={{ fontSize:12, color:"var(--brass-bright)", letterSpacing:"0.08em" }}>
                  ⚑ {chores.filter(c=>!c.done).length} CHORE{chores.filter(c=>!c.done).length>1?"S":""}
                </span>
                <span style={{ color:"var(--brass)", fontSize:13 }}>{choresExpanded?"▲":"▼"}</span>
              </button>
              {choresExpanded && (
                <div className="fade-in" style={{ padding:"0 14px 10px" }}>
                  {chores.filter(c=>!c.done).map(c => (
                    <div key={c.id} style={{ display:"flex", width:"100%", alignItems:"center", gap:10, padding:"8px 0", borderTop:"1px solid var(--line)" }}>
                      <button onClick={() => toggleChore(c.id)} style={{ flexShrink:0 }}>
                        <span style={{ display:"block", width:18, height:18, borderRadius:4, border:"1.5px solid var(--brass)" }}></span>
                      </button>
                      <button onClick={() => c.job_id ? openJobPhotos(c.job_id) : null}
                        style={{ flex:1, textAlign:"left", fontSize:14, color: c.job_id ? "var(--text)" : "var(--muted)" }}>
                        {c.label}{c.job_id ? " →" : ""}
                      </button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* Job list */}
          <div style={{ padding:"12px 16px 120px" }}>
            {shown.length === 0 && !rlsWarning && (
              <div style={{ textAlign:"center", color:"var(--muted)", padding:"40px 0" }} className="mono">
                {q ? `NO MATCHES FOR "${search.trim().toUpperCase()}"` : "NO JOBS HERE"}
              </div>
            )}
            {(() => {
              // Group by customer name, preserving order of first appearance
              const groups = [];
              const groupMap = {};
              for (const j of shown) {
                const key = j.customer || '';
                if (!groupMap[key]) {
                  const g = { customer: key, jobs: [] };
                  groupMap[key] = g;
                  groups.push(g);
                }
                groupMap[key].jobs.push(j);
              }

              function JobCard({ j }) {
                const overdue = j.status === "Scheduled" && j.scheduled_date && j.scheduled_date < todayISO();
                const scheduled = j.status === "Scheduled" && !overdue;
                const accentColor = overdue ? "#b5432f" : scheduled ? "#6fa33d" : null;
                return (
                  <button key={j.id} onClick={() => setSelectedId(j.id)} className="fade-in"
                    style={{ display:"block", width:"100%", textAlign:"left", marginBottom:8,
                      background:"var(--panel)", border:"1px solid var(--line)",
                      borderLeft:`3px solid ${accentColor || "var(--line)"}`,
                      borderRadius:10, padding:14 }}>
                    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:8 }}>
                      <div className="head" style={{ fontSize:18, fontWeight:600 }}>{j.customer}</div>
                      <StatusPill status={j.status} overdue={overdue} scheduled={scheduled} />
                    </div>
                    {(siteAddr(j)||custAddr(j)||j.location) ? (
                      <div className="head" style={{ fontSize:14, fontWeight:600, color:"var(--brass-bright)", marginTop:2 }}>
                        📍 {siteAddr(j)||custAddr(j)||j.location}
                      </div>
                    ) : null}
                    <div style={{ fontSize:14, color:"var(--muted)", marginTop:3, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>
                      {j.type}{j.original_ask ? ` — ${j.original_ask}` : ''}
                    </div>
                    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginTop:10 }}>
                      <div className="mono" style={{ fontSize:14, color:"var(--brass-bright)" }}>
                        {fmtDate(j.scheduled_date)} · {fmtTime(j.scheduled_time)}
                      </div>
                      <div className="head" style={{ fontSize:16, fontWeight:700, color:"var(--olive-bright)" }}>{money(j.value)}</div>
                    </div>
                  </button>
                );
              }

              return groups.map(group => {
                if (group.jobs.length === 1) {
                  return <JobCard key={group.jobs[0].id} j={group.jobs[0]} />;
                }
                // Multi-job customer: collapsible group
                const isExpanded = q || expandedCustomers.has(group.customer);
                const totalValue = group.jobs.reduce((s, j) => s + Number(j.value||0), 0);
                const statusCounts = {};
                group.jobs.forEach(j => { statusCounts[j.status] = (statusCounts[j.status]||0) + 1; });
                return (
                  <div key={group.customer} style={{ marginBottom:10 }}>
                    <button onClick={() => setExpandedCustomers(prev => {
                        const next = new Set(prev);
                        next.has(group.customer) ? next.delete(group.customer) : next.add(group.customer);
                        return next;
                      })}
                      className="fade-in"
                      style={{ display:"block", width:"100%", textAlign:"left",
                        background:"var(--panel-2)", border:"1px solid var(--brass)",
                        borderRadius:10, padding:"12px 14px" }}>
                      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", gap:8 }}>
                        <div style={{ display:"flex", alignItems:"center", gap:8, flex:1, minWidth:0 }}>
                          <span style={{ fontSize:14, color:"var(--brass-bright)", flexShrink:0 }}>
                            {isExpanded ? '▼' : '▶'}
                          </span>
                          <div className="head" style={{ fontSize:17, fontWeight:700, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
                            {group.customer}
                          </div>
                        </div>
                        <div className="mono" style={{ fontSize:12, color:"var(--brass-bright)", flexShrink:0 }}>
                          {group.jobs.length} JOBS
                        </div>
                      </div>
                      <div style={{ display:"flex", gap:6, marginTop:8, flexWrap:"wrap", alignItems:"center" }}>
                        {Object.entries(statusCounts).map(([status, count]) => (
                          <span key={status} className="head"
                            style={{ fontSize:11, fontWeight:600, padding:"3px 8px", borderRadius:5,
                              border:`1px solid ${STATUS_COLOR[status]||"var(--line)"}`,
                              color: STATUS_COLOR[status]||"var(--muted)",
                              background: (STATUS_COLOR[status]||"#888")+"18" }}>
                            {count > 1 ? `${count}× ` : ''}{status}
                          </span>
                        ))}
                        {totalValue > 0 && (
                          <span className="head" style={{ marginLeft:"auto", fontSize:14, fontWeight:700, color:"var(--olive-bright)" }}>
                            {money(totalValue)}
                          </span>
                        )}
                      </div>
                    </button>
                    {isExpanded && (
                      <div style={{ paddingLeft:12, borderLeft:"2px solid var(--brass)", marginTop:4 }}>
                        {group.jobs.map(j => <JobCard key={j.id} j={j} />)}
                      </div>
                    )}
                  </div>
                );
              });
            })()}
            <button onClick={fixOldStatuses} className="mono"
              style={{ width:"100%", marginTop:6, padding:"11px", borderRadius:8, fontSize:12, letterSpacing:"0.08em",
                background:"transparent", color:"var(--muted)", border:"1px dashed var(--line)" }}>
              ⟳ FIX OLD STATUSES
            </button>
          </div>
        </React.Fragment>
      )}

      {/* Bottom bar */}
      <div style={{ position:"fixed", bottom:0, left:"50%", transform:"translateX(-50%)",
        width:"100%", maxWidth:520, background:"var(--panel)", borderTop:"1px solid var(--line)",
        padding:"12px 16px", display:"flex", gap:10, boxShadow:"0 -8px 24px rgba(0,0,0,0.4)" }}>
        <button onClick={() => setAdding(true)} className="head"
          style={{ flex:2, padding:"15px", borderRadius:9, fontSize:16, fontWeight:700,
            background:"var(--olive-bright)", color:"var(--bg)" }}>+ NEW JOB</button>
        <button onClick={() => setShowChoresView(true)} className="head"
          style={{ flex:1, padding:"15px", borderRadius:9, fontSize:14, fontWeight:700,
            background:"transparent", border:"1px solid var(--brass)", color:"var(--brass-bright)",
            position:"relative" }}>
          ⚑ CHORES
          {chores.filter(c=>!c.done).length > 0 && (
            <span style={{ position:"absolute", top:6, right:6, width:8, height:8,
              borderRadius:"50%", background:"var(--brass-bright)" }} />
          )}
        </button>
      </div>

      {/* Chores management view */}
      {showChoresView && (
        <ChoresView
          chores={chores} jobs={jobs} users={users}
          onClose={() => setShowChoresView(false)}
          onToggle={toggleChore}
          onEdit={editChore}
          onOpenJob={(jobId) => { setShowChoresView(false); openJobPhotos(jobId); }}
          onAdd={async (desc, jobId, assignedTo) => {
            const { data, error } = await sb.from('chores').insert({
              description: desc, job_id: jobId||null,
              assigned_to: validUUID(assignedTo)||null,
              status: 'open', created_at: new Date().toISOString(), updated_at: new Date().toISOString(),
            }).select().single();
            if (error) { showToast(`Error: ${error.message}`, true); return; }
            setChores(cs => [{ id: data.id, kind: null, job_id: jobId||null,
              assigned_to: assignedTo||null,
              label: desc, created: todayISO(), done: false }, ...cs]);
            showToast("Chore added");
          }}
          onDelete={async (choreId) => {
            await sb.from('chores').delete().eq('id', choreId);
            setChores(cs => cs.filter(c => c.id !== choreId));
          }}
        />
      )}

      {showSettings && <SettingsModal onClose={() => setShowSettings(false)} onLock={() => { setShowSettings(false); lockDevice(); }} />}
      {showCapCalc && <CapacitorCalc onClose={() => setShowCapCalc(false)} />}
      {showLeaving && clockSession && (
        <LeavingSheet clockSession={clockSession} jobs={jobs}
          onInRoute={() => { setShowLeaving(false); setShowMoveJob(true); }}
          onClockOut={() => { setShowLeaving(false); setShowClockOut(true); }}
          onClose={() => setShowLeaving(false)} />
      )}
      {showClockOut && clockSession && (
        <ClockOutSheet clockSession={clockSession} jobs={jobs} onClockOut={clockOut} onClose={() => setShowClockOut(false)} />
      )}
      {showMoveJob && clockSession && (
        <MoveJobSheet clockSession={clockSession} jobs={jobs} onMove={moveToInRoute} onClose={() => setShowMoveJob(false)}
          onNewJob={() => { setShowMoveJob(false); setRouteAfterAdd(true); setAdding(true); }} />
      )}
      {lastLeaveJob && (
        <LastLeaveSheet job={lastLeaveJob} onPick={async s => {
          await updateJob(lastLeaveJob.id, { status: s, _skipNote: true });
          setLastLeaveJob(null);
        }} onClose={() => setLastLeaveJob(null)} />
      )}
      {leavingCrewCheck && leavingCrewCheck.members.length > 0 && (() => {
        const person = leavingCrewCheck.members[0];
        const rest = leavingCrewCheck.members.slice(1);
        const advance = () => rest.length > 0
          ? setLeavingCrewCheck({ ...leavingCrewCheck, members: rest })
          : setLeavingCrewCheck(null);
        return (
          <Sheet title="CREW CHECK" onClose={() => setLeavingCrewCheck(null)}>
            <div className="mono" style={{ fontSize:15, color:"var(--text)", marginBottom:20 }}>
              Is {person.name} coming with you?
            </div>
            <div style={{ display:"flex", gap:12 }}>
              <button onClick={async () => {
                const { newJobId, oldJobId } = leavingCrewCheck;
                const at = new Date().toISOString();
                await clearJobCrewStatus(oldJobId, person.id);
                if (newJobId) {
                  await upsertJobCrewStatus(newJobId, person.id, 'In Route');
                  const newJob = jobs.find(j => j.id === newJobId);
                  await sb.from('job_notes').insert({
                    job_id: newJobId, content: `Status → In Route (${person.name}) — with ${currentUser.name}`,
                    source: 'system', created_at: at, user_id: currentUser.id,
                  });
                  await sb.from('notifications').insert({
                    user_id: person.id,
                    message: `${currentUser.name} marked you In Route to ${newJob?.customer || 'a job'}`,
                    read: false, created_at: at,
                  });
                }
                advance();
                refresh();
              }} className="head"
                style={{ flex:1, padding:14, fontSize:15, fontWeight:700, borderRadius:10,
                  background:"var(--olive-bright)", color:"var(--bg)", border:"none" }}>
                YES
              </button>
              <button onClick={advance} className="head"
                style={{ flex:1, padding:14, fontSize:15, fontWeight:700, borderRadius:10,
                  background:"var(--panel)", border:"1px solid var(--line)", color:"var(--muted)" }}>
                NO — STAYING
              </button>
            </div>
          </Sheet>
        );
      })()}
      {billingPaidPromptId && (() => {
        const bpJob = jobs.find(j => j.id === billingPaidPromptId);
        return (
          <Sheet title="IS THIS PAID?" onClose={() => setBillingPaidPromptId(null)}>
            <div className="mono" style={{ fontSize:14, color:"var(--text)", marginBottom:20 }}>
              Has {bpJob?.customer || 'this job'} paid the bill?
            </div>
            <div style={{ display:"flex", gap:12 }}>
              <button onClick={async () => {
                setBillingPaidPromptId(null);
                await updateJob(billingPaidPromptId, { status: 'Completed/Paid' });
              }} className="head"
                style={{ flex:1, padding:16, fontSize:16, fontWeight:700, borderRadius:10,
                  background:"var(--olive-bright)", color:"var(--bg)", border:"none" }}>
                YES — PAID
              </button>
              <button onClick={async () => {
                setBillingPaidPromptId(null);
                await updateJob(billingPaidPromptId, { status: 'Billed/Waiting for Payment' });
              }} className="head"
                style={{ flex:1, padding:16, fontSize:16, fontWeight:700, borderRadius:10,
                  background:"var(--panel)", border:"1px solid var(--line)", color:"var(--muted)" }}>
                NO — WAITING
              </button>
            </div>
          </Sheet>
        );
      })()}
      {closeJobPromptId && (
        <CloseJobSheet jobId={closeJobPromptId} jobs={jobs} users={users}
          onConfirm={async () => {
            await updateJob(closeJobPromptId, { status: 'Closed' });
            setCloseJobPromptId(null);
            setSelectedId(null);
          }}
          onClose={() => setCloseJobPromptId(null)}
          showToast={showToast} />
      )}
      {pendingNotifs.length > 0 && (
        <Sheet onClose={dismissNotifs} title="NOTIFICATIONS">
          {pendingNotifs.map(n => (
            <div key={n.id} className="mono"
              style={{ fontSize:14, color:"var(--text)", padding:"12px 0", borderBottom:"1px solid var(--line)" }}>
              {n.message}
            </div>
          ))}
          <button onClick={dismissNotifs} className="head"
            style={{ width:"100%", marginTop:14, padding:14, borderRadius:9, fontSize:14, fontWeight:700,
              background:"var(--olive-bright)", color:"var(--bg)" }}>OK</button>
        </Sheet>
      )}
      {toast && <Toast msg={toast.msg} isError={toast.isError} />}
      <VoiceButton onCommand={processVoiceCommand} />
    </div>
  );
}

/* ── CapacitorCalc ─────────────────────────────────────────────────────────── */
function CapacitorCalc({ onClose }) {
  const [step, setStep] = useState(1);
  const [terminal, setTerminal] = useState(null);
  const [amps, setAmps] = useState('');
  const [volts, setVolts] = useState('');
  const [nameplate, setNameplate] = useState('');

  const result = (amps && volts && parseFloat(amps) > 0 && parseFloat(volts) > 0)
    ? (parseFloat(amps) * 2652) / parseFloat(volts) : null;
  const npVal = parseFloat(nameplate);
  const low = npVal * 0.94;
  const high = npVal * 1.06;
  const inRange = result && npVal ? result >= low && result <= high : null;

  const sectionLabel = { fontSize:11, color:"var(--muted)", fontWeight:600, letterSpacing:"0.08em", marginBottom:6 };
  const inputStyle = { width:"100%", fontSize:26, fontWeight:700, textAlign:"center", padding:"14px", borderRadius:10,
    background:"var(--bg)", border:"1px solid var(--line)", color:"var(--text)", boxSizing:"border-box" };
  const stepBtn = (label, action, disabled) => (
    <button onClick={action} disabled={disabled} className="head"
      style={{ width:"100%", marginTop:14, padding:16, borderRadius:10, fontSize:16, fontWeight:700,
        background: disabled ? "var(--line)" : "var(--olive-bright)", color: disabled ? "var(--muted)" : "var(--bg)" }}>
      {label}
    </button>
  );

  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.85)", zIndex:300, display:"flex", flexDirection:"column", justifyContent:"flex-end" }}>
      <div style={{ background:"var(--panel)", borderRadius:"16px 16px 0 0", padding:20, maxHeight:"90vh", overflowY:"auto" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:18 }}>
          <div className="head" style={{ fontSize:18, fontWeight:700 }}>⚡ CAPACITOR CALCULATOR</div>
          <button onClick={onClose} className="mono" style={{ fontSize:20, color:"var(--muted)" }}>✕</button>
        </div>

        {/* STEP INDICATOR */}
        <div style={{ display:"flex", gap:6, marginBottom:20 }}>
          {[1,2,3,4].map(s => (
            <div key={s} style={{ flex:1, height:4, borderRadius:2,
              background: s <= step ? "var(--olive-bright)" : "var(--line)" }} />
          ))}
        </div>

        {step === 1 && (
          <div>
            <div className="mono" style={{ ...sectionLabel }}>STEP 1 OF 4 — SAFETY &amp; SETUP</div>
            <div style={{ background:"#b5432f18", border:"1px solid #b5432f", borderRadius:10, padding:14, marginBottom:16 }}>
              <div className="head" style={{ fontSize:13, fontWeight:700, color:"#b5432f", marginBottom:6 }}>⚠ SAFETY FIRST</div>
              <div style={{ fontSize:14, lineHeight:1.6 }}>If the capacitor has been removed from the unit, discharge it first — short across the terminals with an insulated screwdriver before touching anything.</div>
            </div>
            <div className="mono" style={{ ...sectionLabel, marginTop:16 }}>WHICH SIDE ARE YOU TESTING?</div>
            <div style={{ display:"flex", gap:10, marginTop:8 }}>
              {['HERM', 'FAN'].map(t => (
                <button key={t} onClick={() => setTerminal(t)} className="head"
                  style={{ flex:1, padding:18, borderRadius:10, fontSize:18, fontWeight:700,
                    border:`2px solid ${terminal===t ? "var(--olive-bright)" : "var(--line)"}`,
                    color: terminal===t ? "var(--olive-bright)" : "var(--muted)",
                    background:"transparent" }}>
                  {t === 'HERM' ? '🌀 HERM' : '💨 FAN'}
                  <div style={{ fontSize:11, fontWeight:400, marginTop:4, color:"var(--muted)" }}>
                    {t === 'HERM' ? 'Compressor' : 'Fan motor'}
                  </div>
                </button>
              ))}
            </div>
            {stepBtn('NEXT — MEASURE AMPS →', () => setStep(2), !terminal)}
          </div>
        )}

        {step === 2 && (
          <div>
            <div className="mono" style={{ ...sectionLabel }}>STEP 2 OF 4 — MEASURE START WINDING AMPS</div>
            <div style={{ background:"var(--bg)", border:"1px solid var(--line)", borderRadius:10, padding:14, marginBottom:16, fontSize:14, lineHeight:1.7 }}>
              <div style={{ marginBottom:6 }}>Set your clamp meter to <strong>AC Amps</strong>.</div>
              <div>Clamp around the <strong>{terminal === 'HERM' ? 'compressor start wire (to HERM terminal)' : 'fan motor start wire (to FAN terminal)'}</strong> while the unit is running.</div>
            </div>
            <div className="mono" style={{ ...sectionLabel }}>AMPS READING</div>
            <input type="number" inputMode="decimal" placeholder="e.g. 4.2"
              value={amps} onChange={e => setAmps(e.target.value)} style={inputStyle} />
            <div style={{ display:"flex", gap:10, marginTop:14 }}>
              <button onClick={() => setStep(1)} className="head"
                style={{ padding:"14px 20px", borderRadius:10, fontSize:14, background:"transparent",
                  border:"1px solid var(--line)", color:"var(--muted)" }}>‹ BACK</button>
              {stepBtn('NEXT — MEASURE VOLTAGE →', () => setStep(3), !amps || parseFloat(amps) <= 0)}
            </div>
          </div>
        )}

        {step === 3 && (
          <div>
            <div className="mono" style={{ ...sectionLabel }}>STEP 3 OF 4 — MEASURE CAPACITOR VOLTAGE</div>
            <div style={{ background:"var(--bg)", border:"1px solid var(--line)", borderRadius:10, padding:14, marginBottom:16, fontSize:14, lineHeight:1.7 }}>
              <div style={{ marginBottom:6 }}>Set your DMM to <strong>AC Volts</strong>.</div>
              <div>Place probes across the <strong>C</strong> and <strong>{terminal}</strong> terminals while the unit is running.</div>
            </div>
            <div className="mono" style={{ ...sectionLabel }}>VOLTAGE READING</div>
            <input type="number" inputMode="decimal" placeholder="e.g. 370"
              value={volts} onChange={e => setVolts(e.target.value)} style={inputStyle} />
            <div style={{ display:"flex", gap:10, marginTop:14 }}>
              <button onClick={() => setStep(2)} className="head"
