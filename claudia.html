function todayISO() { return new Date().toISOString().split("T")[0]; }
function siteAddr(j) { return j.site_address || j.address || ""; }
function custAddr(j) { return j.customer_address || j.address || ""; }
function uid() { return "job_" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function money(n) { return "$" + Number(n||0).toLocaleString("en-US"); }
function fmtDate(iso) {
  if (!iso) return "—";
  const [y,m,d] = iso.split("-");
  return `${m}/${d}/${y.slice(2)}`;
}
function fmtTime(t) {
  if (!t) return "—";
  let [h,mn] = t.split(":").map(Number);
  const ap = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return `${h}:${String(mn).padStart(2,"0")} ${ap}`;
}
function deriveCustomers(jobs) {
  const map = {};
  jobs.forEach(j => {
    const name = (j.customer||"").trim();
    if (!name) return;
    if (!map[name]) map[name] = { customer_address:"", phone:"", email:"", sites:[] };
    const rec = map[name];
    if (!rec.customer_address && custAddr(j)) rec.customer_address = custAddr(j);
    if (!rec.phone && j.phone) rec.phone = j.phone;
    if (!rec.email && j.email) rec.email = j.email;

      if (!exists) rec.sites.push({ site_address: site });
    }
  });
  return map;
}

/* ── Supabase mapping ──────────────────────────────────────────────────────── */
// Rejects addresses that are just a state abbreviation or ", PA" — artifact of old fromRow code
function isJunkAddr(s) { return /^,?\s*[A-Z]{2}\s*$/.test((s||'').trim()); }

function fromRow(row, notes=[]) {
  const c = row.customers || {};
  const rawCustomerAddr = c.address || '';
  const customerAddr = isJunkAddr(rawCustomerAddr) ? '' : rawCustomerAddr;
  const rawSiteAddr = row.site_address || row.address || customerAddr;
  const siteAddr = isJunkAddr(rawSiteAddr) ? customerAddr : rawSiteAddr;
  const scheduledAt = row.scheduled_at || '';
  return {
    id: row.id,
    customer: c.name || '',
    location: '',
    customer_address: customerAddr,
    site_address: siteAddr,
    same_address: !siteAddr || siteAddr === customerAddr,
    phone: c.phone || '',
    email: c.email || '',
    type: row.flow_type || 'Service Call',
    status: row.current_status || 'New',
    scheduled_date: scheduledAt ? scheduledAt.slice(0,10) : todayISO(),
    scheduled_time: scheduledAt ? scheduledAt.slice(11,16) : '09:00',
    value: Number(row.value) || 0,
    original_ask: row.original_ask || '',
    notes: row.notes || '',
    history: notes.filter(n => n.source !== 'system').map(n => ({
      id: n.id,
      date: (n.created_at||'').slice(0,10),
      note: n.content,
    })),
    _customer_id: row.customer_id,
    _assigned_to: row.assigned_to,
  };
}

const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
function validUUID(s) { return UUID_RE.test(s||'') ? s : null; }

function toRow(job, customerId, userId) {
  let scheduled_at = null;
  if (job.scheduled_date && job.scheduled_time) {
    const d = new Date(`${job.scheduled_date}T${job.scheduled_time}:00`);
    if (!isNaN(d)) scheduled_at = d.toISOString();
  }
  return {
    customer_id: customerId || job._customer_id,
    assigned_to: validUUID(userId) || validUUID(job._assigned_to),
    flow_type: job.type,
    current_status: job.status,
    value: Number(job.value) || null,
    scheduled_at,
    original_ask: job.original_ask || null,
    notes: job.notes || null,
    site_address: job.site_address || null,
    updated_at: new Date().toISOString(),
  };
}

/* ── Supabase data fetchers ────────────────────────────────────────────────── */
async function resolveCustomer(job) {
  const name = (job.customer||'').trim();
  if (!name) return null;
  const { data: existing } = await sb.from('customers')
    .select('id').ilike('name', name).limit(1).maybeSingle();
  if (existing) {
    const upd = { updated_at: new Date().toISOString() };
    if (job.phone) upd.phone = job.phone;
    if (job.email) upd.email = job.email;
    if (job.customer_address !== undefined) upd.address = (!job.customer_address || isJunkAddr(job.customer_address)) ? null : job.customer_address;
    await sb.from('customers').update(upd).eq('id', existing.id);
    return existing.id;
  }
  const { data: created, error } = await sb.from('customers').insert({
    name, phone: job.phone||null, email: job.email||null, address: job.customer_address||null,
    created_at: new Date().toISOString(), updated_at: new Date().toISOString(),
  }).select('id').single();
  if (error) { console.error('resolveCustomer failed', error); return null; }
  return created.id;
}

async function fetchJobs() {
  const { data: rows, error } = await sb.from('jobs')
    .select('*, customers(*)')
    .order('scheduled_at', { ascending: true, nullsFirst: false });
  if (error) { console.warn('fetchJobs error', error); return null; }
  if (!rows || rows.length === 0) return [];
  const jobIds = rows.map(r => r.id);
  const { data: notes } = await sb.from('job_notes')
    .select('*').in('job_id', jobIds).order('created_at');
  const notesByJob = {};
  (notes||[]).forEach(n => { (notesByJob[n.job_id] = notesByJob[n.job_id]||[]).push(n); });
  return rows.map(r => fromRow(r, notesByJob[r.id]||[]));
}

async function uploadPhoto(jobId, file, photoType) {
  const ext = (file.name||'photo.jpg').split('.').pop().toLowerCase() || 'jpg';
  const path = `${jobId}/${Date.now()}.${ext}`;
  const { error: upErr } = await sb.storage.from('job-photos').upload(path, file, { cacheControl:'3600', upsert:false });
  if (upErr) { console.error('upload error', upErr); return { error: upErr.message || JSON.stringify(upErr) }; }
  const { data: urlData } = sb.storage.from('job-photos').getPublicUrl(path);
  const url = urlData.publicUrl;
  const insertRow = { job_id: jobId, url, storage_path: path, created_at: new Date().toISOString() };
  if (photoType) insertRow.photo_type = photoType;
  const { data: row, error: dbErr } = await sb.from('job_photos')
    .insert(insertRow)
    .select().single();
  if (dbErr) { console.error('job_photos insert error', dbErr); return { error: dbErr.message || JSON.stringify(dbErr) }; }
  return row ? { id: row.id, url, storage_path: path, photo_type: photoType || null } : null;
}

async function saveEquipment(customerId, label, fields, installDate, jobId) {

  if (jobId) row.job_id = jobId;
  const { data, error } = await sb.from('equipment').insert(row).select().single();
  return { data, error };

async function updateEquipment(id, fields) {
  const row = { updated_at: new Date().toISOString() };
  if ('label' in fields) row.label = fields.label;
  if ('install_date' in fields) row.install_date = fields.install_date || null;
  if ('warranty_registered' in fields) row.warranty_registered = fields.warranty_registered;
  if ('warranty_registered_date' in fields) row.warranty_registered_date = fields.warranty_registered_date || null;
  EQUIP_KEYS.forEach(k => { if (k in fields) row[k] = fields[k]||null; });
  const { error } = await sb.from('equipment').update(row).eq('id', id);
  return error;

const EQUIP_KEYS = ['equipment_type','brand','model_number','serial_number','tonnage','horsepower','rpm','shaft_diameter','refrigerant','voltage','seer','mca','mop','year_manufactured'];

function getLabelSuggestions(equipType) {
  const t = (equipType||'').toLowerCase();
  if (t.includes('indoor') || t.includes('mini') || t.includes('split') || t.includes('air handler'))
    return ['Living Room','Master Bedroom','Bedroom 2','Bedroom 3','Kitchen','Office','Basement','Dining Room','Hallway'];
  if (t.includes('outdoor') || t.includes('condenser') || t.includes('heat pump'))
    return ['Outdoor Unit','Condenser'];
  if (t.includes('furnace') || t.includes('boiler'))
    return ['Furnace','Boiler','Basement Unit'];
  if (t.includes('water'))
    return ['Water Heater','Hot Water Tank'];
  return ['Living Room','Master Bedroom','Outdoor Unit','Furnace','Water Heater','Air Handler','Basement Unit','Office'];
}

function warrantyStatus(eq) {
  if (eq.warranty_registered) {
    if (eq.install_date) {
      const exp = new Date(eq.install_date + 'T12:00:00');
      exp.setFullYear(exp.getFullYear() + 12);
      return { type:'registered', expires: exp.toISOString().split('T')[0] };
    }
    return { type:'registered', expires:null };
  }
  if (!eq.install_date) return { type:'untracked' };
  const deadline = new Date(eq.install_date + 'T12:00:00');
  deadline.setDate(deadline.getDate() + 60);
  const today = new Date(); today.setHours(0,0,0,0);
  const daysLeft = Math.ceil((deadline - today) / 86400000);
  if (daysLeft < 0) return { type:'lapsed', deadline: deadline.toISOString().split('T')[0] };
  if (daysLeft <= 14) return { type:'urgent', daysLeft, deadline: deadline.toISOString().split('T')[0] };
  return { type:'pending', daysLeft, deadline: deadline.toISOString().split('T')[0] };
}

async function scanNameplate(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('File read failed'));
    reader.onload = async (e) => {
      try {
        const dataUrl = e.target.result;
        const match = dataUrl.match(/^data:([^;]+);base64,(.+)$/);
        if (!match) { reject(new Error('Invalid image data')); return; }
        const rawType = match[1];
        const base64Data = match[2];
        const mediaType = ['image/jpeg','image/png','image/gif','image/webp'].includes(rawType) ? rawType : 'image/jpeg';
        const res = await fetch(CLAUDE_PROXY, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_KEY}` },
          body: JSON.stringify({
            model: 'claude-haiku-4-5-20251001',
            max_tokens: 512,
            messages: [{
              role: 'user',
              content: [
                { type: 'image', source: { type: 'base64', media_type: mediaType, data: base64Data } },
                { type: 'text', text: 'You are an HVAC expert reading a photo of HVAC equipment, a nameplate, a data tag, or a part/component label.\n\nCRITICAL — label field mapping (read ALL digits exactly, do not truncate):\n- "P/N:", "Part No", "Part #", "CPN", "CPN-", "Model:" → model_number (use this, NOT the barcode model string, when both present)\n- "S/N:", "Serial:", "Serial No" → serial_number (completely separate from P/N — NEVER put a P/N value into serial_number)\n- "V:", "Volts:", "VAC" → voltage\n- "Hz" → frequency only, do NOT store in any field\n- "A", "Amps", "FLA", "RLA" → rated current only, do NOT store in mca (mca is a separate calculated value, leave null unless explicitly labeled MCA)\n\nEquipment types — this can be a WHOLE UNIT or a COMPONENT/PART:\n- Whole units: AC Condenser, Heat Pump, Air Handler, Gas Furnace, Electric Furnace, Mini-Split Indoor, Mini-Split Outdoor, Water Heater, Boiler, Package Unit\n- Motors & drives: Condenser Fan Motor, Evaporator Fan Motor, Blower Motor, ECM Motor, Variable-Speed Motor\n- Electrical components: Dual Run Capacitor, Start Capacitor, Contactor, Transformer, Circuit Board, Control Board, Sequencer\n- Refrigeration parts: Compressor, Expansion Valve, Reversing Valve, Filter Drier, Metering Device\n- Heating parts: Heat Strip, Igniter, Inducer Motor, Pressure Switch, Gas Valve\n\nEquipment type + brand inference from model/part number:\n- 253xxxxx = Interlink condenser fan motor\n- 5KCP, 3S, HC = GE/Genteq motor\n- CAP-xx = capacitor\n- DR96TC = 96% two-stage gas furnace (Daikin/Goodman)\n- GSX/SSX/XC = AC condenser; CAPEA/CHPF = evaporator coil\n- ARUF/AH = air handler; GMSS/GCSS = furnace\n- MXZ/FTX = Mitsubishi mini-split\n- H6HK/H8HK = Nordyne/Intertherm electric heat strip\n\nCapacity/spec → use "tonnage" for unit capacity only:\n- AC units: "3 ton (36,000 BTU)" (018=1.5T, 024=2T, 036=3T, 048=4T, 060=5T)\n- Heat strips: kW × 3,412 = BTU (H6HK010 → "10 kW (34,120 BTU)")\n- Furnaces: "80,000 BTU" (080=80K, 100=100K in model)\n- Capacitors: "45+5 MFD, 440V"\n- For motors, leave tonnage null — use dedicated fields below\n\nBARCODE TEXT — if a 2D barcode (DataMatrix/QR/Code128) is visible, read the encoded text. Interlink barcodes encode: YSLB-{W}-{P}-{variant} e.g. YSLB-350-6-B001 (350W, 6-pole).\n\nPole count → RPM at 60 Hz: 2P=3450, 4P=1625, 6P=1075, 8P=825\nWatts → HP (input power, prefer printed label value): 150-180W=1/5, 190-230W=1/4, 240-370W=1/3, 371-540W=1/2, 541-700W=3/4, 701-760W=1\n\nMotor brand decoding by part number:\n- Interlink 253xxxxx: brand=Interlink, voltage=208-230V, shaft_diameter=1/2 inch; decode barcode YSLB-{W}-{P}-xxx → HP from watts, RPM from poles\n- GE/Genteq 5KCP39xx, 3S1xx, HC43xx: brand=GE/Genteq, shaft_diameter=1/2 inch\n- A.O. Smith / US Motor / Nidec F48xx, S58xx: shaft_diameter=1/2 inch\n- Century / Regal Beloit CPxx, CAxx: shaft_diameter=1/2 inch\n- Emerson K55xxx: shaft_diameter=1/2 inch\n\nMotor-specific fields (extract from label or barcode, or infer from part number):\n- horsepower: "1/4", "1/3", "1/2", "3/4", "1" — if printed on label (e.g. "1/3HP") use that value exactly; only derive from watts if HP not printed\n- rpm: "1075", "1625", "825", "1100", "3450" — derive from pole count if RPM not printed\n- shaft_diameter: "1/2 inch", "5/8 inch" — default "1/2 inch" for condenser fan motors\n\nReply with ONLY a JSON object using these exact keys (null if unknown):\n{"equipment_type":null,"brand":null,"model_number":null,"serial_number":null,"tonnage":null,"horsepower":null,"rpm":null,"shaft_diameter":null,"refrigerant":null,"voltage":null,"seer":null,"mca":null,"mop":null,"year_manufactured":null}' },
              ],
            }],
          }),
        });
        if (!res.ok) { const t = await res.text(); reject(new Error(`API ${res.status}: ${t}`)); return; }
        const data = await res.json();
        const text = (data.content[0].text || '').trim();
        const m = text.match(/\{[\s\S]*\}/);
        if (!m) { reject(new Error('No JSON in response')); return; }
        resolve(JSON.parse(m[0]));
      } catch(err) { reject(err); }
    };
    reader.readAsDataURL(file);
  });
}

async function scanNameplateFromUrl(url) {
  const apiRes = await fetch(CLAUDE_PROXY, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_KEY}` },
    body: JSON.stringify({
      model: 'claude-haiku-4-5-20251001',
      max_tokens: 512,
      messages: [{
        role: 'user',
        content: [
          { type: 'image', source: { type: 'url', url } },
          { type: 'text', text: 'You are an HVAC expert reading a photo of HVAC equipment, a nameplate, a data tag, or a part/component label.\n\nCRITICAL — label field mapping (read ALL digits exactly, do not truncate):\n- "P/N:", "Part No", "Part #", "CPN", "CPN-", "Model:" → model_number (use this, NOT the barcode model string, when both present)\n- "S/N:", "Serial:", "Serial No" → serial_number (completely separate from P/N — NEVER put a P/N value into serial_number)\n- "V:", "Volts:", "VAC" → voltage\n- "Hz" → frequency only, do NOT store in any field\n- "A", "Amps", "FLA", "RLA" → rated current only, do NOT store in mca (mca is a separate calculated value, leave null unless explicitly labeled MCA)\n\nEquipment types — this can be a WHOLE UNIT or a COMPONENT/PART:\n- Whole units: AC Condenser, Heat Pump, Air Handler, Gas Furnace, Electric Furnace, Mini-Split Indoor, Mini-Split Outdoor, Water Heater, Boiler, Package Unit\n- Motors & drives: Condenser Fan Motor, Evaporator Fan Motor, Blower Motor, ECM Motor, Variable-Speed Motor\n- Electrical components: Dual Run Capacitor, Start Capacitor, Contactor, Transformer, Circuit Board, Control Board, Sequencer\n- Refrigeration parts: Compressor, Expansion Valve, Reversing Valve, Filter Drier, Metering Device\n- Heating parts: Heat Strip, Igniter, Inducer Motor, Pressure Switch, Gas Valve\n\nEquipment type + brand inference from model/part number:\n- 253xxxxx = Interlink condenser fan motor\n- 5KCP, 3S, HC = GE/Genteq motor\n- CAP-xx = capacitor\n- DR96TC = 96% two-stage gas furnace (Daikin/Goodman)\n- GSX/SSX/XC = AC condenser; CAPEA/CHPF = evaporator coil\n- ARUF/AH = air handler; GMSS/GCSS = furnace\n- MXZ/FTX = Mitsubishi mini-split\n- H6HK/H8HK = Nordyne/Intertherm electric heat strip\n\nCapacity/spec → use "tonnage" for unit capacity only:\n- AC units: "3 ton (36,000 BTU)" (018=1.5T, 024=2T, 036=3T, 048=4T, 060=5T)\n- Heat strips: kW × 3,412 = BTU (H6HK010 → "10 kW (34,120 BTU)")\n- Furnaces: "80,000 BTU" (080=80K, 100=100K in model)\n- Capacitors: "45+5 MFD, 440V"\n- For motors, leave tonnage null — use dedicated fields below\n\nBARCODE TEXT — if a 2D barcode (DataMatrix/QR/Code128) is visible, read the encoded text. Interlink barcodes encode: YSLB-{W}-{P}-{variant} e.g. YSLB-350-6-B001 (350W, 6-pole).\n\nPole count → RPM at 60 Hz: 2P=3450, 4P=1625, 6P=1075, 8P=825\nWatts → HP (input power, prefer printed label value): 150-180W=1/5, 190-230W=1/4, 240-370W=1/3, 371-540W=1/2, 541-700W=3/4, 701-760W=1\n\nMotor brand decoding by part number:\n- Interlink 253xxxxx: brand=Interlink, voltage=208-230V, shaft_diameter=1/2 inch; decode barcode YSLB-{W}-{P}-xxx → HP from watts, RPM from poles\n- GE/Genteq 5KCP39xx, 3S1xx, HC43xx: brand=GE/Genteq, shaft_diameter=1/2 inch\n- A.O. Smith / US Motor / Nidec F48xx, S58xx: shaft_diameter=1/2 inch\n- Century / Regal Beloit CPxx, CAxx: shaft_diameter=1/2 inch\n- Emerson K55xxx: shaft_diameter=1/2 inch\n\nMotor-specific fields (extract from label or barcode, or infer from part number):\n- horsepower: "1/4", "1/3", "1/2", "3/4", "1" — if printed on label (e.g. "1/3HP") use that value exactly; only derive from watts if HP not printed\n- rpm: "1075", "1625", "825", "1100", "3450" — derive from pole count if RPM not printed\n- shaft_diameter: "1/2 inch", "5/8 inch" — default "1/2 inch" for condenser fan motors\n\nReply with ONLY a JSON object using these exact keys (null if unknown):\n{"equipment_type":null,"brand":null,"model_number":null,"serial_number":null,"tonnage":null,"horsepower":null,"rpm":null,"shaft_diameter":null,"refrigerant":null,"voltage":null,"seer":null,"mca":null,"mop":null,"year_manufactured":null}' },
        ],
      }],
    }),
  });
  if (!apiRes.ok) { const t = await apiRes.text(); throw new Error(`API ${apiRes.status}: ${t}`); }
  const data = await apiRes.json();
  const text = (data.content[0].text || '').trim();
  const m = text.match(/\{[\s\S]*\}/);
  if (!m) throw new Error('No JSON in response');
  return JSON.parse(m[0]);
}

async function fetchChores() {

    .select('*').order('created_at', { ascending: false });

}

function PassphraseGate({ onAuthorize }) {
  const [value, setValue] = useState('');
  const [error, setError] = useState(false);
  const [shake, setShake] = useState(false);

  function attempt() {
    if (value.trim() === DEVICE_PASSPHRASE) {
      onAuthorize();
    } else {
      setError(true);
      setShake(true);
      setValue('');
      setTimeout(() => setShake(false), 600);
    }
  }

  return (
    <div className="fade-in" style={{ minHeight:"100vh", display:"flex", flexDirection:"column",
      alignItems:"center", justifyContent:"center", padding:32, background:"var(--bg)" }}>
      <div className="head" style={{ fontSize:28, fontWeight:700, lineHeight:1 }}>
        TMC <span style={{ color:"var(--brass-bright)" }}>MECHANICAL</span>
      </div>
      <div className="mono" style={{ fontSize:12, color:"var(--muted)", marginTop:8, letterSpacing:"0.1em" }}>
        FIELD JOB TRACKER
      </div>

      <div className={shake ? "shake" : ""} style={{ width:"100%", maxWidth:320, marginTop:52 }}>
        <div className="mono" style={{ fontSize:13, color:"var(--muted)", marginBottom:10, letterSpacing:"0.08em" }}>
          DEVICE PASSPHRASE
        </div>
        <input
          type="password"
          value={value}
          onChange={e => { setValue(e.target.value); setError(false); }}
          onKeyDown={e => e.key === 'Enter' && attempt()}
          placeholder="Enter passphrase…"
          autoFocus
          style={{ marginBottom:12, fontSize:18, letterSpacing:"0.12em",
            borderColor: error ? "var(--error,#c0392b)" : undefined }}
        />
        {error && (
          <div className="mono" style={{ fontSize:12, color:"var(--error,#c0392b)", marginBottom:10 }}>
            Incorrect passphrase.
          </div>
        )}
        <button onClick={attempt} className="head"
          style={{ width:"100%", padding:"16px", borderRadius:10, fontSize:16, fontWeight:700,
            background:"var(--olive-bright)", color:"var(--bg)", border:"none" }}>
          AUTHORIZE THIS DEVICE
        </button>
      </div>
    </div>
  );
}

/* ── App ───────────────────────────────────────────────────────────────────── */
function App() {
  const [deviceAuthorized, setDeviceAuthorized] = useState(
    () => localStorage.getItem(DEVICE_AUTH_KEY) === DEVICE_PASSPHRASE
  );
  function authorizeDevice() {
    localStorage.setItem(DEVICE_AUTH_KEY, DEVICE_PASSPHRASE);
    setDeviceAuthorized(true);
  }
  function lockDevice() {
    localStorage.removeItem(DEVICE_AUTH_KEY);
    setDeviceAuthorized(false);
  }

  const [currentUser, setCurrentUser] = useState(() => {
    try { return JSON.parse(localStorage.getItem(CURRENT_USER_KEY)); } catch { return null; }
  });
  const [jobs, setJobs] = useState(() => {
    try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : []; } catch { return []; }
  });
  const [chores, setChores] = useState([]);
  const [loading, setLoading] = useState(true);
  const [rlsWarning, setRlsWarning] = useState(false);
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);

  const [selectedId, setSelectedIdRaw] = useState(() => sessionStorage.getItem('tmc_selected_job') || null);
  function setSelectedId(id) {
    if (id) sessionStorage.setItem('tmc_selected_job', id);
    else sessionStorage.removeItem('tmc_selected_job');
    setSelectedIdRaw(id);
  }
  const [adding, setAdding] = useState(false);
  const [voicePreFill, setVoicePreFill] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [filter, setFilter] = useState(null);
  const [search, setSearch] = useState("");
  const [searchClosed, setSearchClosed] = useState(false);
  const [choresExpanded, setChoresExpanded] = useState(false);
  const [showChoresView, setShowChoresView] = useState(false);
  const [focusPhotos, setFocusPhotos] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [users, setUsers] = useState(FALLBACK_USERS);
  const [expandedCustomers, setExpandedCustomers] = useState(new Set());

  function showToast(msg, isError=false) {
    if (toastTimer.current) clearTimeout(toastTimer.current);
    setToast({ msg, isError });
    toastTimer.current = setTimeout(() => setToast(null), 3000);
  }

  async function processVoiceCommand(transcript) {
    const words = transcript.trim().split(/\s+/);
    if (words.length < 2) return; // single-word STT artifact — ignore silently
    showToast(`"${transcript}"`);
    try {
      const jobSummary = jobs.slice(0,30).map(j =>
        `id:${j.id} customer:"${j.customer}" type:"${j.type}" status:"${j.status}" date:${j.scheduled_date||'?'}`
      ).join('\n');
      const userSummary = users.map(u => `id:${u.id} name:"${u.name}"`).join('\n');

      // Determine current screen so Claude routes commands correctly
      const currentScreen = showChoresView ? 'chores'
        : selectedId ? `job_detail:${selectedId}`
        : adding ? 'new_job_form'
        : 'dashboard';

      const res = await fetch(CLAUDE_PROXY, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_KEY}` },
        body: JSON.stringify({
          model: 'claude-haiku-4-5-20251001',
          max_tokens: 300,
          messages: [{ role: 'user', content:
            `You are a voice assistant for an HVAC field service app. Today: ${todayISO()}. User: ${currentUser?.name||'tech'}.
Current screen: ${currentScreen}
Jobs:\n${jobSummary}
Users:\n${userSummary}

Parse this voice command and reply ONLY with JSON (no markdown).

Intent rules (apply in this exact priority order):
1. If transcript contains "note", "notes", "write down", "log", "record", "add that" → ALWAYS "add_note"
2. If command is a status change (on site, in progress, completed, etc.) → "update_status"
3. If command is adding a new job → "add_job"
4. If command is navigating to a customer → "navigate"
5. If command uses explicit task/reminder language ("remind", "don't forget", "pick up", "order parts", "call", "follow up", "schedule") → "add_chore"
6. If current screen is "chores" → "add_chore"
7. If current screen starts with "job_detail" → default to "add_note" (observations, what was found, what was done, customer info all go here)
8. Otherwise → "unknown"
{"intent":"add_job"|"add_chore"|"navigate"|"update_status"|"add_note"|"search"|"unknown",
"customer":null,"job_type":null,"status":null,"note":null,"query":null,
"date":null,"job_id":null,"description":null,"assigned_to_name":null,
"reply":"brief friendly confirmation under 12 words"}

Command: "${transcript}"`
          }],
        }),
      });
      const data = await res.json();
      const text = (data.content?.[0]?.text || '').trim();
      const m = text.match(/\{[\s\S]*\}/);
      if (!m) throw new Error('no json');
      const intent = JSON.parse(m[0]);

      showToast(intent.reply || 'Done');

      if (intent.intent === 'add_chore') {
        const desc = intent.description || intent.note || transcript;
        const assigneeUser = intent.assigned_to_name
          ? users.find(u => u.name.toLowerCase().includes(intent.assigned_to_name.toLowerCase()))
          : null;
        const jobIdForChore = intent.job_id || (selectedId && currentScreen.startsWith('job_detail') ? selectedId : null);
        const { data: choreData, error: choreErr } = await sb.from('chores').insert({
          description: desc,
          job_id: jobIdForChore || null,
          assigned_to: assigneeUser?.id || null,
          status: 'open',
          created_at: new Date().toISOString(),
          updated_at: new Date().toISOString(),
        }).select().single();
        if (choreErr) { showToast(`Error: ${choreErr.message}`, true); return; }
        setChores(cs => [{ id: choreData.id, kind: null, job_id: jobIdForChore || null,
          assigned_to: assigneeUser?.name || null,
          label: desc, created: todayISO(), done: false }, ...cs]);
        showToast('Chore added');
      } else if (intent.intent === 'add_job') {
        const pre = {};
        if (intent.customer) pre.customer = intent.customer;
        if (intent.job_type) pre.type = intent.job_type;
        if (intent.date) pre.scheduled_date = intent.date === 'today' ? todayISO() : intent.date;
        if (intent.note) pre.notes = intent.note;
        setVoicePreFill(pre);
        setAdding(true);
      } else if (intent.intent === 'navigate') {
        const match = jobs.find(j =>
          intent.job_id ? j.id === intent.job_id :
          intent.customer ? j.customer.toLowerCase().includes(intent.customer.toLowerCase()) : false
        );
        if (match) setSelectedId(match.id);
        else showToast(`No job found for "${intent.customer}"`, true);
      } else if (intent.intent === 'search') {
        setSearch(intent.query || intent.customer || '');
        setSelectedId(null);
      } else if (intent.intent === 'update_status' && intent.status) {
        const match = jobs.find(j =>
          intent.job_id ? j.id === intent.job_id :
          intent.customer ? j.customer.toLowerCase().includes(intent.customer.toLowerCase()) : false
        );
        if (match) await updateJob(match.id, { status: intent.status });
        else showToast(`No job found for "${intent.customer}"`, true);
      } else if (intent.intent === 'add_note') {
        const noteContent = intent.note || transcript;
        const match = jobs.find(j =>
          intent.job_id ? j.id === intent.job_id :
          selectedId ? j.id === selectedId :
          intent.customer ? j.customer.toLowerCase().includes(intent.customer.toLowerCase()) : false
        );
        if (match) {
          const todayStart = todayISO() + 'T00:00:00';
          const todayEnd   = todayISO() + 'T23:59:59';
          const { data: existing } = await sb.from('job_notes')
            .select('id, content').eq('job_id', match.id).eq('source', 'voice')
            .gte('created_at', todayStart).lte('created_at', todayEnd)
            .order('created_at', { ascending: false }).limit(1).maybeSingle();
          if (existing) {
            await sb.from('job_notes').update({ content: existing.content + ' ' + noteContent }).eq('id', existing.id);
            showToast('Note updated');
          } else {
            await sb.from('job_notes').insert({
              job_id: match.id, content: noteContent,
              source: 'voice', created_at: new Date().toISOString(),
            });
            showToast('Note added');
          }
          if (selectedId === match.id) refresh();
        } else {
          showToast(`No job found — note not saved`, true);
        }
      }
    } catch(err) {
      showToast('Voice command failed', true);
      console.error('voice error', err);
    }
  }

  function selectUser(user) {
    localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(user));
    setCurrentUser(user);
  }
  function switchUser() {
    localStorage.removeItem(CURRENT_USER_KEY);
    setCurrentUser(null);
  }

  const refresh = useCallback(async () => {
    const [jobData, choreData, userData] = await Promise.all([fetchJobs(), fetchChores(), fetchUsers()]);
    if (jobData === null) {
      showToast("Can't reach Supabase — showing cached data", true);
    } else {
      setRlsWarning(jobData.length === 0);
      setJobs(jobData);
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(jobData)); } catch(e){}
    }
    setChores(choreData);
    if (userData) setUsers(userData);
    setLoading(false);
  }, []);

  useEffect(() => {
    if (!currentUser) return;
    refresh();
    window.addEventListener('focus', refresh);
    const timer = setInterval(refresh, 60000); // auto-refresh every 60s
    return () => { window.removeEventListener('focus', refresh); clearInterval(timer); };
  }, [currentUser, refresh]);

  /* ── CRUD ── */
  async function addJob(job) {
    const customerId = await resolveCustomer(job);
    if (!customerId) { showToast("Could not resolve customer", true); return; }
    const { data, error } = await sb.from('jobs').insert({
      ...toRow(job, customerId, currentUser?.id),
      created_at: new Date().toISOString(),
    }).select('*, customers(*)').single();
    if (error) { showToast("Error saving job", true); console.error(error); return; }
    await sb.from('job_notes').insert({
      job_id: data.id, content: `Job created. Status: ${job.status}`,
      source: 'system', created_at: new Date().toISOString(),
    });
    const newJob = fromRow(data);
    setJobs(js => [newJob, ...js]);
    setAdding(false);
    setSelectedId(data.id);
    showToast("Job saved");
    if (job.status === "Completed/Needs Billing") spawnBillingChore(newJob);
  }

  async function updateJob(id, patch) {
    const job = jobs.find(j => j.id === id);
    if (!job) return;
    const updateData = { updated_at: new Date().toISOString() };
    if ('status' in patch)        updateData.current_status = patch.status;
    if ('type' in patch)          updateData.flow_type = patch.type;
    if ('original_ask' in patch)  updateData.original_ask = patch.original_ask||null;
    if ('notes' in patch)         updateData.notes = patch.notes||null;
    if ('value' in patch)         updateData.value = Number(patch.value)||null;
    if ('scheduled_date' in patch || 'scheduled_time' in patch) {
      const d = ('scheduled_date' in patch ? patch.scheduled_date : job.scheduled_date);
      const t = ('scheduled_time' in patch ? patch.scheduled_time : job.scheduled_time);
      if (d && t) { const dt = new Date(`${d}T${t}:00`); updateData.scheduled_at = isNaN(dt) ? null : dt.toISOString(); }
    }
    const { error } = await sb.from('jobs').update(updateData).eq('id', id);
    if (error) { showToast("Error updating job", true); console.error(error); return; }
    if (patch.status && patch.status !== job.status) {
      await sb.from('job_notes').insert({
        job_id: id, content: `Status → ${patch.status}`,
        source: 'system', created_at: new Date().toISOString(),
      });
      if (patch.status === "Completed/Needs Billing") spawnBillingChore({ ...job, ...patch });
    }
    setJobs(js => js.map(j => j.id === id ? { ...j, ...patch } : j));
  }

  async function saveEdit(edited) {
    const customerId = await resolveCustomer(edited);
    if (!customerId) { showToast("Could not resolve customer", true); return; }
    const { error } = await sb.from('jobs').update(toRow(edited, customerId, currentUser?.id)).eq('id', edited.id);
    if (error) { showToast("Error saving changes", true); console.error(error); return; }
    setJobs(js => js.map(j => j.id === edited.id ? { ...j, ...edited, _customer_id: customerId } : j));
    setEditingId(null);
    showToast("Changes saved");
    if (edited.status === "Completed/Needs Billing") spawnBillingChore({ ...edited, _customer_id: customerId });
  }

  async function deleteJob(id) {
    const { error } = await sb.from('jobs').delete().eq('id', id);
    if (error) { showToast("Error deleting job", true); console.error(error); return; }
    setJobs(js => js.filter(j => j.id !== id));
    setChores(cs => cs.filter(c => c.job_id !== id));
    setSelectedId(null);
    showToast("Job deleted");
  }

  async function toggleChore(choreId) {
    const chore = chores.find(c => c.id === choreId);
    if (!chore) return;
    const newStatus = chore.done ? 'open' : 'done';
    const { error } = await sb.from('chores')
      .update({ status: newStatus, updated_at: new Date().toISOString() }).eq('id', choreId);
    if (error) { showToast("Error updating chore", true); return; }
    setChores(cs => cs.map(c => c.id === choreId ? { ...c, done: !chore.done } : c));
  }

  async function editChore(choreId, fields) {
    const { error } = await sb.from('chores').update({
      description: fields.description,
      job_id: fields.job_id || null,
      assigned_to: fields.assigned_to || null,
      updated_at: new Date().toISOString(),
    }).eq('id', choreId);
    if (error) { showToast(`Error: ${error.message}`, true); return; }
    setChores(cs => cs.map(c => c.id === choreId ? {
      ...c, label: fields.description, job_id: fields.job_id || null, assigned_to: fields.assigned_to || null,
    } : c));
    showToast('Chore updated');
  }

  async function spawnBillingChore(job) {
    if (chores.some(c => c.job_id === job.id && c.kind === 'billing')) return;
    const { data, error } = await sb.from('chores').insert({
      description: `Create bill for ${job.customer}`,
      job_id: job.id,
      priority: 'billing', status: 'open',
      created_at: new Date().toISOString(), updated_at: new Date().toISOString(),
    }).select().single();
    if (error) { showToast(`Chore error: ${error.message}`, true); console.error('spawnBillingChore', error); return; }
    if (data) {
      setChores(cs => [{
        id: data.id, kind:'billing', job_id: job.id,
        label: `Create bill for ${job.customer}`, created: todayISO(), done: false,
      }, ...cs]);
      showToast("Billing chore created");
    }
  }

  function openJobPhotos(jobId) {
    setSelectedId(jobId);
    setFocusPhotos(true);
  }

  function fixOldStatuses() {
    const MAP = {
      "Needs Billing":"Completed/Needs Billing","Paid":"Completed/Paid",
      "Completed":"Completed/Needs Billing","Estimate Scheduled":"Evaluation Needed",
      "Estimate Given":"Waiting on Approval",
    };
    let changed = 0;
    const next = jobs.map(j => { if (MAP[j.status]) { changed++; return {...j,status:MAP[j.status]}; } return j; });
    setJobs(next);
    Promise.all(next.filter((_,i) => MAP[jobs[i]?.status]).map(j =>
      sb.from('jobs').update({ current_status:j.status }).eq('id',j.id)
    )).then(() => setTimeout(() => alert(changed > 0 ? `Updated ${changed} job(s).` : "No old statuses found."), 50));
  }

  function exportJobs() {
    const payload = { jobs, chores, exported: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(payload,null,2)], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `tmc-jobs-${todayISO()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  function importJobs() {
    const input = document.createElement("input");
    input.type = "file"; input.accept = ".json";
    input.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      let payload;
      try { payload = JSON.parse(await file.text()); } catch {
        showToast("Invalid JSON file", true); return;
      }
      const importList = payload.jobs || [];
      const choreList  = payload.chores || [];
      if (!importList.length && !choreList.length) {
        showToast("Nothing to import", true); return;
      }
      showToast(`Importing ${importList.length} jobs…`);
      let ok = 0, fail = 0, firstErr = null;
      for (const job of importList) {
        // resolve or create customer
        const name = (job.customer||'').trim();
        let customerId = null;
        if (name) {
          const { data: ex } = await sb.from('customers').select('id').ilike('name', name).limit(1).maybeSingle();
          if (ex) {
            customerId = ex.id;
          } else {
            const addr = job.customer_address || job.address || null;
            const { data: nc, error: ce } = await sb.from('customers').insert({
              name, phone: job.phone||null, address: addr,
              created_at: new Date().toISOString(), updated_at: new Date().toISOString(),
            }).select('id').single();
            if (ce) {
              fail++;
              if (!firstErr) firstErr = `Customer insert: ${ce.message||JSON.stringify(ce)}`;
              console.error('import customer error', ce, job);
              continue;
            }
            customerId = nc.id;
          }
        }
        if (!customerId) { fail++; if (!firstErr) firstErr = `No customer name for job: ${job.id}`; continue; }

        const { data, error } = await sb.from('jobs').insert({
          ...toRow(job, customerId, currentUser?.id),
          created_at: new Date().toISOString(),
        }).select('id').single();
        if (error) {
          fail++;
          if (!firstErr) firstErr = `Job insert: ${error.message||JSON.stringify(error)}`;
          console.error('import job error', error, job);
          continue;
        }
        for (const h of (job.history || [])) {
          await sb.from('job_notes').insert({
            job_id: data.id, content: h.note,
            source: 'user',
            created_at: h.date ? new Date(h.date).toISOString() : new Date().toISOString(),
          });
        }
        ok++;
      }
      for (const chore of choreList) {
        await sb.from('chores').insert({
          description: chore.label || chore.description || '',
          status: chore.done ? 'done' : 'open',
          priority: chore.kind || null,
          created_at: new Date().toISOString(),
        });
      }
      if (firstErr) showToast(`Failed: ${firstErr}`, true);
      else showToast(`Imported ${ok} job${ok!==1?'s':''}${fail ? `, ${fail} failed` : ''}`);
      await refresh();
    };
    input.click();
  }

  /* ── Render ── */
  if (!deviceAuthorized) return <PassphraseGate onAuthorize={authorizeDevice} />;
  if (!currentUser) return <Splash onSelect={selectUser} />;

  const selected = jobs.find(j => j.id === selectedId);
  if (adding) return (
    <React.Fragment>
      <JobForm onSave={addJob} onCancel={() => { setAdding(false); setVoicePreFill(null); }} prefill={voicePreFill} allJobs={jobs} />
      {toast && <Toast msg={toast.msg} isError={toast.isError} />}
      <VoiceButton onCommand={processVoiceCommand} />
    </React.Fragment>
  );
  if (editingId) {
    const editJob = jobs.find(j => j.id === editingId);
    if (editJob) return (
      <React.Fragment>
        <JobForm initial={editJob} onSave={saveEdit} onCancel={() => setEditingId(null)} allJobs={jobs} />
        {toast && <Toast msg={toast.msg} isError={toast.isError} />}
        <VoiceButton onCommand={processVoiceCommand} />
      </React.Fragment>
    );
  }
  if (selected) return (
    <React.Fragment>
      <JobDetail job={selected}
        onBack={() => { setSelectedId(null); setFocusPhotos(false); }}
        onUpdate={(patch) => updateJob(selected.id, patch)}
        onEdit={() => setEditingId(selected.id)}
        onDelete={() => deleteJob(selected.id)}
        focusPhotos={focusPhotos} />
      {toast && <Toast msg={toast.msg} isError={toast.isError} />}
      <VoiceButton onCommand={processVoiceCommand} />
    </React.Fragment>
  );

  const isActive = s => s !== "Completed/Paid" && s !== "Closed";
  const usedStatuses = STATUSES.filter(s => s !== "Closed" && jobs.some(j => j.status === s));
  const hasClosed = jobs.some(j => j.status === "Closed");
  const FILTERS = [...usedStatuses, "All", ...(hasClosed ? ["Closed"] : [])];
  const effectiveFilter = filter ?? usedStatuses[0] ?? "All";
  const q = search.trim().toLowerCase();

  function matchesSearch(j) {
    if (!q) return true;
    if (j.status === "Closed" && !searchClosed) return false;
    const hay = [j.customer, j.phone, j.notes, custAddr(j), siteAddr(j), j.location]
      .filter(Boolean).join(" ").toLowerCase();
    return hay.includes(q);
  }

  const shown = q ? jobs.filter(matchesSearch) : jobs.filter(j => effectiveFilter === "All" ? j.status !== "Closed" : j.status === effectiveFilter);
  const outstanding = jobs.filter(j => isActive(j.status)).reduce((s,j) => s + Number(j.value||0), 0);

  return (
    <div className="fade-in">
      {/* Header */}
      <div style={{ padding:"18px 16px 14px", borderBottom:"1px solid var(--line)", background:"var(--panel)" }}>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
          <div>
            <div className="head" style={{ fontSize:22, fontWeight:700, lineHeight:1 }}>
              TMC <span style={{ color:"var(--brass-bright)" }}>MECHANICAL</span>
            </div>
            <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginTop:4, letterSpacing:"0.1em" }}>FIELD JOB TRACKER</div>
          </div>
          <div style={{ textAlign:"right" }}>
            <div className="mono" style={{ fontSize:10, color:"var(--muted)" }}>OUTSTANDING</div>
            <div className="head" style={{ fontSize:20, fontWeight:700, color:"var(--olive-bright)" }}>{money(outstanding)}</div>
          </div>
        </div>
        {/* User indicator */}
        <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:10 }}>
          <div className="mono" style={{ fontSize:11, color:"var(--muted)", letterSpacing:"0.08em" }}>LOGGED IN AS:</div>
          <div className="head" style={{ fontSize:13, fontWeight:600, color:"var(--olive-bright)" }}>{currentUser.name}</div>
          <button onClick={switchUser} className="mono"
            style={{ marginLeft:"auto", fontSize:11, color:"var(--muted)", padding:"3px 8px", border:"1px solid var(--line)", borderRadius:5 }}>
            SWITCH
          </button>
          <button onClick={refresh} className="mono"
            style={{ fontSize:11, color:"var(--muted)", padding:"3px 8px", border:"1px solid var(--line)", borderRadius:5 }}>
            ↺
          </button>
          <button onClick={() => setShowSettings(true)} className="mono"
            style={{ fontSize:11, color:"var(--muted)", padding:"3px 8px", border:"1px solid var(--line)", borderRadius:5 }}>
            ⚙
          </button>
          <button onClick={lockDevice} className="mono"
            style={{ fontSize:11, color:"var(--error,#c0392b)", padding:"3px 8px", border:"1px solid var(--error,#c0392b)", borderRadius:5 }}>
            🔒
          </button>
          <div className="mono" style={{ fontSize:10, color:"var(--line)", marginLeft:2 }}>r{APP_REV}</div>
        </div>
      </div>

      {/* empty state — not an error */}
      {rlsWarning && !loading && (
        <div style={{ margin:"12px 16px 0", padding:"10px 14px", background:"var(--panel)",
          border:"1px solid var(--olive)", borderRadius:8, fontSize:13, color:"var(--muted)",
          textAlign:"center" }}>
          No jobs yet — tap + to add the first one.
        </div>
      )}

      {/* Loading */}
      {loading && (
        <div className="mono" style={{ textAlign:"center", color:"var(--muted)", padding:"40px 0", fontSize:13, letterSpacing:"0.1em" }}>
          LOADING…
        </div>
      )}

      {!loading && (
        <React.Fragment>
          {/* Search bar */}
          <div style={{ padding:"12px 16px 0", position:"relative" }}>
            <input type="text" value={search} onChange={e => setSearch(e.target.value)}
              placeholder="Search customers, addresses, sites, notes…"
              style={{ paddingLeft:38 }} />
            <span style={{ position:"absolute", left:28, top:22, fontSize:15, color:"var(--muted)", pointerEvents:"none" }}>🔍</span>
            {search && (
              <button onClick={() => setSearch("")}
                style={{ position:"absolute", right:26, top:18, fontSize:16, color:"var(--muted)", padding:4 }}>✕</button>
            )}
          </div>

          {/* Include-closed toggle — only while searching */}
          {q && (
            <button onClick={() => setSearchClosed(v => !v)} className="fade-in"
              style={{ display:"flex", alignItems:"center", gap:8, padding:"10px 16px 0", textAlign:"left" }}>
              <span style={{ width:38, height:22, borderRadius:11, flexShrink:0, position:"relative",
                background: searchClosed ? "var(--olive-bright)" : "var(--line)", transition:"background 0.15s" }}>
                <span style={{ position:"absolute", top:3, left: searchClosed ? 19 : 3,
                  width:16, height:16, borderRadius:"50%", background:"var(--bg)", transition:"left 0.15s" }}></span>
              </span>
              <span style={{ fontSize:13, color:"var(--muted)" }}>Include closed jobs</span>
            </button>
          )}
          {!q && (
            <div style={{ display:"flex", gap:8, padding:"12px 16px", overflowX:"auto" }}>
              {FILTERS.map(f => (
                <button key={f} onClick={() => setFilter(f)} className="head"
                  style={{ fontSize:13, fontWeight:600, padding:"7px 16px", borderRadius:6, flexShrink:0,
                    border:`1px solid ${effectiveFilter===f ? "var(--olive-bright)" : "var(--line)"}`,
                    color: effectiveFilter===f ? "var(--bg)" : "var(--muted)",
                    background: effectiveFilter===f ? "var(--olive-bright)" : "transparent" }}>{f}</button>
              ))}
            </div>
          )}

          {/* Chores strip — collapsible */}
          {!q && chores.filter(c => !c.done).length > 0 && (
            <div style={{ margin:"4px 16px 0", background:"var(--panel-2)", border:"1px solid var(--brass)", borderRadius:10, overflow:"hidden" }}>
              <button onClick={() => setChoresExpanded(v => !v)}
                style={{ display:"flex", width:"100%", alignItems:"center", justifyContent:"space-between", padding:"12px 14px", textAlign:"left" }}>
                <span className="mono" style={{ fontSize:12, color:"var(--brass-bright)", letterSpacing:"0.08em" }}>
                  ⚑ {chores.filter(c=>!c.done).length} CHORE{chores.filter(c=>!c.done).length>1?"S":""}
                </span>
                <span style={{ color:"var(--brass)", fontSize:13 }}>{choresExpanded?"▲":"▼"}</span>
              </button>
              {choresExpanded && (
                <div className="fade-in" style={{ padding:"0 14px 10px" }}>
                  {chores.filter(c=>!c.done).map(c => (
                    <div key={c.id} style={{ display:"flex", width:"100%", alignItems:"center", gap:10, padding:"8px 0", borderTop:"1px solid var(--line)" }}>
                      <button onClick={() => toggleChore(c.id)} style={{ flexShrink:0 }}>
                        <span style={{ display:"block", width:18, height:18, borderRadius:4, border:"1.5px solid var(--brass)" }}></span>
                      </button>
                      <button onClick={() => c.job_id ? openJobPhotos(c.job_id) : null}
                        style={{ flex:1, textAlign:"left", fontSize:14, color: c.job_id ? "var(--text)" : "var(--muted)" }}>
                        {c.label}{c.job_id ? " →" : ""}
                      </button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* Job list */}
          <div style={{ padding:"12px 16px 120px" }}>
            {shown.length === 0 && !rlsWarning && (
              <div style={{ textAlign:"center", color:"var(--muted)", padding:"40px 0" }} className="mono">
                {q ? `NO MATCHES FOR "${search.trim().toUpperCase()}"` : "NO JOBS HERE"}
              </div>
            )}
            {(() => {
              // Group by customer name, preserving order of first appearance
              const groups = [];
              const groupMap = {};
              for (const j of shown) {
                const key = j.customer || '';
                if (!groupMap[key]) {
                  const g = { customer: key, jobs: [] };
                  groupMap[key] = g;
                  groups.push(g);
                }
                groupMap[key].jobs.push(j);
              }

              function JobCard({ j }) {
                const overdue = j.status === "Scheduled" && j.scheduled_date && j.scheduled_date < todayISO();
                const scheduled = j.status === "Scheduled" && !overdue;
                const accentColor = overdue ? "#b5432f" : scheduled ? "#5d8a3a" : null;
                return (
                  <button key={j.id} onClick={() => setSelectedId(j.id)} className="fade-in"
                    style={{ display:"block", width:"100%", textAlign:"left", marginBottom:8,
                      background:"var(--panel)", border:"1px solid var(--line)",
                      borderLeft:`3px solid ${accentColor || "var(--line)"}`,
                      borderRadius:10, padding:14 }}>
                    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:8 }}>
                      <div className="head" style={{ fontSize:18, fontWeight:600 }}>{j.customer}</div>
                      <StatusPill status={j.status} overdue={overdue} scheduled={scheduled} />
                    </div>
                    {(siteAddr(j)||custAddr(j)||j.location) ? (
                      <div className="head" style={{ fontSize:14, fontWeight:600, color:"var(--brass-bright)", marginTop:2 }}>
                        📍 {siteAddr(j)||custAddr(j)||j.location}
                      </div>
                    ) : null}
                    <div style={{ fontSize:14, color:"var(--muted)", marginTop:3, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>
                      {j.type}{j.original_ask ? ` — ${j.original_ask}` : ''}
                    </div>
                    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginTop:10 }}>
                      <div className="mono" style={{ fontSize:14, color:"var(--brass-bright)" }}>
                        {fmtDate(j.scheduled_date)} · {fmtTime(j.scheduled_time)}
                      </div>
                      <div className="head" style={{ fontSize:16, fontWeight:700, color:"var(--olive-bright)" }}>{money(j.value)}</div>
                    </div>
                  </button>
                );
              }

              return groups.map(group => {
                if (group.jobs.length === 1) {
                  return <JobCard key={group.jobs[0].id} j={group.jobs[0]} />;
                }
                // Multi-job customer: collapsible group
                const isExpanded = q || expandedCustomers.has(group.customer);
                const totalValue = group.jobs.reduce((s, j) => s + Number(j.value||0), 0);
                const statusCounts = {};
                group.jobs.forEach(j => { statusCounts[j.status] = (statusCounts[j.status]||0) + 1; });
                return (
                  <div key={group.customer} style={{ marginBottom:10 }}>
                    <button onClick={() => setExpandedCustomers(prev => {
                        const next = new Set(prev);
                        next.has(group.customer) ? next.delete(group.customer) : next.add(group.customer);
                        return next;
                      })}
                      className="fade-in"
                      style={{ display:"block", width:"100%", textAlign:"left",
                        background:"var(--panel-2)", border:"1px solid var(--brass)",
                        borderRadius:10, padding:"12px 14px" }}>
                      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", gap:8 }}>
                        <div style={{ display:"flex", alignItems:"center", gap:8, flex:1, minWidth:0 }}>
                          <span style={{ fontSize:14, color:"var(--brass-bright)", flexShrink:0 }}>
                            {isExpanded ? '▼' : '▶'}
                          </span>
                          <div className="head" style={{ fontSize:17, fontWeight:700, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
                            {group.customer}
                          </div>
                        </div>
                        <div className="mono" style={{ fontSize:12, color:"var(--brass-bright)", flexShrink:0 }}>
                          {group.jobs.length} JOBS
                        </div>
                      </div>
                      <div style={{ display:"flex", gap:6, marginTop:8, flexWrap:"wrap", alignItems:"center" }}>
                        {Object.entries(statusCounts).map(([status, count]) => (
                          <span key={status} className="head"
                            style={{ fontSize:11, fontWeight:600, padding:"3px 8px", borderRadius:5,
                              border:`1px solid ${STATUS_COLOR[status]||"var(--line)"}`,
                              color: STATUS_COLOR[status]||"var(--muted)",
                              background: (STATUS_COLOR[status]||"#888")+"18" }}>
                            {count > 1 ? `${count}× ` : ''}{status}
                          </span>
                        ))}
                        {totalValue > 0 && (
                          <span className="head" style={{ marginLeft:"auto", fontSize:14, fontWeight:700, color:"var(--olive-bright)" }}>
                            {money(totalValue)}
                          </span>
                        )}
                      </div>
                    </button>
                    {isExpanded && (
                      <div style={{ paddingLeft:12, borderLeft:"2px solid var(--brass)", marginTop:4 }}>
                        {group.jobs.map(j => <JobCard key={j.id} j={j} />)}
                      </div>
                    )}
                  </div>
                );
              });
            })()}
            <button onClick={fixOldStatuses} className="mono"
              style={{ width:"100%", marginTop:6, padding:"11px", borderRadius:8, fontSize:12, letterSpacing:"0.08em",
                background:"transparent", color:"var(--muted)", border:"1px dashed var(--line)" }}>
              ⟳ FIX OLD STATUSES
            </button>
          </div>
        </React.Fragment>
      )}

      {/* Bottom bar */}
      <div style={{ position:"fixed", bottom:0, left:"50%", transform:"translateX(-50%)",
        width:"100%", maxWidth:520, background:"var(--panel)", borderTop:"1px solid var(--line)",
        padding:"12px 16px", display:"flex", gap:10, boxShadow:"0 -8px 24px rgba(0,0,0,0.4)" }}>
        <button onClick={() => setAdding(true)} className="head"
          style={{ flex:2, padding:"15px", borderRadius:9, fontSize:16, fontWeight:700,
            background:"var(--olive-bright)", color:"var(--bg)" }}>+ NEW JOB</button>
        <button onClick={() => setShowChoresView(true)} className="head"
          style={{ flex:1, padding:"15px", borderRadius:9, fontSize:14, fontWeight:700,
            background:"transparent", border:"1px solid var(--brass)", color:"var(--brass-bright)",
            position:"relative" }}>
          ⚑ CHORES
          {chores.filter(c=>!c.done).length > 0 && (
            <span style={{ position:"absolute", top:6, right:6, width:8, height:8,
              borderRadius:"50%", background:"var(--brass-bright)" }} />
          )}
        </button>
      </div>

      {/* Chores management view */}
      {showChoresView && (
        <ChoresView
          chores={chores} jobs={jobs} users={users}
          onClose={() => setShowChoresView(false)}
          onToggle={toggleChore}
          onEdit={editChore}
          onOpenJob={(jobId) => { setShowChoresView(false); openJobPhotos(jobId); }}
          onAdd={async (desc, jobId, assignedTo) => {
            const { data, error } = await sb.from('chores').insert({
              description: desc, job_id: jobId||null,
              assigned_to: validUUID(assignedTo)||null,
              status: 'open', created_at: new Date().toISOString(), updated_at: new Date().toISOString(),
            }).select().single();
            if (error) { showToast(`Error: ${error.message}`, true); return; }
            setChores(cs => [{ id: data.id, kind: null, job_id: jobId||null,
              assigned_to: assignedTo||null,
              label: desc, created: todayISO(), done: false }, ...cs]);
            showToast("Chore added");
          }}
          onDelete={async (choreId) => {
            await sb.from('chores').delete().eq('id', choreId);
            setChores(cs => cs.filter(c => c.id !== choreId));
          }}
        />
      )}

      {showSettings && <SettingsModal onClose={() => setShowSettings(false)} onLock={() => { setShowSettings(false); lockDevice(); }} />}
      {toast && <Toast msg={toast.msg} isError={toast.isError} />}
      <VoiceButton onCommand={processVoiceCommand} />
    </div>
  );
}

/* ── SettingsModal ─────────────────────────────────────────────────────────── */
function SettingsModal({ onClose, onLock }) {
  return (
    <div onClick={onClose} style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.7)", zIndex:200, display:"flex", alignItems:"flex-end", justifyContent:"center" }}>
      <div onClick={e => e.stopPropagation()} className="fade-in"
        style={{ width:"100%", maxWidth:520, background:"var(--panel-2)", borderTop:"2px solid var(--brass)",
          borderRadius:"16px 16px 0 0", padding:"20px 16px 36px" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
          <div className="head" style={{ fontSize:16, fontWeight:700 }}>SETTINGS</div>
          <button onClick={onClose} className="mono" style={{ color:"var(--muted)", fontSize:18 }}>✕</button>
        </div>
        <div className="mono" style={{ fontSize:12, color:"var(--muted)", lineHeight:1.6 }}>
          AI nameplate scanning runs via a Supabase Edge Function (claude-proxy).<br/>
          API key is stored as a server-side secret — not on this device.
        </div>
        <button onClick={onLock} className="head"
          style={{ width:"100%", marginTop:20, padding:14, borderRadius:9, fontSize:15, fontWeight:700,
            background:"transparent", border:"1px solid var(--error,#c0392b)", color:"var(--error,#c0392b)" }}>
          🔒 LOCK THIS DEVICE
        </button>

  const [jobId, setJobId] = useState('');
  const [assignedTo, setAssignedTo] = useState('');

  const [editDesc, setEditDesc] = useState('');
  const [editJobId, setEditJobId] = useState('');
  const [editAssignedTo, setEditAssignedTo] = useState('');
  const [showCompleted, setShowCompleted] = useState(false);
  const open = chores.filter(c => !c.done);
  const done = chores.filter(c => c.done);

  async function submit() {
    if (!desc.trim()) return;
    await onAdd(desc.trim(), jobId||null, assignedTo||null);

  }

  function startEdit(c) {
    setEditingId(c.id);
    setEditDesc(c.label);
    setEditJobId(c.job_id || '');
    setEditAssignedTo(c.assigned_to || '');
  }

  async function saveEdit(choreId) {
    if (!editDesc.trim()) return;
    await onEdit(choreId, { description: editDesc.trim(), job_id: editJobId||null, assigned_to: editAssignedTo||null });
    setEditingId(null);
  }

  function ChoreRow({ c, isDone }) {

    const assignee = c.assigned_to ? users.find(u => u.id === c.assigned_to) : null;

          <select value={jobId} onChange={e=>setJobId(e.target.value)} style={{ marginBottom:10 }}>
            <option value="">— Link to a job (optional) —</option>
            {jobs.filter(j => j.status !== 'Closed').map(j => (
              <option key={j.id} value={j.id}>{j.customer}{j.site_address ? ` · ${j.site_address}` : ''}</option>

          </select>

          </select>

            style={{ width:"100%", padding:"14px", borderRadius:9, fontSize:15, fontWeight:700,
              background:"var(--olive-bright)", color:"var(--bg)" }}>

/* ── Lightbox ──────────────────────────────────────────────────────────────── */
function Lightbox({ url, onClose, onScanResult }) {
  const [scale, setScale] = useState(1);
  const [offset, setOffset] = useState({ x:0, y:0 });
  const lastDist = useRef(null);
  const lastMid  = useRef(null);
  const dragStart = useRef(null);
  const lastOffset = useRef({ x:0, y:0 });
  const [scanning, setScanning] = useState(false);
  const [scanResult, setScanResult] = useState(null);
  const [scanError, setScanError] = useState(null);

  function onTouchStart(e) {
    if (e.touches.length === 2) {
      lastDist.current = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      lastMid.current = {
        x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
        y: (e.touches[0].clientY + e.touches[1].clientY) / 2,
      };
    } else if (e.touches.length === 1 && scale > 1) {
      dragStart.current = { x: e.touches[0].clientX - lastOffset.current.x, y: e.touches[0].clientY - lastOffset.current.y };
    }
  }

  function onTouchMove(e) {
    e.preventDefault();
    if (e.touches.length === 2 && lastDist.current) {
      const dist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      setScale(s => Math.max(1, Math.min(6, s * (dist / lastDist.current))));
      lastDist.current = dist;
    } else if (e.touches.length === 1 && dragStart.current) {
      const nx = e.touches[0].clientX - dragStart.current.x;
      const ny = e.touches[0].clientY - dragStart.current.y;
      lastOffset.current = { x: nx, y: ny };
      setOffset({ x: nx, y: ny });
    }
  }

  function onTouchEnd(e) {
    if (e.touches.length < 2) lastDist.current = null;
    if (e.touches.length === 0) dragStart.current = null;
    if (scale <= 1) { setOffset({ x:0, y:0 }); lastOffset.current = { x:0, y:0 }; }
  }

  function handleTap(e) {
    if (scanResult) return;
    if (scale === 1) onClose();
    else { setScale(1); setOffset({ x:0, y:0 }); lastOffset.current = { x:0, y:0 }; }
  }

  async function doScan(e) {
    e.stopPropagation();
    setScanning(true); setScanResult(null); setScanError(null);
    try {
      const result = await scanNameplateFromUrl(url);
      const found = Object.entries(result).filter(([,v]) => v != null);
      if (found.length === 0) setScanError('No equipment data found in this photo.');
      else setScanResult(result);
    } catch(err) {
      setScanError(err.message);
    } finally {
      setScanning(false);
    }
  }

  return (
    <div
      onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}
      onClick={handleTap}
      style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.95)", zIndex:200,
        display:"flex", alignItems:"center", justifyContent:"center", overflow:"hidden",
        touchAction:"none", cursor: scale > 1 ? "zoom-out" : "zoom-in" }}>
      <img src={url} alt=""
        style={{ maxWidth:"100%", maxHeight:"100%", objectFit:"contain",
          transform:`scale(${scale}) translate(${offset.x/scale}px,${offset.y/scale}px)`,
          transformOrigin:"center", transition: scale === 1 ? "transform 0.2s" : "none",
          userSelect:"none", pointerEvents:"none" }} />
      <button onClick={e => { e.stopPropagation(); onClose(); }}
        style={{ position:"absolute", top:16, right:16, width:36, height:36, borderRadius:"50%",
          background:"rgba(0,0,0,0.6)", color:"#fff", fontSize:20, lineHeight:"36px", textAlign:"center",
          border:"1px solid rgba(255,255,255,0.2)" }}>✕</button>

      {/* Bottom bar */}
      <div onClick={e => e.stopPropagation()}
        style={{ position:"absolute", bottom:0, left:0, right:0, padding:"12px 16px 28px",
          background:"linear-gradient(transparent, rgba(0,0,0,0.85))" }}>
        {!scanResult && !scanError && (
          <button onClick={doScan} disabled={scanning} className="head"
            style={{ display:"block", width:"100%", padding:"12px", borderRadius:9, fontSize:14, fontWeight:700,
              background: scanning ? "rgba(255,255,255,0.1)" : "rgba(180,150,60,0.85)",
              color: scanning ? "rgba(255,255,255,0.5)" : "#000",
              border:"none", marginBottom:8 }}>
            {scanning ? '🔍 SCANNING…' : '🔍 SCAN FOR EQUIPMENT'}
          </button>
        )}
        {scanError && (
          <div className="mono" style={{ fontSize:12, color:"#f87171", textAlign:"center", marginBottom:8 }}>{scanError}</div>
        )}
        {scanResult && (
          <div style={{ background:"rgba(0,0,0,0.8)", border:"1px solid rgba(180,150,60,0.5)", borderRadius:10, padding:12, marginBottom:8 }}>
            <div className="mono" style={{ fontSize:11, color:"rgba(180,150,60,0.9)", marginBottom:8 }}>FOUND ON NAMEPLATE</div>
            {Object.entries(scanResult).filter(([,v]) => v != null).map(([k,v]) => (
              <div key={k} style={{ display:"flex", gap:8, marginBottom:4 }}>
                <span className="mono" style={{ fontSize:11, color:"rgba(255,255,255,0.5)", minWidth:80 }}>{k.replace(/_/g,' ').toUpperCase()}</span>
                <span style={{ fontSize:12, color:"#fff" }}>{v}</span>
              </div>
            ))}
            <div style={{ display:"flex", gap:8, marginTop:12 }}>
              <button onClick={() => { onScanResult(scanResult); onClose(); }} className="head"
                style={{ flex:1, padding:"10px", borderRadius:8, fontSize:13, fontWeight:700,
                  background:"rgba(180,150,60,0.9)", color:"#000" }}>
                IMPORT TO JOB
              </button>
              <button onClick={() => setScanResult(null)} className="head"
                style={{ padding:"10px 16px", borderRadius:8, fontSize:13,
                  background:"rgba(255,255,255,0.1)", color:"#fff" }}>
                DISMISS
              </button>
            </div>
          </div>
        )}
        {!scanResult && scale === 1 && (
          <div className="mono" style={{ textAlign:"center", fontSize:11, color:"rgba(255,255,255,0.3)" }}>
            PINCH TO ZOOM · TAP TO CLOSE
          </div>
        )}
      </div>
    </div>
  );
}

function JobDetail({ job, onBack, onUpdate, onEdit, onDelete, focusPhotos }) {
