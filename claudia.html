/* ── Utilities ─────────────────────────────────────────────────────────────── */
function todayISO() { return new Date().toISOString().split("T")[0]; }
function nowTimeRounded15() {
  const d = new Date();
  let mins = Math.round(d.getMinutes() / 15) * 15;
  let hours = d.getHours();
  if (mins === 60) { mins = 0; hours = (hours + 1) % 24; }
  const pad = n => String(n).padStart(2,"0");
  return `${pad(hours)}:${pad(mins)}`;
}

function uid() { return "job_" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function money(n) { return "$" + Number(n||0).toLocaleString("en-US"); }
function fmtDate(iso) {
  if (!iso) return "—";
  const [y,m,d] = iso.split("-");
  return `${m}/${d}/${y.slice(2)}`;
}
function fmtTime(t) {
  if (!t) return "—";
  let [h,mn] = t.split(":").map(Number);
  const ap = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return `${h}:${String(mn).padStart(2,"0")} ${ap}`;
}
function fmtTimestamp(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return "—";
  let h = d.getHours();
  const mn = d.getMinutes();
  const ap = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  const time = `${h}:${String(mn).padStart(2,"0")} ${ap}`;
  const sameDay = d.toDateString() === new Date().toDateString();
  if (sameDay) return time;
  const pad = n => String(n).padStart(2,"0");
  return `${pad(d.getMonth()+1)}/${pad(d.getDate())} ${time}`;
}
function fmtElapsed(ms) {
  if (!isFinite(ms) || ms < 0) ms = 0;
  const mins = Math.round(ms / 60000);
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}
const CREW_FIELD_STATUSES = ['In Route','On Site'];
function parseCrewLogEntry(n) {
  const m = (n.content||'').match(/^Status → (.+?) \(([^)]+)\)/);
  if (!m) return null;
  return { id: n.id, status: m[1], userName: m[2], at: n.at };
}
function buildCrewTimeline(crewLog, crew, users) {
  const entries = (crewLog||[]).map(parseCrewLogEntry).filter(Boolean)
    .sort((a,b) => new Date(a.at) - new Date(b.at));
  const byUser = {};
  entries.forEach(e => { (byUser[e.userName] = byUser[e.userName] || []).push(e); });
  const result = {};
  Object.entries(byUser).forEach(([name, list]) => {
    const u = users.find(uu => uu.name === name);
    const current = u ? crew.find(c => c.user_id === u.id) : null;
    const periods = [];
    list.forEach((e, i) => {
      if (!CREW_FIELD_STATUSES.includes(e.status)) return;
      const next = list[i+1];
      const end = next ? next.at : null;
      const endId = next ? next.id : null;
      const ongoing = !end && !!current && current.status === e.status;
      periods.push({ status: e.status, start: e.at, startId: e.id, end, endId, ongoing });
    });
    if (periods.length) result[name] = periods;
  });
  return result;
}
function shiftDateISO(dateStr, delta) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + delta);
  const pad = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

function deriveCustomers(jobs) {

/* ── Supabase mapping ──────────────────────────────────────────────────────── */
// Rejects addresses that are just a state abbreviation or ", PA" — artifact of old fromRow code
function isJunkAddr(s) { return /^,?\s*[A-Z]{2}\s*$/.test((s||'').trim()); }

function fromRow(row, notes=[]) {
  const c = row.customers || {};
  const rawCustomerAddr = c.address || '';
  const customerAddr = isJunkAddr(rawCustomerAddr) ? '' : rawCustomerAddr;
  const rawSiteAddr = row.site_address || row.address || customerAddr;
  const siteAddr = isJunkAddr(rawSiteAddr) ? customerAddr : rawSiteAddr;
  const scheduledAt = row.scheduled_at || '';
  return {
    id: row.id,
    customer: c.name || '',
    location: '',
    customer_address: customerAddr,
    site_address: siteAddr,
    same_address: !siteAddr || siteAddr === customerAddr,
    phone: c.phone || '',
    email: c.email || '',
    type: row.flow_type || 'Service Call',
    status: row.current_status || 'New',
    scheduled_date: scheduledAt ? scheduledAt.slice(0,10) : todayISO(),
    scheduled_time: scheduledAt ? scheduledAt.slice(11,16) : '09:00',
    value: Number(row.value) || 0,
    original_ask: row.original_ask || '',

      id: n.id,

    })),
    _customer_id: row.customer_id,
    _assigned_to: row.assigned_to,
    _site_address_raw: row.site_address || null,
  };
}

const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
function validUUID(s) { return UUID_RE.test(s||'') ? s : null; }

function toRow(job, customerId, userId) {
  let scheduled_at = null;
  if (job.scheduled_date && job.scheduled_time) {
    const d = new Date(`${job.scheduled_date}T${job.scheduled_time}:00`);

    flow_type: job.type,
    current_status: job.status,
    value: Number(job.value) || null,
    scheduled_at,
    original_ask: job.original_ask || null,
    notes: job.notes || null,
    site_address: job.site_address || null,
    updated_at: new Date().toISOString(),
  };
}

/* ── Supabase data fetchers ────────────────────────────────────────────────── */
async function resolveCustomer(job) {
  const name = (job.customer||'').trim();
  if (!name) return null;
  const { data: existing } = await sb.from('customers')
    .select('id').ilike('name', name).limit(1).maybeSingle();
  if (existing) {
    const upd = { updated_at: new Date().toISOString() };
    if (job.phone) upd.phone = job.phone;
    if (job.email) upd.email = job.email;
    if (job.customer_address !== undefined) upd.address = (!job.customer_address || isJunkAddr(job.customer_address)) ? null : job.customer_address;
    await sb.from('customers').update(upd).eq('id', existing.id);
    return existing.id;
  }
  const { data: created, error } = await sb.from('customers').insert({
    name, phone: job.phone||null, email: job.email||null, address: job.customer_address||null,
    created_at: new Date().toISOString(), updated_at: new Date().toISOString(),
  }).select('id').single();
  if (error) { console.error('resolveCustomer failed', error); return null; }
  return created.id;
}

async function fetchJobs() {
  const { data: rows, error } = await sb.from('jobs')
    .select('*, customers(*)')
    .order('scheduled_at', { ascending: true, nullsFirst: false });
  if (error) { console.warn('fetchJobs error', error); return null; }
  if (!rows || rows.length === 0) return [];
  const jobIds = rows.map(r => r.id);
  const { data: notes } = await sb.from('job_notes')
    .select('*').in('job_id', jobIds).order('created_at');
  const notesByJob = {};
  (notes||[]).forEach(n => { (notesByJob[n.job_id] = notesByJob[n.job_id]||[]).push(n); });
  return rows.map(r => fromRow(r, notesByJob[r.id]||[]));
}

async function fetchPhotos(jobId) {
  const { data, error } = await sb.from('job_photos')
    .select('*').eq('job_id', jobId).order('created_at', { ascending: true });
  if (error) { console.warn('fetchPhotos error', error); return []; }
  return (data||[]).map(p => {
    const url = p.storage_path
      ? `${SUPABASE_URL}/storage/v1/object/public/job-photos/${p.storage_path}`
      : (p.url || p.photo_url || '');
    return { id: p.id, url, storage_path: p.storage_path || '', photo_type: p.photo_type || null };
  });
}

async function uploadPhoto(jobId, file, photoType) {
  const ext = (file.name||'photo.jpg').split('.').pop().toLowerCase() || 'jpg';
  const path = `${jobId}/${Date.now()}.${ext}`;
  const { error: upErr } = await sb.storage.from('job-photos').upload(path, file, { cacheControl:'3600', upsert:false });
  if (upErr) { console.error('upload error', upErr); return { error: upErr.message || JSON.stringify(upErr) }; }
  const url = `${SUPABASE_URL}/storage/v1/object/public/job-photos/${path}`;
  const base = { job_id: jobId, storage_path: path, created_at: new Date().toISOString() };
  if (photoType) base.photo_type = photoType;
  let { data: row, error: dbErr } = await sb.from('job_photos').insert({ ...base, url }).select().single();
  if (dbErr && (dbErr.code === 'PGRST204' || (dbErr.message||'').includes('url'))) {
    const r2 = await sb.from('job_photos').insert(base).select().single();
    row = r2.data; dbErr = r2.error;
  }
  if (dbErr) { console.error('job_photos insert error', dbErr); return { error: dbErr.message || JSON.stringify(dbErr) }; }
  return row ? { id: row.id, url, storage_path: path, photo_type: photoType || null } : null;
}

async function deletePhoto(photoId, storagePath) {
  if (storagePath) await sb.storage.from('job-photos').remove([storagePath]);
  await sb.from('job_photos').delete().eq('id', photoId);
}

async function saveEquipment(customerId, label, fields, installDate, jobId) {
  const row = { customer_id: customerId, label, created_at: new Date().toISOString() };
  EQUIP_KEYS.forEach(k => { if (fields[k] != null) row[k] = String(fields[k]); });
  if (installDate) row.install_date = installDate;
  if (jobId) row.job_id = jobId;
  if (fields._photoUrl) row.source_photo_url = fields._photoUrl;
  const { data, error } = await sb.from('equipment').insert(row).select().single();
  return { data, error };
}

async function updateEquipment(id, fields) {
  const row = { updated_at: new Date().toISOString() };
  if ('label' in fields) row.label = fields.label;
  if ('install_date' in fields) row.install_date = fields.install_date || null;
  if ('warranty_registered' in fields) row.warranty_registered = fields.warranty_registered;
  if ('warranty_registered_date' in fields) row.warranty_registered_date = fields.warranty_registered_date || null;
  if ('source_photo_url' in fields) row.source_photo_url = fields.source_photo_url || null;
  EQUIP_KEYS.forEach(k => { if (k in fields) row[k] = fields[k]||null; });
  const { error } = await sb.from('equipment').update(row).eq('id', id);
  return error;
}

async function deleteEquipmentItem(id) {
  await sb.from('equipment').delete().eq('id', id);
}

const EQUIP_KEYS = ['equipment_type','brand','model_number','serial_number','tonnage','horsepower','rpm','shaft_diameter','refrigerant','voltage','seer','mca','mop','year_manufactured'];

function findDuplicateEquipment(scan, list) {
  const model = (scan.model_number || '').trim().toLowerCase();
  const serial = (scan.serial_number || '').trim().toLowerCase();
  if (!model || !serial) return null;
  return list.find(eq =>
    (eq.model_number || '').trim().toLowerCase() === model &&
    (eq.serial_number || '').trim().toLowerCase() === serial
  ) || null;
}

function getLabelSuggestions(equipType) {
  const t = (equipType||'').toLowerCase();
  if (t.includes('indoor') || t.includes('mini') || t.includes('split') || t.includes('air handler'))
    return ['Living Room','Master Bedroom','Bedroom 2','Bedroom 3','Kitchen','Office','Basement','Dining Room','Hallway'];
  if (t.includes('outdoor') || t.includes('condenser') || t.includes('heat pump'))
    return ['Outdoor Unit','Condenser'];
  if (t.includes('furnace') || t.includes('boiler'))
    return ['Furnace','Boiler','Basement Unit'];
  if (t.includes('water'))
    return ['Water Heater','Hot Water Tank'];
  return ['Living Room','Master Bedroom','Outdoor Unit','Furnace','Water Heater','Air Handler','Basement Unit','Office'];
}

function warrantyStatus(eq) {
  if (eq.warranty_registered) {
    if (eq.install_date) {
      const exp = new Date(eq.install_date + 'T12:00:00');
      exp.setFullYear(exp.getFullYear() + 12);
      return { type:'registered', expires: exp.toISOString().split('T')[0] };
    }
    return { type:'registered', expires:null };
  }
  if (!eq.install_date) return { type:'untracked' };
  const deadline = new Date(eq.install_date + 'T12:00:00');
  deadline.setDate(deadline.getDate() + 60);
  const today = new Date(); today.setHours(0,0,0,0);
  const daysLeft = Math.ceil((deadline - today) / 86400000);
  if (daysLeft < 0) return { type:'lapsed', deadline: deadline.toISOString().split('T')[0] };
  if (daysLeft <= 14) return { type:'urgent', daysLeft, deadline: deadline.toISOString().split('T')[0] };
  return { type:'pending', daysLeft, deadline: deadline.toISOString().split('T')[0] };
}

async function readFileForScan(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('File read failed'));
    reader.onload = (e) => {
      const dataUrl = e.target.result;
      const match = dataUrl.match(/^data:([^;]+);base64,(.+)$/);
      if (!match) { reject(new Error('Invalid image data')); return; }
      const rawType = match[1];
      const b64 = match[2];
      const mediaType = ['image/jpeg','image/png','image/gif','image/webp'].includes(rawType) ? rawType : 'image/jpeg';
      resolve({ b64, mediaType });
    };
    reader.readAsDataURL(file);
  });
}

          { type: 'text', text: 'You are an HVAC expert reading a photo of HVAC equipment, a nameplate, a data tag, or a part/component label.\n\nCRITICAL — label field mapping (read ALL digits exactly, do not truncate):\n- "P/N:", "Part No", "Part #", "CPN", "CPN-", "Model:", "Model No", "Model Number", "Unit Model", "Catalog No" → model_number (use this, NOT the barcode model string, when both present). Read the FULL alphanumeric string character-by-character including every letter, digit, and dash — do not truncate, abbreviate, or guess missing characters. If part of the model number is obscured or hard to read, include only the characters you are confident about.\n- "S/N:", "Serial:", "Serial No" → serial_number (completely separate from P/N — NEVER put a P/N value into serial_number)\n- "CONTROL CKT VOLT", "CONTROL CIRCUIT VOLTS", or any "24 VAC" thermostat/control-circuit rating → DO NOT use this for voltage. This is the low-voltage thermostat control circuit (always ~24V) and is unrelated to the unit main power supply voltage.\n- For "voltage" (the unit main power supply), look for a "VOLTS-PH-HZ" or "V-PH-HZ" rating block (e.g. "460-3-60" → voltage="460", "208/230-1-60" → voltage="208/230"). If not directly labeled, derive it from the COMPR RLA-VOLTS or FAN FLA-VOLTS range — the number after the dash is the rated voltage (e.g. "10.0-460" → voltage="460")\n- "Hz" → frequency only, do NOT store in any field\n- "A", "Amps", "FLA", "RLA" → rated current only, do NOT store in mca (mca is a separate calculated value, leave null unless explicitly labeled MCA)\n- "REFRIG CKTS CHARGED", "CKT#1/CKT#2 ... LBS R22", "LBS. DE REFRIG-XX", or any "R-XX"/"RXX" refrigerant charge line → refrigerant (e.g. "R-22", "R-410A", "R-454B")\n\nEquipment types — this can be a WHOLE UNIT or a COMPONENT/PART:\n- Whole units: AC Condenser, Heat Pump, Air Handler, Gas Furnace, Electric Furnace, Mini-Split Indoor, Mini-Split Outdoor, Water Heater, Boiler, Package Unit\n- Motors & drives: Condenser Fan Motor, Evaporator Fan Motor, Blower Motor, ECM Motor, Variable-Speed Motor\n- Electrical components: Dual Run Capacitor, Start Capacitor, Contactor, Transformer, Circuit Board, Control Board, Sequencer\n- Refrigeration parts: Compressor, Expansion Valve, Reversing Valve, Filter Drier, Metering Device\n- Heating parts: Heat Strip, Igniter, Inducer Motor, Pressure Switch, Gas Valve\n\nWATER HEATER vs GAS FURNACE — critical disambiguation:\n- If the nameplate shows ANY of these → equipment_type MUST be "Water Heater" (never Gas Furnace): "GALLON", "GAL", "GALLONS", "CAPACITY (GAL)", "FIRST HOUR RATING", "GPH RECOVERY", "RECOVERY EFFICIENCY", "UEF", "HOT WATER HEATER", "WATER HTR"\n- Common water heater brands/model prefixes: Bradford White (AW, MH, RE, RG, MI), Rheem (PROG, PRSE, XG, MR), A.O. Smith (GPVH, GPVT, GACH, GCSH, GCV), State, American, Kenmore\n- "AFUE" on a nameplate → Gas Furnace (not Water Heater)\n- "BTU INPUT" alone is NOT enough to call it a furnace — water heaters also have BTU input ratings\n\nEquipment type + brand inference from model/part number:\n- 253xxxxx = Interlink condenser fan motor\n- 5KCP, 3S, HC = GE/Genteq motor\n- CAP-xx = capacitor\n- DR96TC = 96% two-stage gas furnace (Daikin/Goodman)\n- GSX/SSX/XC = AC condenser; CAPEA/CHPF = evaporator coil\n- ARUF/AH = air handler; GMSS/GCSS = furnace\n- MXZ/FTX = Mitsubishi mini-split\n- H6HK/H8HK = Nordyne/Intertherm electric heat strip\n- Trane/American Standard packaged rooftop model format Y_X###L#... (e.g. YCD120B4L0CA): Y=packaged rooftop, 2nd letter C=cooling section, 3rd letter D/H/C/J=heat type (D=cooling only/no heat, H=gas heat, C=electric heat), digits after 2 letters=tonnage code per the capacity table below, then a revision letter, then a single digit for voltage code (4=460V/3-phase/60Hz, 1=208-230V/1-phase, 3=208-230V/3-phase). brand="Trane" or "American Standard" (read from nameplate header), equipment_type="Package Unit"\n\nCapacity/spec → use "tonnage" for unit capacity only:\n- AC units/heat pumps/condensers: FIRST check nameplate for a direct capacity label (COOLING CAP, RATED CAP, NOMINAL CAP, BTU/HR, BTUH) — e.g. "36,000 BTU/HR" → "3 ton (36,000 BTU)". If not directly labeled, decode from the capacity digits embedded anywhere in the model number: 018 or 18=1.5T, 024 or 24=2T, 030 or 30=2.5T, 036 or 36=3T, 042 or 42=3.5T, 048 or 48=4T, 054 or 54=4.5T, 060 or 60=5T, 072 or 72=6T, 090 or 90=7.5T, 102=8.5T, 120=10T, 150=12.5T, 180=15T, 210=17.5T, 240=20T (commercial packaged rooftop units commonly use the larger sizes)\n- Heat strips: kW × 3,412 = BTU (H6HK010 → "10 kW (34,120 BTU)")\n- Furnaces: "80,000 BTU" (080=80K, 100=100K in model)\n- Capacitors: "45+5 MFD, 440V"\n- For motors, leave tonnage null — use dedicated fields below\n\nBARCODE TEXT — if a 2D barcode (DataMatrix/QR/Code128) is visible, read the encoded text. Interlink barcodes encode: YSLB-{W}-{P}-{variant} e.g. YSLB-350-6-B001 (350W, 6-pole).\n\nPole count → RPM at 60 Hz: 2P=3450, 4P=1625, 6P=1075, 8P=825\nWatts → HP (input power, prefer printed label value): 150-180W=1/5, 190-230W=1/4, 240-370W=1/3, 371-540W=1/2, 541-700W=3/4, 701-760W=1\n\nMotor brand decoding by part number:\n- Interlink 253xxxxx: brand=Interlink, voltage=208-230V, shaft_diameter=1/2 inch; decode barcode YSLB-{W}-{P}-xxx → HP from watts, RPM from poles\n- GE/Genteq 5KCP39xx, 3S1xx, HC43xx: brand=GE/Genteq, shaft_diameter=1/2 inch\n- A.O. Smith / US Motor / Nidec F48xx, S58xx: shaft_diameter=1/2 inch\n- Century / Regal Beloit CPxx, CAxx: shaft_diameter=1/2 inch\n- Emerson K55xxx: shaft_diameter=1/2 inch\n\nMotor-specific fields (extract from label or barcode, or infer from part number):\n- horsepower: "1/4", "1/3", "1/2", "3/4", "1" — if printed on label (e.g. "1/3HP") use that value exactly; only derive from watts if HP not printed\n- rpm: "1075", "1625", "825", "1100", "3450" — derive from pole count if RPM not printed\n- shaft_diameter: "1/2 inch", "5/8 inch" — default "1/2 inch" for condenser fan motors\n\nReply with ONLY a JSON object using these exact keys (null if unknown):\n{"equipment_type":null,"brand":null,"model_number":null,"serial_number":null,"tonnage":null,"horsepower":null,"rpm":null,"shaft_diameter":null,"refrigerant":null,"voltage":null,"seer":null,"mca":null,"mop":null,"year_manufactured":null}' },
        ],
      }],
    }),
  });
  if (!res.ok) { const t = await res.text(); throw new Error(`API ${res.status}: ${t}`); }
  const data = await res.json();
  const text = (data.content[0].text || '').trim();
  const m = text.match(/\{[\s\S]*\}/);
  if (!m) throw new Error('No JSON in response');
  return JSON.parse(m[0]);
}

/* ── Clock session helpers ─────────────────────────────────────────────────── */
function loadClockSession(userId) {
  if (!userId) return null;
  try { return JSON.parse(localStorage.getItem(clockKey(userId))); } catch { return null; }
}
function saveClockSession(userId, session) {
  if (!userId) return;
  if (session) localStorage.setItem(clockKey(userId), JSON.stringify(session));
  else localStorage.removeItem(clockKey(userId));
}
function getTodayMs(userId) {
  if (!userId) return 0;
  try {
    const d = JSON.parse(localStorage.getItem(clockTodayKey(userId)));
    if (!d || d.date !== todayISO()) return 0;
    return d.totalMs || 0;
  } catch { return 0; }
}
function addTodayMs(userId, ms) {
  if (!userId) return;
  const prev = getTodayMs(userId);
  localStorage.setItem(clockTodayKey(userId), JSON.stringify({ date: todayISO(), totalMs: prev + ms }));
}

  const c = overdue ? "#b5432f" : scheduled ? "var(--green)" : "var(--muted)";
  return (
    <span className="head" style={{
      fontSize:11, fontWeight:600, padding:"4px 9px", borderRadius:5,
      border:`1px solid ${c}`, color:c, background: (overdue || scheduled) ? c+"18" : "transparent", whiteSpace:"nowrap",

  );
}

  return (
    <div style={{
      position:"fixed", bottom:90, left:"50%", transform:"translateX(-50%)",
      background: isError ? "#5c1a0f" : "var(--panel-2)",
      border:`1px solid ${isError ? "var(--danger)" : "var(--olive)"}`,
      color:"var(--text)", padding:"10px 18px", borderRadius:8,
      fontSize:14, zIndex:200, whiteSpace:"nowrap", maxWidth:"90vw",
      boxShadow:"0 4px 20px rgba(0,0,0,0.5)",
    }}>{msg}</div>
  );
}

function PassphraseGate({ onAuthorize }) {
  const [value, setValue] = useState('');
  const [error, setError] = useState(false);
  const [shake, setShake] = useState(false);

  function attempt() {
    if (value.trim() === DEVICE_PASSPHRASE) {
      onAuthorize();
    } else {
      setError(true);
      setShake(true);
      setValue('');
      setTimeout(() => setShake(false), 600);
    }
  }

  return (

/* ── Clock components ──────────────────────────────────────────────────────── */
function ClockTimer({ startedAt, todayMs }) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);
  const total = todayMs + (now - new Date(startedAt).getTime());
  const h = Math.floor(total / 3600000);
  const m = Math.floor((total % 3600000) / 60000);
  return (
    <span className="mono" style={{ fontSize:12, color:"var(--olive-bright)", fontWeight:700 }}>
      {h}:{String(m).padStart(2,'0')}
    </span>
  );
}

function CloseJobSheet({ jobId, jobs, users, onConfirm, onClose, showToast }) {
  const job = jobs.find(j => j.id === jobId);
  const [receipts, setReceipts] = useState([]);
  const [laborRows, setLaborRows] = useState([]); // [{name, driveMs, onSiteMs}]
  const [loading, setLoading] = useState(true);
  const [addingReceipt, setAddingReceipt] = useState(false);
  const [rVendor, setRVendor] = useState('');
  const [rAmount, setRAmount] = useState('');
  const [rSaving, setRSaving] = useState(false);
  const fileRef = useRef();

  useEffect(() => {
    async function load() {
      const [{ data: rcpts }, { data: notes }] = await Promise.all([
        sb.from('receipts').select('*').eq('job_id', jobId).order('created_at'),
        sb.from('job_notes').select('*').eq('job_id', jobId).eq('source', 'system').order('created_at'),
      ]);
      setReceipts(rcpts || []);
      // Build labor summary from notes timeline
      const timeline = buildCrewTimeline(notes || [], [], users);
      const rows = users
        .filter(u => timeline[u.name])
        .map(u => {
          const periods = timeline[u.name] || [];
          const driveMs = periods.filter(p => p.status === 'In Route')
            .reduce((s, p) => s + (new Date(p.end || Date.now()) - new Date(p.start)), 0);
          const onSiteMs = periods.filter(p => p.status === 'On Site')
            .reduce((s, p) => s + (new Date(p.end || Date.now()) - new Date(p.start)), 0);
          return { name: u.name, driveMs, onSiteMs };
        })
        .filter(r => r.driveMs + r.onSiteMs > 0);
      setLaborRows(rows);
      setLoading(false);
    }
    load();
  }, [jobId]);

  async function saveReceipt(storagePath) {
    if (!rAmount && !rVendor) return;
    setRSaving(true);
    const { data, error } = await sb.from('receipts').insert({
      job_id: jobId, amount: Number(rAmount) || null, vendor: rVendor || null,
      date: todayISO(), storage_path: storagePath || null,
      created_at: new Date().toISOString(),
    }).select().single();
    setRSaving(false);
    if (error) { showToast?.('Receipt save failed: ' + error.message, true); return; }
    if (data) setReceipts(r => [...r, data]);
    setRVendor(''); setRAmount(''); setAddingReceipt(false);
  }

  async function handleReceiptFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    setRSaving(true);
    const path = `${jobId}/receipt-${Date.now()}.${(file.name||'jpg').split('.').pop()}`;
    const { error } = await sb.storage.from('job-photos').upload(path, file, { cacheControl:'3600', upsert:false });
    if (error) { showToast?.('Photo upload failed: ' + error.message, true); setRSaving(false); }
    else await saveReceipt(path);
    e.target.value = '';
  }

  async function deleteReceipt(r) {
    if (r.storage_path) await sb.storage.from('job-photos').remove([r.storage_path]);
    await sb.from('receipts').delete().eq('id', r.id);
    setReceipts(rs => rs.filter(x => x.id !== r.id));
  }

  const totalReceiptAmt = receipts.reduce((s, r) => s + Number(r.amount || 0), 0);

  return (
    <Sheet title="BEFORE YOU CLOSE" onClose={onClose}>
      {loading ? (
        <div className="mono" style={{ fontSize:13, color:"var(--muted)", textAlign:"center", padding:20 }}>Loading…</div>
      ) : (
        <React.Fragment>
          {/* Labor summary */}
          <div className="mono" style={{ fontSize:11, color:"var(--muted)", letterSpacing:"0.08em", marginBottom:8 }}>LABOR</div>
          {laborRows.length === 0 ? (
            <div className="mono" style={{ fontSize:13, color:"var(--muted)", marginBottom:16 }}>No time logged</div>
          ) : (
            <div style={{ marginBottom:16 }}>
              {laborRows.map(r => (
                <div key={r.name} style={{ display:"flex", justifyContent:"space-between", alignItems:"center",
                  padding:"6px 0", borderBottom:"1px solid var(--line)" }}>
                  <div className="head" style={{ fontSize:14, fontWeight:700 }}>{r.name}</div>
                  <div style={{ textAlign:"right" }}>
                    <div className="mono" style={{ fontSize:13, color:"var(--olive-bright)" }}>
                      {fmtElapsed(r.onSiteMs)} on site
                    </div>
                    {r.driveMs > 0 && (
                      <div className="mono" style={{ fontSize:11, color:"var(--muted)" }}>{fmtElapsed(r.driveMs)} drive</div>
                    )}
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* Receipts */}
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
            <div className="mono" style={{ fontSize:11, color:"var(--muted)", letterSpacing:"0.08em" }}>
              PARTS RECEIPTS{receipts.length > 0 ? ` (${receipts.length})` : ''}
            </div>
            {receipts.length > 0 && (
              <div className="mono" style={{ fontSize:13, color:"var(--olive-bright)", fontWeight:700 }}>
                {money(totalReceiptAmt)}
              </div>
            )}
          </div>
          {receipts.length === 0 && !addingReceipt && (
            <div className="mono" style={{ fontSize:13, color:"var(--muted)", marginBottom:12 }}>None on file</div>
          )}
          {receipts.map(r => (
            <div key={r.id} style={{ display:"flex", alignItems:"center", gap:8,
              padding:"6px 0", borderBottom:"1px solid var(--line)" }}>
              {r.storage_path && (
                <img src={`${SUPABASE_URL}/storage/v1/object/public/job-photos/${r.storage_path}`}
                  alt="receipt" style={{ width:36, height:36, objectFit:"cover", borderRadius:4, flexShrink:0 }} />
              )}
              <div style={{ flex:1 }}>
                <div className="head" style={{ fontSize:13, fontWeight:700 }}>{r.vendor || '—'}</div>
                <div className="mono" style={{ fontSize:12, color:"var(--muted)" }}>
                  {r.amount ? money(r.amount) : '—'}{r.date ? ` · ${r.date}` : ''}
                </div>
              </div>
              <button onClick={() => deleteReceipt(r)} className="mono"
                style={{ fontSize:16, color:"var(--danger,#c0392b)", padding:"4px 6px" }}>🗑</button>
            </div>
          ))}

          {addingReceipt ? (
            <div style={{ marginTop:10, padding:12, background:"var(--panel)", borderRadius:8, border:"1px solid var(--line)" }}>
              <div style={{ display:"flex", gap:8, marginBottom:8 }}>
                <input placeholder="Vendor" value={rVendor} onChange={e => setRVendor(e.target.value)}
                  style={{ flex:2 }} />
                <input placeholder="$ Amount" type="number" inputMode="decimal" value={rAmount}
                  onChange={e => setRAmount(e.target.value)} style={{ flex:1 }} />
              </div>
              <div style={{ display:"flex", gap:8 }}>
                <button onClick={() => fileRef.current.click()} className="head" disabled={rSaving}
                  style={{ flex:1, padding:"8px 0", borderRadius:6, border:"1px solid var(--line)",
                    background:"var(--panel)", color:"var(--muted)", fontSize:13 }}>
                  📷 SNAP
                </button>
                <button onClick={() => saveReceipt(null)} className="head" disabled={rSaving || (!rVendor && !rAmount)}
                  style={{ flex:1, padding:"8px 0", borderRadius:6, border:"none",
                    background:"var(--olive-bright)", color:"var(--bg)", fontSize:13, fontWeight:700 }}>
                  {rSaving ? 'SAVING…' : 'SAVE'}
                </button>
                <button onClick={() => setAddingReceipt(false)} className="mono"
                  style={{ padding:"8px 10px", borderRadius:6, border:"1px solid var(--line)",
                    background:"var(--panel)", color:"var(--muted)", fontSize:14 }}>✕</button>
              </div>
              <input ref={fileRef} type="file" accept="image/*" capture="environment" style={{ display:"none" }}
                onChange={handleReceiptFile} />
            </div>
          ) : (
            <button onClick={() => setAddingReceipt(true)} className="head"
              style={{ marginTop:8, width:"100%", padding:"8px 0", borderRadius:6,
                border:"1px dashed var(--line)", background:"none", color:"var(--muted)", fontSize:13 }}>
              + ADD RECEIPT
            </button>
          )}

          {/* Actions */}
          <div style={{ display:"flex", gap:12, marginTop:20 }}>
            <button onClick={onConfirm} className="head"
              style={{ flex:1, padding:16, fontSize:16, fontWeight:700, borderRadius:10,
                background:"var(--olive-bright)", color:"var(--bg)", border:"none" }}>
              CLOSE JOB
            </button>
            <button onClick={onClose} className="head"
              style={{ flex:1, padding:16, fontSize:16, fontWeight:700, borderRadius:10,
                background:"var(--panel)", border:"1px solid var(--line)", color:"var(--muted)" }}>
              NOT YET
            </button>
          </div>
        </React.Fragment>
      )}
    </Sheet>
  );
}

function MoveJobSheet({ clockSession, jobs, onMove, onClose, onNewJob }) {
  const currentJobId = clockSession?.jobId;
  const [q, setQ] = useState('');
  const shopJob = (jobs || []).find(j => j.customer?.toUpperCase() === 'TMC SHOP' && j.status !== 'Closed');
  const STATUS_PRIORITY = { 'In Progress': 0, 'On Site': 1, 'In Route': 2, 'Scheduled': 3 };
  const openJobs = (jobs || [])
    .filter(j => j.status !== 'Completed/Paid' && j.status !== 'Closed' && j.id !== currentJobId && j.customer?.toUpperCase() !== 'TMC SHOP')
    .slice().sort((a, b) => {
      const pa = STATUS_PRIORITY[a.status] ?? 99;
      const pb = STATUS_PRIORITY[b.status] ?? 99;
      if (pa !== pb) return pa - pb;
      return (a.customer || '').localeCompare(b.customer || '');
    });
  const filtered = q
    ? openJobs.filter(j => (j.customer||'').toLowerCase().includes(q.toLowerCase()) || (siteAddr(j)||'').toLowerCase().includes(q.toLowerCase()))
    : openJobs;
  return (
    <Sheet title="IN ROUTE — WHERE TO?" onClose={onClose}>
      <input value={q} onChange={e => setQ(e.target.value)} placeholder="Search jobs…"
        style={{ width:"100%", boxSizing:"border-box", padding:"10px 12px", marginBottom:8,
          borderRadius:8, border:"1px solid var(--line)", background:"var(--bg)",
          color:"var(--text)", fontSize:14, fontFamily:"inherit" }} />
      <button onClick={onNewJob} className="head"
        style={{ width:"100%", padding:"14px 16px", marginBottom:8, borderRadius:9, fontSize:15, fontWeight:700,
          textAlign:"left", background:"var(--olive-bright)", color:"var(--bg)", border:"none" }}>
        + NEW JOB
      </button>
      {shopJob && (
        <button onClick={() => onMove(shopJob.id)} className="head"
          style={{ width:"100%", padding:"14px 16px", marginBottom:8, borderRadius:9, fontSize:15, fontWeight:700,
            textAlign:"left", background:"var(--panel)", border:"1px solid var(--brass)", color:"var(--brass-bright)" }}>
          SHOP
        </button>
      )}
      <div style={{ display:"flex", flexDirection:"column", gap:6, maxHeight:320, overflowY:"auto" }}>
        {filtered.map(j => (
          <button key={j.id} onClick={() => onMove(j.id)} className="head"
            style={{ padding:"12px 14px", borderRadius:8, fontSize:14, fontWeight:700, textAlign:"left",
              background:"var(--panel)", border:"1px solid var(--line)", color:"var(--text)" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
              <span>{j.customer}</span>
              <span className="mono" style={{ fontSize:10, color:"var(--muted)" }}>{j.status}</span>
            </div>
            {siteAddr(j) && <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginTop:2 }}>{siteAddr(j)}</div>}
          </button>
        ))}
        {filtered.length === 0 && <div className="mono" style={{ fontSize:13, color:"var(--muted)", padding:"12px 0" }}>No jobs match</div>}
      </div>
    </Sheet>
  );
}
