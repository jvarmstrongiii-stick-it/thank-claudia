  const [shopAcquiredPending, setShopAcquiredPending] = useState(() => new Set());
  const shopHideTimers = useRef({});
  useEffect(() => () => { Object.values(shopHideTimers.current).forEach(clearTimeout); }, []);
  const [crew, setCrew] = useState([]);
  const [crewLog, setCrewLog] = useState(job.crewLog || []);
  const [crewLogDate, setCrewLogDate] = useState(todayISO());
  const [editingLogPeriod, setEditingLogPeriod] = useState(null); // { name, idx } or null
  const [editLogStart, setEditLogStart] = useState('');
  const [editLogEnd, setEditLogEnd] = useState('');
  const [editLogJobId, setEditLogJobId] = useState(null);
  const [addingLogFor, setAddingLogFor] = useState(null); // user name or null
  const [addLogStatus, setAddLogStatus] = useState('In Route');
  const [addLogStart, setAddLogStart] = useState('');
  const [addLogEnd, setAddLogEnd] = useState('');
  const [activeCrew, setActiveCrew] = useState([]); // other-job In Route/On Site assignments, for crew location display
  const [onSiteCheck, setOnSiteCheck] = useState(null); // array of crew users to confirm 'On Site' for, or null
  const [pendingWrapUpJobId, setPendingWrapUpJobId] = useState(null);
  const [wrapUpMembers, setWrapUpMembers] = useState(null); // [{u, done: bool}] | null
  const [wrapUpQueue, setWrapUpQueue] = useState(null);     // [user] | null — sequential "what's next"
  const [travelCheck, setTravelCheck] = useState(null);    // { queue: [user], targetJobId } | null
  const [editingCrew, setEditingCrew] = useState(null); // user id being edited, or null
  const [showCompleteCheck, setShowCompleteCheck] = useState(null); // job id to prompt completion for, or null
  const [editCrewStatus, setEditCrewStatus] = useState('In Route');
  const [editCrewDateTime, setEditCrewDateTime] = useState('');
  const [editCrewJobId, setEditCrewJobId] = useState(null);
  const [receipts, setReceipts] = useState([]);
  const [addingReceipt, setAddingReceipt] = useState(false);
  const [rVendor, setRVendor] = useState('');
  const [rAmount, setRAmount] = useState('');
  const [rSaving, setRSaving] = useState(false);
  const [rScanning, setRScanning] = useState(false);
  const [rPaidBy, setRPaidBy] = useState(currentUser?.name || '');
  const [editingReceipt, setEditingReceipt] = useState(null); // { id, vendor, amount, date, paid_by }
  const [vendorOptions, setVendorOptions] = useState([]);
  const receiptFileRef = useRef();
  const receiptUploadRef = useRef();
  const [receiptPagePrompt, setReceiptPagePrompt] = useState(null); // receipt row — "more pages?" after a snap
  const receiptPageRef = useRef();        // hidden camera input for extra pages
  const receiptPageTargetRef = useRef(null); // which receipt the next page attaches to (ref, not state — set in the same tap that opens the camera)
  // All section collapsibles start CLOSED on every load (Jack's preference; persist-open wasn't surviving hard refresh)
  const [photosOpen, setPhotosOpenRaw] = useState(false);
  const [showPhotoSheet, setShowPhotoSheet] = useState(false);
  const [thisJobEquipOpen, setThisJobEquipOpenRaw] = useState(false);
  const [otherEquipOpen, setOtherEquipOpenRaw] = useState(false);
  const [crewStatusOpen, setCrewStatusOpenRaw] = useState(false);
  const [timeLogOpen, setTimeLogOpenRaw] = useState(false);
  const [recordLogOpen, setRecordLogOpenRaw] = useState(false);
  function setPhotosOpen(updater) {
    setPhotosOpenRaw(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      setSectionCollapsed('photos', !next);
      return next;
    });
  }
  function setThisJobEquipOpen(updater) {
    setThisJobEquipOpenRaw(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      setSectionCollapsed('thisJobEquip', !next);
      return next;
    });
  }
  function setOtherEquipOpen(updater) {
    setOtherEquipOpenRaw(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      setSectionCollapsed('otherEquip', !next);
      return next;
    });
  }
  function setCrewStatusOpen(updater) {
    setCrewStatusOpenRaw(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      setSectionCollapsed('crewStatus', !next);
      return next;
    });
  }
  function setTimeLogOpen(updater) {
    setTimeLogOpenRaw(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      setSectionCollapsed('timeLog', !next);
      return next;
    });
  }
  function setRecordLogOpen(updater) {
    setRecordLogOpenRaw(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      setSectionCollapsed('recordLog', !next);
      return next;
    });
  }
  const fileRef = useRef();
  const cameraRef = useRef();
  const scanRef = useRef();
  const scanGalleryRef = useRef();
  const otherScanRef = useRef();
  const otherScanGalleryRef = useRef();
  const timeLogRef = useRef();
  const travelCheckInFlight = useRef(false); // guards answerTravelCheck against a double-tap firing the same crew move twice
  // Deep-link from Hours' BY DAY tab: jump straight to this job's Time Log, on the day that was clicked.
  useEffect(() => {
    if (!focusTimeLog || focusTimeLog.jobId !== job.id) return;
    if (focusTimeLog.date) setCrewLogDate(focusTimeLog.date);
    setTimeLogOpen(true);
    setTimeout(() => timeLogRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [focusTimeLog]);
  const [collageState, setCollageState] = React.useState(null);
  // null | { step:'unit' } | { step:'tag', unit:{id,url,storage_path} } | { step:'processing' }

  // Keep history in sync when parent refreshes job data (e.g. after voice note)
  useEffect(() => {
    setHistory(job.history || []);
  }, [job.history]);

  useEffect(() => {
    setMaterials(job.materials_needed || []);
  }, [job.materials_needed]);

  async function addMaterial(text) {
    const t = (text || '').trim();
    if (!t) return;
    const next = [...materials, { text: t, acquired: false }];
    setMaterials(next);
    setMatText('');
    if (onUpdateMaterials) await onUpdateMaterials(job.id, next);
  }
  async function toggleMaterial(idx) {
    const wasAcquired = !!materials[idx]?.acquired;
    const next = materials.map((m, i) => i === idx ? { ...m, acquired: !m.acquired } : m);
    setMaterials(next);
    if (onUpdateMaterials) await onUpdateMaterials(job.id, next);
    if (!isShop) return;
    clearTimeout(shopHideTimers.current[idx]);
    if (!wasAcquired) {
      // freshly checked off on the shop list — stays visible with an inline UNDO, then hides
      setShopAcquiredPending(prev => new Set(prev).add(idx));
      shopHideTimers.current[idx] = setTimeout(() => {
        setShopAcquiredPending(prev => { const n = new Set(prev); n.delete(idx); return n; });
        delete shopHideTimers.current[idx];
      }, 4000);
    } else {
      // unchecked (undo tap, or re-toggled directly) — cancel any pending hide
      setShopAcquiredPending(prev => { const n = new Set(prev); n.delete(idx); return n; });
      delete shopHideTimers.current[idx];
    }
  }
  async function removeMaterial(idx) {
    const next = materials.filter((_, i) => i !== idx);
    setMaterials(next);
    if (onUpdateMaterials) await onUpdateMaterials(job.id, next);
  }

  useEffect(() => {
    setCrewLog(job.crewLog || []);
  }, [job.crewLog]);

  useEffect(() => {
    fetchPhotos(job.id).then(setPhotos);
    sb.from('receipts').select('*').eq('job_id', job.id).order('created_at')
      .then(({ data }) => setReceipts(data || []));
    fetchReceiptVendors().then(setVendorOptions);
  }, [job.id]);

  useEffect(() => {
    async function loadEquipment() {
      const mine = await fetchEquipment(job.id);
      if (mine === null) return; // fetch failed — keep whatever equipmentList already had rather than wiping it
      if (job._customer_id) {
        // Join jobs to get each equipment item's source site_address for address-scoped filtering.
        // .or() is required (not .neq()) because "OTHER AT THIS ADDRESS" scans are saved with
        // job_id: null (saveOtherEquipment) — SQL's `job_id <> job.id` is NULL/unknown for a null
        // job_id, so a plain .neq() silently excludes those rows from every future fetch, forever
        // (they only ever appeared via the local setEquipmentList right after saving them).
        const { data, error } = await sb.from('equipment')
          .select('*, jobs(site_address)')
          .eq('customer_id', job._customer_id)
          .or(`job_id.is.null,job_id.neq.${job.id}`)
          .order('created_at', { ascending: false });
        if (error) { console.warn('loadEquipment (other)', error); return; } // keep prior list, don't wipe it on a fetch error
        const rawSite = job._site_address_raw;
        const other = (data || []).filter(eq => {
          // A null job_id has no linked job to join a site_address through — it was scoped to
          // "this address" at save time via the button itself, so trust that instead of excluding it.
          if (eq.job_id == null) return true;
          const eqSite = eq.jobs?.site_address ?? null;
          return eqSite === rawSite;
        });
        setEquipmentList([...mine, ...other]);
      } else {
        setEquipmentList(mine);
      }
    }
    loadEquipment();
  }, [job.id, job._customer_id, job._site_address_raw]);

  useEffect(() => {
    fetchJobCrew(job.id).then(setCrew);
    fetchActiveCrewAssignments().then(setActiveCrew);
  }, [job.id]);

  async function setMyCrewStatus(status) {
    if (!currentUser?.id) return;
    const updated = await upsertJobCrewStatus(job.id, currentUser.id, status);
    if (!updated) return;
    const at = new Date().toISOString();
    const content = `Status → ${status} (${currentUser.name})`;
    const { data: noteRow } = await sb.from('job_notes').insert({
      job_id: job.id, content,
      source: 'system', created_at: at, user_id: currentUser.id,
    }).select().single();
    setCrewLog(prev => [...prev, { id: noteRow?.id, content, at }]);
    if (job.status !== status) onUpdate({ status, _skipNote: true });
    if (status === 'On Site') {
      // Re-fetch crew live so we catch status set on other devices
      const freshCrew = await fetchJobCrew(job.id);
      setCrew(freshCrew);
      const others = users.filter(u => u.id !== currentUser.id &&
        freshCrew.find(c => c.user_id === u.id)?.status === 'In Route');
      if (others.length > 0) setOnSiteCheck(others);
    } else {
      setCrew(prev => [...prev.filter(c => c.user_id !== currentUser.id), updated]);
    }
  }

  async function markOthersOnSite() {
    const targets = onSiteCheck || [];
    setOnSiteCheck(null);
    for (const u of targets) {
      const updated = await upsertJobCrewStatus(job.id, u.id, 'On Site');
      if (!updated) continue;
      setCrew(prev => [...prev.filter(c => c.user_id !== u.id), updated]);
      const at = new Date().toISOString();
      const content = `Status → On Site (${u.name})`;
      const { data: noteRow } = await sb.from('job_notes').insert({
        job_id: job.id, content,
        source: 'system', created_at: at, user_id: currentUser?.id || null,
      }).select().single();
      setCrewLog(prev => [...prev, { id: noteRow?.id, content, at }]);
    }
    if (targets.length > 0 && job.status !== 'On Site') onUpdate({ status: 'On Site', _skipNote: true });
  }

  async function doCrewWrapUp(jobId) {
    setPendingWrapUpJobId(null);
    const freshCrew = await fetchJobCrew(jobId);
    const others = users.filter(u =>
      u.id !== currentUser?.id &&
      freshCrew.find(c => c.user_id === u.id && c.status === 'On Site')
    );
    if (others.length > 0) setWrapUpMembers(others.map(u => ({ u, done: true })));
  }

  function confirmWrapUp() {
    const doneUsers = (wrapUpMembers || []).filter(m => m.done).map(m => m.u);
    setWrapUpMembers(null);
    if (doneUsers.length > 0) setWrapUpQueue(doneUsers);
  }

  async function startTravelCheck(targetJobId) {
    const freshCrew = await fetchJobCrew(job.id);
    const others = users.filter(u =>
      u.id !== currentUser?.id &&
      freshCrew.find(c => c.user_id === u.id && c.status === 'On Site')
    );
    if (others.length > 0) setTravelCheck({ queue: others, targetJobId });
  }

  async function answerTravelCheck(comingAlong) {
    if (travelCheckInFlight.current) return;
    travelCheckInFlight.current = true;
    try {
      if (!travelCheck || travelCheck.queue.length === 0) { setTravelCheck(null); return; }
      const [person, ...rest] = travelCheck.queue;
      if (comingAlong) {
        const at = new Date().toISOString();
        const targetJob = (jobs||[]).find(j => j.id === travelCheck.targetJobId);
        const { note: leaveNote } = await clearCrewWithNote(job.id, person.id, person.name, at, ` — with ${currentUser.name}`, currentUser?.id || null);
        if (leaveNote) setCrewLog(prev => [...prev, { id: leaveNote.id, content: leaveNote.content, at }]);
        await upsertJobCrewStatus(travelCheck.targetJobId, person.id, 'In Route');
        await sb.from('job_notes').insert({
          job_id: travelCheck.targetJobId,
          content: `Status → In Route (${person.name}) — with ${currentUser.name}`,
          source: 'system', created_at: at, user_id: currentUser?.id || null,
        });
        await sb.from('notifications').insert({
          user_id: person.id,
          message: `${currentUser.name} has marked you In Route to ${targetJob?.customer || 'a job'}${targetJob?.site_address ? ' — ' + targetJob.site_address : ''}`,
          read: false, created_at: at,
        });
        setCrew(prev => prev.filter(c => c.user_id !== person.id));
      }
      setTravelCheck(rest.length > 0 ? { ...travelCheck, queue: rest } : null);
    } finally {
      travelCheckInFlight.current = false;
    }
  }

  async function saveCrewEdit(u) {
    const editorName = currentUser?.name && currentUser.name !== u.name ? ` — edited by ${currentUser.name}` : ' (edited)';
    if (editCrewStatus === 'none') {
      const targetJobId = editCrewJobId || job.id;
      const at = new Date().toISOString();
      const { error: clearError, note } = await clearCrewWithNote(targetJobId, u.id, u.name, at, editorName, currentUser?.id || null);
      if (clearError) { alert(`Couldn't clear status: ${clearError.message || clearError}`); return; }
      if (targetJobId === job.id) setCrew(prev => prev.filter(c => c.user_id !== u.id));
      setActiveCrew(prev => prev.filter(a => !(a.user_id === u.id && a.job_id === targetJobId)));
      if (targetJobId === job.id) setCrewLog(prev => [...prev, { id: note?.id, content: note?.content, at }]);
    } else {
      const statusAt = zonedLocalInputToISO(editCrewDateTime);
      const targetJobId = editCrewJobId || job.id;
      if (targetJobId !== job.id) {
        // Person is being moved to another job — close out their period HERE at the moment
        // the new status starts, or this job's timeline dangles open forever.
        const { note: leaveNote } = await clearCrewWithNote(job.id, u.id, u.name, statusAt, editorName, currentUser?.id || null);
        setCrew(prev => prev.filter(c => c.user_id !== u.id));
        setCrewLog(prev => [...prev, { id: leaveNote?.id, content: leaveNote?.content, at: statusAt }]);
      }
      const updated = await upsertJobCrewStatus(targetJobId, u.id, editCrewStatus, statusAt);
      if (updated && targetJobId === job.id) setCrew(prev => [...prev.filter(c => c.user_id !== u.id), updated]);
      const noteContent = `Status → ${editCrewStatus} (${u.name})${editorName}`;
      const { data: noteRow } = await sb.from('job_notes').insert({
        job_id: targetJobId, content: noteContent,
        source: 'system', created_at: statusAt, user_id: currentUser?.id || null,
      }).select().single();
      if (targetJobId === job.id) {
        setCrewLog(prev => [...prev, { id: noteRow?.id, content: noteContent, at: statusAt }]);
      }
    }
    setEditingCrew(null);

  async function saveLogEdit(period) {
    const startIso = zonedLocalInputToISO(editLogStart);
    const targetJobId = editLogJobId || job.id;
    const jobChanged = targetJobId !== job.id;
    const endIso = editLogEnd ? zonedLocalInputToISO(editLogEnd) : null;
    if (endIso && new Date(endIso) <= new Date(startIso)) {
      alert("End must be after start"); return;
    }
    if (endIso) {
      const overlapJobId = await findOverlappingActivity(editingLogPeriod.name, targetJobId, startIso, endIso, users);
      if (overlapJobId) {
        const overlapJob = jobs.find(j => j.id === overlapJobId);
        if (!confirm(`${editingLogPeriod.name} already has logged time at ${overlapJob?.customer || 'another job'} during part of this window — save anyway?`)) return;
      }
    }
    if (period.startId) {
      const update = { created_at: startIso };
      if (jobChanged) update.job_id = targetJobId;
      await sb.from('job_notes').update(update).eq('id', period.startId);
      if (jobChanged) setCrewLog(prev => prev.filter(n => n.id !== period.startId));
      else setCrewLog(prev => prev.map(n => n.id === period.startId ? { ...n, at: startIso } : n));
    }
    if (endIso) {
      if (period.endId) {
        const update = { created_at: endIso };
        if (jobChanged) update.job_id = targetJobId;
        await sb.from('job_notes').update(update).eq('id', period.endId);
        if (jobChanged) setCrewLog(prev => prev.filter(n => n.id !== period.endId));
        else setCrewLog(prev => prev.map(n => n.id === period.endId ? { ...n, at: endIso } : n));
      } else {
        // No closing note existed yet (e.g. an office-triggered crew move that never wrote one) — add it.
        const content = `Status → Cleared (${editingLogPeriod.name}) (edited)`;
        const { data: noteRow } = await sb.from('job_notes').insert({
          job_id: targetJobId, content, source: 'system', created_at: endIso, user_id: currentUser?.id || null,
        }).select().single();
        if (!jobChanged) setCrewLog(prev => [...prev, { id: noteRow?.id, content, at: endIso }]);
      }
    }
    setEditingLogPeriod(null);
  }

  async function deleteLogPeriod(period, name) {
    const msg = period.ongoing
      ? `${name} is still marked ${period.status} on this job — deleting will also clear their live status. Continue?`
      : 'Delete this time log entry?';
    if (!confirm(msg)) return;
    const ids = [period.startId].filter(Boolean);
    if (period.endId) {
      const endNote = crewLog.find(n => n.id === period.endId);
      const parsed = endNote ? parseCrewLogEntry(endNote) : null;
      // Delete end note only if it's a Cleared/non-field marker, not the start of another period
      if (parsed && !CREW_FIELD_STATUSES.includes(parsed.status)) ids.push(period.endId);
    }
    if (period.ongoing) {
      const u = users.find(uu => uu.name === name);
      if (u) {
        // Raw clear (no Cleared note): the period's start note is deleted below, so there is
        // no open period left to close.
        await clearJobCrewStatus(job.id, u.id);
        setCrew(prev => prev.filter(c => c.user_id !== u.id));
      }
    }
    await Promise.all(ids.map(id => sb.from('job_notes').delete().eq('id', id)));
    setCrewLog(prev => prev.filter(n => !ids.includes(n.id)));
    setEditingLogPeriod(null);
  }

  function convertToJpeg(file) {
    return new Promise((res, rej) => {
      const blobUrl = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(blobUrl);
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(blob => {
          if (blob) res(new File([blob], 'photo.jpg', { type: 'image/jpeg' }));
          else rej(new Error('conversion failed'));
        }, 'image/jpeg', 0.92);
      };
      img.onerror = () => { URL.revokeObjectURL(blobUrl); rej(new Error('decode failed')); };
      img.src = blobUrl;
    });
  }

  async function handlePhotoInput(e) {
    const files = Array.from(e.target.files);
    if (!files.length) return;
    const heicFiles = files.filter(f => /\.(heic|heif)$/i.test(f.name) || f.type === 'image/heic' || f.type === 'image/heif');
    if (heicFiles.length > 0) {
      alert('HEIC/HEIF photos can\'t be displayed in this app.\n\nOn iPhone: Settings → Camera → Formats → Most Compatible\nOn Android: turn off HEIC in your camera settings.\n\nRetake or re-export the photo as JPEG and try again.');
      e.target.value = '';
      return;
    }
    setUploading(true);
    let errors = [];
    for (const file of files) {
      let uploadFile = file;
      if (!file.type.startsWith('image/jpeg') && !file.type.startsWith('image/jpg')) {
        try { uploadFile = await convertToJpeg(file); } catch(_) { /* use original if conversion fails */ }
      }
      const photo = await uploadPhoto(job.id, uploadFile);
      if (photo && !photo.error) setPhotos(prev => [...prev, photo]);
      else if (photo && photo.error) errors.push(photo.error);
      else errors.push('unknown error');
    }
    setUploading(false);
    e.target.value = '';
    if (errors.length > 0) alert(`Upload failed:\n${errors.join('\n')}`);
  }

  function _launchScan(file, isOther) {
    const blobUrl = URL.createObjectURL(file);
    const tempId = `local-${Date.now()}-${Math.random().toString(36).slice(2,6)}`;
    // Photo visible in strip immediately — no waiting
    setPhotos(prev => [...prev, { id: tempId, url: blobUrl, photo_type: 'equipment', _local: true }]);
    isOther ? setOtherScanningCount(n => n + 1) : setScanningCount(n => n + 1);

    // Shared upload promise — both photo strip and scan queue need the URL
    const uploadP = uploadPhoto(job.id, file, 'equipment').then(photo => {
      if (photo && !photo.error) {
        setPhotos(prev => prev.map(p => p.id === tempId ? photo : p));
        URL.revokeObjectURL(blobUrl);
      }
      return photo;
    }).catch(() => null);

    // Read file then OCR in background — attach photo URL to scan result
    readFileForScan(file).then(({ b64, mediaType }) =>
      scanNameplateFromB64(b64, mediaType).then(result => {
        const hasData = Object.values(result).some(v => v != null);
        if (hasData) {
          uploadP.then(photo => {
            const entry = { ...result, _photoUrl: photo?.storage_path || null };
            isOther ? setOtherScanQueue(q => [...q, entry]) : setScanQueue(q => [...q, entry]);
            isOther ? setPendingOtherScanRetry(null) : setPendingScanRetry(null);
          });
        }
      }).catch(err => {
        // Scan failed — save b64 + storage_path for retry button, and the real reason
        // (could be a dead connection, but just as often an actual API/parse error —
        // don't assume "no signal" and hide what actually went wrong).
        uploadP.then(photo => {
          const retry = { b64, mediaType, _photoUrl: photo?.storage_path || null, error: scanErrorMessage(err) };
          isOther ? setPendingOtherScanRetry(retry) : setPendingScanRetry(retry);
        });
      })
    ).catch(() => {}).finally(() => {
      isOther ? setOtherScanningCount(n => n - 1) : setScanningCount(n => n - 1);
    });
  }

  function runScan(e) {

  async function mergeImagesCanvas(src1, src2) {
    async function loadImg(src) {
      // Fetch as blob first so canvas can draw cross-origin images without tainting
      const blob = await fetch(src).then(r => r.blob());
      const blobUrl = URL.createObjectURL(blob);
      return new Promise((res, rej) => {
        const img = new Image();
        img.onload = () => { URL.revokeObjectURL(blobUrl); res(img); };
        img.onerror = () => { URL.revokeObjectURL(blobUrl); rej(); };
        img.src = blobUrl;
      });
    }
    const [imgA, imgB] = await Promise.all([loadImg(src1), loadImg(src2)]);
    const H = Math.min(Math.max(imgA.height, imgB.height), 2000);
    const wA = Math.round(imgA.width * (H / imgA.height));
    const wB = Math.round(imgB.width * (H / imgB.height));
    const canvas = document.createElement('canvas');
    canvas.width = wA + 6 + wB;
    canvas.height = H;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, canvas.width, H);
    ctx.drawImage(imgA, 0, 0, wA, H);
    ctx.drawImage(imgB, wA + 6, 0, wB, H);
    return new Promise(res => canvas.toBlob(blob => res(blob), 'image/jpeg', 0.88));
  }

            {ws.type === 'urgent' && (
              <button onClick={() => setShowWarrantySheet(eq)}
                className="mono" style={{ fontSize:11, color:'var(--brass-bright)', marginTop:4, background:'none', border:'none', padding:0, textDecoration:'underline', cursor:'pointer' }}>
                ⚠ REGISTER NOW — {ws.daysLeft}d LEFT
              </button>
            )}
            {ws.type === 'lapsed' && (
              <button onClick={() => setShowWarrantySheet(eq)}
                className="mono" style={{ fontSize:11, color:'var(--danger)', marginTop:4, background:'none', border:'none', padding:0, textDecoration:'underline', cursor:'pointer' }}>
                ⚠ 60-DAY WINDOW EXPIRED
              </button>
            )}
            {ws.type === 'untracked' && (
              <button onClick={() => setShowWarrantySheet(eq)}
                className="mono" style={{ fontSize:11, color:'var(--muted)', marginTop:4, background:'none', border:'none', padding:0, textDecoration:'underline', cursor:'pointer' }}>
                📋 register warranty
              </button>
            )}
          </div>
          <div style={{ display:"flex", gap:6 }}>
            {eq.job_id && eq.job_id !== job.id && (
              <button onClick={async () => {
                const storagePath = eq.source_photo_url || null;
                if (storagePath) {
                  setLightbox({ url: `${SUPABASE_URL}/storage/v1/object/public/job-photos/${storagePath}`, kind: 'scanned' });
                  return;
                }
                // Fallback: match by closest creation time — scan photo taken ~same time equipment was saved
                const { data } = await sb.from('job_photos').select('storage_path,created_at').eq('job_id', eq.job_id).eq('photo_type', 'equipment').order('created_at', { ascending: true });
                if (!data || data.length === 0) { alert('No equipment photo found.'); return; }
                const equipTime = new Date(eq.created_at || 0).getTime();
                const best = data.reduce((b, p) => {
                  const d = Math.abs(new Date(p.created_at).getTime() - equipTime);
                  return d < b.d ? { p, d } : b;
                }, { p: data[0], d: Infinity }).p;
                if (best.storage_path) setLightbox({ url: `${SUPABASE_URL}/storage/v1/object/public/job-photos/${best.storage_path}`, kind: 'scanned' });
                else alert('Photo unavailable.');
              }} className="mono" style={{ fontSize:13, color:"var(--muted)", padding:"2px 6px" }}>📷</button>
            )}
            <button onClick={() => setExpandedEquipId(expandedEquipId === eq.id ? null : eq.id)}
              className="mono" style={{ fontSize:13, color:"var(--muted)", padding:"2px 6px" }}>
              {expandedEquipId === eq.id ? '▲' : '▼'}
            </button>
            <button onClick={() => setEditEquipItem(eq)}
              className="mono" style={{ fontSize:13, color:"var(--muted)", padding:"2px 6px" }}>✎</button>
            <button onClick={async () => { if (confirm(`Remove "${eq.label}"?`)) { await deleteEquipmentItem(eq.id); setEquipmentList(p => p.filter(e => e.id !== eq.id)); } }}
              className="mono" style={{ fontSize:14, color:"var(--muted)", padding:"2px 6px" }}>✕</button>
          </div>
        </div>
        {expandedEquipId === eq.id && (
          <div style={{ marginTop:10, display:"grid", gridTemplateColumns:"1fr 1fr", gap:6, borderTop:"1px solid var(--line)", paddingTop:10 }}>
            {EQUIP_FIELDS.filter(f => eq[f.key]).map(f => (
              <div key={f.key}>
                <div className="mono" style={{ fontSize:12, color:"var(--muted)" }}>{f.label}</div>
                <div style={{ fontSize:15 }}>{eq[f.key]}</div>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

  const jobEquip = equipmentList.filter(eq => eq.job_id === job.id);
  const otherEquip = equipmentList.filter(eq => eq.job_id !== job.id);
  const crewTimeline = buildCrewTimeline(crewLog, crew, users);
  const isShop = job.customer?.toUpperCase() === TMC_SHOP_NAME; // shop job gets a stripped-down layout
  const isClosed = job.status === 'Closed'; // Closed jobs are locked to field edits — see CLAUDE.md

  // A photo added via the general ADD PHOTO button (no photo_type) turned out to be a receipt —
  // Lightbox's "SCAN AS RECEIPT" already OCR'd it against the existing storage_path (no re-upload).
  async function importPhotoAsReceipt(photo, result) {
    const { data, error } = await insertReceiptRow({
      job_id: job.id,
      amount: result.amount != null ? Number(result.amount) : null,
      vendor: result.vendor || null,
      date: /^\d{4}-\d{2}-\d{2}$/.test(result.date || '') ? result.date : todayISO(),
      storage_path: photo.storage_path || null,
      paid_by: currentUser?.name || null,
      created_at: new Date().toISOString(),
    });
    if (error) { showToast?.('Receipt save failed: ' + error.message, true); return; }
    if (data) setReceipts(r => [...r, data]);
    showToast?.('Added to Receipts');
  }
  async function saveJobReceipt(storagePath) {
    if (!rAmount && !rVendor) { setRSaving(false); return; }
    setRSaving(true);
    const { data, error } = await insertReceiptRow({
      job_id: job.id, amount: Number(rAmount) || null, vendor: rVendor || null,
      date: todayISO(), storage_path: storagePath || null, paid_by: rPaidBy || null,
      created_at: new Date().toISOString(),
    });
    setRSaving(false);
    if (error) { showToast?.('Receipt save failed: ' + error.message, true); return; }
    if (data) setReceipts(r => [...r, data]);
    setRVendor(''); setRAmount(''); setAddingReceipt(false);
  }
  // Snap a receipt: upload, OCR, and SAVE the row immediately (one onChange) so it
  // survives the camera round-trip resetting the form. Review/delete in the list after.
  async function handleJobReceiptFile(e) {
    const file = e.target.files?.[0];
    if (!file) { return; }
    setRScanning(true);
    try {
      const { b64, mediaType } = await readFileForScan(file);
      const path = `${job.id}/receipt-${Date.now()}.${(file.name||'jpg').split('.').pop()}`;
      const { error: upErr } = await sb.storage.from('job-photos').upload(path, file, { cacheControl:'3600', upsert:false });
      if (upErr) { showToast?.('Photo upload failed: ' + upErr.message, true); return; }
      let o = null;
      try { o = await scanReceiptFromB64(b64, mediaType); } catch (err) { console.warn('receipt OCR failed', err); }
      const vendor = (rVendor || o?.vendor || '').toString().trim() || null;
      const amount = Number(rAmount || o?.amount) || null;
      const date = /^\d{4}-\d{2}-\d{2}$/.test(o?.date || '') ? o.date : todayISO();
      const { data, error } = await insertReceiptRow({
        job_id: job.id, amount, vendor, date, storage_path: path, paid_by: rPaidBy || null,
        created_at: new Date().toISOString(),
      });
      if (error) { showToast?.('Receipt save failed: ' + error.message, true); return; }
      if (data) {
        setReceipts(r => [...r, data]);
        setReceiptPagePrompt(data); // multi-page receipts: offer to snap the next page
      }
      setRVendor(''); setRAmount(''); setAddingReceipt(false);
      showToast?.(vendor || amount ? 'Receipt saved' : 'Photo saved — add amount manually');
    } catch (err) {
      showToast?.('Receipt failed: ' + (err.message || 'error'), true);
    } finally {
      setRScanning(false);
      e.target.value = '';
    }
  }
  // Extra page for an existing receipt (target set via receiptPageTargetRef by the button
  // that opened the camera). The row is already saved, so a lost camera round-trip on
  // mobile costs nothing — re-add via the receipt's ✎ ADD PAGE.
  async function handleJobReceiptPageFile(e) {
    const file = e.target.files?.[0];
    const target = receiptPageTargetRef.current;
    if (!file || !target) { if (e.target) e.target.value = ''; return; }
    setRScanning(true);
    try {
      const { storage_path, error } = await appendReceiptPage(target, job.id, file);
      if (error) { showToast?.('Page upload failed: ' + (error.message || 'error'), true); return; }
      const updated = { ...target, storage_path };
      setReceipts(rs => rs.map(x => x.id === target.id ? { ...x, storage_path } : x));
      setReceiptPagePrompt(updated); // keep the prompt up — there may be another page
      receiptPageTargetRef.current = updated;
      showToast?.(`Page ${receiptPages(updated).length} saved`);
    } catch (err) {
      showToast?.('Page failed: ' + (err.message || 'error'), true);
    } finally {
      setRScanning(false);
      e.target.value = '';
    }
  }
  function saveValueEdit() {
    setEditingValue(false);
    if (valueDraft !== (job.value ?? '')) onUpdate({ value: valueDraft });
  }
  function openDepositEdit() {
    setDepositDraft({
      amount: job.deposit_amount ?? '',
      method: job.deposit_method || 'cash',
      check_number: job.deposit_check_number || '',
    });
    setEditingDeposit(true);
  }
  async function saveDeposit() {
    const amt = Number(depositDraft.amount);
    if (!amt || amt <= 0) { showToast?.('Enter a deposit amount', true); return; }
    if (depositDraft.method === 'check' && !depositDraft.check_number.trim()) { showToast?.('Enter a check number', true); return; }
    if (!onUpdateDeposit) return;
    const ok = await onUpdateDeposit(job.id, {
      deposit_amount: amt,
      deposit_method: depositDraft.method,
      deposit_check_number: depositDraft.method === 'check' ? depositDraft.check_number.trim() : null,
    });
    if (ok) setEditingDeposit(false);
  }
  async function removeDeposit() {
    if (!onUpdateDeposit) return;
    const ok = await onUpdateDeposit(job.id, { deposit_amount: null, deposit_method: null, deposit_check_number: null });
    if (ok) setEditingDeposit(false);
  }
  async function saveReceiptEdit() {
    if (!editingReceipt) return;
    const { id, vendor, amount, date, paid_by } = editingReceipt;
    const patch = { vendor: (vendor||'').trim() || null, amount: Number(amount) || null,
      date: date || null, paid_by: paid_by || null };
    const error = await updateReceiptRow(id, patch);
    if (error) { showToast?.('Save failed: ' + error.message, true); return; }
    setReceipts(rs => rs.map(x => x.id === id ? { ...x, ...patch } : x));
    setEditingReceipt(null);
  }
  async function deleteJobReceipt(r) {
    const pages = receiptPages(r);
    if (pages.length) await sb.storage.from('job-photos').remove(pages);
    await sb.from('receipts').delete().eq('id', r.id);
    setReceipts(rs => rs.filter(x => x.id !== r.id));
    if (editingReceipt?.id === r.id) setEditingReceipt(null);
    if (receiptPagePrompt?.id === r.id) setReceiptPagePrompt(null);
  }

  const materialsSection = (
    <div style={{ marginTop:16 }}>
      <div className="mono" style={{ fontSize:13, color:"var(--muted)", marginBottom:8 }}>MATERIALS NEEDED</div>
      {!isClosed && (
        <div style={{ display:"flex", gap:8 }}>
          <input value={matText} onChange={e => setMatText(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') addMaterial(matText); }}
            placeholder="Add a material…"
            style={{ flex:1, boxSizing:"border-box", padding:"10px 12px", borderRadius:8,
              background:"var(--bg)", border:"1px solid var(--line)", color:"var(--text)", fontSize:15, fontFamily:"inherit" }} />
          <button onClick={() => addMaterial(matText)} disabled={!matText.trim()} className="head"
            style={{ padding:"0 16px", borderRadius:8, fontSize:14, fontWeight:700, border:"none",
              background: matText.trim() ? "var(--olive-bright)" : "var(--line)",
              color: matText.trim() ? "var(--bg)" : "var(--muted)" }}>ADD</button>
        </div>
      )}
      {materials.map((m, i) => ({ m, i }))
        .filter(({ m, i }) => !isShop || !m.acquired || shopAcquiredPending.has(i))
        .map(({ m, i }) => {
          const pendingHide = isShop && shopAcquiredPending.has(i);
          return (
        <div key={i} style={{ display:"flex", alignItems:"center", gap:10, padding:"8px 0", borderTop:"1px solid var(--line)" }}>
          <input type="checkbox" checked={!!m.acquired} onChange={() => toggleMaterial(i)} disabled={isClosed}
            style={{ width:20, height:20, accentColor:"var(--green)", cursor: isClosed ? "default" : "pointer", flexShrink:0 }} />
          <span style={{ flex:1, fontSize:15, color: m.acquired ? "var(--muted)" : "var(--text)",
            textDecoration: m.acquired ? "line-through" : "none" }}>{m.text}</span>
          {pendingHide && (
            <button onClick={() => toggleMaterial(i)} className="head"
              style={{ fontSize:13, fontWeight:700, color:"var(--olive-bright)", background:"none", border:"none", padding:"4px 6px", cursor:"pointer", flexShrink:0 }}>
              UNDO
            </button>
          )}
          {!isClosed && !pendingHide && (
            <button onClick={() => removeMaterial(i)} className="mono"
              style={{ background:"none", border:"none", color:"var(--muted)", fontSize:15, padding:"0 4px", cursor:"pointer" }}>✕</button>
          )}
        </div>
          );
        })}
    </div>
  );

  return (
    <div className="fade-in" style={{ paddingBottom:40 }}>
      <div style={{ padding:"16px", borderBottom:"1px solid var(--line)", background:"var(--panel)", display:"flex", alignItems:"center", gap:12 }}>
        <button onClick={onBack} className="head" style={{ fontSize:36, color:"var(--muted)", padding:"4px 12px 4px 4px", lineHeight:1 }}>‹</button>
        <div className="head" style={{ fontSize:18, fontWeight:600 }}>JOB DETAIL</div>
        <button onClick={() => setShowCapCalc(true)} className="mono"
          style={{ marginLeft:"auto", fontSize:13, fontWeight:700, padding:"7px 12px", borderRadius:6,
            border:"1px solid var(--line)", color:"var(--muted)" }}>μF</button>
        {!isClosed && (
          <button onClick={onEdit} className="head"
            style={{ fontSize:13, fontWeight:600, padding:"7px 14px", borderRadius:6,
              border:"1px solid var(--brass)", color:"var(--brass-bright)" }}>EDIT</button>
        )}
      </div>
      {showCapCalc && <CapacitorCalc onClose={() => setShowCapCalc(false)} />}
      {/* Clock status bar in job detail — only shown when this IS the clocked-in job */}
      {clockSession && clockSession.jobId === job.id && (() => {
        const clockJob = clockSession.jobId ? jobs.find(j => j.id === clockSession.jobId) : null;
        return (
          <div style={{ margin:"0 16px 0", padding:"8px 12px", marginTop:8,
            background:"var(--panel-2)", borderRadius:8, border:"1px solid var(--olive)",
            display:"flex", alignItems:"center", gap:8 }}>
            <button onClick={() => clockJob && onJobSelect && onJobSelect(clockJob.id)}
              style={{ textAlign:"left", background:"none", border:"none", padding:0, cursor: clockJob ? "pointer" : "default" }}>
              <div className="head" style={{ fontSize:12, fontWeight:700, color:"var(--green)", lineHeight:1.2 }}>
                {clockJob ? (clockJob.site_name || clockJob.customer) : 'SHOP'}
              </div>
              <div className="mono" style={{ fontSize:10, color: clockSession.status === 'On Site' ? "var(--green)" : ON_BREAK_STATUSES.includes(clockSession.status) ? "var(--gold)" : "var(--muted)", marginTop:2 }}>
                {ON_BREAK_STATUSES.includes(clockSession.status)
                  ? `${clockSession.status.toUpperCase()} — ${(clockSession.pausedReason || 'break').toUpperCase()}`
                  : clockSession.status.toUpperCase()}
              </div>
            </button>
            <ClockTimer startedAt={clockSession.legStartedAt || clockSession.startedAt} todayMs={getTodayMs ? getTodayMs() : 0} paused={clockSession.status === 'Paused'} />
            {clockSession.jobId && !ON_BREAK_STATUSES.includes(clockSession.status) && (
              <button onClick={clockSession.status === 'In Route' ? onFlipToOnSite : undefined} className="head"
                style={{ fontSize:11, fontWeight:700, padding:"4px 10px", borderRadius:5,
                  background: clockSession.status === 'On Site' ? "var(--olive-bright)" : "var(--panel)",
                  color: clockSession.status === 'On Site' ? "var(--bg)" : "var(--text)",
                  border: clockSession.status === 'On Site' ? "none" : "1px solid var(--line)",
                  cursor: clockSession.status === 'On Site' ? "default" : "pointer" }}>
                ON SITE
              </button>
            )}
            {clockSession.jobId && clockSession.status === 'On Site' && (
              <button onClick={onPause} className="head"
                style={{ fontSize:11, fontWeight:700, padding:"4px 10px", borderRadius:5,
                  background:"var(--panel)", border:"1px solid var(--gold)", color:"var(--gold)" }}>
                ⏸ PAUSE
              </button>
            )}
            {ON_BREAK_STATUSES.includes(clockSession.status) && (
              <button onClick={onResume} className="head"
                style={{ fontSize:11, fontWeight:700, padding:"4px 10px", borderRadius:5,
                  background:"var(--olive-bright)", border:"none", color:"var(--bg)" }}>
                ▶ RESUME
              </button>
            )}
            <button onClick={onLeaving} className="head"
              style={{ marginLeft:"auto", fontSize:11, fontWeight:700, padding:"4px 10px", borderRadius:5,
                background:"var(--panel)", border:"1px solid var(--line)", color:"var(--text)" }}>
              HEADING OUT
            </button>
            {clockUndo && (
              <button onClick={onUndoClock} className="head"
                style={{ padding:"6px 14px", borderRadius:20, flexShrink:0,
                  background:"var(--olive-bright)", border:"2px solid var(--olive)",
                  color:"var(--bg)", fontSize:13, fontWeight:700 }}>
                UNDO
              </button>
            )}
          </div>
        );
      })()}
      <div style={{ padding:16 }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:10 }}>
          <div className="head" style={{ fontSize:24, fontWeight:700, lineHeight:1.1 }}>{job.customer}</div>
          <div style={{ display:"flex", alignItems:"center", gap:8 }}>
            {job.status === 'Closed' && onDuplicate && (
              <button onClick={onDuplicate} className="head"
                style={{ fontSize:12, fontWeight:700, padding:"5px 12px", borderRadius:6,
                  border:"1px solid var(--brass)", color:"var(--brass-bright)", background:"transparent" }}>
                DUPLICATE →
              </button>
            )}
            <StatusPill status={job.status} />
          </div>
        </div>
        <div style={{ fontSize:14, color:"var(--muted)", marginTop:6 }}>{job.type}</div>
        {(job.location && siteAddr(job).trim() === custAddr(job).trim()) ? (
          <div className="head" style={{ fontSize:15, fontWeight:600, color:"var(--brass-bright)", marginTop:6 }}>📍 {job.location}</div>
        ) : null}

        {/* Compact time summary */}
        {(() => {
          const today = todayISO();
          const techsToday = users.filter(u => {
            const periods = (crewTimeline[u.name] || []).filter(p => dateISOInTZ(new Date(p.start), getAppTZ()) === today);
            if (periods.length === 0) return false;
            const totalMs = periods.reduce((sum,p) => sum + (new Date(p.end || Date.now()) - new Date(p.start)), 0);
            return totalMs > 0;
          });
          if (techsToday.length === 0) return null;
          return (
            <div style={{ marginTop:12, padding:"10px 14px", background:"var(--panel)", border:"1px solid var(--line)", borderRadius:10 }}>
              <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginBottom:8, letterSpacing:"0.08em" }}>TODAY'S TIME</div>
              {techsToday.map(u => {
                const periods = (crewTimeline[u.name] || []).filter(p => dateISOInTZ(new Date(p.start), getAppTZ()) === today);
                const driveMs = periods.filter(p => p.status === 'In Route')
                  .reduce((sum,p) => sum + (new Date(p.end || Date.now()) - new Date(p.start)), 0);
                const onSiteMs = periods.filter(p => p.status === 'On Site')
                  .reduce((sum,p) => sum + (new Date(p.end || Date.now()) - new Date(p.start)), 0);
                const totalMs = driveMs + onSiteMs;
                const isOngoing = periods.some(p => p.ongoing);
                return (
                  <div key={u.id} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", paddingTop:6,
                    borderTop: u !== techsToday[0] ? "1px solid var(--line)" : "none", marginTop: u !== techsToday[0] ? 6 : 0 }}>
                    <div className="head" style={{ fontSize:14, fontWeight:700, color:"var(--text)" }}>
                      {u.name}{isOngoing ? <span style={{ color:"var(--green)", marginLeft:6, fontSize:11 }}>●</span> : null}
                    </div>
                    <div style={{ textAlign:"right" }}>
                      <div className="mono" style={{ fontSize:14, fontWeight:700, color:"var(--olive-bright)" }}>
                        {fmtElapsed(totalMs)}
                      </div>
                      {(driveMs > 0 && onSiteMs > 0) && (
                        <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginTop:2 }}>
                          {fmtElapsed(driveMs)} drive · {fmtElapsed(onSiteMs)} on site
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          );
        })()}

        {isShop && materialsSection}

        {!isShop && (
          <div style={{ marginTop:14, padding:14, background:"var(--panel)", border:"1px solid var(--line)", borderRadius:10, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
            <span className="mono" style={{ fontSize:13, color:"var(--muted)" }}>JOB VALUE</span>
            {editingValue ? (
              <input type="number" inputMode="decimal" autoFocus value={valueDraft}
                onChange={e => setValueDraft(e.target.value)}
                onBlur={saveValueEdit}
                onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); }}
                className="head" style={{ fontSize:24, fontWeight:700, color:"var(--olive-bright)",
                  width:120, textAlign:"right", background:"var(--bg)", border:"1px solid var(--olive)",
                  borderRadius:6, padding:"2px 6px" }} />
            ) : (
              <span className="head"
                onClick={isClosed ? undefined : () => { setValueDraft(job.value || ''); setEditingValue(true); }}
                style={{ fontSize:24, fontWeight:700, color:"var(--olive-bright)",
                  cursor: isClosed ? "default" : "pointer" }}>
                {money(job.value)}{!isClosed && ' ✎'}
              </span>
            )}
          </div>
        )}

        {!isShop && (
          <div style={{ marginTop:10, padding:14, background:"var(--panel)", border: editingDeposit ? "1px solid var(--olive-bright)" : "1px solid var(--line)", borderRadius:10 }}>
            {editingDeposit ? (
              <>
                <div className="mono" style={{ fontSize:13, color:"var(--muted)", marginBottom:10 }}>DEPOSIT</div>
                <input type="number" inputMode="decimal" autoFocus placeholder="$ Amount"
                  value={depositDraft.amount} onChange={e => setDepositDraft(d => ({ ...d, amount:e.target.value }))}
                  style={{ width:"100%", boxSizing:"border-box", marginBottom:10, padding:"10px 12px", borderRadius:8,
                    background:"var(--bg)", border:"1px solid var(--line)", color:"var(--text)", fontSize:15, fontFamily:"inherit" }} />
                <div style={{ display:"flex", gap:8, marginBottom:10 }}>
                  <button onClick={() => setDepositDraft(d => ({ ...d, method:'cash' }))} className="head"
                    style={{ flex:1, padding:12, borderRadius:8, fontSize:14, fontWeight:700,
                      background: depositDraft.method === 'cash' ? "var(--olive-bright)" : "var(--panel)",
                      color: depositDraft.method === 'cash' ? "var(--bg)" : "var(--text)",
                      border: depositDraft.method === 'cash' ? "none" : "1px solid var(--line)" }}>
                    💵 CASH
                  </button>
                  <button onClick={() => setDepositDraft(d => ({ ...d, method:'check' }))} className="head"
                    style={{ flex:1, padding:12, borderRadius:8, fontSize:14, fontWeight:700,
                      background: depositDraft.method === 'check' ? "var(--olive-bright)" : "var(--panel)",
                      color: depositDraft.method === 'check' ? "var(--bg)" : "var(--text)",
                      border: depositDraft.method === 'check' ? "none" : "1px solid var(--line)" }}>
                    📝 CHECK
                  </button>
                </div>
                {depositDraft.method === 'check' && (
                  <input placeholder="Check #" value={depositDraft.check_number}
                    onChange={e => setDepositDraft(d => ({ ...d, check_number:e.target.value }))}

                                .slice().sort((a,b) => (a.customer||'').localeCompare(b.customer||''))
                                .map(j => (
                                  <option key={j.id} value={j.id}>
                                    {j.customer}{j.site_address ? ` — ${j.site_address}` : ''}
                                  </option>
                                ))}
                            </select>
                            <button onClick={() => saveLogEdit(p)} className="head"
                              style={{ width:"100%", padding:"9px 0", borderRadius:8, fontSize:13, fontWeight:700, background:"var(--olive-bright)", color:"var(--bg)" }}>SAVE</button>
                          </div>
                        )}
                      </div>
                    );
                  })}
                  <div className="mono" style={{ fontSize:12, color:"var(--olive-bright)", marginTop:6 }}>
                    Drive: {fmtElapsed(driveMs)} · On Site: {fmtElapsed(onSiteMs)}{runMs > 0 ? ` · Run: ${fmtElapsed(runMs)}` : ''}
                  </div>
                  {!isClosed && (addingLogFor === name ? (
                    <div style={{ marginTop:8, padding:10, background:"var(--panel)", border:"1px solid var(--line)", borderRadius:8 }}>
                      <div style={{ display:"flex", gap:6, marginBottom:8 }}>
                        {['In Route','On Site'].map(s => (
                          <button key={s} onClick={() => setAddLogStatus(s)} className="head"
                            style={{ flex:1, fontSize:12, fontWeight:700, padding:"8px 6px", borderRadius:6,
                              background: addLogStatus === s ? "var(--olive-bright)" : "var(--bg)",
                              color: addLogStatus === s ? "var(--bg)" : "var(--text)",
                              border:"1px solid var(--line)" }}>{s.toUpperCase()}</button>
                        ))}
                      </div>
                      <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
                        <div style={{ flex:1, minWidth:140 }}>
                          <div className="mono" style={{ fontSize:11, color:"var(--muted)" }}>START</div>
                          <input type="datetime-local" value={addLogStart} onChange={e => setAddLogStart(e.target.value)} />
                        </div>
                        <div style={{ flex:1, minWidth:140 }}>
                          <div className="mono" style={{ fontSize:11, color:"var(--muted)" }}>END</div>
                          <input type="datetime-local" value={addLogEnd} onChange={e => setAddLogEnd(e.target.value)} />
                        </div>
                      </div>
                      <div style={{ display:"flex", gap:8, marginTop:10 }}>
                        <button onClick={() => saveAddLog(name)} className="head"
                          style={{ flex:1, padding:"10px 0", borderRadius:8, fontSize:13, fontWeight:700, background:"var(--olive-bright)", color:"var(--bg)" }}>SAVE</button>
                        <button onClick={() => setAddingLogFor(null)} className="head"
                          style={{ padding:"10px 14px", borderRadius:8, fontSize:13, fontWeight:600, background:"transparent", border:"1px solid var(--line)", color:"var(--text)" }}>CANCEL</button>
                      </div>
                    </div>
                  ) : (
                    <button onClick={() => openAddLog(name)} className="mono"
                      style={{ fontSize:12, color:"var(--muted)", marginTop:8, padding:"4px 0" }}>+ ADD ENTRY</button>
                  ))}
                </div>
              );
            })}
          </div>
        )}

        <div style={{ marginTop:20, display:"flex", flexDirection:"column", alignItems:"center", gap:6 }}>
          <div className="mono" style={{ fontSize:12, color:"var(--muted)" }}>CURRENT STATUS</div>
          <StatusPill status={job.status} />
        </div>
        <button onClick={() => setShowStatus(true)} className="head"
          style={{ width:"100%", marginTop:8, padding:16, borderRadius:10, fontSize:16, fontWeight:700, background:"var(--olive-bright)", color:"var(--bg)" }}>
          UPDATE STATUS →
        </button>
        <button onClick={() => { if (confirm("Delete this job?")) onDelete(); }} className="head"
          style={{ width:"100%", marginTop:10, padding:13, borderRadius:10, fontSize:14, fontWeight:600, background:"transparent", color:"var(--danger)", border:"1px solid var(--danger)" }}>
          DELETE JOB
        </button>
        <button onClick={onBack} className="head"
          style={{ width:"100%", marginTop:10, padding:13, borderRadius:10, fontSize:16, fontWeight:600, background:"transparent", color:"var(--muted)", border:"1px solid var(--line)" }}>
          ‹ BACK
        </button>
      </div>

      {showStatus && (
        <Sheet onClose={() => setShowStatus(false)} title="UPDATE STATUS">
          {WORKFLOW_STATUSES.map(s => (
            <button key={s} onClick={() => {
              setShowStatus(false);
              if (s === 'In Route' || s === 'On Site') {
                setPendingStatus(s);
                setConfirmTime(nowTimeHHMM());
              } else if (s === 'Ready to Schedule') {
                onUpdate({ status: s, scheduled_date: null, scheduled_time: null });
                onBack();
              } else {
                onUpdate({ status: s });
                onBack();
              }
            }} style={{ display:"flex", width:"100%", alignItems:"center", justifyContent:"space-between", padding:"14px 4px", borderBottom:"1px solid var(--line)", textAlign:"left" }}>
              <StatusPill status={s} />
              {job.status === s && <span style={{ color:"var(--olive-bright)" }}>✓</span>}
            </button>
          ))}
        </Sheet>
      )}

      {pendingStatus && (
        <Sheet onClose={() => setPendingStatus(null)} title={`SET TO ${pendingStatus.toUpperCase()}`}>
          <div className="mono" style={{ fontSize:12, color:"var(--muted)", marginBottom:14, marginTop:4 }}>IS THIS THE RIGHT TIME?</div>
          <input type="time" value={confirmTime} onChange={e => setConfirmTime(e.target.value)}
            style={{ width:"100%", boxSizing:"border-box", padding:"16px 12px", marginBottom:10,
              borderRadius:10, border:"1px solid var(--olive)", background:"var(--bg)",
              color:"var(--text)", fontSize:28, fontFamily:"'Share Tech Mono',monospace", textAlign:"center" }} />
          <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginBottom:18, textAlign:"center" }}>
            REWIND IF YOU FORGOT TO HIT THE BUTTON
          </div>
          <button onClick={() => {
            const at = zonedWallToISO(todayLocalISO(), confirmTime); // picked time = app TZ today
            const s = pendingStatus;
            onUpdate({ status: s, _at: at });
            setPendingStatus(null);
            if (s === 'In Route' && (siteAddr(job) || custAddr(job)).trim()) {
              setShowMapsPrompt(true);
            } else {
              onBack();
            }
          }} className="head"
            style={{ width:"100%", padding:16, marginBottom:10, borderRadius:10, fontSize:16, fontWeight:700,
              background:"var(--olive-bright)", color:"var(--bg)", border:"none" }}>
            ✓ CONFIRM
          </button>
          <button onClick={() => setPendingStatus(null)} className="head"
            style={{ width:"100%", padding:13, borderRadius:10, fontSize:14, fontWeight:700,
              background:"var(--panel)", border:"1px solid var(--line)", color:"var(--muted)" }}>
            CANCEL
          </button>
        </Sheet>
      )}

      {showMapsPrompt && (
        <Sheet onClose={() => setShowMapsPrompt(false)} title="IN ROUTE">
          <div style={{ textAlign:"center", padding:"8px 0 20px" }}>
            <div className="mono" style={{ fontSize:13, color:"var(--muted)", marginBottom:6 }}>WANT DIRECTIONS?</div>
            <div className="head" style={{ fontSize:15, color:"var(--text)", marginBottom:20 }}>
              {siteAddr(job) || custAddr(job)}
            </div>
            <button onClick={() => { openMapsNav(job); setShowMapsPrompt(false); }} className="head"
              style={{ width:"100%", padding:16, marginBottom:10, borderRadius:10, fontSize:16, fontWeight:700,
                background:"var(--olive-bright)", color:"var(--bg)", border:"none" }}>
              YES — OPEN MAPS
            </button>
            <button onClick={() => setShowMapsPrompt(false)} className="head"
              style={{ width:"100%", padding:14, borderRadius:10, fontSize:15, fontWeight:700,
                background:"var(--panel)", border:"1px solid var(--line)", color:"var(--muted)" }}>
              NO THANKS
            </button>
          </div>
        </Sheet>
      )}

      {showResched && (
        <Sheet onClose={() => setShowResched(false)} title={job.has_schedule ? "RESCHEDULE" : "SCHEDULE"}>
          <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginBottom:6, marginTop:4 }}>DATE</div>
          <input type="date" value={date} min={todayISO()} onChange={e => setDate(e.target.value)} />
          <div className="mono" style={{ fontSize:11, color:"var(--muted)", margin:"14px 0 6px" }}>TIME</div>
          <input type="time" value={time} min={date === todayLocalISO() ? nowTimeRounded15() : undefined} onChange={e => setTime(e.target.value)} />
          <button onClick={() => {
              const iso = zonedWallToISO(date, time);
              const dt = iso ? new Date(iso) : NaN;
              if (isNaN(dt) || dt < new Date()) { alert('Please choose a date and time that is not in the past.'); return; }
              const patch = { scheduled_date:date, scheduled_time:time };
              if (job.status === 'Ready to Schedule') patch.status = 'Scheduled';
              onUpdate(patch); setShowResched(false);
            }} className="head"
            style={{ width:"100%", marginTop:18, padding:15, borderRadius:9, fontSize:16, fontWeight:700, background:"var(--olive-bright)", color:"var(--bg)" }}>
            SAVE
          </button>
        </Sheet>
      )}
    </div>
  );
}

/* ── LocationPickerSheet ───────────────────────────────────────────────────── */
function LocationPickerSheet({ lat, lng, onConfirm, onCancel }) {
  const mapDivRef = useRef(null);
  const mapRef = useRef(null);
  const [geocoding, setGeocoding] = useState(false);
  const [query, setQuery] = useState('');
  const [searching, setSearching] = useState(false);
  const [searchResults, setSearchResults] = useState([]);
  const [showResults, setShowResults] = useState(false);
  // When user selects a search result we store the address to skip reverse geocode on confirm
  const pinnedAddrRef = useRef(null);
  const searchTimerRef = useRef(null);

  useEffect(() => {
    if (!mapDivRef.current || mapRef.current) return;
    const map = L.map(mapDivRef.current, { center: [lat, lng], zoom: 18, zoomControl: false });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap', maxZoom: 19,
    }).addTo(map);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    mapRef.current = map;
    setTimeout(() => map.invalidateSize(), 120);
    return () => { map.remove(); mapRef.current = null; };
  }, []);

  function addrFromNominatim(data) {
    const a = data.address || {};
    const street = a.house_number && a.road ? `${a.house_number} ${a.road}` : (a.road || '');
    const city = a.city || a.town || a.village || a.hamlet || '';
    return [street, city, a.state, a.postcode].filter(Boolean).join(', ') || data.display_name || '';
  }

  function addrFromGoogleComponents(components, formatted) {
    if (!components) return formatted || '';
    const get = type => components.find(c => c.types.includes(type)) || {};
    const streetNumber = get('street_number').longText;
    const route = get('route').longText;
    const street = streetNumber && route ? `${streetNumber} ${route}` : (route || '');
    const city = get('locality').longText || get('sublocality').longText || get('postal_town').longText || '';
    const stateAbbr = get('administrative_area_level_1').shortText;
    const postcode = get('postal_code').longText;
    return [street, city, stateAbbr, postcode].filter(Boolean).join(', ') || formatted || '';
  }

  const placesLibRef = useRef(null);
  const sessionTokenRef = useRef(null);
  async function getPlacesLib() {
    if (!placesLibRef.current) placesLibRef.current = await google.maps.importLibrary("places");
    return placesLibRef.current;
  }

  async function runSearch(q) {
    if (!q.trim()) { setSearchResults([]); setShowResults(false); return; }
    setSearching(true);
    try {
      const { AutocompleteSuggestion, AutocompleteSessionToken } = await getPlacesLib();
      const center = mapRef.current ? mapRef.current.getCenter() : { lat, lng };
      if (!sessionTokenRef.current) sessionTokenRef.current = new AutocompleteSessionToken();
      const { suggestions } = await AutocompleteSuggestion.fetchAutocompleteSuggestions({
        input: q,
        locationBias: { center: { lat: center.lat, lng: center.lng }, radius: 40000 },
        includedRegionCodes: ['us'],
        sessionToken: sessionTokenRef.current,
      });
      setSearchResults(suggestions || []);
      setShowResults(true);
    } catch(e) {
      console.warn('places search error', e);
      setSearchResults([]);
    } finally {
      setSearching(false);
    }
  }

  function handleQueryChange(v) {
    setQuery(v);
    pinnedAddrRef.current = null;
    clearTimeout(searchTimerRef.current);
    if (v.trim().length >= 3) {
      searchTimerRef.current = setTimeout(() => runSearch(v), 500);
    } else {
      setSearchResults([]);
      setShowResults(false);
    }
  }

  async function selectResult(pred) {
    setShowResults(false);
    setSearching(true);
    try {
      const place = pred.toPlace();
      await place.fetchFields({ fields: ['location','formattedAddress','displayName','addressComponents'] });
      const addr = addrFromGoogleComponents(place.addressComponents, place.formattedAddress);
      const name = place.displayName || null;
      pinnedAddrRef.current = { addr, name };
      setQuery(name || addr);
      if (mapRef.current && place.location) {
        mapRef.current.setView([place.location.lat(), place.location.lng()], 18);
      }
    } catch(e) {
      console.warn('place details error', e);
    } finally {
      sessionTokenRef.current = null;
      setSearching(false);
    }
  }

  async function confirm() {
    if (!mapRef.current || geocoding) return;
    // If user picked a search result, use that address directly
    if (pinnedAddrRef.current) {
      onConfirm(pinnedAddrRef.current);
      return;
    }
    setGeocoding(true);
    const c = mapRef.current.getCenter();
    try {
      const r = await fetch(
        `https://nominatim.openstreetmap.org/reverse?lat=${c.lat}&lon=${c.lng}&format=json`,
        { headers: { 'Accept-Language': 'en-US,en' } }
      );
      const data = await r.json();
      onConfirm({ addr: addrFromNominatim(data), name: data.name || null });
    } catch(e) {
      alert('Could not look up address. Try again.');
    } finally {
      setGeocoding(false);
    }
  }

  return (
    <div style={{ position:'fixed', inset:0, zIndex:400, display:'flex', flexDirection:'column', background:'var(--bg)' }}>
      {/* Header */}
      <div style={{ display:'flex', alignItems:'center', gap:8, padding:'10px 12px', borderBottom:'1px solid var(--line)', flexShrink:0 }}>
        <button onClick={onCancel} style={{ background:'none', border:'none', color:'var(--muted)', fontSize:22, lineHeight:1, padding:4 }}>✕</button>
        <div style={{ flex:1, position:'relative' }}>
          <input
            type="text"
            placeholder="Search address or business…"
            value={query}
            onChange={e => handleQueryChange(e.target.value)}
            onFocus={() => { if (searchResults.length) setShowResults(true); }}
            style={{ width:'100%', padding:'9px 12px', borderRadius:8, border:'1px solid var(--line)',
              background:'var(--panel)', color:'var(--text)', fontSize:15, boxSizing:'border-box' }}
          />
          {searching && (
            <div style={{ position:'absolute', right:10, top:'50%', transform:'translateY(-50%)', color:'var(--muted)', fontSize:12 }}>…</div>
          )}
          {showResults && searchResults.length > 0 && (
            <div style={{ position:'absolute', top:'100%', left:0, right:0, zIndex:500,
              background:'var(--panel)', border:'1px solid var(--line)', borderRadius:8,
              boxShadow:'0 4px 16px rgba(0,0,0,0.5)', marginTop:4, maxHeight:260, overflowY:'auto' }}>
              {searchResults.map((sug, i) => {
                const pred = sug.placePrediction;
                const main = pred.mainText ? pred.mainText.text : pred.text.text;
                const secondary = pred.secondaryText ? pred.secondaryText.text : '';
                return (
                  <div key={pred.placeId || i} onClick={() => selectResult(pred)}
                    style={{ padding:'10px 14px', borderBottom: i < searchResults.length-1 ? '1px solid var(--line)' : 'none',
                      cursor:'pointer', lineHeight:1.3 }}>
                    <div style={{ fontWeight:700, fontSize:14, color:'var(--text)' }}>{main}</div>
                    {secondary && <div style={{ fontSize:12, color:'var(--muted)', marginTop:2 }}>{secondary}</div>}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>
      {/* Map */}
      <div style={{ flex:1, position:'relative', minHeight:0 }}>
        <div ref={mapDivRef} style={{ width:'100%', height:'100%' }} />
        <div style={{ position:'absolute', top:'50%', left:'50%',
          transform:'translate(-50%, -100%)', zIndex:1000, pointerEvents:'none',
          fontSize:36, lineHeight:1, filter:'drop-shadow(0 2px 4px rgba(0,0,0,0.6))' }}>
          📍
        </div>
        <div style={{ position:'absolute', bottom:8, left:'50%', transform:'translateX(-50%)',
          background:'rgba(0,0,0,0.55)', color:'#ccc', fontSize:11, padding:'4px 10px',
          borderRadius:20, pointerEvents:'none', whiteSpace:'nowrap' }}>
          DRAG MAP · PIN STAYS CENTERED
        </div>
      </div>
      {/* Footer */}
      <div style={{ display:'flex', gap:10, padding:'12px 16px', flexShrink:0, borderTop:'1px solid var(--line)' }}>
        <button onClick={confirm} disabled={geocoding} className="head"
          style={{ flex:1, padding:15, borderRadius:9, fontSize:16, fontWeight:700,
            background:'var(--olive-bright)', color:'var(--bg)',
            opacity: geocoding ? 0.6 : 1 }}>
          {geocoding ? 'LOCATING…' : 'USE THIS LOCATION'}
        </button>
        <button onClick={onCancel} className="head"
          style={{ padding:'15px 18px', borderRadius:9, fontSize:15,
            background:'var(--panel)', border:'1px solid var(--line)', color:'var(--text)' }}>
          CANCEL
        </button>
      </div>
    </div>
  );
}

/* ── JobForm ───────────────────────────────────────────────────────────────── */
function JobForm({ onSave, onCancel, initial, prefill, allJobs }) {
  const editing = !!(initial && initial.id);
  const customers = React.useMemo(() => deriveCustomers(allJobs||[]), [allJobs]);
  const [locating, setLocating] = useState(false);
  const [f, setF] = useState(initial ? {
    ...initial,
    customer_address: initial.customer_address||initial.address||"",
    site_address: initial.site_address||initial.address||"",
    same_address: initial.same_address !== undefined
      ? initial.same_address
      : ((initial.customer_address||initial.address||"") === (initial.site_address||initial.address||"")),
    value: initial.value===0||initial.value ? String(initial.value) : "",
    site_name: initial.site_name || "",
    scheduled_date: initial.scheduled_date || '',
    scheduled_time: initial.scheduled_time || '',
  } : {
    customer:"", location:"", customer_address:"", site_address:"", site_name:"",
    same_address: loadSameAddrPref(),
    phone:"", email:"", type:"Service Call",
    status:"New", scheduled_date: '', scheduled_time: '',
    value:"", original_ask:"", notes:"", history:[],
    ...(prefill || {}),
  });
  const set = (k,v) => setF(s => ({...s,[k]:v}));
  const [pendingLocation, setPendingLocation] = useState(null); // { field, addr, name }
  const [mapPicker, setMapPicker] = useState(null); // { field, lat, lng }

  async function useCurrentLocation(field) {
    if (!navigator.geolocation) { alert('Geolocation not supported by this browser.'); return; }
    setLocating(true);
    try {
      const pos = await new Promise((res, rej) =>
        navigator.geolocation.getCurrentPosition(res, rej, { timeout: 10000, enableHighAccuracy: true })
      );
      setMapPicker({ field, lat: pos.coords.latitude, lng: pos.coords.longitude });
    } catch(err) {
      alert(err.code === 1 ? 'Location permission denied — enable it in browser settings.' : 'Could not get location. Try again.');
    } finally {
      setLocating(false);
    }
  }

  function confirmLocation() {
    if (!pendingLocation) return;
    if (pendingLocation.field === 'customer_address') setCustomerAddr(pendingLocation.addr);
    else set('site_address', pendingLocation.addr);
    setPendingLocation(null);
  }

  const [showCustList, setShowCustList] = useState(false);
  const [pickedSites, setPickedSites] = useState(null);
  const [addingNewSite, setAddingNewSite] = useState(false);

  const custNames = Object.keys(customers);
  const typed = (f.customer||"").trim().toLowerCase();
  const matches = typed.length > 0
    ? custNames.filter(n => n.toLowerCase().includes(typed) && n.toLowerCase() !== typed)
    : [];

  function onCustomerType(v) { setF(s=>({...s,customer:v})); setShowCustList(true); setPickedSites(null); setAddingNewSite(false); }
  function pickCustomer(name) {
    const rec = customers[name]; setShowCustList(false);
    const hasSites = rec.sites && rec.sites.length > 0;
    setF(s => ({ ...s, customer:name, customer_address:rec.customer_address||"", phone:rec.phone||"", email:rec.email||"",
      same_address: hasSites ? false : s.same_address,
      location: hasSites ? "" : s.location,
      site_name: "",
      site_address: hasSites ? "" : (s.same_address ? rec.customer_address||"" : s.site_address) }));
    setPickedSites(hasSites ? rec.sites : null); setAddingNewSite(false);
  }
  function pickSite(site) { setF(s=>({...s,site_address:site.site_address,site_name:site.site_name||'',same_address:false})); setAddingNewSite(false); }
  function toggleSameAddr() {
    setF(s => { const next=!s.same_address; saveSameAddrPref(next);
      return next ? {...s,same_address:true,site_address:s.customer_address,site_name:''} : {...s,same_address:false}; });
  }
  function setCustomerAddr(v) { setF(s => s.same_address ? {...s,customer_address:v,site_address:v} : {...s,customer_address:v}); }

  const valid = f.customer.trim().length > 0;

  return (
    <div className="fade-in" style={{ paddingBottom:40 }}>
      <div style={{ padding:"16px", borderBottom:"1px solid var(--line)", background:"var(--panel)", display:"flex", alignItems:"center", gap:12 }}>
        <button onClick={onCancel} className="head" style={{ fontSize:36, color:"var(--muted)", padding:"4px 12px 4px 4px", lineHeight:1 }}>‹</button>
        <div className="head" style={{ fontSize:18, fontWeight:600 }}>{editing?"EDIT JOB":"NEW JOB"}</div>
      </div>
      <div style={{ padding:16, display:"flex", flexDirection:"column", gap:14 }}>
        <div style={{ position:"relative" }}>
          <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginBottom:6 }}>CUSTOMER</div>
          <input type="text" placeholder="Name or business" value={f.customer} autoCapitalize="words"
            onChange={e => editing ? set("customer",e.target.value) : onCustomerType(e.target.value)}
            onFocus={() => !editing && setShowCustList(true)} />
          {!editing && showCustList && matches.length > 0 && (
            <div className="fade-in" style={{ position:"absolute", top:"100%", left:0, right:0, zIndex:20,
              background:"var(--panel-2)", border:"1px solid var(--olive)", borderRadius:8, marginTop:4, overflow:"hidden" }}>
              {matches.slice(0,6).map(name => (
                <button key={name} onClick={() => pickCustomer(name)}
                  style={{ display:"block", width:"100%", textAlign:"left", padding:"12px 14px", borderBottom:"1px solid var(--line)" }}>
                  <span className="head" style={{ fontSize:15, fontWeight:600 }}>{name}</span>
                  {customers[name].sites.length > 0 && (
                    <span className="mono" style={{ fontSize:11, color:"var(--brass)", marginLeft:8 }}>
                      {customers[name].sites.length} site{customers[name].sites.length>1?"s":""}
                    </span>
                  )}
                </button>
              ))}
            </div>
          )}
        </div>
        <div>
          <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginBottom:6 }}>CUSTOMER ADDRESS</div>
          <div style={{ display:"flex", gap:8 }}>
            <input type="text" placeholder="Main / billing address" autoCapitalize="words"
              value={f.customer_address} onChange={e => setCustomerAddr(e.target.value)}
              style={{ flex:1, minWidth:0 }} />
            {!f.customer_address.trim() && (
