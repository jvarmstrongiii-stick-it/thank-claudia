              YES — NAVIGATE
            </button>
            <button onClick={() => setPendingMapsJob(null)} className="head"
              style={{ flex:1, padding:16, fontSize:16, fontWeight:700, borderRadius:10,
                background:"var(--panel)", border:"1px solid var(--line)", color:"var(--muted)" }}>
              NO THANKS
            </button>
          </div>
        </Sheet>
      )}
      {toast && <Toast msg={toast.msg} isError={toast.isError} />}
      <VoiceButton onCommand={processVoiceCommand} />
    </React.Fragment>
  );

  const isActive = s => s !== "Completed/Paid" && s !== "Closed";
  const usedStatuses = STATUSES.filter(s => s !== "Closed" && jobs.some(j => j.status === s));
  const hasClosed = jobs.some(j => j.status === "Closed");
  const FILTERS = [...usedStatuses, "All", ...(hasClosed ? ["Closed"] : [])];
  const effectiveFilter = filter ?? usedStatuses[0] ?? "All";
  const q = search.trim().toLowerCase();
  const visibleRecentJobs = recentJobs.filter(r => (jobs.find(j => j.id === r.id) || r).status !== 'Closed');
  const upcomingJobs = getCalendarJobs(jobs)
    .filter(j => j.scheduled_date >= todayISO())
    .sort((a,b) => (a.scheduled_date + a.scheduled_time).localeCompare(b.scheduled_date + b.scheduled_time))
    .slice(0, 6);

  function matchesSearch(j) {
    if (!q) return true;
    if (j.status === "Closed" && !searchClosed) return false;
    const hay = [j.customer, j.phone, j.notes, custAddr(j), siteAddr(j), j.site_name, j.location]
      .filter(Boolean).join(" ").toLowerCase();
    return hay.includes(q);
  }

  const shown = q ? jobs.filter(matchesSearch) : jobs.filter(j => effectiveFilter === "All" ? j.status !== "Closed" : j.status === effectiveFilter);
  // Closed tab: most-recently-closed first, not the default scheduled_at order — closed jobs'
  // schedules are frozen/irrelevant, what matters is when they were actually closed.
  if (!q && effectiveFilter === "Closed") {
    shown.sort((a, b) => (b.closed_at || b.updated_at || '').localeCompare(a.closed_at || a.updated_at || ''));
  }
  const outstanding = jobs.filter(j => isActive(j.status)).reduce((s,j) => s + jobBalance(j), 0);

  return (
    <div className="fade-in">
      {/* Header */}
      <div style={{ padding:"14px 16px 12px", borderBottom:"1px solid var(--line)", background:"var(--panel)" }}>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
          <div>
            <div className="head" style={{ fontSize:22, fontWeight:700, lineHeight:1 }}>
              TMC <span style={{ color:"var(--brass-bright)" }}>MECHANICAL</span>
            </div>
            <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginTop:3, letterSpacing:"0.1em" }}>FIELD JOB TRACKER</div>
          </div>
          <div style={{ display:"flex", alignItems:"center", gap:12 }}>
            <button onClick={() => setShowBalances(true)} style={{ textAlign:"right", background:"none", border:"none", padding:0, cursor:"pointer" }}>
              <div className="mono" style={{ fontSize:10, color:"var(--muted)" }}>OUTSTANDING</div>
              <div className="head" style={{ fontSize:20, fontWeight:700, color:"var(--olive-bright)" }}>{money(outstanding)}</div>
            </button>
            <button onClick={() => setShowMenu(true)}
              style={{ display:"flex", flexDirection:"column", gap:5, padding:"8px 10px",
                background:"none", border:"1px solid var(--line)", borderRadius:8, cursor:"pointer" }}>
              <span style={{ display:"block", width:20, height:2, background:"var(--text)", borderRadius:1 }} />
              <span style={{ display:"block", width:20, height:2, background:"var(--text)", borderRadius:1 }} />
              <span style={{ display:"block", width:20, height:2, background:"var(--text)", borderRadius:1 }} />
            </button>
          </div>
        </div>
        {/* Clock status bar */}
        {clockSession && (() => {
          const clockJob = clockSession.jobId ? jobs.find(j => j.id === clockSession.jobId) : null;
          return (
            <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:8, padding:"8px 12px",
              background:"var(--panel-2)", borderRadius:8, border:"1px solid var(--olive)" }}>
              <div>
                <div className="head" style={{ fontSize:12, fontWeight:700, color:"var(--green)", lineHeight:1.2 }}>
                  {clockJob ? (clockJob.site_name || clockJob.customer) : 'SHOP'}
                </div>
                <div className="mono" style={{ fontSize:10, color: clockSession.status === 'On Site' ? "var(--green)" : ON_BREAK_STATUSES.includes(clockSession.status) ? "var(--gold)" : "var(--muted)", marginTop:2 }}>
                  {ON_BREAK_STATUSES.includes(clockSession.status)
                    ? `${clockSession.status.toUpperCase()} — ${(clockSession.pausedReason || 'break').toUpperCase()}`
                    : clockSession.status.toUpperCase()}
                </div>
              </div>
              <ClockTimer startedAt={clockSession.legStartedAt || clockSession.startedAt} todayMs={getTodayMs(currentUser.id)} paused={clockSession.status === 'Paused'} />
              {clockSession.jobId && !ON_BREAK_STATUSES.includes(clockSession.status) && (
                <button onClick={clockSession.status === 'In Route' ? handleFlipToOnSite : undefined} className="head"
                  style={{ fontSize:11, fontWeight:700, padding:"4px 10px", borderRadius:5,
                    background: clockSession.status === 'On Site' ? "var(--olive-bright)" : "var(--panel)",
                    color: clockSession.status === 'On Site' ? "var(--bg)" : "var(--text)",
                    border: clockSession.status === 'On Site' ? "none" : "1px solid var(--line)",
                    cursor: clockSession.status === 'On Site' ? "default" : "pointer" }}>
                  ON SITE
                </button>
              )}
              {clockSession.jobId && clockSession.status === 'On Site' && (
                <button onClick={() => setShowPause(true)} className="head"
                  style={{ fontSize:11, fontWeight:700, padding:"4px 10px", borderRadius:5,
                    background:"var(--panel)", border:"1px solid var(--gold)", color:"var(--gold)" }}>
                  ⏸ PAUSE
                </button>
              )}
              {ON_BREAK_STATUSES.includes(clockSession.status) && (
                <button onClick={handleResume} className="head"
                  style={{ fontSize:11, fontWeight:700, padding:"4px 10px", borderRadius:5,
                    background:"var(--olive-bright)", border:"none", color:"var(--bg)" }}>
                  ▶ RESUME
                </button>
              )}
              <button onClick={() => setShowLeaving(true)} className="head"
                style={{ marginLeft:"auto", fontSize:11, fontWeight:700, padding:"4px 10px", borderRadius:5,
                  background:"var(--panel)", border:"1px solid var(--line)", color:"var(--text)" }}>
                HEADING OUT
              </button>
              {clockUndo && (
                <button onClick={undoClockAction} className="head"
                  style={{ padding:"6px 14px", borderRadius:20, flexShrink:0,
                    background:"var(--olive-bright)", border:"2px solid var(--olive)",
                    color:"var(--bg)", fontSize:13, fontWeight:700 }}>
                  UNDO
                </button>
              )}
            </div>
          );
        })()}
        {browseMode && (
          <div style={{ display:"flex", alignItems:"center", gap:8, marginTop:8, padding:"4px 10px",
            background:"rgba(200,185,122,0.08)", borderRadius:6, border:"1px solid rgba(200,185,122,0.25)" }}>
            <span style={{ width:6, height:6, borderRadius:"50%", background:"var(--gold)", flexShrink:0 }} />
            <div className="mono" style={{ fontSize:10, color:"var(--gold)", letterSpacing:"0.08em" }}>AFTER HOURS BROWSING</div>
            <button onClick={() => setBrowseMode(false)} className="mono"
              style={{ marginLeft:"auto", fontSize:10, padding:"2px 8px", borderRadius:4,
                background:"none", border:"1px solid rgba(200,185,122,0.3)", color:"var(--gold)", cursor:"pointer" }}>
              EXIT
            </button>
          </div>
        )}
      </div>

      {/* empty state — not an error */}
      {rlsWarning && !loading && (
        <div style={{ margin:"12px 16px 0", padding:"10px 14px", background:"var(--panel)",
          border:"1px solid var(--olive)", borderRadius:8, fontSize:13, color:"var(--muted)",
          textAlign:"center" }}>
          No jobs yet — tap + to add the first one.
        </div>
      )}

      {/* Loading */}
      {loading && (
        <div className="mono" style={{ textAlign:"center", color:"var(--muted)", padding:"40px 0", fontSize:13, letterSpacing:"0.1em" }}>
          LOADING…
        </div>
      )}

      {!loading && (
        <React.Fragment>
          {/* Search bar */}
          <div style={{ padding:"12px 16px 0" }}>
            {!(searchActive || q) ? (
              <button onClick={() => { setSearchActive(true); }} className="head"
                style={{ display:"flex", alignItems:"center", gap:10, width:"100%", padding:"10px 14px",
                  borderRadius:7, fontSize:14, fontWeight:700, textAlign:"left",
                  background:"var(--panel)", color:"var(--muted)", border:"1px solid var(--line)", cursor:"pointer" }}>
                <span>🔍</span><span>SEARCH</span>
              </button>
            ) : (
              <div style={{ position:"relative" }}>
                <input ref={searchInputRef} type="text" value={search} autoFocus={searchActive && !q}
                  onChange={e => setSearch(e.target.value)}
                  onBlur={() => { if (!search) { setSearchActive(false); } }}
                  placeholder="Search customers, addresses, sites, notes…"
                  style={{ paddingLeft:38 }} />
                <span style={{ position:"absolute", left:12, top:"50%", transform:"translateY(-50%)",
                  fontSize:15, color:"var(--muted)", pointerEvents:"none" }}>🔍</span>
                {search && (
                  <button onClick={() => { setSearch(""); setSearchActive(false); }}
                    style={{ position:"absolute", right:10, top:"50%", transform:"translateY(-50%)",
                      fontSize:16, color:"var(--muted)", padding:4 }}>✕</button>
                )}
              </div>
            )}
          </div>

          {/* Recently viewed — always-visible horizontal chip strip. Excludes Closed jobs (checked
              against the live job, not the stored snapshot, so one closed after being saved still drops off). */}
          {!q && visibleRecentJobs.length > 0 && (
            <div style={{ display:"flex", gap:8, padding:"10px 16px 0", overflowX:"auto",
              WebkitOverflowScrolling:"touch", scrollbarWidth:"none" }}>
              {visibleRecentJobs.map(r => {
                const live = jobs.find(j => j.id === r.id);
                const display = live || r;
                return (
                  <button key={r.id} onClick={() => setSelectedId(r.id)}
                    style={{ display:"flex", flexDirection:"column", flexShrink:0, padding:"7px 12px",
                      borderRadius:8, border:"1px solid var(--line)", background:"var(--panel)",
                      textAlign:"left", cursor:"pointer", maxWidth:160 }}>
                    <span className="head" style={{ fontSize:13, fontWeight:700, color:"var(--text)",
                      whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis", maxWidth:136 }}>
                      {display.site_name || display.customer || r.customer}
                    </span>
                    <span className="mono" style={{ fontSize:10, color:"var(--muted)", marginTop:2, whiteSpace:"nowrap" }}>
                      {display.status || r.status}
                    </span>
                  </button>
                );
              })}
            </div>
          )}

          {/* Upcoming — same getCalendarJobs scope as CalendarView, entry point into full Calendar */}
          {!q && upcomingJobs.length > 0 && (
            <div style={{ display:"flex", gap:8, padding:"10px 16px 0", overflowX:"auto",
              WebkitOverflowScrolling:"touch", scrollbarWidth:"none" }}>
              {upcomingJobs.map(j => {
                const color = calJobColor(j);
                return (
                  <button key={j.id} onClick={() => setSelectedId(j.id)}
                    style={{ display:"flex", flexDirection:"column", flexShrink:0, padding:"7px 12px",
                      borderRadius:8, border:"1px solid var(--line)", borderLeft:`3px solid ${color}`,
                      background:"var(--panel)", textAlign:"left", cursor:"pointer", maxWidth:160 }}>
                    <span className="mono" style={{ fontSize:10, color:"var(--brass-bright)", whiteSpace:"nowrap" }}>
                      {fmtDate(j.scheduled_date)} · {fmtTime(j.scheduled_time)}
                    </span>
                    <span className="head" style={{ fontSize:13, fontWeight:700, color:"var(--text)",
                      whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis", maxWidth:136 }}>
                      {j.site_name || j.customer}
                    </span>
                  </button>
                );
              })}
              <button onClick={() => setShowCalendar(true)}
                style={{ display:"flex", alignItems:"center", flexShrink:0, padding:"7px 14px",
                  borderRadius:8, border:"1px solid var(--olive-bright)", background:"none",
                  textAlign:"left", cursor:"pointer" }}>
                <span className="head" style={{ fontSize:12, fontWeight:700, color:"var(--olive-bright)", whiteSpace:"nowrap" }}>
                  VIEW ALL ›
                </span>
              </button>
            </div>
          )}

          {/* Include-closed toggle — only while searching */}
          {q && (
            <button onClick={() => setSearchClosed(v => !v)} className="fade-in"
              style={{ display:"flex", alignItems:"center", gap:8, padding:"10px 16px 0", textAlign:"left" }}>
              <span style={{ width:38, height:22, borderRadius:11, flexShrink:0, position:"relative",
                background: searchClosed ? "var(--olive-bright)" : "var(--line)", transition:"background 0.15s" }}>
                <span style={{ position:"absolute", top:3, left: searchClosed ? 19 : 3,
                  width:16, height:16, borderRadius:"50%", background:"var(--bg)", transition:"left 0.15s" }}></span>
              </span>
              <span style={{ fontSize:13, color:"var(--muted)" }}>Include closed jobs</span>
            </button>
          )}
          {!q && (
            <div style={{ display:"flex", gap:8, padding:"12px 16px", overflowX:"auto" }}>
              {FILTERS.map(f => {
                const count = f === "All" ? jobs.length : jobs.filter(j => j.status === f).length;
                return (
                  <button key={f} onClick={() => setFilter(f)} className="head"
                    style={{ fontSize:13, fontWeight:600, padding:"7px 16px", borderRadius:6, flexShrink:0,
                      border:`1px solid ${effectiveFilter===f ? "var(--olive-bright)" : "var(--line)"}`,
                      color: effectiveFilter===f ? "var(--bg)" : "var(--muted)",
                      background: effectiveFilter===f ? "var(--olive-bright)" : "transparent" }}>
                    {f} ({count})
                  </button>
                );
              })}
            </div>
          )}

          {/* Chores strip — collapsible */}
          {!q && chores.filter(c => !c.done).length > 0 && (
            <div style={{ margin:"4px 16px 0", background:"var(--panel-2)", border:"1px solid var(--brass)", borderRadius:10, overflow:"hidden" }}>
              <button onClick={() => setChoresExpanded(v => !v)}
                style={{ display:"flex", width:"100%", alignItems:"center", justifyContent:"space-between", padding:"12px 14px", textAlign:"left" }}>
                <span className="mono" style={{ fontSize:12, color:"var(--brass-bright)", letterSpacing:"0.08em" }}>
                  ⚑ {chores.filter(c=>!c.done).length} CHORE{chores.filter(c=>!c.done).length>1?"S":""}
                </span>
                <span style={{ color:"var(--brass)", fontSize:13 }}>{choresExpanded?"▲":"▼"}</span>
              </button>
              {choresExpanded && (
                <div className="fade-in" style={{ padding:"0 14px 10px" }}>
                  {sortChoresForUser(chores.filter(c=>!c.done), currentUser?.id).map(c => {
                    const assignee = c.assigned_to ? users.find(u => u.id === c.assigned_to) : null;
                    return (
                      <div key={c.id} style={{ display:"flex", width:"100%", alignItems:"flex-start", gap:10, padding:"8px 0", borderTop:"1px solid var(--line)" }}>
                        <button onClick={() => toggleChore(c.id)} style={{ flexShrink:0, marginTop:2 }}>
                          <span style={{ display:"block", width:18, height:18, borderRadius:4, border:"1.5px solid var(--brass)" }}></span>
                        </button>
                        <button onClick={() => c.job_id ? setSelectedId(c.job_id) : null}
                          style={{ flex:1, textAlign:"left" }}>
                          <div style={{ fontSize:14, color: c.job_id ? "var(--text)" : "var(--muted)" }}>
                            {c.label}{c.job_id ? " →" : ""}
                          </div>
                          <div style={{ display:"flex", gap:10, marginTop:3, flexWrap:"wrap" }}>
                            {c.kind === 'reminder' && (
                              <span className="mono" style={{ fontSize:11, color:"var(--brass-bright)" }}>🔔 REMINDER</span>
                            )}
                            {assignee && (
                              <span className="mono" style={{ fontSize:11, color:"var(--olive-bright)" }}>👤 {assignee.name}</span>
                            )}
                          </div>
                        </button>
                        <button onClick={() => { setChoresEditTarget(c.id); setShowChoresView(true); }}
                          style={{ flexShrink:0, fontSize:16, color:"var(--muted)", paddingTop:2, lineHeight:1 }}>✎</button>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          )}

          {/* Job list */}
          <div style={{ padding:"12px 16px 120px" }}>
            {shown.length === 0 && !rlsWarning && (
              <div style={{ textAlign:"center", color:"var(--muted)", padding:"40px 0" }} className="mono">
                {q ? `NO MATCHES FOR "${search.trim().toUpperCase()}"` : "NO JOBS HERE"}
              </div>
            )}
            {(() => {
              // Group by customer name, preserving order of first appearance
              const groups = [];
              const groupMap = {};
              for (const j of shown) {
                const key = j.customer || '';
                if (!groupMap[key]) {
                  const g = { customer: key, jobs: [] };
                  groupMap[key] = g;
                  groups.push(g);
                }
                groupMap[key].jobs.push(j);
              }

              function JobCard({ j }) {
                const overdue = j.status === "Scheduled" && j.scheduled_date && j.scheduled_date < todayISO();
                const scheduled = j.status === "Scheduled" && !overdue;
                const accentColor = overdue ? "#b5432f" : scheduled ? "#6fa33d" : null;
                return (
                  <button key={j.id} onClick={() => setSelectedId(j.id)} className="fade-in"
                    style={{ display:"block", width:"100%", textAlign:"left", marginBottom:8,
                      background:"var(--panel)", border:"1px solid var(--line)",
                      borderLeft:`3px solid ${accentColor || "var(--line)"}`,
                      borderRadius:10, padding:14 }}>
                    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", gap:8 }}>
                      <div className="head" style={{ fontSize:18, fontWeight:600 }}>{j.customer}</div>
                      <StatusPill status={j.status} overdue={overdue} scheduled={scheduled} />
                    </div>
                    {j.site_name ? (
                      <>
                        <div className="head" style={{ fontSize:14, fontWeight:600, color:"var(--brass-bright)", marginTop:2 }}>
                          📍 {j.site_name}
                        </div>
                        {(siteAddr(j)||custAddr(j)) && (
                          <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginTop:1 }}>
                            {siteAddr(j)||custAddr(j)}
                          </div>
                        )}
                      </>
                    ) : (siteAddr(j)||custAddr(j)||j.location) ? (
                      <div className="head" style={{ fontSize:14, fontWeight:600, color:"var(--brass-bright)", marginTop:2 }}>
                        📍 {siteAddr(j)||custAddr(j)||j.location}
                      </div>
                    ) : null}
                    <div style={{ fontSize:14, color:"var(--muted)", marginTop:3, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>
                      {j.type}{j.original_ask ? ` — ${j.original_ask}` : ''}
                    </div>
                    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginTop:10 }}>
                      <div className="mono" style={{ fontSize:14, color:"var(--brass-bright)" }}>
                        {fmtDate(j.scheduled_date)} · {fmtTime(j.scheduled_time)}
                      </div>
                      <div className="head" style={{ fontSize:16, fontWeight:700, color:"var(--olive-bright)" }}>{money(j.value)}</div>
                    </div>
                  </button>
                );
              }

              return groups.map(group => {
                if (group.jobs.length === 1) {
                  return <JobCard key={group.jobs[0].id} j={group.jobs[0]} />;
                }
                // Multi-job customer: collapsible group
                const isExpanded = q || expandedCustomers.has(group.customer);
                const totalValue = group.jobs.reduce((s, j) => s + Number(j.value||0), 0);
                const statusCounts = {};
                group.jobs.forEach(j => { statusCounts[j.status] = (statusCounts[j.status]||0) + 1; });
                return (
                  <div key={group.customer} style={{ marginBottom:10 }}>
                    <button onClick={() => setExpandedCustomers(prev => {
                        const next = new Set(prev);
                        next.has(group.customer) ? next.delete(group.customer) : next.add(group.customer);
                        return next;
                      })}
                      className="fade-in"
                      style={{ display:"block", width:"100%", textAlign:"left",
                        background:"var(--panel-2)", border:"1px solid var(--brass)",
                        borderRadius:10, padding:"12px 14px" }}>
                      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", gap:8 }}>
                        <div style={{ display:"flex", alignItems:"center", gap:8, flex:1, minWidth:0 }}>
                          <span style={{ fontSize:14, color:"var(--brass-bright)", flexShrink:0 }}>
                            {isExpanded ? '▼' : '▶'}
                          </span>
                          <div className="head" style={{ fontSize:17, fontWeight:700, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
                            {group.customer}
                          </div>
                        </div>
                        <div className="mono" style={{ fontSize:12, color:"var(--brass-bright)", flexShrink:0 }}>
                          {group.jobs.length} JOBS
                        </div>
                      </div>
                      <div style={{ display:"flex", gap:6, marginTop:8, flexWrap:"wrap", alignItems:"center" }}>
                        {Object.entries(statusCounts).map(([status, count]) => (
                          <span key={status} className="head"
                            style={{ fontSize:11, fontWeight:600, padding:"3px 8px", borderRadius:5,
                              border:`1px solid ${STATUS_COLOR[status]||"var(--line)"}`,
                              color: STATUS_COLOR[status]||"var(--muted)",
                              background: (STATUS_COLOR[status]||"#888")+"18" }}>
                            {count > 1 ? `${count}× ` : ''}{status}
                          </span>
                        ))}
                        {totalValue > 0 && (
                          <span className="head" style={{ marginLeft:"auto", fontSize:14, fontWeight:700, color:"var(--olive-bright)" }}>
                            {money(totalValue)}
                          </span>
                        )}
                      </div>
                    </button>
                    {isExpanded && (
                      <div style={{ paddingLeft:12, borderLeft:"2px solid var(--brass)", marginTop:4 }}>
                        {group.jobs.map(j => <JobCard key={j.id} j={j} />)}
                      </div>
                    )}
                  </div>
                );
              });
            })()}
            <button onClick={fixOldStatuses} className="mono"
              style={{ width:"100%", marginTop:6, padding:"11px", borderRadius:8, fontSize:12, letterSpacing:"0.08em",
                background:"transparent", color:"var(--muted)", border:"1px dashed var(--line)" }}>
              ⟳ FIX OLD STATUSES
            </button>
          </div>
        </React.Fragment>
      )}

      {/* Bottom bar */}
      <div style={{ position:"fixed", bottom:0, left:"50%", transform:"translateX(-50%)",
        width:"100%", maxWidth:520, background:"var(--panel)", borderTop:"1px solid var(--line)",
        padding:"12px 16px", display:"flex", gap:10, boxShadow:"0 -8px 24px rgba(0,0,0,0.4)" }}>
        <button onClick={() => setAdding(true)} className="head"
          style={{ flex:2, padding:"15px", borderRadius:9, fontSize:16, fontWeight:700,
            background:"var(--olive-bright)", color:"var(--bg)" }}>+ NEW JOB</button>
        <button onClick={() => setShowChoresView(true)} className="head"
          style={{ flex:1, padding:"15px", borderRadius:9, fontSize:14, fontWeight:700,
            background:"transparent", border:"1px solid var(--brass)", color:"var(--brass-bright)",
            position:"relative" }}>
          ⚑ CHORES
          {chores.filter(c=>!c.done).length > 0 && (
            <span style={{ position:"absolute", top:6, right:6, width:8, height:8,
              borderRadius:"50%", background:"var(--brass-bright)" }} />
          )}
        </button>
      </div>

      {/* Chores management view */}
      {showChoresView && (
        <ChoresView
          chores={chores} jobs={jobs} users={users} currentUser={currentUser}
          initialEditId={choresEditTarget}
          onClose={() => { setShowChoresView(false); setChoresEditTarget(null); }}
          onToggle={toggleChore}
          onEdit={editChore}
          onOpenJob={(jobId) => { setShowChoresView(false); setSelectedId(jobId); }}
          onAdd={addChore}
          onDelete={deleteChore}
        />
      )}

      {showSettings && <SettingsModal onClose={() => setShowSettings(false)} onLock={() => { setShowSettings(false); lockDevice(); }} />}
      {showCapCalc && <CapacitorCalc onClose={() => setShowCapCalc(false)} />}
      {showLeaving && clockSession && (
        <LeavingSheet clockSession={clockSession} jobs={jobs}
          onInRoute={() => { setShowLeaving(false); setShowMoveJob(true); }}
          onClockOut={() => { setShowLeaving(false); setShowClockOut(true); }}
          onClose={() => setShowLeaving(false)} />
      )}
      {showClockOut && clockSession && (
        <ClockOutSheet clockSession={clockSession} jobs={jobs} onClockOut={handleClockOut} onClose={() => setShowClockOut(false)} />
      )}
      {showMoveJob && clockSession && (
        <MoveJobSheet clockSession={clockSession} jobs={jobs} onMove={handleMoveToInRoute} onClose={() => setShowMoveJob(false)}
          onNewJob={() => { setShowMoveJob(false); setRouteAfterAdd(true); setAdding(true); }} />
      )}
      {lastLeaveJob && (
        <LastLeaveSheet job={lastLeaveJob.job} onPick={async s => {
          await updateJob(lastLeaveJob.job.id, { status: s, _skipNote: true });
          const mj = lastLeaveJob.mapsJobId ? jobs.find(j => j.id === lastLeaveJob.mapsJobId) : null;
          setLastLeaveJob(null);
          if (mj && (siteAddr(mj) || custAddr(mj)).trim()) setPendingMapsJob(mj);
        }} onClose={() => {
          const mj = lastLeaveJob.mapsJobId ? jobs.find(j => j.id === lastLeaveJob.mapsJobId) : null;
          setLastLeaveJob(null);
          if (mj && (siteAddr(mj) || custAddr(mj)).trim()) setPendingMapsJob(mj);
        }} />
      )}
      {leavingCrewCheck && leavingCrewCheck.members.length > 0 && (() => {
        const person = leavingCrewCheck.members[0];
        const rest = leavingCrewCheck.members.slice(1);
        // Name the destination — YES records this person In Route to newJobId, which the
        // answerer otherwise has no way to know (from clock-out it defaults to the shop).
        const destJob = leavingCrewCheck.newJobId ? jobs.find(j => j.id === leavingCrewCheck.newJobId) : null;
        const advance = (stayed = false) => {
          const nextSomeoneStayed = leavingCrewCheck.someoneStayed || stayed;
          if (rest.length > 0) {
            setLeavingCrewCheck({ ...leavingCrewCheck, members: rest, someoneStayed: nextSomeoneStayed });
          } else {
            const { mapsJobId, oldJobId, fromShop, shopStartedAt } = leavingCrewCheck;
            setLeavingCrewCheck(null);
            if (fromShop && oldJobId) {
              setPendingShopActivity({ shopJobId: oldJobId, startedAt: shopStartedAt, mapsJobId });
            } else {
              const oldJob = (!nextSomeoneStayed && oldJobId) ? jobs.find(j => j.id === oldJobId) : null;
              const mj = mapsJobId ? jobs.find(j => j.id === mapsJobId) : null;
              const mapsOk = mj && (siteAddr(mj) || custAddr(mj)).trim();
              if (oldJob && oldJob.customer?.toUpperCase() !== TMC_SHOP_NAME) {
                // navigation chains after the LAST ONE OUT prompt resolves (stays last)
                setLastLeaveJob({ job: oldJob, mapsJobId: mapsOk ? mapsJobId : null });
              } else if (mapsOk) {
                setPendingMapsJob(mj);
              }
            }
          }
        };
        return (
          <Sheet title="CREW CHECK" onClose={() => setLeavingCrewCheck(null)}>
            <div className="mono" style={{ fontSize:15, color:"var(--text)", marginBottom:20 }}>
              Is {person.name} coming with you{destJob ? ` to ${destJob.site_name || destJob.customer}` : ''}?
            </div>
            <div style={{ display:"flex", gap:12 }}>
              <button onClick={async () => {
                if (clockActionInFlight.current) return;
                clockActionInFlight.current = true;
                try {
                  const { newJobId, oldJobId } = leavingCrewCheck;
                  const at = new Date().toISOString();
                  await clearCrewWithNote(oldJobId, person.id, person.name, at, ` — with ${currentUser.name}`, currentUser.id);
                  if (newJobId) {
                    await upsertJobCrewStatus(newJobId, person.id, 'In Route');
                    const newJob = jobs.find(j => j.id === newJobId);
                    await sb.from('job_notes').insert({
                      job_id: newJobId, content: `Status → In Route (${person.name}) — with ${currentUser.name}`,
                      source: 'system', created_at: at, user_id: currentUser.id,
                    });
                    await sb.from('notifications').insert({
                      user_id: person.id,
                      message: `${currentUser.name} marked you In Route to ${newJob?.customer || 'a job'}`,
                      read: false, created_at: at,
                    });
                  }
                  advance(false);
                  refresh();
                } finally {
                  clockActionInFlight.current = false;
                }
              }} className="head"
                style={{ flex:1, padding:14, fontSize:15, fontWeight:700, borderRadius:10,
                  background:"var(--olive-bright)", color:"var(--bg)", border:"none" }}>
                YES
              </button>
              <button onClick={() => advance(true)} className="head"
                style={{ flex:1, padding:14, fontSize:15, fontWeight:700, borderRadius:10,
                  background:"var(--panel)", border:"1px solid var(--line)", color:"var(--muted)" }}>
                NO — STAYING
              </button>
            </div>
          </Sheet>
        );
      })()}
      {joiningOnSiteCheck && joiningOnSiteCheck.members.length > 0 && (() => {
        const person = joiningOnSiteCheck.members[0];
        const rest = joiningOnSiteCheck.members.slice(1);
        const advance = () => rest.length > 0
          ? setJoiningOnSiteCheck({ ...joiningOnSiteCheck, members: rest })
          : setJoiningOnSiteCheck(null);
        const { jobId: jsJobId } = joiningOnSiteCheck;
        const jsJob = jobs.find(j => j.id === jsJobId);
        return (
          <Sheet title="ON SITE CHECK" onClose={() => setJoiningOnSiteCheck(null)}>
            <div className="mono" style={{ fontSize:15, color:"var(--text)", marginBottom:20 }}>
              Is {person.name} also on site?
            </div>
            <div style={{ display:"flex", gap:12 }}>
              <button onClick={async () => {
                const at = new Date().toISOString();
                await upsertJobCrewStatus(jsJobId, person.id, 'On Site');
                await sb.from('job_notes').insert({
                  job_id: jsJobId, content: `Status → On Site (${person.name}) — with ${currentUser.name}`,
                  source: 'system', created_at: at, user_id: currentUser.id,
                });
                await sb.from('notifications').insert({
                  user_id: person.id,
                  message: `${currentUser.name} marked you On Site at ${jsJob?.customer || 'a job'}`,
                  read: false, created_at: at,
                });
                advance();
              }} className="head"
                style={{ flex:1, padding:14, fontSize:15, fontWeight:700, borderRadius:10,
                  background:"var(--olive-bright)", color:"var(--bg)", border:"none" }}>
                YES
              </button>
              <button onClick={advance} className="head"
                style={{ flex:1, padding:14, fontSize:15, fontWeight:700, borderRadius:10,
                  background:"var(--panel)", border:"1px solid var(--line)", color:"var(--muted)" }}>
                NO — STILL IN ROUTE
              </button>
            </div>
          </Sheet>
        );
      })()}
      {billingPaidPromptId && (() => {
        const bpJob = jobs.find(j => j.id === billingPaidPromptId);
        return (
          <Sheet title="IS THIS PAID?" onClose={() => setBillingPaidPromptId(null)}>
            <div className="mono" style={{ fontSize:14, color:"var(--text)", marginBottom:20 }}>
              Has {bpJob?.customer || 'this job'} paid the bill?
            </div>
            <div style={{ display:"flex", gap:12 }}>
              <button onClick={async () => {
                setBillingPaidPromptId(null);
                await updateJob(billingPaidPromptId, { status: 'Completed/Paid' });
              }} className="head"
                style={{ flex:1, padding:16, fontSize:16, fontWeight:700, borderRadius:10,
                  background:"var(--olive-bright)", color:"var(--bg)", border:"none" }}>
                YES — PAID
              </button>
              <button onClick={async () => {
                setBillingPaidPromptId(null);
                await updateJob(billingPaidPromptId, { status: 'Billed/Waiting for Payment' });
              }} className="head"
                style={{ flex:1, padding:16, fontSize:16, fontWeight:700, borderRadius:10,
                  background:"var(--panel)", border:"1px solid var(--line)", color:"var(--muted)" }}>
                NO — WAITING
              </button>
            </div>
          </Sheet>
        );
      })()}
      {closeJobPromptId && (
        <CloseJobSheet jobId={closeJobPromptId} jobs={jobs} users={users} currentUser={currentUser}
          onConfirm={async () => {
            await updateJob(closeJobPromptId, { status: 'Closed' });
            setCloseJobPromptId(null);
            setSelectedId(null);
          }}
          onClose={() => setCloseJobPromptId(null)}
          showToast={showToast} />
      )}
      {showPause && <PauseSheet onPick={handlePause} onClose={() => setShowPause(false)} />}
      {fieldTimeConfirm && (
        <Sheet title="CONFIRM TIME" onClose={() => setFieldTimeConfirm(null)}>
          <div className="mono" style={{ fontSize:13, color:"var(--muted)", marginBottom:12 }}>
            {fieldTimeConfirm.type === 'clockIn' ? `CLOCK IN — ${(fieldTimeConfirm.status||'').toUpperCase()}`
              : fieldTimeConfirm.type === 'moveJob' ? 'MOVING TO NEW JOB'
              : fieldTimeConfirm.type === 'clockOut' ? 'CLOCKING OUT'
              : fieldTimeConfirm.type === 'pause' ? `PAUSING — ${(fieldTimeConfirm.reason||'break').toUpperCase()}`
              : fieldTimeConfirm.type === 'resume' ? 'RESUMING WORK'
              : 'MARKING ON SITE'}
          </div>
          {fieldTimeConfirm.type === 'clockOut' && fieldTimeConfirm.showDate && (
            <>
              <div className="mono" style={{ fontSize:11, color:"var(--muted)", textAlign:"center", marginBottom:4 }}>
                WHAT DAY WAS THIS?
              </div>
              <input type="date" value={fieldConfirmDate} max={todayISO()} onChange={e => setFieldConfirmDate(e.target.value)}
                style={{ width:"100%", fontSize:18, padding:"8px 0", marginBottom:12, background:"transparent",
                  border:"none", borderBottom:"1px solid var(--line)", color:"var(--text)",
                  textAlign:"center", outline:"none" }} />
            </>
          )}
          <input type="time" value={fieldConfirmTime} onChange={e => setFieldConfirmTime(e.target.value)}
            style={{ width:"100%", fontSize:36, fontWeight:700, padding:"12px 0", background:"transparent",
              border:"none", borderBottom:"2px solid var(--olive-bright)", color:"var(--text)",
              textAlign:"center", marginBottom:8, outline:"none" }} />
          <div className="mono" style={{ fontSize:11, color:"var(--muted)", textAlign:"center", marginBottom:20 }}>
            REWIND IF YOU FORGOT TO TAP
          </div>
          <div style={{ display:"flex", gap:12 }}>
            <button onClick={() => {
              const [hh, mm] = fieldConfirmTime.split(':');
              const dateForAt = (fieldTimeConfirm.type === 'clockOut' && fieldTimeConfirm.showDate) ? fieldConfirmDate : todayLocalISO();
              const at = zonedWallToISO(dateForAt, `${hh}:${mm}`); // picked time, app TZ; date only changes for a backdated clock-out
              const fc = fieldTimeConfirm;
              setFieldTimeConfirm(null);
              if (fc.type === 'clockIn') clockIn(fc.jobId, fc.status, at);
              else if (fc.type === 'moveJob') moveToInRoute(fc.jobId, at);
              else if (fc.type === 'clockOut') clockOut(fc.jobStatus, at);
              else if (fc.type === 'pause') pauseClock(fc.reason, at, fc.billTo);
              else if (fc.type === 'resume') resumeClock(at);
              else flipToOnSite(at);
            }} className="head"
              style={{ flex:1, padding:16, fontSize:16, fontWeight:700, borderRadius:10,
                background:"var(--olive-bright)", color:"var(--bg)", border:"none" }}>
              CONFIRM
            </button>
            <button onClick={() => setFieldTimeConfirm(null)} className="head"
              style={{ flex:1, padding:16, fontSize:16, fontWeight:700, borderRadius:10,
                background:"var(--panel)", border:"1px solid var(--line)", color:"var(--muted)" }}>
              CANCEL
            </button>
          </div>
        </Sheet>
      )}
      {pendingShopActivity && (
        <ShopActivitySheet
          startedAt={pendingShopActivity.startedAt}
          onSave={async (tags, note) => {
            const elapsed = fmtElapsed(Date.now() - new Date(pendingShopActivity.startedAt).getTime());
            const tagStr = tags.length > 0 ? tags.join(' · ') : '';
            const content = `Shop (${elapsed})${tagStr ? ' — ' + tagStr : ''}${note ? ': ' + note : ''} (${currentUser.name})`;
            await sb.from('job_notes').insert({
              job_id: pendingShopActivity.shopJobId, content, source: 'user',
              created_at: new Date().toISOString(), user_id: currentUser.id,
            });
            const { mapsJobId } = pendingShopActivity;
            setPendingShopActivity(null);
            if (mapsJobId) { const mj = jobs.find(j => j.id === mapsJobId); if (mj && (siteAddr(mj) || custAddr(mj)).trim()) setPendingMapsJob(mj); }
          }}
          onSkip={() => {
            const { mapsJobId } = pendingShopActivity;
            setPendingShopActivity(null);
            if (mapsJobId) { const mj = jobs.find(j => j.id === mapsJobId); if (mj && (siteAddr(mj) || custAddr(mj)).trim()) setPendingMapsJob(mj); }
          }}
        />
      )}
      {staleClock && (
        <StaleClockSheet session={staleClock.session} sinceDate={staleClock.sinceDate} jobs={jobs}
          onClockOut={clockOutStale} onKeepGoing={keepStaleClock} />
      )}
      {pendingMapsJob && (
        <Sheet title="NAVIGATION" onClose={() => setPendingMapsJob(null)}>
          <div className="mono" style={{ fontSize:15, color:"var(--text)", marginBottom:8 }}>
            WANT DIRECTIONS TO {(pendingMapsJob.customer || '').toUpperCase()}?
          </div>
          {(siteAddr(pendingMapsJob) || custAddr(pendingMapsJob)) && (
            <div className="mono" style={{ fontSize:12, color:"var(--muted)", marginBottom:20 }}>
              {siteAddr(pendingMapsJob) || custAddr(pendingMapsJob)}
            </div>
          )}
          <div style={{ display:"flex", gap:12 }}>
            <button onClick={() => { openMapsNav(pendingMapsJob); setPendingMapsJob(null); }} className="head"
              style={{ flex:1, padding:16, fontSize:16, fontWeight:700, borderRadius:10,
                background:"var(--olive-bright)", color:"var(--bg)", border:"none" }}>
              YES — NAVIGATE
            </button>
            <button onClick={() => setPendingMapsJob(null)} className="head"
              style={{ flex:1, padding:16, fontSize:16, fontWeight:700, borderRadius:10,
                background:"var(--panel)", border:"1px solid var(--line)", color:"var(--muted)" }}>
              NO THANKS
            </button>
          </div>
        </Sheet>
      )}
      {pendingNotifs.length > 0 && (
        <Sheet onClose={dismissNotifs} title="NOTIFICATIONS">
          {pendingNotifs.map(n => (
            <div key={n.id} className="mono"
              style={{ fontSize:14, color:"var(--text)", padding:"12px 0", borderBottom:"1px solid var(--line)" }}>
              {n.message}
            </div>
          ))}
          <button onClick={dismissNotifs} className="head"
            style={{ width:"100%", marginTop:14, padding:14, borderRadius:9, fontSize:14, fontWeight:700,
              background:"var(--olive-bright)", color:"var(--bg)" }}>OK</button>
        </Sheet>
      )}
      {showMenu && (
        <Sheet title="" onClose={() => setShowMenu(false)}>
          {/* User identity */}
          <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:24, paddingBottom:20,
            borderBottom:"1px solid var(--line)" }}>
            <div style={{ width:44, height:44, borderRadius:"50%", background:"var(--olive-bright)",
              display:"flex", alignItems:"center", justifyContent:"center" }}>
              <span className="head" style={{ fontSize:20, fontWeight:700, color:"var(--bg)" }}>
                {(currentUser.name||'?')[0].toUpperCase()}
              </span>
            </div>
            <div>
              <div className="head" style={{ fontSize:20, fontWeight:700, color:"var(--text)" }}>{currentUser.name}</div>
              <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginTop:2 }}>LOGGED IN</div>
            </div>
          </div>
          {/* Menu items */}
          {[
            { label:"REFRESH", icon:"↺", action: () => { refresh(); setShowMenu(false); } },
            { label:"HOURS REPORT", icon:"⏱", action: () => { setShowMenu(false); setShowHours(true); } },
            { label:"CALENDAR", icon:"📅", action: () => { setShowMenu(false); setShowCalendar(true); } },
            { label:"BALANCES", icon:"$", action: () => { setShowMenu(false); setShowBalances(true); } },
            { label:"MATERIALS", icon:"🧰", action: () => { setShowMenu(false); setShowMaterials(true); } },
            { label:"CAP CALCULATOR", icon:"μF", action: () => { setShowMenu(false); setShowCapCalc(true); } },
            { label:"SETTINGS", icon:"⚙", action: () => { setShowMenu(false); setShowSettings(true); } },
          ].map(item => (
            <button key={item.label} onClick={item.action}
              style={{ display:"flex", alignItems:"center", gap:16, width:"100%", padding:"16px 4px",
                background:"none", border:"none", borderBottom:"1px solid var(--line)", cursor:"pointer",
                textAlign:"left" }}>
              <span className="mono" style={{ fontSize:18, color:"var(--muted)", width:28, textAlign:"center" }}>{item.icon}</span>
              <span className="head" style={{ fontSize:16, fontWeight:700, color:"var(--text)", letterSpacing:"0.05em" }}>{item.label}</span>
            </button>
          ))}
          {/* Switch user */}
          <button onClick={() => { setShowMenu(false); switchUser(); }}
            style={{ display:"flex", alignItems:"center", gap:16, width:"100%", padding:"16px 4px",
              background:"none", border:"none", borderBottom:"1px solid var(--line)", cursor:"pointer" }}>
            <span className="mono" style={{ fontSize:18, color:"var(--muted)", width:28, textAlign:"center" }}>⇄</span>
            <span className="head" style={{ fontSize:16, fontWeight:700, color:"var(--text)", letterSpacing:"0.05em" }}>SWITCH USER</span>
          </button>
          {/* Lock */}
          <button onClick={() => { setShowMenu(false); lockDevice(); }}
            style={{ display:"flex", alignItems:"center", gap:16, width:"100%", padding:"16px 4px",
              background:"none", border:"none", cursor:"pointer" }}>
            <span className="mono" style={{ fontSize:18, color:"var(--danger,#c0392b)", width:28, textAlign:"center" }}>🔒</span>
            <span className="head" style={{ fontSize:16, fontWeight:700, color:"var(--danger,#c0392b)", letterSpacing:"0.05em" }}>LOCK</span>
          </button>
          {/* Version badge */}
          <div className="mono" style={{ fontSize:11, color:"var(--muted)", textAlign:"center", marginTop:24 }}>r{APP_REV}</div>
        </Sheet>
      )}
      {toast && <Toast msg={toast.msg} isError={toast.isError} />}
      <VoiceButton onCommand={processVoiceCommand} />
    </div>
  );
}

/* ── CapacitorCalc ─────────────────────────────────────────────────────────── */
function CapacitorCalc({ onClose }) {
  const [step, setStep] = useState(1);
  const [terminal, setTerminal] = useState(null);
  const [amps, setAmps] = useState('');
  const [volts, setVolts] = useState('');
  const [nameplate, setNameplate] = useState('');

  const result = (amps && volts && parseFloat(amps) > 0 && parseFloat(volts) > 0)
    ? (parseFloat(amps) * 2652) / parseFloat(volts) : null;
  const npVal = parseFloat(nameplate);
  const low = npVal * 0.94;
  const high = npVal * 1.06;
  const inRange = result && npVal ? result >= low && result <= high : null;

  const sectionLabel = { fontSize:11, color:"var(--muted)", fontWeight:600, letterSpacing:"0.08em", marginBottom:6 };
  const inputStyle = { width:"100%", fontSize:26, fontWeight:700, textAlign:"center", padding:"14px", borderRadius:10,
    background:"var(--bg)", border:"1px solid var(--line)", color:"var(--text)", boxSizing:"border-box" };
  const stepBtn = (label, action, disabled) => (
    <button onClick={action} disabled={disabled} className="head"
      style={{ width:"100%", marginTop:14, padding:16, borderRadius:10, fontSize:16, fontWeight:700,
        background: disabled ? "var(--line)" : "var(--olive-bright)", color: disabled ? "var(--muted)" : "var(--bg)" }}>
      {label}
    </button>
  );

  return (
    <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.85)", zIndex:300, display:"flex", flexDirection:"column", justifyContent:"flex-end" }}>
      <div style={{ background:"var(--panel)", borderRadius:"16px 16px 0 0", padding:20, maxHeight:"90vh", overflowY:"auto" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:18 }}>
          <div className="head" style={{ fontSize:18, fontWeight:700 }}>⚡ CAPACITOR CALCULATOR</div>
          <button onClick={onClose} className="mono" style={{ fontSize:20, color:"var(--muted)" }}>✕</button>
        </div>

        {/* STEP INDICATOR */}
        <div style={{ display:"flex", gap:6, marginBottom:20 }}>
          {[1,2,3,4].map(s => (
            <div key={s} style={{ flex:1, height:4, borderRadius:2,
              background: s <= step ? "var(--olive-bright)" : "var(--line)" }} />
          ))}
        </div>

        {step === 1 && (
          <div>
            <div className="mono" style={{ ...sectionLabel }}>STEP 1 OF 4 — SAFETY &amp; SETUP</div>
            <div style={{ background:"#b5432f18", border:"1px solid #b5432f", borderRadius:10, padding:14, marginBottom:16 }}>
              <div className="head" style={{ fontSize:13, fontWeight:700, color:"#b5432f", marginBottom:6 }}>⚠ SAFETY FIRST</div>
              <div style={{ fontSize:14, lineHeight:1.6 }}>If the capacitor has been removed from the unit, discharge it first — short across the terminals with an insulated screwdriver before touching anything.</div>
            </div>
            <div className="mono" style={{ ...sectionLabel, marginTop:16 }}>WHICH SIDE ARE YOU TESTING?</div>
            <div style={{ display:"flex", gap:10, marginTop:8 }}>
              {['HERM', 'FAN'].map(t => (
                <button key={t} onClick={() => setTerminal(t)} className="head"
                  style={{ flex:1, padding:18, borderRadius:10, fontSize:18, fontWeight:700,
                    border:`2px solid ${terminal===t ? "var(--olive-bright)" : "var(--line)"}`,
                    color: terminal===t ? "var(--olive-bright)" : "var(--muted)",
                    background:"transparent" }}>
                  {t === 'HERM' ? '🌀 HERM' : '💨 FAN'}
                  <div style={{ fontSize:11, fontWeight:400, marginTop:4, color:"var(--muted)" }}>
                    {t === 'HERM' ? 'Compressor' : 'Fan motor'}
                  </div>
                </button>
              ))}
            </div>
            {stepBtn('NEXT — MEASURE AMPS →', () => setStep(2), !terminal)}
          </div>
        )}

        {step === 2 && (
          <div>
            <div className="mono" style={{ ...sectionLabel }}>STEP 2 OF 4 — MEASURE START WINDING AMPS</div>
            <div style={{ background:"var(--bg)", border:"1px solid var(--line)", borderRadius:10, padding:14, marginBottom:16, fontSize:14, lineHeight:1.7 }}>
              <div style={{ marginBottom:6 }}>Set your clamp meter to <strong>AC Amps</strong>.</div>
              <div>Clamp around the <strong>{terminal === 'HERM' ? 'compressor start wire (to HERM terminal)' : 'fan motor start wire (to FAN terminal)'}</strong> while the unit is running.</div>
            </div>
            <div className="mono" style={{ ...sectionLabel }}>AMPS READING</div>
            <input type="number" inputMode="decimal" placeholder="e.g. 4.2"
              value={amps} onChange={e => setAmps(e.target.value)} style={inputStyle} />
            <div style={{ display:"flex", gap:10, marginTop:14 }}>
              <button onClick={() => setStep(1)} className="head"
                style={{ padding:"14px 20px", borderRadius:10, fontSize:14, background:"transparent",
                  border:"1px solid var(--line)", color:"var(--muted)" }}>‹ BACK</button>
              {stepBtn('NEXT — MEASURE VOLTAGE →', () => setStep(3), !amps || parseFloat(amps) <= 0)}
            </div>
          </div>
        )}

        {step === 3 && (
          <div>

            </div>
            <div className="mono" style={{ ...sectionLabel }}>VOLTAGE READING</div>

            <div style={{ display:"flex", gap:10, marginTop:14 }}>

                  border:"1px solid var(--line)", color:"var(--muted)" }}>‹ BACK</button>
              {stepBtn('CALCULATE →', () => setStep(4), !volts || parseFloat(volts) <= 0)}
            </div>
          </div>

        {step === 4 && (
          <div>
            <div className="mono" style={{ ...sectionLabel }}>STEP 4 OF 4 — RESULT</div>
            <div style={{ background:"var(--bg)", border:"1px solid var(--line)", borderRadius:10, padding:20, textAlign:"center", marginBottom:16 }}>
              <div className="mono" style={{ fontSize:12, color:"var(--muted)", marginBottom:6 }}>CALCULATED CAPACITANCE</div>
              <div className="head" style={{ fontSize:48, fontWeight:700, color:"var(--olive-bright)", lineHeight:1 }}>

              <div style={{ marginTop:12, fontSize:13, color:"var(--muted)" }}>

            <div className="mono" style={{ ...sectionLabel }}>NAMEPLATE RATING (μF)</div>
            <input type="number" inputMode="decimal" placeholder="e.g. 45 or 5"

                  Measured: <strong style={{ color: inRange ? "#6fa33d" : "#b5432f" }}>{result.toFixed(2)} μF</strong>

/* ── ChoresView ────────────────────────────────────────────────────────────── */
function ChoresView({ chores, jobs, users, onClose, onToggle, onEdit, onOpenJob, onAdd, onDelete, currentUser, title, ctaLabel, initialEditId }) {
  const [desc, setDesc] = useState('');
  const [jobId, setJobId] = useState('');
  const [assignedTo, setAssignedTo] = useState('');
  const [adding, setAdding] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [editDesc, setEditDesc] = useState('');
  const [editJobId, setEditJobId] = useState('');
  const [editAssignedTo, setEditAssignedTo] = useState('');
  const [showCompleted, setShowCompleted] = useState(false);
  const open = sortChoresForUser(chores.filter(c => !c.done), currentUser?.id);
  const done = chores.filter(c => c.done);
  const jobsForPicker = jobs.filter(j => j.status !== 'Closed')
    .slice().sort((a,b) => (b.created_at||'').localeCompare(a.created_at||''));

  async function submit() {
    if (!desc.trim()) return;
    await onAdd(desc.trim(), jobId||null, assignedTo||null);
    setDesc(''); setJobId(''); setAssignedTo(''); setAdding(false);
  }

  function startEdit(c) {
    setEditingId(c.id);
    setEditDesc(c.label);
    setEditJobId(c.job_id || '');
    setEditAssignedTo(c.assigned_to || '');
  }

  // Deep-link straight into edit mode for a specific chore (e.g. from the dashboard strip's ✎).
  useEffect(() => {
    if (!initialEditId) return;
    const target = chores.find(c => c.id === initialEditId);
    if (target) startEdit(target);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [initialEditId]);

  async function saveEdit(choreId) {
    if (!editDesc.trim()) return;
    await onEdit(choreId, { description: editDesc.trim(), job_id: editJobId||null, assigned_to: editAssignedTo||null });
    setEditingId(null);
  }

  function ChoreRow({ c, isDone }) {
    const linkedJob = c.job_id ? jobs.find(j => j.id === c.job_id) : null;
    const assignee = c.assigned_to ? users.find(u => u.id === c.assigned_to) : null;
    const isEditing = editingId === c.id;

    if (isEditing) {
      return (
        <div className="fade-in" style={{ padding:"12px 0", borderBottom:"1px solid var(--line)" }}>
          <input value={editDesc} onChange={e=>setEditDesc(e.target.value)} autoFocus
            style={{ marginBottom:8 }} />
          <select value={editJobId} onChange={e=>setEditJobId(e.target.value)} style={{ marginBottom:8 }}>
            <option value="">— Link to a job (optional) —</option>
            {jobsForPicker.map(j => (
              <option key={j.id} value={j.id}>{j.site_name || j.customer}{j.site_address ? ` · ${j.site_address}` : ''}</option>
            ))}
          </select>
          <select value={editAssignedTo} onChange={e=>setEditAssignedTo(e.target.value)} style={{ marginBottom:10 }}>
            <option value="">— Assign to someone (optional) —</option>
            {users.map(u => (<option key={u.id} value={u.id}>{u.name}</option>))}
          </select>
          <div style={{ display:"flex", gap:8 }}>
            <button onClick={() => saveEdit(c.id)} className="head"
              style={{ flex:1, padding:"10px", borderRadius:7, fontSize:13, fontWeight:700,
                background:"var(--olive-bright)", color:"var(--bg)" }}>
              SAVE
            </button>
            <button onClick={() => { onDelete(c.id); setEditingId(null); }} className="mono"
              style={{ padding:"10px 14px", borderRadius:7, fontSize:13,
                border:"1px solid var(--error,#c0392b)", color:"var(--error,#c0392b)" }}>
              DELETE
            </button>
            <button onClick={() => setEditingId(null)} className="mono"
              style={{ padding:"10px 14px", borderRadius:7, fontSize:13,
                border:"1px solid var(--line)", color:"var(--muted)" }}>
              CANCEL
            </button>
          </div>
        </div>
      );
    }

    return (
      <div key={c.id} style={{ display:"flex", alignItems:"flex-start", gap:10, padding:"12px 0", borderBottom:"1px solid var(--line)" }}>
        <button onClick={() => onToggle(c.id)} style={{ flexShrink:0, paddingTop:2 }}>
          {isDone
            ? <span style={{ display:"block", width:20, height:20, borderRadius:4,
                background:"var(--olive)", border:"1.5px solid var(--olive)", color:"var(--bg)",
                textAlign:"center", lineHeight:"18px", fontSize:13 }}>✓</span>
            : <span style={{ display:"block", width:20, height:20, borderRadius:4, border:"1.5px solid var(--brass)" }} />
          }
        </button>
        <div style={{ flex:1, cursor:"pointer" }} onClick={() => startEdit(c)}>
          <div style={{ fontSize:15, textDecoration: isDone ? "line-through" : "none",
            color: isDone ? "var(--muted)" : "var(--text)" }}>{c.label}</div>
          <div style={{ display:"flex", gap:10, marginTop:4, flexWrap:"wrap" }}>
            {c.kind === 'reminder' && (
              <span className="mono" style={{ fontSize:11, color:"var(--brass-bright)" }}>
                🔔 REMINDER
              </span>
            )}
            {assignee && (
              <span className="mono" style={{ fontSize:11, color:"var(--olive-bright)" }}>
                👤 {assignee.name}
              </span>
            )}
            {linkedJob && (
              <button onClick={e => { e.stopPropagation(); onOpenJob(c.job_id); }}
                style={{ fontSize:12, color:"var(--brass-bright)", textAlign:"left" }}>
                📋 {linkedJob.site_name || linkedJob.customer} →
              </button>
            )}
          </div>
        </div>
        <button onClick={() => startEdit(c)}
          style={{ flexShrink:0, fontSize:17, color:"var(--muted)", paddingTop:2, lineHeight:1 }}>✎</button>
      </div>
    );
  }

  return (
    <div style={{ position:"fixed", inset:0, zIndex:100, background:"var(--bg)", overflowY:"auto", paddingBottom: ctaLabel ? 90 : 40 }}>
      <div style={{ padding:"16px", borderBottom:"1px solid var(--line)", background:"var(--panel)", display:"flex", alignItems:"center", gap:12, position:"sticky", top:0, zIndex:10 }}>
        <button onClick={onClose} className="head" style={{ fontSize:36, color:"var(--muted)", padding:"4px 12px 4px 4px", lineHeight:1 }}>‹</button>
        <div className="head" style={{ fontSize:18, fontWeight:600 }}>{title || 'CHORES'}</div>
        <button onClick={() => { setAdding(v=>!v); setEditingId(null); }} className="head"
          style={{ marginLeft:"auto", fontSize:13, fontWeight:600, padding:"7px 14px", borderRadius:6,
            background: adding ? "var(--panel-2)" : "var(--olive-bright)",
            border: adding ? "1px solid var(--olive)" : "none",
            color: adding ? "var(--text)" : "var(--bg)" }}>
          {adding ? 'CANCEL' : '+ ADD'}
        </button>
      </div>

      {adding && (
        <div className="fade-in" style={{ padding:16, borderBottom:"1px solid var(--line)", background:"var(--panel-2)" }}>
          <input value={desc} onChange={e=>setDesc(e.target.value)}
            placeholder="What needs doing?" autoFocus
            style={{ marginBottom:10 }} />
          <select value={jobId} onChange={e=>setJobId(e.target.value)} style={{ marginBottom:10 }}>
            <option value="">— Link to a job (optional) —</option>
            {jobsForPicker.map(j => (
              <option key={j.id} value={j.id}>{j.site_name || j.customer}{j.site_address ? ` · ${j.site_address}` : ''}</option>
            ))}
          </select>
          <select value={assignedTo} onChange={e=>setAssignedTo(e.target.value)} style={{ marginBottom:12 }}>
            <option value="">— Assign to someone (optional) —</option>
            {users.map(u => (
              <option key={u.id} value={u.id}>{u.name}</option>
            ))}
          </select>
          <button onClick={submit} className="head"
            style={{ width:"100%", padding:"14px", borderRadius:9, fontSize:15, fontWeight:700,
              background:"var(--olive-bright)", color:"var(--bg)" }}>
            SAVE CHORE
          </button>
        </div>
      )}

      <div style={{ padding:"12px 16px" }}>
        {open.length === 0 && (
          <div className="mono" style={{ color:"var(--muted)", fontSize:13, textAlign:"center", padding:"40px 0" }}>
            NO OPEN CHORES
          </div>
        )}
        {open.map(c => <ChoreRow key={c.id} c={c} isDone={false} />)}

        {done.length > 0 && (
          <div style={{ marginTop:24 }}>
            <button onClick={() => setShowCompleted(v => !v)} className="mono"
              style={{ display:"flex", alignItems:"center", gap:6, fontSize:12,
                color:"var(--muted)", padding:"6px 0", width:"100%" }}>
              <span style={{ fontSize:10 }}>{showCompleted ? '▼' : '▶'}</span>
              {showCompleted ? 'HIDE' : 'SHOW'} COMPLETED ({done.length})
            </button>
            {showCompleted && (
              <div className="fade-in" style={{ marginTop:8 }}>
                {done.map(c => <ChoreRow key={c.id} c={c} isDone={true} />)}
              </div>
            )}
          </div>
        )}
      </div>
      {ctaLabel && (
        <div style={{ position:"fixed", bottom:0, left:"50%", transform:"translateX(-50%)",
          width:"100%", maxWidth:520, background:"var(--panel)", borderTop:"1px solid var(--line)",
          padding:"12px 16px", boxShadow:"0 -8px 24px rgba(0,0,0,0.4)" }}>
          <button onClick={onClose} className="head"
            style={{ width:"100%", padding:"15px", borderRadius:9, fontSize:16, fontWeight:700,
              background:"var(--olive-bright)", color:"var(--bg)" }}>
            {ctaLabel}
          </button>
        </div>
      )}
    </div>
  );
}

/* ── Lightbox ──────────────────────────────────────────────────────────────── */
function Lightbox({ photo, onClose, onScanResult, onScanned, onReceiptImport }) {
  const url = photo.url;
  const [scale, setScale] = useState(1);
  const [offset, setOffset] = useState({ x:0, y:0 });
  const lastDist = useRef(null);
  const lastMid  = useRef(null);
  const dragStart = useRef(null);
  const lastOffset = useRef({ x:0, y:0 });
  const [scanning, setScanning] = useState(false);
  const [scanResult, setScanResult] = useState(null);
  const [scanError, setScanError] = useState(null);
  const [scanningReceipt, setScanningReceipt] = useState(false);
  const [receiptResult, setReceiptResult] = useState(null);
  const [receiptError, setReceiptError] = useState(null);

  function onTouchStart(e) {
    if (e.touches.length === 2) {
      lastDist.current = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      lastMid.current = {
        x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
        y: (e.touches[0].clientY + e.touches[1].clientY) / 2,
      };
    } else if (e.touches.length === 1 && scale > 1) {
      dragStart.current = { x: e.touches[0].clientX - lastOffset.current.x, y: e.touches[0].clientY - lastOffset.current.y };
    }
  }

  function onTouchMove(e) {
    e.preventDefault();
    if (e.touches.length === 2 && lastDist.current) {
      const dist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      setScale(s => Math.max(1, Math.min(6, s * (dist / lastDist.current))));
      lastDist.current = dist;
    } else if (e.touches.length === 1 && dragStart.current) {
      const nx = e.touches[0].clientX - dragStart.current.x;
      const ny = e.touches[0].clientY - dragStart.current.y;
      lastOffset.current = { x: nx, y: ny };
      setOffset({ x: nx, y: ny });
    }
  }

  function onTouchEnd(e) {
    if (e.touches.length < 2) lastDist.current = null;
    if (e.touches.length === 0) dragStart.current = null;
    if (scale <= 1) { setOffset({ x:0, y:0 }); lastOffset.current = { x:0, y:0 }; }
  }

  function handleTap(e) {
    if (scanResult || receiptResult) return;
    if (scale === 1) onClose();
    else { setScale(1); setOffset({ x:0, y:0 }); lastOffset.current = { x:0, y:0 }; }
  }

  async function doScan(e) {
    e.stopPropagation();
    setScanning(true); setScanResult(null); setScanError(null);
    try {
      const result = await scanNameplateFromUrl(url);
      const found = Object.entries(result).filter(([,v]) => v != null);
      if (found.length === 0) setScanError('No equipment data found in this photo.');
      else setScanResult(result);
      if (photo.id && onScanned) onScanned(photo.id, result);
    } catch(err) {
      setScanError(err.message);
    } finally {
      setScanning(false);
    }
  }

  async function doScanReceipt(e) {
    e.stopPropagation();
    setScanningReceipt(true); setReceiptResult(null); setReceiptError(null);
    try {
      const result = await scanReceiptFromUrl(url);
      if (result.vendor == null && result.amount == null && result.date == null) {
        setReceiptError('No receipt data found in this photo.');
      } else {
        setReceiptResult(result);
      }
      if (photo.id && onScanned) onScanned(photo.id, result);
    } catch(err) {
      setReceiptError(err.message);
    } finally {
      setScanningReceipt(false);
    }
  }

  async function doDownload(e) {
    e.stopPropagation();
    try {
      const resp = await fetch(url);
      const blob = await resp.blob();
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = `photo-${Date.now()}.jpg`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(blobUrl);
    } catch(err) {
      alert(`Download failed: ${err.message}`);
    }
  }

  async function doShare(e) {
    e.stopPropagation();
    try {
      const resp = await fetch(url);
      const blob = await resp.blob();
      const file = new File([blob], `photo-${Date.now()}.jpg`, { type: blob.type || 'image/jpeg' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file] });
      } else if (navigator.share) {
        await navigator.share({ url });
      } else {
        alert('Sharing is not supported on this device.');
      }
    } catch(err) {
      if (err.name !== 'AbortError') alert(`Share failed: ${err.message}`);
    }
  }

  return (
    <div
      onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}
      onClick={handleTap}
      style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.95)", zIndex:200,
        display:"flex", alignItems:"center", justifyContent:"center", overflow:"hidden",
        touchAction:"none", cursor: scale > 1 ? "zoom-out" : "zoom-in" }}>
      <img src={url} alt=""
        style={{ maxWidth:"100%", maxHeight:"100%", objectFit:"contain",
          transform:`scale(${scale}) translate(${offset.x/scale}px,${offset.y/scale}px)`,
          transformOrigin:"center", transition: scale === 1 ? "transform 0.2s" : "none",
          userSelect:"none", pointerEvents:"none" }} />
      <button onClick={e => { e.stopPropagation(); onClose(); }}
        style={{ position:"absolute", top:16, right:16, width:36, height:36, borderRadius:"50%",
          background:"rgba(0,0,0,0.6)", color:"#fff", fontSize:20, lineHeight:"36px", textAlign:"center",
          border:"1px solid rgba(255,255,255,0.2)" }}>✕</button>

      {/* Bottom bar */}
      <div onClick={e => e.stopPropagation()}
        style={{ position:"absolute", bottom:0, left:0, right:0, padding:"12px 16px 28px",
          background:"linear-gradient(transparent, rgba(0,0,0,0.85))" }}>
        {!scanResult && !receiptResult && (
          <div style={{ display:"flex", gap:8, marginBottom:8 }}>
            <button onClick={doDownload} className="head"
              style={{ flex:1, padding:"12px", borderRadius:9, fontSize:14, fontWeight:700,
                background:"rgba(255,255,255,0.1)", color:"#fff", border:"none" }}>
              ⬇ DOWNLOAD
            </button>
            {!!(typeof navigator !== "undefined" && navigator.share) && (
              <button onClick={doShare} className="head"
                style={{ flex:1, padding:"12px", borderRadius:9, fontSize:14, fontWeight:700,
                  background:"rgba(255,255,255,0.1)", color:"#fff", border:"none" }}>
                ⤴ SHARE
              </button>

  const [deletingPhoto, setDeletingPhoto] = useState(null);
  const [history, setHistory] = useState(job.history || []);
  const [editingNote, setEditingNote] = useState(null); // { id, content } or null
  const [logText, setLogText] = useState(''); // "what we did today" entry box
  const [materials, setMaterials] = useState(job.materials_needed || []);
  const [matText, setMatText] = useState('');
  // Shop-only: checking a material off the TMC SHOP list shows it struck-through briefly (with
