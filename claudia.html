/* ── ChoresView ────────────────────────────────────────────────────────────── */
function ChoresView({ chores, jobs, users, onClose, onToggle, onEdit, onOpenJob, onAdd, onDelete }) {
  const [desc, setDesc] = useState('');
  const [jobId, setJobId] = useState('');
  const [assignedTo, setAssignedTo] = useState('');
  const [adding, setAdding] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [editDesc, setEditDesc] = useState('');
  const [editJobId, setEditJobId] = useState('');
  const [editAssignedTo, setEditAssignedTo] = useState('');
  const [showCompleted, setShowCompleted] = useState(false);
  const open = chores.filter(c => !c.done);
  const done = chores.filter(c => c.done);

  async function submit() {
    if (!desc.trim()) return;
    await onAdd(desc.trim(), jobId||null, assignedTo||null);
    setDesc(''); setJobId(''); setAssignedTo(''); setAdding(false);
  }

  function startEdit(c) {
    setEditingId(c.id);
    setEditDesc(c.label);
    setEditJobId(c.job_id || '');
    setEditAssignedTo(c.assigned_to || '');
  }

  async function saveEdit(choreId) {
    if (!editDesc.trim()) return;
    await onEdit(choreId, { description: editDesc.trim(), job_id: editJobId||null, assigned_to: editAssignedTo||null });
    setEditingId(null);
  }

  function ChoreRow({ c, isDone }) {
    const linkedJob = c.job_id ? jobs.find(j => j.id === c.job_id) : null;
    const assignee = c.assigned_to ? users.find(u => u.id === c.assigned_to) : null;
    const isEditing = editingId === c.id;

    if (isEditing) {
      return (
        <div className="fade-in" style={{ padding:"12px 0", borderBottom:"1px solid var(--line)" }}>
          <input value={editDesc} onChange={e=>setEditDesc(e.target.value)} autoFocus
            style={{ marginBottom:8 }} />
          <select value={editJobId} onChange={e=>setEditJobId(e.target.value)} style={{ marginBottom:8 }}>
            <option value="">— Link to a job (optional) —</option>
            {jobs.filter(j => j.status !== 'Closed').map(j => (
              <option key={j.id} value={j.id}>{j.customer}{j.site_address ? ` · ${j.site_address}` : ''}</option>
            ))}
          </select>
          <select value={editAssignedTo} onChange={e=>setEditAssignedTo(e.target.value)} style={{ marginBottom:10 }}>
            <option value="">— Assign to someone (optional) —</option>
            {users.map(u => (<option key={u.id} value={u.id}>{u.name}</option>))}
          </select>
          <div style={{ display:"flex", gap:8 }}>
            <button onClick={() => saveEdit(c.id)} className="head"
              style={{ flex:1, padding:"10px", borderRadius:7, fontSize:13, fontWeight:700,
                background:"var(--olive-bright)", color:"var(--bg)" }}>
              SAVE
            </button>
            <button onClick={() => { onDelete(c.id); setEditingId(null); }} className="mono"
              style={{ padding:"10px 14px", borderRadius:7, fontSize:13,
                border:"1px solid var(--error,#c0392b)", color:"var(--error,#c0392b)" }}>
              DELETE
            </button>
            <button onClick={() => setEditingId(null)} className="mono"
              style={{ padding:"10px 14px", borderRadius:7, fontSize:13,
                border:"1px solid var(--line)", color:"var(--muted)" }}>
              CANCEL
            </button>
          </div>
        </div>
      );
    }

    return (
      <div key={c.id} style={{ display:"flex", alignItems:"flex-start", gap:10, padding:"12px 0", borderBottom:"1px solid var(--line)" }}>
        <button onClick={() => onToggle(c.id)} style={{ flexShrink:0, paddingTop:2 }}>
          {isDone
            ? <span style={{ display:"block", width:20, height:20, borderRadius:4,
                background:"var(--olive)", border:"1.5px solid var(--olive)", color:"var(--bg)",
                textAlign:"center", lineHeight:"18px", fontSize:13 }}>✓</span>
            : <span style={{ display:"block", width:20, height:20, borderRadius:4, border:"1.5px solid var(--brass)" }} />
          }
        </button>
        <div style={{ flex:1, cursor:"pointer" }} onClick={() => startEdit(c)}>
          <div style={{ fontSize:15, textDecoration: isDone ? "line-through" : "none",
            color: isDone ? "var(--muted)" : "var(--text)" }}>{c.label}</div>
          <div style={{ display:"flex", gap:10, marginTop:4, flexWrap:"wrap" }}>
            {assignee && (
              <span className="mono" style={{ fontSize:11, color:"var(--olive-bright)" }}>
                👤 {assignee.name}
              </span>
            )}
            {linkedJob && (
              <button onClick={e => { e.stopPropagation(); onOpenJob(c.job_id); }}
                style={{ fontSize:12, color:"var(--brass-bright)", textAlign:"left" }}>
                📋 {linkedJob.customer} →
              </button>
            )}
          </div>
        </div>
        <button onClick={() => startEdit(c)}
          style={{ flexShrink:0, fontSize:17, color:"var(--muted)", paddingTop:2, lineHeight:1 }}>✎</button>
      </div>
    );
  }

  return (
    <div style={{ position:"fixed", inset:0, zIndex:100, background:"var(--bg)", overflowY:"auto", paddingBottom:40 }}>
      <div style={{ padding:"16px", borderBottom:"1px solid var(--line)", background:"var(--panel)", display:"flex", alignItems:"center", gap:12, position:"sticky", top:0, zIndex:10 }}>
        <button onClick={onClose} className="head" style={{ fontSize:36, color:"var(--muted)", padding:"4px 12px 4px 4px", lineHeight:1 }}>‹</button>
        <div className="head" style={{ fontSize:18, fontWeight:600 }}>CHORES</div>
        <button onClick={() => { setAdding(v=>!v); setEditingId(null); }} className="head"
          style={{ marginLeft:"auto", fontSize:13, fontWeight:600, padding:"7px 14px", borderRadius:6,
            background: adding ? "var(--panel-2)" : "var(--olive-bright)",
            border: adding ? "1px solid var(--olive)" : "none",
            color: adding ? "var(--text)" : "var(--bg)" }}>
          {adding ? 'CANCEL' : '+ ADD'}
        </button>
      </div>

      {adding && (
        <div className="fade-in" style={{ padding:16, borderBottom:"1px solid var(--line)", background:"var(--panel-2)" }}>
          <input value={desc} onChange={e=>setDesc(e.target.value)}
            placeholder="What needs doing?" autoFocus
            style={{ marginBottom:10 }} />
          <select value={jobId} onChange={e=>setJobId(e.target.value)} style={{ marginBottom:10 }}>
            <option value="">— Link to a job (optional) —</option>
            {jobs.filter(j => j.status !== 'Closed').map(j => (
              <option key={j.id} value={j.id}>{j.customer}{j.site_address ? ` · ${j.site_address}` : ''}</option>
            ))}
          </select>
          <select value={assignedTo} onChange={e=>setAssignedTo(e.target.value)} style={{ marginBottom:12 }}>
            <option value="">— Assign to someone (optional) —</option>
            {users.map(u => (
              <option key={u.id} value={u.id}>{u.name}</option>
            ))}
          </select>
          <button onClick={submit} className="head"
            style={{ width:"100%", padding:"14px", borderRadius:9, fontSize:15, fontWeight:700,
              background:"var(--olive-bright)", color:"var(--bg)" }}>
            SAVE CHORE
          </button>
        </div>
      )}

      <div style={{ padding:"12px 16px" }}>
        {open.length === 0 && (
          <div className="mono" style={{ color:"var(--muted)", fontSize:13, textAlign:"center", padding:"40px 0" }}>
            NO OPEN CHORES
          </div>
        )}
        {open.map(c => <ChoreRow key={c.id} c={c} isDone={false} />)}

        {done.length > 0 && (
          <div style={{ marginTop:24 }}>
            <button onClick={() => setShowCompleted(v => !v)} className="mono"
              style={{ display:"flex", alignItems:"center", gap:6, fontSize:12,
                color:"var(--muted)", padding:"6px 0", width:"100%" }}>
              <span style={{ fontSize:10 }}>{showCompleted ? '▼' : '▶'}</span>
              {showCompleted ? 'HIDE' : 'SHOW'} COMPLETED ({done.length})
            </button>
            {showCompleted && (
              <div className="fade-in" style={{ marginTop:8 }}>
                {done.map(c => <ChoreRow key={c.id} c={c} isDone={true} />)}
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

/* ── Lightbox ──────────────────────────────────────────────────────────────── */
function Lightbox({ url, onClose, onScanResult }) {
  const [scale, setScale] = useState(1);
  const [offset, setOffset] = useState({ x:0, y:0 });
  const lastDist = useRef(null);
  const lastMid  = useRef(null);
  const dragStart = useRef(null);
  const lastOffset = useRef({ x:0, y:0 });
  const [scanning, setScanning] = useState(false);
  const [scanResult, setScanResult] = useState(null);
  const [scanError, setScanError] = useState(null);

  function onTouchStart(e) {
    if (e.touches.length === 2) {
      lastDist.current = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      lastMid.current = {
        x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
        y: (e.touches[0].clientY + e.touches[1].clientY) / 2,
      };
    } else if (e.touches.length === 1 && scale > 1) {
      dragStart.current = { x: e.touches[0].clientX - lastOffset.current.x, y: e.touches[0].clientY - lastOffset.current.y };
    }
  }

  function onTouchMove(e) {
    e.preventDefault();
    if (e.touches.length === 2 && lastDist.current) {
      const dist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      setScale(s => Math.max(1, Math.min(6, s * (dist / lastDist.current))));
      lastDist.current = dist;
    } else if (e.touches.length === 1 && dragStart.current) {
      const nx = e.touches[0].clientX - dragStart.current.x;
      const ny = e.touches[0].clientY - dragStart.current.y;
      lastOffset.current = { x: nx, y: ny };
      setOffset({ x: nx, y: ny });
    }
  }

  function onTouchEnd(e) {
    if (e.touches.length < 2) lastDist.current = null;
    if (e.touches.length === 0) dragStart.current = null;
    if (scale <= 1) { setOffset({ x:0, y:0 }); lastOffset.current = { x:0, y:0 }; }
  }

  function handleTap(e) {
    if (scanResult) return;
    if (scale === 1) onClose();
    else { setScale(1); setOffset({ x:0, y:0 }); lastOffset.current = { x:0, y:0 }; }
  }

  async function doScan(e) {
    e.stopPropagation();
    setScanning(true); setScanResult(null); setScanError(null);
    try {
      const result = await scanNameplateFromUrl(url);
      const found = Object.entries(result).filter(([,v]) => v != null);
      if (found.length === 0) setScanError('No equipment data found in this photo.');
      else setScanResult(result);
    } catch(err) {
      setScanError(err.message);
    } finally {
      setScanning(false);
    }
  }

  async function doDownload(e) {
    e.stopPropagation();
    try {
      const resp = await fetch(url);
      const blob = await resp.blob();
      const blobUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = `photo-${Date.now()}.jpg`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(blobUrl);
    } catch(err) {
      alert(`Download failed: ${err.message}`);
    }
  }

  async function doShare(e) {
    e.stopPropagation();
    try {
      const resp = await fetch(url);
      const blob = await resp.blob();
      const file = new File([blob], `photo-${Date.now()}.jpg`, { type: blob.type || 'image/jpeg' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file] });
      } else if (navigator.share) {
        await navigator.share({ url });
      } else {
        alert('Sharing is not supported on this device.');
      }
    } catch(err) {
      if (err.name !== 'AbortError') alert(`Share failed: ${err.message}`);
    }
  }

  return (
    <div
      onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}
      onClick={handleTap}
      style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.95)", zIndex:200,
        display:"flex", alignItems:"center", justifyContent:"center", overflow:"hidden",
        touchAction:"none", cursor: scale > 1 ? "zoom-out" : "zoom-in" }}>
      <img src={url} alt=""
        style={{ maxWidth:"100%", maxHeight:"100%", objectFit:"contain",
          transform:`scale(${scale}) translate(${offset.x/scale}px,${offset.y/scale}px)`,
          transformOrigin:"center", transition: scale === 1 ? "transform 0.2s" : "none",
          userSelect:"none", pointerEvents:"none" }} />
      <button onClick={e => { e.stopPropagation(); onClose(); }}
        style={{ position:"absolute", top:16, right:16, width:36, height:36, borderRadius:"50%",
          background:"rgba(0,0,0,0.6)", color:"#fff", fontSize:20, lineHeight:"36px", textAlign:"center",
          border:"1px solid rgba(255,255,255,0.2)" }}>✕</button>

      {/* Bottom bar */}
      <div onClick={e => e.stopPropagation()}
        style={{ position:"absolute", bottom:0, left:0, right:0, padding:"12px 16px 28px",
          background:"linear-gradient(transparent, rgba(0,0,0,0.85))" }}>
        {!scanResult && (
          <div style={{ display:"flex", gap:8, marginBottom:8 }}>
            <button onClick={doDownload} className="head"
              style={{ flex:1, padding:"12px", borderRadius:9, fontSize:14, fontWeight:700,
                background:"rgba(255,255,255,0.1)", color:"#fff", border:"none" }}>
              ⬇ DOWNLOAD
            </button>
            {!!(typeof navigator !== "undefined" && navigator.share) && (
              <button onClick={doShare} className="head"
                style={{ flex:1, padding:"12px", borderRadius:9, fontSize:14, fontWeight:700,
                  background:"rgba(255,255,255,0.1)", color:"#fff", border:"none" }}>
                ⤴ SHARE
              </button>
            )}
          </div>
        )}
        {!scanResult && !scanError && (
          <button onClick={doScan} disabled={scanning} className="head"
            style={{ display:"block", width:"100%", padding:"12px", borderRadius:9, fontSize:14, fontWeight:700,
              background: scanning ? "rgba(255,255,255,0.1)" : "rgba(180,150,60,0.85)",
              color: scanning ? "rgba(255,255,255,0.5)" : "#000",
              border:"none", marginBottom:8 }}>
            {scanning ? '🔍 SCANNING…' : '🔍 SCAN FOR EQUIPMENT'}
          </button>
        )}
        {scanError && (
          <div className="mono" style={{ fontSize:12, color:"#f87171", textAlign:"center", marginBottom:8 }}>{scanError}</div>
        )}
        {scanResult && (
          <div style={{ background:"rgba(0,0,0,0.8)", border:"1px solid rgba(180,150,60,0.5)", borderRadius:10, padding:12, marginBottom:8 }}>
            <div className="mono" style={{ fontSize:11, color:"rgba(180,150,60,0.9)", marginBottom:8 }}>FOUND ON NAMEPLATE</div>
            {Object.entries(scanResult).filter(([,v]) => v != null).map(([k,v]) => (
              <div key={k} style={{ display:"flex", gap:8, marginBottom:4 }}>
                <span className="mono" style={{ fontSize:11, color:"rgba(255,255,255,0.5)", minWidth:80 }}>{k.replace(/_/g,' ').toUpperCase()}</span>
                <span style={{ fontSize:12, color:"#fff" }}>{v}</span>
              </div>
            ))}
            <div style={{ display:"flex", gap:8, marginTop:12 }}>
              <button onClick={() => { onScanResult(scanResult); onClose(); }} className="head"
                style={{ flex:1, padding:"10px", borderRadius:8, fontSize:13, fontWeight:700,
                  background:"rgba(180,150,60,0.9)", color:"#000" }}>
                IMPORT TO JOB
              </button>
              <button onClick={() => setScanResult(null)} className="head"
                style={{ padding:"10px 16px", borderRadius:8, fontSize:13,
                  background:"rgba(255,255,255,0.1)", color:"#fff" }}>
                DISMISS
              </button>
            </div>
          </div>
        )}
        {!scanResult && scale === 1 && (
          <div className="mono" style={{ textAlign:"center", fontSize:11, color:"rgba(255,255,255,0.3)" }}>
            PINCH TO ZOOM · TAP TO CLOSE
          </div>
        )}
      </div>
    </div>
  );
}

}

  async function setMyCrewStatus(status) {
    if (!currentUser?.id) return;
    const updated = await upsertJobCrewStatus(job.id, currentUser.id, status);
    if (!updated) return;
    const at = new Date().toISOString();
    const content = `Status → ${status} (${currentUser.name})`;
    const { data: noteRow } = await sb.from('job_notes').insert({
      job_id: job.id, content,
      source: 'system', created_at: at, user_id: currentUser.id,
    }).select().single();
    setCrewLog(prev => [...prev, { id: noteRow?.id, content, at }]);
    if (job.status !== status) onUpdate({ status, _skipNote: true });
    if (status === 'On Site') {
      // Re-fetch crew live so we catch status set on other devices
      const freshCrew = await fetchJobCrew(job.id);
      setCrew(freshCrew);
      const others = users.filter(u => u.id !== currentUser.id &&
        freshCrew.find(c => c.user_id === u.id)?.status === 'In Route');
      if (others.length > 0) setOnSiteCheck(others);
    } else {
      setCrew(prev => [...prev.filter(c => c.user_id !== currentUser.id), updated]);
    }
  }

  async function markOthersOnSite() {
    const targets = onSiteCheck || [];
    setOnSiteCheck(null);
    for (const u of targets) {
      const updated = await upsertJobCrewStatus(job.id, u.id, 'On Site');
      if (!updated) continue;
      setCrew(prev => [...prev.filter(c => c.user_id !== u.id), updated]);
      const at = new Date().toISOString();
      const content = `Status → On Site (${u.name})`;
      const { data: noteRow } = await sb.from('job_notes').insert({
        job_id: job.id, content,
        source: 'system', created_at: at, user_id: currentUser?.id || null,
      }).select().single();
      setCrewLog(prev => [...prev, { id: noteRow?.id, content, at }]);
    }
    if (targets.length > 0 && job.status !== 'On Site') onUpdate({ status: 'On Site', _skipNote: true });
  }

  async function doCrewWrapUp(jobId) {
    setPendingWrapUpJobId(null);

      freshCrew.find(c => c.user_id === u.id && c.status === 'On Site')

  async function startTravelCheck(targetJobId) {

      u.id !== currentUser?.id &&
      freshCrew.find(c => c.user_id === u.id && c.status === 'On Site')

  async function answerTravelCheck(comingAlong) {
    if (!travelCheck || travelCheck.queue.length === 0) { setTravelCheck(null); return; }
    const [person, ...rest] = travelCheck.queue;
    if (comingAlong) {
      const at = new Date().toISOString();
      const targetJob = (jobs||[]).find(j => j.id === travelCheck.targetJobId);
      await clearJobCrewStatus(job.id, person.id);
      await upsertJobCrewStatus(travelCheck.targetJobId, person.id, 'In Route');

        job_id: travelCheck.targetJobId,

        read: false, created_at: at,
      });
      setCrew(prev => prev.filter(c => c.user_id !== person.id));

    setTravelCheck(rest.length > 0 ? { ...travelCheck, queue: rest } : null);

  async function deleteLogPeriod(period) {
    if (!confirm('Delete this time log entry?')) return;
    const ids = [period.startId].filter(Boolean);
    if (period.endId) {
      const endNote = crewLog.find(n => n.id === period.endId);
      const parsed = endNote ? parseCrewLogEntry(endNote) : null;
      // Delete end note only if it's a Cleared/non-field marker, not the start of another period
      if (parsed && !CREW_FIELD_STATUSES.includes(parsed.status)) ids.push(period.endId);
    }
    await Promise.all(ids.map(id => sb.from('job_notes').delete().eq('id', id)));

  async function saveAddLog(name) {

  useEffect(() => {

  function convertToJpeg(file) {
    return new Promise((res, rej) => {
      const blobUrl = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(blobUrl);
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob(blob => {
          if (blob) res(new File([blob], 'photo.jpg', { type: 'image/jpeg' }));
          else rej(new Error('conversion failed'));
        }, 'image/jpeg', 0.92);
      };
      img.onerror = () => { URL.revokeObjectURL(blobUrl); rej(new Error('decode failed')); };
      img.src = blobUrl;
    });
  }

  async function handlePhotoInput(e) {
    const files = Array.from(e.target.files);
    if (!files.length) return;
    const heicFiles = files.filter(f => /\.(heic|heif)$/i.test(f.name) || f.type === 'image/heic' || f.type === 'image/heif');
    if (heicFiles.length > 0) {
      alert('HEIC/HEIF photos can\'t be displayed in this app.\n\nOn iPhone: Settings → Camera → Formats → Most Compatible\nOn Android: turn off HEIC in your camera settings.\n\nRetake or re-export the photo as JPEG and try again.');
      e.target.value = '';
      return;
    }
    setUploading(true);
    let errors = [];
    for (const file of files) {
      let uploadFile = file;
      if (!file.type.startsWith('image/jpeg') && !file.type.startsWith('image/jpg')) {
        try { uploadFile = await convertToJpeg(file); } catch(_) { /* use original if conversion fails */ }
      }
      const photo = await uploadPhoto(job.id, uploadFile);
      if (photo && !photo.error) setPhotos(prev => [...prev, photo]);
      else if (photo && photo.error) errors.push(photo.error);
      else errors.push('unknown error');
    }
    setUploading(false);
    e.target.value = '';
    if (errors.length > 0) alert(`Upload failed:\n${errors.join('\n')}`);
  }

  async function confirmDeletePhoto(photo, idx) {
    if (photo._local) {
      if (photo.url?.startsWith('blob:')) URL.revokeObjectURL(photo.url);
    } else {
      await deletePhoto(photo.id, photo.storage_path);
    }
    setPhotos(prev => prev.filter((_,i) => i !== idx));
    setDeletingPhoto(null);

  function _launchScan(file, isOther) {
    const blobUrl = URL.createObjectURL(file);
    const tempId = `local-${Date.now()}-${Math.random().toString(36).slice(2,6)}`;
    // Photo visible in strip immediately — no waiting
    setPhotos(prev => [...prev, { id: tempId, url: blobUrl, photo_type: 'equipment', _local: true }]);
    isOther ? setOtherScanningCount(n => n + 1) : setScanningCount(n => n + 1);

    // Shared upload promise — both photo strip and scan queue need the URL
    const uploadP = uploadPhoto(job.id, file, 'equipment').then(photo => {
      if (photo && !photo.error) {
        setPhotos(prev => prev.map(p => p.id === tempId ? photo : p));
        URL.revokeObjectURL(blobUrl);
      }
      return photo;
    }).catch(() => null);

    // Read file then OCR in background — attach photo URL to scan result
    readFileForScan(file).then(({ b64, mediaType }) =>
      scanNameplateFromB64(b64, mediaType).then(result => {
        const hasData = Object.values(result).some(v => v != null);
        if (hasData) {
          uploadP.then(photo => {
            const entry = { ...result, _photoUrl: photo?.storage_path || null };
            isOther ? setOtherScanQueue(q => [...q, entry]) : setScanQueue(q => [...q, entry]);
            isOther ? setPendingOtherScanRetry(null) : setPendingScanRetry(null);
          });
        }
      }).catch(() => {
        // No signal — save b64 + storage_path for retry button
        uploadP.then(photo => {
          const retry = { b64, mediaType, _photoUrl: photo?.storage_path || null };
          isOther ? setPendingOtherScanRetry(retry) : setPendingScanRetry(retry);
        });
      })
    ).catch(() => {}).finally(() => {
      isOther ? setOtherScanningCount(n => n - 1) : setScanningCount(n => n - 1);
    });
  }

  function runScan(e) {
    const file = e.target.files[0];
    if (!file) return;
    e.target.value = '';
    _launchScan(file, false);
  }

  async function mergeImagesCanvas(src1, src2) {
    async function loadImg(src) {
      // Fetch as blob first so canvas can draw cross-origin images without tainting
      const blob = await fetch(src).then(r => r.blob());
      const blobUrl = URL.createObjectURL(blob);
      return new Promise((res, rej) => {
        const img = new Image();
        img.onload = () => { URL.revokeObjectURL(blobUrl); res(img); };
        img.onerror = () => { URL.revokeObjectURL(blobUrl); rej(); };
        img.src = blobUrl;
      });
    }
    const [imgA, imgB] = await Promise.all([loadImg(src1), loadImg(src2)]);
    const H = Math.min(Math.max(imgA.height, imgB.height), 2000);
    const wA = Math.round(imgA.width * (H / imgA.height));
    const wB = Math.round(imgB.width * (H / imgB.height));
    const canvas = document.createElement('canvas');
    canvas.width = wA + 6 + wB;
    canvas.height = H;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, canvas.width, H);
    ctx.drawImage(imgA, 0, 0, wA, H);
    ctx.drawImage(imgB, wA + 6, 0, wB, H);
    return new Promise(res => canvas.toBlob(blob => res(blob), 'image/jpeg', 0.88));
  }

  function selectCollageUnit(photo) {

  async function selectCollageTag(tagPhoto) {
    if (!collageState?.unit) { setCollageState(null); return; }
    const unitPhoto = collageState.unit;
    setCollageState({ step: 'processing' });
    setScanningCount(n => n + 1);
    try {
      const mergedBlob = await mergeImagesCanvas(unitPhoto.url, tagPhoto.url);
      const mergedFile = new File([mergedBlob], `collage-${Date.now()}.jpg`, { type: 'image/jpeg' });
      const photo = await uploadPhoto(job.id, mergedFile, 'equipment');
      if (photo && !photo.error) setPhotos(prev => [...prev, photo]);
    } catch (err) {
      console.error('collage error', err);
      alert('Could not create collage. Try again.');
    } finally {
      setScanningCount(n => n - 1);
      setCollageState(null);
    }
  }

  async function retryScan() {
    if (!pendingScanRetry) return;
    setScanningCount(n => n + 1);
    try {
      const result = await scanNameplateFromB64(pendingScanRetry.b64, pendingScanRetry.mediaType);
      const hasData = Object.values(result).some(v => v != null);
      if (hasData) { setScanQueue(q => [...q, { ...result, _photoUrl: pendingScanRetry._photoUrl || null }]); setPendingScanRetry(null); }
    } catch (_) { /* still offline — keep retry button */ }
    setScanningCount(n => n - 1);
  }

              onKeep={() => setScanQueue(q => q.slice(1))}
            />
          ) : (
            <LabelPromptSheet
              scan={scanQueue[0]}
              onSave={(label) => saveNewEquipment(label, scanQueue[0])}
              onCancel={() => setScanQueue(q => q.slice(1))}
            />
          )
        )}

        {scanQueue.length === 0 && otherScanQueue.length > 0 && (
          findDuplicateEquipment(otherScanQueue[0], equipmentList) ? (
            <DuplicateEquipmentSheet
              scan={otherScanQueue[0]}
              existing={findDuplicateEquipment(otherScanQueue[0], equipmentList)}
              onOverride={() => overrideEquipment(findDuplicateEquipment(otherScanQueue[0], equipmentList), otherScanQueue[0], true)}
              onKeep={() => setOtherScanQueue(q => q.slice(1))}
            />

            <LabelPromptSheet
              scan={otherScanQueue[0]}

            </div>

                    onUpdate({ status: s });

                    await sb.from('jobs').update({ current_status: s, updated_at: new Date().toISOString() }).eq('id', wrapJobId);
                  }
                  setShowCompleteCheck(null);
                  if (pendingWrapUpJobId) doCrewWrapUp(wrapJobId);

              <div key={h.id||i} style={{ padding:"10px 0", borderTop:"1px solid var(--line)" }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                  <div className="mono" style={{ fontSize:13, color:"var(--brass)" }}>{fmtDate(h.date)}</div>
                  {h.id && editingNote?.id !== h.id && (
                    <button onClick={() => setEditingNote({ id: h.id, content: h.note })}
                      style={{ background:"none", border:"none", color:"var(--muted)", fontSize:16, padding:"0 4px", cursor:"pointer" }}>✎</button>
                  )}
                </div>
                {editingNote && editingNote.id === h.id ? (
                  <div style={{ marginTop:6 }}>
                    <textarea value={editingNote.content}
                      onChange={e => setEditingNote(n => ({...n, content: e.target.value}))}
                      style={{ width:"100%", minHeight:70, fontSize:15, resize:"vertical" }} />
                    <div style={{ display:"flex", gap:8, marginTop:6 }}>
                      <button onClick={() => saveNoteEdit(h.id, editingNote.content)} className="head"
                        style={{ flex:1, padding:"9px 0", borderRadius:8, background:"var(--olive-bright)", color:"var(--bg)", fontWeight:700, fontSize:14 }}>SAVE</button>
                      <button onClick={() => deleteNote(h.id)} className="head"

          <div style={{ marginTop:20 }}>

              <span style={{ display:"inline-block", transition:"transform 0.15s", transform: crewStatusOpen ? "rotate(90deg)" : "rotate(0deg)" }}>▶</span>
              CREW STATUS
            </div>
            {crewStatusOpen && users.map(u => {
              const c = crew.find(x => x.user_id === u.id);
              const isMe = currentUser?.id === u.id;
              const isEditing = editingCrew === u.id;
              const elsewhere = activeCrew.find(a => a.user_id === u.id && a.job_id !== job.id);
              const elsewhereJob = elsewhere ? (jobs||[]).find(j => j.id === elsewhere.job_id) : null;
              const locationJob = c ? job : elsewhereJob;
              return (
                <div key={u.id} style={{ padding:"10px 0", borderBottom:"1px solid var(--line)" }}>
                  <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:8 }}>
                    <div>
                      <div className="head" style={{ fontSize:15, fontWeight:700, color:"var(--text)" }}>
                        {u.name}{isMe ? ' (You)' : ''}
                      </div>
                      {c && (
                        <div className="mono" style={{ fontSize:12, color: c.status === 'On Site' ? "var(--green)" : "var(--olive-bright)", marginTop:2 }}>
                          {c.status} · {fmtTimestamp(c.status_at)}
                        </div>
                      )}
                      {!c && elsewhere && (
                        <div className="mono" style={{ fontSize:12, color: elsewhere.status === 'On Site' ? "var(--green)" : "var(--olive-bright)", marginTop:2 }}>
                          {elsewhere.status} · {fmtTimestamp(elsewhere.status_at)}
                        </div>
                      )}
                    </div>
                    {locationJob && (
                      <div className="mono" style={{ fontSize:12, color:"var(--muted)", textAlign:"right", flex:1 }}>
                        <div>{locationJob.customer}</div>
                        {locationJob.site_address && <div>{locationJob.site_address}</div>}
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {users.length > 0 && (
          <div style={{ marginTop:20 }}>
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:8 }}>
              <div onClick={() => setTimeLogOpen(o => !o)} className="mono"
                style={{ fontSize:12, color:"var(--muted)", display:"flex", alignItems:"center", gap:6, cursor:"pointer", padding:"4px 0" }}>
                <span style={{ display:"inline-block", transition:"transform 0.15s", transform: timeLogOpen ? "rotate(90deg)" : "rotate(0deg)" }}>▶</span>
                TIME LOG
              </div>
              {timeLogOpen && (
                <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                  <button onClick={() => setCrewLogDate(d => shiftDateISO(d, -1))} className="mono"
                    style={{ fontSize:16, color:"var(--muted)", padding:"2px 8px" }}>‹</button>
                  <input type="date" value={crewLogDate} onChange={e => setCrewLogDate(e.target.value)}
                    className="mono" style={{ fontSize:12, padding:"4px 6px" }} />
                  <button onClick={() => setCrewLogDate(d => shiftDateISO(d, 1))} className="mono"
                    style={{ fontSize:16, color:"var(--muted)", padding:"2px 8px" }}>›</button>
                  {crewLogDate !== todayISO() && (
                    <button onClick={() => setCrewLogDate(todayISO())} className="mono"
                      style={{ fontSize:11, color:"var(--olive-bright)", padding:"2px 6px" }}>TODAY</button>
                  )}
                </div>
              )}
            </div>
            {timeLogOpen && users.filter(u => crewTimeline[u.name]).map(u => {
              const name = u.name;
              const periods = (crewTimeline[name] || []).filter(p => p.start.slice(0,10) === crewLogDate);
              const driveMs = periods.filter(p => p.status === 'In Route')
                .reduce((sum,p) => sum + (new Date(p.end || Date.now()) - new Date(p.start)), 0);
              const onSiteMs = periods.filter(p => p.status === 'On Site')
                .reduce((sum,p) => sum + (new Date(p.end || Date.now()) - new Date(p.start)), 0);
              return (
                <div key={u.id} style={{ padding:"10px 0", borderBottom:"1px solid var(--line)" }}>
                  <div className="head" style={{ fontSize:14, fontWeight:700, color:"var(--text)", marginBottom:4 }}>{name}</div>
                  {periods.length === 0 && (
                    <div className="mono" style={{ fontSize:12, color:"var(--muted)" }}>No activity this day</div>
                  )}
                  {periods.map((p,i) => {
                    const isEditing = editingLogPeriod?.name === name && editingLogPeriod.idx === i;
                    return (
                      <div key={i} style={{ marginTop:4 }}>
                        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                          <div className="mono" style={{ fontSize:12, color:"var(--muted)" }}>
                            {p.status}: {fmtTimestamp(p.start)} – {p.ongoing ? 'ongoing' : (p.end ? fmtTimestamp(p.end) : '—')}
                            {' '}({fmtElapsed((p.end ? new Date(p.end) : new Date()) - new Date(p.start))})
                          </div>
                          {!p.ongoing && (
                            <div style={{ display:"flex", gap:4 }}>
                              <button onClick={() => isEditing ? setEditingLogPeriod(null) : openLogEdit(name, i, p)} className="mono"
                                style={{ fontSize:14, color:"var(--muted)", padding:"4px 6px" }}>{isEditing ? '✕' : '✎'}</button>
                              {!isEditing && (
                                <button onClick={() => deleteLogPeriod(p)} className="mono"
                                  style={{ fontSize:14, color:"var(--danger)", padding:"4px 6px" }}>🗑</button>
                              )}
                            </div>
                          )}
                        </div>
                        {isEditing && (
                          <div style={{ marginTop:6 }}>
                            <div style={{ display:"flex", gap:8, flexWrap:"wrap", alignItems:"flex-end", marginBottom:8 }}>
                              <div style={{ flex:1, minWidth:140 }}>
                                <div className="mono" style={{ fontSize:11, color:"var(--muted)" }}>START</div>
                                <input type="datetime-local" value={editLogStart} onChange={e => setEditLogStart(e.target.value)} />
                              </div>
                              {p.endId && (
                                <div style={{ flex:1, minWidth:140 }}>
                                  <div className="mono" style={{ fontSize:11, color:"var(--muted)" }}>END</div>
                                  <input type="datetime-local" value={editLogEnd} onChange={e => setEditLogEnd(e.target.value)} />
                                </div>
                              )}
                            </div>
                            <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginBottom:4 }}>JOB</div>
                            <select value={editLogJobId || job.id} onChange={e => setEditLogJobId(e.target.value)}
                              style={{ width:"100%", marginBottom:8 }}>
                              {(jobs||[]).filter(j => j.status !== 'Closed' || j.id === job.id)
                                .slice().sort((a,b) => (a.customer||'').localeCompare(b.customer||''))
                                .map(j => (
                                  <option key={j.id} value={j.id}>
                                    {j.customer}{j.site_address ? ` — ${j.site_address}` : ''}
                                  </option>
                                ))}
                            </select>
                            <button onClick={() => saveLogEdit(p)} className="head"
                              style={{ width:"100%", padding:"9px 0", borderRadius:8, fontSize:13, fontWeight:700, background:"var(--olive-bright)", color:"var(--bg)" }}>SAVE</button>
                          </div>
                        )}
                      </div>
                    );
                  })}
                  <div className="mono" style={{ fontSize:12, color:"var(--olive-bright)", marginTop:6 }}>
                    Drive: {fmtElapsed(driveMs)} · On Site: {fmtElapsed(onSiteMs)}
                  </div>
                  {addingLogFor === name ? (
                    <div style={{ marginTop:8, padding:10, background:"var(--panel)", border:"1px solid var(--line)", borderRadius:8 }}>
                      <div style={{ display:"flex", gap:6, marginBottom:8 }}>
                        {['In Route','On Site'].map(s => (
                          <button key={s} onClick={() => setAddLogStatus(s)} className="head"
                            style={{ flex:1, fontSize:12, fontWeight:700, padding:"8px 6px", borderRadius:6,
                              background: addLogStatus === s ? "var(--olive-bright)" : "var(--bg)",
                              color: addLogStatus === s ? "var(--bg)" : "var(--text)",
                              border:"1px solid var(--line)" }}>{s.toUpperCase()}</button>
                        ))}
                      </div>
                      <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
                        <div style={{ flex:1, minWidth:140 }}>
                          <div className="mono" style={{ fontSize:11, color:"var(--muted)" }}>START</div>
                          <input type="datetime-local" value={addLogStart} onChange={e => setAddLogStart(e.target.value)} />
                        </div>
                        <div style={{ flex:1, minWidth:140 }}>
                          <div className="mono" style={{ fontSize:11, color:"var(--muted)" }}>END</div>
                          <input type="datetime-local" value={addLogEnd} onChange={e => setAddLogEnd(e.target.value)} />
                        </div>
                      </div>
                      <div style={{ display:"flex", gap:8, marginTop:10 }}>
                        <button onClick={() => saveAddLog(name)} className="head"
                          style={{ flex:1, padding:"10px 0", borderRadius:8, fontSize:13, fontWeight:700, background:"var(--olive-bright)", color:"var(--bg)" }}>SAVE</button>
                        <button onClick={() => setAddingLogFor(null)} className="head"
                          style={{ padding:"10px 14px", borderRadius:8, fontSize:13, fontWeight:600, background:"transparent", border:"1px solid var(--line)", color:"var(--text)" }}>CANCEL</button>
                      </div>
                    </div>
                  ) : (
                    <button onClick={() => openAddLog(name)} className="mono"
                      style={{ fontSize:12, color:"var(--muted)", marginTop:8, padding:"4px 0" }}>+ ADD ENTRY</button>
                  )}
                </div>
              );
            })}
          </div>
        )}

        <div style={{ marginTop:20, display:"flex", flexDirection:"column", alignItems:"center", gap:6 }}>
          <div className="mono" style={{ fontSize:12, color:"var(--muted)" }}>CURRENT STATUS</div>
          <StatusPill status={job.status} />
        </div>
        <button onClick={() => setShowStatus(true)} className="head"
          style={{ width:"100%", marginTop:8, padding:16, borderRadius:10, fontSize:16, fontWeight:700, background:"var(--olive-bright)", color:"var(--bg)" }}>
          UPDATE STATUS →
        </button>
        <button onClick={() => { if (confirm("Delete this job?")) onDelete(); }} className="head"
          style={{ width:"100%", marginTop:10, padding:13, borderRadius:10, fontSize:14, fontWeight:600, background:"transparent", color:"var(--danger)", border:"1px solid var(--danger)" }}>
          DELETE JOB
        </button>
        <button onClick={onBack} className="head"
          style={{ width:"100%", marginTop:10, padding:13, borderRadius:10, fontSize:16, fontWeight:600, background:"transparent", color:"var(--muted)", border:"1px solid var(--line)" }}>
          ‹ BACK
        </button>
      </div>

      {showStatus && (
        <Sheet onClose={() => setShowStatus(false)} title="UPDATE STATUS">
          {WORKFLOW_STATUSES.map(s => (
            <button key={s} onClick={() => { onUpdate({ status:s }); setShowStatus(false); onBack(); }}
              style={{ display:"flex", width:"100%", alignItems:"center", justifyContent:"space-between", padding:"14px 4px", borderBottom:"1px solid var(--line)", textAlign:"left" }}>
              <StatusPill status={s} />
              {job.status === s && <span style={{ color:"var(--olive-bright)" }}>✓</span>}
            </button>
          ))}
        </Sheet>
      )}

      {showResched && (
        <Sheet onClose={() => setShowResched(false)} title="RESCHEDULE">
          <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginBottom:6, marginTop:4 }}>DATE</div>
          <input type="date" value={date} min={todayISO()} onChange={e => setDate(e.target.value)} />
          <div className="mono" style={{ fontSize:11, color:"var(--muted)", margin:"14px 0 6px" }}>TIME</div>
          <input type="time" value={time} min={date === todayISO() ? nowTimeRounded15() : undefined} onChange={e => setTime(e.target.value)} />
          <button onClick={() => {
              const dt = new Date(`${date}T${time}:00`);
              if (isNaN(dt) || dt < new Date()) { alert('Please choose a date and time that is not in the past.'); return; }
              onUpdate({ scheduled_date:date, scheduled_time:time }); setShowResched(false);
            }} className="head"
            style={{ width:"100%", marginTop:18, padding:15, borderRadius:9, fontSize:16, fontWeight:700, background:"var(--olive-bright)", color:"var(--bg)" }}>
            SAVE
          </button>
        </Sheet>
      )}
    </div>
  );
}

/* ── LocationPickerSheet ───────────────────────────────────────────────────── */
function LocationPickerSheet({ lat, lng, onConfirm, onCancel }) {
  const mapDivRef = useRef(null);
  const mapRef = useRef(null);
  const [geocoding, setGeocoding] = useState(false);
  const [query, setQuery] = useState('');
  const [searching, setSearching] = useState(false);
  const [searchResults, setSearchResults] = useState([]);
  const [showResults, setShowResults] = useState(false);
  // When user selects a search result we store the address to skip reverse geocode on confirm
  const pinnedAddrRef = useRef(null);
  const searchTimerRef = useRef(null);

  useEffect(() => {
    if (!mapDivRef.current || mapRef.current) return;
    const map = L.map(mapDivRef.current, { center: [lat, lng], zoom: 18, zoomControl: false });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap', maxZoom: 19,
    }).addTo(map);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    mapRef.current = map;
    setTimeout(() => map.invalidateSize(), 120);
    return () => { map.remove(); mapRef.current = null; };
  }, []);

  function addrFromNominatim(data) {
    const a = data.address || {};
    const street = a.house_number && a.road ? `${a.house_number} ${a.road}` : (a.road || '');
    const city = a.city || a.town || a.village || a.hamlet || '';
    return [street, city, a.state, a.postcode].filter(Boolean).join(', ') || data.display_name || '';
  }

  function addrFromGoogleComponents(components, formatted) {
    if (!components) return formatted || '';
    const get = type => components.find(c => c.types.includes(type)) || {};
    const streetNumber = get('street_number').longText;
    const route = get('route').longText;
    const street = streetNumber && route ? `${streetNumber} ${route}` : (route || '');
    const city = get('locality').longText || get('sublocality').longText || get('postal_town').longText || '';
    const stateAbbr = get('administrative_area_level_1').shortText;
    const postcode = get('postal_code').longText;
    return [street, city, stateAbbr, postcode].filter(Boolean).join(', ') || formatted || '';
  }

  const placesLibRef = useRef(null);
  const sessionTokenRef = useRef(null);
  async function getPlacesLib() {
    if (!placesLibRef.current) placesLibRef.current = await google.maps.importLibrary("places");
    return placesLibRef.current;
  }

  async function runSearch(q) {
    if (!q.trim()) { setSearchResults([]); setShowResults(false); return; }
    setSearching(true);
    try {
      const { AutocompleteSuggestion, AutocompleteSessionToken } = await getPlacesLib();
      const center = mapRef.current ? mapRef.current.getCenter() : { lat, lng };
      if (!sessionTokenRef.current) sessionTokenRef.current = new AutocompleteSessionToken();
      const { suggestions } = await AutocompleteSuggestion.fetchAutocompleteSuggestions({
        input: q,
        locationBias: { center: { lat: center.lat, lng: center.lng }, radius: 40000 },
        includedRegionCodes: ['us'],
        sessionToken: sessionTokenRef.current,
      });
      setSearchResults(suggestions || []);
      setShowResults(true);
    } catch(e) {
      console.warn('places search error', e);
      setSearchResults([]);
    } finally {
      setSearching(false);
    }
  }

  function handleQueryChange(v) {
    setQuery(v);
    pinnedAddrRef.current = null;
    clearTimeout(searchTimerRef.current);
    if (v.trim().length >= 3) {
      searchTimerRef.current = setTimeout(() => runSearch(v), 500);
    } else {
      setSearchResults([]);
      setShowResults(false);
    }
  }

  async function selectResult(pred) {
    setShowResults(false);
    setSearching(true);
    try {
      const place = pred.toPlace();
      await place.fetchFields({ fields: ['location','formattedAddress','displayName','addressComponents'] });
      const addr = addrFromGoogleComponents(place.addressComponents, place.formattedAddress);
      const name = place.displayName || null;
      pinnedAddrRef.current = { addr, name };
      setQuery(name || addr);
      if (mapRef.current && place.location) {
        mapRef.current.setView([place.location.lat(), place.location.lng()], 18);
      }
    } catch(e) {
      console.warn('place details error', e);
    } finally {
      sessionTokenRef.current = null;
      setSearching(false);
    }
  }

  async function confirm() {
    if (!mapRef.current || geocoding) return;
    // If user picked a search result, use that address directly
    if (pinnedAddrRef.current) {
      onConfirm(pinnedAddrRef.current);
      return;
    }
    setGeocoding(true);
    const c = mapRef.current.getCenter();
    try {
      const r = await fetch(
        `https://nominatim.openstreetmap.org/reverse?lat=${c.lat}&lon=${c.lng}&format=json`,
        { headers: { 'Accept-Language': 'en-US,en' } }
      );
      const data = await r.json();
      onConfirm({ addr: addrFromNominatim(data), name: data.name || null });
    } catch(e) {
      alert('Could not look up address. Try again.');
    } finally {
      setGeocoding(false);
    }
  }

  return (
    <div style={{ position:'fixed', inset:0, zIndex:400, display:'flex', flexDirection:'column', background:'var(--bg)' }}>
      {/* Header */}
      <div style={{ display:'flex', alignItems:'center', gap:8, padding:'10px 12px', borderBottom:'1px solid var(--line)', flexShrink:0 }}>
        <button onClick={onCancel} style={{ background:'none', border:'none', color:'var(--muted)', fontSize:22, lineHeight:1, padding:4 }}>✕</button>
        <div style={{ flex:1, position:'relative' }}>
          <input
            type="text"
            placeholder="Search address or business…"
            value={query}
            onChange={e => handleQueryChange(e.target.value)}
            onFocus={() => { if (searchResults.length) setShowResults(true); }}
            style={{ width:'100%', padding:'9px 12px', borderRadius:8, border:'1px solid var(--line)',
              background:'var(--panel)', color:'var(--text)', fontSize:15, boxSizing:'border-box' }}
          />
          {searching && (
            <div style={{ position:'absolute', right:10, top:'50%', transform:'translateY(-50%)', color:'var(--muted)', fontSize:12 }}>…</div>
          )}
          {showResults && searchResults.length > 0 && (
            <div style={{ position:'absolute', top:'100%', left:0, right:0, zIndex:500,
              background:'var(--panel)', border:'1px solid var(--line)', borderRadius:8,
              boxShadow:'0 4px 16px rgba(0,0,0,0.5)', marginTop:4, maxHeight:260, overflowY:'auto' }}>
              {searchResults.map((sug, i) => {
                const pred = sug.placePrediction;
                const main = pred.mainText ? pred.mainText.text : pred.text.text;
                const secondary = pred.secondaryText ? pred.secondaryText.text : '';
                return (
                  <div key={pred.placeId || i} onClick={() => selectResult(pred)}
                    style={{ padding:'10px 14px', borderBottom: i < searchResults.length-1 ? '1px solid var(--line)' : 'none',
                      cursor:'pointer', lineHeight:1.3 }}>
                    <div style={{ fontWeight:700, fontSize:14, color:'var(--text)' }}>{main}</div>
                    {secondary && <div style={{ fontSize:12, color:'var(--muted)', marginTop:2 }}>{secondary}</div>}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>
      {/* Map */}
      <div style={{ flex:1, position:'relative', minHeight:0 }}>
        <div ref={mapDivRef} style={{ width:'100%', height:'100%' }} />
        <div style={{ position:'absolute', top:'50%', left:'50%',
          transform:'translate(-50%, -100%)', zIndex:1000, pointerEvents:'none',
          fontSize:36, lineHeight:1, filter:'drop-shadow(0 2px 4px rgba(0,0,0,0.6))' }}>
          📍
        </div>
        <div style={{ position:'absolute', bottom:8, left:'50%', transform:'translateX(-50%)',
          background:'rgba(0,0,0,0.55)', color:'#ccc', fontSize:11, padding:'4px 10px',
          borderRadius:20, pointerEvents:'none', whiteSpace:'nowrap' }}>
          DRAG MAP · PIN STAYS CENTERED
        </div>
      </div>
      {/* Footer */}
      <div style={{ display:'flex', gap:10, padding:'12px 16px', flexShrink:0, borderTop:'1px solid var(--line)' }}>
        <button onClick={confirm} disabled={geocoding} className="head"
          style={{ flex:1, padding:15, borderRadius:9, fontSize:16, fontWeight:700,
            background:'var(--olive-bright)', color:'var(--bg)',
            opacity: geocoding ? 0.6 : 1 }}>
          {geocoding ? 'LOCATING…' : 'USE THIS LOCATION'}
        </button>
        <button onClick={onCancel} className="head"
          style={{ padding:'15px 18px', borderRadius:9, fontSize:15,
            background:'var(--panel)', border:'1px solid var(--line)', color:'var(--text)' }}>
          CANCEL
        </button>
      </div>
    </div>
  );
}

/* ── JobForm ───────────────────────────────────────────────────────────────── */
function JobForm({ onSave, onCancel, initial, prefill, allJobs }) {
  const editing = !!(initial && initial.id);
  const customers = React.useMemo(() => deriveCustomers(allJobs||[]), [allJobs]);
  const [locating, setLocating] = useState(false);
  const [f, setF] = useState(initial ? {
    ...initial,
    customer_address: initial.customer_address||initial.address||"",
    site_address: initial.site_address||initial.address||"",
    same_address: initial.same_address !== undefined
      ? initial.same_address
      : ((initial.customer_address||initial.address||"") === (initial.site_address||initial.address||"")),
    value: initial.value===0||initial.value ? String(initial.value) : "",
  } : {
    customer:"", location:"", customer_address:"", site_address:"",
    same_address: loadSameAddrPref(),
    phone:"", email:"", type:"Service Call",
    status:"New", scheduled_date: todayISO(), scheduled_time: nowTimeRounded15(),
    value:"", original_ask:"", notes:"", history:[],
    ...(prefill || {}),
  });
  const set = (k,v) => setF(s => ({...s,[k]:v}));
  const [pendingLocation, setPendingLocation] = useState(null); // { field, addr, name }
  const [mapPicker, setMapPicker] = useState(null); // { field, lat, lng }

  async function useCurrentLocation(field) {
    if (!navigator.geolocation) { alert('Geolocation not supported by this browser.'); return; }
    setLocating(true);
    try {
      const pos = await new Promise((res, rej) =>
        navigator.geolocation.getCurrentPosition(res, rej, { timeout: 10000, enableHighAccuracy: true })
      );
      setMapPicker({ field, lat: pos.coords.latitude, lng: pos.coords.longitude });
    } catch(err) {
      alert(err.code === 1 ? 'Location permission denied — enable it in browser settings.' : 'Could not get location. Try again.');
    } finally {
      setLocating(false);
    }
  }

  function confirmLocation() {
    if (!pendingLocation) return;
    if (pendingLocation.field === 'customer_address') setCustomerAddr(pendingLocation.addr);
    else set('site_address', pendingLocation.addr);
    setPendingLocation(null);
  }

  const [showCustList, setShowCustList] = useState(false);
  const [pickedSites, setPickedSites] = useState(null);
  const [addingNewSite, setAddingNewSite] = useState(false);

  const custNames = Object.keys(customers);
  const typed = (f.customer||"").trim().toLowerCase();
  const matches = typed.length > 0
    ? custNames.filter(n => n.toLowerCase().includes(typed) && n.toLowerCase() !== typed)
    : [];

  function onCustomerType(v) { setF(s=>({...s,customer:v})); setShowCustList(true); setPickedSites(null); setAddingNewSite(false); }
  function pickCustomer(name) {
    const rec = customers[name]; setShowCustList(false);
    const hasSites = rec.sites && rec.sites.length > 0;
    setF(s => ({ ...s, customer:name, customer_address:rec.customer_address||"", phone:rec.phone||"", email:rec.email||"",
      same_address: hasSites ? false : s.same_address,
      location: hasSites ? "" : s.location,
      site_address: hasSites ? "" : (s.same_address ? rec.customer_address||"" : s.site_address) }));
    setPickedSites(hasSites ? rec.sites : null); setAddingNewSite(false);
  }
  function pickSite(site) { setF(s=>({...s,site_address:site.site_address,same_address:false})); setAddingNewSite(false); }
  function toggleSameAddr() {
    setF(s => { const next=!s.same_address; saveSameAddrPref(next);
      return next ? {...s,same_address:true,site_address:s.customer_address} : {...s,same_address:false}; });
  }
  function setCustomerAddr(v) { setF(s => s.same_address ? {...s,customer_address:v,site_address:v} : {...s,customer_address:v}); }

  const valid = f.customer.trim().length > 0;

  return (
    <div className="fade-in" style={{ paddingBottom:40 }}>
      <div style={{ padding:"16px", borderBottom:"1px solid var(--line)", background:"var(--panel)", display:"flex", alignItems:"center", gap:12 }}>

        <div className="head" style={{ fontSize:18, fontWeight:600 }}>{editing?"EDIT JOB":"NEW JOB"}</div>
      </div>
      <div style={{ padding:16, display:"flex", flexDirection:"column", gap:14 }}>
        <div style={{ position:"relative" }}>
          <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginBottom:6 }}>CUSTOMER</div>
          <input type="text" placeholder="Name or business" value={f.customer}
            onChange={e => editing ? set("customer",e.target.value) : onCustomerType(e.target.value)}
            onFocus={() => !editing && setShowCustList(true)} />
          {!editing && showCustList && matches.length > 0 && (
            <div className="fade-in" style={{ position:"absolute", top:"100%", left:0, right:0, zIndex:20,
              background:"var(--panel-2)", border:"1px solid var(--olive)", borderRadius:8, marginTop:4, overflow:"hidden" }}>
              {matches.slice(0,6).map(name => (
                <button key={name} onClick={() => pickCustomer(name)}
                  style={{ display:"block", width:"100%", textAlign:"left", padding:"12px 14px", borderBottom:"1px solid var(--line)" }}>
                  <span className="head" style={{ fontSize:15, fontWeight:600 }}>{name}</span>
                  {customers[name].sites.length > 0 && (
                    <span className="mono" style={{ fontSize:11, color:"var(--brass)", marginLeft:8 }}>
                      {customers[name].sites.length} site{customers[name].sites.length>1?"s":""}
                    </span>
                  )}
                </button>
              ))}
            </div>
          )}
        </div>
        <div>
          <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginBottom:6 }}>CUSTOMER ADDRESS</div>
          <div style={{ display:"flex", gap:8 }}>
            <input type="text" placeholder="Main / billing address"
              value={f.customer_address} onChange={e => setCustomerAddr(e.target.value)}
              style={{ flex:1, minWidth:0 }} />
            {!f.customer_address.trim() && (
            <button type="button" onClick={() => useCurrentLocation('customer_address')} disabled={locating}
              title="Use my current location"
              style={{ flexShrink:0, width:44, borderRadius:8, border:"1px solid var(--brass)",
                background:"var(--panel)", color:locating?"var(--muted)":"var(--brass-bright)",
                fontSize:20, cursor:locating?"default":"pointer" }}>
              {locating ? '⏳' : '📍'}
            </button>

          </div>
        </div>
        <div>
          <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginBottom:6 }}>PHONE</div>
          <input type="tel" placeholder="(610) 555-0000" value={f.phone} onChange={e => set("phone",e.target.value)} />

        <div>
          <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginBottom:6 }}>EMAIL</div>

            background: f.same_address ? "var(--olive-bright)" : "var(--line)", transition:"background 0.15s" }}>
            <span style={{ position:"absolute", top:3, left: f.same_address ? 21 : 3,
              width:20, height:20, borderRadius:"50%", background:"var(--bg)", transition:"left 0.15s" }}></span>
          </span>
          <span style={{ fontSize:14, color:"var(--text)" }}>Site same as customer address</span>
        </button>
        {!f.same_address && (
          <div className="fade-in" style={{ display:"flex", flexDirection:"column", gap:14 }}>
            {!editing && pickedSites && pickedSites.length>0 && !addingNewSite && (
              <div style={{ padding:12, background:"var(--panel-2)", border:"1px solid var(--brass)", borderRadius:10 }}>
                <div className="mono" style={{ fontSize:11, color:"var(--brass-bright)", marginBottom:8, letterSpacing:"0.08em" }}>SAVED SITES FOR THIS CUSTOMER</div>

                        {site.site_address} {chosen?"✓":""}

                <button onClick={() => { setAddingNewSite(true); setF(s=>({...s,site_address:""})); }}

            <div>

              <div style={{ display:"flex", gap:8 }}>

                  style={{ flex:1, minWidth:0 }} />
                {!f.site_address.trim() && (
                <button type="button" onClick={() => useCurrentLocation('site_address')} disabled={locating}
                  title="Use my current location"
                  style={{ flexShrink:0, width:44, borderRadius:8, border:"1px solid var(--brass)",
                    background:"var(--panel)", color:locating?"var(--muted)":"var(--brass-bright)",
                    fontSize:20, cursor:locating?"default":"pointer" }}>
                  {locating ? '⏳' : '📍'}
                </button>
                )}
              </div>
            </div>
          </div>
        )}
        <div>
          <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginBottom:6 }}>JOB TYPE</div>
          <select value={f.type} onChange={e => set("type",e.target.value)}>
            {JOB_TYPES.map(t => <option key={t}>{t}</option>)}

        </div>
        <div style={{ display:"flex", gap:10 }}>
          <div style={{ flex:1 }}>

            <input type="date" value={f.scheduled_date} onChange={e => set("scheduled_date",e.target.value)} />

          <div style={{ flex:1 }}>
            <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginBottom:6 }}>TIME</div>
            <input type="time" value={f.scheduled_time} onChange={e => set("scheduled_time",e.target.value)} />

        </div>
        <div>
          <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginBottom:6 }}>STATUS</div>
          <select value={f.status} onChange={e => set("status",e.target.value)}>

          <input type="number" inputMode="decimal" placeholder="0" value={f.value} onChange={e => set("value",e.target.value)} />
        </div>
        <div>
          <div className="mono" style={{ fontSize:13, color:"var(--muted)", marginBottom:6 }}>ORIGINAL ASK</div>
          <textarea rows={2} placeholder="What did the customer ask for?" value={f.original_ask} onChange={e => set("original_ask",e.target.value)} style={{ resize:"vertical", lineHeight:1.4 }} />

        <div>
          <div className="mono" style={{ fontSize:13, color:"var(--muted)", marginBottom:6 }}>NOTES</div>

        <button onClick={() => {

            onSave({ ...f, site_address:site, address:site, value:Number(f.value)||0 });
          }}

          style={{ marginTop:6, padding:16, borderRadius:10, fontSize:16, fontWeight:700,
            background:valid?"var(--olive-bright)":"var(--line)", color:valid?"var(--bg)":"var(--muted)" }}>
          {editing?"SAVE CHANGES":"SAVE JOB"}
        </button>
      </div>

      {mapPicker && (
        <LocationPickerSheet
          lat={mapPicker.lat} lng={mapPicker.lng}
          onConfirm={({ addr, name }) => { setMapPicker(null); setPendingLocation({ field: mapPicker.field, addr, name }); }}

      {pendingLocation && (
        <div onClick={() => setPendingLocation(null)}
          style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.7)", zIndex:300, display:"flex", alignItems:"flex-end", justifyContent:"center" }}>

              <div style={{ fontSize:18, fontWeight:600, marginBottom:4 }}>{pendingLocation.name}</div>

            <div style={{ display:"flex", gap:10 }}>

              <button onClick={() => setPendingLocation(null)} className="head"
                style={{ padding:"15px 18px", borderRadius:9, fontSize:15, background:"var(--panel)", border:"1px solid var(--line)", color:"var(--text)" }}>

        </div>
      )}
    </div>
  );
}

/* ── VoiceButton ───────────────────────────────────────────────────────────── */
function VoiceButton({ onCommand }) {
  const [state, setState] = useState('idle'); // idle | listening | processing
  const [pos, setPos] = useState(() => {
    try { const s = localStorage.getItem('tmc_mic_pos'); if (s) return JSON.parse(s); } catch(e){}
    return { x: window.innerWidth - 76, y: window.innerHeight - 180 };
  });
  const drag = useRef(null);
  const recognitionRef = useRef(null);
  const stateRef = useRef('idle');

  function setS(s) { stateRef.current = s; setState(s); }

  function spawnRec() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return null;
    const rec = new SR();
    rec.lang = 'en-US';
    rec.continuous = false;
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    rec.onresult = async (e) => {
      const transcript = e.results[0][0].transcript;
      recognitionRef.current = null;
      setS('processing');
      await onCommand(transcript);
      if (stateRef.current === 'processing') {
        setS('listening');
        const next = spawnRec();
        if (next) { recognitionRef.current = next; try { next.start(); } catch(err) { setS('idle'); } }
      }
    };
    rec.onerror = (e) => {
      if (e.error === 'aborted') return;
      if (e.error === 'no-speech' && stateRef.current === 'listening') {
        const next = spawnRec();
        if (next) { recognitionRef.current = next; try { next.start(); } catch(err) { setS('idle'); } }
      } else {
        setS('idle');
      }
    };
    rec.onend = () => {
      if (stateRef.current === 'listening') {
        const next = spawnRec();
        if (next) { recognitionRef.current = next; try { next.start(); } catch(err) { setS('idle'); } }
      }
    };
    return rec;
  }

  function startListening() {
    if (stateRef.current !== 'idle') return;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert('Speech recognition not supported in this browser. Try Chrome.'); return; }
    setS('listening');
    const rec = spawnRec();
    if (rec) { recognitionRef.current = rec; try { rec.start(); } catch(err) { setS('idle'); } }
  }

  function stopListening() {
    setS('idle');
    if (recognitionRef.current) { try { recognitionRef.current.abort(); } catch(e){} recognitionRef.current = null; }
  }

  function toggle() {
    if (stateRef.current === 'idle') startListening();
    else stopListening();
  }

  function onTouchStart(e) {
    drag.current = {
      sx: e.touches[0].clientX, sy: e.touches[0].clientY,
      px: pos.x, py: pos.y, moved: false,
    };
  }
  function onTouchMove(e) {
    if (!drag.current) return;
    const dx = e.touches[0].clientX - drag.current.sx;
    const dy = e.touches[0].clientY - drag.current.sy;
    if (Math.abs(dx) > 6 || Math.abs(dy) > 6) drag.current.moved = true;
    if (!drag.current.moved) return;
    e.preventDefault();
    const nx = Math.max(20, Math.min(window.innerWidth - 64, drag.current.px + dx));
    const ny = Math.max(60, Math.min(window.innerHeight - 64, drag.current.py + dy));
    setPos({ x: nx, y: ny });
  }
  function onTouchEnd() {
    if (!drag.current) return;
    if (!drag.current.moved) toggle();
    else { try { localStorage.setItem('tmc_mic_pos', JSON.stringify(pos)); } catch(e){} }
    drag.current = null;
  }

  const bg = state === 'listening' ? '#b5432f' : state === 'processing' ? '#b8923f' : 'var(--olive-bright)';
  const icon = state === 'processing' ? '⏳' : state === 'listening' ? '⏹' : '🎙';

  return (
    <div
      onTouchStart={onTouchStart}
      onTouchMove={onTouchMove}
      onTouchEnd={onTouchEnd}
      onClick={() => { if (!('ontouchstart' in window)) toggle(); }}
      style={{
        position:'fixed', left:pos.x, top:pos.y, width:56, height:56,
        borderRadius:'50%', background:bg, display:'flex', alignItems:'center',
        justifyContent:'center', fontSize:22, cursor:'pointer', zIndex:999,
        boxShadow:'0 3px 14px rgba(0,0,0,0.5)', userSelect:'none', touchAction:'none',
        animation: state === 'listening' ? 'micPulse 1.2s ease-out infinite' : 'none',
        transition: state === 'idle' ? 'background 0.2s' : 'none',
      }}
    >
      {icon}
    </div>
  );
}

/* ── Sheet ─────────────────────────────────────────────────────────────────── */
function WarrantySheet({ eq, job, onRegistered, onClose }) {
  const [copied, setCopied] = useState(false);
  const [marking, setMarking] = useState(false);
  const ws = warrantyStatus(eq);

  const installDisplay = eq.install_date ? fmtDate(eq.install_date) : '—';
  const lines = [
    `CUSTOMER: ${job.customer}`,
    `ADDRESS: ${siteAddr(job) || custAddr(job) || ''}`,
    `PHONE: ${job.phone || ''}`,
    ``,
    `EQUIPMENT: ${eq.label}`,
    `BRAND: ${eq.brand || ''}`,
    `MODEL #: ${eq.model_number || ''}`,
    `SERIAL #: ${eq.serial_number || ''}`,
    `INSTALL DATE: ${installDisplay}`,
  ].join('\n');

  function copyAll() {
    navigator.clipboard.writeText(lines).catch(() => {});
    setCopied(true);
    setTimeout(() => setCopied(false), 2500);
  }

  async function markRegistered() {
    setMarking(true);
    const today = todayISO();
    const err = await updateEquipment(eq.id, { warranty_registered: true, warranty_registered_date: today });
    setMarking(false);
    if (err) { alert(`Failed: ${err.message}`); return; }
    onRegistered({ ...eq, warranty_registered: true, warranty_registered_date: today });
    onClose();
  }

  const bannerColor = ws.type === 'urgent' ? '#b8923f' : ws.type === 'lapsed' ? 'var(--danger)' : ws.type === 'registered' ? 'var(--green)' : 'var(--muted)';
  const bannerText = ws.type === 'registered'
    ? `✓ Registered${ws.expires ? ' · expires ' + fmtDate(ws.expires) : ''}`
    : ws.type === 'urgent' ? `⚠ ${ws.daysLeft} days left — register by ${fmtDate(ws.deadline)}`
    : ws.type === 'lapsed' ? `⚠ 60-day window closed — standard 10yr warranty applies`
    : ws.type === 'pending' ? `📋 ${ws.daysLeft} days left to register for 12yr warranty`
    : `📋 Register to lock in 12yr warranty`;

  return (
    <Sheet onClose={onClose} title="REGISTER WARRANTY">
      {/* countdown banner */}
      <div className="mono" style={{ fontSize:12, color: bannerColor, padding:"8px 10px", borderRadius:6, background:"rgba(255,255,255,0.04)", marginBottom:14 }}>
        {bannerText}
      </div>

      {/* data block */}
      <div style={{ background:"var(--bg)", borderRadius:8, padding:12, marginBottom:12, border:"1px solid var(--line)" }}>
        {[
          ['CUSTOMER', job.customer],
          ['ADDRESS', siteAddr(job) || custAddr(job)],
          ['PHONE', job.phone],
          ['EQUIPMENT', eq.label],
          ['BRAND', eq.brand],
          ['MODEL #', eq.model_number],
          ['SERIAL #', eq.serial_number],
          ['INSTALL DATE', installDisplay],
        ].filter(([,v]) => v).map(([k,v]) => (
          <div key={k} style={{ display:"flex", gap:8, marginBottom:5 }}>
            <span className="mono" style={{ fontSize:11, color:"var(--muted)", minWidth:90, flexShrink:0 }}>{k}</span>
            <span style={{ fontSize:13, wordBreak:"break-all" }}>{v}</span>
          </div>
        ))}
      </div>

      <button onClick={copyAll} className="head"
        style={{ width:"100%", padding:"11px", borderRadius:8, fontSize:14, fontWeight:700, marginBottom:10,
          background: copied ? 'var(--green)' : 'var(--panel)', border:`1px solid ${copied ? '#6fa33d' : 'var(--line)'}`, color: copied ? '#fff' : 'var(--text)' }}>
        {copied ? '✓ COPIED TO CLIPBOARD' : '📋 COPY ALL'}
      </button>

      <a href="https://my.daikincomfort.com/product-registration" target="_blank" rel="noreferrer"
        style={{ display:"block", width:"100%", padding:"11px", borderRadius:8, fontSize:14, fontWeight:700, marginBottom:10,
          background:"var(--olive-bright)", color:"var(--bg)", textAlign:"center", textDecoration:"none", boxSizing:"border-box" }}
        className="head">
        🌐 OPEN DAIKIN REGISTRATION →
      </a>

      {!eq.warranty_registered && (
        <button onClick={markRegistered} disabled={marking} className="head"
          style={{ width:"100%", padding:"11px", borderRadius:8, fontSize:14, fontWeight:600,
            background:"transparent", border:"1px solid var(--green)", color:"var(--green)", opacity: marking ? 0.6 : 1 }}>
          {marking ? 'SAVING…' : '✓ MARK AS REGISTERED'}
        </button>
      )}
    </Sheet>
  );
}

/* ── EquipEditSheet ─────────────────────────────────────────────────────────── */
function EquipEditSheet({ eq, onSave, onClose }) {
  const [label, setLabel] = useState(eq.label || '');
  const [fields, setFields] = useState(() => {
    const f = {};
    EQUIP_KEYS.forEach(k => { f[k] = eq[k] || ''; });
    return f;
  });
  const [installDate, setInstallDate] = useState(eq.install_date || '');
  const [warrantyReg, setWarrantyReg] = useState(!!eq.warranty_registered);
  const [saving, setSaving] = useState(false);

  async function doSave() {
    if (!label.trim()) return;
    setSaving(true);
    const updates = { label: label.trim(), install_date: installDate || null, warranty_registered: warrantyReg };
    if (!warrantyReg) updates.warranty_registered_date = null;
    EQUIP_KEYS.forEach(k => { updates[k] = fields[k] || null; });
    const error = await updateEquipment(eq.id, updates);
    setSaving(false);
    if (error) { alert('Save failed: ' + error.message); return; }
    onSave({ ...eq, ...updates });
  }

  return (
    <Sheet title="EDIT EQUIPMENT" onClose={onClose}>
      <div className="mono" style={{ fontSize:11, color:"var(--muted)", marginBottom:6, marginTop:4 }}>LABEL / LOCATION</div>
      <input value={label} onChange={e => setLabel(e.target.value)} placeholder="e.g. Living Room, Outdoor Unit" />
      {EQUIP_FIELDS.map(f => (
        <div key={f.key}>
          <div className="mono" style={{ fontSize:11, color:"var(--muted)", margin:"12px 0 6px" }}>{f.label}</div>
          <input value={fields[f.key] || ''} onChange={e => setFields(s => ({...s,[f.key]:e.target.value}))} />
        </div>
      ))}
      <div className="mono" style={{ fontSize:11, color:"var(--muted)", margin:"12px 0 6px" }}>INSTALL DATE</div>
      <input type="date" value={installDate} onChange={e => setInstallDate(e.target.value)} />
      <div style={{ display:"flex", alignItems:"center", gap:12, marginTop:16, padding:12, background:"var(--panel)", borderRadius:8, border:"1px solid var(--line)" }}>
        <input type="checkbox" id="edit-wreg" checked={warrantyReg} onChange={e => setWarrantyReg(e.target.checked)}
          style={{ width:20, height:20, accentColor:"var(--green)", cursor:"pointer" }} />
        <label htmlFor="edit-wreg" className="mono"
          style={{ fontSize:13, color: warrantyReg ? "var(--green)" : "var(--muted)", cursor:"pointer" }}>
          {warrantyReg ? '✓ WARRANTY REGISTERED' : 'WARRANTY NOT REGISTERED'}
        </label>
      </div>
      <button onClick={doSave} disabled={saving} className="head"
        style={{ width:"100%", marginTop:18, padding:15, borderRadius:9, fontSize:16, fontWeight:700,
          background: saving ? "var(--muted)" : "var(--olive-bright)", color:"var(--bg)" }}>
        {saving ? 'SAVING…' : 'SAVE CHANGES'}
      </button>
    </Sheet>
  );
}

function Sheet({ title, onClose, children }) {
  return (
    <div onClick={onClose} style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.6)", zIndex:50, display:"flex", alignItems:"flex-end", justifyContent:"center" }}>
      <div onClick={e => e.stopPropagation()} className="fade-in"
        style={{ width:"100%", maxWidth:520, background:"var(--panel-2)", borderTop:"2px solid var(--olive)",
          borderRadius:"16px 16px 0 0", padding:"18px 16px 28px", maxHeight:"80vh", overflowY:"auto" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
          <div className="head" style={{ fontSize:16, fontWeight:700 }}>{title}</div>
          <button onClick={onClose} className="mono" style={{ color:"var(--muted)", fontSize:18 }}>✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
(function() {
  var el = document.getElementById('app-script');
  if (!el) return;
  try {
    var result = Babel.transform(el.textContent, {
      presets: [['react', { runtime: 'classic' }]]
    });
    var s = document.createElement('script');
    s.textContent = result.code;
    document.head.appendChild(s);
  } catch(e) {
    var pre = document.getElementById('pre-react');
    if (pre) pre.innerHTML = '<div style="color:#f87171;padding:20px;font-family:monospace;font-size:13px"><b>BABEL ERROR — screenshot this</b><br><br>' + String(e) + '</div>';
  }
})();
</script>
</body>
</html>
