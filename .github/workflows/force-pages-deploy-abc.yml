name: Force deploy ABC branded demo to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/force-pages-deploy-abc.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare pages output
        run: |
          mkdir -p dist
          cp claudia.html dist/index.html
          rm .github/workflows/force-pages-deploy-abc.yml

      - name: Deploy renamed demo to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

      - name: Remove one-time workflow from main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes"
          else
            git commit -m "Remove one-time ABC Pages deploy workflow"
            git push
          fi
